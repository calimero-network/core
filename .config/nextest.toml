# cargo-nextest settings, read by every `cargo nextest run` in this workspace.
#
# CI runs a shard with more test threads than the runner has cores
# (NEXTEST_TEST_THREADS in ci-checks.yml), because most slow tests wait on timers
# and the network. The node's integration tests do not: each starts a cluster of
# debug-built nodes (and job_runs a job node too), and eight of them at once on
# four cores miss their own deadlines (`503 TIMEOUT` on an app call, a sealed
# request that times out). Each takes more than one thread's slot instead, so
# fewer of them run at once while the light tests fill the rest. The first
# override that matches a test applies.

[[profile.default.overrides]]
# Cluster plus job node, and multi-MiB sealed inputs written through an app.
filter = 'package(calimero-node) & binary(job_runs)'
threads-required = 4

[[profile.default.overrides]]
# An in-process cluster per test: two at once, light tests in the slots left.
filter = 'package(calimero-node) & kind(test)'
threads-required = 3

# CI's profile (`NEXTEST_PROFILE=ci`, ci-checks.yml): no test may run past 15 s.
#
# A test still running at 15 s is reported SLOW; at 30 s (two periods) it is killed and
# fails, the second period being room for a loaded shared runner. Compiling a test app is
# not a test's time: CI builds every guest before the tests run
# (`cargo run -p calimero-app-build --example build-test-apps`).
#
# The overrides below are the tests over 15 s when this rule came in (CI's timings,
# 2026-11-13), each binary's kill time about 1.5 times its slowest test there. They are a
# list to empty, never to add to: make a test fast (shorter test limits instead of the
# production ones, polling instead of a fixed sleep, smaller files, a matrix split into
# tests), then drop its name. A local run keeps the default profile, which kills nothing.
[profile.ci]
slow-timeout = { period = "15s", terminate-after = 2 }

[[profile.ci.overrides]]
# Tests the guest builder itself, which builds on purpose: the cache test needs an empty
# cache, so it compiles the SDK and its dependencies from nothing, and on a shared runner that
# took past 120 s (two of these were killed there).
filter = 'package(calimero-app-build)'
slow-timeout = { period = "15s", terminate-after = 20 }

