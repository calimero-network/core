[profile.dev]
panic = "unwind"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "unwind"

[profile.app-release]
inherits = "release"
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = true

[profile.profiling]
inherits = "release"
opt-level = 2
debug = true
strip = false
lto = false
codegen-units = 1

# Profile for WASM apps with profiling support
[profile.app-profiling]
inherits = "release"
codegen-units = 1
opt-level = 2
lto = true
debug = true
strip = false
panic = "abort"
overflow-checks = true
