[workspace.package]
version = "0.0.0" # managed by cargo-workspaces; see docs/RELEASE.md
authors = ["Calimero Limited <info@calimero.network>"]
edition = "2021"
repository = "https://github.com/calimero-network/core"
license = "MIT OR Apache-2.0"
description = "Core Calimero infrastructure and tools"

# Update workspace metadata (see docs/RELEASE.md for versioning and release)
[workspace.metadata.workspaces]
# Shared version of all public crates; bump this when cutting a release.
version = "1.0.0-rc.15"
exclude = [
    "./crates/git-hooks",
    "./crates/build-utils",
]

[workspace]
resolver = "2"
members = [
    "./crates/app-downloader",
    "./crates/app-build",
    "./crates/app-engine-wasmtime",
    "./crates/app-abi",
    "./crates/app-host",
    "./crates/app-sdk",
    "./crates/sdk",
    "./crates/sdk-macros",
    "./crates/app-wit",
    "./crates/build-utils",
    "./crates/bundle",
    "./crates/git-hooks",
    "./crates/primitives",
    "./crates/search",
    "./crates/tee-attestation",
    "./crates/tee-release",
    "./crates/log",
    "./crates/sealed",
    "./crates/identity",
    "./crates/node",
    "./crates/outbound",
    "./crates/pipeline",
    "./crates/kms-client",
    "./crates/client",
    "./crates/merod",
    "./crates/meroctl",

    "./crates/utils/fs",

    "./tools/client-gen",
    "./tools/mero-compute",
    "./tools/mero-sign",
    "./tools/search-bench",
]

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.23.1"
borsh = "1.3.1"
bs58 = "0.5.0"
bytes = "1.11.1"
camino = "1.1.6"
chrono = "0.4.37"
ciborium = "0.2.2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
clap = "4.4.18"
configfs-tsm = "0.0.2"
curve25519-dalek = "5"
dcap-qvl = "0.5"
dirs = "7.0.0"
ed25519-dalek = "3"
eyre = "0.6.12"
flate2 = "1.0"
futures-util = "0.3.30"
hex = "0.4.3"
html5ever = "0.40"
http = "1"
indexmap = "2.6.0"
libc = "0.2"
libp2p-identity = "0.2.12"
multiaddr = "0.18.1"
proc-macro-crate = "3.4"
proc-macro2 = "1.0"
proptest = "1.12.0"
quote = "1.0.37"
rand = "0.10"
rand_chacha = "0.10.0"
rcgen = "0.13.2"
reqwest = { version = "0.12.2", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17.8"
rocksdb = { version = "0.25.0", default-features = false, features = ["bindgen-runtime", "lz4", "zstd"] }
rustc_version = "0.4"
semver = "1.0.22"
serde = "1.0.196"
serde_json = "1.0.113"
serde_norway = "0.9.42"
serde_path_to_error = "0.1.20"
serde_json_canonicalizer = "0.4.1"
sha2 = "0.11"
snow = { version = "0.9.6", default-features = false }
subtle = "2.6.1"
syn = { version = "3.0", features = ["full"] }
tantivy = { version = "0.27.0", default-features = false, features = ["lz4-compression"] }
tar = "0.4"
tempfile = "3.10"
windows-sys = "0.61"
tdx-quote = "0.0.5"
tdx_workload_attestation = "0.2.0"
thiserror = "2.0.20"
tokio = "1.47.1"
tokio-rustls = { version = "0.26.4", default-features = false }
tokio-stream = "0.1.17"
tokio-util = "0.7.11"
toml = "1.1"
tower = "0.5.3"
tower-http = "0.7.0"
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
trybuild = "1.0"
unicode-normalization = "0.1.24"
unicode-segmentation = "1.12.0"
url = "2.5.2"
wasmtime = { version = "50.0.0", default-features = false }
wasmtime-wasi = { version = "50.0.0", default-features = false }
wasmparser = "0.263"
wat = "1.243.0"
wit-bindgen = "0.63.0"
wit-parser = "0.263.0"
zeroize = "1.8"


calimero-app-downloader = { path = "./crates/app-downloader" }
calimero-app-wit = { path = "./crates/app-wit" }
calimero-app-build = { path = "./crates/app-build" }
calimero-app-engine-wasmtime = { path = "./crates/app-engine-wasmtime" }
calimero-app-abi = { path = "./crates/app-abi" }
calimero-app-host = { path = "./crates/app-host" }
calimero-app-sdk = { path = "./crates/app-sdk" }
calimero-sdk = { path = "./crates/sdk" }
calimero-sdk-macros = { path = "./crates/sdk-macros" }
calimero-build-utils = { path = "./crates/build-utils" }
calimero-bundle = { path = "./crates/bundle" }
calimero-outbound = { path = "./crates/outbound" }
calimero-pipeline = { path = "./crates/pipeline" }
calimero-primitives = { path = "./crates/primitives" }
calimero-log = { path = "./crates/log" }
calimero-sealed = { path = "./crates/sealed" }
calimero-identity = { path = "./crates/identity" }
calimero-node = { path = "./crates/node" }
calimero-kms-client = { path = "./crates/kms-client" }
calimero-client = { path = "./crates/client" }
calimero-search = { path = "./crates/search" }
calimero-tee-attestation = { path = "./crates/tee-attestation" }
calimero-tee-release = { path = "./crates/tee-release" }
calimero-utils-fs = { path = "./crates/utils/fs" }
mero-sign = { path = "./tools/mero-sign" }

[profile.dev]
panic = "unwind"

# Cranelift compiles every component wasmtime loads, and nextest runs each test in
# its own process, so every test that starts an app compiles it again: at -O0 a
# compile takes about ten times as long. Building these crates optimized costs
# some seconds, paid only when the rust cache misses. The machine code they emit
# for a guest is the same at either level.
[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

# Every password login and provisioning runs a full PBKDF2 hash in ring; built
# optimized, the auth tests hash at release speed.
[profile.dev.package.ring]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "unwind"

[profile.profiling]
inherits = "release"
opt-level = 2
debug = true
strip = false
lto = false
codegen-units = 1
