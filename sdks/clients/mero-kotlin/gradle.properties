org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Publishing coordinates. VERSION_NAME is core's version (the root VERSION of
# calimero-network/core), written by `python3 scripts/sdks.py version-sync`; never bump it alone.
#
# `network.calimero`, not `com.calimero.*`: Maven Central makes you prove you own the
# namespace, and `com.calimero` would mean owning calimero.com. This is the reverse-DNS
# of calimero.network, verified with a TXT record on a domain we do own. Settled before
# the first public release on purpose — moving coordinates afterwards breaks consumers.
GROUP=network.calimero
VERSION_NAME=1.0.0-rc.35