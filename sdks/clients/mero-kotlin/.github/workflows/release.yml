name: Release

# Tag-driven release. release-on-merge.yml pushes the tag (`v0.4.0`) on every merge to main
# that calls for a release (semantic-release, as the JS repos do), and creates the GitHub
# Release with its notes; this workflow then publishes
# `network.calimero:{mero-core,mero-compose}:0.4.0` to GitHub Packages and Maven Central. A
# tag pushed by hand still works: the GitHub Release is created here when there is none.
#
# Central is the public target: it resolves through the `mavenCentral()` every Android
# project already declares, with no token on the consumer side. GitHub Packages stays
# because it needs no signing key and no Portal account, which makes it the right place
# for a pre-release or an internal build.
#
# Required secrets for the Central step:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  a Central Portal user token
#   SIGNING_KEY                                      ASCII-armored GPG private key
#   SIGNING_PASSWORD                                 its passphrase ('' if none)
# Without them the Central step is skipped with a warning; GitHub Packages and the
# GitHub Release still go out.
#
# Three jobs, so each credential reaches only the steps that need it:
#   packages  GITHUB_TOKEN with packages: write; no release secrets.
#   central   the signing key and the Central token; read-only GITHUB_TOKEN, and no
#             third-party action at all (setup-gradle's init script would otherwise run
#             inside the Gradle build that holds the key). It runs in the
#             `maven-central` environment, so required reviewers or a tag rule can be
#             set on it in the repo settings, and the secrets can move there.
#   release   GITHUB_TOKEN with contents: write, to cut the GitHub Release when
#             release-on-merge did not, and nothing else.
# They run in that order and stop at the first failure, as the single job did.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # publish to GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle cache in a release: a cache written by another run must not feed
      # the artifacts that get published (zizmor: cache-poisoning).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -PVERSION_NAME="${GITHUB_REF_NAME#v}" --stacktrace

  # Uploaded as ONE bundle and published by the Portal once it validates
  # (publishingType AUTOMATIC): no click. A Central version can never be replaced or
  # deleted, so a tag that reaches this job is a permanent release.
  # Skipped, with a warning, until the Central secrets exist: a missing signing key
  # must not stop the GitHub Packages build from getting its GitHub Release.
  central:
    name: Publish to Maven Central
    needs: packages
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: read
    steps:
      - name: Check for Maven Central credentials
        id: central
        env:
          HAS_CENTRAL: ${{ secrets.MAVEN_CENTRAL_USERNAME != '' && secrets.SIGNING_KEY != '' }}
        run: |
          echo "enabled=${HAS_CENTRAL}" >> "$GITHUB_OUTPUT"
          if [ "${HAS_CENTRAL}" != "true" ]; then
            echo "::warning::MAVEN_CENTRAL_USERNAME / SIGNING_KEY are not set; skipping Maven Central. GitHub Packages has the release."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.central.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: steps.central.outputs.enabled == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Plain ./gradlew: the wrapper checks the distribution against
      # distributionSha256Sum, and every dependency is checked against
      # gradle/verification-metadata.xml.
      - name: Publish to Maven Central
        if: steps.central.outputs.enabled == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew nmcpPublishAggregationToCentralPortal -PVERSION_NAME="${GITHUB_REF_NAME#v}" --stacktrace

  release:
    name: Create GitHub Release
    needs: [packages, central]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # release-on-merge.yml creates it with semantic-release's notes; a tag pushed
          # by hand gets one here.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::the GitHub Release for ${GITHUB_REF_NAME} exists already"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
