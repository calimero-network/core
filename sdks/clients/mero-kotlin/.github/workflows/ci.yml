name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The generated client and facade (mero-core/src/generated) must be what the vendored
      # openapi/openapi.json and the pinned generator produce: no hand edits, no stale spec.
      - name: Generated OpenAPI client is current
        run: scripts/refresh-openapi.sh --check

      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble
        run: ./gradlew assembleDebug --stacktrace

      # Nothing else exercises the publishing wiring until a tag is pushed, which is
      # the worst moment to find out it is broken: a Central version can never be
      # re-published. This builds the real bundle and runs nmcp's own validation
      # against Central's rules — coordinates, javadoc jar, signatures, checksums —
      # with a throwaway key and no credentials, so a broken release config fails on
      # the pull request instead.
      - name: Release bundle is well-formed (no credentials needed)
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          cat > "$GNUPGHOME/params" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Name-Real: CI Bundle Check
          Name-Email: ci@example.invalid
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --pinentry-mode loopback --gen-key "$GNUPGHOME/params"
          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --armor --export-secret-keys ci@example.invalid)" \
            ./gradlew nmcpZipAggregation -PVERSION_NAME=0.0.0-ci --stacktrace
          unzip -l build/nmcp/zip/aggregation.zip

      # The instrumented suites don't run here (no emulator on this job), but they
      # must at least compile — otherwise a UI rename silently rots the e2e tests
      # until the nightly emulator job runs.
      - name: Compile instrumented tests
        run: ./gradlew :sample-app:assembleDebugAndroidTest --stacktrace

      # Guard the SDK↔sample parity this repo is built on: every public SDK method
      # should be reachable from the sample app's operation registry.
      - name: SDK surface / registry parity
        run: ./ci/check-registry-parity.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
