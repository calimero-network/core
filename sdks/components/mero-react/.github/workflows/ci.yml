name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify build artifacts
        run: node -e "const fs = require('fs'); for (const entry of Object.values(require('./package.json').exports)) for (const file of Object.values(entry)) fs.accessSync(file)"
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: bash .github/scripts/tests/bump-fleet.test.sh
      - run: bash .github/scripts/tests/wait-for-npm.test.sh
