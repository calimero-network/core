[package]
name = "calimero-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Shared dependencies resolve to the root Cargo.lock, which scripts/fuzz.sh copies in.
[dependencies]
borsh = "*"
axum = "*"
calimero-bundle = { path = "../crates/bundle" }
calimero-identity = { path = "../crates/identity", features = ["testing"] }
calimero-sealed = { path = "../crates/sealed" }
calimero-storage = { path = "../crates/storage", features = ["testing"] }
calimero-tee-attestation = { path = "../crates/tee-attestation" }
eyre = "*"
flate2 = "*"
hex = "*"
libfuzzer-sys = "0.4"
mero-sign = { path = "../tools/mero-sign" }
semver = "*"
serde_json = "*"
sha2 = "*"
tar = "*"
tokio = { version = "*", features = ["rt"] }
tower = { version = "*", features = ["util"] }

[[bin]]
name = "bundle_open"
path = "fuzz_targets/bundle_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crdt_sync"
path = "fuzz_targets/crdt_sync.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sealed_request"
path = "fuzz_targets/sealed_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "passkey_verify"
path = "fuzz_targets/passkey_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_token"
path = "fuzz_targets/session_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "quote_parse"
path = "fuzz_targets/quote_parse.rs"
test = false
doc = false
bench = false

[workspace]
