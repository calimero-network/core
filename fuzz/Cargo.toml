[package]
name = "calimero-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Shared dependencies resolve to the root Cargo.lock, which scripts/fuzz.sh copies in.
[dependencies]
borsh = "*"
calimero-account = { path = "../crates/account" }
calimero-context-config = { path = "../crates/context/config" }
calimero-governance-store = { path = "../crates/governance-store", features = ["testing"] }
calimero-governance-types = { path = "../crates/governance-types" }
calimero-network = { path = "../crates/network" }
calimero-network-primitives = { path = "../crates/network/primitives" }
calimero-node-primitives = { path = "../crates/node/primitives" }
calimero-primitives = { path = "../crates/primitives", features = ["borsh"] }
calimero-storage = { path = "../crates/storage", features = ["testing"] }
calimero-store = { path = "../crates/store" }
eyre = "*"
flate2 = "*"
hex = "*"
libfuzzer-sys = "0.4"
libp2p = { version = "*", features = ["ed25519"] }
mero-sign = { path = "../tools/mero-sign" }
serde_json = "*"
sha2 = "*"
tar = "*"

[[bin]]
name = "bundle_open"
path = "fuzz_targets/bundle_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crdt_sync"
path = "fuzz_targets/crdt_sync.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_decode"
path = "fuzz_targets/wire_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "provider_record"
path = "fuzz_targets/provider_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "governance_apply"
path = "fuzz_targets/governance_apply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_ops"
path = "fuzz_targets/signed_ops.rs"
test = false
doc = false
bench = false

[workspace]
