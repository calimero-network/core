[package]
name = "calimero-node-primitives"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = true

[dependencies]
actix.workspace = true
calimero-account.workspace = true
calimero-bundle.workspace = true
async-stream.workspace = true
async-trait.workspace = true
borsh.workspace = true
camino.workspace = true
clap = { workspace = true, features = ["derive"] }
dashmap.workspace = true
eyre.workspace = true
futures-util.workspace = true
infer.workspace = true
libp2p = { workspace = true, features = ["gossipsub"] }
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

calimero-context-config.workspace = true
calimero-crypto.workspace = true
calimero-governance-types.workspace = true
calimero-primitives = { workspace = true, features = ["borsh"] }
calimero-blobstore.workspace = true
calimero-network-primitives.workspace = true
calimero-storage.workspace = true
calimero-store.workspace = true
calimero-utils-actix.workspace = true
calimero-wasm-abi.workspace = true
flate2.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile = { workspace = true, optional = true }
base64.workspace = true
semver.workspace = true

[features]
default = []
# Exposes `test_fixtures` - a node over an in-memory store, and the tar/bundle
# packers - to dependent crates' tests, which otherwise mirror them per crate.
testing = ["dep:tempfile"]

[build-dependencies]
toml.workspace = true

[dev-dependencies]
# On this crate itself, so its own tests always carry the fixtures rather than
# depending on some other crate in the workspace happening to enable them.
calimero-node-primitives = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["full"] }
rand.workspace = true
