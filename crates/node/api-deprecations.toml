# What the node's HTTP API deprecates, and what it removes at once (a hard cutover).
# The policy: docs/src/content/docs/operate/compatibility.mdx.
#
# `scripts/check-api-compat.py` (ci-checks' `Compatibility` job) compares the routes and JSON
# field names of a change with the base it merges into, and fails one that removes either
# unless an entry here allows it. Entries are read from both sides, so the change that removes
# a route may drop its entry.
#
# [[deprecated]]: a route or field still served, with the RFC 9745 `Deprecation` header on a
# route's answers (`build.rs` reads the routes for `api::deprecation`).
#   route        = "POST /auth/example"   # or field = "exampleField"; exactly one
#   since        = "1.0.0-rc.16"          # the first release that deprecates it
#   date         = 2026-11-12             # the day the deprecation merged (the header's date)
#   remove_after = "1.0.0-rc.19"          # the first release that may ship without it,
#                                         # at least 3 releases after `since`
#   replacement  = "POST /auth/new"       # what to use instead, or "nothing"
# The sealed channel's two paths are served by `calimero-sealed`'s envelope, outside the router:
# it marks its own legacy paths' answers (`LEGACY_PATHS_DEPRECATED_AT`, which `api::deprecation`'s
# tests hold to the `date` here).
#
# [[cutover]]: removed at once, which breaks earlier clients, apps or nodes; also marked
# "Hard cutover" in CHANGELOG.md and in mdma's release_compat CUTOVERS.
#   route = "...", field = "...", wit = "0.6.0" or abi = 2   # what it removes
#   pr    = 4999                                              # the PR that removes it
#   why   = "..."                                             # what breaks, and for whom

[[deprecated]]
route = "POST /sealed/v2/handshake"
since = "1.0.0-rc.25"
date = 2026-11-13
remove_after = "1.0.0-rc.28"
replacement = "POST /sealed/handshake"

[[deprecated]]
route = "POST /sealed/v2"
since = "1.0.0-rc.25"
date = 2026-11-13
remove_after = "1.0.0-rc.28"
replacement = "POST /sealed"

[[cutover]]
route = "POST /auth/releases"
pr = 5015
why = "every app is in an organization, so an account holds no release approvals of its own: clients approve on its personal organization (POST /orgs/{org}/releases)"

[[cutover]]
route = "POST /auth/outbound"
pr = 5015
why = "every app is in an organization, so an account holds no outbound approvals of its own: clients approve on its personal organization (POST /orgs/{org}/outbound)"

[[cutover]]
field = "outboundApprovals"
pr = 5015
why = "/auth/me no longer answers the account's own outbound approvals: they are its personal organization's (GET /orgs/{org})"
