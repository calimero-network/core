# What the node's HTTP API deprecates, and what it removes at once (a hard cutover).
# The policy: docs/src/content/docs/operate/compatibility.mdx.
#
# `scripts/check-api-compat.py` (ci-checks' `Compatibility` job) compares the routes and JSON
# field names of a change with the base it merges into, and fails one that removes either
# unless an entry here allows it. Entries are read from both sides, so the change that removes
# a route may drop its entry.
#
# [[deprecated]]: a route or field still served, with the RFC 9745 `Deprecation` header on a
# route's answers (`build.rs` reads the routes for `api::deprecation`).
#   route        = "POST /auth/example"   # or field = "exampleField"; exactly one
#   since        = "1.0.0-rc.16"          # the first release that deprecates it
#   date         = 2026-11-12             # the day the deprecation merged (the header's date)
#   remove_after = "1.0.0-rc.19"          # the first release that may ship without it,
#                                         # at least 3 releases after `since`
#   replacement  = "POST /auth/new"       # what to use instead, or "nothing"
#
# [[cutover]]: removed at once, which breaks earlier clients, apps or nodes; also marked
# by `!` in its PR's title (the release notes list it as breaking) and in mdma's
# release_compat CUTOVERS.
#   route = "...", field = "...", wit = "0.6.0" or abi = 2   # what it removes
#   pr    = 4999                                              # the PR that removes it
#   why   = "..."                                             # what breaks, and for whom

# A compute run keeps no log (an app's log lines may hold user data); the route answers
# `{ logs: [] }` until it is removed.
[[deprecated]]
route = "GET /apps/{app}/runs/{run}/logs"
since = "1.0.0-rc.36"
date = 2026-11-23
remove_after = "1.0.0-rc.39"
replacement = "nothing"

# A job node keeps no run log: a leader of 1.0.0-rc.35 or before asks for one only when a report
# names it, which none does now; both answer `404 NO_LOG` until they are removed.
[[deprecated]]
route = "GET /job/runs/{app}/{run}/{attempt}/log/{k}"
since = "1.0.0-rc.36"
date = 2026-11-23
remove_after = "1.0.0-rc.39"
replacement = "nothing"

[[deprecated]]
route = "GET /job/runs/{app}/{run}/{attempt}/log/key"
since = "1.0.0-rc.36"
date = 2026-11-23
remove_after = "1.0.0-rc.39"
replacement = "nothing"

[[cutover]]
route = "POST /auth/releases"
pr = 5015
why = "every app is in an organization, so an account holds no release approvals of its own: clients approve on its personal organization (POST /orgs/{org}/releases)"

[[cutover]]
route = "POST /auth/outbound"
pr = 5015
why = "every app is in an organization, so an account holds no outbound approvals of its own: clients approve on its personal organization (POST /orgs/{org}/outbound)"

[[cutover]]
field = "outboundApprovals"
pr = 5015
why = "/auth/me no longer answers the account's own outbound approvals: they are its personal organization's (GET /orgs/{org})"

[[cutover]]
route = "POST /sealed/v2/handshake"
pr = 5102
why = "deprecated since 1.0.0-rc.25 for POST /sealed/handshake: clients and peers of 1.0.0-rc.24 or earlier, and SDKs that open sessions only there, no longer reach a node"

[[cutover]]
route = "POST /sealed/v2"
pr = 5102
why = "deprecated since 1.0.0-rc.25 for POST /sealed: every SDK released before this one (mero-js up to 35.7.0, MeroKit and mero-kotlin up to 6.1.0) posts its sealed requests here and must upgrade to one that posts to /sealed"

[[cutover]]
field = "access"
pr = 5194
why = "an instance's access is its list of grants: POST /apps and POST /apps/{app}/access take only grants, and GET /apps/{app} and the move answer it as grants; clients that send or read the single access mode must move to grants, and clusters are recreated (no earlier access record is read)"

[[cutover]]
field = "hosts"
pr = 0
why = "a release's secrets are credential bindings: each names one host and one header or body field the node attaches it to, and apps no longer write {{secret:NAME}} (refused); GET /apps/{app}/secrets answers host, header, format, bodyField and binding instead of hosts, release manifests and InstallPackage records with secrets in the earlier shape are not read, and clusters holding one are recreated"
