[package]
name = "calimero-client"
description = "Client for Calimero nodes: attestation, sealed channel, passkeys, calls"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
bytes.workspace = true
eyre.workspace = true
futures-util.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
url.workspace = true

calimero-identity.workspace = true
calimero-sealed.workspace = true
calimero-tee-attestation.workspace = true
calimero-tee-release.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
calimero-node.workspace = true
# A verified-quote result without TDX, for the measurement checks' tests.
calimero-tee-attestation = { workspace = true, features = ["mock-attestation"] }
tempfile.workspace = true

[features]
testing = ["calimero-identity/testing"]
