[package]
name = "calimero-cloud-node"
description = "Calimero cloud node (release-v2): attested, one Raft log per app, sealed client API"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "merod-v2"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
camino.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
ed25519-dalek.workspace = true
eyre.workspace = true
toml.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
ring.workspace = true
semver.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
borsh.workspace = true
calimero-storage.workspace = true
tower-http = { workspace = true, features = ["cors"] }
zeroize.workspace = true
tower.workspace = true
tantivy.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true

calimero-account.workspace = true
calimero-app-downloader.workspace = true
calimero-bundle.workspace = true
calimero-cloud-client.workspace = true
calimero-identity.workspace = true
calimero-kms-client.workspace = true
calimero-log.workspace = true
calimero-outbound.workspace = true
calimero-prelude.workspace = true
calimero-primitives.workspace = true
calimero-runtime.workspace = true
calimero-search.workspace = true
calimero-wasm-abi.workspace = true
calimero-sealed.workspace = true
calimero-tee-attestation.workspace = true

[build-dependencies]
toml.workspace = true

[dev-dependencies]
calimero-cloud-client = { workspace = true, features = ["testing"] }
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
calimero-identity = { workspace = true, features = ["testing"] }
# `[outbound.testing] echo`, so a cluster test sees what a run sent out.
calimero-outbound = { workspace = true, features = ["outbound-testing"] }
tempfile.workspace = true

[features]
# DEV/TEST ONLY: accept `[outbound.testing]` in the settings file (answers
# `.test` hosts in-process, literal secrets). A release build refuses it.
outbound-testing = ["calimero-outbound/outbound-testing"]
