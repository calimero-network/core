[package]
name = "calimero-cloud-node"
description = "Calimero cloud node (release-v2): attested, one Raft log per app, sealed client API"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "merod-v2"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
eyre.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
ring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
borsh.workspace = true
calimero-storage.workspace = true
tower-http = { workspace = true, features = ["cors"] }
zeroize.workspace = true
tower.workspace = true
tantivy.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true

calimero-account.workspace = true
calimero-cloud-client.workspace = true
calimero-identity.workspace = true
calimero-log.workspace = true
calimero-primitives.workspace = true
calimero-runtime.workspace = true
calimero-search.workspace = true
calimero-wasm-abi.workspace = true
calimero-sealed.workspace = true
calimero-tee-attestation.workspace = true

[dev-dependencies]
calimero-cloud-client = { workspace = true, features = ["testing"] }
calimero-identity = { workspace = true, features = ["testing"] }
tempfile.workspace = true
