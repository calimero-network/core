[package]
name = "calimero-tee-attestation"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "TEE attestation generation and verification for Calimero"
publish = true

[features]
# DEV/TEST ONLY. Compiles the mock attestation path (mock quote
# generation/detection/verification). Default OFF so production builds contain
# no mock-attestation code. See crate docs.
mock-attestation = []
# Builds `calimero-tee-verify`, a thin JSON-in/JSON-out wrapper over
# `verify_attestation` for callers that are not Rust — mdma's manager is Python
# and has to verify a quote a fleet node submits (calimero-network/mdma#225).
# Off by default so an ordinary build of this library pulls no async runtime.
cli = ["dep:tokio"]

[dependencies]
eyre.workspace = true
hex.workspace = true
tracing.workspace = true
base64.workspace = true
# Reads `tcbEvaluationDataNumber` out of fetched collateral so a TCB verdict
# records which baseline produced it. See `verify::tcb_evaluation_data_number_of`.
serde_json.workspace = true
# `attest_key_binding`, shared by the attest endpoint and the clients that check it.
sha2.workspace = true

# Quote verification dependencies (cross-platform)
dcap-qvl.workspace = true
tdx-quote.workspace = true

# Server primitives for Quote type
calimero-server-primitives.workspace = true

# Only for the `cli` feature's binary: `verify_attestation` is async and the
# library itself needs no runtime.
tokio = { workspace = true, features = ["rt", "macros"], optional = true }

[[bin]]
name = "calimero-tee-verify"
path = "src/bin/verify_cli.rs"
required-features = ["cli"]

[target.'cfg(target_os = "linux")'.dependencies]
configfs-tsm.workspace = true
tdx_workload_attestation = { workspace = true, features = ["tdx-linux"] }
reqwest.workspace = true

