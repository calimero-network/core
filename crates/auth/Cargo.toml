[package]
name = "mero-auth"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Forward Authentication Service for Calimero Network"
repository.workspace = true
license.workspace = true
publish = true

[dependencies]
aes-gcm = "0.10.3"
async-trait.workspace = true
axum = { workspace = true, features = ["macros"] }
base64.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["json", "toml"] }
ctor = "1.0"
eyre.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
lazy_static.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex = "1.10.2"
ring.workspace = true
rocksdb.workspace = true
rust-embed = { workspace = true, features = ["mime-guess", "interpolate-folder-path"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
tower = { workspace = true, features = ["util", "limit"] }
tower-http = { workspace = true, features = ["catch-panic", "cors", "limit", "trace", "set-header"] }
tower-sessions.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
uuid = { version = "1.6", features = ["v4", "serde"] }
validator = { version = "0.21.0", features = ["derive"] }

[dev-dependencies]
mockall = "0.15"
reqwest = { workspace = true, features = ["json"] }
tempfile = "3.8"
tokio-test = "0.4"

[build-dependencies]
calimero-build-utils = { workspace = true, features = ["fetch"] }
eyre.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
