apiVersion: compute.calimero.network/v1
kind: Pipeline
name: invoice-risk
module: sha256:7a9c…41d2          # default module; "self" inside an app
params:
  threshold: { type: number, default: 0.8, min: 0, max: 1 }
inputs:
  invoices: { kind: files, maxItems: 1000 }
  model:    { kind: artifact, default: fraud-model@4 }
  vendors:  { kind: table }
failFast: false
steps:
  extract:  { module: calimero/pdf-extract@1, method: extract,
              forEach: inputs.invoices, maxItems: 1000, maxParallel: 16 }
  score:    { method: score, pool: highmem, forEach: extract.outputs, maxItems: 1000,
              batch: 25, inputs: [inputs.model, inputs.vendors],
              args: { threshold: params.threshold }, allowFailures: 5% }
  escalate: { method: escalate, when: "score.results.exists(r, r.flagged)" }
  report:   { method: report, collect: score.outputs }
  incident: { method: incident_summary, needs: [score, report], runIf: failure }
outputs: [report.outputs, escalate.outputs]
