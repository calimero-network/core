[package]
name = "calimero-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
publish = true

# `wasmer-compiler-cranelift` is the compiler backend wasmer links through a
# feature, so no `use` of it ever appears in `src` — but removing it fails the
# build. cargo-machete works from source references, so it cannot see that edge;
# this is the one entry the CI gate has to be told about rather than a dead dep.
[package.metadata.cargo-machete]
ignored = ["wasmer-compiler-cranelift"]

[dependencies]
borsh = { workspace = true, features = ["derive"] }
bytes.workspace = true
eyre.workspace = true
ed25519-dalek.workspace = true
fragile.workspace = true
futures-util = { workspace = true, features = ["io"] }
ouroboros.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-stream.workspace = true
tracing.workspace = true
ureq.workspace = true
wasmer.workspace = true
wasmer-types.workspace = true
wasmer-middlewares.workspace = true
wasmer-compiler-cranelift = { workspace = true, optional = true }

calimero-account.workspace = true
calimero-context-config.workspace = true
calimero-primitives.workspace = true
calimero-node-primitives.workspace = true
calimero-sys.workspace = true
calimero-storage.workspace = true

[[example]]
name = "demo"

[dev-dependencies]
assert-json-diff.workspace = true
tracing-subscriber.workspace = true
eyre.workspace = true
owo-colors.workspace = true
rand.workspace = true
serde_json.workspace = true
toml.workspace = true
wasmer.workspace = true
wat.workspace = true

[features]
profiling = ["wasmer-compiler-cranelift"]
