[package]
name = "calimero-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
publish = true

[dependencies]
borsh = { workspace = true, features = ["derive"] }
bytes.workspace = true
eyre.workspace = true
ed25519-dalek.workspace = true
fragile.workspace = true
futures-util = { workspace = true, features = ["io"] }
ouroboros.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tokio-stream.workspace = true
tracing.workspace = true
wasmer.workspace = true
wasmer-types.workspace = true
wasmer-middlewares.workspace = true

calimero-account.workspace = true
calimero-context-config.workspace = true
calimero-primitives.workspace = true
calimero-node-primitives.workspace = true
calimero-sys.workspace = true
calimero-storage.workspace = true

[[example]]
name = "demo"

[dev-dependencies]
assert-json-diff.workspace = true
tracing-subscriber.workspace = true
criterion.workspace = true
eyre.workspace = true
owo-colors.workspace = true
rand.workspace = true
serde_json.workspace = true
toml.workspace = true
wasmer.workspace = true
wat.workspace = true

[features]
profiling = []

# The lib target is the only non-criterion one `cargo bench` would select (test
# targets already default to `bench = false`), and libtest rejects criterion's
# own CLI flags.
[lib]
bench = false

[[bench]]
name = "engine"
harness = false
