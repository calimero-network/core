[package]
name = "calimero-dag"
authors.workspace = true
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
publish = true

[dependencies]
async-trait.workspace = true
borsh = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
calimero-storage.workspace = true
tracing.workspace = true

[lib]
bench = false

[dev-dependencies]
calimero-storage = { workspace = true, features = ["testing"] }
criterion.workspace = true
rand.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }

[features]
testing = []

# `pending` deliberately has no `required-features = ["testing"]`: its fixture
# builds `CausalDelta` via the ungated `CausalDelta::new`, and the key would
# make a bare `cargo bench -p calimero-dag --bench pending` silently skip the
# target instead of building it.
[[bench]]
name = "pending"
harness = false
