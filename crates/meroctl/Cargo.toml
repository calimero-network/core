[package]
name = "meroctl"
description = "Command line for Calimero nodes (merod): apps, contexts, namespaces, blobs, accounts, operations"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "meroctl"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
base64.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
eyre.workspace = true
futures-util.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
url.workspace = true

calimero-client = { workspace = true, features = ["testing"] }
calimero-identity = { workspace = true, features = ["testing"] }

[build-dependencies]
calimero-build-utils.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true

calimero-bundle.workspace = true
calimero-node.workspace = true
