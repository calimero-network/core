[package]
name = "calimero-context"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
publish = true

[dependencies]
actix.workspace = true
async-trait.workspace = true
borsh.workspace = true
either.workspace = true
eyre.workspace = true
futures-util.workspace = true
hex.workspace = true
ouroboros.workspace = true
prometheus-client.workspace = true
rand.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tracing.workspace = true

calimero-app-downloader.workspace = true
calimero-context-config.workspace = true
calimero-context-client.workspace = true
calimero-governance-store.workspace = true
calimero-crypto.workspace = true
calimero-dag.workspace = true
calimero-governance-types.workspace = true
calimero-network-primitives.workspace = true
calimero-node-primitives.workspace = true
calimero-authz.workspace = true
calimero-account.workspace = true
calimero-op.workspace = true
calimero-prelude.workspace = true
calimero-primitives = { workspace = true, features = ["borsh", "rand"] }
calimero-projection.workspace = true
calimero-runtime.workspace = true
calimero-search.workspace = true
calimero-storage.workspace = true
calimero-store = { workspace = true, features = ["datatypes"] }
calimero-tee-attestation.workspace = true
calimero-tee-release.workspace = true
calimero-utils-actix.workspace = true
calimero-wasm-abi.workspace = true

[dev-dependencies]
# Mock quotes, so a test can drive a founding relay's self-attestation.
calimero-tee-attestation = { workspace = true, features = ["mock-attestation"] }
# The actor harness in `test_support::actor` reuses the node fixture, which owns
# the blobstore and the temp dirs a real `NodeClient` needs.
calimero-node-primitives = { workspace = true, features = ["testing"] }
tempfile.workspace = true
calimero-store-rocksdb.workspace = true
camino.workspace = true
# Module compiles run on the node's global runtime, which must be multi-threaded.
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Hand-written wasm modules for the execute-gate tests.
wat.workspace = true
# Ids of a cell's members and owned entries, for tests that play a run writing them.
calimero-storage = { workspace = true, features = ["testing"] }

[features]
profiling = ["calimero-runtime/profiling"]
