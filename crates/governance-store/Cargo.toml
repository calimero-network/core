[package]
name = "calimero-governance-store"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
publish = true

[dependencies]
# Optional, and only for the `testing` feature below: `test_fixtures` builds a
# real `NodeClient` (which needs a `BlobManager`) and a temp-dir store. They are
# also dev-dependencies, for the crate's own `cfg(test)` build.
tempfile = { workspace = true, optional = true }
calimero-blobstore = { workspace = true, optional = true }
actix.workspace = true
async-trait.workspace = true
borsh.workspace = true
eyre.workspace = true
hex.workspace = true
libp2p.workspace = true
prometheus-client.workspace = true
rand.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tracing.workspace = true

calimero-app-downloader.workspace = true
calimero-account.workspace = true
calimero-context-config.workspace = true
calimero-context-client.workspace = true
calimero-governance-types.workspace = true
calimero-crypto.workspace = true
calimero-dag.workspace = true
calimero-network-primitives.workspace = true
calimero-node-primitives.workspace = true
calimero-op.workspace = true
calimero-op-adapter.workspace = true
calimero-primitives = { workspace = true, features = ["borsh", "rand"] }
calimero-storage.workspace = true
calimero-store = { workspace = true, features = ["datatypes"] }
calimero-utils-actix.workspace = true
bip39 = { version = "2.2.2", default-features = false, features = ["alloc", "zeroize"] }
zeroize.workspace = true

[dev-dependencies]
# Fold-equivalence: cross-check the unified projection's membership fold
# against this crate's live membership resolver over the same op sequences.
# (`calimero-op` is now a regular dependency — used by `unified_op_decode` —
# so it no longer needs a dev-dependency entry.)
calimero-projection.workspace = true
# Serializes the op-event tests, which observe a process-global broadcast bus
# (`op_events`) and would otherwise cross-talk / flood under parallel execution.
serial_test.workspace = true
# Backs the stub `BlobManager` a real `NodeClient` needs in publish-path tests
# (unused by the publish path itself, but a required constructor field).
calimero-blobstore.workspace = true
tempfile.workspace = true

[features]
default = []
# Exposes `test_fixtures` across crate boundaries so a dependent crate's tests
# can build the same enrolled-member governance state these fixtures already
# build correctly — membership rows AND the binding rows that make an account's
# own ops verify. Reimplementing that setup per crate is how a test ends up
# asserting against a member whose ops would be refused in production.
testing = ["dep:tempfile", "dep:calimero-blobstore"]
