[package]
name = "merod"
description = "The Calimero node: attested, one Raft log per app (internals: calimero-cloud-node)"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "merod"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env"] }
dirs.workspace = true
eyre.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

calimero-cloud-client.workspace = true
calimero-cloud-node.workspace = true
calimero-identity.workspace = true
calimero-kms-client.workspace = true
calimero-log.workspace = true
calimero-outbound.workspace = true

[dev-dependencies]
tempfile.workspace = true
