[package]
name = "calimero-app-host"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "The engine-neutral host core of calimero:app: state, policy, time and randomness"
publish = false

[features]
# Exposes diagnostic counters (`HostCore::peak_buffered`) and `MemoryFiles` to tests.
testing = ["dep:hex"]

[dependencies]
base64.workspace = true
calimero-app-wit.workspace = true
ciborium.workspace = true
hex = { workspace = true, optional = true }
rand.workspace = true
rand_chacha.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
calimero-app-host = { path = ".", features = ["testing"] }
# The byte-identity tests of `collections` compare against the real SDK on its `MemStore`.
# Without `testing` the SDK does not depend on this crate, so there is no cycle.
calimero-sdk.workspace = true
