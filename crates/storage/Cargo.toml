[package]
name = "calimero-storage"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
publish = true

[dependencies]
borsh = { workspace = true, features = ["derive"] }
calimero-account.workspace = true
calimero-prelude.workspace = true
calimero-primitives = { workspace = true, features = ["borsh"] }
eyre.workspace = true
fixedstr = { workspace = true, features = ["flex-str", "serde", "std"] }
hex.workspace = true
indexmap.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

calimero-sdk.workspace = true
calimero-storage-macros.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Host-only: ABI extraction runs against a native build, never inside the wasm.
calimero-wasm-abi.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true

[dev-dependencies]
claims.workspace = true
criterion.workspace = true
hex.workspace = true
serial_test.workspace = true
trybuild.workspace = true
velcro.workspace = true

calimero-sdk.workspace = true

# A crate that gains a [[bench]] needs `bench = false` on its [lib], [[bin]]
# and [[test]] targets, or `cargo bench -p calimero-storage` (no --bench
# filter) hands those to libtest, which rejects criterion's own CLI flags.
[lib]
bench = false

[[test]]
name = "abi_crdt_shapes"
bench = false

[[test]]
name = "abi_mergeable_coverage"
bench = false

[[test]]
name = "compile_fail"
bench = false

[[test]]
name = "converge"
bench = false

[[test]]
name = "crdt_contract"
bench = false

[[test]]
name = "derive_mergeable"
bench = false

[[test]]
name = "multi_device_account"
bench = false

[[test]]
name = "read_cost_profile"
bench = false

[[test]]
name = "root_fanout_shape"
bench = false

[[test]]
name = "sorted_index_convergence"
bench = false

[[test]]
name = "trie_scaling"
bench = false

[[test]]
name = "write_cost_profile"
bench = false

[features]
default = []
# Exposes the WASM-side merge registry to host-build test code so
# integration tests can exercise the dispatch shape without a real
# WASM runtime. Required by the registry integration tests; dependent
# crates that want to mock registered merge functions enable this too.
# Also exposes `tests::common` (action signing / builder helpers) across
# crate boundaries so dependent crates' DAG-causal tests can share one
# canonical copy instead of mirroring it.
testing = []

# Registry tests live in `tests/` as separate integration binaries
# rather than `src/tests/` unit modules so they exercise the production
# `RwLock`-backed registry path instead of the `#[cfg(test)]`
# thread-local one. They need the registry to be callable from outside
# `cfg(test)`, which is what the `testing` feature unlocks.
[[test]]
name = "merge_registry_concurrent"
required-features = ["testing"]
bench = false

[[test]]
name = "merge_registry_integration"
required-features = ["testing"]
bench = false

[[test]]
name = "rekey_record"
required-features = ["testing"]
bench = false

[[bench]]
name = "child_trie"
harness = false

[[bench]]
name = "merge_root_state"
harness = false
