[package]
name = "calimero-store"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description.workspace = true
publish = true

[dependencies]
borsh = { workspace = true, optional = true }
camino.workspace = true
eyre.workspace = true
generic-array.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
strum = { workspace = true, features = ["derive"] }
thiserror.workspace = true
thunderdome.workspace = true
zeroize.workspace = true

calimero-account.workspace = true
calimero-primitives.workspace = true
calimero-storage.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
camino.workspace = true
calimero-store-rocksdb.workspace = true

# `bench = false` on every non-criterion target: a bare `cargo bench -p <crate>`
# otherwise hands them to libtest, which rejects criterion's own CLI flags.
[lib]
bench = false

[[test]]
name = "rocksdb"
bench = false

[[bench]]
name = "db_ops"
harness = false

[features]
borsh = ["borsh/derive"]
serde = ["dep:serde", "dep:serde_json"]
datatypes = ["borsh", "calimero-primitives/borsh"]
