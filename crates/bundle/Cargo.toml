[package]
name = "calimero-bundle"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "Signed Calimero app packages (.mpk): manifest, canonical JSON, Ed25519 signatures and verified contents"
publish = true

[dependencies]
base64.workspace = true
bs58.workspace = true
ed25519-dalek.workspace = true
eyre.workspace = true
flate2.workspace = true
hex.workspace = true
html5ever = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
semver.workspace = true
serde_json_canonicalizer.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
html = ["dep:html5ever"]

[dev-dependencies]
calimero-primitives = { workspace = true, features = ["borsh"] }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand.workspace = true

[lints]
workspace = true
