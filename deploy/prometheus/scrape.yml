# Scrape merod's plain metrics listener (`merod run --metrics-listen ADDR`).
# The listener asks for no credential, so bind ADDR to an address only the
# collector reaches (the host's private interface). Every metric is a count,
# a duration or a size; no label carries an app, account or organization id.
scrape_configs:
  - job_name: merod
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.0.0.11:9464 # node 1
          - 10.0.0.12:9464 # node 2
          - 10.0.0.13:9464 # node 3
rule_files:
  - alerts.yml
