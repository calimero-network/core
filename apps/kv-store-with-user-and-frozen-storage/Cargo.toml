[package]
name = "kv-store-with-user-and-frozen-storage"
version = "0.1.0"
edition = "2021"
publish = false
description = "A KV store on the component SDK with per-account values and content-addressed immutable values"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk" }
sha2 = { version = "0.10", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like apps/rooms: the tests build this crate for wasm32-wasip2.
[workspace]
