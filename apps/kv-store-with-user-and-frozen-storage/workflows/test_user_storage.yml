# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: KV-store user storage workflow
description: KV-Store user storage workflow test
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3810
accounts:
- new-calimero-node-1
- new-calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_user_and_frozen_storage.wasm'
  outputs:
    app_id_bundle: hash
  account: new-calimero-node-1
- type: set
  values:
    app_id: com.calimero.kv-store-with-user-and-frozen-storage
- name: Create Mesh
  type: create_org
  account: new-calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: new-calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: new-calimero-node-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: new-calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_user_and_frozen_storage.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Simple user storage set test
  type: call
  app: '{{context_id}}'
  method: set_user_simple
  args:
    value: SomeSimpleUserString
  account: new-calimero-node-1
- name: Simple user storage get test
  type: call
  app: '{{context_id}}'
  method: get_user_simple
  args: {}
  account: new-calimero-node-1
  outputs:
    simple_value_res: rpc
- name: Assert simple user storage value got is expected
  type: json_assert
  statements:
  - 'json_equal({{simple_value_res}}, {"output": "SomeSimpleUserString"})'
- name: Nested user storage set test
  type: call
  app: '{{context_id}}'
  method: set_user_nested
  args:
    key: UserNestedKey1
    value: UserNestedValue1
  account: new-calimero-node-1
- name: Nested user storage get test
  type: call
  app: '{{context_id}}'
  method: get_user_nested
  args:
    key: UserNestedKey1
  account: new-calimero-node-1
  outputs:
    nested_value_res: rpc
- name: Assert nested user storage value got is expected
  type: json_assert
  statements:
  - 'json_equal({{nested_value_res}}, {"output": "UserNestedValue1"})'
- name: Simple user storage get test for a specific user
  type: call
  app: '{{context_id}}'
  method: get_user_simple
  args: {}
  account: new-calimero-node-1
  outputs:
    simple_value_res_specific_user: rpc
- name: Assert simple user storage value got is expected
  type: json_assert
  statements:
  - 'json_equal({{simple_value_res_specific_user}}, {"output": "SomeSimpleUserString"})'
- name: Read node-1's account
  type: call
  app: '{{context_id}}'
  method: my_account
  args: {}
  account: new-calimero-node-1
  outputs:
    node1_account: result
- name: Node 2 - Simple user storage get test for a specific user
  type: call
  app: '{{context_id}}'
  method: get_user_simple_for
  args:
    user_key: '{{node1_account}}'
  account: new-calimero-node-2
  outputs:
    node2_simple_value_res_specific_user: rpc
- name: Assert simple user storage value got is expected
  type: json_assert
  statements:
  - 'json_equal({{node2_simple_value_res_specific_user}}, {"output": "SomeSimpleUserString"})'
- name: Node 2 - Simple user storage get test for a specific user
  type: call
  app: '{{context_id}}'
  method: set_user_simple
  args:
    value: SimpleUserStringFromNode2
  account: new-calimero-node-2
- name: Simple user storage get test for a specific user
  type: call
  app: '{{context_id}}'
  method: get_user_simple
  args: {}
  account: new-calimero-node-2
  outputs:
    node2_simple_value_res: rpc
- name: Assert simple user storage on Node 2 value got is expected
  type: json_assert
  statements:
  - 'json_equal({{node2_simple_value_res}}, {"output": "SimpleUserStringFromNode2"})'
- name: Read node-2's account
  type: call
  app: '{{context_id}}'
  method: my_account
  args: {}
  account: new-calimero-node-2
  outputs:
    node2_account: result
- name: Node 1 - Simple user storage get test for a specific user (from Node2)
  type: call
  app: '{{context_id}}'
  method: get_user_simple_for
  args:
    user_key: '{{node2_account}}'
  account: new-calimero-node-1
  outputs:
    node1_simple_value_res_from_node2: rpc
- name: Assert simple user storage value got is expected
  type: json_assert
  statements:
  - 'json_equal({{node1_simple_value_res_from_node2}}, {"output": "SimpleUserStringFromNode2"})'
