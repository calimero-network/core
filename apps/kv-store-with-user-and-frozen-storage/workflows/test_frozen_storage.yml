# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: KV-store frozen storage workflow
description: KV-Store Frozen storage workflow test
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3800
accounts:
- new-calimero-node-1
- new-calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_user_and_frozen_storage.wasm'
  outputs:
    app_id_bundle: hash
  account: new-calimero-node-1
- type: set
  values:
    app_id: com.calimero.kv-store-with-user-and-frozen-storage
- name: Create Mesh
  type: create_org
  account: new-calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: new-calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: new-calimero-node-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: new-calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_user_and_frozen_storage.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Set value in the storage 'my_key1':'my_value1'
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: my_key1
    value: my_value1
  account: new-calimero-node-1
- name: Frozen storage set test
  type: call
  app: '{{context_id}}'
  method: add_frozen
  args:
    value: SomeFrozenString
  account: new-calimero-node-1
  outputs:
    frozen_value_hash_hex: result
- name: Assert frozen storage key is expected
  type: json_assert
  statements:
  - json_equal({{frozen_value_hash_hex}}, "c8acd3c44a96324de12a82dd674aa1c93a635fbb76a852ae14363f9b1971beb1")
- name: Frozen storage get test
  type: call
  app: '{{context_id}}'
  method: get_frozen
  args:
    hash_hex: '{{frozen_value_hash_hex}}'
  account: new-calimero-node-1
  outputs:
    frozen_value_res: rpc
- name: Assert frozen value got is expected
  type: json_assert
  statements:
  - 'json_equal({{frozen_value_res}}, {"output": "SomeFrozenString"})'
- name: Node 2 - frozen storage get test
  type: call
  app: '{{context_id}}'
  method: get_frozen
  args:
    hash_hex: '{{frozen_value_hash_hex}}'
  account: new-calimero-node-2
  outputs:
    node2_frozen_value_res: rpc
- name: Node 2 - Assert frozen storage value got is expected
  type: json_assert
  statements:
  - 'json_equal({{node2_frozen_value_res}}, {"output": "SomeFrozenString"})'
- name: Frozen storage set test (on Node 2)
  type: call
  app: '{{context_id}}'
  method: add_frozen
  args:
    value: SomeFrozenString2
  account: new-calimero-node-2
  outputs:
    frozen_value_hash_hex_node2: result
- name: Node 2 - Assert frozen storage key is expected
  type: json_assert
  statements:
  - json_equal({{frozen_value_hash_hex_node2}}, "ceaa4337dea4ad0ced60eb2c58a7b69ecab93fe07ee76e0ad2fd5dcb4001f5ff")
- name: Node 1 - frozen storage get test (that was set by Node2)
  type: call
  app: '{{context_id}}'
  method: get_frozen
  args:
    hash_hex: '{{frozen_value_hash_hex_node2}}'
  account: new-calimero-node-1
  outputs:
    node1_frozen_value_from_node2_res: rpc
- name: Node 1 - Assert frozen storage value got (from Node 2) is expected
  type: json_assert
  statements:
  - 'json_equal({{node1_frozen_value_from_node2_res}}, {"output": "SomeFrozenString2"})'
