# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x1: v1 node logs
#   assert_log_present x3: v1 node logs
#   download_blob (a node-local miss) x2: checks what the dropped steps did
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# Migration note: kept although the converter counted v1's log checks against it: its
#   subject, a blob's bytes reaching another node, is the downloads by the second
#   account (served by another node of the cluster), checked by size and sha256 against
#   the source
name: Blob Cross-Node Transfer — Bytes Actually Arrive
description: "The other half of the #3317 regression: a blob's BYTES must reach a second node. Announce\
  \ -> DHT provider lookup -> signed member request -> chunked transfer, asserted on the received bytes\
  \ rather than on metadata.\nDefect 2 of #3317: `create_blob_auth_for_context` returned None for every\
  \ namespace-backed context, so every outgoing blob request went out with `auth: None`; the serving node's\
  \ `is_signed_context_member` returned false (crates/node/src/handlers/blob_protocol.rs) and it replied\
  \ `found: false`, surfacing as \"404 Blob not found locally or in network\". The serving node never\
  \ even logged \"Processing blob request stream\" — it bailed at the auth gate before looking for a blob\
  \ it was holding.\nNeeds merobox >= 0.6.44 for the `download_blob` step (the version CI installs is\
  \ pinned in .github/actions/setup-merobox/action.yml) and a node build carrying #3326, without which\
  \ the kad preconditions below fail.\nRun locally — --e2e-mode is REQUIRED, it clears the public devnet\
  \ bootstrap list `merod init` writes; without it the provider lookup times out on unreachable public\
  \ peers:\n  cd apps/blobs\n  MERO_AUTH_ADMIN_USER=dev MERO_AUTH_ADMIN_PASSWORD=dev-password \\\n   \
  \ merobox bootstrap run workflows/blob-cross-node-transfer.yml --e2e-mode\n\nON THE NEGATIVE CONTROLS:\
  \ blobs are content-addressed, so a node already holding identical bytes serves them from local storage\
  \ and never touches the network. Every cross-node fetch below is therefore preceded by a local-only\
  \ read that MUST fail. Without that, a passing fetch proves nothing — this is the trap that makes blob\
  \ transfer tests quietly vacuous.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3540
accounts:
- rust-blob-xfer-1
- rust-blob-xfer-2
steps:
- name: Install Rust blobs app on inviter
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/blobs.wasm'
  outputs:
    app_id_bundle: hash
  account: rust-blob-xfer-1
- type: set
  values:
    app_id: com.calimero.blobs
- name: Create Mesh
  type: create_org
  account: rust-blob-xfer-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: rust-blob-xfer-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: rust-blob-xfer-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: rust-blob-xfer-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/blobs.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    inviter_key: memberPublicKey
- name: Assert the mesh came up
  type: assert
  statements:
  - is_set({{context_id}})
- name: Upload the PNG on node 1
  type: upload_blob
  app: '{{context_id}}'
  file_path: static/sample.png
  account: rust-blob-xfer-1
  outputs:
    png_blob_id: blob_id
    png_blob_size: size
- name: Read the PNG locally on node 1
  type: download_blob
  app: '{{context_id}}'
  blob_id: '{{png_blob_id}}'
  expected_size: '{{png_blob_size}}'
  account: rust-blob-xfer-1
  outputs:
    png_source_sha256: sha256
- name: Let the announce reach the DHT
  type: wait
  seconds: 20.0
- name: Node 2 fetches the PNG over the network
  type: download_blob
  app: '{{context_id}}'
  blob_id: '{{png_blob_id}}'
  expected_size: '{{png_blob_size}}'
  expected_sha256: '{{png_source_sha256}}'
  account: rust-blob-xfer-2
  outputs:
    png_received_size: size
    png_received_sha256: sha256
- name: Assert node 2's bytes are byte-identical to node 1's
  type: assert
  statements:
  - equal({{png_received_size}}, {{png_blob_size}})
  - equal({{png_received_sha256}}, {{png_source_sha256}})
- name: Upload the TXT on node 1
  type: upload_blob
  app: '{{context_id}}'
  file_path: static/test.txt
  account: rust-blob-xfer-1
  outputs:
    txt_blob_id: blob_id
    txt_blob_size: size
- name: Read the TXT locally on node 1
  type: download_blob
  app: '{{context_id}}'
  blob_id: '{{txt_blob_id}}'
  expected_size: '{{txt_blob_size}}'
  account: rust-blob-xfer-1
  outputs:
    txt_source_sha256: sha256
- name: Let the announce reach the DHT
  type: wait
  seconds: 20.0
- name: Node 2 fetches the TXT over the network
  type: download_blob
  app: '{{context_id}}'
  blob_id: '{{txt_blob_id}}'
  expected_size: '{{txt_blob_size}}'
  expected_sha256: '{{txt_source_sha256}}'
  account: rust-blob-xfer-2
  outputs:
    txt_received_sha256: sha256
- name: Assert both transfers delivered their own correct bytes
  type: assert
  statements:
  - equal({{txt_received_sha256}}, {{txt_source_sha256}})
  - not_equal({{txt_received_sha256}}, {{png_received_sha256}})
