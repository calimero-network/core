# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x2: v1 node logs
#   assert_log_present x1: v1 node logs
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: Blob Announce — Namespace Membership Regression
description: 'Regression test for the announce half of #3317. Uploading a blob with a context_id must
  publish a provider record; it silently did not for every namespace-backed context, which is every context,
  since `context create` requires --group-id.

  `NodeClient::find_owned_identity` only accepted a ContextIdentity row carrying its own private_key.
  Under the group model a member''s row is a keyless marker — its presence IS the membership signal —
  and the signing key lives with the node''s single namespace identity, resolved live. So the lookup returned
  None for contexts the node genuinely belongs to, and `PUT /admin-api/blobs? context_id=…` bailed with
  "Skipping announce: node is not a member of the requested context" (crates/server/src/admin/handlers/blob.rs).

  That is exactly the request merobox''s `upload_blob` step makes when given a context_id, so the bug
  is observable here with no new step type: before the fix the node logs the skip, after it the log is
  clean. `apps/blobs/workflows/ blobs.yml` never caught it because its only second-node assertion is `list_files`,
  which reads CRDT metadata and replicates independently of any blob.

  SCOPE: this covers defect 1 (announce skipped). Defect 2 (every outgoing blob request unsigned, so the
  serving node answers found:false) needs an assertion on the received BYTES, which requires merobox''s
  `download_blob` step. blob-cross-node-transfer.yml is that test, and it now runs — the step shipped
  in merobox 0.6.44 and the version CI installs is well past it.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3520
accounts:
- rust-blob-announce-1
- rust-blob-announce-2
steps:
- name: Install Rust blobs app on inviter
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/blobs.wasm'
  outputs:
    app_id_bundle: hash
  account: rust-blob-announce-1
- type: set
  values:
    app_id: com.calimero.blobs
- name: Create Mesh
  type: create_org
  account: rust-blob-announce-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: rust-blob-announce-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: rust-blob-announce-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: rust-blob-announce-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/blobs.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    inviter_key: memberPublicKey
- name: Assert the mesh came up
  type: assert
  statements:
  - is_set({{context_id}})
  - is_set({{inviter_key}})
- name: Upload a blob with a context id (announce path)
  type: upload_blob
  app: '{{context_id}}'
  file_path: static/sample.png
  account: rust-blob-announce-1
  outputs:
    blob_id: blob_id
    blob_size: size
- name: Assert the upload reported a blob
  type: assert
  statements:
  - is_set({{blob_id}})
  - '{{blob_size}} > 0'
- name: Upload a second blob with a context id
  type: upload_blob
  app: '{{context_id}}'
  file_path: static/test.txt
  account: rust-blob-announce-1
  outputs:
    txt_blob_id: blob_id
- name: Assert the second upload reported a blob
  type: assert
  statements:
  - is_set({{txt_blob_id}})
  - not_equal({{txt_blob_id}}, {{blob_id}})
- name: Register the blob through the app and check its announce too
  type: call
  app: '{{context_id}}'
  method: upload_file
  args:
    name: sample.png
    blob_id: '{{blob_id}}'
    size: '{{blob_size}}'
    mime_type: image/png
  account: rust-blob-announce-1
  outputs:
    file_id: result
- name: Assert the app registered the file
  type: assert
  statements:
  - is_set({{file_id}})
