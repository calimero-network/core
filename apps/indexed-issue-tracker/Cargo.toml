[package]
name = "indexed-issue-tracker"
version = "0.1.0"
edition = "2021"
publish = false
description = "An issue tracker on the component SDK: list views that are index seeks"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like apps/rooms: the tests build this crate for wasm32-wasip2.
[workspace]
