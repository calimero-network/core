[package]
name = "indexed-issue-tracker"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
thiserror.workspace = true
calimero-sdk.workspace = true
calimero-storage.workspace = true

[dev-dependencies]
# Enables `register_crdt_merge` + the native mock host so `TestHost` can drive
# CRDT state under `cargo test`.
calimero-storage = { workspace = true, features = ["testing"] }

# The scenario in `workflows/` installs this by package id, so the bundle name
# it names — `com.calimero.indexed-issue-tracker-0.0.0.mpk` — comes from
# here.
[package.metadata.calimero]
package = "com.calimero.indexed-issue-tracker"
name = "Indexed Issue Tracker"

[package.metadata.workspaces]
independent = true
