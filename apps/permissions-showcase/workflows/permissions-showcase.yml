# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x9: replication is synchronous: a read sees every committed write
name: Every write policy across two nodes
description: "Two nodes, two accounts, one team space. Each field uses a different write policy, and each\
  \ property below is one a single node cannot show: the rule must hold on the node that did NOT make\
  \ the write, applying what sync delivered.\n1. FROZEN VALUES REACH EVERY NODE. Node 2 reads the founding\
  \ record and the\n   quorum node 1 froze at init.\n\n2. WRITE-ONCE MESSAGES ARE OWNED AND FINAL. Keys\
  \ are per owner, so node 2\n   posting under the key of node 1's message files node 2's own message\n\
  \   beside it, and node 1's reads back unchanged. Node 1 cannot rewrite its\n   own. Each node's messages\
  \ show up in the other's channel slice.\n\n3. ONLY A MODERATOR REMOVES AN ANNOUNCEMENT. Node 2 announces,\
  \ and cannot\n   remove its own announcement: it is immutable, and node 2 is not a\n   moderator. Node\
  \ 1, the founder, removes it, and node 2 sees it gone.\n\n4. MODERATORS ARE APPOINTED BY MODERATORS.\
  \ Node 2 cannot appoint itself.\n   Node 1 appoints node 2, and node 2 then removes an announcement\
  \ node 1\n   made, which node 1 sees gone.\n\n5. A PAGE AND ITS NESTED REVISIONS BELONG TO ITS AUTHOR.\
  \ Keys are per owner,\n   so node 2 holds no page at node 1's id: it can neither rename node 1's\n \
  \  page nor reach the revisions nested inside it. Node 2 reads node 1's page\n   by id alone, and node\
  \ 1's own revision reaches it.\n\n6. CONTENT-ADDRESSED EVIDENCE SYNCS AND DEDUPLICATES. Node 2 files\
  \ evidence;\n   node 1 finds it through its index and gets the same hash for the same\n   content.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3870
accounts:
- perm-node-1
- perm-node-2
steps:
- name: Install application on perm-node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/permissions_showcase.wasm'
  outputs:
    app_id_bundle: hash
  account: perm-node-1
- type: set
  values:
    app_id: com.calimero.permissions-showcase
- name: Create mesh with perm-node-2
  type: create_org
  account: perm-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: perm-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: perm-node-2
  token: '{{_mesh_invite}}'
- name: Create mesh with perm-node-2
  type: deploy
  account: perm-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/permissions_showcase.wasm'
  app_name: Create mesh with perm-node-2
  outputs:
    context_id: contextId
- name: Assert the mesh came up
  type: assert
  statements:
  - is_set({{context_id}})
- name: Account of node 2
  type: call
  app: '{{context_id}}'
  method: me
  args: {}
  account: perm-node-2
  outputs:
    acct_node2: result
- name: Account of node 1
  type: call
  app: '{{context_id}}'
  method: me
  args: {}
  account: perm-node-1
  outputs:
    acct_node1: result
- name: Node 2 reads the founding record
  type: call
  app: '{{context_id}}'
  method: founding
  args: {}
  account: perm-node-2
  outputs:
    n2_founding: rpc
- name: Node 2 reads the quorum
  type: call
  app: '{{context_id}}'
  method: quorum
  args: {}
  account: perm-node-2
  outputs:
    n2_quorum: rpc
- name: Assert node 2 holds what node 1 froze
  type: json_assert
  statements:
  - 'json_equal({{n2_founding}}, {"output": {"name": "calimero core", "motto": "converge without coordinating"}})'
  - 'json_equal({{n2_quorum}}, {"output": 2})'
- name: Node 1 posts a message
  type: call
  app: '{{context_id}}'
  method: post_message
  args:
    channel: general
    id: m1
    text: hello from node one
    sent_at: 10
  account: perm-node-1
- name: Node 2 posts under the key of node 1's message
  type: call
  app: '{{context_id}}'
  method: post_message
  args:
    channel: general
    id: m1
    text: node two at m1
    sent_at: 11
  account: perm-node-2
- name: Node 1 tries to rewrite its own message
  type: call
  app: '{{context_id}}'
  method: post_message
  args:
    channel: general
    id: m1
    text: rewritten by node one
    sent_at: 11
  account: perm-node-1
  expected_failure: true
  outputs:
    overwrite_error: error
- name: Assert the rewrite was refused
  type: assert
  statements:
  - is_set({{overwrite_error}})
- name: Node 2 posts a message of its own
  type: call
  app: '{{context_id}}'
  method: post_message
  args:
    channel: general
    id: m2
    text: hello from node two
    sent_at: 12
  account: perm-node-2
- name: Node 2 posts in another channel
  type: call
  app: '{{context_id}}'
  method: post_message
  args:
    channel: random
    id: m3
    text: off topic
    sent_at: 13
  account: perm-node-2
- name: Node 1 reads the general channel
  type: call
  app: '{{context_id}}'
  method: channel
  args:
    channel: general
  account: perm-node-1
  outputs:
    n1_general: rpc
- name: Assert node 1 sees every message and no rewrite
  type: assert
  statements:
  - contains({{n1_general}}, "hello from node one")
  - contains({{n1_general}}, "node two at m1")
  - contains({{n1_general}}, "hello from node two")
  - not_contains({{n1_general}}, "rewritten by node one")
  - not_contains({{n1_general}}, "off topic")
- name: Node 2 announces
  type: call
  app: '{{context_id}}'
  method: announce
  args:
    id: a1
    text: node two was here
    sent_at: 20
  account: perm-node-2
- name: Node 2 tries to remove its own announcement
  type: call
  app: '{{context_id}}'
  method: remove_announcement
  args:
    id: a1
  account: perm-node-2
  expected_failure: true
  outputs:
    self_remove_error: error
- name: Assert the author could not remove it
  type: assert
  statements:
  - is_set({{self_remove_error}})
- name: Node 1 removes it as the founding moderator
  type: call
  app: '{{context_id}}'
  method: remove_announcement
  args:
    id: a1
  account: perm-node-1
  outputs:
    n1_removed: rpc
- name: Assert node 1 removed it
  type: json_assert
  statements:
  - 'json_equal({{n1_removed}}, {"output": true})'
- name: Node 2 reads the announcements
  type: call
  app: '{{context_id}}'
  method: announcements
  args: {}
  account: perm-node-2
  outputs:
    n2_announcements: rpc
- name: Assert the announcement is gone on node 2
  type: json_assert
  statements:
  - 'json_equal({{n2_announcements}}, {"output": []})'
- name: Node 2 tries to appoint itself
  type: call
  app: '{{context_id}}'
  method: add_moderator
  args:
    account: '{{acct_node2}}'
  account: perm-node-2
  expected_failure: true
  outputs:
    appoint_error: error
- name: Assert node 2 could not appoint itself
  type: assert
  statements:
  - is_set({{appoint_error}})
- name: Node 1 appoints node 2
  type: call
  app: '{{context_id}}'
  method: add_moderator
  args:
    account: '{{acct_node2}}'
  account: perm-node-1
- name: Node 1 announces
  type: call
  app: '{{context_id}}'
  method: announce
  args:
    id: a2
    text: all hands at noon
    sent_at: 30
  account: perm-node-1
- name: Node 2 removes node 1's announcement as a moderator
  type: call
  app: '{{context_id}}'
  method: remove_announcement
  args:
    id: a2
  account: perm-node-2
  outputs:
    n2_removed: rpc
- name: Assert node 2 removed it
  type: json_assert
  statements:
  - 'json_equal({{n2_removed}}, {"output": true})'
- name: Node 1 reads the announcements
  type: call
  app: '{{context_id}}'
  method: announcements
  args: {}
  account: perm-node-1
  outputs:
    n1_announcements: rpc
- name: Assert node 1 accepted the appointed moderator's removal
  type: json_assert
  statements:
  - 'json_equal({{n1_announcements}}, {"output": []})'
- name: Node 1 creates a page
  type: call
  app: '{{context_id}}'
  method: create_page
  args:
    id: home
    title: Home
    text: welcome
  account: perm-node-1
- name: Node 2 tries to rename node 1's page
  type: call
  app: '{{context_id}}'
  method: rename_page
  args:
    id: home
    title: Taken over
  account: perm-node-2
  expected_failure: true
  outputs:
    rename_error: error
- name: Node 2 tries to add a revision to node 1's page
  type: call
  app: '{{context_id}}'
  method: add_revision
  args:
    id: home
    revision: r9
    text: defaced
  account: perm-node-2
  expected_failure: true
  outputs:
    revision_error: error
- name: Assert both were refused
  type: assert
  statements:
  - is_set({{rename_error}})
  - is_set({{revision_error}})
- name: Node 1 adds a revision
  type: call
  app: '{{context_id}}'
  method: add_revision
  args:
    id: home
    revision: r2
    text: welcome back
  account: perm-node-1
- name: Node 2 reads the page
  type: call
  app: '{{context_id}}'
  method: page
  args:
    author: '{{acct_node1}}'
    id: home
  account: perm-node-2
  outputs:
    n2_page: rpc
- name: Assert node 2 sees the author's revision and nothing of its own
  type: assert
  statements:
  - contains({{n2_page}}, "welcome back")
  - contains({{n2_page}}, "Home")
  - not_contains({{n2_page}}, "defaced")
  - not_contains({{n2_page}}, "Taken over")
- name: Node 2 files evidence
  type: call
  app: '{{context_id}}'
  method: file_evidence
  args:
    kind: log
    body: boot ok
  account: perm-node-2
  outputs:
    n2_hash: result
- name: Node 1 reads the evidence by hash
  type: call
  app: '{{context_id}}'
  method: evidence
  args:
    hash: '{{n2_hash}}'
  account: perm-node-1
  outputs:
    n1_evidence: rpc
- name: Node 1 queries evidence by kind
  type: call
  app: '{{context_id}}'
  method: evidence_of_kind
  args:
    kind: log
  account: perm-node-1
  outputs:
    n1_logs: rpc
- name: Assert node 1 holds node 2's evidence
  type: assert
  statements:
  - contains({{n1_evidence}}, "boot ok")
  - contains({{n1_logs}}, "boot ok")
- name: Node 1 files the same content
  type: call
  app: '{{context_id}}'
  method: file_evidence
  args:
    kind: log
    body: boot ok
  account: perm-node-1
  outputs:
    n1_hash: result
- name: Assert equal content has one hash on both nodes
  type: assert
  statements:
  - equal({{n1_hash}}, {{n2_hash}})
