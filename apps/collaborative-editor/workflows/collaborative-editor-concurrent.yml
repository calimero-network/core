description: >
  Two-node concurrent editing over RGA. NOT the acceptance test for the Fugue
  rework - measured against this tree it PASSES on RGA, which is exactly what a
  scenario that fails to pose the question looks like when siblings are ordered
  by id.

  The reason is that RGA orders same-origin siblings by id, so the outcome turns
  on the relative ORDER of the ids, not on concurrency alone. Here each writer
  types its passage and then its heading back-to-back, giving P1<H1<P2<H2 - and
  each heading still lands beside its own passage. Nor does omitting
  `wait_for_sync` create concurrency: gossip on loopback propagates in
  milliseconds while the HTTP round-trips take tens of them, so back-to-back
  calls simply serialise.

  The real acceptance scenario is `apps/fugue-collab/workflows/fugue-collab-figure2.yml`,
  which goes round-robin (P1<P2<P3<H1<H2<H3) and asserts isolation before every
  write.

  Kept as an ordinary two-node concurrent-editing smoke test, which it is.
name: Collaborative Editor Concurrent Workflow

force_pull_image: true

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: calimero-node

steps:
  - name: Install Collaborative Editor on Node 1
    type: install_application
    node: calimero-node-1
    path: ../../dist/com.calimero.collaborative-editor-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create Mesh
    type: create_mesh
    context_node: calimero-node-1
    application_id: "{{app_id}}"
    nodes:
      - calimero-node-2
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  # Node 2 cannot write into a context whose delta log is empty, which is all
  # `create_mesh` leaves it with, and Figure 2 starts from a non-empty document
  # anyway. The seed must land before the four concurrent edits, with no wait or
  # sync between them, or they stop being concurrent.
  - name: Seed the document from Node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "existing text. "

  - name: Wait for seed to propagate to Node 2
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
    timeout: 60
    trigger_sync: true

  - name: Get Seeded Text (Node 2)
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      seeded_text_node2: result

  - name: Assert Node 2 genuinely has the seeded text
    type: json_assert
    statements:
      - 'json_equal({{seeded_text_node2}}, {"output": "existing text. "})'

  # Both nodes append at position 15, the seeded length, then insert a heading
  # back at 15 - their own prior insert there shifts nothing else - with no
  # propagation wait between Node 1's pair of edits and Node 2's.
  - name: Node 1 types passage
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "PASSAGE1"

  - name: Node 1 goes back and types heading
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "HEAD1"

  - name: Node 2 types passage
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "PASSAGE2"

  - name: Node 2 goes back and types heading
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "HEAD2"

  - name: Wait for interleaving edits to propagate
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
    timeout: 60
    trigger_sync: true

  - name: Get Text After Interleaving (Node 1)
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      interleave_text_node1: result

  - name: Get Text After Interleaving (Node 2)
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      interleave_text_node2: result

  - name: Assert both nodes converged on interleaving case
    type: json_assert
    statements:
      - 'json_equal({{interleave_text_node1}}, {{interleave_text_node2}})'

  # Contiguity assertions: each node's heading must stay immediately adjacent
  # to its own passage, on both replicas.
  - name: Assert each contribution stays contiguous (Node 1's view)
    type: assert
    statements:
      - "contains({{interleave_text_node1}}, 'HEAD1PASSAGE1')"
      - "contains({{interleave_text_node1}}, 'HEAD2PASSAGE2')"

  - name: Assert each contribution stays contiguous (Node 2's view)
    type: assert
    statements:
      - "contains({{interleave_text_node2}}, 'HEAD1PASSAGE1')"
      - "contains({{interleave_text_node2}}, 'HEAD2PASSAGE2')"

stop_all_nodes: false
restart: false
wait_timeout: 60
