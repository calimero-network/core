name: Team Metrics Custom Test
description: Test team metrics with custom Mergeable implementation

force_pull_image: true

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: team-custom-node

steps:
  - name: Install Team Metrics Custom Application on Node 1
    type: install_application
    node: team-custom-node-1
    path: ../../dist/com.calimero.team-metrics-custom-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create Mesh
    type: create_mesh
    context_node: team-custom-node-1
    application_id: "{{app_id}}"
    nodes:
      - team-custom-node-2
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  - name: Record win for team-alpha (Node 1)
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: record_win
    args:
      team_id: team-alpha
    outputs:
      win_1: result.output

  - name: Assert win count is 1
    type: assert
    statements:
      - "{{win_1}} == 1"

  - name: Record another win for team-alpha (Node 1)
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: record_win
    args:
      team_id: team-alpha
    outputs:
      win_2: result.output

  - name: Assert win count is 2
    type: assert
    statements:
      - "{{win_2}} == 2"

  - name: Wait for broadcast
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - team-custom-node-1
      - team-custom-node-2
    timeout: 60
    trigger_sync: true

  - name: Get wins from Node 1
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_wins
    args:
      team_id: team-alpha
    outputs:
      wins_node1: result.output

  - name: Get wins from Node 2
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: get_wins
    args:
      team_id: team-alpha
    outputs:
      wins_node2: result.output

  - name: Assert all nodes have wins=2
    type: assert
    statements:
      - "{{wins_node1}} == 2"
      - "{{wins_node2}} == 2"

  - name: Node 1 records win
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: record_win
    args:
      team_id: team-alpha

  - name: Node 2 records win concurrently
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: record_win
    args:
      team_id: team-alpha

  - name: Wait for concurrent wins to merge
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - team-custom-node-1
      - team-custom-node-2
    timeout: 60
    trigger_sync: true

  - name: Get wins from Node 1 after concurrent
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_wins
    args:
      team_id: team-alpha
    outputs:
      wins_after_concurrent_1: result.output

  - name: Get wins from Node 2 after concurrent
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: get_wins
    args:
      team_id: team-alpha
    outputs:
      wins_after_concurrent_2: result.output

  - name: Assert wins is 4 on all nodes (2 + 1 + 1)
    type: assert
    statements:
      - "{{wins_after_concurrent_1}} == 4"
      - "{{wins_after_concurrent_2}} == 4"

  - name: Record loss for team-alpha (Node 1)
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: record_loss
    args:
      team_id: team-alpha
    outputs:
      loss_1: result.output

  - name: Assert loss count is 1
    type: assert
    statements:
      - "{{loss_1}} == 1"

  - name: Wait for broadcast
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - team-custom-node-1
      - team-custom-node-2
    timeout: 60
    trigger_sync: true

  - name: Get losses from Node 2
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: get_losses
    args:
      team_id: team-alpha
    outputs:
      losses_node2: result.output

  - name: Assert Node 2 sees loss
    type: assert
    statements:
      - "{{losses_node2}} == 1"

  - name: Record draw for team-alpha (Node 2)
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: record_draw
    args:
      team_id: team-alpha
    outputs:
      draw_1: result.output

  - name: Assert draw count is 1
    type: assert
    statements:
      - "{{draw_1}} == 1"

  - name: Wait for broadcast
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - team-custom-node-1
      - team-custom-node-2
    timeout: 60
    trigger_sync: true

  - name: Get draws from Node 1
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_draws
    args:
      team_id: team-alpha
    outputs:
      draws_node1: result.output

  - name: Assert Node 1 sees draw
    type: assert
    statements:
      - "{{draws_node1}} == 1"

  - name: Test different team (Node 2)
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: record_win
    args:
      team_id: team-beta
    outputs:
      beta_win_1: result.output

  - name: Assert team-beta win is 1
    type: assert
    statements:
      - "{{beta_win_1}} == 1"

  - name: Wait for broadcast
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - team-custom-node-1
      - team-custom-node-2
    timeout: 60
    trigger_sync: true

  - name: Get team-beta wins from Node 1
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_wins
    args:
      team_id: team-beta
    outputs:
      beta_wins_node1: result.output

  - name: Assert Node 1 sees team-beta
    type: assert
    statements:
      - "{{beta_wins_node1}} == 1"

  - name: Verify team-alpha stats still correct on Node 1
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_wins
    args:
      team_id: team-alpha
    outputs:
      final_wins_alpha: result.output

  - name: Verify team-alpha losses on Node 1
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_losses
    args:
      team_id: team-alpha
    outputs:
      final_losses_alpha: result.output

  - name: Verify team-alpha draws on Node 1
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_draws
    args:
      team_id: team-alpha
    outputs:
      final_draws_alpha: result.output

  - name: Assert team-alpha final stats
    type: assert
    statements:
      - "{{final_wins_alpha}} == 4"
      - "{{final_losses_alpha}} == 1"
      - "{{final_draws_alpha}} == 1"

  # ---------------------------------------------------------------------------
  # The app's OWN merge rule.
  #
  # Everything above exercises `Counter`, which converges structurally whether
  # or not the app declares a rule — a counter is its own child entity and the
  # storage layer sums it. Those steps would pass with `TeamStats::merge`
  # deleted, so they cannot tell you the merge function ran.
  #
  # `badges` is a plain `u64` in the value blob. Each node awards the badge for
  # its own device, so the two blobs genuinely diverge, and the union is a value
  # NEITHER node ever held. Last-write-wins can only ever return one side's
  # blob, so a two-bit answer is only reachable through a dispatched merge.
  #
  # This is the only assertion in the repo that proves app-defined merge runs
  # across real nodes: the in-process test at
  # calimero-storage/tests/custom_merge_e2e.rs proves the mechanism, and the
  # convergence harness cannot do it at all (see tests/converge.rs).
  # ---------------------------------------------------------------------------
  - name: Node 1 awards its own badge
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: award_own_badge
    args:
      team_id: team-alpha

  - name: Node 2 awards its own badge concurrently
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: award_own_badge
    args:
      team_id: team-alpha

  - name: Wait for the badge blobs to merge
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - team-custom-node-1
      - team-custom-node-2
    timeout: 60
    trigger_sync: true

  - name: Count badges on Node 1
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_badge_count
    args:
      team_id: team-alpha
    outputs:
      badge_count_node1: result.output

  - name: Count badges on Node 2
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: get_badge_count
    args:
      team_id: team-alpha
    outputs:
      badge_count_node2: result.output

  - name: Read the raw mask on both nodes
    type: call
    node: team-custom-node-1
    context_id: "{{context_id}}"
    method: get_badges
    args:
      team_id: team-alpha
    outputs:
      badges_node1: result.output

  - name: Read the raw mask on Node 2
    type: call
    node: team-custom-node-2
    context_id: "{{context_id}}"
    method: get_badges
    args:
      team_id: team-alpha
    outputs:
      badges_node2: result.output

  # A count of 2 is the claim. 1 on either side means the blob was resolved by
  # last-write-wins and one node's award was discarded — exactly the data loss
  # app-defined merge exists to prevent. The mask equality is the convergence
  # check; on its own it would pass for a wrong-but-agreed value.
  - name: Assert both nodes hold both badges
    type: assert
    statements:
      - "{{badge_count_node1}} == 2"
      - "{{badge_count_node2}} == 2"
      - "{{badges_node1}} == {{badges_node2}}"

stop_all_nodes: false
restart: false
wait_timeout: 120
