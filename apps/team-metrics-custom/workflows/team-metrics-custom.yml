# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x6: replication is synchronous: a read sees every committed write
name: Team Metrics Custom Test
description: Test team metrics with custom Mergeable implementation
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 5000
accounts:
- team-custom-node-1
- team-custom-node-2
steps:
- name: Install Team Metrics Custom Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/team_metrics_custom.wasm'
  outputs:
    app_id_bundle: hash
  account: team-custom-node-1
- type: set
  values:
    app_id: com.calimero.team-metrics-custom
- name: Create Mesh
  type: create_org
  account: team-custom-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: team-custom-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: team-custom-node-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: team-custom-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/team_metrics_custom.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Record win for team-alpha (Node 1)
  type: call
  app: '{{context_id}}'
  method: record_win
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    win_1: result
- name: Assert win count is 1
  type: assert
  statements:
  - '{{win_1}} == 1'
- name: Record another win for team-alpha (Node 1)
  type: call
  app: '{{context_id}}'
  method: record_win
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    win_2: result
- name: Assert win count is 2
  type: assert
  statements:
  - '{{win_2}} == 2'
- name: Get wins from Node 1
  type: call
  app: '{{context_id}}'
  method: get_wins
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    wins_node1: result
- name: Get wins from Node 2
  type: call
  app: '{{context_id}}'
  method: get_wins
  args:
    team_id: team-alpha
  account: team-custom-node-2
  outputs:
    wins_node2: result
- name: Assert all nodes have wins=2
  type: assert
  statements:
  - '{{wins_node1}} == 2'
  - '{{wins_node2}} == 2'
- name: Node 1 records win
  type: call
  app: '{{context_id}}'
  method: record_win
  args:
    team_id: team-alpha
  account: team-custom-node-1
- name: Node 2 records win concurrently
  type: call
  app: '{{context_id}}'
  method: record_win
  args:
    team_id: team-alpha
  account: team-custom-node-2
- name: Get wins from Node 1 after concurrent
  type: call
  app: '{{context_id}}'
  method: get_wins
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    wins_after_concurrent_1: result
- name: Get wins from Node 2 after concurrent
  type: call
  app: '{{context_id}}'
  method: get_wins
  args:
    team_id: team-alpha
  account: team-custom-node-2
  outputs:
    wins_after_concurrent_2: result
- name: Assert wins is 4 on all nodes (2 + 1 + 1)
  type: assert
  statements:
  - '{{wins_after_concurrent_1}} == 4'
  - '{{wins_after_concurrent_2}} == 4'
- name: Record loss for team-alpha (Node 1)
  type: call
  app: '{{context_id}}'
  method: record_loss
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    loss_1: result
- name: Assert loss count is 1
  type: assert
  statements:
  - '{{loss_1}} == 1'
- name: Get losses from Node 2
  type: call
  app: '{{context_id}}'
  method: get_losses
  args:
    team_id: team-alpha
  account: team-custom-node-2
  outputs:
    losses_node2: result
- name: Assert Node 2 sees loss
  type: assert
  statements:
  - '{{losses_node2}} == 1'
- name: Record draw for team-alpha (Node 2)
  type: call
  app: '{{context_id}}'
  method: record_draw
  args:
    team_id: team-alpha
  account: team-custom-node-2
  outputs:
    draw_1: result
- name: Assert draw count is 1
  type: assert
  statements:
  - '{{draw_1}} == 1'
- name: Get draws from Node 1
  type: call
  app: '{{context_id}}'
  method: get_draws
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    draws_node1: result
- name: Assert Node 1 sees draw
  type: assert
  statements:
  - '{{draws_node1}} == 1'
- name: Test different team (Node 2)
  type: call
  app: '{{context_id}}'
  method: record_win
  args:
    team_id: team-beta
  account: team-custom-node-2
  outputs:
    beta_win_1: result
- name: Assert team-beta win is 1
  type: assert
  statements:
  - '{{beta_win_1}} == 1'
- name: Get team-beta wins from Node 1
  type: call
  app: '{{context_id}}'
  method: get_wins
  args:
    team_id: team-beta
  account: team-custom-node-1
  outputs:
    beta_wins_node1: result
- name: Assert Node 1 sees team-beta
  type: assert
  statements:
  - '{{beta_wins_node1}} == 1'
- name: Verify team-alpha stats still correct on Node 1
  type: call
  app: '{{context_id}}'
  method: get_wins
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    final_wins_alpha: result
- name: Verify team-alpha losses on Node 1
  type: call
  app: '{{context_id}}'
  method: get_losses
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    final_losses_alpha: result
- name: Verify team-alpha draws on Node 1
  type: call
  app: '{{context_id}}'
  method: get_draws
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    final_draws_alpha: result
- name: Assert team-alpha final stats
  type: assert
  statements:
  - '{{final_wins_alpha}} == 4'
  - '{{final_losses_alpha}} == 1'
  - '{{final_draws_alpha}} == 1'
- name: Node 1 awards badge 0
  type: call
  app: '{{context_id}}'
  method: award_badge
  args:
    team_id: team-alpha
    badge: 0
  account: team-custom-node-1
- name: Node 2 awards badge 1 concurrently
  type: call
  app: '{{context_id}}'
  method: award_badge
  args:
    team_id: team-alpha
    badge: 1
  account: team-custom-node-2
- name: Count badges on Node 1
  type: call
  app: '{{context_id}}'
  method: get_badge_count
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    badge_count_node1: result
- name: Count badges on Node 2
  type: call
  app: '{{context_id}}'
  method: get_badge_count
  args:
    team_id: team-alpha
  account: team-custom-node-2
  outputs:
    badge_count_node2: result
- name: Read the raw mask on both nodes
  type: call
  app: '{{context_id}}'
  method: get_badges
  args:
    team_id: team-alpha
  account: team-custom-node-1
  outputs:
    badges_node1: result
- name: Read the raw mask on Node 2
  type: call
  app: '{{context_id}}'
  method: get_badges
  args:
    team_id: team-alpha
  account: team-custom-node-2
  outputs:
    badges_node2: result
- name: Assert both nodes hold both badges
  type: assert
  statements:
  - '{{badge_count_node1}} == 2'
  - '{{badge_count_node2}} == 2'
  - '{{badges_node1}} == {{badges_node2}}'
