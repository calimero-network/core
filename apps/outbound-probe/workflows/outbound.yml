# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x3: v1 node logs
#   assert_log_present x2: v1 node logs
#   script x3: scripts drive v1 node RPC URLs
#   start_node x1: a user's node going offline has no counterpart in a cluster
#   stop_node x1: a user's node going offline has no counterpart in a cluster
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# Changed for release-v2:
#   - The probe is installed as its signed release (`install_package`) and the
#     app deployed from it: the node hands an outbound client only to a signed
#     release declaring its URL prefixes, never to an uploaded .wasm.
#   - The namespace's approval and revocation (v1's approve-outbound.sh) are
#     `POST /orgs/{org}/outbound` with the owner's passkey.
#   - v1's per-node operator switch (enable-outbound.sh; "outbound-b never
#     turns it on") has no counterpart: `cluster.settings` is the cluster's one
#     outbound config, and a call runs on the app's leader whichever node took
#     it. Outbound off is outbound-off.yml; here outbound-b's call goes through
#     the same gates as outbound-a's.
name: Outbound Requests — Every Gate, End To End
description: "An app method asks its node for one HTTPS request (`env::http_request`). The node makes\
  \ it only when its operator turned outbound requests on for the host, the app's signed manifest declares\
  \ a URL prefix covering it, the app's namespace approved that prefix for the app's publisher, and the\
  \ run writes state on this node. A secret the request names is filled in by the node and removed from\
  \ the answer.\nThe probe's node (outbound-a) starts with outbound off, then its operator turns it on.\
  \ Its peer (outbound-b) never does. `.test` hosts are answered in-process by the test build's echo (`[outbound.testing]`),\
  \ which sees exactly what the node would have sent, after every gate.\nWHAT GOES RED, AND WHY:\n  *\
  \ Off by default: before the operator's config, `probe` traps.\n  * The namespace approves: with the\
  \ operator's config but no approval, a\n    declared URL is refused `NotApproved`; after an admin approves\
  \ the\n    manifest's prefixes it goes through, and after they revoke them it is\n    refused `NotApproved`\
  \ again.\n  * The request carries the secret and the app never sees it: the echo\n    reports two secrets\
  \ substituted (header and body), and the answer the\n    app stores shows `[redacted]` where they were,\
  \ never the value.\n  * Gates: a path outside the declared prefix and a host the operator did\n    not\
  \ allow come back as reasons, not requests.\n  * One request per run: a second request traps the run,\
  \ and the write made\n    before it is not committed.\n  * Views never reach the network: `probe_in_view`\
  \ traps.\n  * The request runs once, on the executing node: outbound-b holds the same\n    stored outcome\
  \ after sync, logs no request of its own, and its own\n    `probe` traps because its operator never\
  \ turned outbound on.\n\nMEROD MUST BE BUILT WITH `--features calimero-cloud-node/outbound-testing`,\
  \ which compiles `[outbound.testing]`; every node starts with `cluster.settings` below (`merod run\
  \ --settings`), and a build without the feature refuses it.\nRun locally, with an outbound-testing merod:\n\
  \  cargo build -p merod --features calimero-cloud-node/outbound-testing\n  python3 scripts/build-cloud-v2-fixtures.py\
  \ outbound-probe\n  MEROD_OUTBOUND_BINARY=target/debug/merod python3 scripts/cloud-v2-workflows.py \\\n  \
  \  apps/outbound-probe/workflows/outbound.yml\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3860
  # A merod built with `--features calimero-cloud-node/outbound-testing`
  # (e2e.yml's fixtures build it), else MEROD_BINARY's, which refuses the
  # settings below.
  binary: '{{env.MEROD_OUTBOUND_BINARY ?? env.MEROD_BINARY}}'
  # Every node's `--settings`: outbound on for the echo host, the test
  # build's in-process echo for `.test` hosts, and ECHO_KEY for the probe's
  # package as `cargo mero bundle --dev` signs it (the well-known dev key,
  # tools/mero-sign's DEV_SEED).
  settings: |
    [outbound]
    enabled = true
    hosts = ["echo.outbound.test"]

    [outbound.testing]
    echo = true

    [outbound.testing.secrets.ECHO_KEY]
    value = "s3cr3t-e2e"
    packages = ["com.calimero.outbound-probe"]
    signers = ["did:key:z6MknF3p5L5FDHJQ7FREUapuX4Wmp4MtF6WrHYaXS2B3eZQd"]
    hosts = ["echo.outbound.test"]
accounts:
- outbound-a
- outbound-b
steps:
- name: Install the probe's signed release
  type: install_package
  account: outbound-a
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.outbound-probe-1.0.0.mpk'
  outputs:
    pkg: package
    ver: version
- name: Create Mesh
  type: create_org
  account: outbound-a
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: outbound-a
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: outbound-b
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: outbound-a
  org: '{{namespace_id}}'
  package: '{{pkg}}'
  version: '{{ver}}'
  app_name: Create Mesh
  outputs:
    context_id: contextId
- name: Assert the mesh came up
  type: assert
  statements:
  - is_set({{context_id}})
- name: A declared URL the namespace has not approved
  type: call
  app: '{{context_id}}'
  method: probe_url
  args:
    url: https://echo.outbound.test/v1/check
  account: outbound-a
  outputs:
    unapproved: rpc
- name: Assert it was refused NotApproved, with no request made
  type: assert
  statements:
  - contains({{unapproved}}, refused:)
  - contains({{unapproved}}, [NotApproved])
  - not_contains({{unapproved}}, 200 {)
- name: The namespace approves the manifest's prefixes for the probe's publisher
  type: http
  method: post
  path: orgs/{{namespace_id}}/outbound
  body:
    package: com.calimero.outbound-probe
  account: outbound-a
- name: Probe the declared prefix, naming the secret in a header and the body
  type: call
  app: '{{context_id}}'
  method: probe
  args:
    path: check?n=1
    body: n=1
  account: outbound-a
  outputs:
    probed: rpc
- name: The echo saw the request the node sent, with both secrets filled in
  type: assert
  statements:
  - regex({{probed}}, 200 \{)
  - contains({{probed}}, /v1/check)
  - regex({{probed}}, .secrets.:2)
  - contains({{probed}}, n=1&key=[redacted])
  - not_contains({{probed}}, s3cr3t-e2e)
- name: A path outside the declared prefix
  type: call
  app: '{{context_id}}'
  method: probe_url
  args:
    url: https://echo.outbound.test/v2/check
  account: outbound-a
  outputs:
    outside: rpc
- name: Assert it was refused for its prefix
  type: assert
  statements:
  - contains({{outside}}, refused:)
  - contains({{outside}}, no URL prefix)
- name: A host the operator did not allow
  type: call
  app: '{{context_id}}'
  method: probe_url
  args:
    url: https://elsewhere.outbound.test/v1/check
  account: outbound-a
  outputs:
    elsewhere: rpc
- name: Assert it was refused for its host
  type: assert
  statements:
  - contains({{elsewhere}}, refused:)
  - contains({{elsewhere}}, not a host this node's operator allows)
- name: A second request in one run traps it
  type: call
  app: '{{context_id}}'
  method: probe_twice
  args: {}
  account: outbound-a
  expected_failure: true
- name: A view asking for a request traps
  type: call
  app: '{{context_id}}'
  method: probe_in_view
  args: {}
  account: outbound-a
  expected_failure: true
- name: What outbound-a stored last
  type: call
  app: '{{context_id}}'
  method: last
  args: {}
  account: outbound-a
  outputs:
    a_last: rpc
    a_last_text: result
- name: The trapped run's write was not committed
  type: assert
  statements:
  - contains({{a_last}}, not a host this node's operator allows)
  - not_contains({{a_last}}, written before the second request)
- name: What outbound-b holds
  type: call
  app: '{{context_id}}'
  method: last
  args: {}
  account: outbound-b
  outputs:
    b_last: rpc
- name: outbound-b holds the same outcome
  type: json_assert
  statements:
  - json_equal({{a_last}}, {{b_last}})
- name: outbound-b's call runs on the leader, through the same gates
  type: call
  app: '{{context_id}}'
  method: probe
  args:
    path: check
    body: n=2
  account: outbound-b
  outputs:
    b_probed: rpc
- name: Assert outbound-b's request went out too
  type: assert
  statements:
  - regex({{b_probed}}, 200 \{)
- name: The namespace revokes every prefix it approved
  type: http
  method: post
  path: orgs/{{namespace_id}}/outbound
  body:
    package: com.calimero.outbound-probe
    prefixes: []
    replace: true
  account: outbound-a
- name: The same declared URL, after the revocation
  type: call
  app: '{{context_id}}'
  method: probe_url
  args:
    url: https://echo.outbound.test/v1/check
  account: outbound-a
  outputs:
    revoked: rpc
- name: Assert it is refused NotApproved again
  type: assert
  statements:
  - contains({{revoked}}, refused:)
  - contains({{revoked}}, [NotApproved])
