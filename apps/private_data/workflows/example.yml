# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: Sample Calimero Workflow
description: A sample workflow that demonstrates the bootstrap functionality with dynamic value capture
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3880
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/private_data.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.private-data
- name: Create Mesh
  type: create_org
  account: calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: calimero-node-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/private_data.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Execute Contract Call - Add Secret
  type: call
  app: '{{context_id}}'
  method: add_secret
  args:
    game_id: game-1
    secret: s3cr3t
  account: calimero-node-1
  outputs:
    add_secret_result: rpc
    game_1_id: result
- name: Assert add_secret executed
  type: assert
  statements:
  - is_set({{add_secret_result}})
- name: Capture the games map on calimero-node-1
  type: call
  app: '{{context_id}}'
  method: games
  args: {}
  account: calimero-node-1
  outputs:
    games_after_add: result
- name: Execute View Call - My Secrets (node 1)
  type: call
  app: '{{context_id}}'
  method: my_secrets
  args: {}
  account: calimero-node-1
  outputs:
    my_secrets_node1_result: rpc
- name: Assert node-1 has private secret for game-1
  type: json_assert
  statements:
  - 'json_subset({{my_secrets_node1_result}}, {"output": {"{{game_1_id}}": "s3cr3t"}})'
- name: Execute View Call - Games
  type: call
  app: '{{context_id}}'
  method: games
  args: {}
  account: calimero-node-2
  outputs:
    games_result: rpc
- name: Assert games contains expected hash for game-1
  type: json_assert
  statements:
  - 'json_subset({{games_result}}, {"output": {"{{game_1_id}}": "4e738ca5563c06cfd0018299933d58db1dd8bf97f6973dc99bf6cdc64b5550bd"}})'
- name: Execute View Call - My Secrets (node-2)
  type: call
  app: '{{context_id}}'
  method: my_secrets
  args: {}
  account: calimero-node-2
  outputs:
    my_secrets_result: rpc
- name: Assert node-2 has no private secrets
  type: json_assert
  statements:
  - 'json_equal({{my_secrets_result}}, {"output": {}})'
- name: Execute Contract Call - Guess OK
  type: call
  app: '{{context_id}}'
  method: add_guess
  args:
    game_id: '{{game_1_id}}'
    guess: s3cr3t
  account: calimero-node-1
  outputs:
    guess_ok_result: rpc
- name: Assert guess OK returned true
  type: json_assert
  statements:
  - 'json_equal({{guess_ok_result}}, {"output": true})'
- name: Execute Contract Call - Guess Bad
  type: call
  app: '{{context_id}}'
  method: add_guess
  args:
    game_id: '{{game_1_id}}'
    guess: wrong
  account: calimero-node-2
  outputs:
    guess_bad_result: rpc
- name: Assert guess Bad returned false
  type: json_assert
  statements:
  - 'json_equal({{guess_bad_result}}, {"output": false})'
