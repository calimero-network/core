# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x4: replication is synchronous: a read sees every committed write
name: KV-store shared storage workflow
description: KV-Store shared storage workflow test
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3790
accounts:
- new-calimero-node-1
- new-calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_shared_storage.wasm'
  outputs:
    app_id_bundle: hash
  account: new-calimero-node-1
- type: set
  values:
    app_id: com.calimero.kv-store-with-shared-storage
- name: Create Mesh
  type: create_org
  account: new-calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: new-calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: new-calimero-node-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: new-calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_shared_storage.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Node 1 (initial writer) sets value
  type: call
  app: '{{context_id}}'
  method: set_shared
  args:
    value: initial-from-node1
  account: new-calimero-node-1
- name: Node 1 reads its own write
  type: call
  app: '{{context_id}}'
  method: get_shared
  args: {}
  account: new-calimero-node-1
  outputs:
    node1_read: rpc
- name: Assert node 1 read matches
  type: json_assert
  statements:
  - 'json_equal({{node1_read}}, {"output": "initial-from-node1"})'
- name: Node 2 reads the synced value
  type: call
  app: '{{context_id}}'
  method: get_shared
  args: {}
  account: new-calimero-node-2
  outputs:
    node2_read: rpc
- name: Assert node 2 read matches
  type: json_assert
  statements:
  - 'json_equal({{node2_read}}, {"output": "initial-from-node1"})'
- name: Node 1 (writer) sets a map entry
  type: call
  app: '{{context_id}}'
  method: map_set
  args:
    key: greeting
    value: hello
  account: new-calimero-node-1
- name: Node 2 reads the writer's map entry
  type: call
  app: '{{context_id}}'
  method: map_get
  args:
    key: greeting
  account: new-calimero-node-2
  outputs:
    node2_map_read: rpc
- name: Assert the writer's guarded map entry converged to node 2
  type: json_assert
  statements:
  - 'json_equal({{node2_map_read}}, {"output": "hello"})'
- name: Account of node 2
  type: call
  app: '{{context_id}}'
  method: my_account
  args: {}
  account: new-calimero-node-2
  outputs:
    acct_node2: result
- name: Node 2 (non-writer) attempts to rotate the writer set to itself
  type: call
  app: '{{context_id}}'
  method: try_rotate_writers
  args:
    new_writers:
    - '{{acct_node2}}'
  account: new-calimero-node-2
  outputs:
    node2_rotate_accepted: rpc
- name: Assert node 2's non-writer rotation was refused
  type: json_assert
  statements:
  - 'json_equal({{node2_rotate_accepted}}, {"output": false})'
- name: Node 1 reads the writer count after the refused rotation
  type: call
  app: '{{context_id}}'
  method: writer_count
  args: {}
  account: new-calimero-node-1
  outputs:
    node1_writer_count: rpc
- name: Assert the writer set is unchanged on the honest node (still 1)
  type: json_assert
  statements:
  - 'json_equal({{node1_writer_count}}, {"output": 1})'
- name: Node 1 rotates writer set to node 2
  type: call
  app: '{{context_id}}'
  method: rotate_writers
  args:
    new_writers:
    - '{{acct_node2}}'
  account: new-calimero-node-1
- name: Node 2 (new writer) sets value after rotation
  type: call
  app: '{{context_id}}'
  method: set_shared
  args:
    value: post-rotation-from-node2
  account: new-calimero-node-2
- name: Node 1 reads the post-rotation value
  type: call
  app: '{{context_id}}'
  method: get_shared
  args: {}
  account: new-calimero-node-1
  outputs:
    node1_read_after_rotation: rpc
- name: Assert node 1 sees post-rotation value
  type: json_assert
  statements:
  - 'json_equal({{node1_read_after_rotation}}, {"output": "post-rotation-from-node2"})'
- name: Node 2 (non-writer for the map) forges a map write
  type: call
  app: '{{context_id}}'
  method: map_set
  args:
    key: evil
    value: forged
  account: new-calimero-node-2
- name: Let the forged delta attempt (and fail) to propagate
  type: wait
  seconds: 20.0
- name: Node 1 reads the entry the non-writer tried to set
  type: call
  app: '{{context_id}}'
  method: map_get
  args:
    key: evil
  account: new-calimero-node-1
  outputs:
    node1_evil_read: rpc
- name: Assert the non-writer's forged write did NOT reach node 1
  type: json_assert
  statements:
  - 'json_equal({{node1_evil_read}}, {"output": null})'
