[package]
name = "scaffolding-e2e-multi"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[package.metadata.workspaces]
independent = true

# A crate publishes one bundle, and a manifest carries either a top-level wasm
# or named services, so the multi-service fixture needs a manifest of its own.
[package.metadata.calimero]
package = "com.calimero.scaffolding-e2e-multi"
name = "Scaffolding E2E Multi-Service"
min-runtime-version = "0.0.0"

# Both services reuse scaffolding-e2e's wasm; under test is multi-service
# install + service_name selection, not two different programs.
[[package.metadata.calimero.services]]
name = "store-a"
crate = "scaffolding-e2e"

[[package.metadata.calimero.services]]
name = "store-b"
crate = "scaffolding-e2e"
