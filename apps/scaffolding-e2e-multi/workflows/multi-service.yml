# A release-v2 workflow for scaffolding-e2e-multi (it had no workflow of its
# own; scaffolding-e2e's group-multi-service uploads the shared WASM): the
# signed multi-service release is installed by name, and an app is deployed
# from each of its two services. Both services run scaffolding-e2e's WASM, so
# what is under test is the release's service selection and that the two apps
# are separate states.
name: Multi-service release on release-v2
description: One signed release with two services, an app deployed from each, their states kept apart
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 6080
accounts: [alice, bob]
steps:
  - name: Alice founds an organization
    type: create_org
    account: alice
    org_name: Multi
    outputs: { org: orgId }
  - name: An invite for Bob
    type: invite
    account: alice
    org: "{{org}}"
    role: member
    outputs: { token: token }
  - name: Bob joins
    type: redeem_invite
    account: bob
    token: "{{token}}"
  - name: Install the signed multi-service release
    type: install_package
    account: alice
    mpk: "{{env.CORE_WASM_DIR}}/dist/com.calimero.scaffolding-e2e-multi-1.0.0.mpk"
    outputs: { pkg: package, ver: version }
  - name: The release is the package's
    type: assert
    statements:
      - contains("{{pkg}}", "com.calimero.scaffolding-e2e-multi")
  - name: An app from service store-a
    type: deploy
    account: alice
    package: "{{pkg}}"
    version: "{{ver}}"
    service: store-a
    app_name: store-a
    org: "{{org}}"
    outputs: { app_a: appId }
  - name: An app from service store-b
    type: deploy
    account: alice
    package: "{{pkg}}"
    version: "{{ver}}"
    service: store-b
    app_name: store-b
    org: "{{org}}"
    outputs: { app_b: appId }
  - name: Two apps
    type: assert
    statements:
      - not_equal("{{app_a}}", "{{app_b}}")
  - name: A naming a service the release lacks is refused
    type: deploy
    account: alice
    package: "{{pkg}}"
    version: "{{ver}}"
    service: store-c
    app_name: store-c
    org: "{{org}}"
    expected_failure: true
  - name: Alice writes to store-a
    type: call
    account: alice
    app: "{{app_a}}"
    method: set
    args: { key: which, value: a }
  - name: Bob writes to store-b
    type: call
    account: bob
    app: "{{app_b}}"
    method: set
    args: { key: which, value: b }
  - name: store-a reads its own value
    type: view
    account: bob
    app: "{{app_a}}"
    method: get
    args: { key: which }
    expect: a
  - name: store-b reads its own value
    type: view
    account: alice
    app: "{{app_b}}"
    method: get
    args: { key: which }
    expect: b
  - name: Bob adds a second key to store-b only
    type: call
    account: bob
    app: "{{app_b}}"
    method: set
    args: { key: only-b, value: "1" }
  - name: store-a never saw it
    type: view
    account: alice
    app: "{{app_a}}"
    method: get
    args: { key: only-b }
    expect: null
  - name: store-a holds one entry
    type: view
    account: alice
    app: "{{app_a}}"
    method: len
    expect: 1
  - name: store-b holds two
    type: view
    account: bob
    app: "{{app_b}}"
    method: len
    expect: 2
