# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_log_absent x1: v1 node logs
#   heal_peers x1: a user's node cut off from its peers has no counterpart in a cluster
#   partition_peers x1: a user's node cut off from its peers has no counterpart in a cluster
#   start_node x2: a user's node going offline has no counterpart in a cluster
#   stop_node x2: a user's node going offline has no counterpart in a cluster
#   wait_for_sync x7: replication is synchronous: a read sees every committed write
name: Rich Collab Blocks
description: 'Block structure under concurrency, one document per case, one cluster boot. Four cases run
  inside a partition window; split-versus-type runs inside a stop_node window instead, because its specified
  outcome depends on the two sides never having seen each other and partition_peers is a no-op under --no-docker.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3900
accounts:
- rich-node-1
- rich-node-2
- rich-node-3
steps:
- name: Install rich-collab on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/rich_collab.wasm'
  outputs:
    app_id_bundle: hash
  account: rich-node-1
- type: set
  values:
    app_id: com.calimero.rich-collab
- name: Create a 3-node mesh
  type: create_org
  account: rich-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: rich-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: rich-node-2
  token: '{{_mesh_invite}}'
- type: invite
  account: rich-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: rich-node-3
  token: '{{_mesh_invite}}'
- name: Create a 3-node mesh
  type: deploy
  account: rich-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/rich_collab.wasm'
  app_name: Create a 3-node mesh
  outputs:
    context_id: contextId
- name: Create the merge document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: blocks-merge
  account: rich-node-1
- name: Add the merge head block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-merge
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    merge_head: result
- name: Add the merge tail block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-merge
    after: '{{merge_head}}'
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    merge_tail: result
- name: Type Left into the merge head block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-merge
    block: '{{merge_head}}'
    ops:
    - insert: Left
  account: rich-node-1
- name: Type a bolded Right into the merge tail block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-merge
    block: '{{merge_tail}}'
    ops:
    - insert: Right
      attributes:
        bold: 'true'
  account: rich-node-1
- name: Create the move-versus-edit document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: blocks-move-vs-edit
  account: rich-node-1
- name: Add the move-versus-edit Alpha block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-move-vs-edit
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    mve_alpha: result
- name: Add the move-versus-edit Beta block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-move-vs-edit
    after: '{{mve_alpha}}'
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    mve_beta: result
- name: Add the move-versus-edit Gamma block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-move-vs-edit
    after: '{{mve_beta}}'
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    mve_gamma: result
- name: Type Alpha into the move-versus-edit first block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-move-vs-edit
    block: '{{mve_alpha}}'
    ops:
    - insert: Alpha
  account: rich-node-1
- name: Type Beta into the move-versus-edit second block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-move-vs-edit
    block: '{{mve_beta}}'
    ops:
    - insert: Beta
  account: rich-node-1
- name: Type Gamma into the move-versus-edit third block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-move-vs-edit
    block: '{{mve_gamma}}'
    ops:
    - insert: Gamma
  account: rich-node-1
- name: Create the move-versus-move document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: blocks-move-vs-move
  account: rich-node-1
- name: Add the move-versus-move Alpha block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-move-vs-move
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    mvm_alpha: result
- name: Add the move-versus-move Beta block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-move-vs-move
    after: '{{mvm_alpha}}'
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    mvm_beta: result
- name: Add the move-versus-move Gamma block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-move-vs-move
    after: '{{mvm_beta}}'
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    mvm_gamma: result
- name: Type Alpha into the move-versus-move first block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-move-vs-move
    block: '{{mvm_alpha}}'
    ops:
    - insert: Alpha
  account: rich-node-1
- name: Type Beta into the move-versus-move second block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-move-vs-move
    block: '{{mvm_beta}}'
    ops:
    - insert: Beta
  account: rich-node-1
- name: Type Gamma into the move-versus-move third block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-move-vs-move
    block: '{{mvm_gamma}}'
    ops:
    - insert: Gamma
  account: rich-node-1
- name: Create the delete-versus-edit document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: blocks-delete-vs-edit
  account: rich-node-1
- name: Add the delete-versus-edit Alpha block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-delete-vs-edit
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    dve_alpha: result
- name: Add the delete-versus-edit Beta block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-delete-vs-edit
    after: '{{dve_alpha}}'
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    dve_beta: result
- name: Add the delete-versus-edit Gamma block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-delete-vs-edit
    after: '{{dve_beta}}'
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    dve_gamma: result
- name: Type Alpha into the delete-versus-edit first block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-delete-vs-edit
    block: '{{dve_alpha}}'
    ops:
    - insert: Alpha
  account: rich-node-1
- name: Type Beta into the delete-versus-edit second block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-delete-vs-edit
    block: '{{dve_beta}}'
    ops:
    - insert: Beta
  account: rich-node-1
- name: Type Gamma into the delete-versus-edit third block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-delete-vs-edit
    block: '{{dve_gamma}}'
    ops:
    - insert: Gamma
  account: rich-node-1
- name: Create the kind-versus-depth document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: blocks-kind-vs-depth
  account: rich-node-1
- name: Add the kind-versus-depth block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-kind-vs-depth
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    structure_block: result
- name: Type Alpha into the kind-versus-depth block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-kind-vs-depth
    block: '{{structure_block}}'
    ops:
    - insert: Alpha
  account: rich-node-1
- name: Create the split-versus-type document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: blocks-split-vs-type
  account: rich-node-1
- name: Add the split-versus-type block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: blocks-split-vs-type
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    split_block: result
- name: Type hello world into the split-versus-type block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-split-vs-type
    block: '{{split_block}}'
    ops:
    - insert: hello world
  account: rich-node-1
- name: Node 2 merges the tail block into the head block
  type: call
  app: '{{context_id}}'
  method: merge_blocks
  args:
    doc: blocks-merge
    first: '{{merge_head}}'
    second: '{{merge_tail}}'
  account: rich-node-2
- name: Settle after the partition takes effect
  type: wait
  seconds: 12.0
- name: Node 1 moves the third block to the top
  type: call
  app: '{{context_id}}'
  method: move_block
  args:
    doc: blocks-move-vs-edit
    block: '{{mve_gamma}}'
    after: null
  account: rich-node-1
  allow_failure: true
- name: Node 2 types into the block Node 1 is moving
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-move-vs-edit
    block: '{{mve_gamma}}'
    ops:
    - retain: 5
    - insert: ZZ
  account: rich-node-2
  allow_failure: true
- name: Node 1 moves the middle block to the top
  type: call
  app: '{{context_id}}'
  method: move_block
  args:
    doc: blocks-move-vs-move
    block: '{{mvm_beta}}'
    after: null
  account: rich-node-1
  allow_failure: true
- name: Node 2 moves the same block to the bottom
  type: call
  app: '{{context_id}}'
  method: move_block
  args:
    doc: blocks-move-vs-move
    block: '{{mvm_beta}}'
    after: '{{mvm_gamma}}'
  account: rich-node-2
  allow_failure: true
- name: Node 1 deletes the middle block
  type: call
  app: '{{context_id}}'
  method: delete_block
  args:
    doc: blocks-delete-vs-edit
    block: '{{dve_beta}}'
  account: rich-node-1
  allow_failure: true
- name: Node 2 types into the block Node 1 is deleting
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-delete-vs-edit
    block: '{{dve_beta}}'
    ops:
    - retain: 4
    - insert: ZZ
  account: rich-node-2
  allow_failure: true
- name: Node 1 retypes the block as a heading and aligns it
  type: call
  app: '{{context_id}}'
  method: set_kind
  args:
    doc: blocks-kind-vs-depth
    block: '{{structure_block}}'
    kind: heading
  account: rich-node-1
  allow_failure: true
- name: Node 1 sets the block's alignment
  type: call
  app: '{{context_id}}'
  method: set_attr
  args:
    doc: blocks-kind-vs-depth
    block: '{{structure_block}}'
    key: align
    value: end
  account: rich-node-1
  allow_failure: true
- name: Node 2 indents the same block
  type: call
  app: '{{context_id}}'
  method: set_depth
  args:
    doc: blocks-kind-vs-depth
    block: '{{structure_block}}'
    depth: 3
  account: rich-node-2
  allow_failure: true
- name: Wait for the libp2p mesh to reform
  type: wait
  seconds: 12.0
- name: Read the twice-moved order on Node 1
  type: call
  app: '{{context_id}}'
  method: get_state_digest
  args:
    doc: blocks-move-vs-move
  account: rich-node-1
  outputs:
    moved_node1: rpc
- name: Read the twice-moved order on Node 2
  type: call
  app: '{{context_id}}'
  method: get_state_digest
  args:
    doc: blocks-move-vs-move
  account: rich-node-2
  outputs:
    moved_node2: rpc
- name: Read the twice-moved order on Node 3
  type: call
  app: '{{context_id}}'
  method: get_state_digest
  args:
    doc: blocks-move-vs-move
  account: rich-node-3
  outputs:
    moved_node3: rpc
- name: Assert the three replicas agree on one placement
  type: json_assert
  statements:
  - json_equal({{moved_node1}}, {{moved_node2}})
  - json_equal({{moved_node2}}, {{moved_node3}})
- name: Assert no block was lost to the contested move
  type: assert
  statements:
  - contains({{moved_node1}}, 'Alpha')
  - contains({{moved_node1}}, 'Beta')
  - contains({{moved_node1}}, 'Gamma')
- name: Let the stop take effect
  type: wait
  seconds: 8.0
- name: Node 1 splits the block after hello
  type: call
  app: '{{context_id}}'
  method: split_block
  args:
    doc: blocks-split-vs-type
    block: '{{split_block}}'
    at: 5
  account: rich-node-1
  allow_failure: true
- name: Let the stop on Node 1 take effect
  type: wait
  seconds: 8.0
- name: Node 2 types at the end of the block Node 1 split
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: blocks-split-vs-type
    block: '{{split_block}}'
    ops:
    - retain: 11
    - insert: '!!!'
  account: rich-node-2
  allow_failure: true
- name: Let the mesh re-form
  type: wait
  seconds: 20.0
