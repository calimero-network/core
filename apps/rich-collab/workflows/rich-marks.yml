# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x1: v1 node logs
#   heal_peers x1: a user's node cut off from its peers has no counterpart in a cluster
#   partition_peers x1: a user's node cut off from its peers has no counterpart in a cluster
#   wait_for_sync x8: replication is synchronous: a read sees every committed write
name: Rich Collab Marks
description: 'Every Peritext mark rule this design commits to, one document per case, one cluster boot.
  The concurrent cases run inside a single partition window: under Docker that window is a real libp2p
  partition, and under --no-docker partition_peers is a no-op, so the same cases degrade to a race and
  only the assertions that hold under both are made.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3920
accounts:
- rich-node-1
- rich-node-2
- rich-node-3
steps:
- name: Install rich-collab on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/rich_collab.wasm'
  outputs:
    app_id_bundle: hash
  account: rich-node-1
- type: set
  values:
    app_id: com.calimero.rich-collab
- name: Create a 3-node mesh
  type: create_org
  account: rich-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: rich-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: rich-node-2
  token: '{{_mesh_invite}}'
- type: invite
  account: rich-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: rich-node-3
  token: '{{_mesh_invite}}'
- name: Create a 3-node mesh
  type: deploy
  account: rich-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/rich_collab.wasm'
  app_name: Create a 3-node mesh
  outputs:
    context_id: contextId
- name: Create the growing-boundary document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: marks-growing
  account: rich-node-1
- name: Add the growing-boundary block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: marks-growing
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    growing_block: result
- name: Type abcde into the growing-boundary block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-growing
    block: '{{growing_block}}'
    ops:
    - insert: abcde
  account: rich-node-1
- name: Bold bcd in the growing-boundary block
  type: call
  app: '{{context_id}}'
  method: mark
  args:
    doc: marks-growing
    block: '{{growing_block}}'
    start: 1
    end: 4
    key: bold
    value: 'true'
  account: rich-node-1
- name: Create the non-growing-boundary document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: marks-nongrowing
  account: rich-node-1
- name: Add the non-growing-boundary block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: marks-nongrowing
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    nongrowing_block: result
- name: Type abcde into the non-growing-boundary block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-nongrowing
    block: '{{nongrowing_block}}'
    ops:
    - insert: abcde
  account: rich-node-1
- name: Link bcd in the non-growing-boundary block
  type: call
  app: '{{context_id}}'
  method: mark
  args:
    doc: marks-nongrowing
    block: '{{nongrowing_block}}'
    start: 1
    end: 4
    key: link
    value: https://example.test
  account: rich-node-1
- name: Create the undo document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: marks-undo
  account: rich-node-1
- name: Add the undo block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: marks-undo
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    undo_block: result
- name: Type hello world into the undo block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-undo
    block: '{{undo_block}}'
    ops:
    - insert: hello world
  account: rich-node-1
- name: Create the bold-versus-unbold document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: marks-bold-vs-unbold
  account: rich-node-1
- name: Add the bold-versus-unbold block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: marks-bold-vs-unbold
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    contested_block: result
- name: Type the sentence into the bold-versus-unbold block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-bold-vs-unbold
    block: '{{contested_block}}'
    ops:
    - insert: The fox jumped.
  account: rich-node-1
- name: Create the format-versus-delete document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: marks-format-vs-delete
  account: rich-node-1
- name: Add the format-versus-delete block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: marks-format-vs-delete
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    cut_block: result
- name: Type the sentence into the format-versus-delete block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-format-vs-delete
    block: '{{cut_block}}'
    ops:
    - insert: The fox jumped.
  account: rich-node-1
- name: Create the two-comments document
  type: call
  app: '{{context_id}}'
  method: create_doc
  args:
    doc: marks-two-comments
  account: rich-node-1
- name: Add the two-comments block
  type: call
  app: '{{context_id}}'
  method: insert_block
  args:
    doc: marks-two-comments
    after: null
    kind: paragraph
    depth: 0
  account: rich-node-1
  outputs:
    comment_block: result
- name: Type the sentence into the two-comments block
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-two-comments
    block: '{{comment_block}}'
    ops:
    - insert: The fox jumped.
  account: rich-node-1
- name: List the documents on Node 3
  type: call
  app: '{{context_id}}'
  method: list_docs
  args: {}
  account: rich-node-3
  outputs:
    docs_node3: rpc
- name: Assert every case has its own document
  type: json_assert
  statements:
  - 'json_equal({{docs_node3}}, {"output": ["marks-bold-vs-unbold", "marks-format-vs-delete", "marks-growing",
    "marks-nongrowing", "marks-two-comments", "marks-undo"]})'
- name: Node 2 types at the bold run's end
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-growing
    block: '{{growing_block}}'
    ops:
    - retain: 4
    - insert: X
  account: rich-node-2
- name: Node 2 types at the link's end
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-nongrowing
    block: '{{nongrowing_block}}'
    ops:
    - retain: 4
    - insert: X
  account: rich-node-2
- name: Node 1 bolds a run, cuts a word and types a replacement in one delta
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-undo
    block: '{{undo_block}}'
    ops:
    - retain: 6
      attributes:
        bold: 'true'
    - delete: 5
    - insert: there
  account: rich-node-1
  outputs:
    undo_token: result
- name: Node 1 takes the whole mixed delta back
  type: call
  app: '{{context_id}}'
  method: undo
  args:
    doc: marks-undo
    block: '{{undo_block}}'
    token: '{{undo_token}}'
  account: rich-node-1
- name: Settle after the partition takes effect
  type: wait
  seconds: 12.0
- name: Node 1 bolds the whole sentence
  type: call
  app: '{{context_id}}'
  method: mark
  args:
    doc: marks-bold-vs-unbold
    block: '{{contested_block}}'
    start: 0
    end: 15
    key: bold
    value: 'true'
  account: rich-node-1
  allow_failure: true
- name: Node 1 takes the bold back off everything but the first word
  type: call
  app: '{{context_id}}'
  method: mark
  args:
    doc: marks-bold-vs-unbold
    block: '{{contested_block}}'
    start: 4
    end: 15
    key: bold
    value: null
  account: rich-node-1
  allow_failure: true
- name: Node 2 bolds the tail of the same sentence
  type: call
  app: '{{context_id}}'
  method: mark
  args:
    doc: marks-bold-vs-unbold
    block: '{{contested_block}}'
    start: 8
    end: 15
    key: bold
    value: 'true'
  account: rich-node-2
  allow_failure: true
- name: Node 1 bolds the word Node 2 is about to delete
  type: call
  app: '{{context_id}}'
  method: mark
  args:
    doc: marks-format-vs-delete
    block: '{{cut_block}}'
    start: 4
    end: 7
    key: bold
    value: 'true'
  account: rich-node-1
  allow_failure: true
- name: Node 2 deletes the word Node 1 just bolded
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    doc: marks-format-vs-delete
    block: '{{cut_block}}'
    ops:
    - retain: 4
    - delete: 3
  account: rich-node-2
  allow_failure: true
- name: Node 1 comments on the middle word
  type: call
  app: '{{context_id}}'
  method: mark
  args:
    doc: marks-two-comments
    block: '{{comment_block}}'
    start: 4
    end: 7
    key: comment:alpha
    value: first
  account: rich-node-1
  allow_failure: true
- name: Node 2 comments on the same word
  type: call
  app: '{{context_id}}'
  method: mark
  args:
    doc: marks-two-comments
    block: '{{comment_block}}'
    start: 4
    end: 7
    key: comment:beta
    value: second
  account: rich-node-2
  allow_failure: true
- name: Wait for the libp2p mesh to reform
  type: wait
  seconds: 12.0
- name: Read the contested digest on Node 1
  type: call
  app: '{{context_id}}'
  method: get_state_digest
  args:
    doc: marks-bold-vs-unbold
  account: rich-node-1
  outputs:
    contested_node1: rpc
- name: Read the contested digest on Node 2
  type: call
  app: '{{context_id}}'
  method: get_state_digest
  args:
    doc: marks-bold-vs-unbold
  account: rich-node-2
  outputs:
    contested_node2: rpc
- name: Read the contested digest on Node 3
  type: call
  app: '{{context_id}}'
  method: get_state_digest
  args:
    doc: marks-bold-vs-unbold
  account: rich-node-3
  outputs:
    contested_node3: rpc
- name: Assert the three replicas agree on the contested document
  type: json_assert
  statements:
  - json_equal({{contested_node1}}, {{contested_node2}})
  - json_equal({{contested_node2}}, {{contested_node3}})
- name: Assert the uncontested prefix stayed bold
  type: assert
  statements:
  - contains({{contested_node1}}, 'bold=true:The ')
