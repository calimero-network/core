[package]
name = "team-metrics-macro"
version = "0.1.0"
edition = "2021"
publish = false
description = "Per-team win, loss and draw counts on the v2 app SDK"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like the SDK's sample guest: the tests build this crate for wasm32-wasip2.
[workspace]
