[package]
name = "rooms"
version = "0.1.0"
edition = "2021"
publish = false
description = "Room booking: the reference app (unique slots, timers, a step-up, per-audience events)"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-sdk = { path = "../../crates/sdk" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk = { path = "../../crates/sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like the SDK's sample guest: the test builds this crate for wasm32-wasip2.
[workspace]
