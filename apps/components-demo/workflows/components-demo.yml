# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: Components demo workflow
description: Access-control components (Ownable / PermissionedStorage / AccessControl) e2e
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3610
accounts:
- new-calimero-node-1
- new-calimero-node-2
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/components_demo.wasm'
  outputs:
    app_id_bundle: hash
  account: new-calimero-node-1
- type: set
  values:
    app_id: com.calimero.components-demo
- name: Create Mesh
  type: create_org
  account: new-calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: new-calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: new-calimero-node-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: new-calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/components_demo.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Node 1 (owner) sets config
  type: call
  app: '{{context_id}}'
  method: set_config
  args:
    value: owner-config
  account: new-calimero-node-1
- name: Node 2 reads the owner's config
  type: call
  app: '{{context_id}}'
  method: get_config
  args: {}
  account: new-calimero-node-2
  outputs:
    node2_config: rpc
- name: Assert config converged to node 2
  type: json_assert
  statements:
  - 'json_equal({{node2_config}}, {"output": "owner-config"})'
- name: Account of node 2
  type: call
  app: '{{context_id}}'
  method: my_account
  args: {}
  account: new-calimero-node-2
  outputs:
    acct_node2: result
- name: Node 1 (admin) grants editor to node 2
  type: call
  app: '{{context_id}}'
  method: grant_role
  args:
    role: editor
    who: '{{acct_node2}}'
  account: new-calimero-node-1
- name: Node 2 sees its editor role
  type: call
  app: '{{context_id}}'
  method: has_role
  args:
    role: editor
    who: '{{acct_node2}}'
  account: new-calimero-node-2
  outputs:
    node2_has_editor: rpc
- name: Assert the grant converged to node 2
  type: json_assert
  statements:
  - 'json_equal({{node2_has_editor}}, {"output": true})'
- name: Node 2 (non-admin) attempts to grant a role
  type: call
  app: '{{context_id}}'
  method: try_grant_role
  args:
    role: viewer
    who: '{{acct_node2}}'
  account: new-calimero-node-2
  outputs:
    node2_grant_accepted: rpc
- name: Assert node 2's non-admin grant was refused
  type: json_assert
  statements:
  - 'json_equal({{node2_grant_accepted}}, {"output": false})'
- name: Node 2 (non-writer) forges a settings write
  type: call
  app: '{{context_id}}'
  method: settings_set
  args:
    key: evil
    value: forged
  account: new-calimero-node-2
  # The SDK refuses a non-writer's write into the cell; the method returns
  # the refusal, so nothing is committed.
  expected_error: APP_ERROR
- name: Let the forged delta attempt (and fail) to propagate
  type: wait
  seconds: 20.0
- name: Node 1 reads the entry the non-writer tried to set
  type: call
  app: '{{context_id}}'
  method: settings_get
  args:
    key: evil
  account: new-calimero-node-1
  outputs:
    node1_evil_read: rpc
- name: Assert the non-writer's forged settings write did NOT reach node 1
  type: json_assert
  statements:
  - 'json_equal({{node1_evil_read}}, {"output": null})'
