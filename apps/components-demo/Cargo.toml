[package]
name = "components-demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Access-control patterns on the component SDK: an owned cell, a writer set, a role registry"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like apps/rooms: the tests build this crate for wasm32-wasip2.
[workspace]
