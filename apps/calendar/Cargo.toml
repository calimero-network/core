[package]
name = "calendar"
version = "0.1.0"
edition = "2021"
publish = false
description = "A calendar that keeps each person's and each app's events, and keeps private events from apps that act for a person"

[lib]
crate-type = ["cdylib"]

[package.metadata.calimero]
package = "com.calimero.example.calendar"

[dependencies]
calimero-sdk = { path = "../../crates/sdk" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk = { path = "../../crates/sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like the other examples: the tests build this crate for wasm32-wasip2.
[workspace]
