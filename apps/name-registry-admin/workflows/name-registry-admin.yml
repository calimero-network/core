# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_log_absent x1: v1 node logs
#   wait_for_sync x16: replication is synchronous: a read sees every committed write
# NOTE: parallel groups run one after another: the app's log orders them
name: Name Registry (Admin) — the admins decide who owns a username
description: "Three nodes, three accounts, one context of a `Registry<String, String, Admin>`: the owner\
  \ node created the context, so its account ran `init` and is the only admin; the other two nodes are\
  \ members, Ann and Bob. Every property below is asserted on all three nodes, because what a registry\
  \ promises is that every replica names the same owner.\n1. ONE NAME, TWO CLAIMS, ONE OWNER. Ann and\
  \ Bob claim `rose` concurrently.\n   Once the admin holds both claims it resolves, and every node names\
  \ the\n   same owner, one of the two, at epoch 0; the other claimant sees `lost`.\n\n2. RELEASE AND\
  \ THE NEXT EPOCH. Both members run `let_go`: the owner\n   releases and the loser's call does nothing.\
  \ The admin answers with a\n   vacancy, so nobody owns `rose`. Both run `rebid`: only the loser has\
  \ a\n   claim to renew, so only it bids. The admin resolves again and every node\n   names the loser\
  \ as the owner, at epoch 1.\n\n3. A MEMBER CANNOT DECIDE. Bob claims `iris`; Ann and Bob each try to\n\
  \   resolve it, and Ann tries to make herself admin. All three calls are\n   refused, and on every node\
  \ `iris` stays pending and the admins stay as\n   they were.\n\n4. THE ROLE MOVES ONLY THROUGH `set_admins`.\
  \ The admin hands the role to\n   Ann. Every node lists Ann as the only admin; the old admin's resolve\
  \ and\n   its attempt to take the role back are refused, and Ann's resolve of\n   Bob's claim to `lily`\
  \ is the verdict every node accepts.\n\nWhich of Ann and Bob wins `rose` is decided by an order derived\
  \ from the name, the epoch and the two accounts, so it changes from run to run. No step branches on\
  \ it: `let_go` and `rebid` do the right thing for whoever calls them, and the assertions only require\
  \ the two members' answers to differ and the owner to be one of them.\nNo TEE, no mock attestation,\
  \ no `login` steps.\nRun locally:\n  cargo build -p merod --release\n  cd apps/name-registry-admin\n\
  \  merobox bootstrap run workflows/name-registry-admin.yml \\\n    --image merod:local --e2e-mode\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3830
accounts:
- admin-names-owner
- admin-names-ann
- admin-names-bob
steps:
- name: Install name-registry-admin on the owner
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/name_registry_admin.wasm'
  outputs:
    app_id_bundle: hash
  account: admin-names-owner
- type: set
  values:
    app_id: com.calimero.name-registry-admin
- name: Create Mesh
  type: create_org
  account: admin-names-owner
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: admin-names-owner
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: admin-names-ann
  token: '{{_mesh_invite}}'
- type: invite
  account: admin-names-owner
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: admin-names-bob
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: admin-names-owner
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/name_registry_admin.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
- name: Assert the mesh came up
  type: assert
  statements:
  - is_set({{context_id}})
- name: Account of the owner node
  type: call
  app: '{{context_id}}'
  method: me
  args: {}
  account: admin-names-owner
  outputs:
    owner_account: result
- name: Account of Ann
  type: call
  app: '{{context_id}}'
  method: me
  args: {}
  account: admin-names-ann
  outputs:
    ann_account: result
- name: Account of Bob
  type: call
  app: '{{context_id}}'
  method: me
  args: {}
  account: admin-names-bob
  outputs:
    bob_account: result
- name: Assert the three nodes are three accounts
  type: assert
  statements:
  - not_equal({{owner_account}}, {{ann_account}})
  - not_equal({{owner_account}}, {{bob_account}})
  - not_equal({{ann_account}}, {{bob_account}})
- name: Ann claims rose
  type: call
  app: '{{context_id}}'
  method: claim
  args:
    name: rose
    display: Rose, as Ann
  account: admin-names-ann
- name: Bob claims rose
  type: call
  app: '{{context_id}}'
  method: claim
  args:
    name: rose
    display: Rose, as Bob
  account: admin-names-bob
- name: The admin's view of rose before it decides
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: rose
  account: admin-names-owner
  outputs:
    rose_before: rpc
- name: Assert the admin holds both claims
  type: json_assert
  statements:
  - 'json_equal({{rose_before}}, {"output": {"state": "pending", "owner": null, "epoch": null, "claimants":
    2, "mine": false}})'
- name: The admin resolves rose
  type: call
  app: '{{context_id}}'
  method: resolve
  args:
    name: rose
  account: admin-names-owner
  outputs:
    first_owner: result
- name: Assert the admin granted rose to one of the claimants
  type: assert
  statements:
  - is_set({{first_owner}})
  - contains("{{ann_account}} {{bob_account}}", {{first_owner}})
- name: The owner node's view of rose
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: rose
  account: admin-names-owner
  outputs:
    rose_on_owner: rpc
- name: Ann's view of rose
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: rose
  account: admin-names-ann
  outputs:
    rose_on_ann: rpc
- name: Bob's view of rose
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: rose
  account: admin-names-bob
  outputs:
    rose_on_bob: rpc
- name: Assert one owner at epoch 0 and one loser
  type: json_assert
  statements:
  - 'json_subset({{rose_on_owner}}, {"output": {"state": "owned", "epoch": 0, "mine": false}})'
  - 'json_subset({{rose_on_ann}}, {"output": {"owner": "{{first_owner}}", "epoch": 0}})'
  - 'json_subset({{rose_on_bob}}, {"output": {"owner": "{{first_owner}}", "epoch": 0}})'
  - json_not_equal({{rose_on_ann}}, {{rose_on_bob}})
- name: Assert the members' views are owned and lost
  type: assert
  statements:
  - contains("{{rose_on_ann}} {{rose_on_bob}}", "lost")
  - contains("{{rose_on_ann}} {{rose_on_bob}}", "owned")
- name: Ann lets rose go
  type: call
  app: '{{context_id}}'
  method: let_go
  args:
    name: rose
  account: admin-names-ann
  outputs:
    let_go_ann: result
- name: Bob lets rose go
  type: call
  app: '{{context_id}}'
  method: let_go
  args:
    name: rose
  account: admin-names-bob
  outputs:
    let_go_bob: result
- name: Assert only the owner released
  type: assert
  statements:
  - contains("{{let_go_ann}} {{let_go_bob}}", "released")
  - contains("{{let_go_ann}} {{let_go_bob}}", "nothing")
- name: The admin answers the release
  type: call
  app: '{{context_id}}'
  method: resolve
  args:
    name: rose
  account: admin-names-owner
  outputs:
    after_release: rpc
- name: Assert the answer is a vacancy
  type: json_assert
  statements:
  - 'json_equal({{after_release}}, {"output": null})'
- name: Ann rebids for rose
  type: call
  app: '{{context_id}}'
  method: rebid
  args:
    name: rose
  account: admin-names-ann
  outputs:
    rebid_ann: result
- name: Bob rebids for rose
  type: call
  app: '{{context_id}}'
  method: rebid
  args:
    name: rose
  account: admin-names-bob
  outputs:
    rebid_bob: result
- name: Assert only the loser rebid
  type: assert
  statements:
  - contains("{{rebid_ann}} {{rebid_bob}}", "rebid")
  - contains("{{rebid_ann}} {{rebid_bob}}", "nothing")
- name: The admin's view of rose after the rebid
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: rose
  account: admin-names-owner
  outputs:
    rose_rebid: rpc
- name: Assert the admin holds the one new claim
  type: json_assert
  statements:
  - 'json_equal({{rose_rebid}}, {"output": {"state": "pending", "owner": null, "epoch": null, "claimants":
    1, "mine": false}})'
- name: The admin resolves rose again
  type: call
  app: '{{context_id}}'
  method: resolve
  args:
    name: rose
  account: admin-names-owner
  outputs:
    second_owner: result
- name: Assert rose went to the other member
  type: assert
  statements:
  - is_set({{second_owner}})
  - not_equal({{second_owner}}, {{first_owner}})
  - contains("{{ann_account}} {{bob_account}}", {{second_owner}})
- name: The owner node's view of rose at the next epoch
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: rose
  account: admin-names-owner
  outputs:
    rose2_on_owner: rpc
- name: Ann's view of rose at the next epoch
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: rose
  account: admin-names-ann
  outputs:
    rose2_on_ann: rpc
- name: Bob's view of rose at the next epoch
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: rose
  account: admin-names-bob
  outputs:
    rose2_on_bob: rpc
- name: Assert every node sees the new owner at epoch 1
  type: json_assert
  statements:
  - 'json_subset({{rose2_on_owner}}, {"output": {"state": "owned", "owner": "{{second_owner}}", "epoch":
    1}})'
  - 'json_subset({{rose2_on_ann}}, {"output": {"state": "owned", "owner": "{{second_owner}}", "epoch":
    1}})'
  - 'json_subset({{rose2_on_bob}}, {"output": {"state": "owned", "owner": "{{second_owner}}", "epoch":
    1}})'
  - json_not_equal({{rose2_on_ann}}, {{rose2_on_bob}})
- name: Bob claims iris
  type: call
  app: '{{context_id}}'
  method: claim
  args:
    name: iris
    display: Iris, as Bob
  account: admin-names-bob
- name: Ann cannot resolve iris
  type: call
  app: '{{context_id}}'
  method: resolve
  args:
    name: iris
  account: admin-names-ann
  expected_failure: true
  outputs:
    ann_resolve_error: error
- name: Bob cannot grant iris to himself
  type: call
  app: '{{context_id}}'
  method: resolve
  args:
    name: iris
  account: admin-names-bob
  expected_failure: true
  outputs:
    bob_resolve_error: error
- name: Ann cannot make herself admin
  type: call
  app: '{{context_id}}'
  method: set_admins
  args:
    admins:
    - '{{ann_account}}'
  account: admin-names-ann
  expected_failure: true
  outputs:
    ann_set_admins_error: error
- name: Assert all three writes were refused
  type: assert
  statements:
  - is_set({{ann_resolve_error}})
  - is_set({{bob_resolve_error}})
  - is_set({{ann_set_admins_error}})
- name: The owner node's view of iris
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: iris
  account: admin-names-owner
  outputs:
    iris_on_owner: rpc
- name: Ann's view of iris
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: iris
  account: admin-names-ann
  outputs:
    iris_on_ann: rpc
- name: Bob's view of iris
  type: call
  app: '{{context_id}}'
  method: status
  args:
    name: iris
  account: admin-names-bob
  outputs:
    iris_on_bob: rpc
- name: Assert iris is pending on every node
  type: json_assert
  statements:
  - 'json_equal({{iris_on_owner}}, {"output": {"state": "pending", "owner": null, "epoch": null, "claimants":
    1, "mine": false}})'
  - 'json_equal({{iris_on_ann}}, {"output": {"state": "pending", "owner": null, "epoch": null, "claimants":
    1, "mine": false}})'
  - 'json_equal({{iris_on_bob}}, {"output": {"state": "pending", "owner": null, "epoch": null, "claimants":
    1, "mine": true}})'
- name: The admin hands the role to Ann
  type: call
  app: '{{context_id}}'
  method: set_admins
  args:
    admins:
    - '{{ann_account}}'
  account: admin-names-owner
- name: Bob claims lily
  type: call
  app: '{{context_id}}'
  method: claim
  args:
    name: lily
    display: Lily, as Bob
  account: admin-names-bob
- name: The old admin cannot resolve lily
  type: call
  app: '{{context_id}}'
  method: resolve
  args:
    name: lily
  account: admin-names-owner
  expected_failure: true
  outputs:
    old_admin_resolve_error: error
- name: The old admin cannot take the role back
  type: call
  app: '{{context_id}}'
  method: set_admins
  args:
    admins:
    - '{{owner_account}}'
  account: admin-names-owner
  expected_failure: true
  outputs:
    old_admin_set_admins_error: error
- name: Assert the old admin's writes were refused
  type: assert
  statements:
  - is_set({{old_admin_resolve_error}})
  - is_set({{old_admin_set_admins_error}})
- name: Ann resolves lily as the new admin
  type: call
  app: '{{context_id}}'
  method: resolve
  args:
    name: lily
  account: admin-names-ann
  outputs:
    lily_owner: result
- name: Assert Ann granted lily to its one claimant
  type: assert
  statements:
  - equal({{lily_owner}}, {{bob_account}})
