# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
name: XCall Ping-Pong (same-namespace demo)
description: 'Minimal "how to use xcall" demo. Two contexts in the SAME namespace ping each other''s `pong`
  entry point; each pong increments the target''s counter.

  Note on the trust model: cross-context calls are gated by the namespace boundary — a context may only
  xcall a target in its own namespace (see `xcall.yml` for the full authorization test, including the
  cross-namespace and non-entry-point denials). This demo therefore keeps both contexts in one namespace
  so the calls are permitted.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 5060
accounts:
- rust-xcall-1
steps:
- name: Install app
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/xcall_example.wasm'
  outputs:
    app_id_bundle: hash
  account: rust-xcall-1
- type: set
  values:
    app_id: com.calimero.xcall-example
- name: Create shared namespace
  type: create_org
  org_name: Create shared namespace
  outputs:
    ns: orgId
  account: rust-xcall-1
- name: Create Context A
  type: deploy
  account: rust-xcall-1
  wasm: '{{env.CORE_WASM_DIR}}/xcall_example.wasm'
  app_name: Create Context A
  org: '{{ns}}'
  outputs:
    ctx_a: contextId
- name: Create Context B (same namespace)
  type: deploy
  account: rust-xcall-1
  wasm: '{{env.CORE_WASM_DIR}}/xcall_example.wasm'
  app_name: Create Context B (same namespace)
  org: '{{ns}}'
  outputs:
    ctx_b: contextId
- name: Ping A -> B
  type: call
  app: '{{ctx_a}}'
  method: ping
  args:
    target_context: '{{ctx_b}}'
  account: rust-xcall-1
- name: Wait for xcall to execute
  type: wait
  seconds: 8.0
- name: Read B counter
  type: call
  app: '{{ctx_b}}'
  method: get_counter
  args: {}
  account: rust-xcall-1
  outputs:
    b_counter: result
- name: Assert B received the ping (counter 1)
  type: json_assert
  statements:
  - equal({{b_counter}}, 1)
- name: Ping B -> A
  type: call
  app: '{{ctx_b}}'
  method: ping
  args:
    target_context: '{{ctx_a}}'
  account: rust-xcall-1
- name: Wait for xcall to execute
  type: wait
  seconds: 8.0
- name: Read A counter
  type: call
  app: '{{ctx_a}}'
  method: get_counter
  args: {}
  account: rust-xcall-1
  outputs:
    a_counter: result
- name: Assert A received the ping (counter 1)
  type: json_assert
  statements:
  - equal({{a_counter}}, 1)
