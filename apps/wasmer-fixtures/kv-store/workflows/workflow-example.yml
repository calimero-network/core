# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   wait_for_sync x4: replication is synchronous: a read sees every committed write
name: Sample Calimero Workflow
description: A sample workflow that demonstrates the bootstrap functionality with dynamic value capture
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3760
accounts:
- calimero-node-1
- calimero-node-2
- calimero-node-3
steps:
- name: Install Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  outputs:
    app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    app_id: com.calimero.kv-store
- name: Create Namespace on Node 1
  type: create_org
  org_name: Create Namespace on Node 1
  outputs:
    namespace_id: orgId
  account: calimero-node-1
- name: Create Context on Node 1
  type: deploy
  account: calimero-node-1
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  app_name: Create Context on Node 1
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Invite Node 2 to Namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_node2: token
- name: Node 2 Joins Namespace
  type: redeem_invite
  token: '{{invitation_node2}}'
  account: calimero-node-2
- type: whoami
  account: calimero-node-2
  outputs:
    public_key_node2: publicKey
- name: Invite Node 3 to Namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: calimero-node-1
  outputs:
    invitation_node3: token
- name: Node 3 Joins Namespace
  type: redeem_invite
  token: '{{invitation_node3}}'
  account: calimero-node-3
- type: whoami
  account: calimero-node-3
  outputs:
    public_key_node3: publicKey
- name: Execute Contract Call - Set Key-Value
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: hello
    value: world
  account: calimero-node-1
  outputs:
    set_result: rpc
- name: Execute View Call - Get Value from Node 2
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: hello
  account: calimero-node-2
  outputs:
    get_result_node2: rpc
- name: Execute View Call - Get Value from Node 3
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: hello
  account: calimero-node-3
  outputs:
    get_result_node3: rpc
- name: Execute Contract Call - Set from Node 3
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: node3_key
    value: node3_value
  account: calimero-node-3
  outputs:
    set_result_node3: rpc
- name: Verify Node 3 Value from Node 1
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: node3_key
  account: calimero-node-1
  outputs:
    verify_result: rpc
- name: Repeat Operations Multiple Times
  type: repeat
  count: 3
  outputs:
    current_iteration: iteration
  steps:
  - name: Set Key-Value Pair from Node 1
    type: call
    app: '{{context_id}}'
    method: set
    args:
      key: iteration_{{current_iteration}}
      value: value_{{current_iteration}}_from_node1
    account: calimero-node-1
    outputs:
      iteration_set_result: rpc
  - name: Get Key-Value Pair from Node 2
    type: call
    app: '{{context_id}}'
    method: get
    args:
      key: iteration_{{current_iteration}}
    account: calimero-node-2
    outputs:
      iteration_get_result_node2: rpc
  - name: Get Key-Value Pair from Node 3
    type: call
    app: '{{context_id}}'
    method: get
    args:
      key: iteration_{{current_iteration}}
    account: calimero-node-3
    outputs:
      iteration_get_result_node3: rpc
