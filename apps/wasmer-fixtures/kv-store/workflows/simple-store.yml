# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
name: Simple Store App Test
description: Simple Store Application Workflow (Rust)
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3750
accounts:
- simple-store-node-1
- simple-store-node-2
steps:
- name: Install Simple Store Application
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  outputs:
    app_id_bundle: hash
  account: simple-store-node-1
- type: set
  values:
    app_id: com.calimero.kv-store
- name: Create namespace
  type: create_org
  org_name: Create namespace
  outputs:
    namespace_id: orgId
  account: simple-store-node-1
- name: Create Simple Store Context
  type: deploy
  account: simple-store-node-1
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  app_name: Create Simple Store Context
  init_args: '{}'
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Set Value
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: greeting
    value: hello-world
  account: simple-store-node-1
- name: Get Value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: greeting
  account: simple-store-node-1
  outputs:
    store_result: result
- name: Assert Value Matches
  type: json_assert
  statements:
  - equal({{store_result}}, "hello-world")
- name: Set Multiple Values
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: foo
    value: bar
  account: simple-store-node-1
- name: Set Another Value
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: test
    value: data
  account: simple-store-node-1
- name: Get All Entries
  type: call
  app: '{{context_id}}'
  method: entries
  args: {}
  account: simple-store-node-1
  outputs:
    all_entries: result
- name: Assert Entries Count
  type: json_assert
  statements:
  - json_equal({{all_entries}}, {"greeting":"hello-world","foo":"bar","test":"data"})
