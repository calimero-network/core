[package]
name = "team-space"
version = "0.1.0"
edition = "2021"
publish = false
description = "A team's shared space on the component SDK: org-gated notes, an owned config, roles and writer sets"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-sdk = { path = "../../crates/sdk" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk = { path = "../../crates/sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like apps/rooms: the tests build this crate for wasm32-wasip2.
[workspace]
