description: >
  Undo is local: a node undoes its own delete by re-inserting the text where it was, and
  its own insert by deleting exactly the characters it minted, while another node edits.
name: Fugue Collab Undo

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: fugue-node
  base_port: 2800
  base_rpc_port: 2900

steps:
  - name: Install fugue-collab on Node 1
    type: install_application
    node: fugue-node-1
    path: ../../dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Install fugue-collab on Node 2
    type: install_application
    node: fugue-node-2
    path: ../../dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true

  - name: Create a 2-node mesh
    type: create_mesh
    context_node: fugue-node-1
    application_id: "{{app_id}}"
    nodes:
      - fugue-node-2
    outputs:
      context_id: contextId

  - name: Node 1 types the document
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "hello world"

  - name: Wait for the document to reach Node 2
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2]
    timeout: 90
    trigger_sync: true

  - name: Node 1 deletes a word
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: delete_range_tracked
    args:
      start: 6
      end: 11
    outputs:
      cut: result.output

  # Position 0 means the same place whether or not Node 1's delete has arrived.
  - name: Node 2 inserts at the start
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "AA"

  - name: Wait for both edits
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2]
    timeout: 90
    trigger_sync: true
    expect:
      method: get_text
      equals:
        output: "AAhello "

  - name: Node 1 undoes its delete
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: undo_delete
    args:
      token: "{{cut}}"

  - name: Node 2 types a prefix it will take back
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: insert_text_tracked
    args:
      position: 0
      text: "ZZ"
    outputs:
      typed: result.output

  - name: Node 2 undoes its insert
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: undo_insert
    args:
      token: "{{typed}}"

  - name: Wait for both undos
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2]
    timeout: 90
    trigger_sync: true
    expect:
      method: get_text
      equals:
        output: "AAhello world"

stop_all_nodes: true
restart: false
wait_timeout: 120
