description: >
  A writer's blocks must survive its container being replaced, and it must rejoin the
  document its peers went on building.
name: Fugue Collab Restart Mid Edit

nodes:
  count: 3
  image: ghcr.io/calimero-network/merod:edge
  prefix: fugue-node
  base_port: 2800
  base_rpc_port: 2900

steps:
  - name: Install fugue-collab on Node 1
    type: install_application
    node: fugue-node-1
    path: ../../dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  # A node cut off from its peers cannot lazily fetch bytecode, so install first.
  - name: Install fugue-collab on Node 2
    type: install_application
    node: fugue-node-2
    path: ../../dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true

  - name: Install fugue-collab on Node 3
    type: install_application
    node: fugue-node-3
    path: ../../dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true

  - name: Create a 3-node mesh
    type: create_mesh
    context_node: fugue-node-1
    application_id: "{{app_id}}"
    nodes:
      - fugue-node-2
      - fugue-node-3
    outputs:
      context_id: contextId

  - name: Seed the document from Node 1
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "SEED."

  - name: Wait for the seed to reach every node
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2, fugue-node-3]
    timeout: 60
    trigger_sync: true

  - name: Node 3 appends its passage
    type: call
    node: fugue-node-3
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 5
      text: "-THREE"

  - name: Wait for Node 3's passage to reach every node
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2, fugue-node-3]
    timeout: 60
    trigger_sync: true


  - name: Restart Node 3's container
    type: restart_container
    container: fugue-node-3
    wait_healthy: true
    timeout: 60

  - name: Read Node 3's document straight out of its restarted store
    type: call
    node: fugue-node-3
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      restored_node3: result

  - name: Read Node 3's restored length
    type: call
    node: fugue-node-3
    context_id: "{{context_id}}"
    method: get_length
    outputs:
      restored_len: result

  - name: Assert the block rows survived the restart
    type: json_assert
    statements:
      - 'json_equal({{restored_node3}}, {"output": "SEED.-THREE"})'
      - 'json_equal({{restored_len}}, {"output": 11})'


  - name: Node 1 types in front of the seed
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "ONE-"

  - name: Wait for Node 1's edit to reach Node 2
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2]
    timeout: 60
    trigger_sync: true

  - name: Node 2 appends behind Node 3's passage
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "-TWO"

  # wait_healthy only proves the admin endpoint is back, not that libp2p rejoined.
  - name: Wait for Node 3 to rejoin the mesh
    type: wait
    seconds: 15

  - name: Wait for the three histories to converge on the merged document
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2, fugue-node-3]
    timeout: 120
    trigger_sync: true
    expect:
      method: get_text
      equals:
        output: "ONE-SEED.-THREE-TWO"

stop_all_nodes: true
restart: false
wait_timeout: 120
