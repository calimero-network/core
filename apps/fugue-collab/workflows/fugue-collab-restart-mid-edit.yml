# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   restart_container x1: a user's node restarting has no counterpart in a cluster
#   wait_for_sync x4: replication is synchronous: a read sees every committed write
name: Fugue Collab Restart Mid Edit
description: 'A writer''s blocks must survive its container being replaced, and it must rejoin the document
  its peers went on building.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3680
accounts:
- fugue-node-1
- fugue-node-2
- fugue-node-3
steps:
- name: Install fugue-collab on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/fugue_collab.wasm'
  outputs:
    app_id_bundle: hash
  account: fugue-node-1
- type: set
  values:
    app_id: com.calimero.fugue-collab
- name: Create a 3-node mesh
  type: create_org
  account: fugue-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: fugue-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: fugue-node-2
  token: '{{_mesh_invite}}'
- type: invite
  account: fugue-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: fugue-node-3
  token: '{{_mesh_invite}}'
- name: Create a 3-node mesh
  type: deploy
  account: fugue-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/fugue_collab.wasm'
  app_name: Create a 3-node mesh
  outputs:
    context_id: contextId
- name: Seed the document from Node 1
  type: call
  app: '{{context_id}}'
  method: insert_text
  args:
    position: 0
    text: SEED.
  account: fugue-node-1
- name: Node 3 appends its passage
  type: call
  app: '{{context_id}}'
  method: insert_text
  args:
    position: 5
    text: -THREE
  account: fugue-node-3
- name: Read Node 3's document straight out of its restarted store
  type: call
  app: '{{context_id}}'
  method: get_text
  args: {}
  account: fugue-node-3
  outputs:
    restored_node3: rpc
- name: Read Node 3's restored length
  type: call
  app: '{{context_id}}'
  method: get_length
  args: {}
  account: fugue-node-3
  outputs:
    restored_len: rpc
- name: Assert the block rows survived the restart
  type: json_assert
  statements:
  - 'json_equal({{restored_node3}}, {"output": "SEED.-THREE"})'
  - 'json_equal({{restored_len}}, {"output": 11})'
- name: Node 1 types in front of the seed
  type: call
  app: '{{context_id}}'
  method: insert_text
  args:
    position: 0
    text: ONE-
  account: fugue-node-1
- name: Node 2 appends behind Node 3's passage
  type: call
  app: '{{context_id}}'
  method: insert_text
  args:
    position: 15
    text: -TWO
  account: fugue-node-2
- name: Wait for Node 3 to rejoin the mesh
  type: wait
  seconds: 15.0
