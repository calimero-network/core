description: >
  Three nodes editing one FugueText document concurrently over JSON-RPC. This is
  the multi-replica backward-insertion case of Table 1 in "The Art of the Fugue"
  — the row where RGA interleaves, Yjs interleaves, and only Fugue is proven not
  to. It is the acceptance test for the rework: it must pass on FugueText, and
  the same scenario against `apps/collaborative-editor` (RGA) must fail.
name: Fugue Collab 3-Node Concurrent

nodes:
  count: 3
  image: ghcr.io/calimero-network/merod:edge
  prefix: calimero-node

steps:
  # ==========================================================================
  # Setup
  # ==========================================================================

  - name: Install fugue-collab on Node 1
    type: install_application
    node: calimero-node-1
    path: dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create a 3-node mesh
    type: create_mesh
    context_node: calimero-node-1
    application_id: "{{app_id}}"
    nodes:
      - calimero-node-2
      - calimero-node-3
    outputs:
      context_id: contextId
      member_public_key: memberPublicKey

  # ==========================================================================
  # Seed
  #
  # The paper's Figure 2 starts from a document that already has text, not from
  # an empty one. Seeding also gives nodes 2 and 3 a non-empty delta log, which
  # is the precondition for them to write at all — `create_mesh` alone leaves
  # them with zero entries. Both reasons point the same way, so one step covers
  # them. Everything after the propagation wait below is concurrent; no wait
  # goes between the three writers, or the scenario stops testing a merge.
  # ==========================================================================

  - name: Seed the document from Node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "existing text. "

  - name: Wait for the seed to reach every node
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
      - calimero-node-3
    timeout: 60
    trigger_sync: true

  - name: Read the seed back on Node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      seeded_node2: result

  - name: Read the seed back on Node 3
    type: call
    node: calimero-node-3
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      seeded_node3: result

  - name: Assert every node genuinely holds the seed
    type: json_assert
    statements:
      - 'json_equal({{seeded_node2}}, {"output": "existing text. "})'
      - 'json_equal({{seeded_node3}}, {"output": "existing text. "})'

  # ==========================================================================
  # The concurrent phase — three writers, backward insertion
  #
  # Each node appends its own passage at position 15 (the seeded length), then
  # goes BACK to position 15 and types its heading immediately before that
  # passage. Backward insertion is the case RGA is proven to get wrong; with
  # three writers it is also the multi-replica case, where Yjs fails too.
  #
  # There is deliberately no wait_for_sync between any of these six calls. Each
  # node resolves position 15 against its own local view, which still contains
  # only the seed, so all three are editing the same location with no knowledge
  # of one another.
  # ==========================================================================

  - name: Node 1 types its passage
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "PASSAGE1"

  - name: Node 1 goes back and types its heading
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "HEAD1"

  - name: Node 2 types its passage
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "PASSAGE2"

  - name: Node 2 goes back and types its heading
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "HEAD2"

  - name: Node 3 types its passage
    type: call
    node: calimero-node-3
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "PASSAGE3"

  - name: Node 3 goes back and types its heading
    type: call
    node: calimero-node-3
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 15
      text: "HEAD3"

  - name: Wait for the concurrent edits to converge
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes:
      - calimero-node-1
      - calimero-node-2
      - calimero-node-3
    timeout: 90
    trigger_sync: true

  # ==========================================================================
  # Assertions
  #
  # Convergence alone proves nothing. Three critical defects on this branch
  # converged on a deterministically WRONG value, and a hash check passed on
  # every one of them. So this asserts, in order: that all three replicas agree;
  # that the merged VALUE lost and duplicated nothing (length); and that each
  # writer's heading stayed glued to its own passage on every replica.
  # ==========================================================================

  - name: Read the merged document on Node 1
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      merged_node1: result

  - name: Read the merged document on Node 2
    type: call
    node: calimero-node-2
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      merged_node2: result

  - name: Read the merged document on Node 3
    type: call
    node: calimero-node-3
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      merged_node3: result

  - name: Assert all three replicas converged
    type: json_assert
    statements:
      - 'json_equal({{merged_node1}}, {{merged_node2}})'
      - 'json_equal({{merged_node2}}, {{merged_node3}})'

  # 15 seed + 3 * (5 heading + 8 passage) = 54 characters. A merge that drops a
  # node or resurrects one fails here even when the replicas still agree.
  - name: Read the merged length on every node
    type: call
    node: calimero-node-1
    context_id: "{{context_id}}"
    method: get_length
    outputs:
      len_node1: result

  - name: Read the merged length on Node 3
    type: call
    node: calimero-node-3
    context_id: "{{context_id}}"
    method: get_length
    outputs:
      len_node3: result

  - name: Assert nothing was lost or duplicated
    type: json_assert
    statements:
      - 'json_equal({{len_node1}}, {"output": 54})'
      - 'json_equal({{len_node3}}, {"output": 54})'

  # The acceptance criterion. Under RGA these fail: a writer's heading is torn
  # away from its passage. Do not weaken them to make the scenario pass.
  - name: Assert every writer's block is contiguous on Node 1
    type: assert
    statements:
      - "contains({{merged_node1}}, 'HEAD1PASSAGE1')"
      - "contains({{merged_node1}}, 'HEAD2PASSAGE2')"
      - "contains({{merged_node1}}, 'HEAD3PASSAGE3')"

  - name: Assert every writer's block is contiguous on Node 2
    type: assert
    statements:
      - "contains({{merged_node2}}, 'HEAD1PASSAGE1')"
      - "contains({{merged_node2}}, 'HEAD2PASSAGE2')"
      - "contains({{merged_node2}}, 'HEAD3PASSAGE3')"

  - name: Assert every writer's block is contiguous on Node 3
    type: assert
    statements:
      - "contains({{merged_node3}}, 'HEAD1PASSAGE1')"
      - "contains({{merged_node3}}, 'HEAD2PASSAGE2')"
      - "contains({{merged_node3}}, 'HEAD3PASSAGE3')"

  # The seed must survive intact at the front, whatever order the three
  # contributions land in behind it.
  - name: Assert the seed survived
    type: assert
    statements:
      - "contains({{merged_node1}}, 'existing text. ')"

stop_all_nodes: false
restart: false
wait_timeout: 90
