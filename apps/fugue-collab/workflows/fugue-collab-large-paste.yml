description: >
  One `insert_str` of 2,560 characters, ten full runs at the 256-character cap,
  landing while another node types single characters at the very start of the
  same document.

  A paste this size is the case the batched `insert_str` exists for: it mints
  ten capped blocks in one call and writes each once, instead of rewriting a
  growing run per character. The concurrent typing is there so the paste is not
  merged into a quiescent document - the other side is producing its own blocks
  at the far end of the same tree while the big one is in flight.

  2,560 is chosen against the measured single-call ceiling: `fugue_wall.rs`'s
  `single_call_paste_wall` shows one call carrying well over 8,000 characters
  into an empty document, so this sits at roughly a third of what fits and is
  not a gas-budget test in disguise.

  The paste's origin is the last seeded character and the typing's is the
  document start, so the two never contend for the same position and the merged
  text does not depend on replica ids. It is asserted in full.
name: Fugue Collab Large Paste

nodes:
  count: 3
  image: ghcr.io/calimero-network/merod:edge
  prefix: fugue-node
  base_port: 2800
  base_rpc_port: 2900

steps:
  - name: Install fugue-collab on Node 1
    type: install_application
    node: fugue-node-1
    path: ../../dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  # Master acquires app bytecode LAZILY (`calimero_app_downloader`), so every
  # node owns it before the partition leaves some of them nobody to fetch from.
  - name: Install fugue-collab on Node 2
    type: install_application
    node: fugue-node-2
    path: ../../dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true

  - name: Install fugue-collab on Node 3
    type: install_application
    node: fugue-node-3
    path: ../../dist/com.calimero.fugue-collab-0.0.0.mpk
    dev: true

  - name: Create a 3-node mesh
    type: create_mesh
    context_node: fugue-node-1
    application_id: "{{app_id}}"
    nodes:
      - fugue-node-2
      - fugue-node-3
    outputs:
      context_id: contextId

  - name: Seed the document from Node 1
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "SEED"

  - name: Wait for the seed to reach every node
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2, fugue-node-3]
    timeout: 60
    trigger_sync: true

  # ---- Partition, so the paste and the typing cannot see each other ----

  - name: Partition Node 1 from Node 2 and Node 3 (libp2p only; RPC stays up)
    type: partition_peers
    node: fugue-node-1
    peers:
      - fugue-node-2
      - fugue-node-3

  - name: Settle after the partition takes effect
    type: wait
    seconds: 12

  - name: Read Node 1's isolated view
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      split_view_1: result

  - name: Node 1 must still be on the seed
    type: json_assert
    statements:
      - 'json_equal({{split_view_1}}, {"output": "SEED"})'

  - name: Node 1 pastes 2560 characters in one call
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 4
      text: ""

  - name: Read Node 2's isolated view
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      split_view_2: result

  - name: Node 2 must not have seen the paste
    type: json_assert
    statements:
      - 'json_equal({{split_view_2}}, {"output": "SEED"})'

  - name: Node 2 types C at the start
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "C"

  - name: Node 2 types B at the start
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "B"

  - name: Node 2 types A at the start
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: insert_text
    args:
      position: 0
      text: "A"

  - name: Read Node 2's view after typing
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      typed_view_2: result

  - name: Node 2's own characters must be in place and still isolated
    type: json_assert
    statements:
      - 'json_equal({{typed_view_2}}, {"output": "ABCSEED"})'

  # ---- Heal ----

  - name: Heal the partition
    type: heal_peers
    node: fugue-node-1
    peers:
      - fugue-node-2
      - fugue-node-3

  - name: Wait for the libp2p mesh to reform
    type: wait
    seconds: 12

  - name: Wait for the three histories to converge
    type: wait_for_sync
    context_id: "{{context_id}}"
    nodes: [fugue-node-1, fugue-node-2, fugue-node-3]
    timeout: 180
    trigger_sync: true

  - name: Read the merged document on Node 1
    type: call
    node: fugue-node-1
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      merged_node1: result

  - name: Read the merged document on Node 2
    type: call
    node: fugue-node-2
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      merged_node2: result

  - name: Read the merged document on Node 3
    type: call
    node: fugue-node-3
    context_id: "{{context_id}}"
    method: get_text
    outputs:
      merged_node3: result

  - name: Read the merged length on Node 3
    type: call
    node: fugue-node-3
    context_id: "{{context_id}}"
    method: get_length
    outputs:
      merged_len: result

  - name: Assert every node holds the exact merged document
    type: json_assert
    statements:
      - 'json_equal({{merged_len}}, {"output": 2567})'
      - 'json_equal({{merged_node1}}, {"output": ""})'
      - 'json_equal({{merged_node2}}, {{merged_node1}})'
      - 'json_equal({{merged_node3}}, {{merged_node1}})'

stop_all_nodes: true
restart: false
wait_timeout: 120
