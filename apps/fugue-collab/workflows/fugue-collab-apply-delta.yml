# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: Fugue Collab Apply Delta
description: 'One editor transaction (retain, delete, insert) applied in a single call must reach every
  node and merge with a concurrent edit from another node.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3630
accounts:
- fugue-node-1
- fugue-node-2
steps:
- name: Install fugue-collab on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/fugue_collab.wasm'
  outputs:
    app_id_bundle: hash
  account: fugue-node-1
- type: set
  values:
    app_id: com.calimero.fugue-collab
- name: Create a 2-node mesh
  type: create_org
  account: fugue-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: fugue-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: fugue-node-2
  token: '{{_mesh_invite}}'
- name: Create a 2-node mesh
  type: deploy
  account: fugue-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/fugue_collab.wasm'
  app_name: Create a 2-node mesh
  outputs:
    context_id: contextId
- name: Node 1 types the document
  type: call
  app: '{{context_id}}'
  method: insert_text
  args:
    position: 0
    text: hello world
  account: fugue-node-1
- name: Node 2 appends at the end
  type: call
  app: '{{context_id}}'
  method: insert_text
  args:
    position: 11
    text: '!'
  account: fugue-node-2
- name: Node 1 replaces a word in one transaction
  type: call
  app: '{{context_id}}'
  method: apply_delta
  args:
    changes:
    - retain: 6
    - delete: 5
    - insert: there
  account: fugue-node-1
