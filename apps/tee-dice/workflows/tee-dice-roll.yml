# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_api_response x1: v1 admin API
#   assert_log_absent x2: v1 node logs
#   assert_log_present x1: v1 node logs
#   assert_tee_member (unknown) x1: checks what the dropped steps did
#   script x1: scripts drive v1 node RPC URLs
#   set_tee_admission_policy (unknown) x1: checks what the dropped steps did
#   tee_fleet_join (unknown) x3: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# Migration note: v1's first check, a roll staying unresolved before the namespace's TEE
#   admission policy let an enclave author, is dropped: the converter drops the policy
#   and the fleet join, and a cluster is the TEE from its start, so there is no time
#   before one may act. The roll checks after it stand
name: TEE Dice — A Roll Only The Enclave Can Write
description: "A member asks for a dice roll; the namespace's attested TEE authority resolves it inside\
  \ the enclave and writes the face into `TeeOnly` state; the member's node accepts that write. This is\
  \ TEE authorship end to end: a `ReadOnlyTee` replica, admitted by (mock) attestation, authors state\
  \ only after an admin names its MRTD in the namespace's TEE authoring policy.\nWHY THIS GOES RED WITHOUT\
  \ TEE AUTHORSHIP. Before it, a `ReadOnlyTee` member could not author at all: the local execute path\
  \ discarded its writes and every receive path dropped its deltas. The roll would stay unresolved on\
  \ every node, and the \"Firing TEE trigger\" line would not exist.\nTHE NEGATIVE CONTROL runs first:\
  \ with no authoring policy the replica is a member but not an authority, so the first roll must stay\
  \ unresolved. Only after the policy lands is a second roll resolved, which is what proves the policy\
  \ — not mere membership — is what grants authorship.\nNODES MUST BE BUILT WITH `--features mock-attestation`,\
  \ as for blob-presence-tee-serves. No `login` steps: the `tee_*` steps and the policy script talk to\
  \ the admin API with no Authorization header.\nRun locally, with a mock-attestation merod:\n  cargo\
  \ build -p merod --release --features mock-attestation\n  cd apps/tee-dice\n  merobox bootstrap run\
  \ workflows/tee-dice-roll.yml \\\n    --image merod:local-mock-tee --e2e-mode\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 5050
accounts:
- tee-dice-owner
- tee-dice-player
- tee-dice-enclave
steps:
- name: Install tee-dice on the owner
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/tee_dice.wasm'
  outputs:
    app_id_bundle: hash
  account: tee-dice-owner
- type: set
  values:
    app_id: com.calimero.tee-dice
- name: Create Mesh
  type: create_org
  account: tee-dice-owner
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: tee-dice-owner
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: tee-dice-player
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: tee-dice-owner
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/tee_dice.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
- name: Assert the mesh came up
  type: assert
  statements:
  - is_set({{context_id}})
  - is_set({{namespace_id}})
- name: Let the policy settle
  type: wait
  seconds: 8.0
- name: Let root membership settle
  type: wait
  seconds: 10.0
- name: Let the authoring policy reach the enclave
  type: wait
  seconds: 10.0
- name: The player asks for a roll
  type: call
  app: '{{context_id}}'
  method: roll
  args:
    roll_id: after-policy
    sides: 6
  account: tee-dice-player
- name: The player sees the roll resolved by the TEE
  type: call
  app: '{{context_id}}'
  method: is_resolved
  args:
    roll_id: after-policy
  account: tee-dice-player
  outputs:
    resolved: rpc
- name: Assert the roll was resolved
  type: json_assert
  statements:
  - 'json_equal({{resolved}}, {"output": true})'
- name: The pre-policy roll is still unresolved — authority is not retroactive
  type: call
  app: '{{context_id}}'
  method: is_resolved
  args:
    roll_id: before-policy
  account: tee-dice-player
  outputs:
    still_unresolved: rpc
- name: Assert the pre-policy roll stayed unresolved
  type: json_assert
  statements:
  - 'json_equal({{still_unresolved}}, {"output": false})'
- name: The face the TEE recorded, as the player sees it
  type: call
  app: '{{context_id}}'
  method: get_roll
  args:
    roll_id: after-policy
  account: tee-dice-player
  outputs:
    tee_face: rpc
- name: A member cannot run the TEE method to rig a new roll
  type: call
  app: '{{context_id}}'
  method: resolve_roll
  args:
    roll_id: rigged
    sides: 6
  account: tee-dice-player
  expected_failure: true
- name: A member cannot re-resolve a roll the TEE already recorded
  type: call
  app: '{{context_id}}'
  method: resolve_roll
  args:
    roll_id: after-policy
    sides: 6
  account: tee-dice-player
  expected_failure: true
- name: Give any leaked write time to propagate
  type: wait
  seconds: 10.0
- name: The rigged roll does not exist on the owner
  type: call
  app: '{{context_id}}'
  method: get_roll
  args:
    roll_id: rigged
  account: tee-dice-owner
  outputs:
    rigged_on_owner: rpc
- name: The recorded face is unchanged on the owner
  type: call
  app: '{{context_id}}'
  method: get_roll
  args:
    roll_id: after-policy
  account: tee-dice-owner
  outputs:
    face_on_owner: rpc
- name: The recorded face is unchanged on the player
  type: call
  app: '{{context_id}}'
  method: get_roll
  args:
    roll_id: after-policy
  account: tee-dice-player
  outputs:
    face_on_player: rpc
- name: Assert no member write landed
  type: json_assert
  statements:
  - 'json_equal({{rigged_on_owner}}, {"output": null})'
  - json_equal({{face_on_owner}}, {{tee_face}})
  - json_equal({{face_on_player}}, {{tee_face}})
