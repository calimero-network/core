[package]
name = "org-gated-notes"
version = "0.1.0"
edition = "2021"
publish = false
description = "Org-gated notes on the component SDK: members read, admins write, a team writes its own note"

# Not `org-gated`: that is the wasmer fixture's package (apps/wasmer-fixtures/org-gated,
# org_gated.wasm), and the cluster scenarios find a fixture by its wasm's name.
[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like apps/rooms: the tests build this crate for wasm32-wasip2.
[workspace]
