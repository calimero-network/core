# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x2: v1 node logs
#   script x2: scripts drive v1 node RPC URLs
#   stop_node x1: a user's node going offline has no counterpart in a cluster
name: Ephemeral Presence e2e — delivery, replay-on-subscribe + no-DAG-growth guard
description: "Two nodes share one context. Node 1 publishes a presence slice with the JSON-RPC set_ephemeral\
  \ method; the workflow asserts that\n\n  (a) a live subscriber on node 2 receives it over gossip — over\
  \ both WS\n      and SSE,\n  (b) a subscriber that connects AFTERWARDS is seeded with the entry it\n\
  \      missed — replay-on-subscribe, carrying `ageMs` — over both WS and SSE,\n  (c) that seed reaches\
  \ only the connection that asked for it,\n  (d) node 1's context state hash is identical before and\
  \ after the presence\n      write, measured against a NON-NULL baseline, proving presence never\n  \
  \    touches the DAG (the load-bearing invariant), and\n  (e) the entry is evicted from node 2 after\
  \ PRESENCE_TTL_MS (7 s), again\n      observed over both transports.\n\nEvery behaviour is asserted\
  \ on BOTH transports: SSE is what mero-js uses in production (`MeroJs.events` is an SseClient), WS is\
  \ still served and must not regress. Each phase pairs one subscriber per transport around a single publish,\
  \ so the extra coverage costs no extra wait cycles.\nPresence has NO read endpoint: a client learns\
  \ it only by subscribing to the event stream. The assertions therefore run as Node scripts driving real\
  \ WebSocket/SSE subscribers (merobox executes script steps through `sh`, so each .js has a one-line\
  \ .sh wrapper that execs `node`). set_ephemeral is still a JSON-RPC call — SSE is server-to-client only,\
  \ so publishing needs a request path. Nodes run in Proxy auth mode (default), so no Bearer token is\
  \ required.\nThe no-DAG-growth assertion (Phase 4 of the assertion script) is the load-bearing guard:\
  \ it must stay green for any future refactor that touches the inbound or outbound ephemeral handlers.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3740
accounts:
- ephemeral-node-1
- ephemeral-node-2
steps:
- name: Install kv-store on node 1 (scaffold for namespace/context creation)
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  outputs:
    app_id_bundle: hash
  account: ephemeral-node-1
- type: set
  values:
    app_id: com.calimero.kv-store
- name: Assert app installed on node 1
  type: assert
  statements:
  - is_set({{app_id}})
- name: Node 1 creates namespace
  type: create_org
  org_name: Node 1 creates namespace
  outputs:
    namespace_id: orgId
  account: ephemeral-node-1
- name: Node 1 creates context inside the namespace root group
  type: deploy
  account: ephemeral-node-1
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  app_name: Node 1 creates context inside the namespace root group
  org: '{{namespace_id}}'
  outputs:
    ctx_id: contextId
    node1_key: memberPublicKey
- name: Assert context created
  type: assert
  statements:
  - is_set({{ctx_id}})
  - is_set({{node1_key}})
- name: Node 1 creates namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: ephemeral-node-1
  outputs:
    ns_invite: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: ephemeral-node-2
- type: whoami
  account: ephemeral-node-2
  outputs:
    node2_identity: publicKey
- name: Node 2 joins context
  type: whoami
  account: ephemeral-node-2
  outputs:
    node2_key: publicKey
- name: Assert bootstrap shape
  type: assert
  statements:
  - is_set({{namespace_id}})
  - is_set({{ctx_id}})
  - is_set({{node1_key}})
  - is_set({{node2_identity}})
  - is_set({{node2_key}})
- name: Wait for gossip mesh to settle after context join
  type: wait
  seconds: 30.0
