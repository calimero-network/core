# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: Bundle Invitation Flow Test
description: Test bundle installation and invitation flow - User 1 installs bundle, creates context, invites
  User 2, User 2 automatically gets bundle
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3720
accounts:
- calimero-node-1
- calimero-node-2
steps:
- name: Install Bundle Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  outputs:
    bundle_app_id_bundle: hash
  account: calimero-node-1
- type: set
  values:
    bundle_app_id: com.calimero.kv-store
- name: Assert Bundle Application Installed
  type: assert
  statements:
  - is_set({{bundle_app_id}})
- name: Create Mesh with Bundle
  type: create_org
  account: calimero-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: calimero-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: calimero-node-2
  token: '{{_mesh_invite}}'
- name: Create Mesh with Bundle
  type: deploy
  account: calimero-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  app_name: Create Mesh with Bundle
  outputs:
    context_id: contextId
    inviter_public_key: memberPublicKey
- name: Call Set Method on Node 2
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: test_key
    value: test_value
  account: calimero-node-2
  outputs:
    set_result: rpc
- name: Assert Set Method Succeeded
  type: json_assert
  statements:
  - 'json_equal({{set_result}}, {"output": null})'
- name: Call Get Method on Node 2
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: test_key
  account: calimero-node-2
  outputs:
    get_result: rpc
- name: Assert Get Method Returns Correct Value
  type: json_assert
  statements:
  - 'json_equal({{get_result}}, {"output": "test_value"})'
- name: Call Get Method on Node 1
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: test_key
  account: calimero-node-1
  outputs:
    get_result_node1: rpc
- name: Assert User 1 Can Read Value Set by User 2
  type: json_assert
  statements:
  - 'json_equal({{get_result_node1}}, {"output": "test_value"})'
