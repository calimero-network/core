[package]
name = "kv-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "A string key-value store: the component SDK's basic example"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like the SDK's sample guest: the tests build this crate for wasm32-wasip2.
# The wasmer build of this store (crate `kv-store` in the core workspace) is
# apps/wasmer-fixtures/kv-store.
[workspace]
