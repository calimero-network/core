[package]
name = "kv-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "A string key-value store: the component SDK's basic example"

[lib]
crate-type = ["cdylib"]

[features]
# PoC: the map is served by the host's `calimero:app/collections`.
host-collections = ["calimero-sdk/host-collections"]

[dependencies]
calimero-sdk = { path = "../../crates/sdk" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk = { path = "../../crates/sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like the SDK's sample guest: the tests build this crate for wasm32-wasip2.
[workspace]
