name: E2E Scaffolding - a non-member keeps up past a private space it cannot read
description: >
  Regression coverage for #4511: a group op that a namespace member outside
  the group can read but not authorize must not stall that member's namespace
  governance.

  A member outside a private space cannot read what is sealed under the space's
  key. That must not stall the member's namespace governance: the namespace DAG
  is shared by every group, so an op that parks behind unreadable history of
  one space would hold every op after it, and the node would never see another
  subgroup.

  Topology:
    * node-1 - the namespace owner, and the subgroup's creator.
    * node-2 - a plain namespace member, never added to `before`.

  node-2 is offline while node-1 creates `before`, makes it Restricted, gives
  it a sealed op (its metadata), deletes it, and creates `after` - the subgroup, and its key, gone before node-2 can ask for
  it, as in the production incident.

  Headline: back online, node-2 reads past the sealed name, applies the
  deletion and lists `after`.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: e2e-node

steps:
  - name: Login on e2e-node-1
    type: login
    node: e2e-node-1
    username: dev
    password: dev-password

  - name: Login on e2e-node-2
    type: login
    node: e2e-node-2
    username: dev
    password: dev-password

  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create namespace on node-1
    type: create_namespace
    node: e2e-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Assert namespace created
    type: assert
    statements:
      - "is_set({{namespace_id}})"

  - name: Invite node-2 to namespace
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  - name: Node-2 joins namespace
    type: join_namespace
    node: e2e-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'
    outputs:
      identity_node2: memberIdentity

  # Node-2 must hold the namespace before node-1 seals anything, so every op
  # below reaches it through the namespace DAG.
  - name: Converge node-2 on the namespace before the subgroup exists
    type: wait_for_sync
    group_id: '{{namespace_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    trigger_sync: true

  # --- node-2 goes offline, as the stalled member was during the incident ---

  - name: Node-2 goes offline
    type: stop_node
    nodes: e2e-node-2

  # --- The trigger: a private space with a sealed op, then deleted ---

  # Visibility is set in steps of their own, not `visibility:` on the create:
  # merobox's born-visibility create sends no auth header. Restricted before
  # anything is sealed in it, so the result is the same as born Restricted.
  - name: Node-1 creates `before`
    type: create_group_in_namespace
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    group_name: before
    outputs:
      before_sub: groupId

  - name: Assert `before` created
    type: assert
    statements:
      - "is_set({{before_sub}})"

  - name: Node-1 marks `before` Restricted
    type: set_subgroup_visibility
    node: e2e-node-1
    group_id: '{{before_sub}}'
    visibility: restricted

  # Sealed under `before`'s own key: node-2, outside `before`, can never read it.
  - name: Node-1 names `before` (an op sealed under the subgroup key)
    type: set_group_metadata
    node: e2e-node-1
    group_id: '{{before_sub}}'
    record_name: Before

  # The subgroup, and its key, are gone before node-2 can ask anyone for it.
  - name: Node-1 deletes `before`
    type: delete_group
    node: e2e-node-1
    group_id: '{{before_sub}}'

  # Causally after the deletion: on a stalled node-2 this never applies.
  - name: Node-1 creates `after`
    type: create_group_in_namespace
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    group_name: after
    outputs:
      after_sub: groupId

  - name: Assert `after` created
    type: assert
    statements:
      - "is_set({{after_sub}})"

  # Explicit, so the scenario holds whichever visibility a subgroup is born
  # with by default. Nothing is sealed in `after`, so node-2 can authorize it.
  - name: Node-1 marks `after` Open
    type: set_subgroup_visibility
    node: e2e-node-1
    group_id: '{{after_sub}}'
    visibility: open

  # --- node-2 comes back ---

  - name: Node-2 comes back online
    type: start_node
    nodes: e2e-node-2

  - name: Login on e2e-node-2
    type: login
    node: e2e-node-2
    username: dev
    password: dev-password

  # --- Headline ---

  # A stalled node-2's head never moves past the deletion, so this times out.
  - name: Converge node-2 on the namespace after the deletion
    type: wait_for_sync
    group_id: '{{namespace_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 90
    trigger_sync: true

  - name: Brief settle for the rest of that backfill
    type: wait
    seconds: 3

  - name: Node-2 lists the namespace subgroups
    type: list_subgroups
    node: e2e-node-2
    group_id: '{{namespace_id}}'
    outputs:
      subgroups_node2: subgroups

  - name: Assert node-2 kept up - it sees `after`, created after the sealed name
    type: assert
    statements:
      - "contains({{subgroups_node2}}, {{after_sub}})"

  - name: Assert node-2 applied the deletion that came after the sealed name
    type: assert
    statements:
      - "not_contains({{subgroups_node2}}, {{before_sub}})"

  # Control: node-1 holds every key and applied everything.
  - name: Node-1 lists the namespace subgroups
    type: list_subgroups
    node: e2e-node-1
    group_id: '{{namespace_id}}'
    outputs:
      subgroups_node1: subgroups

  - name: Assert node-1 sees `after` and not the deleted `before`
    type: assert
    statements:
      - "contains({{subgroups_node1}}, {{after_sub}})"
      - "not_contains({{subgroups_node1}}, {{before_sub}})"

stop_all_nodes: false
