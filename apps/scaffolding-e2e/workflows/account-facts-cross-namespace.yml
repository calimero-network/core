# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   account_pair output credential (v1 device key) x1: checks what the dropped steps did
#   account_revoke output (v1 key rotation) x1: checks what the dropped steps did
#   assert statement on a dropped step's output x2: checks what the dropped steps did
#   json_assert statement on a dropped step's output x1: checks what the dropped steps did
#   login (unknown) x3: checks what the dropped steps did
#   wait_for_sync x6: replication is synchronous: a read sees every committed write
name: E2E Account - A Device Is Paired And Revoked In Every Namespace
description: "The acceptance test for account facts being account-scoped (#3428). A device belongs to\
  \ an ACCOUNT, not to a namespace, so pairing one and revoking one are statements about the account and\
  \ have to hold everywhere the account speaks.\nEvery other account scenario runs in a single namespace,\
  \ which is exactly the shape that cannot see this. Before the change both operations reached one namespace\
  \ — whichever the caller happened to name — so a device revoked from the namespace you were looking\
  \ at went on writing in the one you were not, under the same account, while the operator was told it\
  \ was revoked.\nThe cast:\n\n  * node-1 — admin of BOTH namespaces, and the one that invites.\n  * node-2\
  \ — Alice's laptop. A member of both, and the holder of Alice's\n    account. It does the pairing and\
  \ the revoking, because both are the\n    account's authority rather than an admin's.\n  * node-3 —\
  \ Alice's phone. A member of NOTHING. Its whole right to\n    participate is being a device of Alice's\
  \ account, which is what makes it\n    the right probe: anything it can do, it can do because of the\
  \ account.\n\nWhat each assertion is load-bearing for:\n\n  1. Pairing runs against namespace A only.\
  \ The link is published into both,\n     because the certificate is root-signed and the endorsement\
  \ is signed by\n     a node-level key — neither names a namespace. `keyDelivered` proves the\n     scope\
  \ key for the namespace the pairing named actually reached the\n     device; the cross-namespace half\
  \ is proven by the revocation below,\n     which can only name namespaces that hold a binding for the\
  \ device.\n\n  2. Revocation runs against namespace A only, and `revokedIn` must name\n     BOTH. That\
  \ list is built by walking the namespaces this node takes part\n     in and skipping any that hold no\
  \ binding for the device — so two entries\n     means the pairing genuinely linked the device in both,\
  \ and the\n     revocation genuinely reached both. One entry is the old behaviour and\n     the bug.\n\
  \nDeliberately not asserted here: the read/write lockout in the second namespace. `account-device-revoke-lockout`\
  \ already pins that end-to-end in one namespace, and repeating it here would buy a slower scenario rather\
  \ than a stronger claim. What is unique to this one is the SET of namespaces the two operations reach.\n\
  User-visible failure mode this guards against: \"I revoked my stolen phone and it kept writing to my\
  \ other team's data.\"\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3960
accounts:
- account-xns-node-1
- account-xns-node-2
- account-xns-node-3
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: account-xns-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Node-1 creates namespace A
  type: create_org
  org_name: Node-1 creates namespace A
  outputs:
    ns_a: orgId
  account: account-xns-node-1
- name: Node-1 creates namespace B
  type: create_org
  org_name: Node-1 creates namespace B
  outputs:
    ns_b: orgId
  account: account-xns-node-1
- name: Invite node-2 to namespace A
  type: invite
  org: '{{ns_a}}'
  role: member
  account: account-xns-node-1
  outputs:
    invite_a: token
- name: Node-2 joins namespace A
  type: redeem_invite
  token: '{{invite_a}}'
  account: account-xns-node-2
- name: Invite node-2 to namespace B
  type: invite
  org: '{{ns_b}}'
  role: member
  account: account-xns-node-1
  outputs:
    invite_b: token
- name: Node-2 joins namespace B
  type: redeem_invite
  token: '{{invite_b}}'
  account: account-xns-node-2
- name: Node-2 enrolls its account in namespace A
  type: whoami
  outputs:
    account_a: publicKey
    device_a: passkeyId
    root_key: publicKey
  account: account-xns-node-2
- name: Node-2 enrolls the same account in namespace B
  type: whoami
  outputs:
    account_b: publicKey
    device_b: passkeyId
  account: account-xns-node-2
- name: One root key is one account, and one node is one device
  type: json_assert
  statements:
  - json_equal({{account_a}}, {{account_b}})
  - json_equal({{device_a}}, {{device_b}})
- name: Pair node-3 onto Alice's account, via namespace A
  type: add_device
  account: account-xns-node-2
  device: account-xns-node-3
  outputs:
    key_delivered: keyDelivered
- name: What node-3 speaks as, now that it is paired
  type: whoami
  outputs:
    paired_account: publicKey
    paired_device: passkeyId
  account: account-xns-node-3
- name: The phone joined Alice's account, carrying a key and a credential
  type: json_assert
  statements:
  - json_equal({{paired_account}}, {{account_a}})
  - json_not_equal({{paired_device}}, {{device_a}})
  - json_equal({{key_delivered}}, true)
- name: The account holder revokes the phone, naming namespace A
  type: http
  method: delete
  path: auth/passkeys/{{paired_device}}
  account: account-xns-node-2
