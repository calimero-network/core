# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: E2E KV Store - Root bootstrap convergence on cold join
description: "Regression guard for the cold-join Root<T> convergence bug.\nScenario:\n  1. node-1 alone\
  \ creates a namespace and a context, then writes\n     several keys via the app's KV `set` method. Each\
  \ write\n     advances node-1's HLC, so by the end node-1's `Root<T>`\n     entry (the typed application-state\
  \ container at the\n     canonical root id `[118; 32]`) carries the HLC of the last\n     write.\n \
  \ 2. A short settle pauses real-time progression so node-2's\n     HLC at materialisation time is unambiguously\
  \ LATER than\n     node-1's last `Root` update.\n  3. node-2 joins the namespace and the context cold.\
  \ Joining\n     constructs a fresh `Root<T>` on node-2 at materialisation\n     time, so node-2's local\
  \ `Root` entry now has a HLC that is\n     LATER than the populated `Root` on node-1, even though\n\
  \     node-2's `Root` is the empty default and node-1's holds\n     all the real application state.\n\
  \  4. node-2 immediately writes its own key, then a `wait_for_sync`\n     with `trigger_sync: true`\
  \ forces a HashComparison round\n     between the two now-initialised peers (both have\n     `has_state\
  \ = true`, so `select_protocol` lands on\n     HashComparison rather than Snapshot).\n  5. We then read\
  \ back BOTH sides:\n       - node-2 must see every key node-1 wrote in step 1\n         (the failure\
  \ mode the bug produced: node-2's \"later\"\n         empty `Root` would silently win an LWW-by-HLC\
  \ merge\n         and drop node-1's data on the joiner).\n       - node-1 must still hold every key\
  \ it originally wrote\n         (the failure mode that follows on the next sync tick:\n         node-2\
  \ propagates its post-join empty `Root` back and\n         wipes node-1).\n       - node-1 and node-2\
  \ must both see node-2's post-join\n         write (a sanity check that bidirectional convergence\n\
  \         still works at all).\n\nThis scenario is the cold-join HLC-inversion case that routing `Root<T>`\
  \ through the generic LWW-by-HLC path reintroduces. The fix routes `Root<T>` merges through `merge_root_state`\
  \ instead, which delegates to the application's registered `Mergeable` impl (auto-generated by the `#[app::state]`\
  \ macro) so each field merges with its own CRDT semantics — and a bootstrap-aware default in `merge_root_state`\
  \ accepts the incoming side when the local side has never been explicitly written (created_at == updated_at).\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4790
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    ns: orgId
  account: e2e-node-1
- name: Create context on node-1
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context on node-1
  org: '{{ns}}'
  outputs:
    ctx: contextId
- name: Node-1 writes key A
  type: call
  app: '{{ctx}}'
  method: set
  args:
    key: alpha
    value: from_node_1_first
  account: e2e-node-1
- name: Node-1 writes key B
  type: call
  app: '{{ctx}}'
  method: set
  args:
    key: beta
    value: from_node_1_second
  account: e2e-node-1
- name: Node-1 writes key C
  type: call
  app: '{{ctx}}'
  method: set
  args:
    key: gamma
    value: from_node_1_third
  account: e2e-node-1
- name: Settle so node-2's join HLC is later than node-1's last write
  type: wait
  seconds: 5.0
- name: Invite node-2 to namespace
  type: invite
  org: '{{ns}}'
  role: member
  account: e2e-node-1
  outputs:
    invitation: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invitation}}'
  account: e2e-node-2
- name: Node-2 writes its own key after join
  type: call
  app: '{{ctx}}'
  method: set
  args:
    key: delta_from_node2
    value: joiner_post_join_write
  account: e2e-node-2
- name: Settle after convergence
  type: wait
  seconds: 3.0
- name: Node-2 reads key A (node-1's first write)
  type: call
  app: '{{ctx}}'
  method: get
  args:
    key: alpha
  account: e2e-node-2
  outputs:
    alpha_node2: rpc
- name: Assert node-2 sees node-1's key A
  type: json_assert
  statements:
  - 'json_equal({{alpha_node2}}, {"output": "from_node_1_first"})'
- name: Node-2 reads key B (node-1's second write)
  type: call
  app: '{{ctx}}'
  method: get
  args:
    key: beta
  account: e2e-node-2
  outputs:
    beta_node2: rpc
- name: Assert node-2 sees node-1's key B
  type: json_assert
  statements:
  - 'json_equal({{beta_node2}}, {"output": "from_node_1_second"})'
- name: Node-2 reads key C (node-1's third write)
  type: call
  app: '{{ctx}}'
  method: get
  args:
    key: gamma
  account: e2e-node-2
  outputs:
    gamma_node2: rpc
- name: Assert node-2 sees node-1's key C
  type: json_assert
  statements:
  - 'json_equal({{gamma_node2}}, {"output": "from_node_1_third"})'
- name: Node-1 reads back key A (must not have been wiped by node-2's empty Root)
  type: call
  app: '{{ctx}}'
  method: get
  args:
    key: alpha
  account: e2e-node-1
  outputs:
    alpha_node1: rpc
- name: Assert node-1 still has key A
  type: json_assert
  statements:
  - 'json_equal({{alpha_node1}}, {"output": "from_node_1_first"})'
- name: Node-1 reads back key C (must not have been wiped by node-2's empty Root)
  type: call
  app: '{{ctx}}'
  method: get
  args:
    key: gamma
  account: e2e-node-1
  outputs:
    gamma_node1: rpc
- name: Assert node-1 still has key C
  type: json_assert
  statements:
  - 'json_equal({{gamma_node1}}, {"output": "from_node_1_third"})'
- name: Node-1 reads node-2's post-join write (bidirectional sanity)
  type: call
  app: '{{ctx}}'
  method: get
  args:
    key: delta_from_node2
  account: e2e-node-1
  outputs:
    delta_node1: rpc
- name: Assert node-1 sees node-2's post-join write
  type: json_assert
  statements:
  - 'json_equal({{delta_node1}}, {"output": "joiner_post_join_write"})'
