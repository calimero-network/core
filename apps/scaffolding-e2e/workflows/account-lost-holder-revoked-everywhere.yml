# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   account_devices (unknown) x1: checks what the dropped steps did
#   account_revoke with a root proof (v1 account root) x1: checks what the dropped steps did
#   assert_api_response x3: v1 admin API
#   assert_log_present x1: v1 node logs
#   login (unknown) x5: checks what the dropped steps did
#   node_exec (unknown) x2: checks what the dropped steps did
#   node_identity output accountNamespaceId (v1 device key) x1: checks what the dropped steps did
#   start_node x1: a user's node going offline has no counterpart in a cluster
#   stop_node x1: a user's node going offline has no counterpart in a cluster
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# Migration note: v1's phone revoked the lost laptop with a proof minted from the
#   account root (dropped: an account has no root key) and the tablet carried the
#   tombstone into B1, where the phone was never a member. Here a device is a passkey:
#   the phone, a passkey of the same account, removes the laptop's, which ends its
#   sessions in every organization at once. The laptop's write is refused
#   UNAUTHENTICATED (v1: allow_failure) and the tablet still reads the value from before
#   the loss
name: E2E Account - A Lost Holder Is Retired From Namespaces Its Revoker Never Joined
description: 'A proof-bearing revocation published into the account namespace is carried by the account''s
  other devices into the namespaces the revoker was never in.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3970
accounts:
- account-carry-node-1
- account-carry-node-2
- account-carry-node-3
- account-carry-node-4
steps:
- name: Install app A on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_a_bundle: hash
  account: account-carry-node-1
- type: set
  values:
    app_a: com.calimero.scaffolding-e2e
- name: Install app B on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_b_bundle: hash
  account: account-carry-node-1
- type: set
  values:
    app_b: com.calimero.scaffolding-e2e-multi
- name: Node-1 creates A1
  type: create_org
  org_name: Node-1 creates A1
  outputs:
    ns_a: orgId
  account: account-carry-node-1
- name: Node-1 creates B1
  type: create_org
  org_name: Node-1 creates B1
  outputs:
    ns_b: orgId
  account: account-carry-node-1
- name: Node-1 creates the context in B1
  type: deploy
  account: account-carry-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: store-a
  org: '{{ns_b}}'
  outputs:
    context_id: contextId
- name: What node-1 speaks as
  type: whoami
  outputs:
    lost_device: passkeyId
    root_key: publicKey
  account: account-carry-node-1
- name: Pair node-2 onto Alice's account, scoped to app A
  type: add_device
  account: account-carry-node-1
  device: account-carry-node-2
- name: Pair node-3 onto Alice's account, scoped to app B
  type: add_device
  account: account-carry-node-1
  device: account-carry-node-3
- name: Pair node-4 onto Alice's account, scoped to app B
  type: add_device
  account: account-carry-node-1
  device: account-carry-node-4
- name: The soon-to-be-lost laptop writes into B1's context
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: from-the-laptop
    value: before-the-loss
  account: account-carry-node-1
- name: The tablet saw the laptop's write
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: from-the-laptop
  account: account-carry-node-3
  outputs:
    before_loss: rpc
- name: The laptop was live before it was lost
  type: json_assert
  statements:
  - 'json_equal({{before_loss}}, {"output": "before-the-loss"})'
- name: The phone removes the lost laptop's passkey
  type: http
  method: delete
  path: auth/passkeys/{{lost_device}}
  account: account-carry-node-2
- name: The retired laptop can no longer write
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: from-the-laptop
    value: after-the-loss
  account: account-carry-node-1
  expected_error: UNAUTHENTICATED
- name: Give the refused delta every chance to land
  type: wait
  seconds: 25.0
- name: The tablet still reads the value from before the loss
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: from-the-laptop
  account: account-carry-node-3
  outputs:
    after_loss: rpc
- name: The retired laptop's write never landed
  type: json_assert
  statements:
  - 'json_equal({{after_loss}}, {"output": "before-the-loss"})'
