# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x6: replication is synchronous: a read sees every committed write
name: E2E Account - A Namespace Owner Writes In An Open Subgroup Someone Else Created
description: "Pins the live window for calimero-network/core#3489: does a namespace owner with a REAL\
  \ enrolled account lose writes in an Open subgroup created by another member?\nThe projection says it\
  \ should. `member_at_cut` answers `Some(false)` for a real-account admin with no folded presence in\
  \ the subgroup, and that verdict is not advisory — it maps to `DeltaAuthOutcome::MembershipReject`,\
  \ which every receiving peer applies on gossip, on DAG-catchup parent-pull, and in the sync manager.\
  \ There is no live-resolver fallback behind it; the gossip site calls the projection the \"SOLE AUTHORITY\"\
  .\nWhat makes the owner have no folded presence is WHO CREATES THE SUBGROUP. Node-2 creates it, so node-2\
  \ becomes the folded `group_admin`. Node-1 owns the namespace above it and reaches the subgroup only\
  \ by inheritance, through the out-of-band root — which is exactly the path that compares the root's\
  \ `admin_identity` (a real account) against what an unfolded key resolves to.\nThis scenario exists\
  \ to answer a question I could not answer by reading: the unit-level probe proves the projection denies,\
  \ but enrolment is implicit on every join path now, so a real node may well fold a credential before\
  \ it ever writes. If it does, the window is closed in practice and #3489 is a latent defect rather than\
  \ a live one. Either answer is worth having, and the scenario is written so the two are distinguishable\
  \ rather than both showing up as \"failed\".\nReading the result:\n\n  * Node-2 reads back node-1's\
  \ value  →  the window is CLOSED. Something on\n    node-1's path folds its credential before the write,\
  \ and #3489 cannot be\n    reached this way. The scenario documents that and stays as a regression\n\
  \    guard.\n\n  * Node-2 reads null/empty  →  the window is OPEN. Node-1's delta was\n    rejected\
  \ by node-2 as not-a-member, and a namespace owner silently loses\n    writes in their own namespace.\
  \ Node-1's own read still succeeds, because\n    the write applied locally — that asymmetry is the signature.\n\
  \nThe control matters as much as the assertion: node-2 writes and node-1 reads it back. Node-2 IS the\
  \ folded subgroup admin, so that direction must work. If both directions fail, the scenario is broken\
  \ rather than the code.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4720
accounts:
- owner-foreign-sub-node-1
- owner-foreign-sub-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: owner-foreign-sub-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Node-1 creates the namespace
  type: create_org
  org_name: Node-1 creates the namespace
  outputs:
    namespace_id: orgId
  account: owner-foreign-sub-node-1
- name: Invite node-2 to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: owner-foreign-sub-node-1
  outputs:
    ns_invite: token
- name: Node-2 joins the namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: owner-foreign-sub-node-2
- type: whoami
  account: owner-foreign-sub-node-2
  outputs:
    node2_account: publicKey
- name: Node-1 grants node-2 the right to create a subgroup
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 36
  account: owner-foreign-sub-node-1
  member: '{{node2_account}}'
- name: Node-2 creates an Open subgroup
  type: create_team
  org: '{{namespace_id}}'
  team_name: foreign-open-subgroup
  join: invite
  outputs:
    subgroup_id: teamId
  account: owner-foreign-sub-node-2
- name: Mark the subgroup Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  join: everyone
  account: owner-foreign-sub-node-2
- name: Node-2 creates a context in its subgroup
  type: deploy
  account: owner-foreign-sub-node-2
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Node-2 creates a context in its subgroup
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{subgroup_id}}'
  outputs:
    ctx_id: contextId
    node2_key: memberPublicKey
- name: Node-2 writes
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: from_subgroup_admin
    value: node2_wrote_this
  account: owner-foreign-sub-node-2
  as_key: '{{node2_key}}'
- name: Node-2 reads its own write
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: from_subgroup_admin
  account: owner-foreign-sub-node-2
  as_key: '{{node2_key}}'
  outputs:
    control_read: rpc
- name: Control - the folded subgroup admin's write landed
  type: json_assert
  statements:
  - 'json_equal({{control_read}}, {"output": "node2_wrote_this"})'
- name: Node-1 joins the context in node-2's subgroup
  type: whoami
  account: owner-foreign-sub-node-1
  outputs:
    node1_key: publicKey
- name: The namespace owner writes into the foreign subgroup
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: from_namespace_owner
    value: node1_wrote_this
  account: owner-foreign-sub-node-1
  as_key: '{{node1_key}}'
- name: Node-1 reads its own write locally
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: from_namespace_owner
  account: owner-foreign-sub-node-1
  as_key: '{{node1_key}}'
  outputs:
    owner_local_read: rpc
- name: The owner's write applied locally
  type: json_assert
  statements:
  - 'json_equal({{owner_local_read}}, {"output": "node1_wrote_this"})'
- name: Node-2 reads the namespace owner's write
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: from_namespace_owner
  account: owner-foreign-sub-node-2
  as_key: '{{node2_key}}'
  outputs:
    owner_read_by_peer: rpc
- name: The namespace owner's write reached the peer
  type: json_assert
  statements:
  - 'json_equal({{owner_read_by_peer}}, {"output": "node1_wrote_this"})'
