name: E2E Private Folders - Invitations Target The Workspace Or A Private Folder, Not An Open Folder Inside One
description: >
  An invitation can be minted for the workspace and for a private folder.
  An invitation targeting Notes, an open folder inside the private folder Minutes, must be refused.
  The script reports the status it saw in the log, so the current behaviour is on record whichever way it goes.

  Tree: workspace -> Secret (private), Board (private) -> Minutes (private) -> Notes (open).
  Nodes: 1 Alice (workspace owner).

force_pull_image: false

auth_mode: embedded

nodes:
  count: 1
  image: merod:local
  prefix: private-folders

steps:

  - name: Login on node-1
    type: login
    node: private-folders-1
    username: dev
    password: dev-password

  # Workspace: node-1 (Alice) owns it, nodes 2.. join as plain members.
  # Alice is node-1, Bob node-2, Carol node-3, Dave node-4.

  - name: Install the application on Alice's node
    type: install_application
    node: private-folders-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app: applicationId

  - name: Alice creates the workspace
    type: create_namespace
    node: private-folders-1
    application_id: '{{app}}'
    outputs:
      ns: namespaceId

  - name: Read Alice's account and key
    type: node_identity
    node: private-folders-1
    outputs:
      acc_a: accountId
      key_a: publicKey

  # The tree: Secret and Board are private folders directly under the workspace,
  # Minutes is a private folder inside Board, Notes is an open folder inside Minutes.

  - name: Alice creates the Secret folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: secret
    outputs:
      f_secret: groupId

  - name: Alice marks Secret restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_secret}}'
    visibility: restricted

  - name: Alice creates the Board folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: board
    outputs:
      f_board: groupId

  - name: Alice marks Board restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_board}}'
    visibility: restricted

  - name: Alice creates the Minutes folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: minutes
    outputs:
      f_minutes: groupId

  - name: Alice nests Minutes under board
    type: reparent_group
    node: private-folders-1
    child_group_id: '{{f_minutes}}'
    new_parent_id: '{{f_board}}'

  - name: Alice marks Minutes restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_minutes}}'
    visibility: restricted

  - name: Alice creates the Notes folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: notes
    outputs:
      f_notes: groupId

  - name: Alice nests Notes under minutes
    type: reparent_group
    node: private-folders-1
    child_group_id: '{{f_notes}}'
    new_parent_id: '{{f_minutes}}'

  - name: Alice marks Notes open
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_notes}}'
    visibility: open

  - name: An invitation targeting the workspace is accepted
    type: script
    script: scripts/group-invite.sh
    target: local
    args:
    - private-folders-1
    - '{{ns}}'
    - accepted

  - name: An invitation targeting the private folder Board is accepted
    type: script
    script: scripts/group-invite.sh
    target: local
    args:
    - private-folders-1
    - '{{f_board}}'
    - accepted

  - name: An invitation targeting the private folder Minutes is accepted
    type: script
    script: scripts/group-invite.sh
    target: local
    args:
    - private-folders-1
    - '{{f_minutes}}'
    - accepted

  - name: An invitation targeting the open folder Notes inside Minutes is refused
    type: script
    script: scripts/group-invite.sh
    target: local
    args:
    - private-folders-1
    - '{{f_notes}}'
    - refused

stop_all_nodes: true
restart: false
wait_timeout: 120
