name: E2E Account - Every Device Follows The Account Namespace
description: >
  A phone paired with only the account namespace id is bound there on both nodes,
  and the laptop never lists that namespace as a project.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: merod:local
  prefix: account-ns-node

steps:
  - name: Login on node-1
    type: login
    node: account-ns-node-1
    username: dev
    password: dev-password

  - name: Login on node-2
    type: login
    node: account-ns-node-2
    username: dev
    password: dev-password

  # A script, because merobox's account_pair step has no field for the account namespace id.
  - name: Pair node-2 with only the account namespace, and check both sides agree
    type: script
    script: scripts/account-namespace-pair-into.sh
    target: local
    args:
      - account-ns-node-1
      - account-ns-node-2
      - '-'
      - '-'

  - name: The laptop's namespace listing stays empty
    type: assert_api_response
    node: account-ns-node-1
    path: /admin-api/namespaces
    absent:
      - data.0

  - name: The phone speaks as a device of the account
    type: assert_api_response
    node: account-ns-node-2
    path: /admin-api/identity
    match:
      data.holdsAccountRoot: false
      data.deviceCertified: true
    retries: 30
    interval: 2

stop_all_nodes: true
