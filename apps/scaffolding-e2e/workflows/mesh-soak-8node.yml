name: E2E KV Store - 8-Node Gossipsub Mesh Soak
description: >
  Verifies the gossipsub mesh-size knobs (mesh_n_low=2, mesh_n=4,
  mesh_n_high=8) hold up at the upper end of Calimero's 2-20 peer target
  range. Spins up 8 nodes, joins all of them to a single namespace and
  context, executes writes from two different nodes to exercise the
  bidirectional broadcast path, then idles long enough for two
  `gossipsub mesh size` snapshots (interval 30s) to land in every node's
  logs so the steady-state mesh size is captured in the artifact.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 8
  image: ghcr.io/calimero-network/merod:edge
  prefix: e2e-node

steps:
  # First login on a fresh embedded-auth node bootstraps its root key
  # and seeds merobox's token cache; every step below runs authenticated.
  - name: Login on e2e-node-1
    type: login
    node: e2e-node-1
    username: dev
    password: dev-password

  - name: Login on e2e-node-2
    type: login
    node: e2e-node-2
    username: dev
    password: dev-password

  - name: Login on e2e-node-3
    type: login
    node: e2e-node-3
    username: dev
    password: dev-password

  - name: Login on e2e-node-4
    type: login
    node: e2e-node-4
    username: dev
    password: dev-password

  - name: Login on e2e-node-5
    type: login
    node: e2e-node-5
    username: dev
    password: dev-password

  - name: Login on e2e-node-6
    type: login
    node: e2e-node-6
    username: dev
    password: dev-password

  - name: Login on e2e-node-7
    type: login
    node: e2e-node-7
    username: dev
    password: dev-password

  - name: Login on e2e-node-8
    type: login
    node: e2e-node-8
    username: dev
    password: dev-password

  # --- Setup on node-1 ---

  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: res/scaffolding_e2e.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Create the mesh - namespace, context and every joiner
    type: create_mesh
    context_node: e2e-node-1
    application_id: '{{app_id}}'
    path: res/scaffolding_e2e.wasm
    nodes:
      - e2e-node-2
      - e2e-node-3
      - e2e-node-4
      - e2e-node-5
      - e2e-node-6
      - e2e-node-7
      - e2e-node-8
    outputs:
      namespace_id: namespaceId
      ctx_id: contextId

  # --- Nodes 2-8 join namespace + context ---

  # --- Broadcast path: write on node-1, verify all 8 converge ---

  - name: Set k1 on node-1
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "soak_k1"
      value: "soak_v1"

  - name: Wait for k1 to sync to all 8 nodes
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
      - e2e-node-3
      - e2e-node-4
      - e2e-node-5
      - e2e-node-6
      - e2e-node-7
      - e2e-node-8
    timeout: 60
    trigger_sync: true

  - name: Read k1 on node-8 (far end)
    type: call
    node: e2e-node-8
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "soak_k1"
    outputs:
      n8_read_k1: result

  - name: Assert k1 propagated to node-8
    type: json_assert
    statements:
      - 'json_equal({{n8_read_k1}}, {"output": "soak_v1"})'

  # --- Bidirectional path: write on node-5, verify all 8 converge ---

  - name: Set k2 on node-5
    type: call
    node: e2e-node-5
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "soak_k2"
      value: "soak_v2"

  - name: Wait for k2 to sync to all 8 nodes
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
      - e2e-node-3
      - e2e-node-4
      - e2e-node-5
      - e2e-node-6
      - e2e-node-7
      - e2e-node-8
    timeout: 60
    trigger_sync: true

  - name: Read k2 on node-1 (opposite end)
    type: call
    node: e2e-node-1
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "soak_k2"
    outputs:
      n1_read_k2: result

  - name: Assert k2 propagated to node-1
    type: json_assert
    statements:
      - 'json_equal({{n1_read_k2}}, {"output": "soak_v2"})'

  # --- Idle so two mesh-stats snapshots fire (interval = 30 s) ---

  - name: Idle for mesh-stats snapshots
    type: wait
    seconds: 70
