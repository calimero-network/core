# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x8: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: E2E KV Store - 8-Node Gossipsub Mesh Soak
description: 'Verifies the gossipsub mesh-size knobs (mesh_n_low=2, mesh_n=4, mesh_n_high=8) hold up at
  the upper end of Calimero''s 2-20 peer target range. Spins up 8 nodes, joins all of them to a single
  namespace and context, executes writes from two different nodes to exercise the bidirectional broadcast
  path, then idles long enough for two `gossipsub mesh size` snapshots (interval 30s) to land in every
  node''s logs so the steady-state mesh size is captured in the artifact.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4710
accounts:
- e2e-node-1
- e2e-node-2
- e2e-node-3
- e2e-node-4
- e2e-node-5
- e2e-node-6
- e2e-node-7
- e2e-node-8
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Create the mesh - namespace, context and every joiner
  type: create_org
  account: e2e-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: e2e-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-2
  token: '{{_mesh_invite}}'
- type: invite
  account: e2e-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-3
  token: '{{_mesh_invite}}'
- type: invite
  account: e2e-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-4
  token: '{{_mesh_invite}}'
- type: invite
  account: e2e-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-5
  token: '{{_mesh_invite}}'
- type: invite
  account: e2e-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-6
  token: '{{_mesh_invite}}'
- type: invite
  account: e2e-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-7
  token: '{{_mesh_invite}}'
- type: invite
  account: e2e-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-8
  token: '{{_mesh_invite}}'
- name: Create the mesh - namespace, context and every joiner
  type: deploy
  account: e2e-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create the mesh - namespace, context and every joiner
  outputs:
    ctx_id: contextId
- name: Set k1 on node-1
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: soak_k1
    value: soak_v1
  account: e2e-node-1
- name: Read k1 on node-8 (far end)
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: soak_k1
  account: e2e-node-8
  outputs:
    n8_read_k1: rpc
- name: Assert k1 propagated to node-8
  type: json_assert
  statements:
  - 'json_equal({{n8_read_k1}}, {"output": "soak_v1"})'
- name: Set k2 on node-5
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: soak_k2
    value: soak_v2
  account: e2e-node-5
- name: Read k2 on node-1 (opposite end)
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: soak_k2
  account: e2e-node-1
  outputs:
    n1_read_k2: rpc
- name: Assert k2 propagated to node-1
  type: json_assert
  statements:
  - 'json_equal({{n1_read_k2}}, {"output": "soak_v2"})'
- name: Idle for mesh-stats snapshots
  type: wait
  seconds: 70.0
