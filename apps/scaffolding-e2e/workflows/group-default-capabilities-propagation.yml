# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   login (unknown) x2: checks what the dropped steps did
name: E2E KV Store - Default Capabilities Propagation
description: "Regression test for issue #2256 / PR #2261: when an admin overrides the namespace's `default_capabilities`\
  \ *before* a new member joins, the new member must pick up the overridden value — not a hard-coded fallback\
  \ the joiner side previously substituted in.\nThe pre-fix bug: `create_group` writes `default_capabilities\
  \ = CAN_JOIN_OPEN_SUBGROUPS` to the creator's local store but never publishes the corresponding `DefaultCapabilitiesSet`\
  \ governance op, so a joiner couldn't read the value out of the governance DAG. A joiner-side mirror\
  \ substituted the same hard-coded constant — which silently overrode any admin change made via `set_default_capabilities`.\n\
  The fix: the namespace's current `default_capabilities` is carried in the join-bundle's `default_capabilities`\
  \ field, so the joiner reflects whatever the responder currently believes — including any admin-issued\
  \ override. This workflow asserts that contract.\nFlow:\n  1. node-1 installs the app and creates a\
  \ namespace. By construction\n     of `create_group`, the local default is CAN_JOIN_OPEN_SUBGROUPS (4).\n\
  \  2. node-1 admin overrides the default to 0 (no capabilities) via\n     `set_default_capabilities`.\n\
  \  3. node-1 invites node-2.\n  4. node-2 joins the namespace.\n  5. Assert node-2's individual capability\
  \ is 0 (the admin's override),\n     NOT 4 (the create-time hard-coded constant). If the assertion\n\
  \     fails with `json_equal({{node2_caps}}, 4)` truthy, the fix has\n     regressed.\n  6. As a downstream\
  \ sanity-check that the inherited cap actually\n     gates Open-subgroup access: node-1 creates an Open\
  \ subgroup\n     containing a context, and node-2 tries to join that context.\n     With caps=0 (no\
  \ CAN_JOIN_OPEN_SUBGROUPS), the parent-walk in\n     `check_group_membership` should refuse — `join_context`\
  \ must\n     fail. (`join_context_expect_failure` is the merobox action for\n     a deliberate-deny\
  \ scenario; if the runner doesn't support it,\n     this step can be commented out — the cap-value assertion\
  \ above\n     is sufficient regression coverage.)\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4300
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Assert namespace created
  type: assert
  statements:
  - is_set({{namespace_id}})
- name: Admin overrides default capabilities to 0
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 0
  account: e2e-node-1
- name: Create namespace invitation for node-2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    namespace_invitation: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: e2e-node-2
- type: whoami
  account: e2e-node-2
  outputs:
    member_account_node2: publicKey
- name: Get node-2 capabilities as seen by node-1
  type: member_capabilities
  org: '{{namespace_id}}'
  member: '{{member_account_node2}}'
  account: e2e-node-1
  outputs:
    node2_caps_view_node1: capabilities
- name: Assert node-2 picked up admin's override (caps=0)
  type: json_assert
  statements:
  - json_equal({{node2_caps_view_node1}}, 0)
- name: Get node-2 capabilities as seen by node-2 itself
  type: member_capabilities
  org: '{{namespace_id}}'
  member: '{{member_account_node2}}'
  account: e2e-node-2
  outputs:
    node2_caps_view_node2: capabilities
- name: Assert node-2 self-view is consistent (caps=0)
  type: json_assert
  statements:
  - json_equal({{node2_caps_view_node2}}, 0)
