name: E2E Scaffolding - Delegated Authorship
description: >
  A member that holds no node writes into a context, through a relay that runs
  the method on its behalf.

  This is the case the whole feature exists for and the one nothing else covers:
  the author is a device holding only a signing key. It never joins the group,
  never receives a scope key, and could not execute the application if it wanted
  to — the runtime is a JIT compiler. What makes the write its own is a warrant
  it signs, which travels with the change so every peer verifies it consented.

  The scenario is deliberately shaped so that each assertion can only pass for
  the right reason:

    1. The author's ACCOUNT is added as a member; its device joins nothing. A
       device-keyed membership check would refuse every write below, because a
       thin client's key is in no group's binding rows.
    2. The intent is refused BEFORE the relay is granted authorship. The grant is
       not implied by membership or by admin, and this is what proves it.
    3. The same warrant is then accepted once the grant is made — same bytes,
       same signature, different verdict, so the grant is what changed it.
    4. Re-presenting that warrant is refused. The signature is still perfectly
       valid: replay is not forgery, which is why the nonce ledger has to exist
       and why the envelope check cannot be what stops it.
    5. The write is then read back from a SECOND node, which is what proves peers
       accepted a delta whose author is not its signer. A relay could satisfy
       everything above locally and still be producing deltas the network drops.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: delegated-node

steps:
  - name: Login on delegated-node-1
    type: login
    node: delegated-node-1
    username: dev
    password: dev-password

  - name: Login on delegated-node-2
    type: login
    node: delegated-node-2
    username: dev
    password: dev-password

  # --- Setup: a namespace with two node members and a shared context ---

  - name: Install application on node-1
    type: install_application
    node: delegated-node-1
    path: res/scaffolding_e2e.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Create namespace on node-1
    type: create_namespace
    node: delegated-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Assert namespace created
    type: assert
    statements:
      - "is_set({{namespace_id}})"

  - name: Invite node-2 to the namespace
    type: create_namespace_invitation
    node: delegated-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  - name: Node-2 joins the namespace
    type: join_namespace
    node: delegated-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'
    outputs:
      account_node2: memberAccount

  - name: Create a context in the namespace
    type: create_context
    node: delegated-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      context_id: contextId

  - name: Assert context created
    type: assert
    statements:
      - "is_set({{context_id}})"

  - name: Node-2 joins the context
    type: join_context
    node: delegated-node-2
    context_id: '{{context_id}}'

  # No `expect` here, and that is not an omission: nothing has been written yet,
  # so there is no materialized value to wait on. This only has to establish that
  # node-2 is in the context before the delegated write happens.
  - name: Both nodes are in the context before anything is delegated
    type: wait_for_sync
    context_id: '{{context_id}}'
    nodes:
      - delegated-node-1
      - delegated-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # --- The delegated write ---
  #
  # Steps, not a shell script. The script this replaces existed only because
  # merobox had no way to hold a signing key or spend a warrant; `sign_warrant`
  # and `perform_intent` (merobox #373) do both. The script also could not export
  # custom `outputs:` — a `script` step only sets `script_output_local`, which the
  # next one overwrites — so every value it minted for the next stage went through
  # a temp file, and the assertions lived in shell rather than where a reader can
  # see them.
  #
  # The author's key material is minted live on every run — see below. An earlier
  # version of this file froze it as a fixture, which passed while exercising
  # nothing about how a credential is produced.

  # No membership step: the author is node-2's own account, already a member from
  # its namespace join. What delegated authorship turns on is not that the account
  # is new — it is that the DEVICE signing the warrant is in no group's binding
  # rows, and the one minted below never joins anything.
  #
  # Minted by real `merod`, not supplied as a fixture. A frozen credential never
  # runs `account sign-cert`, so a change in how a credential is PRODUCED would
  # keep passing — which is exactly what the previous version of this file did,
  # having replaced the shell script that used to mint one.
  #
  # The node is stopped for it: without `--from`, `sign-cert` reads the account
  # root from the datastore and RocksDB's lock is exclusive. The admin API is not
  # an alternative and never will be — the root private key deliberately never
  # crosses it, leaving a node only via `account export`, as a mnemonic.

  - name: Stop node-2 so its account root can be read
    type: stop_node
    nodes: delegated-node-2

  - name: Mint a device for node-2's account, offline
    type: node_exec
    node: delegated-node-2
    args: [account, sign-cert, --generate]
    capture:
      # The credential is the first line; the secret is four lines below it,
      # which is why `stdout_first_line` alone cannot serve this step.
      author_credential: '^([0-9a-f]{100,})$'
      author_secret: '^Secret: +([0-9a-f]{64})$'
      author_account: '^Account: +([0-9a-f]{64})$'
    outputs:
      author_credential: author_credential
      author_secret: author_secret
      author_account: author_account

  - name: Start node-2 again
    type: start_node
    nodes: delegated-node-2

  - name: Both nodes are back in the context
    type: wait_for_sync
    nodes:
      - delegated-node-1
      - delegated-node-2
    context_id: '{{context_id}}'
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Read the relay's own account
    type: node_identity
    node: delegated-node-1
    outputs:
      relay_account: accountId

  # Minted once and presented three times below: refused, accepted, refused. Same
  # bytes each time, which is what makes the middle one evidence about the grant
  # rather than about the warrant.
  - name: The author mints one warrant
    type: sign_warrant
    context_id: '{{context_id}}'
    executor: '{{relay_account}}'
    method: set
    args:
      key: delegated
      value: from-a-member-with-no-node
    device_secret: '{{author_secret}}'
    credential: '{{author_credential}}'
    nonce: 1
    outputs:
      warrant: warrant
      author_account: authorAccount

  - name: The warrant speaks for the member that was added
    type: assert
    statements:
      - "is_set({{author_account}})"

  # DAR-11: refused at the API, never published as a delta peers would drop.
  #
  # `expected_error` is not decoration — without it a node that never started
  # satisfies this assertion too. It names the endpoint's own reason, which is
  # what makes this step distinguish "the relay holds no grant" from every other
  # way a request can fail, including the replay refusal below.
  #
  # That specificity needed #3647: `calimero-client` used to replace every 403
  # body with a fixed token hint, so both refusals here read identically and the
  # assertion could only say "some 403 happened".
  - name: Refused before the relay is granted authorship
    type: perform_intent
    node: delegated-node-1
    context_id: '{{context_id}}'
    method: set
    args:
      key: delegated
      value: from-a-member-with-no-node
    warrant: '{{warrant}}'
    author_proof: '{{author_credential}}'
    expected_failure: true
    expected_error: CAN_AUTHOR_ON_BEHALF

  # Bit 9, so 512 on its own — authorship and nothing else, which is the posture
  # the capability exists to make possible. Implied by neither membership nor
  # admin, which the step above is what proves.
  - name: Grant the relay CAN_AUTHOR_ON_BEHALF
    type: set_member_capabilities
    node: delegated-node-1
    group_id: '{{namespace_id}}'
    member_id: '{{relay_account}}'
    capabilities: 512

  - name: The same warrant, now spendable
    type: perform_intent
    node: delegated-node-1
    context_id: '{{context_id}}'
    method: set
    args:
      key: delegated
      value: from-a-member-with-no-node
    warrant: '{{warrant}}'
    author_proof: '{{author_credential}}'
    outputs:
      intent_root: rootHash

  # A 2xx is not enough. This assertion exists because that gap already hid a
  # bug: the endpoint reported `deltaId: null` for an intent that had advanced no
  # state, and the run sailed past it to fail four steps later on a value that was
  # never written.
  - name: The intent advanced state
    type: assert
    statements:
      - "is_set({{intent_root}})"

  # And it is single-use. The signature is still perfectly valid: replay is not
  # forgery, which is why the nonce ledger has to exist and why the envelope check
  # cannot be what stops it.
  #
  - name: The spent warrant is refused a second time
    type: perform_intent
    node: delegated-node-1
    context_id: '{{context_id}}'
    method: set
    args:
      key: delegated
      value: from-a-member-with-no-node
    warrant: '{{warrant}}'
    author_proof: '{{author_credential}}'
    expected_failure: true
    expected_error: nonce

  # --- The half a relay cannot fake ---
  #
  # Everything above happened on the relay. This is what proves the network took
  # it: node-2 verified an envelope whose author is not its signer, authorized it
  # at the cut, spent the nonce, and applied it.
  # `expect` is what makes this a barrier rather than a hope. Converging on a
  # state hash only proves the nodes agree on a claim ABOUT state — a hash can be
  # published ahead of the state behind it, and even truthful hashes agree
  # milliseconds before a pending delta finishes applying. Waiting on the read
  # itself cannot pass early, which matters more here than anywhere: a delegated
  # delta is the one thing a peer might verify, authorize, and then still refuse.
  - name: The delegated write reaches the other node
    type: wait_for_sync
    context_id: '{{context_id}}'
    nodes:
      - delegated-node-1
      - delegated-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true
    expect:
      method: get
      args:
        key: "delegated"
      equals:
        output: "from-a-member-with-no-node"

  - name: Node-2 reads back what the member wrote
    type: call
    node: delegated-node-2
    context_id: '{{context_id}}'
    method: get
    args:
      key: delegated
    outputs:
      delegated_value: result

  # The ENVELOPE, not the value. `outputs: <name>: result` captures merobox's
  # whole result object, so the captured value is `{"output": ...}` and comparing
  # it to a bare string never matches. `result.output` would capture the value
  # itself; every other scenario in this suite spells it the way it is spelled
  # here, and this comment exists because the bare-string form looks correct.
  - name: Assert the member's write is present on the peer
    type: json_assert
    statements:
      - 'json_equal({{delegated_value}}, {"output": "from-a-member-with-no-node"})'

  # A self-authored write still works alongside it. The delegated path must not
  # have disturbed the ordinary one — they share every surface it touches.
  - name: Node-2 writes as itself
    type: call
    node: delegated-node-2
    context_id: '{{context_id}}'
    method: set
    args:
      key: self-authored
      value: still-works

  - name: Converge after the self-authored write
    type: wait_for_sync
    context_id: '{{context_id}}'
    nodes:
      - delegated-node-1
      - delegated-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true
    expect:
      method: get
      args:
        key: "self-authored"
      equals:
        output: "still-works"

  - name: Node-1 reads the self-authored write
    type: call
    node: delegated-node-1
    context_id: '{{context_id}}'
    method: get
    args:
      key: self-authored
    outputs:
      self_value: result

  - name: Assert the self-authored path is unaffected
    type: json_assert
    statements:
      - 'json_equal({{self_value}}, {"output": "still-works"})'
