# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: E2E KV Store - Group Reparent
description: "Tests the strict-tree refactor's atomic reparent_group primitive:\n  1. Create namespace,\
  \ then create two subgroups A and B under it\n  2. Reparent A under B (atomic edge swap)\n  3. Verify\
  \ A no longer appears as direct child of namespace\n  4. Verify A now appears as direct child of B\n\
  \  5. Verify the namespace's root context is unaffected throughout\n\nReplaces the deleted group-nesting.yml\
  \ — the old nest_group / unnest_group primitives are gone (orphan state would be reachable through them).\
  \ reparent_group is the single atomic replacement.\nSpec: docs/superpowers/specs/2026-04-22-strict-group-tree-and-cascade-delete.md\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4580
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Create namespace (parent group)
  type: create_org
  org_name: Create namespace (parent group)
  outputs:
    ns_id: orgId
  account: e2e-node-1
- name: Assert namespace created
  type: assert
  statements:
  - is_set({{ns_id}})
- name: Invite node-2
  type: invite
  org: '{{ns_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite}}'
  account: e2e-node-2
- name: Create root context
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create root context
  org: '{{ns_id}}'
  outputs:
    root_ctx_id: contextId
- name: Write baseline to root context
  type: call
  app: '{{root_ctx_id}}'
  method: set
  args:
    key: baseline
    value: before_reparent
  account: e2e-node-1
- name: Create subgroup A under namespace
  type: create_team
  org: '{{ns_id}}'
  team_name: subgroup-a
  join: invite
  outputs:
    group_a: teamId
  account: e2e-node-1
- name: Create subgroup B under namespace
  type: create_team
  org: '{{ns_id}}'
  team_name: subgroup-b
  join: invite
  outputs:
    group_b: teamId
  account: e2e-node-1
- name: Assert both subgroups created
  type: assert
  statements:
  - is_set({{group_a}})
  - is_set({{group_b}})
- name: List subgroups of namespace before reparent
  type: team_list
  org: '{{ns_id}}'
  account: e2e-node-1
  outputs:
    subs_before: subgroups
- name: Reparent A under B
  type: team_update
  org: '{{ns_id}}'
  team: '{{group_a}}'
  parent: '{{group_b}}'
  account: e2e-node-1
- name: List subgroups of namespace after reparent
  type: team_list
  org: '{{ns_id}}'
  account: e2e-node-1
  outputs:
    subs_ns_after: subgroups
- name: List subgroups of B after reparent
  type: team_list
  org: '{{ns_id}}'
  team: '{{group_b}}'
  account: e2e-node-1
  outputs:
    subs_b_after: subgroups
- name: Assert A is now child of B (not namespace)
  type: assert
  statements:
  - is_set({{subs_b_after}})
- name: Write after reparent to root context
  type: call
  app: '{{root_ctx_id}}'
  method: set
  args:
    key: after_reparent
    value: still_works
  account: e2e-node-1
- name: Node-2 reads after reparent
  type: call
  app: '{{root_ctx_id}}'
  method: get
  args:
    key: after_reparent
  account: e2e-node-2
  outputs:
    after_read: rpc
- name: Assert root context still works
  type: json_assert
  statements:
  - 'json_equal({{after_read}}, {"output": "still_works"})'
