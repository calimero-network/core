- name: Try wrong guess
  type: call
  app: '{{context_id}}'
  method: add_guess
  args:
    game_id: game1
    guess: wrong_guess
  account: e2e-node-2
  outputs:
    wrong_guess: rpc
- name: Assert wrong guess returns false
  type: json_assert
  statements:
  - 'json_equal({{wrong_guess}}, {"output": false})'
- name: Try correct guess on node-3
  type: call
  app: '{{context_id}}'
  method: add_guess
  args:
    game_id: game1
    guess: my_secret_123
  account: e2e-node-3
  outputs:
    correct_guess_node3: rpc
- name: Assert correct guess returns true on node-3
  type: json_assert
  statements:
  - 'json_equal({{correct_guess_node3}}, {"output": true})'
- name: Try wrong guess on node-3
