  args:
    key: visits
  account: e2e-node-1
- name: Increment G-Counter on node-2
  type: call
  app: '{{context_id}}'
  method: increment_g_counter
  args:
    key: visits
  account: e2e-node-2
- name: Get G-Counter on node-1
