# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x3: checks what the dropped steps did
#   wait_for_sync x34: replication is synchronous: a read sees every committed write
name: E2E KV Store - Consolidated Backend Tests
description: Consolidated E2E backend tests covering KV operations, handlers, user storage, frozen storage,
  private storage, nested CRDTs, and RGA
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4250
accounts:
- e2e-node-1
- e2e-node-2
- e2e-node-3
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Create mesh with node-2
  type: create_org
  account: e2e-node-1
  org_name: mesh
  outputs:
    group_id: orgId
- type: set
  values:
    namespace_id: '{{group_id}}'
- type: invite
  account: e2e-node-1
  org: '{{group_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: e2e-node-2
  token: '{{_mesh_invite}}'
- name: Create mesh with node-2
  type: deploy
  account: e2e-node-1
  org: '{{group_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create mesh with node-2
  outputs:
    context_id: contextId
    node1_key: memberPublicKey
- name: Set initial value on node-1
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: greeting
    value: Hello, World!
  account: e2e-node-1
- name: Set another value on node-1
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: count
    value: '42'
  account: e2e-node-1
- name: Verify value on node-2
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: greeting
  account: e2e-node-2
  outputs:
    greeting_value: rpc
- name: Assert greeting synced
  type: json_assert
  statements:
  - 'json_equal({{greeting_value}}, {"output": "Hello, World!"})'
- name: Set value on node-2
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: from_node2
    value: Cross-node value
  account: e2e-node-2
- name: Verify node-2 value on node-1
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: from_node2
  account: e2e-node-1
  outputs:
    node2_value: rpc
- name: Assert node-2 value synced
  type: json_assert
  statements:
  - 'json_equal({{node2_value}}, {"output": "Cross-node value"})'
- name: Create namespace invitation for node-3
  type: invite
  org: '{{group_id}}'
  role: member
  account: e2e-node-1
  outputs:
    open_invitation_3: token
- name: Join namespace - node-3
  type: redeem_invite
  token: '{{open_invitation_3}}'
  account: e2e-node-3
- type: whoami
  account: e2e-node-3
  outputs:
    node3_key: publicKey
- name: Verify greeting on node-3
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: greeting
  account: e2e-node-3
  outputs:
    greeting_value_node3: rpc
- name: Verify node-2 value on node-3
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: from_node2
  account: e2e-node-3
  outputs:
    node2_value_on_node3: rpc
- name: Assert node-3 sees pre-join state
  type: json_assert
  statements:
  - 'json_equal({{greeting_value_node3}}, {"output": "Hello, World!"})'
  - 'json_equal({{node2_value_on_node3}}, {"output": "Cross-node value"})'
- name: Set value on node-3
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: from_node3
    value: Hello from node3
  account: e2e-node-3
- name: Verify node-3 value on node-1
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: from_node3
  account: e2e-node-1
  outputs:
    node3_value_on_node1: rpc
- name: Verify node-3 value on node-2
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: from_node3
  account: e2e-node-2
  outputs:
    node3_value_on_node2: rpc
- name: Assert node-3 value synced to existing members
  type: json_assert
  statements:
  - 'json_equal({{node3_value_on_node1}}, {"output": "Hello from node3"})'
  - 'json_equal({{node3_value_on_node2}}, {"output": "Hello from node3"})'
- name: Get all entries
  type: call
  app: '{{context_id}}'
  method: entries
  args: {}
  account: e2e-node-1
  outputs:
    all_entries: rpc
- name: Assert entries is non-empty
  type: assert
  statements:
  - is_set({{all_entries}})
- name: Get result (throws on missing)
  type: call
  app: '{{context_id}}'
  method: get_result
  args:
    key: greeting
  account: e2e-node-1
  outputs:
    greeting_result: rpc
- name: Assert get_result returns value
  type: json_assert
  statements:
  - 'json_equal({{greeting_result}}, {"output": "Hello, World!"})'
- name: Get length
  type: call
  app: '{{context_id}}'
  method: len
  args: {}
  account: e2e-node-1
  outputs:
    kv_len: rpc
- name: Assert length is 4
  type: json_assert
  statements:
  - 'json_equal({{kv_len}}, {"output": 4})'
- name: Remove a key
  type: call
  app: '{{context_id}}'
  method: remove
  args:
    key: count
  account: e2e-node-1
- name: Verify key removed on node-2
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: count
  account: e2e-node-2
  outputs:
    removed_value: rpc
- name: Assert removed key returns null on node-2
  type: json_assert
  statements:
  - 'json_equal({{removed_value}}, {"output": null})'
- name: Verify key removed on node-3
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: count
  account: e2e-node-3
  outputs:
    removed_value_node3: rpc
- name: Assert removed key returns null on node-3
  type: json_assert
  statements:
  - 'json_equal({{removed_value_node3}}, {"output": null})'
- name: Get initial handler count on Node 2
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-2
  outputs:
    initial_handler_count: rpc
- name: Assert initial handler count is 0 on node-2
  type: json_assert
  statements:
  - 'json_equal({{initial_handler_count}}, {"output": 0})'
- name: Get initial handler count on Node 3
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-3
  outputs:
    initial_handler_count_node3: rpc
- name: Assert initial handler count is 0 on node-3
  type: json_assert
  statements:
  - 'json_equal({{initial_handler_count_node3}}, {"output": 0})'
- name: Set with handler (triggers insert_handler on receivers)
  type: call
  app: '{{context_id}}'
  method: set_with_handler
  args:
    key: handler_test
    value: initial
  account: e2e-node-1
- name: Set with handler again (triggers update_handler on receivers)
  type: call
  app: '{{context_id}}'
  method: set_with_handler
  args:
    key: handler_test
    value: updated
  account: e2e-node-1
- name: Remove with handler (triggers remove_handler on receivers)
  type: call
  app: '{{context_id}}'
  method: remove_with_handler
  args:
    key: handler_test
  account: e2e-node-1
- name: Set some test values for clear
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: clear_test_1
    value: value1
  account: e2e-node-1
- name: Set another test value for clear
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: clear_test_2
    value: value2
  account: e2e-node-1
- name: Clear with handler (triggers clear_handler on receivers)
  type: call
  app: '{{context_id}}'
  method: clear_with_handler
  args: {}
  account: e2e-node-1
- name: Read node-1's account
  type: call
  app: '{{context_id}}'
  method: my_account
  args: {}
  account: e2e-node-1
  outputs:
    node1_account: result
- name: Set user simple value on node-1
  type: call
  app: '{{context_id}}'
  method: set_user_simple
  args:
    value: Node1 Profile
  account: e2e-node-1
- name: Get own user simple value on node-1
  type: call
  app: '{{context_id}}'
  method: get_user_simple
  args: {}
  account: e2e-node-1
  outputs:
    node1_profile: rpc
- name: Assert node-1 profile
  type: json_assert
  statements:
  - 'json_equal({{node1_profile}}, {"output": "Node1 Profile"})'
- name: Get node-1 user value from node-2
  type: call
  app: '{{context_id}}'
  method: get_user_simple_for
  args:
    user_key: '{{node1_account}}'
  account: e2e-node-2
  outputs:
    node1_profile_from_node2: rpc
- name: Assert node-1 profile visible from node-2
  type: json_assert
  statements:
  - 'json_equal({{node1_profile_from_node2}}, {"output": "Node1 Profile"})'
- name: Get node-1 user value from node-3
  type: call
  app: '{{context_id}}'
  method: get_user_simple_for
  args:
    user_key: '{{node1_account}}'
  account: e2e-node-3
  outputs:
    node1_profile_from_node3: rpc
- name: Assert node-1 profile visible from node-3
  type: json_assert
  statements:
  - 'json_equal({{node1_profile_from_node3}}, {"output": "Node1 Profile"})'
- name: Set user simple value on node-2
  type: call
  app: '{{context_id}}'
  method: set_user_simple
  args:
    value: Node2 Profile
  account: e2e-node-2
- name: Get own user simple value on node-2
  type: call
