  args:
    key: visits
  account: e2e-node-3
  outputs:
    g_counter_value_node3: rpc
- name: Assert G-Counter is 3 on node-3
  type: json_assert
  statements:
  - 'json_equal({{g_counter_value_node3}}, {"output": 3})'
- name: Increment PN-Counter on node-1
  type: call
  app: '{{context_id}}'
  method: increment_pn_counter
  args:
    key: balance
  account: e2e-node-1
- name: Increment PN-Counter again on node-1
  type: call
  app: '{{context_id}}'
  method: increment_pn_counter
  args:
    key: balance
  account: e2e-node-1
- name: Increment PN-Counter third time on node-1
  type: call
  app: '{{context_id}}'
  method: increment_pn_counter
  args:
    key: balance
  account: e2e-node-1
- name: Decrement PN-Counter on node-1
  type: call
  app: '{{context_id}}'
  method: decrement_pn_counter
  args:
    key: balance
  account: e2e-node-1
- name: Get PN-Counter on node-2 after sync (should be 2)
  type: call
  app: '{{context_id}}'
  method: get_pn_counter
  args:
    key: balance
  account: e2e-node-2
  outputs:
    pn_counter_after_sync: rpc
- name: Assert PN-Counter is 2 after node-1 ops on node-2
  type: json_assert
  statements:
  - 'json_equal({{pn_counter_after_sync}}, {"output": 2})'
- name: Get PN-Counter on node-3 after sync (should be 2)
