- name: Decrement PN-Counter on node-2
  type: call
  app: '{{context_id}}'
  method: decrement_pn_counter
  args:
    key: balance
  account: e2e-node-2
- name: Get PN-Counter on node-1 (should be 1 after all ops)
  type: call
  app: '{{context_id}}'
  method: get_pn_counter
  args:
    key: balance
  account: e2e-node-1
  outputs:
    pn_counter_final: rpc
- name: Assert PN-Counter is 1 (3 inc - 2 dec = 1) on node-1
  type: json_assert
  statements:
  - 'json_equal({{pn_counter_final}}, {"output": 1})'
- name: Get PN-Counter on node-3 (should be 1 after all ops)
  type: call
  app: '{{context_id}}'
  method: get_pn_counter
  args:
    key: balance
  account: e2e-node-3
  outputs:
    pn_counter_final_node3: rpc
- name: Assert PN-Counter is 1 on node-3
  type: json_assert
  statements:
  - 'json_equal({{pn_counter_final_node3}}, {"output": 1})'
