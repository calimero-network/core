  args: {}
  account: e2e-node-2
  outputs:
    node2_account: result
- name: Assert node-2 profile
  type: json_assert
  statements:
  - 'json_equal({{node2_profile}}, {"output": "Node2 Profile"})'
- name: Get node-2 user value from node-1
  type: call
  app: '{{context_id}}'
  method: get_user_simple_for
  args:
    user_key: '{{node2_account}}'
  account: e2e-node-1
  outputs:
    node2_profile_from_node1: rpc
- name: Assert node-2 profile visible from node-1
  type: json_assert
  statements:
  - 'json_equal({{node2_profile_from_node1}}, {"output": "Node2 Profile"})'
- name: Get node-2 user value from node-3
  type: call
  app: '{{context_id}}'
  method: get_user_simple_for
  args:
    user_key: '{{node2_account}}'
  account: e2e-node-3
  outputs:
    node2_profile_from_node3: rpc
- name: Assert node-2 profile visible from node-3
  type: json_assert
  statements:
  - 'json_equal({{node2_profile_from_node3}}, {"output": "Node2 Profile"})'
- name: Set nested user value on node-1
  type: call
  app: '{{context_id}}'
  method: set_user_nested
  args:
    key: favorite_color
    value: blue
  account: e2e-node-1
- name: Get nested user value on node-1
  type: call
  app: '{{context_id}}'
  method: get_user_nested
  args:
    key: favorite_color
  account: e2e-node-1
  outputs:
    nested_value: rpc
- name: Assert nested value
  type: json_assert
  statements:
  - 'json_equal({{nested_value}}, {"output": "blue"})'
- name: Add frozen value on node-1
  type: call
  app: '{{context_id}}'
  method: add_frozen
  args:
    value: Immutable data
  account: e2e-node-1
  outputs:
    frozen_hash: result
- name: Get frozen value on node-2
  type: call
  app: '{{context_id}}'
  method: get_frozen
  args:
    hash_hex: '{{frozen_hash}}'
  account: e2e-node-2
  outputs:
    frozen_value: rpc
- name: Assert frozen value matches on node-2
  type: json_assert
  statements:
  - 'json_equal({{frozen_value}}, {"output": "Immutable data"})'
- name: Get frozen value on node-3
  type: call
  app: '{{context_id}}'
  method: get_frozen
  args:
    hash_hex: '{{frozen_hash}}'
  account: e2e-node-3
  outputs:
    frozen_value_node3: rpc
- name: Assert frozen value matches on node-3
  type: json_assert
  statements:
  - 'json_equal({{frozen_value_node3}}, {"output": "Immutable data"})'
- name: Add secret on node-1
  type: call
  app: '{{context_id}}'
  method: add_secret
  args:
    game_id: game1
    secret: my_secret_123
  account: e2e-node-1
- name: Get my secrets on node-1
  type: call
  app: '{{context_id}}'
  method: my_secrets
  args: {}
  account: e2e-node-1
  outputs:
    node1_secrets: rpc
- name: Assert node-1 can see its own secret
  type: assert
  statements:
  - is_set({{node1_secrets}})
- name: Get my secrets on node-2 (should be empty - private isolation)
  type: call
  app: '{{context_id}}'
  method: my_secrets
  args: {}
  account: e2e-node-2
  outputs:
    node2_secrets: rpc
- name: Assert node-2 has no secrets
  type: json_assert
  statements:
  - 'json_equal({{node2_secrets}}, {"output": {}})'
- name: Get my secrets on node-3 (should be empty - private isolation)
  type: call
  app: '{{context_id}}'
  method: my_secrets
  args: {}
  account: e2e-node-3
  outputs:
    node3_secrets: rpc
- name: Assert node-3 has no secrets
