# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: E2E KV Store - Open Subgroup Self-Join Key Delivery
description: 'Regression guard for PR #2351 (`fix(context): trigger KeyDelivery for self-join of Open
  subgroups`).

  Pre-fix bug: when a namespace member self-joins an `Open` subgroup context via the `CAN_JOIN_OPEN_SUBGROUPS`
  parent-walk (no admin-issued `add_group_members`), `join_context` inserts a `ContextIdentity` row with
  `sender_key: None`. No `MemberJoined` governance op is published for them, so no peer ever wraps the
  current group key in a `KeyDelivery` for the joiner. Their outgoing state-DAG ops can''t be signed/encrypted
  with the group key, so peers reject/ignore them; symmetrically, the joiner can''t decrypt incoming ops.
  Symptom: "joined a public channel, sends messages, no one sees them; can''t see others either."

  Fix: `join_context.rs` now publishes a self-signed `RootOp::MemberJoinedOpen { member, group_id }` whenever
  the join path was `MembershipPath::Inherited`. Peers holding the group key queue a `PendingKeyDelivery`
  (same struct the existing `MemberJoined` path uses); the delivery dispatcher publishes a wrapped `KeyDelivery`,
  populating the joiner''s `sender_key`.

  This workflow differs from `group-subgroup-visibility-inheritance.yml` by exercising the *joiner-as-author*
  direction explicitly: that existing test only confirms node-1''s writes flow to node-2, which passes
  on master because the joiner can DECRYPT incoming ops using the namespace-level group key delivered
  through a different path. The bug is that the joiner can''t AUTHOR ops because `sender_key` was never
  populated — that''s what this test asserts by having node-2 write and node-1 read the result.

  Pre-fix expectation: Round 2 wait_for_sync times out, or the node-1 read of node-2''s write returns
  null/empty (node-1 can''t decrypt the joiner''s ops). Post-fix expectation: both directions succeed.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4530
accounts:
- open-selfjoin-node-1
- open-selfjoin-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: open-selfjoin-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Node-1 creates namespace
  type: create_org
  org_name: Node-1 creates namespace
  outputs:
    namespace_id: orgId
  account: open-selfjoin-node-1
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: open-selfjoin-node-1
  outputs:
    ns_invite: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: open-selfjoin-node-2
- type: whoami
  account: open-selfjoin-node-2
  outputs:
    node2_identity: publicKey
- name: Node-1 creates Open subgroup inside namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: open-channel
  join: invite
  outputs:
    subgroup_id: teamId
  account: open-selfjoin-node-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  join: everyone
  account: open-selfjoin-node-1
- name: Node-1 creates context inside Open subgroup
  type: deploy
  account: open-selfjoin-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Node-1 creates context inside Open subgroup
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{subgroup_id}}'
  outputs:
    ctx_id: contextId
    node1_key: memberPublicKey
- name: Wait for subgroup visibility + context-registered ops to propagate
  type: wait
  seconds: 10.0
- name: Node-2 self-joins Open-subgroup context (inherited path)
  type: whoami
  account: open-selfjoin-node-2
  outputs:
    node2_key: publicKey
- name: Assert bootstrap shape
  type: assert
  statements:
  - is_set({{namespace_id}})
  - is_set({{subgroup_id}})
  - is_set({{ctx_id}})
  - is_set({{node1_key}})
  - is_set({{node2_identity}})
  - is_set({{node2_key}})
- name: Round 1 — node-1 writes
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: from_admin
    value: node1_msg
  account: open-selfjoin-node-1
  as_key: '{{node1_key}}'
- name: Node-2 reads node-1's write
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: from_admin
  account: open-selfjoin-node-2
  as_key: '{{node2_key}}'
  outputs:
    node2_read_admin: rpc
- name: Round 2 — node-2 (inherited self-joiner) writes
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: from_joiner
    value: node2_msg
  account: open-selfjoin-node-2
  as_key: '{{node2_key}}'
- name: Node-1 reads node-2's write (THE BUG)
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: from_joiner
  account: open-selfjoin-node-1
  as_key: '{{node1_key}}'
  outputs:
    node1_read_joiner: rpc
- name: Assert both directions converged
  type: assert
  statements:
  - is_set({{node2_read_admin}})
  - is_set({{node1_read_joiner}})
  - contains({{node2_read_admin}}, "node1_msg")
  - contains({{node1_read_joiner}}, "node2_msg")
