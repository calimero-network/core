name: E2E KV Store - Restore a Removed Namespace Without an Invitation
description: >
  Node-2 removes a namespace from its own disk while its account stays a
  member, lists it as forgotten for the application, and rejoins it with no
  invitation. The state comes back by sync from node-1, including a write made
  while node-2 was away, and node-2 stays joined across a restart.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: restore-node

steps:
  - name: Login on restore-node-1
    type: login
    node: restore-node-1
    username: dev
    password: dev-password

  - name: Login on restore-node-2
    type: login
    node: restore-node-2
    username: dev
    password: dev-password

  - name: Install application on node-1
    type: install_application
    node: restore-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create namespace on node-1
    type: create_namespace
    node: restore-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Create context in namespace on node-1
    type: create_context
    node: restore-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx_id: contextId

  - name: Node-1 writes before node-2 joins
    type: call
    node: restore-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "before_removal"
      value: "written_by_node_1"

  - name: Invite node-2
    type: create_namespace_invitation
    node: restore-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - name: Node-2 joins the namespace
    type: join_namespace
    node: restore-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  - name: Node-2 syncs the context
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - restore-node-1
      - restore-node-2
    timeout: 90
    trigger_sync: true

  - name: Node-2 reads the state before removing it
    type: call
    node: restore-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "before_removal"
    outputs:
      before_joined: result

  - name: Assert node-2 holds the state
    type: json_assert
    statements:
      - 'json_equal({{before_joined}}, {"output": "written_by_node_1"})'

  # Removing it from this device publishes nothing: node-1 still counts node-2.
  - name: Node-2 removes the namespace from its own disk
    type: delete_namespace
    node: restore-node-2
    namespace_id: '{{namespace_id}}'

  - name: Node-2 lists the namespace as forgotten for the application
    type: assert_api_response
    node: restore-node-2
    path: '/admin-api/namespaces/for-application/{{app_id}}'
    where:
      namespaceId: '{{namespace_id}}'
    match:
      forgotten: true

  - name: Node-1 writes while node-2 is away
    type: call
    node: restore-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "while_removed"
      value: "written_while_node_2_was_away"

  - name: Node-2 rejoins with no invitation
    type: script
    script: scripts/rejoin-namespace.sh
    target: local
    args:
      - restore-node-2
      - '{{namespace_id}}'

  - name: Node-2 no longer lists the namespace as forgotten
    type: assert_api_response
    node: restore-node-2
    path: '/admin-api/namespaces/for-application/{{app_id}}'
    where:
      namespaceId: '{{namespace_id}}'
    absent:
      - forgotten
    retries: 45
    interval: 2

  - name: Node-2 syncs the context back
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - restore-node-1
      - restore-node-2
    timeout: 120
    trigger_sync: true

  - name: Node-2 reads the state it had before
    type: call
    node: restore-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "before_removal"
    outputs:
      before_restored: result

  - name: Node-2 reads the write made while it was away
    type: call
    node: restore-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "while_removed"
    outputs:
      while_restored: result

  - name: Assert node-2 has the state back
    type: json_assert
    statements:
      - 'json_equal({{before_restored}}, {"output": "written_by_node_1"})'
      - 'json_equal({{while_restored}}, {"output": "written_while_node_2_was_away"})'

  - name: Stop node-2
    type: stop_node
    nodes: restore-node-2

  - name: Start node-2 again
    type: start_node
    nodes: restore-node-2
    wait_for_ready: true
    wait_timeout: 60

  - name: Node-2 still lists the namespace after the restart
    type: assert_api_response
    node: restore-node-2
    path: /admin-api/namespaces
    where:
      namespaceId: '{{namespace_id}}'
    absent:
      - forgotten
    retries: 30
    interval: 2

  - name: Node-2 reads the state after the restart
    type: call
    node: restore-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "while_removed"
    outputs:
      after_restart: result

  - name: Assert node-2 kept the state across the restart
    type: json_assert
    statements:
      - 'json_equal({{after_restart}}, {"output": "written_while_node_2_was_away"})'

stop_all_nodes: true
restart: false
wait_timeout: 120
