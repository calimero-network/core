name: E2E Scaffolding - Delegated Session
description: >
  A device holding only a key obtains a session on a node it does not own, and
  reads a context it is a member of — with no password anywhere in the flow. A
  second account, authenticated on the same node at the same moment, is served
  none of the first one's rows.

  `delegated-authorship.yml` proves a keyholder can WRITE through a relay, but it
  logs in with a username and password, which is the provider the delegated
  architecture exists to remove. What has never run end to end is the SESSION
  itself: epic #3928's own criterion is a client that "can obtain a session
  against a node it is not the owner of, read a context it is a member of".

  Three things had to land before this could run at all, and each was a wall
  rather than a gap:

    1. Nothing could PRODUCE a login statement (#3962 added
       `merod account login-statement`).
    2. No node would ACCEPT one: `auth.account_proof.node_key` was never set by
       anything, so the provider refused to start (#3962, corrected by #3966 to
       the node's device signing key — the key its certificate certifies).
    3. Nothing ENABLES the provider. It is off by default deliberately, so this
       scenario turns it on in the node's own config, which is exactly how an
       operator would.

  The second half is the scoped READ surface. The criterion step reads through
  `/contexts/:id/query` alone, so the routes a delegated session was opened to —
  the listings, the single-resource reads and the four context read
  sub-resources — had never been driven against a running node. They were covered
  by unit tests over the permission layer and by handler tests over hand-built
  stores, and neither can see a real node's membership. What is asserted is not
  that a member gets a 200; it is that a stranger account with an equally valid
  session is served none of the member's rows.

  The shape is chosen so each assertion can only pass for the right reason:

    - The signing device is minted OFFLINE for node-2's account and never joins
      anything. It logs in to NODE-1, a node it does not own, which is the case
      the field `node` in the statement exists to make safe.
    - `node_key` is read from node-1's own `/admin-api/identity`, which reports
      it through the same accessor the auth service reads at startup. A value
      guessed or hard-coded here would pass against itself and nowhere else.
    - The audience is pinned to `cli` rather than left open, so the audience
      check is exercised instead of waved through by the accept-any default.

force_pull_image: false

# Needs the merod built from this branch: `account_proof` naming itself from the
# node's signing key is new, and no released image carries it.
auth_mode: embedded

nodes:
  # Three, and the third is the point: node-3 joins no namespace and no context,
  # so its account is a STRANGER on a node where node-2's account is a member.
  # Both log in to node-1, and what each is served is the tenant isolation the
  # scoped reads exist to provide.
  count: 3
  image: merod:local
  prefix: delegated-session-node
  # Enabled at INIT, not by a later `merod config`. merobox's `start_node`
  # re-initialises a node and rewrites `config.toml` ("Applied e2e-style
  # defaults"), so a config write before a restart is discarded -- which is
  # exactly how the first run of this scenario failed, with a 404 from
  # `/auth/challenge` because the provider was off at runtime.
  #
  # The audience is pinned rather than left empty so the audience check is
  # exercised: an empty list accepts ANY surface.
  init_args:
    delegated-session-node-1:
      - --device-key-login
      - --device-key-login-audience
      - cli

steps:
  - name: Login on delegated-session-node-1
    type: login
    node: delegated-session-node-1
    username: dev
    password: dev-password

  - name: Login on delegated-session-node-2
    type: login
    node: delegated-session-node-2
    username: dev
    password: dev-password

  # --- Setup: a namespace both nodes belong to, and a context with data ---

  - name: Install application on node-1
    type: install_application
    node: delegated-session-node-1
    # The same bundle `delegated-authorship.yml` installs, and the path is
    # relative to THIS file, not the repo root. A raw `.wasm` is not what this
    # step takes; the `app: scaffolding-e2e` matrix entry is what puts the
    # bundle in `dist/`.
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create a namespace on node-1
    type: create_namespace
    node: delegated-session-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Invite node-2 to the namespace
    type: create_namespace_invitation
    node: delegated-session-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  # Node-2's ACCOUNT becomes a member here. The device minted below never joins
  # anything — a device-keyed membership check would refuse the read, because a
  # thin client's key sits in no group's binding rows.
  - name: Node-2 joins the namespace
    type: join_namespace
    node: delegated-session-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'
    outputs:
      account_node2: memberAccount

  - name: Create a context in the namespace
    type: create_context
    node: delegated-session-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      context_id: contextId

  - name: Node-2 joins the context
    type: join_context
    node: delegated-session-node-2
    context_id: '{{context_id}}'

  # The delegated read below asks for this key, so it has to exist before the
  # session is minted — a read that returns nothing would pass a "did it 200"
  # check while proving nothing about what the caller may see.
  - name: Write the value the delegated session will read
    type: call
    node: delegated-session-node-1
    context_id: '{{context_id}}'
    method: set
    args:
      key: delegated
      value: read-by-a-keyholder

  - name: Both nodes converge before anything is delegated
    type: wait_for_sync
    context_id: '{{context_id}}'
    nodes:
      - delegated-session-node-1
      - delegated-session-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # --- A device for node-2's account, minted offline ---
  #
  # The node must be stopped: `sign-cert` reads the account root from the
  # datastore, whose lock is exclusive, and the admin API never exposes it.

  - name: Stop node-2 so its account root can be read
    type: stop_node
    nodes: delegated-session-node-2

  - name: Mint a device for node-2's account, offline
    type: node_exec
    node: delegated-session-node-2
    args: [account, sign-cert, --generate]
    capture:
      author_credential: '^([0-9a-f]{100,})$'
      author_secret: '^Secret: +([0-9a-f]{64})$'
    outputs:
      author_credential: author_credential
      author_secret: author_secret

  - name: Start node-2 again
    type: start_node
    nodes: delegated-session-node-2

  # --- A device for a STRANGER account, minted the same way ---
  #
  # Same mechanism as the member's, deliberately: the two sessions must differ in
  # exactly one thing -- which account signed -- or a difference in what they are
  # served could be explained by something other than membership.
  #
  # Node-3 joined nothing, so this account reaches no group. It is nonetheless a
  # real account with a real device, and `account_proof` authenticates accounts
  # rather than memberships, so it will get a perfectly valid session. Being
  # shown nothing with a valid session is the assertion; a broken credential
  # would pass against a node with no scoping at all.

  - name: Stop node-3 so its account root can be read
    type: stop_node
    nodes: delegated-session-node-3

  - name: Mint a device for the stranger account, offline
    type: node_exec
    node: delegated-session-node-3
    args: [account, sign-cert, --generate]
    capture:
      stranger_credential: '^([0-9a-f]{100,})$'
      stranger_secret: '^Secret: +([0-9a-f]{64})$'
    outputs:
      stranger_credential: stranger_credential
      stranger_secret: stranger_secret

  - name: Start node-3 again
    type: start_node
    nodes: delegated-session-node-3

  # Read the node's own key rather than pinning a constant. This is the same
  # value the auth service reads at startup, through the same accessor
  # (`NamespaceRepository::node_identity`), so the two cannot disagree.
  # Both facts come from one call: the signing key the statement is addressed to,
  # and the account the warrant names as executor. Reading them separately would
  # be two chances for them to describe different nodes.
  - name: Read node-1's own key and account
    type: node_identity
    node: delegated-session-node-1
    outputs:
      node_key: publicKey
      relay_account: accountId

  - name: Assert the node named itself
    type: assert
    statements:
      - "is_set({{node_key}})"

  # --- The relay may author, so the write half of the criterion can run ---
  #
  # The executor is NODE-1: the node the keyholder logs in to is the node that
  # spends the warrant, so its own account is what the warrant names and what the
  # grant below lands on.
  #
  # Granted EXPLICITLY rather than leaning on the namespace default that
  # calimero-network/core#3969 introduces, for two independent reasons:
  #
  #   1. node-1 created this namespace, so it is the root ADMIN — and the default
  #      mask is seeded for non-admin roles only (`add_member_with_keys`). An
  #      admin's own node never receives it, so relying on the default here would
  #      not work at all.
  #   2. Even where the default does apply, a scenario that depended on it would
  #      stop testing the intents path the day someone changed the default. This
  #      assertion is about `CAN_AUTHOR_ON_BEHALF` gating a delegated write, not
  #      about how the bit got there.
  #
  # Bit 9 = 512: authorship alone, implied by neither membership nor admin.
  - name: Grant node-1 CAN_AUTHOR_ON_BEHALF
    type: set_member_capabilities
    node: delegated-session-node-1
    group_id: '{{namespace_id}}'
    member_id: '{{relay_account}}'
    capabilities: 512

  # --- The criterion ---

  - name: A keyholder logs in, reads and writes, with no password
    type: script
    script: scripts/delegated-session.sh
    target: local
    args:
      - delegated-session-node-1
      - '{{context_id}}'
      - '{{author_secret}}'
      - '{{author_credential}}'
      - '{{node_key}}'
      - '{{relay_account}}'

  # --- What each session may READ ---
  #
  # The step above reads through `/contexts/:id/query` only. Everything opened to
  # a delegated session -- the listings, the single-resource reads, the four
  # context read sub-resources -- is checked here, for both accounts, against the
  # same running node.

  - name: The member is served its own rows and the stranger none of them
    type: script
    script: scripts/delegated-read-scope.sh
    target: local
    args:
      - delegated-session-node-1
      - '{{node_key}}'
      - '{{context_id}}'
      - '{{namespace_id}}'
      - '{{author_secret}}'
      - '{{author_credential}}'
      - '{{stranger_secret}}'
      - '{{stranger_credential}}'

  # The delegated write is a real delta, not a local mutation: it has to reach
  # the peer and be accepted there, which is where both signature layers are
  # re-verified. A scenario that stopped at the 200 from node-1 would pass even
  # if every peer dropped the delta.
  - name: The delegated write reaches the other node
    type: wait_for_sync
    context_id: '{{context_id}}'
    nodes:
      - delegated-session-node-1
      - delegated-session-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-2 reads back what the keyholder wrote
    type: call
    node: delegated-session-node-2
    context_id: '{{context_id}}'
    method: get
    args:
      key: delegated
    outputs:
      peer_value: result

  # `outputs: result` captures the whole envelope `{"output": ...}`, not the bare
  # value — assert against that shape, as `delegated-authorship.yml` does.
  - name: Assert the keyholder's write is present on the peer
    type: json_assert
    statements:
      - 'json_equal({{peer_value}}, {"output": "written-by-a-keyholder"})'
