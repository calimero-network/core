# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   json_assert statement on a dropped step's output x1: checks what the dropped steps did
#   login (unknown) x4: checks what the dropped steps did
#   node_exec (unknown) x3: checks what the dropped steps did
#   start_node x1: a user's node going offline has no counterpart in a cluster
#   stop_node x1: a user's node going offline has no counterpart in a cluster
#   wait_for_sync x6: replication is synchronous: a read sees every committed write
name: E2E KV Store - Reset a Device Revoked While Its Node Was Offline
description: "The operator exit from a device lockout, for the one case where the node cannot get out\
  \ on its own.\n`account-device-revoke-lockout.yml` covers the ordinary shape: a revoked node that is\
  \ ONLINE needs no command at all, because the tombstone reaches it, the key rotation strands it on an\
  \ epoch it cannot read, and the key-recovery pull releases the spent row and mints a fresh device under\
  \ the node's own account root. This scenario removes exactly that: the device is revoked while its node\
  \ is stopped, so the tombstone never lands in its store and no sync round will ever tell it that its\
  \ id is spent.\nWhat it pins, and why each step is load-bearing:\n\n  1. Alice's phone (node-3) is paired\
  \ onto her account from her laptop\n     (node-2) and writes into the context, so what gets revoked\
  \ is a proven\n     replica rather than a stored row. node-1 is the admin and the reader.\n\n  2. The\
  \ phone is STOPPED before the revocation. That ordering is the whole\n     scenario: nodes 1 and 2 apply\
  \ the tombstone, node-3's store never sees\n     it, and that gap is the only state the reset exists\
  \ for.\n\n  3. `account device --reset` is REFUSED on the stopped node. Its store says\n     the device\
  \ is certified in the namespace and carries no revocation, so\n     the guard cannot tell it from a\
  \ live one - and dropping a live device id\n     would strand the CRDT state held under it with nothing\
  \ able to author\n     there again.\n\n  4. `--force` overrides that one refusal, and drops exactly\
  \ the id that was\n     revoked - asserted against the id the pairing minted, not merely against\n \
  \    \"something was dropped\". The slot is then empty, so a plain\n     `account device` has nothing\
  \ left to print.\n\n  5. The node comes back up, re-pairs, and writes again. The new device id\n   \
  \  differs from the revoked one, the account is unchanged, and the write\n     reaches node-1 - so the\
  \ reset produced a working replica rather than an\n     empty row.\n\nUser-visible failure mode this\
  \ guards against: \"I revoked my phone while it was switched off, and now it will not come back onto\
  \ my account.\"\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3930
accounts:
- device-reset-node-1
- device-reset-node-2
- device-reset-node-3
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: device-reset-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Node-1 creates namespace
  type: create_org
  org_name: Node-1 creates namespace
  outputs:
    namespace_id: orgId
  account: device-reset-node-1
- name: Invite node-2 to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: device-reset-node-1
  outputs:
    invitation: token
- name: Node-2 joins the namespace
  type: redeem_invite
  token: '{{invitation}}'
  account: device-reset-node-2
- name: Node-1 creates the context
  type: deploy
  account: device-reset-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Node-1 creates the context
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
- name: What node-2 enrolled as
  type: whoami
  outputs:
    alice_account: publicKey
    root_key: publicKey
  account: device-reset-node-2
- name: Pair node-3 onto Alice's account
  type: add_device
  account: device-reset-node-2
  device: device-reset-node-3
  outputs:
    key_delivered: keyDelivered
- name: The pairing delivered a scope key
  type: json_assert
  statements:
  - json_equal({{key_delivered}}, true)
- name: What node-3 speaks as, now that it is paired
  type: whoami
  outputs:
    paired_account: publicKey
    paired_device: passkeyId
  account: device-reset-node-3
- name: The phone adopted Alice's account rather than one of its own
  type: json_assert
  statements:
  - json_equal({{paired_account}}, {{alice_account}})
- name: Node-3 (paired device) writes
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: from-phone
    value: phone-wrote-this
  account: device-reset-node-3
- name: Node-1 reads the paired device's write
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: from-phone
  account: device-reset-node-1
  outputs:
    phone_value: rpc
- name: The phone was a working replica before it was revoked
  type: json_assert
  statements:
  - 'json_equal({{phone_value}}, {"output": "phone-wrote-this"})'
- name: The account holder revokes the offline device
  type: http
  method: delete
  path: auth/passkeys/{{paired_device}}
  account: device-reset-node-2
- name: Re-pair node-3 onto Alice's account
  type: add_device
  account: device-reset-node-2
  device: device-reset-node-3
- name: What node-3 speaks as after the re-pair
  type: whoami
  outputs:
    repaired_account: publicKey
    repaired_device: passkeyId
  account: device-reset-node-3
- name: The re-pair minted a fresh device under the same account
  type: json_assert
  statements:
  - json_not_equal({{repaired_device}}, {{paired_device}})
  - json_equal({{repaired_account}}, {{alice_account}})
- name: Node-3 writes again from its fresh device
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: from-phone
    value: phone-is-back
  account: device-reset-node-3
- name: Node-1 reads the fresh device's write
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: from-phone
  account: device-reset-node-1
  outputs:
    back_value: rpc
- name: The re-paired phone is a working replica again
  type: json_assert
  statements:
  - 'json_equal({{back_value}}, {"output": "phone-is-back"})'
