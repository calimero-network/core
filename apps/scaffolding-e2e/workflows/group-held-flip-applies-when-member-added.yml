name: E2E Scaffolding - a held flip applies once the member is added
description: >
  The replay half of #4511's hold. A namespace member outside a private space
  reads the flip that made it private, which is sealed for the whole workspace,
  but cannot read what is sealed under the space's key. It logs those ops
  unread, and that is only safe if nothing is lost: once node-1 adds node-2 to
  the space, the key arrives, the key-arrival replay re-feeds the held ops, and
  node-2 reads the space Restricted and its name, sealed while node-2 was
  outside.

  Topology:
    * node-1 - the namespace owner, the subgroup's creator, online throughout.
    * node-2 - a namespace member, offline through the ops, then added.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: e2e-node

steps:
  - name: Login on e2e-node-1
    type: login
    node: e2e-node-1
    username: dev
    password: dev-password

  - name: Login on e2e-node-2
    type: login
    node: e2e-node-2
    username: dev
    password: dev-password

  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create namespace on node-1
    type: create_namespace
    node: e2e-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Assert namespace created
    type: assert
    statements:
      - "is_set({{namespace_id}})"

  - name: Invite node-2 to namespace
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  - name: Node-2 joins namespace
    type: join_namespace
    node: e2e-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'
    outputs:
      identity_node2: memberIdentity

  # Node-2 must hold the namespace before node-1 seals anything, so every op
  # below reaches it through the namespace DAG.
  - name: Converge node-2 on the namespace before the subgroup exists
    type: wait_for_sync
    group_id: '{{namespace_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    trigger_sync: true

  - name: Node-2 goes offline
    type: stop_node
    nodes: e2e-node-2

  # Visibility in steps of its own: merobox's born-visibility create sends no
  # auth header. The subgroup is born open and made private once.
  - name: Node-1 creates the subgroup
    type: create_group_in_namespace
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    group_name: club
    outputs:
      club_sub: groupId

  - name: Assert the subgroup was created
    type: assert
    statements:
      - "is_set({{club_sub}})"

  - name: Node-1 marks the subgroup Restricted
    type: set_subgroup_visibility
    node: e2e-node-1
    group_id: '{{club_sub}}'
    visibility: restricted

  # Sealed under the space's key: node-2 cannot read it until it is added.
  - name: Node-1 names the subgroup (an op sealed under its key)
    type: set_group_metadata
    node: e2e-node-1
    group_id: '{{club_sub}}'
    record_name: Club

  # --- node-2 comes back and logs what it cannot read ---

  - name: Node-2 comes back online
    type: start_node
    nodes: e2e-node-2

  - name: Login on e2e-node-2
    type: login
    node: e2e-node-2
    username: dev
    password: dev-password

  - name: Converge node-2 on the namespace while it is outside the space
    type: wait_for_sync
    group_id: '{{namespace_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 90
    trigger_sync: true

  # --- node-2 is added: the key arrives and the replay applies the name ---

  - name: Node-1 adds node-2 to the subgroup
    type: add_group_members
    node: e2e-node-1
    group_id: '{{club_sub}}'
    members:
      - identity: '{{identity_node2}}'
        role: Member

  - name: Node-2 receives the space key and replays the held ops
    type: assert_log_present
    nodes:
      - e2e-node-2
    patterns:
      - "retried encrypted op after KeyDelivery"
    timeout: 90

  # A field, not the envelope: the step unwraps `data` before the capture runs.
  - name: Node-2 reads the subgroup's visibility
    type: get_group_info
    node: e2e-node-2
    group_id: '{{club_sub}}'
    outputs:
      node2_visibility: subgroupVisibility

  - name: Assert the flip applied on node-2
    type: assert
    statements:
      - "equals({{node2_visibility}}, restricted)"

  - name: Node-2 reads the subgroup's name, sealed while it was Restricted
    type: get_group_metadata
    node: e2e-node-2
    group_id: '{{club_sub}}'
    outputs:
      node2_name: name

  - name: Assert node-2 reads the subgroup's sealed history
    type: assert
    statements:
      - "equals({{node2_name}}, Club)"

stop_all_nodes: false
