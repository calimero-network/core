description: >
  Relay-recovery e2e: the boot-node (the relay server) is restarted; every
  NAT'd client loses its relay reservation and must re-reserve once the
  relay is back, after which sync resumes.

  Topology
  --------

  `topology: { type: nat, nat_mode: cone }`. Both peers sit on the LAN
  bridge behind a NAT gateway and reach each other only through the
  boot-node, so a write made after the restart converges only if each
  peer re-established its reservation. The boot-node runs `--dev`, whose
  fixed seed keeps its peer id across the restart, so the clients'
  bootstrap address stays valid.

  What is asserted
  ----------------

  The relay reservation is logged by merod as `ReservationReqAccepted`
  (`crates/network/src/handlers/stream/swarm/relay.rs`, one line per
  accepted reservation). A second line on each client after the restart is
  the re-reservation. The loss itself is logged at info level as
  `Swarm: External address expired: <relayed addr>`
  (`crates/network/src/handlers/stream/swarm.rs`), which proves the
  reservation-lost recovery path ran rather than the reservation silently
  surviving. Convergence of the post-restart write is the functional proof.
name: Relay Recovery - Boot-Node Restart

force_pull_image: false

topology:
  type: nat
  nat_mode: cone

auth_mode: embedded

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: relay-rec-node

steps:
  - name: Login on relay-rec-node-1
    type: login
    node: relay-rec-node-1
    username: dev
    password: dev-password

  - name: Login on relay-rec-node-2
    type: login
    node: relay-rec-node-2
    username: dev
    password: dev-password

  # ---------- Setup: 2-node namespace + context ----------

  - name: Install application on node-1
    type: install_application
    node: relay-rec-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create the mesh - namespace, context and every joiner
    type: create_mesh
    context_node: relay-rec-node-1
    application_id: '{{app_id}}'
    nodes:
      - relay-rec-node-2
    outputs:
      namespace_id: namespaceId
      ctx_id: contextId

  - name: Wait for namespace gossip
    type: wait
    seconds: 5

  # ---------- Baseline: confirm sync works before the fault ----------

  - name: Write baseline key on node-1
    type: call
    node: relay-rec-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: baseline
      value: pre_restart

  - name: Wait for baseline to converge
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - relay-rec-node-1
      - relay-rec-node-2
    timeout: 60
    trigger_sync: true
    expect:
      method: get
      args:
        key: baseline
      equals:
        output: pre_restart

  - name: Read baseline on node-2 (sanity)
    type: call
    node: relay-rec-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: baseline
    outputs:
      baseline_n2: result.output

  - name: Assert baseline replicated
    type: assert
    statements:
      - "contains({{baseline_n2}}, 'pre_restart')"

  # ---------- Fault: restart the relay ----------

  - name: Restart the boot-node
    type: restart_container
    container: relay-recovery-boot-node-restart-boot-node
    timeout: 60

  # ---------- Recovery: both clients re-reserve, then sync resumes ----------

  - name: Confirm node-1 lost its reservation when the relay went down
    type: assert_log_present
    nodes: [relay-rec-node-1]
    patterns:
      - 'External address expired: .*p2p-circuit'
    regex: true
    timeout: 60

  - name: Confirm node-2 lost its reservation when the relay went down
    type: assert_log_present
    nodes: [relay-rec-node-2]
    patterns:
      - 'External address expired: .*p2p-circuit'
    regex: true
    timeout: 60

  - name: Confirm node-1 re-established its relay reservation
    type: assert_log_present
    nodes: [relay-rec-node-1]
    patterns:
      - "ReservationReqAccepted"
    min_matches: 2
    timeout: 90

  - name: Confirm node-2 re-established its relay reservation
    type: assert_log_present
    nodes: [relay-rec-node-2]
    patterns:
      - "ReservationReqAccepted"
    min_matches: 2
    timeout: 90

  - name: Write post-restart key on node-1
    type: call
    node: relay-rec-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: post_restart
      value: recovered

  - name: Wait for post-restart write to converge
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - relay-rec-node-1
      - relay-rec-node-2
    timeout: 120
    trigger_sync: true
    expect:
      method: get
      args:
        key: post_restart
      equals:
        output: recovered

  - name: Read post-restart key on node-2
    type: call
    node: relay-rec-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: post_restart
    outputs:
      post_n2: result.output

  - name: Assert post-restart write replicated
    type: assert
    statements:
      - "contains({{post_n2}}, 'recovered')"

stop_all_nodes: true
