# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: 'Group Governance — Cold-Context Push Converge (NAT cone, no pull, #3296)'
description: "Cold-context regression (#3296): a node that joined a context purely via governance — and\
  \ has NEVER received a state delta on it — must still acquire dial targets for that context's members\
  \ and converge via gossip push, WITHOUT a forced pull.\nThe bug -------\nProactive dialing draws from\
  \ the durable peer-identity cache, which used to be populated ONLY on the state-delta receive path.\
  \ A context joined through governance but that never received a delta therefore had an EMPTY dial-target\
  \ cache, so the node never proactively dialed that context's members. Behind NAT (no incidental inbound\
  \ dials to compensate) the node's subscriber set for the context topic stayed empty, `Mesh peer discovery\
  \ exhausted all retries` fired, and deltas reached nobody — the context went silently dark while every\
  \ member was online. The fix also feeds the durable cache from the governance/membership path (see `NamespaceDeltaApply::resolve_signer_membership`),\
  \ so a freshly-joined cold context has dial targets immediately.\nWhat this scenario does -----------------------\n\
  1. node-1 creates a namespace + context and writes a SEED key BEFORE node-2\n   exists — node-2 never\
  \ pulls this.\n2. node-2 joins the namespace and the context via governance. Crucially there\n   is\
  \ NO `wait_for_sync` / pull after the join, so node-2's ONLY population of\n   the peer-identity cache\
  \ for this context is the governance join path — the\n   exact cold-context condition.\n3. node-1 writes\
  \ a NEW key. 4. node-2 must converge on BOTH keys via `trigger_sync: false` (no manual poke).\n   Seeing\
  \ the NEW key proves push works; seeing the SEED (written before the\n   join, so it is only reachable\
  \ by a pull node-2 must initiate itself) proves\n   node-2 had dial targets for node-1 on a cold cache.\n\
  \nTopology is `nat_mode: cone` (as in `sync-resilience-peer-restart-autoresync`): both peers sit behind\
  \ a NAT gateway, so there are no incidental inbound dials — node-2 must proactively dial node-1 using\
  \ the governance-populated cache.\nScope / honesty note --------------------\nA 2-node local merobox\
  \ run cannot perfectly reproduce the field's cold peer cache (rendezvous/DHT often still surface node-1\
  \ here), so this is a behavioral guard, not a hermetic repro of the NAT isolation. The authoritative\
  \ regression guard for the cache-population path is the in-process integration test `member_peers_for_context_unions_root_group_for_subgroup_context`\
  \ (and its sibling) in `crates/node/src/local_governance_node_e2e.rs`.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4310
accounts:
- cold-ctx-node-1
- cold-ctx-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: cold-ctx-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: cold-ctx-node-1
- name: Create context in namespace on node-1
  type: deploy
  account: cold-ctx-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in namespace on node-1
  org: '{{namespace_id}}'
  outputs:
    ctx_id: contextId
- name: Node-1 seeds initial state (before node-2 exists)
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: seed
    value: from_node_1_pre_join
  account: cold-ctx-node-1
- name: Create namespace invitation for node-2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: cold-ctx-node-1
  outputs:
    invitation_node2: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invitation_node2}}'
  account: cold-ctx-node-2
- name: Node-1 writes a new key after node-2's cold join
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: post_join
    value: pushed_to_cold_node2
  account: cold-ctx-node-1
- name: Read the post-join key on node-2
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: post_join
  account: cold-ctx-node-2
  outputs:
    post_join_n2: rpc
- name: Assert node-2 received the pushed write on a cold cache
  type: assert
  statements:
  - contains({{post_join_n2}}, 'pushed_to_cold_node2')
- name: Read the pre-join seed on node-2
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: seed
  account: cold-ctx-node-2
  outputs:
    seed_n2: rpc
- name: Assert node-2 pulled the pre-join seed (proves cold-cache dial targets)
  type: assert
  statements:
  - contains({{seed_n2}}, 'from_node_1_pre_join')
