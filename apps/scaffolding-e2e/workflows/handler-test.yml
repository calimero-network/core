# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: E2E KV Store - Event Handler Dispatch
description: "Tests the app::emit! / insert_handler path in the namespace model. set_with_handler emits\
  \ an event that merod dispatches back to all context members as an execute call. The test verifies:\n\
  \  1. set_with_handler writes the value and fires the event.\n  2. The handler-inserted value syncs\
  \ to both nodes via CRDT.\n  3. get_handler_execution_count reflects handler invocations.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4640
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Assert namespace created
  type: assert
  statements:
  - is_set({{namespace_id}})
- name: Create context in namespace on node-1
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in namespace on node-1
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
    ctx_key_node1: memberPublicKey
- name: Assert context created
  type: assert
  statements:
  - is_set({{context_id}})
- name: Create namespace invitation for node-2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    namespace_invitation: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: e2e-node-2
- name: Node-2 joins context via namespace membership
  type: whoami
  account: e2e-node-2
  outputs:
    ctx_key_node2: publicKey
- name: Node-1 calls set_with_handler
  type: call
  app: '{{context_id}}'
  method: set_with_handler
  args:
    key: test_key
    value: test_value
  account: e2e-node-1
- name: Node-2 reads the handler-written value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: test_key
  account: e2e-node-2
  outputs:
    read_result: rpc
- name: Assert handler value synced to node-2
  type: json_assert
  statements:
  - 'json_equal({{read_result}}, {"output": "test_value"})'
- name: Node-1 reads back handler-written value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: test_key
  account: e2e-node-1
  outputs:
    read_result_node1: rpc
- name: Assert handler value present on node-1
  type: json_assert
  statements:
  - 'json_equal({{read_result_node1}}, {"output": "test_value"})'
- name: Node-1 gets handler execution count
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-1
  outputs:
    handler_count_node1: rpc
- name: Assert handler was executed at least once on node-1
  type: assert
  statements:
  - is_set({{handler_count_node1}})
- name: Node-2 gets handler execution count
  type: call
  app: '{{context_id}}'
  method: get_handler_execution_count
  args: {}
  account: e2e-node-2
  outputs:
    handler_count_node2: rpc
- name: Assert handler was executed at least once on node-2
  type: assert
  statements:
  - is_set({{handler_count_node2}})
- name: Node-2 calls set_with_handler a second time
  type: call
  app: '{{context_id}}'
  method: set_with_handler
  args:
    key: test_key2
    value: second_value
  account: e2e-node-2
- name: Node-1 reads second handler-written value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: test_key2
  account: e2e-node-1
  outputs:
    second_read: rpc
- name: Assert second handler value synced to node-1
  type: json_assert
  statements:
  - 'json_equal({{second_read}}, {"output": "second_value"})'
