# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x3: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# Migration note: two v1 refusals are dropped: leaving a subgroup one already left, and
#   the sole admin leaving it. A team row's removal is idempotent, and the node
#   replaced last-admin protection: the organization's owner cannot be removed and its
#   admins manage every team (docs/src/content/docs/protocol/organizations.mdx, What
#   v1's edge cases became). The membership checks after the leave stand
name: E2E KV Store - Leave Group (MemberLeft)
description: 'Tests voluntary self-leave from a subgroup via `leave_group`. Publishes `MemberLeft` so
  peers observe the leave. Exercises the apply-side checks: direct-row required, last-admin protection.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4440
accounts:
- e2e-node-1
- e2e-node-2
- e2e-node-3
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node2: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite_node2}}'
  account: e2e-node-2
- type: whoami
  account: e2e-node-2
  outputs:
    identity_node2: publicKey
    account_node2: publicKey
- name: Invite node-3 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node3: token
- name: Node-3 joins namespace
  type: redeem_invite
  token: '{{invite_node3}}'
  account: e2e-node-3
- type: whoami
  account: e2e-node-3
  outputs:
    identity_node3: publicKey
    account_node3: publicKey
- name: Get node-1's account
  type: whoami
  outputs:
    account_node1: publicKey
  account: e2e-node-1
- name: Create subgroup with all three nodes
  type: create_team
  org: '{{namespace_id}}'
  team_name: leave-group-subgroup
  join: invite
  outputs:
    subgroup_id: teamId
  account: e2e-node-1
- name: Add node-2 and node-3 to subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  members:
  - '{{identity_node2}}'
  role: member
  account: e2e-node-1
- name: Add node-2 and node-3 to subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  members:
  - '{{identity_node3}}'
  role: member
  account: e2e-node-1
- name: Node-2 leaves subgroup
  type: team_remove
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  members:
  - e2e-node-2
  account: e2e-node-2
- name: List subgroup members on node-1 after node-2 left
  type: team_get
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  account: e2e-node-1
  outputs:
    members_after_leave: members
- name: Assert node-2 absent from subgroup membership
  type: assert
  statements:
  - not_contains({{members_after_leave}}, {{account_node2}})
  - contains({{members_after_leave}}, {{account_node3}})
- name: List subgroup members on node-3 after node-2 left
  type: team_get
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  account: e2e-node-3
  outputs:
    members_after_leave_node3: members
- name: Assert node-3 also sees node-2 absent
  type: assert
  statements:
  - not_contains({{members_after_leave_node3}}, {{account_node2}})
  - contains({{members_after_leave_node3}}, {{account_node3}})
- name: List subgroup members after failed admin leave
  type: team_get
  org: '{{namespace_id}}'
  team: '{{subgroup_id}}'
  account: e2e-node-1
  outputs:
    members_after_admin_fail: members
- name: Assert subgroup still has node-1 admin and node-3 member
  type: assert
  statements:
  - contains({{members_after_admin_fail}}, {{account_node1}})
  - contains({{members_after_admin_fail}}, {{account_node3}})
  - not_contains({{members_after_admin_fail}}, {{account_node2}})
