# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x3: checks what the dropped steps did
#   wait_for_sync x6: replication is synchronous: a read sees every committed write
# NOTE: parallel groups run one after another: the app's log orders them
name: E2E Shared Storage - Two Devices of One Account Writing CONCURRENTLY
description: "The over-the-wire answer to core#3965, which reported that a `SharedStorage` cell written\
  \ by two devices of ONE account leaves every replica holding the same value on a DIFFERENT root hash.\n\
  It was filed off the in-process convergence harness, which at the time had no signing identity: every\
  \ `SharedMember` delta it exchanged failed signature verification, and a verification failure is DROPPED\
  \ by the sync merge rather than raised. So each replica kept only its own local write — individually\
  \ valid, so the value invariant passed, and the roots differed because nothing had merged. Indistinguishable\
  \ from a CRDT divergence by inspection. The harness now signs, and fails loudly on a dropped action;\
  \ see `crates/storage/tests/shared_two_devices_one_account.rs`.\nThis scenario is the independent check,\
  \ on nodes that sign for themselves. It is deliberately NOT a re-run of the unit test: merobox is the\
  \ only place the writer set is resolved at a delta's causal cut rather than from settled local state,\
  \ which is the half the harness cannot model.\nDistinct from `shared-storage-account-writers-two-devices`,\
  \ which proves the same two-devices-of-one-account story SEQUENTIALLY — laptop writes, settle, phone\
  \ writes, settle. That ordering is exactly what a convergence question must not have: applied one after\
  \ another, even a merge rule that loses a write agrees. This one has both devices write the same cell\
  \ with no settle between, so the two deltas are concurrent and the nodes have to reconcile them.\nWhat\
  \ carries the assertion:\n\n  * `wait_for_sync` over all three nodes after the concurrent pair. It gates\
  \ on\n    the context STATE HASH, so it is the root-hash comparison core#3965 is\n    about — if two\
  \ devices of one account really did leave the cluster on\n    split roots, this step times out and the\
  \ scenario fails here.\n\n  * All three nodes then read the cell and must return the SAME value, which\n\
  \    is the second half: a hash can converge on a state that lost a write. The\n    value is not pinned\
  \ to either writer's string, because which one survives\n    is the register's LWW rule and is not the\
  \ scenario's business — only that\n    every node made the same choice, and that it is not the pre-write\
  \ sentinel\n    (so the \"converged\" state is not just both writes vanishing).\n\n  * The writer set\
  \ is byte-identical before and after, so nothing was granted\n    or rotated on either device's behalf\
  \ to make the writes land.\n\nA caveat worth stating rather than hiding: `parallel` issues the two calls\
  \ concurrently, but it cannot force the deltas to actually interleave on the wire. A run where one write\
  \ fully propagates before the other starts degrades to the sequential case. That makes this weaker on\
  \ an unlucky run, never wrong — it cannot manufacture a failure, only miss one.\nUser-visible failure\
  \ mode this guards against: \"my laptop and my phone both edited the same shared field, and now the\
  \ two of them disagree forever.\"\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4800
accounts:
- shared-concurrent-node-1
- shared-concurrent-node-2
- shared-concurrent-node-3
steps:
- name: Install application on shared-concurrent-node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: shared-concurrent-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Node-1 creates the namespace
  type: create_org
  org_name: Node-1 creates the namespace
  outputs:
    namespace_id: orgId
  account: shared-concurrent-node-1
- name: Invite node-2 to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: shared-concurrent-node-1
  outputs:
    invitation: token
- name: Node-2 joins the namespace
  type: redeem_invite
  token: '{{invitation}}'
  account: shared-concurrent-node-2
- name: Node-1 creates the context
  type: deploy
  account: shared-concurrent-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Node-1 creates the context
  org: '{{namespace_id}}'
  outputs:
    context_id: contextId
- name: Node-2 enrolls a device for a fresh account
  type: whoami
  outputs:
    enrolled_account: publicKey
    root_key: publicKey
  account: shared-concurrent-node-2
- name: Read Alice's account off her laptop
  type: call
  app: '{{context_id}}'
  method: my_account
  args: {}
  account: shared-concurrent-node-2
  outputs:
    alice_account: result
- name: Node-1 grants Alice's account as a writer
  type: call
  app: '{{context_id}}'
  method: shared_add_writer
  args:
    writer: '{{alice_account}}'
  account: shared-concurrent-node-1
- name: The writer set as node-1 sees it before any concurrent write
  type: call
  app: '{{context_id}}'
  method: shared_get_writers
  args: {}
  account: shared-concurrent-node-1
  outputs:
    writers_before: rpc
- name: Pair node-3 onto Alice's account
  type: add_device
  account: shared-concurrent-node-2
  device: shared-concurrent-node-3
  outputs:
    key_delivered: keyDelivered
- name: The pairing delivered a scope key
  type: json_assert
  statements:
  - json_equal({{key_delivered}}, true)
- name: Read the account the phone speaks for
  type: call
  app: '{{context_id}}'
  method: my_account
  args: {}
  account: shared-concurrent-node-3
  outputs:
    phone_account: result
- name: The phone speaks for the same account as the laptop
  type: json_assert
  statements:
  - json_equal({{phone_account}}, {{alice_account}})
  - json_equal({{alice_account}}, {{enrolled_account}})
- name: Node-1 seeds a sentinel value
  type: call
  app: '{{context_id}}'
  method: shared_set
  args:
    value: before-concurrent
  account: shared-concurrent-node-1
- name: The laptop writes
  type: call
  app: '{{context_id}}'
  method: shared_set
  args:
    value: from-laptop-concurrent
  account: shared-concurrent-node-2
- name: The phone writes
  type: call
  app: '{{context_id}}'
  method: shared_set
  args:
    value: from-phone-concurrent
  account: shared-concurrent-node-3
- name: Node-1 reads the converged value
  type: call
  app: '{{context_id}}'
  method: shared_get
  args: {}
  account: shared-concurrent-node-1
  outputs:
    converged_n1: rpc
- name: Node-2 reads the converged value
  type: call
  app: '{{context_id}}'
  method: shared_get
  args: {}
  account: shared-concurrent-node-2
  outputs:
    converged_n2: rpc
- name: Node-3 reads the converged value
  type: call
  app: '{{context_id}}'
  method: shared_get
  args: {}
  account: shared-concurrent-node-3
  outputs:
    converged_n3: rpc
- name: The writer set as node-1 sees it after the concurrent writes
  type: call
  app: '{{context_id}}'
  method: shared_get_writers
  args: {}
  account: shared-concurrent-node-1
  outputs:
    writers_after: rpc
- name: Every node agrees, on a value one of the two devices actually wrote
  type: json_assert
  statements:
  - json_equal({{converged_n1}}, {{converged_n2}})
  - json_equal({{converged_n2}}, {{converged_n3}})
  - 'json_not_equal({{converged_n1}}, {"output": "before-concurrent"})'
  - json_equal({{writers_after}}, {{writers_before}})
