name: E2E Private Folders - Members Of Nested And Direct Private Folders See, Read And Use Only Their Own Folder
description: >
  Bob is added to Minutes, a private folder inside the private folder Board, and to nothing else.
  Dave is added to Secret, a private folder directly under the workspace, and to nothing else.
  Bob's node must list Minutes, read its name, metadata and members, join and use a context in it, and see nothing of Board or Secret.
  Dave's node must do the same for Secret and see nothing of Board or Minutes.
  Minutes is named before Bob is added and renamed after, and its member list, metadata and context list must be identical on Alice's, Bob's and Carol's nodes.

  Tree: workspace -> Secret (private), Board (private) -> Minutes (private) -> Notes (open).
  Nodes: 1 Alice (workspace owner), 2 Bob (member of Minutes), 3 Carol (member of Board and Minutes), 4 Dave (member of Secret).

force_pull_image: false

auth_mode: embedded

nodes:
  count: 4
  image: merod:local
  prefix: private-folders

steps:

  - name: Login on node-1
    type: login
    node: private-folders-1
    username: dev
    password: dev-password

  - name: Login on node-2
    type: login
    node: private-folders-2
    username: dev
    password: dev-password

  - name: Login on node-3
    type: login
    node: private-folders-3
    username: dev
    password: dev-password

  - name: Login on node-4
    type: login
    node: private-folders-4
    username: dev
    password: dev-password

  # Workspace: node-1 (Alice) owns it, nodes 2.. join as plain members.
  # Alice is node-1, Bob node-2, Carol node-3, Dave node-4.

  - name: Install the application on Alice's node
    type: install_application
    node: private-folders-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app: applicationId

  - name: Alice creates the workspace
    type: create_namespace
    node: private-folders-1
    application_id: '{{app}}'
    outputs:
      ns: namespaceId

  - name: Read Alice's account and key
    type: node_identity
    node: private-folders-1
    outputs:
      acc_a: accountId
      key_a: publicKey

  - name: Invite node-2 to the workspace
    type: create_namespace_invitation
    node: private-folders-1
    namespace_id: '{{ns}}'
    outputs:
      inv_b: invitation

  - name: Node-2 joins the workspace
    type: join_namespace
    node: private-folders-2
    namespace_id: '{{ns}}'
    invitation: '{{inv_b}}'
    outputs:
      id_b: memberIdentity
      acc_b: memberAccount

  - name: Invite node-3 to the workspace
    type: create_namespace_invitation
    node: private-folders-1
    namespace_id: '{{ns}}'
    outputs:
      inv_c: invitation

  - name: Node-3 joins the workspace
    type: join_namespace
    node: private-folders-3
    namespace_id: '{{ns}}'
    invitation: '{{inv_c}}'
    outputs:
      id_c: memberIdentity
      acc_c: memberAccount

  - name: Invite node-4 to the workspace
    type: create_namespace_invitation
    node: private-folders-1
    namespace_id: '{{ns}}'
    outputs:
      inv_d: invitation

  - name: Node-4 joins the workspace
    type: join_namespace
    node: private-folders-4
    namespace_id: '{{ns}}'
    invitation: '{{inv_d}}'
    outputs:
      id_d: memberIdentity
      acc_d: memberAccount

  # The tree: Secret and Board are private folders directly under the workspace,
  # Minutes is a private folder inside Board, Notes is an open folder inside Minutes.

  - name: Alice creates the Secret folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: secret
    outputs:
      f_secret: groupId

  - name: Alice marks Secret restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_secret}}'
    visibility: restricted

  - name: Alice names Secret
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_secret}}'
    record_name: Secret
    data:
      topic: secret

  - name: Alice creates the Board folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: board
    outputs:
      f_board: groupId

  - name: Alice marks Board restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_board}}'
    visibility: restricted

  - name: Alice names Board
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_board}}'
    record_name: Board
    data:
      topic: board

  - name: Alice creates the Minutes folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: minutes
    outputs:
      f_minutes: groupId

  - name: Alice nests Minutes under board
    type: reparent_group
    node: private-folders-1
    child_group_id: '{{f_minutes}}'
    new_parent_id: '{{f_board}}'

  - name: Alice marks Minutes restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_minutes}}'
    visibility: restricted

  - name: Alice names Minutes
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_minutes}}'
    record_name: Minutes
    data:
      topic: draft

  - name: Alice creates the Notes folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: notes
    outputs:
      f_notes: groupId

  - name: Alice nests Notes under minutes
    type: reparent_group
    node: private-folders-1
    child_group_id: '{{f_notes}}'
    new_parent_id: '{{f_minutes}}'

  - name: Alice marks Notes open
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_notes}}'
    visibility: open

  - name: Alice names Notes
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_notes}}'
    record_name: Notes
    data:
      topic: actions

  # Membership: Carol in Board and Minutes, Bob in Minutes only, Dave in Secret only.

  - name: Carol is added to Board as Member
    type: add_group_members
    node: private-folders-1
    group_id: '{{f_board}}'
    members:
    - identity: '{{id_c}}'
      role: Member

  - name: Bob is added to Minutes as Member
    type: add_group_members
    node: private-folders-1
    group_id: '{{f_minutes}}'
    members:
    - identity: '{{id_b}}'
      role: Member

  - name: Carol is added to Minutes as Member
    type: add_group_members
    node: private-folders-1
    group_id: '{{f_minutes}}'
    members:
    - identity: '{{id_c}}'
      role: Member

  - name: Dave is added to Secret as Member
    type: add_group_members
    node: private-folders-1
    group_id: '{{f_secret}}'
    members:
    - identity: '{{id_d}}'
      role: Member

  - name: Alice creates a context in Minutes
    type: create_context
    node: private-folders-1
    application_id: '{{app}}'
    group_id: '{{f_minutes}}'
    outputs:
      ctx: contextId

  - name: Alice creates a context in Secret
    type: create_context
    node: private-folders-1
    application_id: '{{app}}'
    group_id: '{{f_secret}}'
    outputs:
      ctx_s: contextId

  - name: Settle the workspace governance onto every node
    type: wait_for_sync
    group_id: '{{ns}}'
    nodes:
    - private-folders-1
    - private-folders-2
    - private-folders-3
    - private-folders-4
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # Bob sees Minutes.

  - name: Bob's node lists Minutes
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_board}}/subgroups
    where:
      groupId: '{{f_minutes}}'
    present:
    - groupId
    retries: 30
    interval: 2

  # Bob does not see the folders he is not in.

  - name: Bob's node does not list Board in the workspace
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/namespaces/{{ns}}/groups
    where:
      groupId: '{{f_board}}'
    expect_no_match: true

  - name: Bob's node does not list Secret in the workspace
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/namespaces/{{ns}}/groups
    where:
      groupId: '{{f_secret}}'
    expect_no_match: true

  - name: 'Board on Bob''s node: info is refused'
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_board}}
    expected_failure: true

  - name: 'Board on Bob''s node: member list is refused'
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_board}}/members
    expected_failure: true

  - name: 'Board on Bob''s node: metadata name is not readable'
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_board}}/metadata
    absent:
    - data.name

  - name: 'Secret on Bob''s node: info is refused'
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_secret}}
    expected_failure: true

  - name: 'Secret on Bob''s node: member list is refused'
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_secret}}/members
    expected_failure: true

  - name: 'Secret on Bob''s node: metadata name is not readable'
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_secret}}/metadata
    absent:
    - data.name

  # Dave sees Secret.

  - name: Dave's node lists Secret
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/namespaces/{{ns}}/groups
    where:
      groupId: '{{f_secret}}'
    present:
    - groupId
    retries: 30
    interval: 2

  # Dave does not see the folders he is not in.

  - name: Dave's node does not list Board in the workspace
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/namespaces/{{ns}}/groups
    where:
      groupId: '{{f_board}}'
    expect_no_match: true

  - name: Dave's node does not list Minutes in the workspace
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/namespaces/{{ns}}/groups
    where:
      groupId: '{{f_minutes}}'
    expect_no_match: true

  - name: 'Board on Dave''s node: info is refused'
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_board}}
    expected_failure: true

  - name: 'Board on Dave''s node: member list is refused'
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_board}}/members
    expected_failure: true

  - name: 'Board on Dave''s node: metadata name is not readable'
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_board}}/metadata
    absent:
    - data.name

  - name: 'Minutes on Dave''s node: info is refused'
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_minutes}}
    expected_failure: true

  - name: 'Minutes on Dave''s node: member list is refused'
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_minutes}}/members
    expected_failure: true

  - name: 'Minutes on Dave''s node: metadata name is not readable'
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_minutes}}/metadata
    absent:
    - data.name

  # Dave reads Secret.

  - name: Dave reads the name and metadata of Secret
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_secret}}/metadata
    match:
      data.name: Secret
      data.data.topic: secret
    retries: 30
    interval: 2

  - name: Dave's node lists Dave as a Secret member
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_secret}}/members
    where:
      identity: '{{acc_d}}'
    present:
    - identity
    retries: 30
    interval: 2

  # Dave uses a context in Secret.

  - name: Dave's node lists the context
    type: assert_api_response
    node: private-folders-4
    path: /admin-api/groups/{{f_secret}}/contexts
    where:
      contextId: '{{ctx_s}}'
    present:
    - contextId
    retries: 30
    interval: 2

  - name: Dave joins the context
    type: join_context
    node: private-folders-4
    context_id: '{{ctx_s}}'
    outputs:
      ckey_d: memberPublicKey

  - name: Settle the context on Alice and Dave
    type: wait_for_sync
    context_id: '{{ctx_s}}'
    nodes:
    - private-folders-1
    - private-folders-4
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Dave writes
    type: call
    node: private-folders-4
    context_id: '{{ctx_s}}'
    method: set
    args:
      key: from_d
      value: d_msg
    executor_public_key: '{{ckey_d}}'

  - name: Settle the context after Dave's write
    type: wait_for_sync
    context_id: '{{ctx_s}}'
    nodes:
    - private-folders-1
    - private-folders-4
    timeout: 30
    check_interval: 2
    expect:
      method: get
      args:
        key: from_d
      equals:
        output: d_msg

  - name: Alice reads Dave's write
    type: call
    node: private-folders-1
    context_id: '{{ctx_s}}'
    method: get
    args:
      key: from_d
    executor_public_key: '{{key_a}}'
    outputs:
      alice_read_d: result

  - name: Alice sees Dave's write
    type: json_assert
    statements:
    - 'json_equal({{alice_read_d}}, {"output": "d_msg"})'

  - name: Alice writes in Secret
    type: call
    node: private-folders-1
    context_id: '{{ctx_s}}'
    method: set
    args:
      key: from_a_to_d
      value: a_msg
    executor_public_key: '{{key_a}}'

  - name: Settle the context after Alice's write to Dave
    type: wait_for_sync
    context_id: '{{ctx_s}}'
    nodes:
    - private-folders-1
    - private-folders-4
    timeout: 30
    check_interval: 2
    expect:
      method: get
      args:
        key: from_a_to_d
      equals:
        output: a_msg

  - name: Dave reads Alice's write
    type: call
    node: private-folders-4
    context_id: '{{ctx_s}}'
    method: get
    args:
      key: from_a_to_d
    executor_public_key: '{{ckey_d}}'
    outputs:
      d_read_alice: result

  - name: Dave sees Alice's write
    type: json_assert
    statements:
    - 'json_equal({{d_read_alice}}, {"output": "a_msg"})'

  # Bob uses a context in Minutes.

  - name: Bob's node lists the context
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/contexts
    where:
      contextId: '{{ctx}}'
    present:
    - contextId
    retries: 30
    interval: 2

  - name: Bob joins the context
    type: join_context
    node: private-folders-2
    context_id: '{{ctx}}'
    outputs:
      ckey_b: memberPublicKey

  - name: Settle the context on Alice and Bob
    type: wait_for_sync
    context_id: '{{ctx}}'
    nodes:
    - private-folders-1
    - private-folders-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Bob writes
    type: call
    node: private-folders-2
    context_id: '{{ctx}}'
    method: set
    args:
      key: from_b
      value: b_msg
    executor_public_key: '{{ckey_b}}'

  - name: Settle the context after Bob's write
    type: wait_for_sync
    context_id: '{{ctx}}'
    nodes:
    - private-folders-1
    - private-folders-2
    timeout: 30
    check_interval: 2
    expect:
      method: get
      args:
        key: from_b
      equals:
        output: b_msg

  - name: Alice reads Bob's write
    type: call
    node: private-folders-1
    context_id: '{{ctx}}'
    method: get
    args:
      key: from_b
    executor_public_key: '{{key_a}}'
    outputs:
      alice_read_b: result

  - name: Alice sees Bob's write
    type: json_assert
    statements:
    - 'json_equal({{alice_read_b}}, {"output": "b_msg"})'

  - name: Alice writes
    type: call
    node: private-folders-1
    context_id: '{{ctx}}'
    method: set
    args:
      key: from_a_to_b
      value: a_msg
    executor_public_key: '{{key_a}}'

  - name: Settle the context after Alice's write to Bob
    type: wait_for_sync
    context_id: '{{ctx}}'
    nodes:
    - private-folders-1
    - private-folders-2
    timeout: 30
    check_interval: 2
    expect:
      method: get
      args:
        key: from_a_to_b
      equals:
        output: a_msg

  - name: Bob reads Alice's write
    type: call
    node: private-folders-2
    context_id: '{{ctx}}'
    method: get
    args:
      key: from_a_to_b
    executor_public_key: '{{ckey_b}}'
    outputs:
      b_read_alice: result

  - name: Bob sees Alice's write
    type: json_assert
    statements:
    - 'json_equal({{b_read_alice}}, {"output": "a_msg"})'

  # Bob reads what Minutes was named before he joined.

  - name: Bob reads the name and metadata Minutes was given before he joined
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/metadata
    match:
      data.name: Minutes
      data.data.topic: draft
    retries: 30
    interval: 2

  # Minutes is renamed after Bob joined, and every node must read the new record.

  - name: Alice renames Minutes after Bob joined
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_minutes}}'
    record_name: Minutes
    data:
      topic: weekly

  # Bob reads Minutes.

  - name: Bob reads the name and metadata of Minutes
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/metadata
    match:
      data.name: Minutes
      data.data.topic: weekly
    retries: 30
    interval: 2

  - name: Bob's node lists Bob as a Minutes member
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_b}}'
    present:
    - identity
    retries: 30
    interval: 2

  # Wait until every node reports the full Minutes seat list before comparing.

  - name: Node-1 lists Alice's Minutes seat
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_a}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-1 lists Bob's Minutes seat
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_b}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-1 lists Carol's Minutes seat
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_c}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-1 reads Minutes' metadata
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/metadata
    match:
      data.name: Minutes
      data.data.topic: weekly
    retries: 30
    interval: 2

  - name: Node-1 lists the Minutes context
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/contexts
    where:
      contextId: '{{ctx}}'
    present:
    - contextId
    retries: 30
    interval: 2

  - name: Node-2 lists Alice's Minutes seat
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_a}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-2 lists Bob's Minutes seat
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_b}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-2 lists Carol's Minutes seat
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_c}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-2 reads Minutes' metadata
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/metadata
    match:
      data.name: Minutes
      data.data.topic: weekly
    retries: 30
    interval: 2

  - name: Node-2 lists the Minutes context
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/contexts
    where:
      contextId: '{{ctx}}'
    present:
    - contextId
    retries: 30
    interval: 2

  - name: Node-3 lists Alice's Minutes seat
    type: assert_api_response
    node: private-folders-3
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_a}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-3 lists Bob's Minutes seat
    type: assert_api_response
    node: private-folders-3
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_b}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-3 lists Carol's Minutes seat
    type: assert_api_response
    node: private-folders-3
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_c}}'
    present:
    - identity
    retries: 30
    interval: 2

  - name: Node-3 reads Minutes' metadata
    type: assert_api_response
    node: private-folders-3
    path: /admin-api/groups/{{f_minutes}}/metadata
    match:
      data.name: Minutes
      data.data.topic: weekly
    retries: 30
    interval: 2

  - name: Node-3 lists the Minutes context
    type: assert_api_response
    node: private-folders-3
    path: /admin-api/groups/{{f_minutes}}/contexts
    where:
      contextId: '{{ctx}}'
    present:
    - contextId
    retries: 30
    interval: 2

  # Consistency: whatever the value, the three nodes hold the same one.

  - name: Node-1 lists the Minutes members
    type: list_group_members
    node: private-folders-1
    group_id: '{{f_minutes}}'
    outputs:
      m1: members

  - name: Node-2 lists the Minutes members
    type: list_group_members
    node: private-folders-2
    group_id: '{{f_minutes}}'
    outputs:
      m2: members

  - name: Node-3 lists the Minutes members
    type: list_group_members
    node: private-folders-3
    group_id: '{{f_minutes}}'
    outputs:
      m3: members

  - name: Minutes member list is identical on node-1 and node-2
    type: json_assert
    statements:
    - json_subset({{m1}}, {{m2}})
    - json_subset({{m2}}, {{m1}})

  - name: Minutes member list is identical on node-1 and node-3
    type: json_assert
    statements:
    - json_subset({{m1}}, {{m3}})
    - json_subset({{m3}}, {{m1}})

  - name: Node-1 reads the Minutes metadata
    type: get_group_metadata
    node: private-folders-1
    group_id: '{{f_minutes}}'
    outputs:
      mdname1: name
      mdtopic1: data.topic
      mdby1: updatedBy

  - name: Node-2 reads the Minutes metadata
    type: get_group_metadata
    node: private-folders-2
    group_id: '{{f_minutes}}'
    outputs:
      mdname2: name
      mdtopic2: data.topic
      mdby2: updatedBy

  - name: Node-3 reads the Minutes metadata
    type: get_group_metadata
    node: private-folders-3
    group_id: '{{f_minutes}}'
    outputs:
      mdname3: name
      mdtopic3: data.topic
      mdby3: updatedBy

  - name: Minutes metadata is identical on node-1 and node-2
    type: assert
    statements:
    - '{{mdname1}} == {{mdname2}}'
    - '{{mdtopic1}} == {{mdtopic2}}'
    - '{{mdby1}} == {{mdby2}}'

  - name: Minutes metadata is identical on node-1 and node-3
    type: assert
    statements:
    - '{{mdname1}} == {{mdname3}}'
    - '{{mdtopic1}} == {{mdtopic3}}'
    - '{{mdby1}} == {{mdby3}}'

  # Target value: Alice is Admin, Bob and Carol are Members, and the metadata is what Alice set.

  - name: Alice holds the Minutes Admin seat
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_a}}'
    present:
    - identity
    match:
      role: Admin
    retries: 30
    interval: 2

  - name: Bob holds a Minutes Member seat
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_b}}'
    present:
    - identity
    match:
      role: Member
    retries: 30
    interval: 2

  - name: Carol holds a Minutes Member seat
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_c}}'
    present:
    - identity
    match:
      role: Member
    retries: 30
    interval: 2

  - name: Minutes' metadata is the record Alice set
    type: assert
    statements:
    - '{{mdname1}} == Minutes'
    - '{{mdtopic1}} == weekly'

stop_all_nodes: true
restart: false
wait_timeout: 120
