# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   login (unknown) x3: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: E2E KV Store - MemberRemoved Late-Joiner Catchup
description: "A late-joining node materializes contexts via namespace-DAG catchup, and during that window\
  \ any incoming `MemberRemoved` op will see a per-context snapshot on the late joiner that's shorter\
  \ than the signer's (the signer had all contexts materialized when signing; the late joiner doesn't\
  \ yet). The diff produces `only_in_expected` entries — which is the designed-for \"fresh-node catchup\"\
  \ signal, NOT the partition- window divergence the reconcile path is for.\nThis workflow pins that the\
  \ late-joiner case produces a clean catchup (no errors, no test failures), and that subsequent state-DAG\
  \ sync brings the late joiner to identical state as the original members. The `only_in_expected` debug\
  \ log fires but is operationally fine; the cross-DAG check on the next state delta drives convergence\
  \ through the existing `Unknown { needed }` → buffer → catch-up path, NOT through anchor-sync.\nCatches\
  \ regressions where:\n  * a late-joiner spuriously triggers reconcile-via-anchor on\n    every membership\
  \ op until it catches up (would burn anchor\n    bandwidth at scale)\n  * the apply path errors out\
  \ instead of logging-and-continuing\n    when the signer's snapshot includes a context the receiver\n\
  \    hasn't materialized\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4680
accounts:
- e2e-node-1
- e2e-node-2
- e2e-node-3
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node2: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite_node2}}'
  account: e2e-node-2
- type: whoami
  account: e2e-node-2
  outputs:
    account_node2: publicKey
- name: Create context A
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context A
  org: '{{namespace_id}}'
  outputs:
    ctx_a: contextId
- name: Create context B
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context B
  org: '{{namespace_id}}'
  outputs:
    ctx_b: contextId
- name: Node-1 writes to context A
  type: call
  app: '{{ctx_a}}'
  method: set
  args:
    key: early
    value: before_node3_joined
  account: e2e-node-1
- name: Invite node-3 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node3: token
- name: Node-3 joins namespace (does not auto-join contexts)
  type: redeem_invite
  token: '{{invite_node3}}'
  account: e2e-node-3
- type: whoami
  account: e2e-node-3
  outputs:
    identity_node3: publicKey
- name: Admin removes node-2
  type: remove_member
  org: '{{namespace_id}}'
  member: '{{account_node2}}'
  account: e2e-node-1
- name: Allow time for node-3 to receive and apply the removal
  type: wait
  seconds: 10.0
- name: Confirm node-3 sees node-2 removed despite late-joiner state
  type: team_list
  org: '{{namespace_id}}'
  account: e2e-node-3
  outputs:
    members_on_node3: members
- name: Assert node-3's member list does not contain node-2
  type: assert
  statements:
  - not_contains({{members_on_node3}}, {{account_node2}})
- name: Node-3 reads ctx_a's earlier write
  type: call
  app: '{{ctx_a}}'
  method: get
  args:
    key: early
  account: e2e-node-3
  outputs:
    read_on_node3: rpc
- name: Assert node-3 sees pre-removal state on ctx_a
  type: json_assert
  statements:
  - 'json_equal({{read_on_node3}}, {"output": "before_node3_joined"})'
