name: E2E Scaffolding - Admit Without Credential
description: >
  A joiner holding only an invitation presents a join to a node with embedded
  auth and no credential on it, and is answered by the admission handler rather
  than by the auth guard.

  `POST /admin-api/namespaces/{id}/admit` is how a keyholder with no node gets
  its signed join published: the inviter names the admitting node in the
  invitation's signed `admitters`, and the joiner's signature over the op is
  the authorization. mero-js, Swift and Kotlin call it with no `Authorization`
  header and no proof. It sat behind the admin auth guard, so on an
  embedded-auth node every such call was a `401`; mero-tee fleets only worked
  because their ingress exempted the path.

  The script mints a real invitation (the node is the namespace admin, so the
  default admitters name it), then drops every credential and checks that the
  handler answers: an op that is not a signed join is `400`, an invitation
  naming no admitter `403`, and `/join` beside it still `401`. A successful
  admission needs a device-signed join op, which nothing in core signs offline;
  mero-js's `join-with-node` e2e drives that half, and the handler's own tests
  in `crates/server/src/admin/handlers/namespaces/admit_join.rs` cover the rest.

force_pull_image: false

# The point of the scenario: with embedded auth, merod is the guard.
auth_mode: embedded

nodes:
  count: 1
  image: merod:local
  prefix: admit-node

steps:
  - name: Login on admit-node-1
    type: login
    node: admit-node-1
    username: dev
    password: dev-password

  - name: Install application on admit-node-1
    type: install_application
    node: admit-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create a namespace on admit-node-1
    type: create_namespace
    node: admit-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Assert the namespace exists
    type: assert
    statements:
      - "is_set({{namespace_id}})"

  - name: Admit with no credential
    type: script
    script: scripts/uncredentialed-admit.sh
    target: local
    args:
      - admit-node-1
      - '{{namespace_id}}'

stop_all_nodes: true
restart: false
wait_timeout: 60
