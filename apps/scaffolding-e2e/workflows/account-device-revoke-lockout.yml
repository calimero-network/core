name: E2E KV Store - One Account, Two Devices, Revoke Sticks
description: >
  The acceptance test for account identity (#3290). Everything else in that
  feature is unit- and apply-path-tested; this is the only thing that proves the
  networked half — per-device scope-key delivery between real nodes.

  Committed ahead of the code it tests, as the definition of done for phase F
  rather than something backfilled afterwards. The code it needs has since
  landed — per-device authorization, pairing, the revocation proof, and the
  revoke-triggered key rotation — so it is now wired into `e2e-rust-apps.yml`.

  What it pins, and why each step is load-bearing:

    1. Three nodes. node-1 is the admin. node-2 is Alice's laptop and the only
       one of the three granted membership. node-3 is Alice's phone and is
       DELIBERATELY NOT a member — its right to participate comes entirely from
       being a device of Alice's account. That is the feature: one grant, two
       devices.

       One device per node, not two devices on one node: `NodeDeviceIdentity` is
       a singleton row, so a node holds exactly one device across every namespace.
       That also removes any need for merobox to choose which device authors —
       the node selects it.

    2. node-2 enrolls a device — which its join did for it. This is the first
       thing in the whole feature that publishes an account op, so it is also the first
       evidence that `AccountDeviceLinked` survives the real wire — signature
       check, nonce window, dispatch, apply — rather than only the in-process
       apply harness.

       This used to be a step of its own, and it could not run before the join: a
       device link travelled as an *encrypted* GroupOp, so the node had to hold the
       scope key first. Joins now carry the credential on a cleartext `RootOp`, so
       the join enrols and there is no order left to get wrong. Linking a SECOND
       device still goes the encrypted way, which is what pairing is for.

    3. node-2 writes from its enrolled device and node-1 reads it. Proves the
       device is a working replica, not merely a stored row.

    4. node-3 is paired onto Alice's account (`account pair-init` on node-3,
       then `account pair-complete` on node-2) and writes. Both
       writes must reach node-1, and the two must carry DIFFERENT replica ids
       under the SAME account. That pair of assertions is the whole feature.

       Pairing is a two-way exchange, which is why it needs a real flow rather
       than one command: node-3 cannot mint its `DeviceId` until it knows the
       account (`DeviceId = H(account ‖ nonce)`), and node-2 cannot sign node-3's
       certificate until it knows node-3's device id and KEM key. So node-2 hands
       over Alice's genesis, node-3 returns its device id and KEM key, node-2
       signs the certificate with the account root key it holds and publishes the
       link.

       This step also exercises the on-link key backfill — node-3 holds no scope
       key of its own, so it can only read what it wrote if node-2 wrapped the
       current keys for it.

       And it is the step that requires per-device AUTHORIZATION, not just
       delivery: node-3's ops are signed by a key that is not a member, so the
       membership resolver has to accept a key that is the `sign_pk` of a live
       device binding whose account is a member. Today it does not — see Wiring.

    5. node-1 (admin) revokes node-3's device. The scope key must rotate, and
       the rotation must exclude that device while still reaching the first one.

    6. The revoked device's write FAILS (`expected_failure: true`), and the
       surviving device's write still succeeds and still reaches node-1. Both
       halves matter: a revocation that also breaks the surviving device would
       pass a naive lockout assertion while being useless.

    7. The revoked device cannot READ past the rotation. This is the subtle one,
       and the one a naive lockout test misses: cutting off writes leaves a
       silent reader, which is the failure the whole feature exists to prevent.
       Asserted as the property — node-3 reads the survivor's key and must still
       see the PRE-revocation value, because the post-rotation delta is
       undecryptable to it. A device that had recovered the key returns the new
       value and fails here.

       Deliberately NOT asserted via the pull path's refusal log. A node asks a
       peer for a key when it is a member of a group it holds no key for, or when
       a governance op is buffered on an epoch it is stranded at. A revoked device
       is neither — it is a member of nothing, and it still holds the old key with
       nothing buffered — so it never asks, and a log assertion would wait on a
       line no code path emits in this shape. The refusal is still logged at
       `info` on the responder for the day a scenario can drive it.

  What this does NOT cover (intentionally):
    * Self-service revocation (an account revoking its own lost device without
      an admin). Needs the root-signed revocation proof, which is a wire
      addition still to land; until then revocation is admin-only.
    * Root-key rotation across a live group. Covered by unit tests in
      `crates/governance-store/src/group_keys.rs`; a networked version is worth
      adding once this one passes.
    * Mixed old/new node interop across the schema v4 flag day. merobox cannot
      test that by construction — every node is the same build against fresh
      state.

  User-visible failure mode this guards against: "I revoked my stolen laptop and
  it kept reading our messages."

force_pull_image: false

auth_mode: embedded

nodes:
  count: 3
  image: merod:local
  prefix: account-revoke-node

steps:
  - name: Login on account-revoke-node-1
    type: login
    node: account-revoke-node-1
    username: dev
    password: dev-password

  - name: Login on account-revoke-node-2
    type: login
    node: account-revoke-node-2
    username: dev
    password: dev-password

  - name: Login on account-revoke-node-3
    type: login
    node: account-revoke-node-3
    username: dev
    password: dev-password

  # ── Phase 1: namespace, membership, context ───────────────────────

  - name: Install application on node-1
    type: install_application
    node: account-revoke-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Node-1 creates namespace
    type: create_namespace
    node: account-revoke-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Invite node-2 to the namespace
    type: create_namespace_invitation
    node: account-revoke-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - name: Node-2 joins the namespace
    type: join_namespace
    node: account-revoke-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'

  - name: Node-1 creates the context
    type: create_context
    node: account-revoke-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      context_id: contextId

  - name: Node-2 joins the context
    type: join_context
    node: account-revoke-node-2
    context_id: '{{context_id}}'

  - name: Settle
    type: wait_for_sync
    nodes:
      - account-revoke-node-1
      - account-revoke-node-2
    context_id: '{{context_id}}'

  # ── Phase 2: node-2 enrolls its first device ──────────────────────
  #
  # Must come AFTER the context join: the link op is an encrypted GroupOp, so
  # the node needs the scope key before it can publish one.

  - name: Node-2 enrolls a device for a fresh account
    type: node_identity
    node: account-revoke-node-2
    outputs:
      alice_account: accountId
      laptop_device: deviceId
      root_key: accountRootPublicKey

  - name: Settle after the link op
    type: wait_for_sync
    nodes:
      - account-revoke-node-1
      - account-revoke-node-2
    context_id: '{{context_id}}'

  # ── Phase 3: the first device is a working replica ────────────────

  - name: Node-2 writes from its first device
    type: call
    node: account-revoke-node-2
    context_id: '{{context_id}}'
    method: set
    args:
      key: from-laptop
      value: laptop-wrote-this

  - name: Settle so the first device's delta reaches node-1
    type: wait_for_sync
    nodes:
      - account-revoke-node-1
      - account-revoke-node-2
    context_id: '{{context_id}}'
    timeout: 60
    trigger_sync: true

  - name: Node-1 reads the first device's write
    type: call
    node: account-revoke-node-1
    context_id: '{{context_id}}'
    method: get
    args:
      key: from-laptop
    outputs:
      laptop_value: result

  - name: The first device's write converged
    type: json_assert
    statements:
      - 'json_equal({{laptop_value}}, {"output": "laptop-wrote-this"})'

  # ── Phase 4: pair a second device onto the SAME account ───────────

  # node-3 is NOT invited to the namespace and never joins as a member. Its only
  # route in is being a device of Alice's account.
  - name: Pair node-3 onto Alice's account
    type: script
    script: scripts/account-pair-refusals.sh
    target: local
    args:
      - account-revoke-node-2
      - account-revoke-node-3
      - '{{namespace_id}}'
      - '{{root_key}}'

  # The sanctioned exchange, after the two refusals above. One step for both
  # halves because the ordering is forced: node-3 cannot mint its DeviceId
  # without the account, and node-2 cannot certify it without the id and both
  # keys. The step also compares the confirmation code the two sides derive.
  - name: Pair node-3 onto Alice's account
    type: account_pair
    node: account-revoke-node-3
    holder: account-revoke-node-2
    namespace_id: '{{namespace_id}}'
    root_key: '{{root_key}}'
    # merobox's step still declares `nonce` required, and core ignores whatever
    # arrives — the genesis carries no nonce. A literal rather than a captured
    # value, so nothing threads a dead field through the workflow.
    nonce: '00000000000000000000000000000000'
    outputs:
      paired_account: accountId
      paired_device: deviceId
      key_delivered: keyDelivered
  - name: Node-3 follows the context as a device of Alice's account
    type: join_context
    node: account-revoke-node-3
    context_id: '{{context_id}}'

  # node-3 is listed too, and that is the point of this step rather than an
  # afterthought: the very next step has the paired device write, which only
  # succeeds once node-2's KeyDelivery has actually reached and been applied by
  # node-3. Waiting only on 1 and 2 leaves that a race against gossip timing.
  - name: Settle after pairing
    type: wait_for_sync
    nodes:
      - account-revoke-node-1
      - account-revoke-node-2
      - account-revoke-node-3
    context_id: '{{context_id}}'

  # The paired device holds no scope key of its own, so this write only works if
  # the on-link backfill wrapped the current keys for it.
  - name: Node-3 (paired device) writes
    type: call
    node: account-revoke-node-3
    context_id: '{{context_id}}'
    method: set
    args:
      key: from-phone
      value: phone-wrote-this

  - name: Settle so the paired device's delta reaches node-1
    type: wait_for_sync
    nodes:
      - account-revoke-node-1
      - account-revoke-node-2
      - account-revoke-node-3
    context_id: '{{context_id}}'
    timeout: 60
    trigger_sync: true

  - name: Node-1 reads the paired device's write
    type: call
    node: account-revoke-node-1
    context_id: '{{context_id}}'
    method: get
    args:
      key: from-phone
    outputs:
      phone_value: result

  - name: Both devices' writes converged
    type: json_assert
    statements:
      - 'json_equal({{phone_value}}, {"output": "phone-wrote-this"})'

  # One identity, two replicas — the whole point of the feature.
  - name: The two devices authored as one account but distinct replicas
    type: node_identity
    node: account-revoke-node-2
    outputs:
      laptop_shown: accountId

  - name: What the phone speaks for
    type: node_identity
    node: account-revoke-node-3
    outputs:
      phone_shown: accountId

  # The feature in two assertions, now readable in the scenario instead of buried
  # in a shell script comparing temp files. Same account means the second device
  # needed no membership of its own; distinct devices mean they stay distinct CRDT
  # replicas — sharing a device id would have them share counter slots and an HLC
  # seed and silently lose each other's writes.
  - name: One account, two distinct devices
    type: json_assert
    statements:
      - 'json_equal({{laptop_shown}}, {{phone_shown}})'
      - 'json_equal({{laptop_shown}}, {{alice_account}})'
      - 'json_equal({{paired_account}}, {{alice_account}})'
      - 'json_equal({{key_delivered}}, true)'

  # ── Phase 5: revoke the paired device ─────────────────────────────

  # Revoked by node-2, the ACCOUNT HOLDER, not by node-1 the admin. Revoking a
  # device is the account's authority: an admin governs who is a member, not
  # which installations another person runs. An admin who wants Alice out
  # removes her account, which is strictly stronger. Node-1 attempting this now
  # gets a refusal naming that distinction.
  - name: The account holder revokes node-3's device
    type: account_revoke
    node: account-revoke-node-2
    namespace_id: '{{namespace_id}}'
    device_id: '{{paired_device}}'
    outputs:
      key_rotated: keyRotated

  # Reported per namespace now, because a device belongs to an account rather
  # than to a scope and the revocation follows it everywhere the account speaks.
  #
  # Asserted on REACH rather than on the rotation, and the distinction is the
  # point. Node-2 holds the account but joined as a plain member, so it may not
  # rotate — peers accept a rotation only from an admin at the cut. The device
  # therefore stops writing at once and keeps the key it holds until a remaining
  # admin's rotation listener discharges the pending row, which is asynchronous
  # and not what this step is timing.
  # Asserted on `keyRotated` rather than `revokedIn`. `revokedIn` is the field
  # that carries the per-namespace picture, but `calimero-client-py` is a typed
  # binding: the released wheel deserializes this response into the struct as it
  # was compiled, which has no such field, so serde drops it before merobox ever
  # sees it — and `{{revoked_in}}` then resolves to the literal placeholder,
  # making any comparison against it pass for the wrong reason. Switch this to
  # `revokedIn` once a wheel built against it ships (calimero-client-py#89).
  #
  # `false` is the load-bearing value: node-2 holds the account but joined as a
  # plain member, and only an admin may rotate. See the next comment.
  - name: The revocation did not rotate, because the holder is not an admin
    type: json_assert
    statements:
      - 'json_equal({{key_rotated}}, false)'

  - name: Settle after the revocation and its key rotation
    type: wait_for_sync
    nodes:
      - account-revoke-node-1
      - account-revoke-node-2
    context_id: '{{context_id}}'

  # NOT asserted, because it does not happen. The rotation this revocation owes
  # is never discharged by anything: `AccountDeviceUnlinked`'s apply neither
  # marks a `PendingRotationRepository` row nor emits an `OpEvent`, and the
  # rotation listener reacts only to `OpEvent::MemberRemoved`, whose pending rows
  # are written solely by member-left. So a device revoked by a non-admin account
  # holder keeps the scope key — and therefore READ access — indefinitely.
  # Tracked as calimero-network/core#3457.
  #
  # What this scenario does still prove is the half that works: the device stops
  # WRITING at once, below. The read half is the gap, tracked separately rather
  # than asserted here as though it were covered.

  # ── Phase 6: the revoked device is out, the survivor is not ───────

  - name: The revoked device can no longer write
    type: call
    node: account-revoke-node-3
    context_id: '{{context_id}}'
    method: set
    args:
      key: from-phone
      value: phone-should-not-land
    expected_failure: true

  - name: The surviving device still writes
    type: call
    node: account-revoke-node-2
    context_id: '{{context_id}}'
    method: set
    args:
      key: from-laptop
      value: laptop-still-works

  - name: Settle the survivor's write across the remaining devices
    type: wait_for_sync
    # node-3 is deliberately absent: it is revoked, so waiting for it to converge
    # would be waiting for the failure this scenario exists to prevent.
    nodes:
      - account-revoke-node-1
      - account-revoke-node-2
    context_id: '{{context_id}}'
    timeout: 60
    trigger_sync: true

  - name: Node-1 sees the survivor's write and not the revoked device's
    type: call
    node: account-revoke-node-1
    context_id: '{{context_id}}'
    method: get
    args:
      key: from-laptop
    outputs:
      survivor_value: result

  - name: Revocation cut out one device and only that device
    type: json_assert
    statements:
      - 'json_equal({{survivor_value}}, {"output": "laptop-still-works"})'

  - name: Node-1 still sees the pre-revocation value for the revoked device's key
    type: call
    node: account-revoke-node-1
    context_id: '{{context_id}}'
    method: get
    args:
      key: from-phone
    outputs:
      post_revoke_phone: result

  - name: The revoked device's post-revocation write never landed
    type: json_assert
    statements:
      - 'json_equal({{post_revoke_phone}}, {"output": "phone-wrote-this"})'

  # ── Phase 7: the revoked device cannot pull the key back ──────────
  #
  # The subtle one. A GroupKeyRequest names the requester's IDENTITY key, and
  # this node is still a namespace member — so before the pull path was made
  # device-addressed, everything above would pass and then the node would
  # quietly re-fetch the rotated key on its next sync round.

  - name: Give the recovery loop several rounds to try
    type: wait
    seconds: 20

  # Asserted as the PROPERTY, not as a log signal, because this shape cannot
  # trigger the pull path at all. A node asks for a key when it is a member of a
  # group it holds no key for, or when a governance op is buffered on an epoch it
  # is stranded at. The revoked device is neither: it is a member of NOTHING (that
  # is what makes it a device rather than a member), and it still holds the
  # pre-rotation key with nothing buffered — so it never asks, and asserting on the
  # responder's refusal would be waiting for a line no code path emits here.
  #
  # What the feature actually promises is observable directly: a revoked device
  # must not go on reading. It is frozen at the state it had, so the survivor's
  # post-rotation write is invisible to it — this read returns the value from
  # BEFORE the revocation. A device that had recovered the key would return
  # `laptop-still-works` and fail here, which is exactly the "silent reader" this
  # whole scenario exists to catch.
  - name: The revoked device reads the group as it was, not as it is
    type: call
    node: account-revoke-node-3
    context_id: '{{context_id}}'
    method: get
    args:
      key: from-laptop
    outputs:
      revoked_view: result

  - name: The revoked device cannot read past the rotation
    type: json_assert
    statements:
      - 'json_equal({{revoked_view}}, {"output": "laptop-wrote-this"})'

  - name: The revoked device still cannot write after the recovery window
    type: call
    node: account-revoke-node-3
    context_id: '{{context_id}}'
    method: set
    args:
      key: from-phone
      value: phone-really-should-not-land
    expected_failure: true

# ── Wiring ─────────────────────────────────────────────────────────
#
# Wired into `.github/workflows/e2e-rust-apps.yml`.
#
# The account operations are NATIVE merobox steps: `node_identity` (>= 0.6.54),
# `account_pair`, `account_revoke`, `account_show`. They replaced four shell
# scripts that drove the same admin-api endpoints. The scripts worked, but a
# `script` step cannot export custom `outputs:` — it only sets
# `script_output_local`, which the next script step overwrites — so every value
# one script minted for the next (device ids, the account genesis halves) had to
# travel through a temp file keyed by namespace. The scenario then read as a
# sequence of side effects, and the interesting assertions lived inside shell
# where nobody reading this file could see them. They are `json_assert`
# statements now.
#
# One script remains, deliberately: `account-pair-refusals.sh`. It offers the
# holder two payloads a real attacker would — somebody else's KEM key under the
# real device id, and an honest payload with a mismatched confirmation code — and
# asserts both are refused. `account_pair` cannot express that, and should not:
# it runs the sanctioned exchange and passes what `pair-init` minted through
# verbatim, which is exactly the thing an attacker does not do. Crafting hostile
# payloads is script territory. (If merobox later exposes `pair_device_init` and
# `pair_device_complete` as separate steps, these two cases can move into the
# scenario as `expected_failure` steps — the client bindings already exist.)
#
# `account-api.sh` stays as its shared URL/auth/POST helper: nothing in the e2e
# suite invokes `meroctl`, merobox drives nodes through its own client, and the
# merod image does not ship the CLI — so a `target: local` script talks to the
# admin API directly. The CLI commands are thin wrappers over the same endpoints.
#
# The three code gaps this workflow was written ahead of — per-device
# authorization on the governance bridge, enrolling into an EXISTING account, and
# on-link key backfill with revoke-triggered rotation — are all closed.
#
# One device per node means nothing has to choose WHICH device authors: the node
# selects it implicitly.
