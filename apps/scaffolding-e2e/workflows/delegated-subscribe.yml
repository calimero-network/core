name: E2E Scaffolding - Delegated Subscribe
description: >
  A device holding only a key SUBSCRIBES to a context it is a member of, over
  WebSocket and over SSE, and observes a write arrive on each.

  `delegated-session.yml` proves the session: a keyholder logs in to a node it
  does not own, reads, and writes. What no scenario covers, at any layer, is
  what that session can OBSERVE. Of the account and delegated workflows beside
  this one, none mentions websocket, `/ws`, `text/event-stream` or subscribe --
  the only matches for "subscribe" anywhere in `workflows/` are prose about
  gossipsub subscriber sets, which is a different thing entirely. Certificate,
  session, read and delegated write are covered; subscription is not.

  For a CRDT system that is the operation applications depend on most. A client
  that can write but never observe convergence is not usable: it shows a UI that
  looks frozen while the state underneath it moves.

  Both transports run, because they authenticate by DIFFERENT means. WebSocket
  carries the token in the query string -- a browser cannot set a header on a
  WebSocket, so `?token=` is the only way a real client gets in -- while SSE
  carries it in an `Authorization` header. They are separate arms in the auth
  guard and separate entries in the permission validator, so one working proves
  nothing about the other.

  The shape is chosen so each assertion can only pass for the right reason:

    - An ACCEPTED subscription is not a DELIVERED event. A node can acknowledge
      `subscribe` and then send nothing -- wrong permission, wrong context,
      events routed elsewhere -- so the run subscribes, WAITS for the
      acknowledgement, and only then writes. Writing first races the
      subscription and makes the outcome depend on machine speed.
    - The acknowledgement is checked for CONTENT, not for the absence of an
      error. `ws/subscribe.rs` drops a context the caller may not observe and
      echoes only what it actually subscribed, so a refusal arrives as
      `{"result":{"contextIds":[]}}` -- success-shaped, with an empty list.
      Asserting the echo NAMES the context is what tells the two apart.
    - The subscribing device is minted OFFLINE for node-2's account and never
      joins anything. Its membership is its ACCOUNT's, which is what
      `caller_may_observe_context` resolves for an account-anchored caller.
    - A distinct key per transport, so one delivered event cannot satisfy both
      runs -- and so the second run cannot pass on a value the first one left.

force_pull_image: false

# Needs the merod built from this branch: `/ws` and `/sse` were mapped to
# `context:subscribe` in #3959 and the provider's default scope gained it in the
# same change, so an older image refuses the subscription with a 403.
auth_mode: embedded

nodes:
  count: 2
  image: merod:local
  prefix: delegated-subscribe-node
  # Enabled at INIT, not by a later `merod config`: merobox's `start_node`
  # re-initialises a node and rewrites `config.toml`, so a config write before a
  # restart is discarded. The audience is pinned rather than left empty because
  # an empty list accepts ANY surface.
  init_args:
    delegated-subscribe-node-1:
      - --device-key-login
      - --device-key-login-audience
      - cli

steps:
  - name: Login on delegated-subscribe-node-1
    type: login
    node: delegated-subscribe-node-1
    username: dev
    password: dev-password

  - name: Login on delegated-subscribe-node-2
    type: login
    node: delegated-subscribe-node-2
    username: dev
    password: dev-password

  # --- Setup: a namespace both nodes belong to, and a context to watch ---

  - name: Install application on node-1
    type: install_application
    node: delegated-subscribe-node-1
    # Relative to the working directory the scenario is run from
    # (`apps/scaffolding-e2e`), not to this file. The `app: scaffolding-e2e`
    # matrix entry is what puts the bundle in `dist/`.
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create a namespace on node-1
    type: create_namespace
    node: delegated-subscribe-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Invite node-2 to the namespace
    type: create_namespace_invitation
    node: delegated-subscribe-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  # Node-2's ACCOUNT becomes a member here. The device minted below never joins
  # anything, and holds no key in any group's binding rows — its authority to
  # observe is entirely its account's, which is the case being tested.
  - name: Node-2 joins the namespace
    type: join_namespace
    node: delegated-subscribe-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'
    outputs:
      account_node2: memberAccount

  - name: Create a context in the namespace
    type: create_context
    node: delegated-subscribe-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      context_id: contextId

  - name: Node-2 joins the context
    type: join_context
    node: delegated-subscribe-node-2
    context_id: '{{context_id}}'

  - name: Both nodes converge before anything is subscribed
    type: wait_for_sync
    context_id: '{{context_id}}'
    nodes:
      - delegated-subscribe-node-1
      - delegated-subscribe-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # --- A device for node-2's account, minted offline ---
  #
  # The node must be stopped: `sign-cert` reads the account root from the
  # datastore, whose lock is exclusive, and the admin API never exposes it.

  - name: Stop node-2 so its account root can be read
    type: stop_node
    nodes: delegated-subscribe-node-2

  - name: Mint a device for node-2's account, offline
    type: node_exec
    node: delegated-subscribe-node-2
    args: [account, sign-cert, --generate]
    capture:
      author_credential: '^([0-9a-f]{100,})$'
      author_secret: '^Secret: +([0-9a-f]{64})$'
    outputs:
      author_credential: author_credential
      author_secret: author_secret

  - name: Start node-2 again
    type: start_node
    nodes: delegated-subscribe-node-2

  # Read the node's own key rather than pinning a constant. This is the value
  # the auth service reads at startup, through the same accessor, so the two
  # cannot disagree; a hard-coded one would pass against itself and nowhere else.
  - name: Read node-1's own key
    type: node_identity
    node: delegated-subscribe-node-1
    outputs:
      node_key: publicKey

  - name: Assert the node named itself
    type: assert
    statements:
      - "is_set({{node_key}})"

  # --- The criterion ---
  #
  # Subscribe, wait for the ack, write, and assert a StateMutation naming this
  # context arrives — once over WebSocket and once over SSE.

  - name: A keyholder subscribes over WebSocket and SSE, and sees a write land
    type: script
    script: scripts/delegated-subscribe.sh
    target: local
    args:
      - delegated-subscribe-node-1
      - '{{context_id}}'
      - '{{author_secret}}'
      - '{{author_credential}}'
      - '{{node_key}}'

  # The writes the subscriptions observed were ordinary context mutations, so
  # they must also replicate. Asserting this separately keeps the two questions
  # apart: the script proves DELIVERY to a subscriber, this proves the deltas
  # were real — a scenario where both were one assertion would fail as
  # "subscription" whenever sync was merely slow.
  - name: The observed writes reach the other node
    type: wait_for_sync
    context_id: '{{context_id}}'
    nodes:
      - delegated-subscribe-node-1
      - delegated-subscribe-node-2
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Node-2 reads back what the WebSocket subscriber watched arrive
    type: call
    node: delegated-subscribe-node-2
    context_id: '{{context_id}}'
    method: get
    args:
      key: watched-ws
    outputs:
      peer_ws_value: result

  # `outputs: result` captures the whole envelope `{"output": ...}`, not the
  # bare value — assert against that shape, as the sibling scenarios do.
  - name: Assert the WebSocket-observed write is present on the peer
    type: json_assert
    statements:
      - 'json_equal({{peer_ws_value}}, {"output": "seen-over-ws"})'

  - name: Node-2 reads back what the SSE subscriber watched arrive
    type: call
    node: delegated-subscribe-node-2
    context_id: '{{context_id}}'
    method: get
    args:
      key: watched-sse
    outputs:
      peer_sse_value: result

  - name: Assert the SSE-observed write is present on the peer
    type: json_assert
    statements:
      - 'json_equal({{peer_sse_value}}, {"output": "seen-over-sse"})'
