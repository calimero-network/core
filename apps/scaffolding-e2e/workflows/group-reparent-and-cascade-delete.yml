# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x1: checks what the dropped steps did
name: E2E KV Store - Reparent + Cascade Delete
description: "End-to-end test of the strict-tree refactor's two new primitives:\n  1. Build a 3-level\
  \ tree: namespace → A, B; B → C\n  2. Put contexts in A and C\n  3. Reparent C from B to A (atomic edge\
  \ swap)\n  4. Cascade-delete A — must wipe A, C, and both their contexts\n  5. Verify B and its contexts\
  \ are intact (sibling subtree untouched)\n  6. Verify the namespace itself is intact\n\nSpec: docs/superpowers/specs/2026-04-22-strict-group-tree-and-cascade-delete.md\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4570
accounts:
- e2e-node-1
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Create namespace
  type: create_org
  org_name: Create namespace
  outputs:
    ns_id: orgId
  account: e2e-node-1
- name: Create subgroup A under namespace
  type: create_team
  org: '{{ns_id}}'
  team_name: cascade-a
  join: invite
  outputs:
    group_a: teamId
  account: e2e-node-1
- name: Create subgroup B under namespace (sibling of A)
  type: create_team
  org: '{{ns_id}}'
  team_name: cascade-b
  join: invite
  outputs:
    group_b: teamId
  account: e2e-node-1
- name: Create subgroup C under B (initially)
  type: create_team
  org: '{{ns_id}}'
  team_name: cascade-c-initial
  join: invite
  outputs:
    group_c: teamId
  account: e2e-node-1
- name: Create context in A
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in A
  org: '{{ns_id}}'
  access:
    kind: team
    team: '{{group_a}}'
  outputs:
    ctx_a: contextId
- name: Create context in B (sibling subtree; must survive cascade)
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in B (sibling subtree; must survive cascade)
  org: '{{ns_id}}'
  access:
    kind: team
    team: '{{group_b}}'
  outputs:
    ctx_b: contextId
- name: Create context in C (will be reparented under A, then cascade-deleted)
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in C (will be reparented under A, then cascade-deleted)
  org: '{{ns_id}}'
  access:
    kind: team
    team: '{{group_c}}'
  outputs:
    ctx_c: contextId
- name: Reparent C under B
  type: team_update
  org: '{{ns_id}}'
  team: '{{group_c}}'
  parent: '{{group_b}}'
  account: e2e-node-1
- name: Reparent C from B to A
  type: team_update
  org: '{{ns_id}}'
  team: '{{group_c}}'
  parent: '{{group_a}}'
  account: e2e-node-1
- name: List subgroups of A (should contain C)
  type: team_list
  org: '{{ns_id}}'
  team: '{{group_a}}'
  account: e2e-node-1
  outputs:
    subs_a: subgroups
- name: List subgroups of B (should NOT contain C)
  type: team_list
  org: '{{ns_id}}'
  team: '{{group_b}}'
  account: e2e-node-1
  outputs:
    subs_b: subgroups
- name: Assert B has no subgroups after reparent
  type: json_assert
  statements:
  - json_equal({{subs_b}}, [])
- name: Assert A has at least one subgroup (C)
  type: assert
  statements:
  - is_set({{subs_a}})
- name: Cascade-delete A (and its descendant C)
  type: team_delete
  org: '{{ns_id}}'
  team: '{{group_a}}'
  account: e2e-node-1
- name: List subgroups of namespace after cascade
  type: team_list
  org: '{{ns_id}}'
  account: e2e-node-1
  outputs:
    subs_ns_after: subgroups
- name: Assert namespace still has at least B
  type: assert
  statements:
  - is_set({{subs_ns_after}})
- name: Get B info (must succeed — B was not in cascade)
  type: team_get
  org: '{{ns_id}}'
  team: '{{group_b}}'
  account: e2e-node-1
- name: List contexts still registered in B
  type: team_get
  org: '{{ns_id}}'
  team: '{{group_b}}'
  account: e2e-node-1
