name: E2E Account - A Paired Device Reads A Restricted Subgroup After Repeated Key Rotations
description: >
  Node 2 founds a namespace and rotates its key twice by removing a member each
  time: node 4 before node 1 joins, node 5 after. Node 1 therefore holds two
  epochs of governance and node 3, paired into node 1's account only after both
  rotations, holds neither. Node 1 creates a Restricted subgroup with node 2 and
  writes into a context there. Node 3 must converge on the subgroup, join its
  context and read the write, and its own write must reach node 1.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 5
  image: merod:local
  prefix: paired-rotations

steps:
  - name: Login on node-1
    type: login
    node: paired-rotations-1
    username: dev
    password: dev-password

  - name: Login on node-2
    type: login
    node: paired-rotations-2
    username: dev
    password: dev-password

  - name: Login on node-3
    type: login
    node: paired-rotations-3
    username: dev
    password: dev-password

  - name: Login on node-4
    type: login
    node: paired-rotations-4
    username: dev
    password: dev-password

  - name: Login on node-5
    type: login
    node: paired-rotations-5
    username: dev
    password: dev-password

  - name: Install the application on node-2
    type: install_application
    node: paired-rotations-2
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app: applicationId

  - name: Node-2 creates the namespace
    type: create_namespace
    node: paired-rotations-2
    application_id: '{{app}}'
    outputs:
      namespace_id: namespaceId

  - name: What node-2 speaks as
    type: node_identity
    node: paired-rotations-2
    outputs:
      account_node2: accountId

  # 4 = CAN_JOIN_OPEN_SUBGROUPS, 32 = CAN_CREATE_SUBGROUP.
  - name: Node-2 lets every member create subgroups
    type: set_default_capabilities
    node: paired-rotations-2
    group_id: '{{namespace_id}}'
    capabilities: 36

  - name: Invite node-4 to the namespace
    type: create_namespace_invitation
    node: paired-rotations-2
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node4: invitation

  - name: Node-4 joins the namespace
    type: join_namespace
    node: paired-rotations-4
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node4}}'
    outputs:
      account_node4: memberAccount

  - name: Node-2 removes node-4, the first rotation
    type: remove_group_members
    node: paired-rotations-2
    group_id: '{{namespace_id}}'
    members:
      - '{{account_node4}}'

  - name: Invite node-1 to the namespace
    type: create_namespace_invitation
    node: paired-rotations-2
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node1: invitation

  - name: Node-1 joins the namespace
    type: join_namespace
    node: paired-rotations-1
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node1}}'

  - name: Invite node-5 to the namespace
    type: create_namespace_invitation
    node: paired-rotations-2
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node5: invitation

  - name: Node-5 joins the namespace
    type: join_namespace
    node: paired-rotations-5
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node5}}'
    outputs:
      account_node5: memberAccount

  - name: Node-2 removes node-5, the second rotation
    type: remove_group_members
    node: paired-rotations-2
    group_id: '{{namespace_id}}'
    members:
      - '{{account_node5}}'

  # Node-1 must hold the second epoch's key before it seals anything under it.
  - name: Node-1 converges on the namespace after both rotations
    type: wait_for_sync
    group_id: '{{namespace_id}}'
    nodes:
      - paired-rotations-1
      - paired-rotations-2
    timeout: 90
    trigger_sync: true

  - name: Install the application on node-1, which is about to create a context
    type: install_application
    node: paired-rotations-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true

  - name: Node-1 creates a Restricted subgroup
    type: create_group_in_namespace
    node: paired-rotations-1
    namespace_id: '{{namespace_id}}'
    group_name: dm
    outputs:
      dm_group: groupId

  - name: Node-1 marks the subgroup Restricted
    type: set_subgroup_visibility
    node: paired-rotations-1
    group_id: '{{dm_group}}'
    visibility: restricted

  - name: Node-1 adds node-2 to the subgroup
    type: add_group_members
    node: paired-rotations-1
    group_id: '{{dm_group}}'
    members:
      - identity: '{{account_node2}}'
        role: Member

  - name: Node-1 creates a context in the subgroup
    type: create_context
    node: paired-rotations-1
    application_id: '{{app}}'
    group_id: '{{dm_group}}'
    outputs:
      dm_ctx: contextId

  - name: Node-1 writes into the subgroup's context
    type: call
    node: paired-rotations-1
    context_id: '{{dm_ctx}}'
    method: set
    args:
      key: dm_key
      value: from_node1

  - name: What node-1 speaks as
    type: node_identity
    node: paired-rotations-1
    outputs:
      root_key: accountRootPublicKey
      account_ns: accountNamespaceId

  - name: Pair node-3 into node-1's account, naming only the account namespace
    type: account_pair
    node: paired-rotations-3
    holder: paired-rotations-1
    root_key: '{{root_key}}'
    account_namespace: '{{account_ns}}'
    await_self: true

  - name: Node-3 converges on the subgroup's governance
    type: wait_for_sync
    group_id: '{{dm_group}}'
    nodes:
      - paired-rotations-1
      - paired-rotations-2
      - paired-rotations-3
    timeout: 90
    trigger_sync: true

  - name: Node-3 joins the subgroup's context
    type: join_context
    node: paired-rotations-3
    context_id: '{{dm_ctx}}'

  - name: Node-3 reads node-1's write
    type: wait_for_sync
    context_id: '{{dm_ctx}}'
    nodes:
      - paired-rotations-1
      - paired-rotations-3
    timeout: 60
    trigger_sync: true
    expect:
      method: get
      args:
        key: dm_key
      equals:
        output: from_node1

  - name: Node-3 writes into the subgroup's context
    type: call
    node: paired-rotations-3
    context_id: '{{dm_ctx}}'
    method: set
    args:
      key: dm_key_3
      value: from_node3

  - name: Node-1 reads node-3's write
    type: wait_for_sync
    context_id: '{{dm_ctx}}'
    nodes:
      - paired-rotations-1
      - paired-rotations-3
    timeout: 60
    trigger_sync: true
    expect:
      method: get
      args:
        key: dm_key_3
      equals:
        output: from_node3

stop_all_nodes: true
