# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x5: checks what the dropped steps did
#   node_identity output accountNamespaceId (v1 device key) x1: checks what the dropped steps did
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: E2E Account - A Paired Device Reads A Restricted Subgroup After Repeated Key Rotations
description: 'Node 2 founds a namespace and rotates its key twice, removing node 4 and then node 5, before
  node 1 joins. Node 3 is paired into node 1''s account after both rotations, so neither it nor node 1
  ever holds the keys the earlier governance is sealed under. Node 1 creates a Restricted subgroup with
  node 2 and writes into a context there. Node 3 must converge on the subgroup, join its context and read
  the write, and its own write must reach node 1.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4020
accounts:
- paired-rotations-1
- paired-rotations-2
- paired-rotations-3
- paired-rotations-4
- paired-rotations-5
steps:
- name: Install the application on node-2
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_bundle: hash
  account: paired-rotations-2
- type: set
  values:
    app: com.calimero.scaffolding-e2e
- name: Node-2 creates the namespace
  type: create_org
  org_name: Node-2 creates the namespace
  outputs:
    namespace_id: orgId
  account: paired-rotations-2
- name: What node-2 speaks as
  type: whoami
  outputs:
    account_node2: publicKey
  account: paired-rotations-2
- name: Node-2 lets every member create subgroups
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 36
  account: paired-rotations-2
- name: Invite node-4 to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: paired-rotations-2
  outputs:
    invite_node4: token
- name: Node-4 joins the namespace
  type: redeem_invite
  token: '{{invite_node4}}'
  account: paired-rotations-4
- type: whoami
  account: paired-rotations-4
  outputs:
    account_node4: publicKey
- name: Invite node-5 to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: paired-rotations-2
  outputs:
    invite_node5: token
- name: Node-5 joins the namespace
  type: redeem_invite
  token: '{{invite_node5}}'
  account: paired-rotations-5
- type: whoami
  account: paired-rotations-5
  outputs:
    account_node5: publicKey
- name: Node-2 removes node-4, the first rotation
  type: remove_member
  org: '{{namespace_id}}'
  member: '{{account_node4}}'
  account: paired-rotations-2
- name: Node-2 removes node-5, the second rotation
  type: remove_member
  org: '{{namespace_id}}'
  member: '{{account_node5}}'
  account: paired-rotations-2
- name: Invite node-1 to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: paired-rotations-2
  outputs:
    invite_node1: token
- name: Node-1 joins the namespace
  type: redeem_invite
  token: '{{invite_node1}}'
  account: paired-rotations-1
- name: Node-1 creates a Restricted subgroup
  type: create_team
  org: '{{namespace_id}}'
  team_name: dm
  join: invite
  outputs:
    dm_group: teamId
  account: paired-rotations-1
- name: Node-1 marks the subgroup Restricted
  type: team_update
  org: '{{namespace_id}}'
  team: '{{dm_group}}'
  join: invite
  account: paired-rotations-1
- name: Node-1 adds node-2 to the subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{dm_group}}'
  members:
  - '{{account_node2}}'
  role: member
  account: paired-rotations-1
- name: Node-1 creates a context in the subgroup
  type: deploy
  account: paired-rotations-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Node-1 creates a context in the subgroup
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{dm_group}}'
  outputs:
    dm_ctx: contextId
- name: Node-1 writes into the subgroup's context
  type: call
  app: '{{dm_ctx}}'
  method: set
  args:
    key: dm_key
    value: from_node1
  account: paired-rotations-1
- name: What node-1 speaks as
  type: whoami
  outputs:
    root_key: publicKey
  account: paired-rotations-1
- name: Pair node-3 into node-1's account, naming only the account namespace
  type: add_device
  account: paired-rotations-1
  device: paired-rotations-3
- name: Node-3 writes into the subgroup's context
  type: call
  app: '{{dm_ctx}}'
  method: set
  args:
    key: dm_key_3
    value: from_node3
  account: paired-rotations-3
