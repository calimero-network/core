name: E2E KV Store - Restricted Subgroup Add By Account
description: >
  Adding somebody to a Restricted subgroup by the id the member listing
  returns - their ACCOUNT - and then proving they can actually work in it.

  `GET /groups/:id/members` returns accounts, and every verb on that resource
  except the add took one. So an app that lists a group and adds one of those
  people to a sub-scope sent back the id it had just been given and got a 400,
  with nothing in the API converting between the two spaces. That is the shape
  of every nested-membership feature: rooms, channels, teams, shared folders.

  Distinguishes itself from its siblings:
    * `group-private-add-then-write.yml` - same Restricted admin-add path, but
      names the member by KEY. That one pins the older encoding; this one pins
      the account, and both must keep working.
    * `group-membership.yml` - adds then removes, by key.

  Two further things are pinned here because nothing else pinned them:

    1. `update_member_role` on a SUBGROUP. It appears in no other workflow, so
       a regression in it reaches users before CI. Node-2 is promoted to Admin
       and then exercises that grant by adding node-3 - a promotion that did
       not take effect leaves node-3 out of the listing.

    2. The member listing is asserted by CONTENT. A subgroup listing asserted
       with `is_set` alone passes just as happily when it names the wrong
       principal, which is precisely the failure this endpoint had.

  Default subgroup visibility is Restricted and no `set_subgroup_visibility`
  step is used, so a regression that flipped the default surfaces as node-3
  joining the subgroup context before it is added.

force_pull_image: false
near_devnet: false

auth_mode: embedded

nodes:
  count: 3
  image: merod:local
  prefix: account-add-node

steps:
  # First login on a fresh embedded-auth node bootstraps its root key
  # and seeds merobox's token cache; every step below runs authenticated.
  - name: Login on account-add-node-1
    type: login
    node: account-add-node-1
    username: dev
    password: dev-password

  - name: Login on account-add-node-2
    type: login
    node: account-add-node-2
    username: dev
    password: dev-password

  - name: Login on account-add-node-3
    type: login
    node: account-add-node-3
    username: dev
    password: dev-password

  # ── Phase 1: namespace with three members ─────────────────────────

  - name: Install application on node-1
    type: install_application
    node: account-add-node-1
    path: res/scaffolding_e2e.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Install application on node-2
    type: install_application
    node: account-add-node-2
    path: res/scaffolding_e2e.wasm
    dev: true

  - name: Install application on node-3
    type: install_application
    node: account-add-node-3
    path: res/scaffolding_e2e.wasm
    dev: true

  - name: Node-1 creates namespace
    type: create_namespace
    node: account-add-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Invite node-2 to namespace
    type: create_namespace_invitation
    node: account-add-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  - name: Invite node-3 to namespace
    type: create_namespace_invitation
    node: account-add-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node3: invitation

  - name: Wait for namespace governance to gossip
    type: wait
    seconds: 10

  # `memberAccount` is the id the member listing returns, and the one the add
  # below is given. `memberIdentity` is captured only to assert the listing
  # does not name it.
  - name: Node-2 joins namespace
    type: join_namespace
    node: account-add-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'
    outputs:
      identity_node2: memberIdentity
      account_node2: memberAccount

  - name: Node-3 joins namespace
    type: join_namespace
    node: account-add-node-3
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node3}}'
    outputs:
      account_node3: memberAccount

  - name: Assert the join returned both ids
    type: assert
    statements:
      - "is_set({{account_node2}})"
      - "is_set({{account_node3}})"

  # ── Phase 2: add node-2 to a Restricted subgroup by account ───────

  - name: Node-1 creates Restricted subgroup
    type: create_group_in_namespace
    node: account-add-node-1
    namespace_id: '{{namespace_id}}'
    group_alias: account-add-channel
    outputs:
      subgroup_id: groupId

  - name: Admin adds node-2 to the subgroup by account
    type: add_group_members
    node: account-add-node-1
    group_id: '{{subgroup_id}}'
    members:
      - identity: '{{account_node2}}'
        role: Member

  - name: List subgroup members
    type: list_group_members
    node: account-add-node-1
    group_id: '{{subgroup_id}}'
    outputs:
      subgroup_members: members

  # The account went in, so the account comes back - and the key it was
  # resolved from does not, because a membership row is keyed by account.
  - name: Assert the listing names the account, not the key
    type: assert
    statements:
      - "contains({{subgroup_members}}, {{account_node2}})"
      - "not_contains({{subgroup_members}}, {{identity_node2}})"
      - "not_contains({{subgroup_members}}, {{account_node3}})"

  # ── Phase 3: the added member can actually work in the subgroup ───
  # An add that lands the row but delivers no group key leaves the member
  # listed and everything in the group undecryptable, so a status code is
  # not enough on its own.

  - name: Node-1 creates context inside the subgroup
    type: create_context
    node: account-add-node-1
    application_id: '{{app_id}}'
    group_id: '{{subgroup_id}}'
    outputs:
      ctx_id: contextId

  - name: Wait for MemberAdded + ContextRegistered to propagate
    type: wait
    seconds: 10

  - name: Node-2 joins the subgroup context
    type: join_context
    node: account-add-node-2
    context_id: '{{ctx_id}}'
    outputs:
      node2_key: memberPublicKey

  - name: Node-1 writes to the subgroup context
    type: call
    node: account-add-node-1
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "added_by_account"
      value: "reachable"

  - name: Wait for subgroup sync
    type: wait_for_sync
    comment: >-
      lint-convergence: ok - node-3 is deliberately outside this barrier. Its
      only mutation so far is a local application install, which no other node
      reads, and it holds no identity in this context. Barriering it here would
      wait for convergence that is not coming; being refused is what the next
      step asserts.
    context_id: '{{ctx_id}}'
    nodes:
      - account-add-node-1
      - account-add-node-2
    timeout: 60
    trigger_sync: true

  - name: Node-2 reads what node-1 wrote
    type: call
    node: account-add-node-2
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "added_by_account"
    outputs:
      node2_read: result

  - name: Assert the account-added member decrypts the subgroup
    type: json_assert
    statements:
      - 'json_equal({{node2_read}}, {"output": "reachable"})'

  # Negative control, asserted on the join rather than a call: node-3 holds no
  # identity in this context either way, so a call stays refused even if the
  # visibility default flips to Open. The join is the step visibility gates.
  - name: Node-3 cannot join the subgroup context (not a member)
    type: join_context
    node: account-add-node-3
    context_id: '{{ctx_id}}'
    expected_failure: true

  # ── Phase 4: role change on a subgroup, named by account ──────────

  - name: Promote node-2 to Admin of the subgroup
    type: update_member_role
    node: account-add-node-1
    group_id: '{{subgroup_id}}'
    member_id: '{{account_node2}}'
    role: Admin

  - name: Wait for the role change to reach node-2
    type: wait
    seconds: 10

  # The promotion is asserted by using it: only an admin of this subgroup may
  # add to it, so node-3 appearing in the listing is the proof it took effect
  # on node-2's own replica, not merely that node-1 recorded it.
  - name: Node-2 exercises its new grant by adding node-3
    type: add_group_members
    node: account-add-node-2
    group_id: '{{subgroup_id}}'
    members:
      - identity: '{{account_node3}}'
        role: Member

  - name: List subgroup members after the promotion
    type: list_group_members
    node: account-add-node-1
    group_id: '{{subgroup_id}}'
    outputs:
      members_after: members

  - name: Assert both accounts are members
    type: assert
    statements:
      - "contains({{members_after}}, {{account_node2}})"
      - "contains({{members_after}}, {{account_node3}})"
