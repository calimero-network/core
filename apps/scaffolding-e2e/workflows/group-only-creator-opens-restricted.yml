name: E2E Scaffolding - a Restricted subgroup cannot be opened, even by its creator
description: >
  A Restricted subgroup stays Restricted: setting it back to Open is refused
  for everyone, the creator included, and the subgroup keeps its visibility.

  Topology:
    * node-1 - the namespace owner, creates the subgroup.
    * node-2 - made an Admin of the subgroup, but not its creator.

  Pinned:
    * node-2's opening flip is refused;
    * node-1's opening flip is refused too, and node-1 still reads Restricted.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: ghcr.io/calimero-network/merod:edge
  prefix: e2e-node

steps:
  # First login on a fresh embedded-auth node bootstraps its root key
  # and seeds merobox's token cache; every step below runs authenticated.
  - name: Login on e2e-node-1
    type: login
    node: e2e-node-1
    username: dev
    password: dev-password

  - name: Login on e2e-node-2
    type: login
    node: e2e-node-2
    username: dev
    password: dev-password

  # --- Setup: app + namespace on node-1 (the namespace owner) ---

  - name: Install application on node-1
    type: install_application
    node: e2e-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Assert application installed
    type: assert
    statements:
      - "is_set({{app_id}})"

  - name: Create namespace on node-1
    type: create_namespace
    node: e2e-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Assert namespace created
    type: assert
    statements:
      - "is_set({{namespace_id}})"

  # --- node-2 joins the namespace as an ordinary member ---

  - name: Invite node-2 to namespace
    type: create_namespace_invitation
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invite_node2: invitation

  - name: Node-2 joins namespace
    type: join_namespace
    node: e2e-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invite_node2}}'
    outputs:
      identity_node2: memberIdentity

  - name: Converge every node on the namespace
    type: wait_for_sync
    group_id: '{{namespace_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    trigger_sync: true

  # Visibility in a step of its own: merobox's born-visibility create sends no
  # auth header.
  - name: Node-1 creates the subgroup
    type: create_group_in_namespace
    node: e2e-node-1
    namespace_id: '{{namespace_id}}'
    group_name: club
    outputs:
      club_sub: groupId

  - name: Assert the subgroup was created
    type: assert
    statements:
      - "is_set({{club_sub}})"

  - name: Node-1 marks the subgroup Restricted
    type: set_subgroup_visibility
    node: e2e-node-1
    group_id: '{{club_sub}}'
    visibility: restricted

  # Sealed under the subgroup's key.
  - name: Node-1 names the subgroup (an op sealed under its key)
    type: set_group_metadata
    node: e2e-node-1
    group_id: '{{club_sub}}'
    record_name: Club

  - name: Node-1 makes node-2 an Admin of the subgroup
    type: add_group_members
    node: e2e-node-1
    group_id: '{{club_sub}}'
    members:
      - identity: '{{identity_node2}}'
        role: Admin

  - name: Converge node-2 on the subgroup's governance
    type: wait_for_sync
    group_id: '{{namespace_id}}'
    nodes:
      - e2e-node-1
      - e2e-node-2
    timeout: 60
    trigger_sync: true

  - name: Let node-2 receive the subgroup key
    type: wait
    seconds: 10

  # --- Only the creator may open it ---

  - name: Node-2, an admin but not the creator, may not open it
    type: set_subgroup_visibility
    node: e2e-node-2
    group_id: '{{club_sub}}'
    visibility: open
    expected_failure: true

  - name: Node-1, its creator, may not open it either
    type: set_subgroup_visibility
    node: e2e-node-1
    group_id: '{{club_sub}}'
    visibility: open
    expected_failure: true

  - name: Node-1 reads the subgroup's visibility
    type: get_group_info
    node: e2e-node-1
    group_id: '{{club_sub}}'
    outputs:
      node1_visibility: subgroupVisibility

  - name: Assert the subgroup is still Restricted
    type: assert
    statements:
      - "equals({{node1_visibility}}, restricted)"

stop_all_nodes: false
