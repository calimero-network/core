# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: E2E KV Store - Cold Joiner First Execute (#2237)
description: 'Exercises the cold-join → first-execute window that the Phase 9 KeyDelivery wait closes.
  Node-1 creates a namespace+context and writes data. Node-2 joins the namespace and the context, then
  IMMEDIATELY calls `set` without an intervening `wait_for_sync`. With the three-phase governance contract
  in place (publish_and_await_ack + KeyDelivery `required_signers` + the joiner- side `KEY_DELIVERY_FALLBACK_WAIT`
  in `join_group`), the joiner must hold the group key by the time `join_context` returns, so the immediate
  `set` succeeds. Without the contract, the call would hit the new strict-error branch in `execute/mod.rs`
  ("group key not yet delivered") and fail.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4670
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Create context in namespace on node-1
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context in namespace on node-1
  org: '{{namespace_id}}'
  outputs:
    ctx_id: contextId
- name: Node-1 seeds initial state
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: seed
    value: from_node_1
  account: e2e-node-1
- name: Create namespace invitation for node-2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    namespace_invitation: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: e2e-node-2
- name: Node-2 writes immediately after join (cold path)
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: cold_write
    value: node2_first_op
  account: e2e-node-2
- name: Node-1 reads node-2's cold write
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: cold_write
  account: e2e-node-1
  outputs:
    cold_write_node1: rpc
- name: Assert node-2's cold write decrypts correctly on node-1
  type: json_assert
  statements:
  - 'json_equal({{cold_write_node1}}, {"output": "node2_first_op"})'
- name: Node-2 reads node-1's seed key
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: seed
  account: e2e-node-2
  outputs:
    seed_node2: rpc
- name: Assert node-2 sees node-1's seed
  type: json_assert
  statements:
  - 'json_equal({{seed_node2}}, {"output": "from_node_1"})'
