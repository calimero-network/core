name: E2E KV Store - Join During Concurrent Writes (buffered-delta replay)
description: >
  A node that joins a group while other members are writing must end up with a
  usable context. Deltas arriving while its snapshot sync is in flight are
  buffered and replayed afterwards, and replaying one runs the app's
  `__calimero_sync_next` export — so the bytecode has to be loadable at that
  moment. `handle_state_delta` and `execute_cascaded_events` both gate on
  `ensure_application_available` first; the snapshot-sync replay path does not.
  node-2 joins a quiet group (nothing to buffer, so replay never runs) and is
  the control; node-3 joins under a concurrent write burst and drives the
  replay path.

force_pull_image: false
near_devnet: false

auth_mode: embedded

nodes:
  count: 3
  image: ghcr.io/calimero-network/merod:edge
  prefix: join-race-node

steps:
  # First login on a fresh embedded-auth node bootstraps its root key
  # and seeds merobox's token cache; every step below runs authenticated.
  - name: Login on join-race-node-1
    type: login
    node: join-race-node-1
    username: dev
    password: dev-password

  - name: Login on join-race-node-2
    type: login
    node: join-race-node-2
    username: dev
    password: dev-password

  - name: Login on join-race-node-3
    type: login
    node: join-race-node-3
    username: dev
    password: dev-password

  # --- Setup: node-1 alone creates the namespace, context and some history ---

  - name: Install application on node-1
    type: install_application
    node: join-race-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Create namespace on node-1
    type: create_namespace
    node: join-race-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Create context in namespace on node-1
    type: create_context
    node: join-race-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx_id: contextId

  # History so a joiner needs a snapshot rather than a delta catch-up.
  - name: Node-1 seeds context history
    type: repeat
    count: 40
    steps:
      - type: call
        node: join-race-node-1
        context_id: '{{ctx_id}}'
        method: set
        args:
          key: "seed_{{iteration}}"
          value: "seed_value_{{iteration}}"

  # --- Control: node-2 joins a quiet group, so nothing is ever buffered ---

  - name: Create namespace invitation for node-2
    type: create_namespace_invitation
    node: join-race-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation_2: invitation

  - name: Node-2 joins namespace
    type: join_namespace
    node: join-race-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation_2}}'

  - name: Node-2 joins context
    type: join_context
    node: join-race-node-2
    context_id: '{{ctx_id}}'

  - name: Wait for node-1/node-2 convergence
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - join-race-node-1
      - join-race-node-2
    timeout: 120
    trigger_sync: true

  # --- The race: node-3 joins the context while node-1 and node-2 write ---

  - name: Create namespace invitation for node-3
    type: create_namespace_invitation
    node: join-race-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation_3: invitation

  # The join must run concurrently with the writes: a namespace join auto-follows
  # into the group's contexts, so doing it in an earlier step lets node-3 finish
  # syncing before the burst starts and the window never opens.
  - name: Node-3 joins while node-1 and node-2 write
    type: parallel
    failure_mode: fail-slow
    groups:
      - name: node-3 cold join
        steps:
          - type: join_namespace
            node: join-race-node-3
            namespace_id: '{{namespace_id}}'
            invitation: '{{invitation_3}}'
          - type: join_context
            node: join-race-node-3
            context_id: '{{ctx_id}}'

      # Paced rather than flat out, so the writes keep arriving for the whole
      # of node-3's snapshot sync instead of draining before it starts.
      - name: node-1 write burst
        steps:
          - type: repeat
            count: 20
            steps:
              - type: call
                node: join-race-node-1
                context_id: '{{ctx_id}}'
                method: set
                args:
                  key: "race_n1_{{iteration}}"
                  value: "n1_{{iteration}}"
              - type: wait
                seconds: 1

      - name: node-2 write burst
        steps:
          - type: repeat
            count: 20
            steps:
              - type: call
                node: join-race-node-2
                context_id: '{{ctx_id}}'
                method: set
                args:
                  key: "race_n2_{{iteration}}"
                  value: "n2_{{iteration}}"
              - type: wait
                seconds: 1

  # --- The bug signature ---

  - name: Node-3 must not fail to load the app during buffered replay
    type: assert_log_absent
    nodes: [join-race-node-3]
    patterns:
      - "failed to initialize module for execution"

  - name: Node-3 must not abandon a buffered delta
    type: assert_log_absent
    nodes: [join-race-node-3]
    patterns:
      - "Failed to replay buffered delta"

  # --- Functional check: node-3's context is actually usable ---

  - name: Wait for cluster convergence
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - join-race-node-1
      - join-race-node-2
      - join-race-node-3
    timeout: 180
    trigger_sync: true

  - name: Node-3 reads a key written during the race
    type: call
    node: join-race-node-3
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "race_n1_20"
    outputs:
      race_read_node3: result

  - name: Assert node-3 converged on the racing write
    type: json_assert
    statements:
      - 'json_equal({{race_read_node3}}, {"output": "n1_20"})'

  - name: Node-3 writes to prove its context still executes
    type: call
    node: join-race-node-3
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "node3_post_join"
      value: "usable"

  - name: Node-1 reads node-3's write
    type: call
    node: join-race-node-1
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "node3_post_join"
    outputs:
      node3_write_on_node1: result

  - name: Assert node-3's write reached node-1
    type: json_assert
    statements:
      - 'json_equal({{node3_write_on_node1}}, {"output": "usable"})'

stop_all_nodes: false
