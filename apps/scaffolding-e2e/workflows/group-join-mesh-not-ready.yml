name: E2E KV Store - Join With No Reachable Admitter (fails closed, then recovers)
description: >
  A join needs a live admitter, and this pins both halves of that: while no
  admitter is reachable the join fails and records NOTHING, and once one is
  reachable the same invitation joins normally.

  This scenario used to assert the opposite, and the reversal is deliberate
  rather than a regression. Its original subject (Slack, 2026-07-23) was a node
  left stranded "not a member" when its mesh to the inviter had not formed:
  every admin list endpoint then returned HTTP 500 ("node is not a member of
  group ..."), because `join_group` recorded the joiner's own membership only
  AFTER a direct request that could not complete. The fix at the time was to
  fall back to an empty join bundle and record membership from the verified
  invitation alone, so the node became "joined, pending key" instead of
  stranded.

  That fallback cannot survive `admitters` being an authorization boundary.
  Membership is now authorised by an `AdmitterEndorsement` — a signature from an
  account the invitation named — and only a reachable admitter can produce one.
  Recording membership from the invitation alone would mean any holder of a
  bearer invitation could admit itself with nobody's live consent, which is the
  hole the endorsement exists to close. So the joiner now refuses to publish an
  unendorsed membership.

  What that costs, stated plainly: joining while cut off from every admitter no
  longer works, and the node really is not a member afterwards. What it buys is
  that the failure is now explicit and diagnosable AT THE JOIN CALL — "join
  could not be endorsed: no admitter named by this invitation was reached" —
  rather than a silent strand whose only symptom was a mystifying 500 from an
  unrelated list endpoint. The original report was about being unable to tell
  what had gone wrong; that part is better, not worse.

  The condition is forced deterministically with merobox's `partition_peers`
  (merobox#278): a libp2p-only cut between node-1 and node-2 that leaves BOTH
  nodes RPC-reachable, so node-2's join can be driven while it cannot reach
  node-1 — the only admitter.

  The discriminating assertions are (1) node-2's account is absent from the
  group while partitioned, which is the fail-closed property, and (2) the join
  succeeds after the heal, which proves the refusal was about admitter
  reachability and not about the invitation.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: merod:local
  prefix: notready-node

steps:
  - name: Login on notready-node-1
    type: login
    node: notready-node-1
    username: dev
    password: dev-password

  - name: Login on notready-node-2
    type: login
    node: notready-node-2
    username: dev
    password: dev-password

  # ── Bootstrap on node-1: app, namespace, a context, an invitation ─────

  - name: Install application on node-1
    type: install_application
    node: notready-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Node-1 creates namespace (root group)
    type: create_namespace
    node: notready-node-1
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Node-1 creates a context in the group
    type: create_context
    node: notready-node-1
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx_id: contextId

  - name: Node-1 creates a group open invitation
    type: create_namespace_invitation
    node: notready-node-1
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  # Captured before the partition: the join below fails, so it yields no
  # account of its own, and the fail-closed assertion needs one to look for.
  - name: Get node-2's account
    type: node_identity
    node: notready-node-2
    outputs:
      account_node2: accountId

  - name: Let the two nodes connect + namespace governance gossip
    type: wait
    seconds: 8

  # ── Fault: libp2p-only cut between node-1 and node-2 (RPC stays up) ───

  - name: Partition node-2 from node-1 (libp2p only; RPC reachable)
    type: partition_peers
    node: notready-node-1
    peers:
      - notready-node-2

  # ── Join under partition ─────────────────────────────────────────────
  # node-1 is the only admitter this invitation names — the mint defaults the
  # list to the namespace's admins and TEE nodes — so with node-1 unreachable
  # there is nobody who can endorse the join. The joiner exhausts its discovery
  # budget, finds no admitter, and refuses to publish a membership it cannot
  # have authorised.

  - name: Node-2 joins while partitioned (no admitter reachable)
    type: join_namespace
    node: notready-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'
    expected_failure: true

  # THE fail-closed signal. A join that could not be endorsed must leave no
  # membership behind — not a local row, not a pending one. Read from node-1
  # because it is the node that can list: if node-2 had recorded itself
  # locally it would answer this list too, and the point is that it has not.
  #
  # `list_group_members` rather than `assert_not_member`: the latter issues its
  # own unauthenticated request and gets HTTP 401 under `auth_mode: embedded`,
  # so it cannot express this assertion in a logged-in workflow.
  - name: List members on node-1 while the join is unendorsed
    type: list_group_members
    node: notready-node-1
    group_id: '{{namespace_id}}'
    outputs:
      members_during_partition: members

  - name: Assert the unendorsed join recorded no membership
    type: assert
    statements:
      - "not_contains({{members_during_partition}}, {{account_node2}})"

  # ── Recovery: heal the partition, then a re-join must succeed ─────────

  - name: Heal the partition
    type: heal_peers
    node: notready-node-1
    peers:
      - notready-node-2

  - name: Wait for libp2p to notice the heal
    type: wait
    seconds: 20

  # The join comes BEFORE the convergence wait now, and that ordering is the
  # point: node-2 is not a member yet, so there is no shared governance state
  # for the two nodes to agree on until the endorsed join lands. Waiting first
  # would time out on state that does not exist.
  - name: Node-2 joins now that an admitter is reachable (must succeed)
    type: join_namespace
    node: notready-node-2
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'
    outputs:
      member_identity_node2: memberIdentity
      member_account_node2: memberAccount

  - name: Assert the join returned a member identity
    type: assert
    statements:
      - "is_set({{member_identity_node2}})"

  # Convergence must happen unaided: a real user does not trigger a sync.
  # Poll both nodes' group hash for up to 120s and require them to agree.
  - name: Wait for governance convergence after the endorsed join
    type: wait_for_sync
    group_id: '{{namespace_id}}'
    nodes:
      - notready-node-1
      - notready-node-2
    timeout: 120

  - name: Node-2 lists group members after the endorsed join
    type: list_group_members
    node: notready-node-2
    group_id: '{{namespace_id}}'
    outputs:
      joiner_members: members

  - name: Assert joiner now sees the group members, including itself
    type: assert
    statements:
      - "is_set({{joiner_members}})"
      - "contains({{joiner_members}}, {{member_account_node2}})"

stop_all_nodes: true
