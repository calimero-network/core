name: E2E Private Folders - A Workspace Admin Outside A Private Folder Cannot Read Or Act In It
description: >
  Alice owns the workspace and administers Board, then leaves Minutes, where Bob is Admin.
  Alice's node must refuse to show Minutes' name, members or contexts, must not list Minutes under Board,
  and her rename and add-member attempts must leave Minutes unchanged on Bob's and Carol's nodes.
  The attempts go through a script that reports the status instead of failing, so the judgement is made on state.

  Tree: workspace -> Secret (private), Board (private) -> Minutes (private) -> Notes (open).
  Nodes: 1 Alice (workspace owner, not in Minutes), 2 Bob (Admin of Minutes), 3 Carol (member of Board).

force_pull_image: false

auth_mode: embedded

nodes:
  count: 3
  image: merod:local
  prefix: private-folders

steps:

  - name: Login on node-1
    type: login
    node: private-folders-1
    username: dev
    password: dev-password

  - name: Login on node-2
    type: login
    node: private-folders-2
    username: dev
    password: dev-password

  - name: Login on node-3
    type: login
    node: private-folders-3
    username: dev
    password: dev-password

  # Workspace: node-1 (Alice) owns it, nodes 2.. join as plain members.
  # Alice is node-1, Bob node-2, Carol node-3, Dave node-4.

  - name: Install the application on Alice's node
    type: install_application
    node: private-folders-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app: applicationId

  - name: Alice creates the workspace
    type: create_namespace
    node: private-folders-1
    application_id: '{{app}}'
    outputs:
      ns: namespaceId

  - name: Read Alice's account and key
    type: node_identity
    node: private-folders-1
    outputs:
      acc_a: accountId
      key_a: publicKey

  - name: Invite node-2 to the workspace
    type: create_namespace_invitation
    node: private-folders-1
    namespace_id: '{{ns}}'
    outputs:
      inv_b: invitation

  - name: Node-2 joins the workspace
    type: join_namespace
    node: private-folders-2
    namespace_id: '{{ns}}'
    invitation: '{{inv_b}}'
    outputs:
      id_b: memberIdentity
      acc_b: memberAccount

  - name: Invite node-3 to the workspace
    type: create_namespace_invitation
    node: private-folders-1
    namespace_id: '{{ns}}'
    outputs:
      inv_c: invitation

  - name: Node-3 joins the workspace
    type: join_namespace
    node: private-folders-3
    namespace_id: '{{ns}}'
    invitation: '{{inv_c}}'
    outputs:
      id_c: memberIdentity
      acc_c: memberAccount

  # The tree: Secret and Board are private folders directly under the workspace,
  # Minutes is a private folder inside Board, Notes is an open folder inside Minutes.

  - name: Alice creates the Secret folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: secret
    outputs:
      f_secret: groupId

  - name: Alice marks Secret restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_secret}}'
    visibility: restricted

  - name: Alice creates the Board folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: board
    outputs:
      f_board: groupId

  - name: Alice marks Board restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_board}}'
    visibility: restricted

  - name: Alice creates the Minutes folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: minutes
    outputs:
      f_minutes: groupId

  - name: Alice nests Minutes under board
    type: reparent_group
    node: private-folders-1
    child_group_id: '{{f_minutes}}'
    new_parent_id: '{{f_board}}'

  - name: Alice marks Minutes restricted
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_minutes}}'
    visibility: restricted

  - name: Alice creates the Notes folder
    type: create_group_in_namespace
    node: private-folders-1
    namespace_id: '{{ns}}'
    group_name: notes
    outputs:
      f_notes: groupId

  - name: Alice nests Notes under minutes
    type: reparent_group
    node: private-folders-1
    child_group_id: '{{f_notes}}'
    new_parent_id: '{{f_minutes}}'

  - name: Alice marks Notes open
    type: set_subgroup_visibility
    node: private-folders-1
    group_id: '{{f_notes}}'
    visibility: open

  - name: Carol is added to Board as Member
    type: add_group_members
    node: private-folders-1
    group_id: '{{f_board}}'
    members:
    - identity: '{{id_c}}'
      role: Member

  - name: Bob is added to Minutes as Admin
    type: add_group_members
    node: private-folders-1
    group_id: '{{f_minutes}}'
    members:
    - identity: '{{id_b}}'
      role: Admin

  - name: Alice names Secret
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_secret}}'
    record_name: Secret
    data:
      topic: secret

  - name: Alice names Board
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_board}}'
    record_name: Board
    data:
      topic: board

  - name: Alice names Minutes
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_minutes}}'
    record_name: Minutes
    data:
      topic: weekly

  - name: Alice names Notes
    type: set_group_metadata
    node: private-folders-1
    group_id: '{{f_notes}}'
    record_name: Notes
    data:
      topic: actions

  - name: Settle the workspace governance onto every node
    type: wait_for_sync
    group_id: '{{ns}}'
    nodes:
    - private-folders-1
    - private-folders-2
    - private-folders-3
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Bob's node reads Minutes before Alice leaves
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/metadata
    match:
      data.name: Minutes
      data.data.topic: weekly
    retries: 30
    interval: 2

  - name: Alice creates a context in Minutes
    type: create_context
    node: private-folders-1
    application_id: '{{app}}'
    group_id: '{{f_minutes}}'
    outputs:
      ctx: contextId

  - name: Alice hands Minutes to Bob
    type: transfer_ownership
    node: private-folders-1
    group_id: '{{f_minutes}}'
    new_owner: '{{acc_b}}'

  - name: Alice leaves Minutes
    type: leave_group
    node: private-folders-1
    group_id: '{{f_minutes}}'

  - name: Bob's node sees Alice gone from Minutes
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_a}}'
    expect_no_match: true
    retries: 30
    interval: 2

  # Alice, a workspace admin outside Minutes, cannot read it.

  - name: 'Minutes on Alice''s node: info is refused'
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}
    expected_failure: true

  - name: 'Minutes on Alice''s node: member list is refused'
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/members
    expected_failure: true

  - name: 'Minutes on Alice''s node: metadata name is not readable'
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/metadata
    absent:
    - data.name

  - name: Alice's node refuses Minutes' context list
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_minutes}}/contexts
    expected_failure: true

  - name: Alice's node does not list Minutes under Board
    type: assert_api_response
    node: private-folders-1
    path: /admin-api/groups/{{f_board}}/subgroups
    where:
      groupId: '{{f_minutes}}'
    expect_no_match: true

  # Alice cannot act in it.

  - name: Alice tries to rename Minutes
    type: script
    script: scripts/group-attempt.sh
    target: local
    args:
    - private-folders-1
    - PUT
    - /admin-api/groups/{{f_minutes}}/metadata
    - '{"name":"Hijacked","data":{"topic":"hijacked"}}'

  - name: Alice tries to add Carol to Minutes
    type: script
    script: scripts/group-attempt.sh
    target: local
    args:
    - private-folders-1
    - POST
    - /admin-api/groups/{{f_minutes}}/members
    - '{"members":[{"identity":"{{acc_c}}","role":"Member"}]}'

  - name: Let the refused ops reach every peer
    type: wait
    seconds: 20

  - name: Settle the workspace governance
    type: wait_for_sync
    group_id: '{{ns}}'
    nodes:
    - private-folders-1
    - private-folders-2
    - private-folders-3
    timeout: 60
    check_interval: 2
    trigger_sync: true

  # Minutes is unchanged where it is held.

  - name: Bob's node still reads Minutes' original name and topic
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/metadata
    match:
      data.name: Minutes
      data.data.topic: weekly
    retries: 30
    interval: 2

  - name: Bob's node lists no Minutes seat for Carol
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_c}}'
    expect_no_match: true
    retries: 30
    interval: 2

  - name: Bob's node lists Bob as Minutes Admin
    type: assert_api_response
    node: private-folders-2
    path: /admin-api/groups/{{f_minutes}}/members
    where:
      identity: '{{acc_b}}'
    present:
    - identity
    match:
      role: Admin
    retries: 30
    interval: 2

  - name: 'Minutes on Carol''s node: info is refused'
    type: assert_api_response
    node: private-folders-3
    path: /admin-api/groups/{{f_minutes}}
    expected_failure: true

  - name: 'Minutes on Carol''s node: member list is refused'
    type: assert_api_response
    node: private-folders-3
    path: /admin-api/groups/{{f_minutes}}/members
    expected_failure: true

  - name: 'Minutes on Carol''s node: metadata name is not readable'
    type: assert_api_response
    node: private-folders-3
    path: /admin-api/groups/{{f_minutes}}/metadata
    absent:
    - data.name

stop_all_nodes: true
restart: false
wait_timeout: 120
