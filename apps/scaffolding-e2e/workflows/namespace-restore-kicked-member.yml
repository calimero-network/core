name: E2E KV Store - A Kicked Member Cannot Restore A Removed Namespace
description: >
  Node-1 removes a namespace from its own disk, then the owner (node-3) kicks
  node-1's account while node-1 is stopped. When node-1 returns and restores
  the namespace with no invitation, the restore is refused with 503 and the
  removal stands: no group, no key, no state comes back, and node-1 cannot read
  what node-3 wrote after the kick.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 3
  image: merod:local
  prefix: restore-kick-node

steps:
  - name: Login on node-1
    type: login
    node: restore-kick-node-1
    username: dev
    password: dev-password

  - name: Login on node-3
    type: login
    node: restore-kick-node-3
    username: dev
    password: dev-password

  - name: Install application on node-3
    type: install_application
    node: restore-kick-node-3
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Install application on node-1
    type: install_application
    node: restore-kick-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true

  - name: Create namespace on node-3
    type: create_namespace
    node: restore-kick-node-3
    application_id: '{{app_id}}'
    outputs:
      namespace_id: namespaceId

  - name: Create context in namespace on node-3
    type: create_context
    node: restore-kick-node-3
    application_id: '{{app_id}}'
    group_id: '{{namespace_id}}'
    outputs:
      ctx_id: contextId

  - name: Node-3 writes before node-1 joins
    type: call
    node: restore-kick-node-3
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "before_kick"
      value: "written_by_node_3"

  - name: Invite node-1
    type: create_namespace_invitation
    node: restore-kick-node-3
    namespace_id: '{{namespace_id}}'
    outputs:
      invitation: invitation

  - name: Node-1 joins the namespace
    type: join_namespace
    node: restore-kick-node-1
    namespace_id: '{{namespace_id}}'
    invitation: '{{invitation}}'
    outputs:
      account_node1: memberAccount

  - name: Node-1 syncs the context
    type: wait_for_sync
    context_id: '{{ctx_id}}'
    nodes:
      - restore-kick-node-3
      - restore-kick-node-1
    timeout: 90
    trigger_sync: true

  - name: Node-1 removes the namespace from its own disk
    type: delete_namespace
    node: restore-kick-node-1
    namespace_id: '{{namespace_id}}'

  - name: Node-1 lists the namespace as forgotten
    type: assert_api_response
    node: restore-kick-node-1
    path: '/admin-api/namespaces/for-application/{{app_id}}'
    where:
      namespaceId: '{{namespace_id}}'
    match:
      forgotten: true

  - name: Node-1 goes away
    type: stop_node
    nodes: restore-kick-node-1

  - name: The owner kicks node-1's account from the namespace
    type: remove_group_members
    node: restore-kick-node-3
    group_id: '{{namespace_id}}'
    members:
      - '{{account_node1}}'

  - name: Node-3 writes after the kick
    type: call
    node: restore-kick-node-3
    context_id: '{{ctx_id}}'
    method: set
    args:
      key: "after_kick"
      value: "written_after_the_kick"

  - name: Node-1 returns
    type: start_node
    nodes: restore-kick-node-1

  - name: Login on node-1 again
    type: login
    node: restore-kick-node-1
    username: dev
    password: dev-password

  - name: Node-1 still lists the namespace as forgotten
    type: assert_api_response
    node: restore-kick-node-1
    path: '/admin-api/namespaces/for-application/{{app_id}}'
    where:
      namespaceId: '{{namespace_id}}'
    match:
      forgotten: true

  - name: Node-1's restore is refused
    type: script
    script: scripts/rejoin-namespace.sh
    target: local
    args:
      - restore-kick-node-1
      - '{{namespace_id}}'
      - '503'

  - name: Node-1 still lists the namespace as forgotten after the refusal
    type: assert_api_response
    node: restore-kick-node-1
    path: '/admin-api/namespaces/for-application/{{app_id}}'
    where:
      namespaceId: '{{namespace_id}}'
    match:
      forgotten: true

  - name: Node-1 holds no contexts for the refused namespace
    type: list_group_contexts
    node: restore-kick-node-1
    group_id: '{{namespace_id}}'
    expected_failure: true
    expected_error: not a member of group

  - name: Node-1 cannot read what node-3 wrote after the kick
    type: call
    node: restore-kick-node-1
    context_id: '{{ctx_id}}'
    method: get
    args:
      key: "after_kick"
    expected_failure: true
    expected_error: No owned identity

stop_all_nodes: true
restart: false
wait_timeout: 120
