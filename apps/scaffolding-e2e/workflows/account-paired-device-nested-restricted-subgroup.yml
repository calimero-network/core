# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x4: checks what the dropped steps did
#   node_identity output accountNamespaceId (v1 device key) x1: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: E2E Account - A Paired Device Reads A Nested Restricted Subgroup After A Key Rotation
description: 'Node 2 founds a namespace, lets members create subgroups, and rotates the namespace key
  by removing node 4. Node 1 joins after that rotation and builds a Restricted subgroup nested inside
  another Restricted subgroup, both holding itself and node 2, then writes into a context in the inner
  one. Node 3 is then paired into node 1''s account. It must converge on the inner subgroup, join its
  context and read the write.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4050
accounts:
- paired-nested-1
- paired-nested-2
- paired-nested-3
- paired-nested-4
steps:
- name: Install the application on node-2
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_bundle: hash
  account: paired-nested-2
- type: set
  values:
    app: com.calimero.scaffolding-e2e
- name: Node-2 creates the namespace
  type: create_org
  org_name: Node-2 creates the namespace
  outputs:
    namespace_id: orgId
  account: paired-nested-2
- name: What node-2 speaks as
  type: whoami
  outputs:
    account_node2: publicKey
  account: paired-nested-2
- name: Node-2 lets every member create subgroups
  type: capabilities
  org: '{{namespace_id}}'
  capabilities: 36
  account: paired-nested-2
- name: Invite node-4 to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: paired-nested-2
  outputs:
    invite_node4: token
- name: Node-4 joins the namespace
  type: redeem_invite
  token: '{{invite_node4}}'
  account: paired-nested-4
- type: whoami
  account: paired-nested-4
  outputs:
    account_node4: publicKey
- name: Node-2 removes node-4, rotating the namespace key
  type: remove_member
  org: '{{namespace_id}}'
  member: '{{account_node4}}'
  account: paired-nested-2
- name: Invite node-1 to the namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: paired-nested-2
  outputs:
    invite_node1: token
- name: Node-1 joins the namespace
  type: redeem_invite
  token: '{{invite_node1}}'
  account: paired-nested-1
- name: Node-1 creates the outer Restricted subgroup
  type: create_team
  org: '{{namespace_id}}'
  team_name: team
  join: invite
  outputs:
    team_group: teamId
  account: paired-nested-1
- name: Node-1 marks the outer subgroup Restricted
  type: team_update
  org: '{{namespace_id}}'
  team: '{{team_group}}'
  join: invite
  account: paired-nested-1
- name: Node-1 adds node-2 to the outer subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{team_group}}'
  members:
  - '{{account_node2}}'
  role: member
  account: paired-nested-1
- name: Node-1 creates the inner subgroup
  type: create_team
  org: '{{namespace_id}}'
  team_name: dm
  join: invite
  outputs:
    dm_group: teamId
  account: paired-nested-1
- name: Node-2 nests the inner subgroup inside the outer one
  type: team_update
  org: '{{namespace_id}}'
  team: '{{dm_group}}'
  parent: '{{team_group}}'
  account: paired-nested-2
- name: Node-1 marks the inner subgroup Restricted
  type: team_update
  org: '{{namespace_id}}'
  team: '{{dm_group}}'
  join: invite
  account: paired-nested-1
- name: Node-1 adds node-2 to the inner subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{dm_group}}'
  members:
  - '{{account_node2}}'
  role: member
  account: paired-nested-1
- name: Node-1 creates a context in the inner subgroup
  type: deploy
  account: paired-nested-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Node-1 creates a context in the inner subgroup
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{dm_group}}'
  outputs:
    dm_ctx: contextId
- name: Node-1 writes into the inner subgroup's context
  type: call
  app: '{{dm_ctx}}'
  method: set
  args:
    key: dm_key
    value: from_node1
  account: paired-nested-1
- name: What node-1 speaks as
  type: whoami
  outputs:
    root_key: publicKey
  account: paired-nested-1
- name: Pair node-3 into node-1's account, naming only the account namespace
  type: add_device
  account: paired-nested-1
  device: paired-nested-3
- name: Node-3 joins the inner subgroup's context
  type: whoami
  account: paired-nested-3
  outputs:
    dm_ctx_key_node3: publicKey
- name: Node-3 holds a context identity
  type: assert
  statements:
  - is_set({{dm_ctx_key_node3}})
- name: Node-3 reads node-1's write
  type: call
  app: '{{dm_ctx}}'
  method: get
  args:
    key: dm_key
  account: paired-nested-3
  outputs:
    dm_read_node3: rpc
- name: Node-3 sees the write
  type: json_assert
  statements:
  - 'json_equal({{dm_read_node3}}, {"output": "from_node1"})'
