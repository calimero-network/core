# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x4: replication is synchronous: a read sees every committed write
name: E2E KV Store - Group Context Isolation
description: 'Tests that two contexts within the same namespace are fully isolated from each other. Writes
  to context-A must not be visible in context-B and vice versa. Also verifies that a node which is a member
  of both contexts sees the correct state in each independently.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4290
accounts:
- e2e-node-1
- e2e-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Create context-A in namespace
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context-A in namespace
  org: '{{namespace_id}}'
  outputs:
    ctx_a_id: contextId
- name: Create context-B in namespace
  type: deploy
  account: e2e-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Create context-B in namespace
  org: '{{namespace_id}}'
  outputs:
    ctx_b_id: contextId
- name: Assert both contexts created
  type: assert
  statements:
  - is_set({{ctx_a_id}})
  - is_set({{ctx_b_id}})
- name: Create namespace invitation for node-2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    namespace_invitation: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: e2e-node-2
- name: Node-1 writes to context-A
  type: call
  app: '{{ctx_a_id}}'
  method: set
  args:
    key: shared_key
    value: context_a_value
  account: e2e-node-1
- name: Node-2 reads shared_key from context-A
  type: call
  app: '{{ctx_a_id}}'
  method: get
  args:
    key: shared_key
  account: e2e-node-2
  outputs:
    key_in_ctx_a: rpc
- name: Assert context-A value correct on node-2
  type: json_assert
  statements:
  - 'json_equal({{key_in_ctx_a}}, {"output": "context_a_value"})'
- name: Node-1 reads shared_key from context-B (should be absent)
  type: call
  app: '{{ctx_b_id}}'
  method: get
  args:
    key: shared_key
  account: e2e-node-1
  outputs:
    key_in_ctx_b_node1: rpc
- name: Assert shared_key absent in context-B on node-1
  type: json_assert
  statements:
  - 'json_equal({{key_in_ctx_b_node1}}, {"output": null})'
- name: Node-2 reads shared_key from context-B (should be absent)
  type: call
  app: '{{ctx_b_id}}'
  method: get
  args:
    key: shared_key
  account: e2e-node-2
  outputs:
    key_in_ctx_b_node2: rpc
- name: Assert shared_key absent in context-B on node-2
  type: json_assert
  statements:
  - 'json_equal({{key_in_ctx_b_node2}}, {"output": null})'
- name: Node-2 writes to context-B
  type: call
  app: '{{ctx_b_id}}'
  method: set
  args:
    key: shared_key
    value: context_b_value
  account: e2e-node-2
- name: Node-1 reads shared_key from context-B
  type: call
  app: '{{ctx_b_id}}'
  method: get
  args:
    key: shared_key
  account: e2e-node-1
  outputs:
    ctx_b_key_node1: rpc
- name: Assert context-B value correct on node-1
  type: json_assert
  statements:
  - 'json_equal({{ctx_b_key_node1}}, {"output": "context_b_value"})'
- name: Node-1 re-reads shared_key from context-A (must still be context-A value)
  type: call
  app: '{{ctx_a_id}}'
  method: get
  args:
    key: shared_key
  account: e2e-node-1
  outputs:
    ctx_a_key_after_b_write: rpc
- name: Assert context-A value unchanged after context-B write
  type: json_assert
  statements:
  - 'json_equal({{ctx_a_key_after_b_write}}, {"output": "context_a_value"})'
- name: Node-1 writes ctx-A-only key
  type: call
  app: '{{ctx_a_id}}'
  method: set
  args:
    key: ctx_a_only
    value: only_in_a
  account: e2e-node-1
- name: Node-1 writes ctx-B-only key
  type: call
  app: '{{ctx_b_id}}'
  method: set
  args:
    key: ctx_b_only
    value: only_in_b
  account: e2e-node-1
- name: Node-2 reads ctx-A-only key from context-B (should be absent)
  type: call
  app: '{{ctx_b_id}}'
  method: get
  args:
    key: ctx_a_only
  account: e2e-node-2
  outputs:
    ctx_a_key_in_b: rpc
- name: Assert ctx-A-only key absent in context-B
  type: json_assert
  statements:
  - 'json_equal({{ctx_a_key_in_b}}, {"output": null})'
- name: Node-2 reads ctx-B-only key from context-A (should be absent)
  type: call
  app: '{{ctx_a_id}}'
  method: get
  args:
    key: ctx_b_only
  account: e2e-node-2
  outputs:
    ctx_b_key_in_a: rpc
- name: Assert ctx-B-only key absent in context-A
  type: json_assert
  statements:
  - 'json_equal({{ctx_b_key_in_a}}, {"output": null})'
