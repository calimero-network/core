name: E2E Account - Narrowing A Device's Scope Cuts Its Reads
description: >
  A device narrowed out of an application must stop READING that application's
  contexts, not merely stop writing to them, and widening must give them back.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: merod:local
  prefix: scope-cuts-node

steps:
  - name: Login on node-1
    type: login
    node: scope-cuts-node-1
    username: dev
    password: dev-password

  - name: Login on node-2
    type: login
    node: scope-cuts-node-2
    username: dev
    password: dev-password

  # App A is the multi-service bundle, because a node that is a member of
  # nothing can only complete acquisition for one; app B is the raw wasm and is
  # the application the narrowing takes away.
  - name: Install app A (the bundle) on node-1
    type: install_application
    node: scope-cuts-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-multi-0.0.0.mpk
    dev: true
    outputs:
      app_a: applicationId

  - name: Install app B (the raw wasm) on node-1
    type: install_application
    node: scope-cuts-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app_b: applicationId

  - name: Two applications, not one installed twice
    type: assert
    statements:
      - 'is_set({{app_a}})'
      - 'is_set({{app_b}})'
      - '{{app_a}} != {{app_b}}'

  - name: Node-1 creates namespace A1, targeting app A
    type: create_namespace
    node: scope-cuts-node-1
    application_id: '{{app_a}}'
    outputs:
      ns_a1: namespaceId

  - name: Node-1 creates namespace B1, targeting app B
    type: create_namespace
    node: scope-cuts-node-1
    application_id: '{{app_b}}'
    outputs:
      ns_b1: namespaceId

  - name: Node-1 registers a context in namespace A1
    type: create_context
    node: scope-cuts-node-1
    application_id: '{{app_a}}'
    group_id: '{{ns_a1}}'
    service_name: store-a
    outputs:
      ctx_a: contextId

  - name: Node-1 registers a context in namespace B1
    type: create_context
    node: scope-cuts-node-1
    application_id: '{{app_b}}'
    group_id: '{{ns_b1}}'
    outputs:
      ctx_b: contextId

  - name: What node-1 speaks as
    type: node_identity
    node: scope-cuts-node-1
    outputs:
      alice_root: accountRootPublicKey

  # Paired on everything, so the narrowing below is the only thing that can take
  # an application away from it.
  - name: Pair node-2 onto Alice's account, scoped to every application
    type: account_pair
    node: scope-cuts-node-2
    holder: scope-cuts-node-1
    root_key: '{{alice_root}}'
    account_namespace: auto
    namespaces:
      - '{{ns_a1}}'
      - '{{ns_b1}}'
    await_self: true
    outputs:
      paired_device: deviceId

  - name: The paired device follows app A's context
    type: join_context
    node: scope-cuts-node-2
    context_id: '{{ctx_a}}'

  - name: The paired device follows app B's context
    type: join_context
    node: scope-cuts-node-2
    context_id: '{{ctx_b}}'

  # ── Baseline: the device reads both ────────────────────────────────

  - name: Node-1 writes into app A's context
    type: call
    node: scope-cuts-node-1
    context_id: '{{ctx_a}}'
    method: set
    args:
      key: shared
      value: a-before

  - name: Node-1 writes into app B's context
    type: call
    node: scope-cuts-node-1
    context_id: '{{ctx_b}}'
    method: set
    args:
      key: shared
      value: b-before

  - name: Settle app A's context
    type: wait_for_sync
    nodes:
      - scope-cuts-node-1
      - scope-cuts-node-2
    context_id: '{{ctx_a}}'
    timeout: 60
    trigger_sync: true

  - name: Settle app B's context
    type: wait_for_sync
    nodes:
      - scope-cuts-node-1
      - scope-cuts-node-2
    context_id: '{{ctx_b}}'
    timeout: 60
    trigger_sync: true

  - name: The device reads app A's context
    type: call
    node: scope-cuts-node-2
    context_id: '{{ctx_a}}'
    method: get
    args:
      key: shared
    outputs:
      a_before: result

  - name: The device reads app B's context
    type: call
    node: scope-cuts-node-2
    context_id: '{{ctx_b}}'
    method: get
    args:
      key: shared
    outputs:
      b_before: result

  - name: The device is a working replica of both before the narrowing
    type: json_assert
    statements:
      - 'json_equal({{a_before}}, {"output": "a-before"})'
      - 'json_equal({{b_before}}, {"output": "b-before"})'

  # ── Narrow the device to app A ─────────────────────────────────────

  - name: Narrow the paired device to app A alone
    type: account_rescope
    node: scope-cuts-node-1
    device_id: '{{paired_device}}'
    scope:
      only:
        - '{{app_a}}'

  # The barrier before the write below: the narrowing is published from node-1
  # and folded on node-2, so without waiting for the device's own view to change
  # the write races the fold and the cut would be asserted against nothing.
  - name: The narrowed device stops listing app B's namespace
    type: assert_api_response
    node: scope-cuts-node-2
    path: /admin-api/namespaces
    where:
      namespaceId: '{{ns_b1}}'
    expect_no_match: true
    retries: 45
    interval: 2

  - name: Node-1 writes a new value into app B's context
    type: call
    node: scope-cuts-node-1
    context_id: '{{ctx_b}}'
    method: set
    args:
      key: shared
      value: b-after-the-narrowing

  # The sync plane sends storage entities in the clear, so a gate that only
  # stopped gossip would let this value through on the next interval tick.
  - name: Give every sync round a chance to carry it
    type: wait
    seconds: 60

  # The narrowing cut the reads, not only the writes: the device left app B's
  # context, so it has no identity there to read with and the new value never
  # reached it. A read that succeeded would be the silent reader this exists to
  # prevent.
  - name: The narrowed device cannot read app B's context at all
    type: call
    node: scope-cuts-node-2
    context_id: '{{ctx_b}}'
    method: get
    args:
      key: shared
    expected_failure: true

  - name: The device still reads app A's context
    type: call
    node: scope-cuts-node-2
    context_id: '{{ctx_a}}'
    method: get
    args:
      key: shared
    outputs:
      a_still: result

  - name: And the narrowing took away one application and only that one
    type: json_assert
    statements:
      - 'json_equal({{a_still}}, {"output": "a-before"})'

  # ── Widen back to all ──────────────────────────────────────────────

  - name: Widen the paired device back to every application
    type: account_rescope
    node: scope-cuts-node-1
    device_id: '{{paired_device}}'
    scope: all

  - name: The widened device lists app B's namespace again
    type: assert_api_response
    node: scope-cuts-node-2
    path: /admin-api/namespaces
    where:
      namespaceId: '{{ns_b1}}'
    match:
      targetApplicationId: '{{app_b}}'
    retries: 45
    interval: 2

  - name: Settle app B's context once the device is back
    type: wait_for_sync
    nodes:
      - scope-cuts-node-1
      - scope-cuts-node-2
    context_id: '{{ctx_b}}'
    timeout: 90
    trigger_sync: true

  - name: The widened device reads what it missed
    type: call
    node: scope-cuts-node-2
    context_id: '{{ctx_b}}'
    method: get
    args:
      key: shared
    outputs:
      b_widened: result

  - name: Widening gave the reads back without re-pairing
    type: json_assert
    statements:
      - 'json_equal({{b_widened}}, {"output": "b-after-the-narrowing"})'

stop_all_nodes: true
