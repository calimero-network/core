# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x3: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: E2E Scaffolding - list_subgroups Restricted Visibility
description: "End-to-end coverage for PR #2361: the `list_subgroups` admin endpoint must not leak `Restricted`\
  \ subgroups to callers who are neither an admin of the parent group nor a member of the restricted child.\n\
  Before #2361 `list_subgroups` returned *every* direct child of the parent — including `Restricted` ones\
  \ — to anyone. A plain namespace member could therefore enumerate the existence (and metadata) of private\
  \ DMs / private channels it had no access to. The membership wall in `check_group_membership` stopped\
  \ non-members from *joining* or *calling* such a subgroup, but the enumeration endpoint bypassed it.\n\
  Topology: a namespace with one `Restricted` and one `Open` subgroup, both direct children of the namespace\
  \ root.\n\n  * node-1 — the namespace owner/admin. Creates both subgroups.\n  * node-2 — a plain namespace\
  \ member. NOT an admin of the namespace,\n    NOT a member of the Restricted subgroup.\n  * node-3 —\
  \ a namespace member that node-1 adds to the Restricted\n    subgroup.\n\nHeadline assertions on `list_subgroups(namespace)`:\n\
  \n  * node-2 (non-admin, non-member) sees ONLY the `Open` subgroup. The\n    `Restricted` subgroup is\
  \ hidden — this is the leak #2361 closes.\n  * node-3 (member of the Restricted child) sees BOTH subgroups.\n\
  \  * node-1 (admin of the parent namespace) sees BOTH subgroups —\n    admins govern the space and must\
  \ enumerate every child.\n\nThe per-decision logic is also pinned by the `calimero-context` unit tests\
  \ `subgroup_visible_to_*` in `group_store/tests.rs`.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4470
accounts:
- e2e-node-1
- e2e-node-2
- e2e-node-3
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: e2e-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Assert application installed
  type: assert
  statements:
  - is_set({{app_id}})
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: e2e-node-1
- name: Assert namespace created
  type: assert
  statements:
  - is_set({{namespace_id}})
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node2: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite_node2}}'
  account: e2e-node-2
- type: whoami
  account: e2e-node-2
  outputs:
    identity_node2: publicKey
- name: Invite node-3 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: e2e-node-1
  outputs:
    invite_node3: token
- name: Node-3 joins namespace
  type: redeem_invite
  token: '{{invite_node3}}'
  account: e2e-node-3
- type: whoami
  account: e2e-node-3
  outputs:
    identity_node3: publicKey
- name: Node-1 creates a Restricted subgroup (private channel)
  type: create_team
  org: '{{namespace_id}}'
  team_name: restricted-channel
  join: invite
  outputs:
    restricted_sub: teamId
  account: e2e-node-1
- name: Assert Restricted subgroup created
  type: assert
  statements:
  - is_set({{restricted_sub}})
- name: Node-1 marks the subgroup Restricted
  type: team_update
  org: '{{namespace_id}}'
  team: '{{restricted_sub}}'
  join: invite
  account: e2e-node-1
- name: Node-1 creates an Open subgroup (public channel)
  type: create_team
  org: '{{namespace_id}}'
  team_name: open-channel
  join: invite
  outputs:
    open_sub: teamId
  account: e2e-node-1
- name: Assert Open subgroup created
  type: assert
  statements:
  - is_set({{open_sub}})
- name: Node-1 marks the subgroup Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{open_sub}}'
  join: everyone
  account: e2e-node-1
- name: Node-1 adds node-3 to the Restricted subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{restricted_sub}}'
  members:
  - '{{identity_node3}}'
  role: member
  account: e2e-node-1
- name: Brief settle for namespace-DAG propagation
  type: wait
  seconds: 5.0
- name: Node-2 lists the namespace subgroups
  type: team_list
  org: '{{namespace_id}}'
  account: e2e-node-2
  outputs:
    subgroups_node2: subgroups
- name: Assert node-2 sees the Open subgroup
  type: assert
  statements:
  - contains({{subgroups_node2}}, {{open_sub}})
- name: Assert node-2 does NOT see the Restricted subgroup
  type: assert
  statements:
  - not_contains({{subgroups_node2}}, {{restricted_sub}})
- name: Node-3 lists the namespace subgroups
  type: team_list
  org: '{{namespace_id}}'
  account: e2e-node-3
  outputs:
    subgroups_node3: subgroups
- name: Assert node-3 sees the Open subgroup
  type: assert
  statements:
  - contains({{subgroups_node3}}, {{open_sub}})
- name: Assert node-3 (Restricted-subgroup member) sees the Restricted subgroup
  type: assert
  statements:
  - contains({{subgroups_node3}}, {{restricted_sub}})
- name: Node-1 lists the namespace subgroups
  type: team_list
  org: '{{namespace_id}}'
  account: e2e-node-1
  outputs:
    subgroups_node1: subgroups
- name: Assert node-1 sees the Open subgroup
  type: assert
  statements:
  - contains({{subgroups_node1}}, {{open_sub}})
- name: Assert node-1 (namespace admin) sees the Restricted subgroup
  type: assert
  statements:
  - contains({{subgroups_node1}}, {{restricted_sub}})
