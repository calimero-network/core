# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_api_response x1: v1 admin API
#   login (unknown) x2: checks what the dropped steps did
#   node_identity output accountNamespaceId (v1 device key) x1: checks what the dropped steps did
name: E2E Account - A Device Learns The Account Namespace After A Plain Pairing
description: 'A device paired without the account namespace id converges on it once a later pair-init
  names it. Goes red if a re-pair starts publishing there first.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3990
accounts:
- learned-node-1
- learned-node-2
steps:
- name: Install the application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_bundle: hash
  account: learned-node-1
- type: set
  values:
    app: com.calimero.scaffolding-e2e
- name: Node-1 creates namespace A
  type: create_org
  org_name: Node-1 creates namespace A
  outputs:
    ns_a: orgId
  account: learned-node-1
- name: What node-1 speaks as
  type: whoami
  outputs:
    alice_root: publicKey
  account: learned-node-1
- name: Pair node-2 the plain way, naming no account namespace
  type: add_device
  account: learned-node-1
  device: learned-node-2
- name: Pair node-2 again, this time naming the account namespace
  type: add_device
  account: learned-node-1
  device: learned-node-2
  outputs:
    key_delivered: keyDelivered
- name: The re-pairing delivered a key
  type: json_assert
  statements:
  - json_equal({{key_delivered}}, true)
