name: E2E Account - A Device Learns The Account Namespace After A Plain Pairing
description: >
  A device paired without the account namespace id converges on it once a later
  pair-init names it. Goes red if a re-pair starts publishing there first.

force_pull_image: false

auth_mode: embedded

nodes:
  count: 2
  image: merod:local
  prefix: learned-node

steps:
  - name: Login on node-1
    type: login
    node: learned-node-1
    username: dev
    password: dev-password

  - name: Login on node-2
    type: login
    node: learned-node-2
    username: dev
    password: dev-password

  - name: Install the application on node-1
    type: install_application
    node: learned-node-1
    path: ../../dist/com.calimero.scaffolding-e2e-0.0.0.mpk
    dev: true
    outputs:
      app: applicationId

  - name: Node-1 creates namespace A
    type: create_namespace
    node: learned-node-1
    application_id: '{{app}}'
    outputs:
      ns_a: namespaceId

  - name: What node-1 speaks as
    type: node_identity
    node: learned-node-1
    outputs:
      alice_root: accountRootPublicKey
      account_ns: accountNamespaceId

  # `account_pair` names no account namespace, which is the state to start from.
  - name: Pair node-2 the plain way, naming no account namespace
    type: account_pair
    node: learned-node-2
    holder: learned-node-1
    root_key: '{{alice_root}}'
    namespaces:
      - '{{ns_a}}'
    applications:
      - '{{app}}'

  # `await_self` returns once node-2 reads its own binding in the account namespace.
  - name: Pair node-2 again, this time naming the account namespace
    type: account_pair
    node: learned-node-2
    holder: learned-node-1
    root_key: '{{alice_root}}'
    account_namespace: '{{account_ns}}'
    await_self: true
    outputs:
      key_delivered: keyDelivered

  - name: The re-pairing delivered a key
    type: json_assert
    statements:
      - 'json_equal({{key_delivered}}, true)'

  - name: Node-2 now names the laptop's account namespace
    type: assert_api_response
    node: learned-node-2
    path: /admin-api/identity
    match:
      data.accountNamespaceId: '{{account_ns}}'

stop_all_nodes: true
