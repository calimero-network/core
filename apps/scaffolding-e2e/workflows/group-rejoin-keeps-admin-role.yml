# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_api_response x2: v1 admin API
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# Migration note: converter bug: v1 read the role in the admin API's member list
#   (assert_api_response, dropped), so the port checked nothing. The organization lists
#   each member's role (GET orgs/{org}), read here on both members' nodes: redeeming an
#   invite keeps a higher role the member holds
name: E2E KV Store - Presenting An Invitation Again Keeps The Role A Member Holds
description: "A member who already holds a role and presents a fresh invitation again (a retried join,\
  \ or a re-sync) is not being admitted a second time. The node that answers the join must leave the role\
  \ it recorded for that member alone.\nThe responder records the joiner before the join op reaches anyone,\
  \ so that the joiner's first sync stream is authorised. A member who already holds a row keeps the role\
  \ it holds, and a new joiner is recorded at the role its invitation names.\nScenario (2 nodes, one namespace):\n\
  \n  1. node-2 joins the namespace on an invitation from node-1.\n  2. node-1 promotes node-2 to Admin\
  \ of the namespace root, and both\n     replicas settle on the promotion.\n  3. node-1 mints a second\
  \ invitation and node-2 presents it.\n  4. node-1, which answered the join, still lists node-2 as an\
  \ Admin.\n\nThe responder behaviour is also asserted directly by the join-responder tests in `crates/node/src/sync/manager/namespace_sync.rs`.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4550
accounts:
- rejoin-role-node-1
- rejoin-role-node-2
steps:
- name: Install application on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: rejoin-role-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Node-1 creates namespace
  type: create_org
  org_name: Node-1 creates namespace
  outputs:
    namespace_id: orgId
  account: rejoin-role-node-1
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: rejoin-role-node-1
  outputs:
    invite_first: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite_first}}'
  account: rejoin-role-node-2
- type: whoami
  account: rejoin-role-node-2
  outputs:
    account_node2: publicKey
- name: Promote node-2 to Admin of the namespace root
  type: set_role
  org: '{{namespace_id}}'
  member: '{{account_node2}}'
  role: admin
  account: rejoin-role-node-1
- name: Node-1 mints a second invitation
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: rejoin-role-node-1
  outputs:
    invite_second: token
- name: Node-2 presents the second invitation as an existing member
  type: redeem_invite
  token: '{{invite_second}}'
  account: rejoin-role-node-2
- name: Node-2's account id
  type: whoami
  account: rejoin-role-node-2
  outputs:
    node2_account_id: accountId
- name: Node-1, which answered the join, still lists node-2 as an Admin
  type: http
  method: get
  path: orgs/{{namespace_id}}
  account: rejoin-role-node-1
  outputs:
    members_node1: members
- name: Node-2 still lists itself as an Admin
  type: http
  method: get
  path: orgs/{{namespace_id}}
  account: rejoin-role-node-2
  outputs:
    members_node2: members
- name: Assert node-2 kept the Admin role on both
  type: json_assert
  statements:
  - 'json_subset({{members_node1}}, {"{{node2_account_id}}": "admin"})'
  - 'json_subset({{members_node2}}, {"{{node2_account_id}}": "admin"})'
