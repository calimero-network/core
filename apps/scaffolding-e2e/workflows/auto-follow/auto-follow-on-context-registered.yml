# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   login (unknown) x2: checks what the dropped steps did
#   set_member_auto_follow (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: Auto-follow on context-registered (happy path)
description: "Workflow 1 of the #2422 regression test plan.\nGoal: prove the event-driven auto-follow\
  \ path (`OpEvent::ContextRegistered` → `JoinContext`) is wired end-to-end. Admin sets `auto_follow.contexts\
  \ = true` for the joiner BEFORE creating the context, then creates a context. The joiner should materialise\
  \ the context locally with no explicit `join_context` step.\nExpected on master: PASS. Wires:\n  crates/context/src/auto_follow.rs::handle_context_registered\n\
  \  (decision = Join → emit JoinContextRequest)\n\nIf THIS workflow fails on master, the failure is upstream\
  \ of #2422 — the event-driven happy path itself is broken (the bug class lives one branch deeper, in\
  \ the on-join backfill path that workflows 2 and 5 exercise).\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 4970
accounts:
- af-baseline-node-1
- af-baseline-node-2
steps:
- name: Install kv-store-with-handlers on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  outputs:
    app_id_bundle: hash
  account: af-baseline-node-1
- type: set
  values:
    app_id: com.calimero.scaffolding-e2e
- name: Node-1 creates namespace
  type: create_org
  org_name: Node-1 creates namespace
  outputs:
    namespace_id: orgId
  account: af-baseline-node-1
- name: Node-1 captures its signing key
  type: whoami
  outputs:
    node1_identity: publicKey
  account: af-baseline-node-1
- name: Node-1 invites node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: af-baseline-node-1
  outputs:
    ns_invite: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: af-baseline-node-2
- type: whoami
  account: af-baseline-node-2
  outputs:
    node2_identity: publicKey
    node2_account: publicKey
- name: Node-1 creates subgroup
  type: create_team
  org: '{{namespace_id}}'
  team_name: auto-follow-baseline
  join: invite
  outputs:
    group_id: teamId
  account: af-baseline-node-1
- name: Node-1 adds node-2 to the subgroup
  type: team_add
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  members:
  - '{{node2_identity}}'
  role: member
  account: af-baseline-node-1
- name: Wait for member governance to converge on both nodes
  type: wait
  seconds: 5.0
- name: Wait for AutoFollowSet op to propagate to node-2
  type: wait
  seconds: 5.0
- name: Node-1 creates context in subgroup
  type: deploy
  account: af-baseline-node-1
  wasm: '{{env.CORE_WASM_DIR}}/scaffolding_e2e.wasm'
  app_name: Node-1 creates context in subgroup
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
    node1_key: memberPublicKey
- name: Node-1 writes a key into the new context
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: hello
    value: from-node-1
  account: af-baseline-node-1
  as_key: '{{node1_key}}'
- name: Node-2 reads what node-1 wrote
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: hello
  account: af-baseline-node-2
  outputs:
    node2_read: rpc
- name: Assert node-2 read the value node-1 wrote
  type: assert
  statements:
  - is_set({{node2_read}})
  - contains({{node2_read}}, "from-node-1")
