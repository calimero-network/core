[package]
name = "scaffolding-e2e"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
thiserror.workspace = true
# `tracing` feature routes `tracing` macro output (this app's and the storage
# crate's) through the host log; exercised by `tracing_probe` + the runtime
# `tracing_logs` integration test.
calimero-sdk = { workspace = true, features = ["tracing"] }
calimero-storage.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true

[package.metadata.workspaces]
independent = true

[package.metadata.calimero]
package = "com.calimero.scaffolding-e2e-multi"
name = "Scaffolding E2E"
min-runtime-version = "0.0.0"

# Both services build from this crate's own wasm under two names: what they
# exercise in merod is multi-service install + service_name selection, not
# two different programs.
[[package.metadata.calimero.services]]
name = "store-a"
crate = "scaffolding-e2e"

[[package.metadata.calimero.services]]
name = "store-b"
crate = "scaffolding-e2e"
