# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: AuthoredSortedMap across two nodes
description: "Two nodes, two accounts, one shared keyspace — the three properties of AuthoredSortedMap\
  \ that only a real network can show.\n1. AUTHORED STATE REPLICATES. Every entry here is StorageType::User,\
  \ signed\n   per action and verified against its owner inside Interface::apply_action\n   on the receiving\
  \ node. If that were wrong, the very first cross-node read\n   below would come back empty rather than\
  \ fail loudly, so this leg is the\n   one that proves the stamp survives a wire.\n\n2. THE OWNER GATE\
  \ HOLDS ACROSS NODES. Node 2 is a full member and may insert\n   anything it likes; it still cannot\
  \ edit or retract node 1's note. The\n   local check inside `edit` binds only the node running it, so\
  \ refusing it\n   HERE — from a different node, a different account — is the assertion that\n   means\
  \ something.\n\n3. THE SLICE DOES NOT PAY FOR THE FLOOD. Insert is open on a shared keyspace\n   and\
  \ only an entry's own author may ever remove it, so a member acting in\n   bad faith can grow the collection\
  \ permanently and nobody can prune it.\n   Node 2 writes 150 notes under a topic nobody reads; node\
  \ 1's topic read is\n   an index seek and comes back unchanged. That is the difference between\n   AuthoredSortedMap\
  \ and AuthoredMap, stated as behaviour a node can check.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3510
accounts:
- authored-node-1
- authored-node-2
steps:
- name: Install application on authored-node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/authored_sorted_kv_store.wasm'
  outputs:
    app_id_bundle: hash
  account: authored-node-1
- type: set
  values:
    app_id: com.calimero.authored-sorted-kv-store
- name: Create mesh with authored-node-2
  type: create_org
  account: authored-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: authored-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: authored-node-2
  token: '{{_mesh_invite}}'
- name: Create mesh with authored-node-2
  type: deploy
  account: authored-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/authored_sorted_kv_store.wasm'
  app_name: Create mesh with authored-node-2
  outputs:
    context_id: contextId
    node1_key: memberPublicKey
- name: Assert the mesh came up
  type: assert
  statements:
  - is_set({{context_id}})
  - is_set({{node1_key}})
- name: Node 1 posts to `news`
  type: call
  app: '{{context_id}}'
  method: post
  args:
    topic: news
    seq: 1
    text: from node one
  account: authored-node-1
  outputs:
    node1_key_path: result
- name: Assert node 1 got a key back
  type: assert
  statements:
  - is_set({{node1_key_path}})
- name: Node 2 reads the topic
  type: call
  app: '{{context_id}}'
  method: read_topic
  args:
    topic: news
  account: authored-node-2
  outputs:
    n2_topic: rpc
- name: Assert node 2 sees node 1's note
  type: assert
  statements:
  - contains({{n2_topic}}, "from node one")
- name: Node 2 counts the notes whose authorship it could verify
  type: call
  app: '{{context_id}}'
  method: verified_notes
  args:
    topic: news
  account: authored-node-2
  outputs:
    n2_verified: rpc
- name: Assert node 2 verified node 1's authorship for itself
  type: json_assert
  statements:
  - 'json_equal({{n2_verified}}, {"output": 1})'
- name: Node 2 tries to edit node 1's note
  type: call
  app: '{{context_id}}'
  method: edit
  args:
    key: '{{node1_key_path}}'
    text: node two was here
  account: authored-node-2
  expected_failure: true
  outputs:
    edit_error: error
- name: Assert the edit was refused
  type: assert
  statements:
  - is_set({{edit_error}})
- name: Node 2 tries to retract node 1's note
  type: call
  app: '{{context_id}}'
  method: retract
  args:
    key: '{{node1_key_path}}'
  account: authored-node-2
  expected_failure: true
  outputs:
    retract_error: error
- name: Assert the retraction was refused
  type: assert
  statements:
  - is_set({{retract_error}})
- name: Node 1 reads its note back
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: '{{node1_key_path}}'
  account: authored-node-1
  outputs:
    n1_after_attack: rpc
- name: Assert the note is untouched
  type: json_assert
  statements:
  - 'json_equal({{n1_after_attack}}, {"output": "from node one"})'
- name: Node 2 posts to the same topic, at the same seq
  type: call
  app: '{{context_id}}'
  method: post
  args:
    topic: news
    seq: 1
    text: from node two
  account: authored-node-2
  outputs:
    node2_key_path: result
- name: Assert the two notes landed on different keys
  type: assert
  statements:
  - '{{node1_key_path}} != {{node2_key_path}}'
- name: Node 1 reads the topic
  type: call
  app: '{{context_id}}'
  method: read_topic
  args:
    topic: news
  account: authored-node-1
  outputs:
    n1_topic: rpc
- name: Assert node 1 sees both notes
  type: assert
  statements:
  - contains({{n1_topic}}, "from node one")
  - contains({{n1_topic}}, "from node two")
- name: Node 2 floods a topic nobody reads
  type: call
  app: '{{context_id}}'
  method: flood
  args:
    topic: spam
    from: 0
    n: 150
  account: authored-node-2
  outputs:
    total_after_flood: rpc
- name: Assert the collection really did grow
  type: json_assert
  statements:
  - 'json_equal({{total_after_flood}}, {"output": 152})'
- name: Node 1 counts the whole collection
  type: call
  app: '{{context_id}}'
  method: count_all
  args: {}
  account: authored-node-1
  outputs:
    n1_total: rpc
- name: Assert node 1 holds every entry
  type: json_assert
  statements:
  - 'json_equal({{n1_total}}, {"output": 152})'
- name: Node 1 reads `news` again, with 150 unread entries in the collection
  type: call
  app: '{{context_id}}'
  method: read_topic
  args:
    topic: news
  account: authored-node-1
  outputs:
    n1_topic_after: rpc
- name: Assert the slice is unmoved by the flood
  type: assert
  statements:
  - contains({{n1_topic_after}}, "from node one")
  - contains({{n1_topic_after}}, "from node two")
  - not_contains({{n1_topic_after}}, "spam/")
- name: Node 1 narrows to its own notes
  type: call
  app: '{{context_id}}'
  method: my_notes
  args:
    topic: news
  account: authored-node-1
  outputs:
    n1_mine: rpc
- name: Assert node 1 sees only its own note
  type: assert
  statements:
  - contains({{n1_mine}}, "news/")
  - not_contains({{n1_mine}}, "spam/")
