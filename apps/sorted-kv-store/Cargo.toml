[package]
name = "sorted-kv-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "Key-ordered key-value store on the v2 app SDK: range, prefix, page, first, last"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-app-sdk = { path = "../../crates/app-sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like the SDK's sample guest: the tests build this crate for wasm32-wasip2.
[workspace]
