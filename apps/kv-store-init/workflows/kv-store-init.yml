# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
name: KV Store Init Test
description: KV Store Init Application Workflow
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3770
accounts:
- kv-store-init-node-1
- kv-store-init-node-2
steps:
- name: Install KV Store Init Application
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_init.wasm'
  outputs:
    app_id_bundle: hash
  account: kv-store-init-node-1
- type: set
  values:
    app_id: com.calimero.kv-store-init
- name: Create Mesh
  type: create_org
  account: kv-store-init-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: kv-store-init-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: kv-store-init-node-2
  token: '{{_mesh_invite}}'
- name: Create Mesh
  type: deploy
  account: kv-store-init-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_init.wasm'
  app_name: Create Mesh
  outputs:
    context_id: contextId
    member_public_key: memberPublicKey
- name: Get Initial Key 1
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: init_key_1
  account: kv-store-init-node-1
  outputs:
    init_value_1: result
- name: Assert Initial Key 1 Value
  type: assert
  statements:
  - '{{init_value_1}} == ''Initial value 1'''
- name: Get Initial Key 2
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: init_key_2
  account: kv-store-init-node-1
  outputs:
    init_value_2: result
- name: Assert Initial Key 2 Value
  type: assert
  statements:
  - '{{init_value_2}} == ''Initial value 2'''
- name: Get Welcome Key
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: welcome
  account: kv-store-init-node-1
  outputs:
    welcome_value: result
- name: Assert Welcome Value
  type: assert
  statements:
  - '{{welcome_value}} == ''Welcome to KvStoreInit!'''
- name: Get Initial Length
  type: call
  app: '{{context_id}}'
  method: len
  args: {}
  account: kv-store-init-node-1
  outputs:
    initial_len: result
- name: Assert Initial Length is 3
  type: assert
  statements:
  - '{{initial_len}} == 3'
- name: Get All Initial Entries
  type: call
  app: '{{context_id}}'
  method: entries
  args: {}
  account: kv-store-init-node-1
  outputs:
    initial_entries: result
- name: Assert Initial Entries Contain Default Keys
  type: json_assert
  statements:
  - 'json_subset({{initial_entries}}, {"init_key_1": "Initial value 1", "init_key_2": "Initial value 2",
    "welcome": "Welcome to KvStoreInit!"})'
- name: Set New Value
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: greeting
    value: hello-world
  account: kv-store-init-node-1
- name: Get New Value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: greeting
  account: kv-store-init-node-1
  outputs:
    greeting_value: result
- name: Assert New Value Matches
  type: assert
  statements:
  - '{{greeting_value}} == ''hello-world'''
- name: Update Initial Key 1
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: init_key_1
    value: Updated value 1
  account: kv-store-init-node-1
- name: Get Updated Value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: init_key_1
  account: kv-store-init-node-1
  outputs:
    updated_value: result
- name: Assert Updated Value
  type: assert
  statements:
  - '{{updated_value}} == ''Updated value 1'''
- name: Get Length After Update
  type: call
  app: '{{context_id}}'
  method: len
  args: {}
  account: kv-store-init-node-1
  outputs:
    updated_len: result
- name: Assert Length is 4 (3 initial + 1 new)
  type: assert
  statements:
  - '{{updated_len}} == 4'
- name: Get Result for Existing Key
  type: call
  app: '{{context_id}}'
  method: get_result
  args:
    key: welcome
  account: kv-store-init-node-1
  outputs:
    welcome_result: result
- name: Assert Get Result Works
  type: assert
  statements:
  - '{{welcome_result}} == ''Welcome to KvStoreInit!'''
- name: Get Non-Existent Key
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: non_existent
  account: kv-store-init-node-1
  outputs:
    non_existent_result: result
- name: Assert Non-Existent Key Returns Null
  type: assert
  statements:
  - '{{non_existent_result}} == None'
- name: Remove Initial Key 2
  type: call
  app: '{{context_id}}'
  method: remove
  args:
    key: init_key_2
  account: kv-store-init-node-1
  outputs:
    removed_value: result
- name: Assert Removed Value
  type: assert
  statements:
  - '{{removed_value}} == ''Initial value 2'''
- name: Verify Key 2 is Removed
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: init_key_2
  account: kv-store-init-node-1
  outputs:
    removed_check: result
- name: Assert Removed Key Returns Null
  type: assert
  statements:
  - '{{removed_check}} == None'
- name: Get Length After Removal
  type: call
  app: '{{context_id}}'
  method: len
  args: {}
  account: kv-store-init-node-1
  outputs:
    after_removal_len: result
- name: Assert Length is 3 After Removal
  type: assert
  statements:
  - '{{after_removal_len}} == 3'
- name: Clear All Entries
  type: call
  app: '{{context_id}}'
  method: clear
  args: {}
  account: kv-store-init-node-1
- name: Get Length After Clear
  type: call
  app: '{{context_id}}'
  method: len
  args: {}
  account: kv-store-init-node-1
  outputs:
    after_clear_len: result
- name: Assert Length is 0 After Clear
  type: assert
  statements:
  - '{{after_clear_len}} == 0'
- name: Get Entries After Clear
  type: call
  app: '{{context_id}}'
  method: entries
  args: {}
  account: kv-store-init-node-1
  outputs:
    after_clear_entries: result
- name: Assert Entries Are Empty After Clear
  type: json_assert
  statements:
  - json_equal({{after_clear_entries}}, {})
- name: Set New Value on Node 1 After Clear
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: sync_test
    value: value_from_node1
  account: kv-store-init-node-1
- name: Node 2 Get Synced Value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: sync_test
  account: kv-store-init-node-2
  outputs:
    node2_synced_value: result
- name: Assert Node 2 Synced Value
  type: assert
  statements:
  - '{{node2_synced_value}} == ''value_from_node1'''
- name: Node 2 Set Value
  type: call
  app: '{{context_id}}'
  method: set
  args:
    key: node2_key
    value: value_from_node2
  account: kv-store-init-node-2
- name: Node 1 Get Node 2 Value
  type: call
  app: '{{context_id}}'
  method: get
  args:
    key: node2_key
  account: kv-store-init-node-1
  outputs:
    node1_gets_node2_value: result
- name: Assert Node 1 Sees Node 2 Value
  type: assert
  statements:
  - '{{node1_gets_node2_value}} == ''value_from_node2'''
- name: Node 2 Get All Entries
  type: call
  app: '{{context_id}}'
  method: entries
  args: {}
  account: kv-store-init-node-2
  outputs:
    node2_entries: result
- name: Assert Node 2 Has Both Keys
  type: json_assert
  statements:
  - 'json_subset({{node2_entries}}, {"sync_test": "value_from_node1", "node2_key": "value_from_node2"})'
