# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   login (unknown) x2: checks what the dropped steps did
#   wait_for_sync x4: replication is synchronous: a read sees every committed write
name: Indexed forum across two nodes
description: "Two nodes, two accounts, one forum: a Frozen charter, Moderated<IndexedMap> posts, AuthoredSortedMap\
  \ comments and AuthoredMap votes. Each property below needs a real network to show.\n1. A NODE THAT\
  \ RECEIVED EVERYTHING BY SYNC CAN RUN A THREE-PART QUERY. Node 2\n   never filed a post, so it has no\
  \ index. Its first `board_tag_feed` must\n   build `(board, tags, created_at)` from synced entries,\
  \ and must keep a\n   post that carries the tag but sits in another board out of the result.\n\n2. A\
  \ PEER'S WRITES MOVE THE ANSWER. Node 2 files and pins a post of its own,\n   votes on and comments\
  \ on one of node 1's. Node 1's index was current a\n   moment earlier, and sync then changed the map\
  \ behind its back. Its board\n   counts and pinned strip must reflect node 2's writes, and its own vote\n\
  \   must count node 2's too: each vote is its voter's own entry.\n\n3. THE GATES HOLD ACROSS NODES.\
  \ Node 2 can't pin node 1's post, and node 1\n   can't edit node 2's comment. Both are authored entries,\
  \ owner-stamped and\n   checked by every node that applies a write.\n\n4. LOCAL WRITES KEEP A WARM INDEX\
  \ CURRENT. Node 1 files one more post and\n   finds it at the top of the tag feed straight away.\n\n\
  5. FROZEN AND MODERATED HOLD ACROSS NODES. Node 2 reads the charter node 1\n   froze at init. Node 2\
  \ files spam; node 2 can't moderate node 1's post, and\n   node 1, the founding moderator, removes the\
  \ spam. Node 2 then sees it gone:\n   the removal was signed by a moderator and checked by node 2 against\
  \ the\n   moderators, not by the author.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3700
accounts:
- forum-node-1
- forum-node-2
steps:
- name: Install application on forum-node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/indexed_forum.wasm'
  outputs:
    app_id_bundle: hash
  account: forum-node-1
- type: set
  values:
    app_id: com.calimero.indexed-forum
- name: Create mesh with forum-node-2
  type: create_org
  account: forum-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: forum-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: forum-node-2
  token: '{{_mesh_invite}}'
- name: Create mesh with forum-node-2
  type: deploy
  account: forum-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/indexed_forum.wasm'
  app_name: Create mesh with forum-node-2
  outputs:
    context_id: contextId
- name: Assert the mesh came up
  type: assert
  statements:
  - is_set({{context_id}})
- name: Node 1 files p1 in dev
  type: call
  app: '{{context_id}}'
  method: create_post
  args:
    id: p1
    board: dev
    title: borrow checker tips
    body: ''
    tags:
    - rust
    - wasm
    created_at: 10
  account: forum-node-1
  outputs:
    p1_id: result
- name: Node 1 files p2 in dev
  type: call
  app: '{{context_id}}'
  method: create_post
  args:
    id: p2
    board: dev
    title: async traits at last
    body: ''
    tags:
    - rust
    created_at: 20
  account: forum-node-1
- name: Node 1 files p3 in dev
  type: call
  app: '{{context_id}}'
  method: create_post
  args:
    id: p3
    board: dev
    title: bundler shootout
    body: ''
    tags:
    - js
    created_at: 30
  account: forum-node-1
- name: Node 1 files o1 in ops, tagged rust too
  type: call
  app: '{{context_id}}'
  method: create_post
  args:
    id: o1
    board: ops
    title: rust in the pager rotation
    body: ''
    tags:
    - rust
    created_at: 40
  account: forum-node-1
- name: Node 2 reads dev's rust feed
  type: call
  app: '{{context_id}}'
  method: board_tag_feed
  args:
    board: dev
    tag: rust
    offset: 0
    limit: 10
  account: forum-node-2
  outputs:
    n2_rust: rpc
- name: Assert node 2's rust feed is dev's rust posts only
  type: assert
  statements:
  - contains({{n2_rust}}, "borrow checker tips")
  - contains({{n2_rust}}, "async traits at last")
  - not_contains({{n2_rust}}, "bundler shootout")
  - not_contains({{n2_rust}}, "rust in the pager rotation")
- name: Node 2 counts dev
  type: call
  app: '{{context_id}}'
  method: board_stats
  args:
    board: dev
  account: forum-node-2
  outputs:
    n2_stats: rpc
- name: Assert node 2 counts three dev posts
  type: json_assert
  statements:
  - 'json_equal({{n2_stats}}, {"output": {"posts": 3, "pinned": 0}})'
- name: Node 1 warms its own index
  type: call
  app: '{{context_id}}'
  method: board_stats
  args:
    board: dev
  account: forum-node-1
  outputs:
    n1_stats_before: rpc
- name: Assert node 1 also counts three dev posts
  type: json_assert
  statements:
  - 'json_equal({{n1_stats_before}}, {"output": {"posts": 3, "pinned": 0}})'
- name: Node 2 files a post of its own
  type: call
  app: '{{context_id}}'
  method: create_post
  args:
    id: p5
    board: dev
    title: read before posting
    body: ''
    tags:
    - meta
    created_at: 50
  account: forum-node-2
  outputs:
    p5_id: result
- name: Node 2 pins its own post
  type: call
  app: '{{context_id}}'
  method: pin
  args:
    id: '{{p5_id}}'
    at: 60
  account: forum-node-2
- name: Node 2 upvotes p1
  type: call
  app: '{{context_id}}'
  method: vote
  args:
    post: '{{p1_id}}'
  account: forum-node-2
- name: Node 2 comments on p1
  type: call
  app: '{{context_id}}'
  method: comment
  args:
    post: '{{p1_id}}'
    id: c1
    body: clone less and borrow more
    created_at: 70
  account: forum-node-2
  outputs:
    n2_comment_key: result
- name: Node 1 counts dev again
  type: call
  app: '{{context_id}}'
  method: board_stats
  args:
    board: dev
  account: forum-node-1
  outputs:
    n1_stats_after: rpc
- name: Assert node 1 counts node 2's post and pin
  type: json_assert
  statements:
  - 'json_equal({{n1_stats_after}}, {"output": {"posts": 4, "pinned": 1}})'
- name: Node 1 reads dev's pinned strip
  type: call
  app: '{{context_id}}'
  method: pinned
  args:
    board: dev
  account: forum-node-1
  outputs:
    n1_pinned: rpc
- name: Assert the pinned strip is node 2's post
  type: assert
  statements:
  - contains({{n1_pinned}}, "read before posting")
  - not_contains({{n1_pinned}}, "borrow checker tips")
- name: Node 1 upvotes p1 too
  type: call
  app: '{{context_id}}'
  method: vote
  args:
    post: '{{p1_id}}'
  account: forum-node-1
  outputs:
    n1_votes: rpc
- name: Assert p1 has both votes
  type: json_assert
  statements:
  - 'json_equal({{n1_votes}}, {"output": 2})'
- name: Node 1 reads p1's thread
  type: call
  app: '{{context_id}}'
  method: comments
  args:
    post: '{{p1_id}}'
    offset: 0
    limit: 10
  account: forum-node-1
  outputs:
    n1_thread: rpc
- name: Assert node 1 sees node 2's comment
  type: assert
  statements:
  - contains({{n1_thread}}, "clone less and borrow more")
- name: Node 2 tries to pin node 1's post
  type: call
  app: '{{context_id}}'
  method: pin
  args:
    id: '{{p1_id}}'
    at: 80
  account: forum-node-2
  expected_failure: true
  outputs:
    pin_error: error
- name: Assert the pin was refused
  type: assert
  statements:
  - is_set({{pin_error}})
- name: Node 1 tries to edit node 2's comment
  type: call
  app: '{{context_id}}'
  method: edit_comment
  args:
    key: '{{n2_comment_key}}'
    body: node one was here
  account: forum-node-1
  expected_failure: true
  outputs:
    edit_error: error
- name: Assert the edit was refused
  type: assert
  statements:
  - is_set({{edit_error}})
- name: Node 1 reads p1's thread again
  type: call
  app: '{{context_id}}'
  method: comments
  args:
    post: '{{p1_id}}'
    offset: 0
    limit: 10
  account: forum-node-1
  outputs:
    n1_thread_after: rpc
- name: Assert node 2's comment is untouched
  type: assert
  statements:
  - contains({{n1_thread_after}}, "clone less and borrow more")
  - not_contains({{n1_thread_after}}, "node one was here")
- name: Node 1 files another rust post
  type: call
  app: '{{context_id}}'
  method: create_post
  args:
    id: p6
    board: dev
    title: no_std for fun
    body: ''
    tags:
    - rust
    created_at: 90
  account: forum-node-1
- name: Node 1 reads the newest rust post in dev
  type: call
  app: '{{context_id}}'
  method: board_tag_feed
  args:
    board: dev
    tag: rust
    offset: 0
    limit: 1
  account: forum-node-1
  outputs:
    n1_newest_rust: rpc
- name: Assert the new post is on top, alone
  type: assert
  statements:
  - contains({{n1_newest_rust}}, "no_std for fun")
  - not_contains({{n1_newest_rust}}, "async traits at last")
- name: Node 2 reads the charter node 1 froze at init
  type: call
  app: '{{context_id}}'
  method: charter
  args: {}
  account: forum-node-2
  outputs:
    n2_charter: rpc
- name: Assert the charter synced as written
  type: assert
  statements:
  - contains({{n2_charter}}, "be kind and stay on topic")
- name: Node 2 files spam in dev
  type: call
  app: '{{context_id}}'
  method: create_post
  args:
    id: spam
    board: dev
    title: cheap watches
    body: ''
    tags: []
    created_at: 95
  account: forum-node-2
  outputs:
    spam_id: result
- name: Node 2 tries to moderate node 1's post
  type: call
  app: '{{context_id}}'
  method: moderate_post
  args:
    id: '{{p1_id}}'
  account: forum-node-2
  expected_failure: true
  outputs:
    moderate_error: error
- name: Assert node 2 is not a moderator
  type: assert
  statements:
  - is_set({{moderate_error}})
- name: Node 1 removes the spam as a moderator
  type: call
  app: '{{context_id}}'
  method: moderate_post
  args:
    id: '{{spam_id}}'
  account: forum-node-1
- name: Node 2 reads dev's feed
  type: call
  app: '{{context_id}}'
  method: board_feed
  args:
    board: dev
    offset: 0
    limit: 20
  account: forum-node-2
  outputs:
    n2_dev_after: rpc
- name: Assert the spam is gone on node 2 and node 1's post is not
  type: assert
  statements:
  - not_contains({{n2_dev_after}}, "cheap watches")
  - contains({{n2_dev_after}}, "borrow checker tips")
