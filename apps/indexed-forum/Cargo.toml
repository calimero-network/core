[package]
name = "indexed-forum"
version = "0.1.0"
edition = "2021"
publish = false
description = "A forum on tables with indexes and counts, on the component SDK"

[lib]
crate-type = ["cdylib"]

[dependencies]
calimero-sdk = { path = "../../crates/sdk" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
calimero-sdk = { path = "../../crates/sdk", features = ["testing"] }
calimero-app-build = { path = "../../crates/app-build" }
serde_json = "1"

# Standalone, like the SDK's sample guest: the tests build this crate for wasm32-wasip2.
[workspace]
