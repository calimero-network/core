# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: Group Governance Fuzzy Load Test
description: 'Long-running fuzzy load test that exercises the three-phase governance contract (publish_and_await_ack,
  readiness FSM, key delivery) under mixed traffic. Sets up a 4-node namespace with a group + subgroup,
  runs the fuzzy_test step against group-context kv operations (every data write traverses the governance
  topic for ack collection), then exercises a post-load governance churn round (role updates, add/remove)
  to validate the system can still service governance ops after sustained load.

  Closes the gap between the existing kv-store and kv-store-with-handlers fuzzy tests, which exercise
  data-path churn but never exercise group governance. This test catches regressions in #2237''s three-phase
  contract, KeyDelivery delivery, and the readiness FSM''s coverage of publisher-side / receive-side apply
  paths.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3440
accounts:
- fuzzy-gov-node-1
- fuzzy-gov-node-2
- fuzzy-gov-node-3
- fuzzy-gov-node-4
steps:
- name: Install kv-store-with-handlers app on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_handlers.wasm'
  outputs:
    app_id_bundle: hash
  account: fuzzy-gov-node-1
- type: set
  values:
    app_id: com.calimero.kv-store-with-handlers
- name: Create namespace on node-1
  type: create_org
  org_name: Create namespace on node-1
  outputs:
    namespace_id: orgId
  account: fuzzy-gov-node-1
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: fuzzy-gov-node-1
  outputs:
    invite_node2: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{invite_node2}}'
  account: fuzzy-gov-node-2
- type: whoami
  account: fuzzy-gov-node-2
  outputs:
    identity_node2: publicKey
- name: Invite node-3 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: fuzzy-gov-node-1
  outputs:
    invite_node3: token
- name: Node-3 joins namespace
  type: redeem_invite
  token: '{{invite_node3}}'
  account: fuzzy-gov-node-3
- type: whoami
  account: fuzzy-gov-node-3
  outputs:
    identity_node3: publicKey
- name: Invite node-4 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: fuzzy-gov-node-1
  outputs:
    invite_node4: token
- name: Node-4 joins namespace
  type: redeem_invite
  token: '{{invite_node4}}'
  account: fuzzy-gov-node-4
- type: whoami
  account: fuzzy-gov-node-4
  outputs:
    identity_node4: publicKey
- name: Verify all 4 nodes joined the namespace
  type: assert
  statements:
  - is_set({{namespace_id}})
  - is_set({{identity_node2}})
  - is_set({{identity_node3}})
  - is_set({{identity_node4}})
- name: Create group context
  type: deploy
  account: fuzzy-gov-node-1
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_handlers.wasm'
  app_name: Create group context
  org: '{{namespace_id}}'
  outputs:
    group_ctx_id: contextId
    group_ctx_key_node1: memberPublicKey
- name: Node-2 joins group context
  type: whoami
  account: fuzzy-gov-node-2
  outputs:
    group_ctx_key_node2: publicKey
- name: Node-3 joins group context
  type: whoami
  account: fuzzy-gov-node-3
  outputs:
    group_ctx_key_node3: publicKey
- name: Node-4 joins group context
  type: whoami
  account: fuzzy-gov-node-4
  outputs:
    group_ctx_key_node4: publicKey
- name: Group governance fuzzy load
  type: fuzzy_test
  operations:
  - name: set_and_verify
    weight: 40
    steps:
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: gval_{{uuid}}_{{timestamp}}
      account: '{{random_account}}'
      outputs:
        set_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{set_result}})
    - type: call
      app: '{{group_ctx_id}}'
      method: get
      args:
        key: '{{fuzzy_key}}'
      account: '{{random_account}}'
      outputs:
        get_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{get_result}})
      - contains({{get_result}}, {{fuzzy_value}})
  - name: write_burst
    weight: 25
    steps:
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-1
      outputs:
        w1: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-2
      outputs:
        w2: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-3
      outputs:
        w3: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-4
      outputs:
        w4: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-1
      outputs:
        w5: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-2
      outputs:
        w6: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-3
      outputs:
        w7: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-4
      outputs:
        w8: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-1
      outputs:
        w9: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-2
      outputs:
        w10: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-3
      outputs:
        w11: rpc
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: gkey_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-gov-node-4
      outputs:
        w12: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{w1}})
      - is_set({{w2}})
      - is_set({{w3}})
      - is_set({{w4}})
      - is_set({{w5}})
      - is_set({{w6}})
      - is_set({{w7}})
      - is_set({{w8}})
      - is_set({{w9}})
      - is_set({{w10}})
      - is_set({{w11}})
      - is_set({{w12}})
  - name: random_read
    weight: 15
    steps:
    - type: call
      app: '{{group_ctx_id}}'
      method: get
      args:
        key: gkey_{{random_int(1, 10000)}}
      account: '{{random_account}}'
      outputs:
        get_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{get_result}})
  - name: list_entries
    weight: 10
    steps:
    - type: call
      app: '{{group_ctx_id}}'
      method: entries
      args: {}
      account: '{{random_account}}'
      outputs:
        entries_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{entries_result}})
  - name: cross_node_write_read
    weight: 3
    steps:
    - type: call
      app: '{{group_ctx_id}}'
      method: set
      args:
        key: consistency_{{uuid}}
        value: check_{{timestamp}}
      account: fuzzy-gov-node-1
    - type: wait
      seconds: 2.0
    - type: call
      app: '{{group_ctx_id}}'
      method: get
      args:
        key: '{{fuzzy_key}}'
      account: fuzzy-gov-node-3
      outputs:
        consistency_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - statement: contains({{consistency_result}}, {{fuzzy_value}})
        message: Cross-node value should match the set value
  accounts:
  - fuzzy-gov-node-1
  - fuzzy-gov-node-2
  - fuzzy-gov-node-3
  - fuzzy-gov-node-4
  duration_minutes: 15
  success_threshold: 95.0
  operation_delay_ms: 0
