name: "KV Store with Handlers Fuzzy Load Test"
description: "Long-running fuzzy load test for kv-store-with-handlers application"

# Test configuration
no_docker: false
nuke_on_start: true
nuke_on_end: false

nodes:
  count: 4
  image: ghcr.io/calimero-network/merod:edge-profiling
  prefix: fuzzy-handlers-node
  use_image_entrypoint: true

steps:
  - name: Install KV Store with Handlers on Node 1
    type: install_application
    node: fuzzy-handlers-node-1
    path: dist/com.calimero.kv-store-with-handlers-0.0.0.mpk
    dev: true
    outputs:
      handlers_app_id: applicationId

  - name: Create Mesh for Handlers App
    type: create_mesh
    context_node: fuzzy-handlers-node-1
    application_id: "{{handlers_app_id}}"
    nodes:
      - fuzzy-handlers-node-2
      - fuzzy-handlers-node-3
      - fuzzy-handlers-node-4
    outputs:
      handlers_context_id: contextId
      handlers_node1_key: memberPublicKey

  - name: Wait for handlers mesh formation
    type: wait_for_sync
    context_id: "{{handlers_context_id}}"
    nodes:
      - fuzzy-handlers-node-1
      - fuzzy-handlers-node-2
      - fuzzy-handlers-node-3
      - fuzzy-handlers-node-4
    timeout: 60
    check_interval: 2
    trigger_sync: true

  - name: Verify handlers mesh synced
    type: assert
    statements:
      - "is_set({{handlers_context_id}})"
      - "is_set({{handlers_node1_key}})"
      - "is_set({{public_key_fuzzy-handlers-node-2}})"
      - "is_set({{public_key_fuzzy-handlers-node-3}})"
      - "is_set({{public_key_fuzzy-handlers-node-4}})"

  # Main fuzzy test for kv-store-with-handlers
  # Note: No seed data needed - fuzzy test generates its own data
  #
  # 15 min is the routine baseline used by every CI trigger (push,
  # workflow_run, workflow_dispatch). The CI workflow overrides this to
  # 60 min on the nightly schedule (cron 00:00 UTC) for soak coverage.
  # Override on demand via the workflow_dispatch `duration_override`
  # input. See `.github/workflows/fuzzy-load-test.yml`.
  - name: KV Store with Handlers Fuzzy Load Test
    type: fuzzy_test
    duration_minutes: 15
    context_id: "{{handlers_context_id}}"
    summary_interval_seconds: 60
    # merobox runs one pattern at a time, so any pause here is pure idle
    # time on all four nodes. The load comes from back-to-back calls.
    operation_delay_ms: 0
    success_threshold: 99.0

    nodes:
      - name: fuzzy-handlers-node-1
        executor_key: "{{handlers_node1_key}}"
      - name: fuzzy-handlers-node-2
        executor_key: "{{public_key_fuzzy-handlers-node-2}}"
      - name: fuzzy-handlers-node-3
        executor_key: "{{public_key_fuzzy-handlers-node-3}}"
      - name: fuzzy-handlers-node-4
        executor_key: "{{public_key_fuzzy-handlers-node-4}}"

    # merobox runs one pattern at a time, so throughput is set by how long a
    # pattern takes, not by its weight alone. write_burst carries most of the
    # writes; the 2s cross-node check is kept rare because it is idle time,
    # and still runs about as often per test as before since patterns run
    # far faster.
    operations:
      # Write-and-verify operations (triggers insert/update handlers)
      - name: "set_and_verify_handler"
        weight: 35
        steps:
          # Write on random node - auto-captures key and value.
          # {{random_node}} is picked once per pattern, so the read below hits
          # the node that wrote: read-your-write, no wait needed.
          - type: call
            node: "{{random_node}}"
            context_id: "{{handlers_context_id}}"
            method: set
            args:
              key: "hkey_{{random_int(1, 10000)}}"
              value: "hvalue_{{uuid}}_{{timestamp}}"
            outputs:
              hset_result: result
          - type: assert
            non_blocking: true
            statements:
              - "is_set({{hset_result}})"
          # Read using auto-captured {{fuzzy_key}} - guaranteed to exist
          - type: call
            node: "{{random_node}}"
            context_id: "{{handlers_context_id}}"
            method: get
            args:
              key: "{{fuzzy_key}}"
            outputs:
              hget_result: result
          - type: assert
            non_blocking: true
            statements:
              - "is_set({{hget_result}})"
              - "contains({{hget_result}}, {{fuzzy_value}})"

      # Write burst: 12 back-to-back writes rotating over all four nodes, so
      # every node authors deltas at once and has to merge concurrent heads.
      # Each write gets its own output so a failed call fails its assertion
      # instead of re-checking an earlier write's result.
      - name: "write_burst"
        weight: 25
        steps:
          - &handlers_burst_write
            type: call
            node: fuzzy-handlers-node-1
            context_id: "{{handlers_context_id}}"
            method: set
            args:
              key: "hkey_{{random_int(1, 10000)}}"
              value: "burst_{{uuid}}_{{timestamp}}"
            outputs: { w1: result }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-2, outputs: { w2: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-3, outputs: { w3: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-4, outputs: { w4: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-1, outputs: { w5: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-2, outputs: { w6: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-3, outputs: { w7: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-4, outputs: { w8: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-1, outputs: { w9: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-2, outputs: { w10: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-3, outputs: { w11: result } }
          - { <<: *handlers_burst_write, node: fuzzy-handlers-node-4, outputs: { w12: result } }
          - type: assert
            non_blocking: true
            statements:
              - "is_set({{w1}})"
              - "is_set({{w2}})"
              - "is_set({{w3}})"
              - "is_set({{w4}})"
              - "is_set({{w5}})"
              - "is_set({{w6}})"
              - "is_set({{w7}})"
              - "is_set({{w8}})"
              - "is_set({{w9}})"
              - "is_set({{w10}})"
              - "is_set({{w11}})"
              - "is_set({{w12}})"

      # Pure random reads
      # Tests key-not-found scenarios and random access patterns
      - name: "random_read_handler"
        weight: 15
        steps:
          - type: call
            node: "{{random_node}}"
            context_id: "{{handlers_context_id}}"
            method: get
            args:
              key: "hkey_{{random_int(1, 10000)}}"
            outputs:
              hget_result: result
          # Note: This may fail if key doesn't exist - that's expected and tested
          - type: assert
            non_blocking: true
            statements:
              - "is_set({{hget_result}})"

      # List entries
      - name: "list_handler_entries"
        weight: 8
        steps:
          - type: call
            node: "{{random_node}}"
            context_id: "{{handlers_context_id}}"
            method: entries
            outputs:
              hentries_result: result
          - type: assert
            non_blocking: true
            statements:
              - "is_set({{hentries_result}})"

      # Remove operations (triggers remove handler)
      - name: "remove_with_handler"
        weight: 10
        steps:
          - type: call
            node: "{{random_node}}"
            context_id: "{{handlers_context_id}}"
            method: remove
            args:
              key: "hkey_{{random_int(1, 10000)}}"
            outputs:
              hremove_result: result
          - type: assert
            non_blocking: true
            statements:
              - "is_set({{hremove_result}})"

      # Check handler execution count
      - name: "check_handler_count"
        weight: 4
        steps:
          - type: call
            node: "{{random_node}}"
            context_id: "{{handlers_context_id}}"
            method: get_handler_execution_count
            outputs:
              handler_count: result
          - type: assert
            non_blocking: true
            statements:
              - "is_set({{handler_count}})"

      # Cross-node consistency with handlers: the one pattern that has to
      # wait for propagation, so it is rare by weight but not by count.
      - name: "cross_node_handler_check"
        weight: 3
        steps:
          # Write on one node
          - type: call
            node: fuzzy-handlers-node-2
            context_id: "{{handlers_context_id}}"
            method: set
            args:
              key: "handler_consistency_{{uuid}}"
              value: "hcheck_{{timestamp}}"
          - type: wait
            seconds: 2
          - type: call
            node: fuzzy-handlers-node-4
            context_id: "{{handlers_context_id}}"
            method: get
            args:
              key: "{{fuzzy_key}}"
            outputs:
              hconsistency_result: result
          - type: assert
            non_blocking: true
            statements:
              - statement: "contains({{hconsistency_result}}, {{fuzzy_value}})"
                message: "Cross-node value should match the set value"


# Configuration options
stop_all_nodes: false
restart: false
wait_timeout: 3600 # 1 hour timeout for long-running test

