# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x1: v1 node logs
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: KV Store Fuzzy Load Test
description: Long-running fuzzy load test for kv-store application
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3460
accounts:
- fuzzy-kv-node-1
- fuzzy-kv-node-2
- fuzzy-kv-node-3
- fuzzy-kv-node-4
steps:
- name: Install KV Store Application on Node 1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  outputs:
    kv_app_id_bundle: hash
  account: fuzzy-kv-node-1
- type: set
  values:
    kv_app_id: com.calimero.kv-store
- name: Create Mesh for KV Store
  type: create_org
  account: fuzzy-kv-node-1
  org_name: mesh
  outputs:
    namespace_id: orgId
- type: invite
  account: fuzzy-kv-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: fuzzy-kv-node-2
  token: '{{_mesh_invite}}'
- type: invite
  account: fuzzy-kv-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: fuzzy-kv-node-3
  token: '{{_mesh_invite}}'
- type: invite
  account: fuzzy-kv-node-1
  org: '{{namespace_id}}'
  role: member
  outputs:
    _mesh_invite: token
- type: redeem_invite
  account: fuzzy-kv-node-4
  token: '{{_mesh_invite}}'
- name: Create Mesh for KV Store
  type: deploy
  account: fuzzy-kv-node-1
  org: '{{namespace_id}}'
  wasm: '{{env.CORE_WASM_DIR}}/kv_store.wasm'
  app_name: Create Mesh for KV Store
  outputs:
    kv_context_id: contextId
    node1_key: memberPublicKey
- name: Verify all nodes synced
  type: assert
  statements:
  - is_set({{kv_context_id}})
  - is_set({{node1_key}})
  - is_set({{public_key_fuzzy-kv-node-2}})
  - is_set({{public_key_fuzzy-kv-node-3}})
  - is_set({{public_key_fuzzy-kv-node-4}})
- name: Seed initial data
  type: repeat
  count: 10
  steps:
  - type: call
    app: '{{kv_context_id}}'
    method: set
    args:
      key: initial_key_{{iteration}}
      value: initial_value_{{iteration}}
    account: fuzzy-kv-node-1
- name: KV Store Fuzzy Load Test
  type: fuzzy_test
  operations:
  - name: set_and_verify
    weight: 40
    steps:
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: value_{{uuid}}_{{timestamp}}
      account: '{{random_account}}'
      outputs:
        set_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{set_result}})
    - type: call
      app: '{{kv_context_id}}'
      method: get
      args:
        key: '{{fuzzy_key}}'
      account: '{{random_account}}'
      outputs:
        get_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{get_result}})
      - contains({{get_result}}, {{fuzzy_value}})
  - name: write_burst
    weight: 25
    steps:
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-1
      outputs:
        w1: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-2
      outputs:
        w2: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-3
      outputs:
        w3: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-4
      outputs:
        w4: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-1
      outputs:
        w5: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-2
      outputs:
        w6: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-3
      outputs:
        w7: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-4
      outputs:
        w8: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-1
      outputs:
        w9: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-2
      outputs:
        w10: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-3
      outputs:
        w11: rpc
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: key_{{random_int(1, 10000)}}
        value: burst_{{uuid}}_{{timestamp}}
      account: fuzzy-kv-node-4
      outputs:
        w12: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{w1}})
      - is_set({{w2}})
      - is_set({{w3}})
      - is_set({{w4}})
      - is_set({{w5}})
      - is_set({{w6}})
      - is_set({{w7}})
      - is_set({{w8}})
      - is_set({{w9}})
      - is_set({{w10}})
      - is_set({{w11}})
      - is_set({{w12}})
  - name: random_read
    weight: 15
    steps:
    - type: call
      app: '{{kv_context_id}}'
      method: get
      args:
        key: key_{{random_int(1, 10000)}}
      account: '{{random_account}}'
      outputs:
        get_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{get_result}})
  - name: list_entries
    weight: 10
    steps:
    - type: call
      app: '{{kv_context_id}}'
      method: entries
      args: {}
      account: '{{random_account}}'
      outputs:
        entries_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - is_set({{entries_result}})
  - name: cross_node_write_read
    weight: 3
    steps:
    - type: call
      app: '{{kv_context_id}}'
      method: set
      args:
        key: consistency_{{uuid}}
        value: check_{{timestamp}}
      account: fuzzy-kv-node-1
    - type: wait
      seconds: 2.0
    - type: call
      app: '{{kv_context_id}}'
      method: get
      args:
        key: '{{fuzzy_key}}'
      account: fuzzy-kv-node-3
      outputs:
        consistency_result: rpc
    - type: assert
      non_blocking: true
      statements:
      - statement: contains({{consistency_result}}, {{fuzzy_value}})
        message: Cross-node value should match the set value
  accounts:
  - fuzzy-kv-node-1
  - fuzzy-kv-node-2
  - fuzzy-kv-node-3
  - fuzzy-kv-node-4
  duration_minutes: 15
  success_threshold: 99.0
  operation_delay_ms: 0
- name: Final KV Store entry count check
  type: call
  app: '{{kv_context_id}}'
  method: len
  args: {}
  account: fuzzy-kv-node-1
  outputs:
    final_kv_count: rpc
- name: Log final statistics
  type: assert
  statements:
  - is_set({{final_kv_count}})
