name: 48 - A member that installs only the newest release still replays every rung (2-node)
description: >
  Node 2 joins a v1 context and never activates anything. The admin upgrades
  the namespace v1 -> v2 -> v3, and node 2 installs ONLY v3. The three
  releases share one application id, so node 2's application row now names v3
  while its state is still v1's: the context must keep reporting 1.0.0, and
  its first access must replay the ladder through v2 rather than start at v3.

no_docker: false
nuke_on_start: true
nuke_on_end: false

nodes:
  count: 2
  image: merod:local
  prefix: app-migration-newest-only
  base_port: 10300
  base_rpc_port: 10400

steps:
  - name: Install scenario-pure-bugfix-v1 on node 1
    type: install_application
    node: app-migration-newest-only-1
    path: dist/com.calimero.scenario-pure-bugfix-1.0.0.mpk
    dev: true
    outputs:
      app_v1: applicationId

  - name: Create namespace (v1) on node 1
    type: create_namespace
    node: app-migration-newest-only-1
    application_id: "{{app_v1}}"
    outputs:
      namespace_id: namespaceId

  - name: Create Open subgroup under namespace
    type: create_group_in_namespace
    node: app-migration-newest-only-1
    namespace_id: "{{namespace_id}}"
    group_name: "newest-only-subgroup"
    outputs:
      group_id: groupId

  - name: Mark subgroup as Open
    type: set_subgroup_visibility
    node: app-migration-newest-only-1
    group_id: "{{group_id}}"
    visibility: open

  - name: Create context in subgroup on node 1 (v1)
    type: create_context
    node: app-migration-newest-only-1
    application_id: "{{app_v1}}"
    group_id: "{{group_id}}"
    outputs:
      ctx_id: contextId

  - name: Write v1 item k1=10 on node 1
    type: call
    node: app-migration-newest-only-1
    context_id: "{{ctx_id}}"
    method: add_value
    args:
      key: "k1"
      value: 10

  - name: Create namespace invitation for node 2
    type: create_namespace_invitation
    node: app-migration-newest-only-1
    namespace_id: "{{namespace_id}}"
    outputs:
      namespace_invitation: invitation

  - name: Node 2 joins namespace
    type: join_namespace
    node: app-migration-newest-only-2
    namespace_id: "{{namespace_id}}"
    invitation: "{{namespace_invitation}}"

  - name: Node 2 materialises subgroup membership via inheritance
    type: join_subgroup_inheritance
    node: app-migration-newest-only-2
    group_id: "{{group_id}}"

  - name: Node 2 joins the context
    type: join_context
    node: app-migration-newest-only-2
    context_id: "{{ctx_id}}"

  - name: Wait for v1 state to sync to node 2
    type: wait_for_sync
    context_id: "{{ctx_id}}"
    nodes:
      - app-migration-newest-only-1
      - app-migration-newest-only-2
    timeout: 90
    trigger_sync: true

  - name: Node 2 reports v1 before any upgrade
    type: assert_api_response
    node: app-migration-newest-only-2
    path: /admin-api/contexts/{{ctx_id}}
    match:
      data.applicationVersion: 1.0.0

  - name: Install scenario-pure-bugfix-v2 on node 1
    type: install_application
    node: app-migration-newest-only-1
    path: dist/com.calimero.scenario-pure-bugfix-2.0.0.mpk
    dev: true
    outputs:
      app_v2: applicationId

  - name: Cascade namespace v1 to v2 (initiated by node 1)
    type: upgrade_group
    node: app-migration-newest-only-1
    group_id: "{{namespace_id}}"
    target_application_id: "{{app_v2}}"
    cascade: true

  - name: Install scenario-pure-bugfix-v3 on node 1
    type: install_application
    node: app-migration-newest-only-1
    path: dist/com.calimero.scenario-pure-bugfix-3.0.0.mpk
    dev: true
    outputs:
      app_v3: applicationId

  - name: Cascade namespace v2 to v3 (initiated by node 1)
    type: upgrade_group
    node: app-migration-newest-only-1
    group_id: "{{namespace_id}}"
    target_application_id: "{{app_v3}}"
    cascade: true

  - name: Wait for both cascades to reach node 2
    type: wait
    seconds: 20

  - name: Node 2 installs only v3
    type: install_application
    node: app-migration-newest-only-2
    path: dist/com.calimero.scenario-pure-bugfix-3.0.0.mpk
    dev: true

  - name: Node 2 still reports v1, the release its state is at
    type: assert_api_response
    node: app-migration-newest-only-2
    path: /admin-api/contexts/{{ctx_id}}
    match:
      data.applicationVersion: 1.0.0

  - name: Node 2 first access replays the ladder
    type: call
    node: app-migration-newest-only-2
    context_id: "{{ctx_id}}"
    method: sum_all_values
    outputs:
      sum_after: result

  - name: Assert the fixed sum on node 2
    type: json_assert
    statements:
      - 'json_equal({{sum_after}}, {"output": 10})'

  - name: Assert node 2 replayed both rungs, v1 -> v2 and v2 -> v3
    type: assert_log_present
    nodes:
      - app-migration-newest-only-2
    patterns:
      - "replaying upgrade ladder hop"
    min_matches: 2

  - name: Node 2 reports v3 after the replay
    type: assert_api_response
    node: app-migration-newest-only-2
    path: /admin-api/contexts/{{ctx_id}}
    match:
      data.applicationVersion: 3.0.0

  - name: Delete context
    type: delete_context
    node: app-migration-newest-only-1
    context_id: "{{ctx_id}}"

  - name: Delete subgroup
    type: delete_group
    node: app-migration-newest-only-1
    group_id: "{{group_id}}"

  - name: Delete namespace
    type: delete_namespace
    node: app-migration-newest-only-1
    namespace_id: "{{namespace_id}}"

stop_all_nodes: false
