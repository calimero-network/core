# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_present x2: v1 node logs
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 10 — Scenario "struct to enum" (v1 → v2-struct-to-enum, 2-node)
description: '2-node per-context migration for the struct-to-enum scenario. v1 stores `status: LwwRegister<Status>`
  where `Status` is a struct with `active: bool` + `reason: Option<String>` — a layout that structurally
  allows the domain-impossible state `active = true, reason = Some(_)`. v2 replaces `Status` with a tagged
  enum (`Active` | `Inactive(String)`) that makes the impossible state unrepresentable. `migrate_v1_to_v2`
  reads the legacy struct via a private `LegacyStatus` decoder and maps each v1 value to its equivalent
  v2 variant: `active = true` becomes `Status::Active` (any spurious reason is dropped), `active = false`
  becomes `Status::Inactive(reason)`. Topology: namespace + one Open subgroup + one context in the subgroup.
  Upgrade is per-context `upgrade_group(group=subgroup, target=v2, migrate=migrate_v1_to_v2)`. Cross-node
  assertions prove the rewritten enum shape reaches node 2 via context-sync gossip.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3100
accounts:
- app-migration-struct2enum-1
- app-migration-struct2enum-2
steps:
- name: Install scenario-struct-to-enum-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-struct-to-enum-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-struct2enum-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-struct2enum-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: struct-to-enum-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-struct2enum-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-struct2enum-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-struct2enum-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-struct2enum-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-struct2enum-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-struct2enum-2
- name: Set v1 name
  type: call
  app: '{{ctx_id}}'
  method: set_name
  args:
    name: entity-1
  account: app-migration-struct2enum-1
- name: Set v1 status to inactive with reason
  type: call
  app: '{{ctx_id}}'
  method: set_status_inactive
  args:
    reason: under-maintenance
  account: app-migration-struct2enum-1
- name: Sanity-check v1 state shape on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-struct2enum-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema in place
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "name": "entity-1", "status_active":
    false, "status_reason": "under-maintenance"}})'
- name: Install scenario-struct-to-enum-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-struct-to-enum-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-struct2enum-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (per-context, not cascade)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-struct2enum-1
- name: Wait for upgrade meta to gossip to node 2
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-struct2enum-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-struct2enum-2
  outputs:
    v2_schema_node2: rpc
- name: Assert v2 schema on node 1 (struct collapsed to Inactive variant)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0", "name": "entity-1", "status_kind":
    "inactive", "status_reason": "under-maintenance"}})'
- name: Assert v2 schema on node 2 (same enum shape, proves rewrite reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0", "name": "entity-1", "status_kind":
    "inactive", "status_reason": "under-maintenance"}})'
- name: Flip status to Active under v2 on node 1
  type: call
  app: '{{ctx_id}}'
  method: set_status_active
  args: {}
  account: app-migration-struct2enum-1
- name: Read schema_info after flip on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-struct2enum-1
  outputs:
    v2_schema_active_node1: rpc
- name: Read schema_info after flip on node 2
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-struct2enum-2
  outputs:
    v2_schema_active_node2: rpc
- name: Assert Active variant drops the reason payload on node 1
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_active_node1}}, {"output": {"schema_version": "2.0.0", "name": "entity-1",
    "status_kind": "active", "status_reason": null}})'
- name: Assert Active variant flip round-trips to node 2
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_active_node2}}, {"output": {"schema_version": "2.0.0", "name": "entity-1",
    "status_kind": "active", "status_reason": null}})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-struct2enum-1
