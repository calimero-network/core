name: 47 - Missing releases listed, installed, then activated (v1 -> v2 -> v3, 2-node)
description: >
  A member that missed two upgrades cannot activate: the switch steps through
  every release in between and core never installs one. The member's upgrade
  status names exactly the releases to install, oldest first, the target
  included; once they are installed, activation succeeds and the member's
  context runs the target.

  Node 2 joins on v1 and holds only that release. The admin then upgrades the
  namespace v1 -> v2 -> v3 while node 2 never touches its context.

no_docker: false
nuke_on_start: true
nuke_on_end: false

nodes:
  count: 2
  image: merod:local
  prefix: app-migration-missing
  base_port: 10470
  base_rpc_port: 10570

steps:
  # Phase 1: Install v1 on the ADMIN node only; build namespace + Open
  # subgroup + context (same realistic-distribution shape as scenario 02).
  - name: Install migration-suite-v1 on node 1
    type: install_application
    node: app-migration-missing-1
    path: dist/com.calimero.migration-suite-1.0.0.mpk
    dev: true
    outputs:
      app_v1: applicationId

  - name: Create namespace (v1) on node 1
    type: create_namespace
    node: app-migration-missing-1
    application_id: "{{app_v1}}"
    outputs:
      namespace_id: namespaceId

  - name: Create Open subgroup under namespace
    type: create_group_in_namespace
    node: app-migration-missing-1
    namespace_id: "{{namespace_id}}"
    group_name: "missing-releases-subgroup"
    outputs:
      group_id: groupId

  - name: Mark subgroup as Open
    type: set_subgroup_visibility
    node: app-migration-missing-1
    group_id: "{{group_id}}"
    visibility: open

  - name: Create context in subgroup on node 1 (v1)
    type: create_context
    node: app-migration-missing-1
    application_id: "{{app_v1}}"
    group_id: "{{group_id}}"
    outputs:
      ctx_id: contextId

  # Phase 2: Node 2 joins namespace -> subgroup -> context.
  - name: Create namespace invitation for node 2
    type: create_namespace_invitation
    node: app-migration-missing-1
    namespace_id: "{{namespace_id}}"
    outputs:
      namespace_invitation: invitation

  - name: Node 2 joins namespace
    type: join_namespace
    node: app-migration-missing-2
    namespace_id: "{{namespace_id}}"
    invitation: "{{namespace_invitation}}"

  - name: Node 2 materialises subgroup membership via inheritance
    type: join_subgroup_inheritance
    node: app-migration-missing-2
    group_id: "{{group_id}}"

  - name: Node 2 joins the context
    type: join_context
    node: app-migration-missing-2
    context_id: "{{ctx_id}}"

  - name: Wait for the join to settle
    type: wait_for_sync
    context_id: "{{ctx_id}}"
    nodes:
      - app-migration-missing-1
      - app-migration-missing-2
    timeout: 90
    trigger_sync: true

  - name: Install migration-suite-v2 on node 1
    type: install_application
    node: app-migration-missing-1
    path: dist/com.calimero.migration-suite-2.0.0.mpk
    dev: true
    outputs:
      app_v2: applicationId

  - name: Install migration-suite-v3 on node 1
    type: install_application
    node: app-migration-missing-1
    path: dist/com.calimero.migration-suite-3.0.0.mpk
    dev: true
    outputs:
      app_v3: applicationId

  - name: Cascade the namespace v1 to v2
    type: upgrade_group
    node: app-migration-missing-1
    group_id: "{{namespace_id}}"
    target_application_id: "{{app_v2}}"
    cascade: true

  - name: Cascade the namespace v2 to v3
    type: upgrade_group
    node: app-migration-missing-1
    group_id: "{{namespace_id}}"
    target_application_id: "{{app_v3}}"
    cascade: true

  - name: Wait for both upgrades to reach node 2
    type: wait
    seconds: 20

  # Node 2 holds v1 only: both newer releases are listed, oldest first.
  - name: Node 2 lists the releases it must install
    type: script
    script: workflows/app-migration/upgrade-status.sh
    target: local
    args:
      - app-migration-missing-2
      - "{{namespace_id}}"
      - '(.missingReleases | map(.version)) == ["2.0.0", "3.0.0"] and .missingReleases[0].applicationId == "{{app_v2}}" and .missingReleases[1].applicationId == "{{app_v3}}"'

  - name: Activating before installing is refused as not installed
    type: script
    script: workflows/app-migration/activate-upgrade.sh
    target: local
    args:
      - app-migration-missing-2
      - "{{namespace_id}}"
      - "{}"
      - "404"
      - '.error != null'

  # Installing only the target still leaves the middle release missing.
  - name: Install migration-suite-v3 (the target) on node 2
    type: install_application
    node: app-migration-missing-2
    path: dist/com.calimero.migration-suite-3.0.0.mpk
    dev: true

  - name: Only the middle release is still missing
    type: script
    script: workflows/app-migration/upgrade-status.sh
    target: local
    args:
      - app-migration-missing-2
      - "{{namespace_id}}"
      - '(.missingReleases | map(.version)) == ["2.0.0"]'

  - name: Install migration-suite-v2 on node 2
    type: install_application
    node: app-migration-missing-2
    path: dist/com.calimero.migration-suite-2.0.0.mpk
    dev: true

  - name: Nothing is missing once both are installed
    type: script
    script: workflows/app-migration/upgrade-status.sh
    target: local
    args:
      - app-migration-missing-2
      - "{{namespace_id}}"
      - '.missingReleases == []'

  - name: Node 2 activates the upgrade
    type: script
    script: workflows/app-migration/activate-upgrade.sh
    target: local
    args:
      - app-migration-missing-2
      - "{{namespace_id}}"
      - "from-target"
      - "200"
      - '.data.targetApplicationId == "{{app_v3}}" and .data.failedContexts == []'

  - name: Node 2's context runs the target
    type: call
    node: app-migration-missing-2
    context_id: "{{ctx_id}}"
    method: schema_info
    outputs:
      schema_node2: result

  - name: Assert node 2 runs v3
    type: json_assert
    statements:
      - 'json_subset({{schema_node2}}, {"output": {"schema_version": "3.0.0"}})'

  - name: Assert no deserialization failures anywhere
    type: assert_log_absent
    nodes:
      - app-migration-missing-1
      - app-migration-missing-2
    patterns:
      - "Not all bytes read"
      - "failed to deserialize"

stop_all_nodes: false
