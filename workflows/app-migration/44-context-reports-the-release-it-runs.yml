name: 44 - A context reports the release it runs, not the latest install (2-node)
description: >
  Node 2 joins a v1 context, then installs v2 ahead of the admin's upgrade.
  v1 and v2 share one application id, so the application row now names v2
  while the context still runs v1: GET /admin-api/contexts/{id} must say
  1.0.0. The admin then cascades the namespace to v2 and node 2 activates
  it; from then on the context reports 2.0.0.

no_docker: false
nuke_on_start: true
nuke_on_end: false

nodes:
  count: 2
  image: merod:local
  prefix: app-migration-running
  base_port: 10290
  base_rpc_port: 10390

steps:
  - name: Install scenario-pure-bugfix-v1 on node 1
    type: install_application
    node: app-migration-running-1
    path: dist/com.calimero.scenario-pure-bugfix-1.0.0.mpk
    dev: true
    outputs:
      app_v1: applicationId

  - name: Create namespace (v1) on node 1
    type: create_namespace
    node: app-migration-running-1
    application_id: "{{app_v1}}"
    outputs:
      namespace_id: namespaceId

  - name: Create Open subgroup under namespace
    type: create_group_in_namespace
    node: app-migration-running-1
    namespace_id: "{{namespace_id}}"
    group_name: "running-scenario-subgroup"
    outputs:
      group_id: groupId

  - name: Mark subgroup as Open
    type: set_subgroup_visibility
    node: app-migration-running-1
    group_id: "{{group_id}}"
    visibility: open

  - name: Create context in subgroup on node 1 (v1)
    type: create_context
    node: app-migration-running-1
    application_id: "{{app_v1}}"
    group_id: "{{group_id}}"
    outputs:
      ctx_id: contextId

  - name: Write v1 item k1=10 on node 1
    type: call
    node: app-migration-running-1
    context_id: "{{ctx_id}}"
    method: add_value
    args:
      key: "k1"
      value: 10

  - name: Create namespace invitation for node 2
    type: create_namespace_invitation
    node: app-migration-running-1
    namespace_id: "{{namespace_id}}"
    outputs:
      namespace_invitation: invitation

  - name: Node 2 joins namespace
    type: join_namespace
    node: app-migration-running-2
    namespace_id: "{{namespace_id}}"
    invitation: "{{namespace_invitation}}"

  - name: Node 2 materialises subgroup membership via inheritance
    type: join_subgroup_inheritance
    node: app-migration-running-2
    group_id: "{{group_id}}"

  - name: Node 2 joins the context
    type: join_context
    node: app-migration-running-2
    context_id: "{{ctx_id}}"

  - name: Wait for v1 state to sync to node 2
    type: wait_for_sync
    context_id: "{{ctx_id}}"
    nodes:
      - app-migration-running-1
      - app-migration-running-2
    timeout: 90
    trigger_sync: true

  - name: Node 2 reports v1 before any upgrade
    type: assert_api_response
    node: app-migration-running-2
    path: /admin-api/contexts/{{ctx_id}}
    match:
      data.applicationVersion: 1.0.0

  # Installed before the admin upgrades, so nothing can switch the context yet.
  - name: Node 2 installs v2 ahead of the upgrade
    type: install_application
    node: app-migration-running-2
    path: dist/com.calimero.scenario-pure-bugfix-2.0.0.mpk
    dev: true
    outputs:
      app_v2: applicationId

  - name: Both releases share one application id
    type: json_assert
    statements:
      - 'equal("{{app_v2}}", "{{app_v1}}")'

  - name: Node 2 still reports v1 after installing v2
    type: assert_api_response
    node: app-migration-running-2
    path: /admin-api/contexts/{{ctx_id}}
    match:
      data.applicationVersion: 1.0.0

  # v1's sum is off by one: 11 proves v1 is what runs.
  - name: Node 2 runs v1
    type: call
    node: app-migration-running-2
    context_id: "{{ctx_id}}"
    method: sum_all_values
    outputs:
      sum_before: result

  - name: Assert the off-by-one v1 sum on node 2
    type: json_assert
    statements:
      - 'json_equal({{sum_before}}, {"output": 11})'

  - name: Install scenario-pure-bugfix-v2 on node 1
    type: install_application
    node: app-migration-running-1
    path: dist/com.calimero.scenario-pure-bugfix-2.0.0.mpk
    dev: true

  - name: Cascade namespace v1 to v2 (initiated by node 1)
    type: upgrade_group
    node: app-migration-running-1
    group_id: "{{namespace_id}}"
    target_application_id: "{{app_v2}}"
    cascade: true

  - name: Wait for the cascade to reach node 2
    type: wait
    seconds: 15

  - name: Node 2 activates the upgrade
    type: script
    script: workflows/app-migration/activate-upgrade.sh
    target: local
    args:
      - app-migration-running-2
      - "{{namespace_id}}"
      - "from-target"
      - "200"
      - '.data.targetApplicationId == "{{app_v2}}" and .data.switchedContexts <= 1 and .data.failedContexts == []'

  - name: Node 2 reports v2 after activating
    type: assert_api_response
    node: app-migration-running-2
    path: /admin-api/contexts/{{ctx_id}}
    match:
      data.applicationVersion: 2.0.0

  - name: Node 2 runs the fixed release
    type: call
    node: app-migration-running-2
    context_id: "{{ctx_id}}"
    method: sum_all_values
    outputs:
      sum_after: result

  - name: Assert the fixed sum on node 2
    type: json_assert
    statements:
      - 'json_equal({{sum_after}}, {"output": 10})'

  - name: Delete context
    type: delete_context
    node: app-migration-running-1
    context_id: "{{ctx_id}}"

  - name: Delete subgroup
    type: delete_group
    node: app-migration-running-1
    group_id: "{{group_id}}"

  - name: Delete namespace
    type: delete_namespace
    node: app-migration-running-1
    namespace_id: "{{namespace_id}}"

stop_all_nodes: false
