# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_api_response x2: v1 admin API
#   assert_log_present x2: v1 node logs
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   get_group_info output (v1 group's application) x4: checks what the dropped steps did
#   get_migration_status output (v1 per-member rollup) x7: checks what the dropped steps did
#   json_assert statement on a dropped step's output x11: checks what the dropped steps did
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
# Migration note: kept although the converter counts the checks it drops against it:
#   v1's log checks and the reads of each group's pinned application (a team pins none:
#   each app has its own release). The cascade's subject, the app in the namespace's
#   subgroup migrated and read so by both members, is what the schema_info reads check
name: 01 - Namespace-cascade migration (v1 → v2, 2-node, cascade=true)
description: "Multi-node namespace-rooted cascade upgrade. Node 1 (admin) creates a namespace + one descendant\
  \ subgroup + one context, invites node 2, writes v1 state, waits for node 2 to catch up, then issues\
  \ ONE upgrade_group(cascade=true) against the namespace root. Asserts on BOTH nodes:\n  - cascade fan-out\
  \ reaches BOTH the namespace root AND the\n    descendant subgroup (target_application_id flips to v2)\n\
  \  - the descendant context's state migrates (v1 fields preserved,\n    v2-only field readable)\n  -\
  \ node 2, which never installs v2, still names the target package and\n    version on the namespace\
  \ and group endpoints before it runs the app\n\nRegression guard for the full bytecode_id derivation\
  \ triangle:\n  - `create_group::handle` (originator-side derivation)\n  - `group_created::apply` (remote-peer\
  \ parent inheritance)\n  - `create_group_invitation` + `join_group` (invitation-side\n    bootstrap\
  \ of joiner's local meta - without this, node 2's\n    local subgroup bytecode_id would seed to [0u8;\
  \ 32] and the\n    cascade predicate would silently skip the subtree on node 2,\n    diverging from\
  \ node 1)\n\nRealistic: no pre-cascade alignment, no double-upgrade workaround. Goes straight from create_namespace\
  \ → create_group_in_namespace → invite node 2 → cascade.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3010
accounts:
- app-migration-cascade-1
- app-migration-cascade-2
steps:
- name: Install migration-suite-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-cascade-1
- name: Create namespace on node 1 (anchors app_v1)
  type: create_org
  org_name: Create namespace on node 1 (anchors app_v1)
  outputs:
    namespace_id: orgId
  account: app-migration-cascade-1
- name: Create descendant Open subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: cascade-target-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-cascade-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-cascade-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-cascade-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-cascade-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-cascade-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-cascade-2
- name: Node 1 writes v1 state (description)
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: set-before-cascade
  account: app-migration-cascade-1
- name: Node 1 increments counter (v1)
  type: call
  app: '{{ctx_id}}'
  method: increment_counter
  args: {}
  account: app-migration-cascade-1
- name: Node 1 reads v1 schema (sanity)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-cascade-1
  outputs:
    v1_schema_node1: rpc
- name: Assert v1 schema on node 1
  type: json_assert
  statements:
  - 'json_subset({{v1_schema_node1}}, {"output": {"schema_version": "1.0.0", "description": "set-before-cascade",
    "counter": "1"}})'
- name: Node 2 reads v1 schema (catch-up verification)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-cascade-2
  outputs:
    v1_schema_node2: rpc
- name: Assert node 2 caught up to v1 state
  type: json_assert
  statements:
  - 'json_subset({{v1_schema_node2}}, {"output": {"schema_version": "1.0.0", "description": "set-before-cascade",
    "counter": "1"}})'
- name: Install migration-suite-v2-add-field on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-cascade-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Cascade namespace v1 → v2 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-cascade-1
- name: Wait for cascade + migration to apply + log flush on both nodes
  type: wait
  seconds: 15.0
- name: Node 1 reads namespace root info
  type: team_list
  org: '{{namespace_id}}'
  account: app-migration-cascade-1
- name: Node 1 reads descendant subgroup info
  type: team_get
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-cascade-1
- name: Node 2 reads namespace root info
  type: team_list
  org: '{{namespace_id}}'
  account: app-migration-cascade-2
- name: Node 2 reads descendant subgroup info
  type: team_get
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-cascade-2
- name: Node 1 reads post-migration schema_info
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-cascade-1
  outputs:
    v2_schema_node1: rpc
- name: Node 2 reads post-migration schema_info (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-cascade-2
  outputs:
    v2_schema_node2: rpc
- name: Read the migration-status rollup on node 1 (admin)
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-cascade-1
  outputs:
    mig_failed: failed
- name: Assert each member migrated its own state, with no residue left
  type: json_assert
  statements:
  - equal({{mig_failed}}, 0)
- name: Assert v2 schema on node 1 (v1 data preserved + notes seeded)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"description": "set-before-cascade", "counter": "1"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"notes": "added in v2"}})'
- name: Assert v2 schema on node 2 (same shape, proves cascade reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"description": "set-before-cascade", "counter": "1"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"notes": "added in v2"}})'
- name: Node 1 calls v2-only setter (set_notes)
  type: call
  app: '{{ctx_id}}'
  method: set_notes
  args:
    notes: written-post-cascade-by-node1
  account: app-migration-cascade-1
- name: Node 2 reads notes via v2 getter
  type: call
  app: '{{ctx_id}}'
  method: get_notes
  args: {}
  account: app-migration-cascade-2
  outputs:
    notes_after_node2: rpc
- name: Assert v2-only write reached node 2
  type: json_assert
  statements:
  - 'json_equal({{notes_after_node2}}, {"output": "written-post-cascade-by-node1"})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-cascade-1
