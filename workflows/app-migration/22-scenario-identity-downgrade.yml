# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_log_absent x1: v1 node logs
#   assert_log_present x1: v1 node logs
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
# Migration note: converter bug: v1's log checks are dropped, though the refusal carries
#   the reason
# Migration note: the port tests its subject again once the dropped checks are restored
name: 22 — Scenario "identity downgrade" negative-path gate (L1, 1-node)
description: 'Single-node negative-path test for the L1 identity-downgrade gate. Node 1 installs scenario-identity-downgrade-v1
  (state: wiki AuthoredMap), creates a namespace + Open subgroup + context, and then attempts to upgrade
  to v2 (wiki UnorderedMap) with a migrate_v1_to_v2 method. The emitter-side gate in upgrade_group.rs
  (verify_no_identity_downgrade) MUST refuse this upgrade before any group op is emitted — the upgrade_group
  RPC returns an error, and the step is expected to fail. Two trailing assertions confirm the gate fired
  for the right reason (assert_log_present for "identity downgrade forbidden") and that the migration
  body never executed (assert_log_absent for "Executing migration").

  Acts as the regression guard for #2587: if the L1 gate is accidentally removed or short-circuited, the
  upgrade_group call succeeds → step fails (expected_failure not satisfied) → workflow fails.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3220
accounts:
- app-migration-iddowngrade-1
steps:
- name: Install scenario-identity-downgrade-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-identity-downgrade-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-iddowngrade-1
- name: Create namespace on node 1
  type: create_org
  org_name: Create namespace on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-iddowngrade-1
- name: Create Open subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: iddowngrade-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-iddowngrade-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-iddowngrade-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-iddowngrade-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Write a wiki entry (v1)
  type: call
  app: '{{ctx_id}}'
  method: put
  args:
    key: hello
    value: world
  account: app-migration-iddowngrade-1
- name: Install scenario-identity-downgrade-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-identity-downgrade-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-iddowngrade-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Attempt identity-downgrade upgrade (L1 gate must refuse it)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-iddowngrade-1
  expected_failure: true
  outputs:
    downgrade_refusal: error
- name: The refusal is the identity-downgrade gate's
  type: assert
  statements:
  - contains("{{downgrade_refusal}}", "identity downgrade forbidden")
- name: The migration never ran (the v1 entry still reads back)
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: hello
  expect: world
  account: app-migration-iddowngrade-1
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-iddowngrade-1
