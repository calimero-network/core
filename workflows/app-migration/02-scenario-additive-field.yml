# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   get_migration_status output (v1 per-member rollup) x7: checks what the dropped steps did
#   json_assert statement on a dropped step's output x7: checks what the dropped steps did
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 02 - Scenario "additive field" (v1 → v2-add-field, 2-node)
description: '2-node per-context migration for the additive-field scenario. v1 → v2-add-field adds a `notes:
  LwwRegister<String>` to the state struct; `migrate_v1_to_v2` preserves every v1 field and seeds the
  new `notes` field. Topology: namespace + one Open subgroup + one context in the subgroup. Upgrade is
  `upgrade_group(group=subgroup, target=v2)` - per-context (cascade=false), not namespace-cascade (that''s
  `01`); the node resolves `migrate_v1_to_v2` from the target bundle''s embedded ABI. Acts as the additive
  row of the per-scenario matrix.

  Negative assertion: before the upgrade, the v2-only setter `set_notes` must NOT be callable (the binary
  doesn''t export it under v1). After the upgrade it must be callable and round-trip a value from node
  1 to node 2.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3020
accounts:
- app-migration-additive-1
- app-migration-additive-2
steps:
- name: Install migration-suite-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-additive-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-additive-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: additive-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-additive-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-additive-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-additive-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-additive-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-additive-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-additive-2
- name: Write v1 state (description + counter + item)
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: additive-scenario
  account: app-migration-additive-1
- name: Increment counter twice (v1)
  type: call
  app: '{{ctx_id}}'
  method: increment_counter
  args: {}
  account: app-migration-additive-1
- name: Increment counter again (v1)
  type: call
  app: '{{ctx_id}}'
  method: increment_counter
  args: {}
  account: app-migration-additive-1
- name: Write item to v1 map
  type: call
  app: '{{ctx_id}}'
  method: set_item
  args:
    key: k1
    value: v1-value
  account: app-migration-additive-1
- name: Sanity-check v1 state shape on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-additive-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema in place
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "description": "additive-scenario",
    "counter": "2"}})'
- name: Negative - set_notes is not exported by v1
  type: call
  app: '{{ctx_id}}'
  method: set_notes
  args:
    notes: should-fail-pre-upgrade
  account: app-migration-additive-1
  expected_failure: true
- name: Install migration-suite-v2-add-field on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-additive-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (per-context, not cascade)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-additive-1
- name: Wait for upgrade meta to gossip to node 2
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-additive-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-additive-2
  outputs:
    v2_schema_node2: rpc
- name: Read the migration-status rollup on node 1 (admin)
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-additive-1
  outputs:
    mig_failed: failed
- name: Assert each member migrated its own state, with no residue left
  type: json_assert
  statements:
  - equal({{mig_failed}}, 0)
- name: Assert v2 schema on node 1 (additive field seeded, v1 data preserved)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"description": "additive-scenario", "counter": "2"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"notes": "added in v2"}})'
- name: Assert v2 schema on node 2 (same shape, proves migration reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"description": "additive-scenario", "counter": "2"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"notes": "added in v2"}})'
- name: Assert v1 item map preserved through migration (node 1)
  type: call
  app: '{{ctx_id}}'
  method: get_item
  args:
    key: k1
  account: app-migration-additive-1
  outputs:
    preserved_item: rpc
- name: Assert preserved v1 item value
  type: json_assert
  statements:
  - 'json_equal({{preserved_item}}, {"output": "v1-value"})'
- name: Node 1 calls v2-only setter set_notes
  type: call
  app: '{{ctx_id}}'
  method: set_notes
  args:
    notes: additive-scenario-post-migration
  account: app-migration-additive-1
- name: Node 2 reads notes back via v2-only get_notes
  type: call
  app: '{{ctx_id}}'
  method: get_notes
  args: {}
  account: app-migration-additive-2
  outputs:
    notes_after_node2: rpc
- name: Assert v2-only round-trip reached node 2
  type: json_assert
  statements:
  - 'json_equal({{notes_after_node2}}, {"output": "additive-scenario-post-migration"})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-additive-1
