name: 46 - An app host on a node that enforces no token refuses the app API (1-node)
description: >
  A node in proxy auth mode without `proxy_identity` enforces no token itself,
  so an app host must not pass `/jsonrpc` through: it answers 403 with a
  plain-text body. An app origin on the node's own host is refused with 403,
  and a loopback dev page is not.

auth_mode: proxy

no_docker: false
nuke_on_start: true
nuke_on_end: false

nodes:
  count: 1
  image: merod:local
  prefix: app-migration-frontend-proxy
  base_port: 9690
  base_rpc_port: 9790

steps:
  - name: Install release 1.0.0
    type: install_application
    node: app-migration-frontend-proxy-1
    path: dist/com.calimero.frontend-release-1.0.0.mpk
    dev: true
    outputs:
      app_id: applicationId

  - name: Check the app API is refused
    type: script
    script: workflows/app-migration/frontend-serving.sh
    target: local
    args:
      - app-migration-frontend-proxy-1
      - "{{app_id}}"
      - "1.0.0"
      - "1.0.0"
      - proxy

stop_all_nodes: true
