# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   get_migration_status output (v1 per-member rollup) x7: checks what the dropped steps did
#   json_assert statement on a dropped step's output x7: checks what the dropped steps did
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 09 - Scenario "crdt-native" (v1 → v2-add-crdt-collection, 2-node)
description: '2-node per-context migration for the CRDT-collection-typed field scenario. v1 → v2 adds
  a `tags: Vector<LwwRegister<String>>` to the state struct. Unlike scalar field addition, the `Vector`
  type has its own internal field-name handle, so borsh deserialize of v1 bytes under v2''s schema would
  fail with EOF when it tries to read the missing `tags` field. The `migrate_v1_to_v2` handler reconstructs
  the v2 state, carrying over the v1 `items` and `title`, and SEEDS the new `tags` Vector during migrate
  from the sorted v1 item keys. Topology: namespace + one Open subgroup + one context in the subgroup.
  Upgrade is `upgrade_group(group=subgroup, target=v2, migrate=migrate_v1_to_v2)` - per-context (cascade=false).
  Acts as the CRDT-collection-add row of the per-scenario matrix.

  Cross-node determinism: a `Vector` populated INSIDE a migrate is the hard case - `push` mints `Id::random()`
  element ids on the live path, but migrate re-runs independently on every node and emits no delta, so
  random ids would diverge and double up on the next sync. The SDK re-keys migrate-seeded Vector elements
  by append index (and zeroes the per-element LwwRegister metadata via merge mode). The discriminating
  assertion is `tag_count` AFTER a cross-node sync (Phase 7d): with divergent ids the union would inflate
  the count; identical ids dedupe.

  Negative assertion: before the upgrade, the v2-only method `push_tag` must NOT be callable (the binary
  doesn''t export it under v1). After the upgrade Phase 7d pushes more tags from node 1 and reads them
  back via v2-only `tag_count` / `get_tag` on node 2 to prove convergence.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3090
accounts:
- app-migration-crdt-1
- app-migration-crdt-2
steps:
- name: Install scenario-crdt-native-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-crdt-native-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-crdt-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-crdt-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: crdt-native-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-crdt-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-crdt-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-crdt-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-crdt-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-crdt-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-crdt-2
- name: Write v1 title
  type: call
  app: '{{ctx_id}}'
  method: set_title
  args:
    title: crdt-scenario-doc
  account: app-migration-crdt-1
- name: Write item k1 to v1 map
  type: call
  app: '{{ctx_id}}'
  method: set_item
  args:
    key: k1
    value: v1
  account: app-migration-crdt-1
- name: Write item k2 to v1 map
  type: call
  app: '{{ctx_id}}'
  method: set_item
  args:
    key: k2
    value: v2
  account: app-migration-crdt-1
- name: Write item k3 to v1 map
  type: call
  app: '{{ctx_id}}'
  method: set_item
  args:
    key: k3
    value: v3
  account: app-migration-crdt-1
- name: Sanity-check v1 state shape on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-crdt-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema in place
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "title": "crdt-scenario-doc", "tag_count":
    0}})'
- name: Negative - push_tag is not exported by v1
  type: call
  app: '{{ctx_id}}'
  method: push_tag
  args:
    tag: should-fail-pre-upgrade
  account: app-migration-crdt-1
  expected_failure: true
- name: Install scenario-crdt-native-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-crdt-native-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-crdt-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (per-context, not cascade)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-crdt-1
- name: Wait for upgrade + migration to apply + log flush
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-crdt-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-crdt-2
  outputs:
    v2_schema_node2: rpc
- name: Read the migration-status rollup on node 1 (admin)
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-crdt-1
  outputs:
    mig_failed: failed
- name: Assert each member migrated its own state, with no residue left
  type: json_assert
  statements:
  - equal({{mig_failed}}, 0)
- name: Assert v2 schema on node 1 (tags seeded during migrate from 3 item keys, v1 data preserved)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"title": "crdt-scenario-doc"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"tag_count": 3}})'
- name: Assert v2 schema on node 2 (same shape + same seeded tag_count, proves migration reached node
    2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"title": "crdt-scenario-doc"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"tag_count": 3}})'
- name: Assert v1 item map preserved through migration (node 1)
  type: call
  app: '{{ctx_id}}'
  method: get_item
  args:
    key: k1
  account: app-migration-crdt-1
  outputs:
    preserved_item: rpc
- name: Assert preserved v1 item value
  type: json_assert
  statements:
  - 'json_equal({{preserved_item}}, {"output": "v1"})'
- name: Read seeded tag(0) on node 1
  type: call
  app: '{{ctx_id}}'
  method: get_tag
  args:
    index: 0
  account: app-migration-crdt-1
  outputs:
    seed0_node1: rpc
- name: Read seeded tag(0) on node 2
  type: call
  app: '{{ctx_id}}'
  method: get_tag
  args:
    index: 0
  account: app-migration-crdt-2
  outputs:
    seed0_node2: rpc
- name: Assert seeded tag(0) identical across nodes (migrate seeded same first key)
  type: json_assert
  statements:
  - 'json_equal({{seed0_node1}}, {"output": "k1"})'
  - 'json_equal({{seed0_node2}}, {"output": "k1"})'
- name: Read seeded tag(2) on node 2 (last sorted key)
  type: call
  app: '{{ctx_id}}'
  method: get_tag
  args:
    index: 2
  account: app-migration-crdt-2
  outputs:
    seed2_node2: rpc
- name: Assert seeded tag(2) value on node 2
  type: json_assert
  statements:
  - 'json_equal({{seed2_node2}}, {"output": "k3"})'
- name: Push first tag (v2-only) on node 1
  type: call
  app: '{{ctx_id}}'
  method: push_tag
  args:
    tag: first-tag
  account: app-migration-crdt-1
- name: Push second tag (v2-only) on node 1
  type: call
  app: '{{ctx_id}}'
  method: push_tag
  args:
    tag: second-tag
  account: app-migration-crdt-1
- name: Read tag_count after pushes on node 1
  type: call
  app: '{{ctx_id}}'
  method: tag_count
  args: {}
  account: app-migration-crdt-1
  outputs:
    tag_count_after_node1: rpc
- name: Assert five tags present on node 1 (3 seeded + 2 pushed)
  type: json_assert
  statements:
  - 'json_equal({{tag_count_after_node1}}, {"output": 5})'
- name: Read tag(0) on node 1 (seeded element survives the appends)
  type: call
  app: '{{ctx_id}}'
  method: get_tag
  args:
    index: 0
  account: app-migration-crdt-1
  outputs:
    tag_zero_node1: rpc
- name: Assert tag(0) is the seeded k1 on node 1
  type: json_assert
  statements:
  - 'json_equal({{tag_zero_node1}}, {"output": "k1"})'
- name: Read tag_count after pushes on node 2 (id-keyed union must dedupe to 5)
  type: call
  app: '{{ctx_id}}'
  method: tag_count
  args: {}
  account: app-migration-crdt-2
  outputs:
    tag_count_after_node2: rpc
- name: Assert five tags on node 2 - divergent migrate ids would inflate this
  type: json_assert
  statements:
  - 'json_equal({{tag_count_after_node2}}, {"output": 5})'
- name: Read tag(0) on node 2 (seeded k1 converged, not duplicated)
  type: call
  app: '{{ctx_id}}'
  method: get_tag
  args:
    index: 0
  account: app-migration-crdt-2
  outputs:
    tag_zero_node2: rpc
- name: Assert tag(0) is the seeded k1 on node 2
  type: json_assert
  statements:
  - 'json_equal({{tag_zero_node2}}, {"output": "k1"})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-crdt-1
