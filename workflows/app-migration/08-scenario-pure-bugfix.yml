# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 08 — Scenario "pure bugfix" (v1 → v2, no state change, 2-node)
description: '2-node per-context upgrade for the pure-bugfix scenario. v2 has the byte-identical borsh
  layout of v1 (same field names, types, order) — only the body of an exported method (`sum_all_values`)
  differs: v1 has an off-by-one bug that adds 1 to the total, v2 fixes it. Because the state struct is
  unchanged, no `#[app::migrate]` is needed and the ABI declares no edge; existing v1 state bytes decode
  as v2 directly.

  Topology: namespace + one Open subgroup + one context in the subgroup. Upgrade is `upgrade_group(group=subgroup,
  target=v2)` — per-context (cascade=false), no migrate handler. Acts as the "code-only" row of the per-scenario
  matrix.

  Phase 7d invokes `sum_all_values` on node 2 (the buggy-now-fixed method) and asserts the correct 60
  — proves the v2 code is in effect on the receiver too, not just the upgrade emitter.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3080
accounts:
- app-migration-bugfix-1
- app-migration-bugfix-2
steps:
- name: Install scenario-pure-bugfix-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-pure-bugfix-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-bugfix-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-bugfix-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: pure-bugfix-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-bugfix-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-bugfix-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-bugfix-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-bugfix-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-bugfix-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-bugfix-2
- name: Write v1 item k1=10
  type: call
  app: '{{ctx_id}}'
  method: add_value
  args:
    key: k1
    value: 10
  account: app-migration-bugfix-1
- name: Write v1 item k2=20
  type: call
  app: '{{ctx_id}}'
  method: add_value
  args:
    key: k2
    value: 20
  account: app-migration-bugfix-1
- name: Write v1 item k3=30
  type: call
  app: '{{ctx_id}}'
  method: add_value
  args:
    key: k3
    value: 30
  account: app-migration-bugfix-1
- name: Call sum_all_values (v1, buggy)
  type: call
  app: '{{ctx_id}}'
  method: sum_all_values
  args: {}
  account: app-migration-bugfix-1
  outputs:
    v1_sum: rpc
- name: Assert v1 sum reflects the off-by-one bug (10+20+30+1 = 61)
  type: json_assert
  statements:
  - 'json_equal({{v1_sum}}, {"output": 61})'
- name: Sanity-check v1 schema_info on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-bugfix-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema in place
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "last_sum": 61}})'
- name: Install scenario-pure-bugfix-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-pure-bugfix-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-bugfix-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (per-context, no migrate handler)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-bugfix-1
- name: Wait for upgrade to apply + log flush
  type: wait
  seconds: 15.0
- name: Read post-upgrade schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-bugfix-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-upgrade schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-bugfix-2
  outputs:
    v2_schema_node2: rpc
- name: Assert v2 schema on node 1 (version bumped, last_sum preserved from v1)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0", "last_sum": 61}})'
- name: Assert v2 schema on node 2 (same shape, proves upgrade reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0", "last_sum": 61}})'
- name: Call sum_all_values (v2, bug fixed) on node 1
  type: call
  app: '{{ctx_id}}'
  method: sum_all_values
  args: {}
  account: app-migration-bugfix-1
  outputs:
    v2_sum: rpc
- name: Assert v2 sum no longer has the off-by-one (10+20+30 = 60)
  type: json_assert
  statements:
  - 'json_equal({{v2_sum}}, {"output": 60})'
- name: Get preserved item k1
  type: call
  app: '{{ctx_id}}'
  method: get_value
  args:
    key: k1
  account: app-migration-bugfix-1
  outputs:
    preserved_k1: rpc
- name: Assert preserved k1 = 10
  type: json_assert
  statements:
  - 'json_equal({{preserved_k1}}, {"output": 10})'
- name: Get preserved item k2
  type: call
  app: '{{ctx_id}}'
  method: get_value
  args:
    key: k2
  account: app-migration-bugfix-1
  outputs:
    preserved_k2: rpc
- name: Assert preserved k2 = 20
  type: json_assert
  statements:
  - 'json_equal({{preserved_k2}}, {"output": 20})'
- name: Get preserved item k3
  type: call
  app: '{{ctx_id}}'
  method: get_value
  args:
    key: k3
  account: app-migration-bugfix-1
  outputs:
    preserved_k3: rpc
- name: Assert preserved k3 = 30
  type: json_assert
  statements:
  - 'json_equal({{preserved_k3}}, {"output": 30})'
- name: Call sum_all_values (v2, bug fixed) on node 2
  type: call
  app: '{{ctx_id}}'
  method: sum_all_values
  args: {}
  account: app-migration-bugfix-2
  outputs:
    v2_sum_node2: rpc
- name: Assert v2 fix in effect on node 2 (10+20+30 = 60)
  type: json_assert
  statements:
  - 'json_equal({{v2_sum_node2}}, {"output": 60})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-bugfix-1
