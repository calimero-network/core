# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_present x2: v1 node logs
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 18 — Scenario "shared-storage" (v1 → v2 carry-through, 2-node)
description: '2-node per-context migration for a `SharedStorage`-typed field — a single shared value gated
  by a writer-set. v1 holds `doc: SharedStorage<LwwRegister<String>>` whose writer-set is seeded at init
  with the creating node (node 1). Node 1 writes the shared value; node 2 is a member but NOT a writer
  (it can read, not write). v2 carries the shared value AND its writer-set THROUGH the migrate and adds
  a `migration_note` register.

  Discriminating assertion: after BOTH nodes self-migrate, the shared value reads identically on each
  node and `writer_count` is still 1 — proving the value, the writer-set, and the read-gating round-trip
  through migrate and stay convergent cross-node.

  Per-context upgrade on the subgroup (cascade=false).

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3180
accounts:
- app-migration-shared-1
- app-migration-shared-2
steps:
- name: Install scenario-shared-storage-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-shared-storage-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-shared-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-shared-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: shared-storage-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-shared-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-shared-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-shared-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-shared-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-shared-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-shared-2
- name: Node 1 sets title
  type: call
  app: '{{ctx_id}}'
  method: set_title
  args:
    title: shared-doc
  account: app-migration-shared-1
- name: Node 1 writes the shared value
  type: call
  app: '{{ctx_id}}'
  method: set_doc
  args:
    value: the-shared-value
  account: app-migration-shared-1
- name: Node 2 can read the shared value (pre-migrate sanity)
  type: call
  app: '{{ctx_id}}'
  method: get_doc
  args: {}
  account: app-migration-shared-2
  outputs:
    doc_pre_node2: rpc
- name: Assert pre-migrate read on node 2
  type: json_assert
  statements:
  - 'json_equal({{doc_pre_node2}}, {"output": "the-shared-value"})'
- name: Assert v1 schema on node 1 (one writer)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-shared-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema shape
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "title": "shared-doc", "writer_count":
    1}})'
- name: Negative — migration_note is not exported by v1
  type: call
  app: '{{ctx_id}}'
  method: migration_note
  args: {}
  account: app-migration-shared-1
  expected_failure: true
- name: Install scenario-shared-storage-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-shared-storage-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-shared-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (per-context)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-shared-1
- name: Wait for upgrade + migration to apply + log flush
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-shared-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-shared-2
  outputs:
    v2_schema_node2: rpc
- name: Assert v2 schema on node 1 (writer-set preserved + note seeded)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0", "title": "shared-doc", "writer_count":
    1, "migration_note": "migrated-v1-to-v2"}})'
- name: Assert v2 schema on node 2 (same shape — migration reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0", "title": "shared-doc", "writer_count":
    1, "migration_note": "migrated-v1-to-v2"}})'
- name: Read shared value on node 1 (post-migrate)
  type: call
  app: '{{ctx_id}}'
  method: get_doc
  args: {}
  account: app-migration-shared-1
  outputs:
    doc_post_node1: rpc
- name: Read shared value on node 2 (post-migrate)
  type: call
  app: '{{ctx_id}}'
  method: get_doc
  args: {}
  account: app-migration-shared-2
  outputs:
    doc_post_node2: rpc
- name: Assert shared value + writer-set survived migrate on BOTH nodes
  type: json_assert
  statements:
  - 'json_equal({{doc_post_node1}}, {"output": "the-shared-value"})'
  - 'json_equal({{doc_post_node2}}, {"output": "the-shared-value"})'
- name: Node 2 (non-writer) attempts a write — must be rejected
  type: call
  app: '{{ctx_id}}'
  method: set_doc
  args:
    value: intruder-value
  account: app-migration-shared-2
  expected_failure: true
- name: Node 1 confirms the shared value is unchanged after the rejected write
  type: call
  app: '{{ctx_id}}'
  method: get_doc
  args: {}
  account: app-migration-shared-1
  outputs:
    doc_after_reject_node1: rpc
- name: Assert the rejected write did not mutate the shared value
  type: json_assert
  statements:
  - 'json_equal({{doc_after_reject_node1}}, {"output": "the-shared-value"})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-shared-1
