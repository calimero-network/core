# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_log_present x2: v1 node logs
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 20 — Scenario "unordered-set" (v1 → v2 build-during-migrate, 2-node)
description: '2-node per-context migration that REBUILDS a collection during the migrate. v1 holds `tags:
  UnorderedSet<String>`. v2''s migrate reads the v1 tags and builds a NEW set with every tag UPPER-CASED
  — a real content-rewrite performed inside `#[app::migrate]`, not a carry-through.

  This is the convergent build-during-migrate case for a plain collection: `UnorderedSet` element ids
  are `compute_id(set_id, value)` (content-derived, no executor identity), so every node applying the
  SAME transform over the SAME old set produces a byte-identical set — even though migrate runs independently
  per node and emits no sync delta.

  Discriminating assertion: after BOTH nodes self-migrate, the UPPER-CASED tags are present and the original
  lower-cased tags are gone, identically on each node (membership + count converge), proving the rebuilt
  set is deterministic cross-node.

  Per-context upgrade on the subgroup (cascade=false).

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3200
accounts:
- app-migration-uset-1
- app-migration-uset-2
steps:
- name: Install scenario-unordered-set-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-unordered-set-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-uset-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-uset-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: unordered-set-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-uset-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-uset-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-uset-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-uset-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-uset-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-uset-2
- name: Write v1 title
  type: call
  app: '{{ctx_id}}'
  method: set_title
  args:
    title: tag-set
  account: app-migration-uset-1
- name: Add tag "alpha"
  type: call
  app: '{{ctx_id}}'
  method: add_tag
  args:
    tag: alpha
  account: app-migration-uset-1
- name: Add tag "beta"
  type: call
  app: '{{ctx_id}}'
  method: add_tag
  args:
    tag: beta
  account: app-migration-uset-1
- name: Assert v1 schema on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-uset-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema shape
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "title": "tag-set", "tag_count":
    2}})'
- name: Negative — migration_note is not exported by v1
  type: call
  app: '{{ctx_id}}'
  method: migration_note
  args: {}
  account: app-migration-uset-1
  expected_failure: true
- name: Install scenario-unordered-set-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-unordered-set-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-uset-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (per-context)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-uset-1
- name: Wait for upgrade + migration to apply + log flush
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-uset-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-uset-2
  outputs:
    v2_schema_node2: rpc
- name: Assert v2 schema on node 1 (count preserved + note seeded)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0", "title": "tag-set", "tag_count":
    2, "migration_note": "migrated-v1-to-v2"}})'
- name: Assert v2 schema on node 2 (same shape — migration reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0", "title": "tag-set", "tag_count":
    2, "migration_note": "migrated-v1-to-v2"}})'
- name: node 1 — has "ALPHA" (transformed)?
  type: call
  app: '{{ctx_id}}'
  method: has_tag
  args:
    tag: ALPHA
  account: app-migration-uset-1
  outputs:
    has_upper_node1: rpc
- name: node 2 — has "ALPHA" (transformed)?
  type: call
  app: '{{ctx_id}}'
  method: has_tag
  args:
    tag: ALPHA
  account: app-migration-uset-2
  outputs:
    has_upper_node2: rpc
- name: node 1 — has "alpha" (original, should be gone)?
  type: call
  app: '{{ctx_id}}'
  method: has_tag
  args:
    tag: alpha
  account: app-migration-uset-1
  outputs:
    has_lower_node1: rpc
- name: node 2 — has "alpha" (original, should be gone)?
  type: call
  app: '{{ctx_id}}'
  method: has_tag
  args:
    tag: alpha
  account: app-migration-uset-2
  outputs:
    has_lower_node2: rpc
- name: Assert the rebuilt set converged cross-node (transformed in, original out)
  type: json_assert
  statements:
  - 'json_equal({{has_upper_node1}}, {"output": true})'
  - 'json_equal({{has_upper_node2}}, {"output": true})'
  - 'json_equal({{has_lower_node1}}, {"output": false})'
  - 'json_equal({{has_lower_node2}}, {"output": false})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-uset-1
