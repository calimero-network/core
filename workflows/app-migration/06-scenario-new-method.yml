# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 06 — Scenario "new method" (v1 → v2-new-method, no migrate, 2-node)
description: '2-node per-context upgrade for the new-method scenario. v1 → v2-new-method adds a new exported
  method (`clear_items`) while keeping the borsh state layout BYTE-IDENTICAL (same field names, same types,
  same order). Because the layout is unchanged, no `#[app::migrate]` is needed — the v2 binary deserializes
  the v1 state bytes directly. Topology: namespace + one Open subgroup + one context in the subgroup.
  Upgrade is `upgrade_group(group=subgroup, target=v2)`; the node resolves from the embedded ABI (no edge
  declared).

  Negative assertion: before the upgrade, the v2-only method `clear_items` must NOT be callable (the binary
  doesn''t export it under v1). After the upgrade it must be callable on BOTH nodes and drain the preserved
  item map; Phase 7d exercises it on node 1 then reads schema_info on node 2 to prove the v2 method +
  post-clear state convergence reached node 2.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3060
accounts:
- app-migration-newmethod-1
- app-migration-newmethod-2
steps:
- name: Install scenario-new-method-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-new-method-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-newmethod-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-newmethod-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: new-method-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-newmethod-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-newmethod-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-newmethod-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-newmethod-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-newmethod-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-newmethod-2
- name: Write v1 item k1
  type: call
  app: '{{ctx_id}}'
  method: set_item
  args:
    key: k1
    value: v1
  account: app-migration-newmethod-1
- name: Write v1 item k2
  type: call
  app: '{{ctx_id}}'
  method: set_item
  args:
    key: k2
    value: v2
  account: app-migration-newmethod-1
- name: Increment counter (v1)
  type: call
  app: '{{ctx_id}}'
  method: increment_counter
  args: {}
  account: app-migration-newmethod-1
- name: Increment counter again (v1)
  type: call
  app: '{{ctx_id}}'
  method: increment_counter
  args: {}
  account: app-migration-newmethod-1
- name: Sanity-check v1 state shape on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-newmethod-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema in place
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "items_len": 2}})'
- name: Negative — clear_items is not exported by v1
  type: call
  app: '{{ctx_id}}'
  method: clear_items
  args: {}
  account: app-migration-newmethod-1
  expected_failure: true
- name: Install scenario-new-method-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-new-method-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-newmethod-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (no migrate; layout unchanged)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-newmethod-1
- name: Wait for upgrade to apply + log flush
  type: wait
  seconds: 15.0
- name: Read post-upgrade schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-newmethod-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-upgrade schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-newmethod-2
  outputs:
    v2_schema_node2: rpc
- name: Assert v2 schema on node 1 (version bumped, v1 data preserved byte-identical)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0", "items_len": 2}})'
- name: Assert v2 schema on node 2 (same shape, proves upgrade reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0", "items_len": 2}})'
- name: Assert v1 item map preserved under v2 (node 1)
  type: call
  app: '{{ctx_id}}'
  method: get_item
  args:
    key: k1
  account: app-migration-newmethod-1
  outputs:
    preserved_item: rpc
- name: Assert preserved v1 item value
  type: json_assert
  statements:
  - 'json_equal({{preserved_item}}, {"output": "v1"})'
- name: v2-only clear_items now callable on node 1
  type: call
  app: '{{ctx_id}}'
  method: clear_items
  args: {}
  account: app-migration-newmethod-1
  outputs:
    cleared_count: rpc
- name: Assert clear_items returned 2
  type: json_assert
  statements:
  - 'json_equal({{cleared_count}}, {"output": 2})'
- name: Read schema_info after clear on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-newmethod-1
  outputs:
    v2_schema_after_clear_node1: rpc
- name: Assert items map drained on node 1
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_after_clear_node1}}, {"output": {"schema_version": "2.0.0", "items_len":
    0}})'
- name: Read schema_info after clear on node 2
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-newmethod-2
  outputs:
    v2_schema_after_clear_node2: rpc
- name: Assert items map drained on node 2 (v2-only clear reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_after_clear_node2}}, {"output": {"schema_version": "2.0.0", "items_len":
    0}})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-newmethod-1
