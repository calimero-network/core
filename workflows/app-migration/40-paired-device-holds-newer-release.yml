# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   node_identity output accountNamespaceId (v1 device key) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: 40 — A paired device that already holds a newer release runs the namespace's own
description: 'Node 1 creates a namespace on migration-suite 1.0.0 and writes into a context. Node 2 already
  has migration-suite 2.0.0 installed, the same package and so the same application id, and is then paired
  into node 1''s account, as a laptop joining a desktop does. Node 2 must run the release the group names
  and read node 1''s state.

  The paired device learns the group''s target from `ContextRegistered`, which carries the release''s
  registry coordinates. Needs the http lane: dht fetches by blob id and never reads coordinates.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3350
accounts:
- paired-newer-release-1
- paired-newer-release-2
steps:
- name: Install migration-suite 1.0.0 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: paired-newer-release-1
- name: Install migration-suite 2.0.0 on node 2, before it is paired
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: paired-newer-release-2
- name: Both releases share one application id
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Create namespace on node 1
  type: create_org
  org_name: Create namespace on node 1
  outputs:
    namespace_id: orgId
  account: paired-newer-release-1
- name: Create a subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: paired-newer-release-channel
  join: invite
  outputs:
    group_id: teamId
  account: paired-newer-release-1
- name: Create a context in the subgroup on node 1
  type: deploy
  account: paired-newer-release-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create a context in the subgroup on node 1
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Node 1 writes state
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: written-on-1.0.0
  account: paired-newer-release-1
- name: What node 1 speaks as
  type: whoami
  outputs:
    root_key: publicKey
  account: paired-newer-release-1
- name: Pair node 2 into node 1's account, naming only the account namespace
  type: add_device
  account: paired-newer-release-1
  device: paired-newer-release-2
- name: Node 2 reads node 1's state
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: paired-newer-release-2
  outputs:
    schema_node2: rpc
- name: Node 2 ran 1.0.0, the release the group names
  type: json_assert
  statements:
  - 'json_subset({{schema_node2}}, {"output": {"schema_version": "1.0.0", "description": "written-on-1.0.0"}})'
