# Migrated from this file's v1 workflow by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   get_migration_status output (v1 per-member rollup) x7: checks what the dropped steps did
#   json_assert statement on a dropped step's output x7: checks what the dropped steps did
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 12 - Scenario "field remove with archive" (v1 → v2-archive, 2-node)
description: '2-node per-context migration for the field-remove-with-archive scenario. v1 carries a `legacy_note:
  LwwRegister<String>` that v2 drops from the active schema - but the migration ARCHIVES the v1 value
  into a new `archived_legacy: UnorderedMap<String, LwwRegister<String>>` keyed by "latest", so data isn''t
  lost (it just moves out of the active schema into an explicit archive sibling). This differs from `03-scenario-remove-field`,
  which drops the v1 value outright. Topology: namespace + one Open subgroup + one context in the subgroup.
  Upgrade is `upgrade_group(group=subgroup, target=v2, migrate=migrate_v1_to_v2)` - per-context (cascade=false).

  Bug-2 cross-node guard: node 2 reads the new `archived_legacy` map via `get_archived("latest")` to prove
  the migration''s storage commit (the `ContextStorage::commit()` after WASM migrate) plus context-sync
  gossip both propagate the freshly inserted UnorderedMap entry, not just the static fields.

  Negative assertions: after the upgrade, the v1-only methods `set_legacy_note` and `get_legacy_note`
  must NOT be callable (the v2 binary doesn''t export them).

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3120
accounts:
- app-migration-archive-1
- app-migration-archive-2
steps:
- name: Install scenario-field-remove-archive-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-field-remove-archive-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-archive-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-archive-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: archive-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-archive-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-archive-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-archive-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-archive-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-archive-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-archive-2
- name: Set v1 name
  type: call
  app: '{{ctx_id}}'
  method: set_name
  args:
    name: contract-A
  account: app-migration-archive-1
- name: Set v1 legacy_note (will be archived in v2)
  type: call
  app: '{{ctx_id}}'
  method: set_legacy_note
  args:
    note: legacy-data-do-not-discard
  account: app-migration-archive-1
- name: Bump counter (v1, 1/3)
  type: call
  app: '{{ctx_id}}'
  method: bump_counter
  args: {}
  account: app-migration-archive-1
- name: Bump counter (v1, 2/3)
  type: call
  app: '{{ctx_id}}'
  method: bump_counter
  args: {}
  account: app-migration-archive-1
- name: Bump counter (v1, 3/3)
  type: call
  app: '{{ctx_id}}'
  method: bump_counter
  args: {}
  account: app-migration-archive-1
- name: Sanity-check v1 state shape on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-archive-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema in place
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "name": "contract-A", "legacy_note":
    "legacy-data-do-not-discard", "counter": 3}})'
- name: Install scenario-field-remove-archive-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-field-remove-archive-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-archive-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (per-context, not cascade)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-archive-1
- name: Wait for upgrade meta to gossip to node 2
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-archive-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-archive-2
  outputs:
    v2_schema_node2: rpc
- name: Read the migration-status rollup on node 1 (admin)
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-archive-1
  outputs:
    mig_failed: failed
- name: Assert each member migrated its own state, with no residue left
  type: json_assert
  statements:
  - equal({{mig_failed}}, 0)
- name: Assert v2 schema on node 1 (legacy archived, name + counter preserved)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"name": "contract-A", "counter": 3}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"archived_latest": "legacy-data-do-not-discard"}})'
- name: Assert v2 schema on node 2 (bug-2 guard - archive map reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"name": "contract-A", "counter": 3}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"archived_latest": "legacy-data-do-not-discard"}})'
- name: Read archived legacy value via v2 get_archived on node 1
  type: call
  app: '{{ctx_id}}'
  method: get_archived
  args:
    key: latest
  account: app-migration-archive-1
  outputs:
    archived_value_node1: rpc
- name: Read archived legacy value via v2 get_archived on node 2
  type: call
  app: '{{ctx_id}}'
  method: get_archived
  args:
    key: latest
  account: app-migration-archive-2
  outputs:
    archived_value_node2: rpc
- name: Assert archived value carried v1 legacy_note on node 1
  type: json_assert
  statements:
  - 'json_equal({{archived_value_node1}}, {"output": "legacy-data-do-not-discard"})'
- name: Assert archived value round-trips to node 2 (bug-2 storage-commit + sync guard)
  type: json_assert
  statements:
  - 'json_equal({{archived_value_node2}}, {"output": "legacy-data-do-not-discard"})'
- name: Negative - set_legacy_note (v1) is gone in v2
  type: call
  app: '{{ctx_id}}'
  method: set_legacy_note
  args:
    note: should-fail-post-upgrade
  account: app-migration-archive-1
  expected_failure: true
- name: Negative - get_legacy_note (v1) is gone in v2
  type: call
  app: '{{ctx_id}}'
  method: get_legacy_note
  args: {}
  account: app-migration-archive-1
  expected_failure: true
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-archive-1
