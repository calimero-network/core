# Migrated from this file's v1 workflow by `merobox cloud port`.
# Each of the original scenario's nodes is an account here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no counterpart in this node):
#   assert_log_absent x2: v1 node logs
#   assert_log_present x4: v1 node logs
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# Fixed in the migration (converter bugs): a cascade upgrade_group
# upgrades every app in the namespace's teams; of get_migration_status
# only the outputs that mean the same here are kept.
name: 32 - One-tap migrate_my_entries (node-log validated)
description: "The explicit, one-signature \"migrate my authored data\" flow, on top of the 6c owner-driven\
  \ convert. After a namespace cascades v1 → v2, each owner's identity-gated AuthoredMap notes are carried\
  \ through but stay stamped at the v1 schema (1) - below the v2 target (2) - until re-signed. Instead\
  \ of waiting for an organic per-entry edit, each owner calls the SDK-macro-generated `migrate_my_entries()`\
  \ export ONCE; it sweeps every note that owner owns and is still below target, re-writing each through\
  \ the owner-driven convert (re-stamp + re-sign on the monotonic nonce), and returns {converted, remaining}.\n\
  Discriminating assertions:\n  - PRE-convert: each carried note reports note_schema_version == 1 (carried,\n\
  \    not yet converted) - proving migrate alone does NOT convert authored data.\n  - The one-tap call\
  \ is OWNER-SCOPED: node 1's call converts only its 2 notes\n    (converted == 2), node 2's only its\
  \ 1 (converted == 1); neither touches\n    the other's. remaining == 0 after each owner's single call.\n\
  \  - POST-convert: every note reports note_schema_version == 2 on BOTH nodes\n    (converged), and values\
  \ are preserved.\n  - The 6c per-entry re-stamp branch fired (assert_log_present), the owner\n    gate\
  \ never tripped (assert_log_absent \"Cannot change owner\"), and no\n    converted delta was silently\
  \ dropped by the schema fence.\n  - IDEMPOTENT: a second migrate_my_entries() on node 1 returns converted\
  \ == 0.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3280
accounts:
- app-migration-ux-1
- app-migration-ux-2
steps:
- name: Install scenario-authored-migrate-ux-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-authored-migrate-ux-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-ux-1
- name: Create namespace on node 1 (anchors app_v1)
  type: create_org
  org_name: Create namespace on node 1 (anchors app_v1)
  outputs:
    namespace_id: orgId
  account: app-migration-ux-1
- name: Create descendant Open subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: authored-ux-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-ux-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-ux-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-ux-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-ux-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-ux-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-ux-2
- name: Node 1 writes its first note
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    key: n1-a
    text: node1-a-v1
  account: app-migration-ux-1
- name: Node 1 writes its second note
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    key: n1-b
    text: node1-b-v1
  account: app-migration-ux-1
- name: Node 2 writes its own note
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    key: n2-a
    text: node2-a-v1
  account: app-migration-ux-2
- name: Read v1 schema on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-ux-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema shape (3 identity-gated notes)
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "note_count": 3}})'
- name: Install scenario-authored-migrate-ux-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-authored-migrate-ux-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-ux-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Cascade namespace v1 → v2 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-ux-1
- name: Wait for cascade op to gossip + apply on both nodes
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-ux-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-ux-2
  outputs:
    v2_schema_node2: rpc
- name: Assert v2 schema on node 1 (all 3 notes carried through migrate)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0", "note_count": 3}})'
- name: Read node 1's own note schema_version BEFORE convert
  type: call
  app: '{{ctx_id}}'
  method: note_schema_version
  args:
    key: n1-a
  account: app-migration-ux-1
  outputs:
    pre_convert_n1a: rpc
- name: Assert node 1's note is still at schema 1 before convert
  type: json_assert
  statements:
  - 'json_equal({{pre_convert_n1a}}, {"output": 1})'
- name: Node 1 one-tap migrate_my_entries
  type: call
  app: '{{ctx_id}}'
  method: migrate_my_entries
  args: {}
  account: app-migration-ux-1
  outputs:
    convert_node1: rpc
- name: Node 2 one-tap migrate_my_entries
  type: call
  app: '{{ctx_id}}'
  method: migrate_my_entries
  args: {}
  account: app-migration-ux-2
  outputs:
    convert_node2: rpc
- name: Assert node 1 converted exactly its 2 notes, none left
  type: json_assert
  statements:
  - 'json_equal({{convert_node1}}, {"output": {"converted": 2, "remaining": 0}})'
- name: Assert node 2 converted exactly its 1 note, none left
  type: json_assert
  statements:
  - 'json_equal({{convert_node2}}, {"output": {"converted": 1, "remaining": 0}})'
- name: Read node 1's own note schema_version immediately after its convert
  type: call
  app: '{{ctx_id}}'
  method: note_schema_version
  args:
    key: n1-a
  account: app-migration-ux-1
  outputs:
    local_n1a: rpc
- name: Read node 2's own note schema_version immediately after its convert
  type: call
  app: '{{ctx_id}}'
  method: note_schema_version
  args:
    key: n2-a
  account: app-migration-ux-2
  outputs:
    local_n2a: rpc
- name: Assert each owner's own note persisted at schema 2 (convert landed)
  type: json_assert
  statements:
  - 'json_equal({{local_n1a}}, {"output": 2})'
  - 'json_equal({{local_n2a}}, {"output": 2})'
- name: Node 1 writes a barrier note after its convert
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    key: n1-barrier
    text: node1-post-convert-barrier
  account: app-migration-ux-1
- name: Node 2 writes a barrier note after its convert
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    key: n2-barrier
    text: node2-post-convert-barrier
  account: app-migration-ux-2
- name: Read node 1's note schema_version AFTER convert (node 1)
  type: call
  app: '{{ctx_id}}'
  method: note_schema_version
  args:
    key: n1-a
  account: app-migration-ux-1
  outputs:
    post_convert_n1a: rpc
- name: Read node 1's note schema_version from node 2 (converged)
  type: call
  app: '{{ctx_id}}'
  method: note_schema_version
  args:
    key: n1-a
  account: app-migration-ux-2
  outputs:
    post_convert_n1a_node2: rpc
- name: Read node 2's note schema_version from node 1 (converged)
  type: call
  app: '{{ctx_id}}'
  method: note_schema_version
  args:
    key: n2-a
  account: app-migration-ux-1
  outputs:
    post_convert_n2a_node1: rpc
- name: Assert all notes converged at schema 2 across both nodes
  type: json_assert
  statements:
  - 'json_equal({{post_convert_n1a}}, {"output": 2})'
  - 'json_equal({{post_convert_n1a_node2}}, {"output": 2})'
  - 'json_equal({{post_convert_n2a_node1}}, {"output": 2})'
- name: Read node 1's converted note value from node 2 (value preserved)
  type: call
  app: '{{ctx_id}}'
  method: note
  args:
    key: n1-a
  account: app-migration-ux-2
  outputs:
    value_n1a_node2: rpc
- name: Assert the converted note value is preserved cross-node
  type: json_assert
  statements:
  - 'json_equal({{value_n1a_node2}}, {"output": "node1-a-v1"})'
- name: Node 1 calls migrate_my_entries again (idempotent)
  type: call
  app: '{{ctx_id}}'
  method: migrate_my_entries
  args: {}
  account: app-migration-ux-1
  outputs:
    convert_node1_again: rpc
- name: Assert the second one-tap converted nothing
  type: json_assert
  statements:
  - 'json_equal({{convert_node1_again}}, {"output": {"converted": 0, "remaining": 0}})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-ux-1
