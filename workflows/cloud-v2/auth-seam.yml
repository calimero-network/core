# Ported from auth-seam.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   script x1: scripts drive v1 node RPC URLs
name: Auth seam — client-token e2e
description: 'Proves a client token minted the way the auth frontend mints it (root login -> POST /admin/client-key
  with the permission strings mero-react demands) can call the routes the SDK uses. This is the seam that
  was untested when 0.11.0-rc.9 shipped scope enforcement: minted tokens 403''d on every route and every
  app looped back to login (calimero-network/auth-frontend#33).

  The assertions live in scripts/e2e-auth-seam.sh (login, mint, per-route status checks with the client
  token, the pinned namespace-403 gap, and the app-id-scoped regression shape). The script needs raw HTTP
  with a specific token per request, which the step vocabulary doesn''t cover — hence a script step. Companion
  in-process pin: crates/auth/tests/client_token_contract.rs.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3490
accounts:
- auth-seam-1
not_applicable: the port never runs the app and keeps none of v1's checks
steps: []
