# Ported from 46-frontend-proxy-mode.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   script x1: scripts drive v1 node RPC URLs
name: 46 - An app host on a node that enforces no token refuses the app API (1-node)
description: 'A node in proxy auth mode without `proxy_identity` enforces no token itself, so an app host
  must not pass `/jsonrpc` through: it answers 403 with a plain-text body, as does every admin route,
  and its login page is sent to the node''s own origin with a 302. An app origin on the node''s own host
  is refused with 403, and a loopback dev page is not.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3410
accounts:
- app-migration-frontend-proxy-1
not_applicable: the port never runs the app and keeps none of v1's checks
steps:
- name: Install release 1.0.0
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.frontend-release-1.0.0.mpk'
  outputs:
    app_id: package
    app_id_version: version
  account: app-migration-frontend-proxy-1
