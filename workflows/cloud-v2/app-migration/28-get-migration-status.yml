# Ported from 28-get-migration-status.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_api_response x1: v1 admin API
#   assert_log_absent x1: v1 node logs
#   assert_log_present x1: v1 node logs
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   disconnect_node (unknown) x1: checks what the dropped steps did
#   get_migration_status output (v1 per-member rollup) x14: checks what the dropped steps did
#   json_assert statement on a dropped step's output x14: checks what the dropped steps did
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 28 - get_migration_status rollup
description: "Migration-status visibility across a 2-node namespace, validated against the admin rollup\
  \ itself.\nCompletion visibility is ephemeral signed TTL gossip, NOT replicated governance state: each\
  \ node periodically publishes a signed `NamespaceTopicMsg::MigrationHeartbeat` carrying its loaded schema_version\
  \ and local residue counts; peers verify the Ed25519 signature AND cohort membership, then upsert it\
  \ into a 60s-TTL cache. The admin route `GET /groups/:namespace_id/migration-status` rolls the freshest\
  \ heartbeat per pinned-cohort member into `all_migrated` - which flips true ONLY when EVERY member reports\
  \ `schema_version >= target && residue == 0`. A member with no fresh heartbeat is `unknown` and keeps\
  \ `all_migrated = false` (no false green). Observability only - never a gate.\nThis scenario drives\
  \ a migration across the 2-node namespace and reads the rollup the heartbeats feed, at both of its edges:\n\
  \n  - While both members are online and converged at v2, every cohort row is\n    populated from a fresh\
  \ heartbeat. Node 2's row can only be non-unknown if\n    node 2 EMITTED and node 1 INGESTED past the\
  \ signature/membership gate, so\n    emit, cache and the drop path are asserted through their state\n\
  \    consequence rather than through log lines.\n  - When node 2 goes offline its heartbeats stop arriving\
  \ at node 1; with no\n    fresh heartbeat its cohort row ages out of the TTL window and the rollup\n\
  \    reports it `unknown`, keeping `all_migrated = false` - the no-false-green\n    contract. `fleetCompletedAt`\
  \ is durable and must NOT follow it back down.\n\nThe rollup's own arithmetic is additionally unit-covered\
  \ by unknown_member_blocks_all_migrated / cohort_pinned_ignores_post_expand_joiner / all_migrated_true_only_when_every_pinned_member_v2_residue0.\n\
  Because migration_v2 defaults ON, the heartbeat emit + ingest run natively - no merobox feature flag\
  \ is needed.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3240
accounts:
- app-migration-mstatus-1
- app-migration-mstatus-2
not_applicable: the port keeps 4 of v1's 22 checks; the rest checked what has no release-v2 counterpart
steps:
- name: Install migration-suite-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-mstatus-1
- name: Create namespace on node 1 (anchors app_v1)
  type: create_org
  org_name: Create namespace on node 1 (anchors app_v1)
  outputs:
    namespace_id: orgId
  account: app-migration-mstatus-1
- name: Create descendant Open subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: migration-status-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-mstatus-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-mstatus-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-mstatus-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-mstatus-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-mstatus-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-mstatus-2
- name: Node 1 writes v1 state (description)
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: set-before-cascade
  account: app-migration-mstatus-1
- name: Install migration-suite-v2-add-field on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-mstatus-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Cascade namespace v1 → v2 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-mstatus-1
- name: Wait for cascade op to gossip + apply on both nodes
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-mstatus-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-mstatus-2
  outputs:
    v2_schema_node2: rpc
- name: Assert both nodes reached v2 (cohort is converged → rollup can go green)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0"}})'
- name: Settle for heartbeat emit + cross-node ingest (> emit interval)
  type: wait
  seconds: 40.0
- name: Read the migration-status rollup on node 1 (admin)
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-mstatus-1
  outputs:
    ms_failed: failed
- name: Assert both cohort rows converged at the target ABI state version
  type: json_assert
  statements:
  - equal({{ms_failed}}, 0)
- name: Wait beyond the heartbeat TTL so node 2's row goes stale (unknown)
  type: wait
  seconds: 75.0
- name: Read the rollup on node 1 after node 2 goes dark
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-mstatus-1
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-mstatus-1
