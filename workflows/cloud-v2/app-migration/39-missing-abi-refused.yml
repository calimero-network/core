# Ported from 39-missing-abi-refused.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_present x1: v1 node logs
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 39 - Missing target ABI refuses the upgrade (L0 evidence gate, 1-node)
description: 'Single-node negative-path test for the missing-ABI upgrade refusal (core#3285). Node 1 installs
  migration-suite-v1 (which embeds a `calimero_abi_v1` state schema), creates a namespace + Open subgroup
  + context, and writes v1 state. It then attempts to upgrade to an UNEMBEDDED v2 build (the `com.calimero.migration-suite-noabi`
  bundle, whose wasm carries no `calimero_abi_v1` section - bundled with `cargo mero bundle --no-abi`
  in build-wasms.sh).

  With no embedded ABI on the target, the node cannot prove the swap is a code-only activation rather
  than a needed migration, so `resolve_upgrade_from_abis` refuses: the upgrade_group RPC returns an error
  and the step is expected to fail. Previously the node warned and proceeded code-only, which would install
  new bytecode over existing state and corrupt it if a migration was actually required.

  Acts as the regression guard for core#3285: if the refusal is removed or reopened to the old fail-open,
  the upgrade_group call succeeds -> the expected_failure step is not satisfied -> the workflow fails.

  Note: merobox 0.4.x''s upgrade_group step has no forceCodeOnly field yet, so this scenario covers refusal
  only. The forceCodeOnly=true code-only-success path is exercised by the calimero-context unit tests
  (decide_proceeds_code_only_when_forced) until the merobox step schema gains the field.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3340
accounts:
- app-migration-missing-abi-1
not_applicable: the port keeps 1 of v1's 3 checks; the rest checked what has no release-v2 counterpart
steps:
- name: Install migration-suite-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-missing-abi-1
- name: Create namespace on node 1
  type: create_org
  org_name: Create namespace on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-missing-abi-1
- name: Create Open subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: missing-abi-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-missing-abi-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-missing-abi-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-missing-abi-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Set description (v1)
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: set-before-upgrade
  account: app-migration-missing-abi-1
- name: Install unembedded migration-suite-v2 (no ABI) on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-noabi-2.0.0.mpk'
  outputs:
    app_v2_noabi: package
    app_v2_noabi_version: version
  account: app-migration-missing-abi-1
- name: Attempt upgrade to the no-ABI target (must be refused)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_noabi_version}}'
  account: app-migration-missing-abi-1
  expected_failure: true
- name: Wait for log flush
  type: wait
  seconds: 5.0
- name: Read schema_info after the refused upgrade
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-missing-abi-1
  outputs:
    schema_after: rpc
- name: Assert the context still runs v1
  type: json_assert
  statements:
  - 'json_subset({{schema_after}}, {"output": {"schema_version": "1.0.0", "description": "set-before-upgrade"}})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-missing-abi-1
