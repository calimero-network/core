# Ported from 47-missing-releases-before-activate.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x1: v1 node logs
#   script x5: scripts drive v1 node RPC URLs
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 47 - Missing releases listed, installed, then activated (v1 -> v2 -> v3, 2-node)
description: 'A member that missed two upgrades cannot activate: the switch steps through every release
  in between and core never installs one. The member''s upgrade status names exactly the releases to install,
  oldest first, the target included; once they are installed, activation succeeds and the member''s context
  runs the target.

  Node 2 joins on v1 and holds only that release. The admin then upgrades the namespace v1 -> v2 -> v3
  while node 2 never touches its context.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3420
accounts:
- app-migration-missing-1
- app-migration-missing-2
not_applicable: the port keeps 1 of v1's 13 checks; the rest checked what has no release-v2 counterpart
steps:
- name: Install migration-suite-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-missing-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-missing-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: missing-releases-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-missing-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-missing-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-missing-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-missing-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-missing-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-missing-2
- name: Install migration-suite-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-missing-1
- name: Cascade the namespace v1 to v2
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-missing-1
- name: Install migration-suite-v3 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-3.0.0.mpk'
  outputs:
    app_v3: package
    app_v3_version: version
  account: app-migration-missing-1
- name: Cascade the namespace v2 to v3
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v3_version}}'
  account: app-migration-missing-1
- name: Wait for both upgrades to reach node 2
  type: wait
  seconds: 20.0
- name: Node 2's context runs the target
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-missing-2
  outputs:
    schema_node2: rpc
- name: Assert node 2 runs v3
  type: json_assert
  statements:
  - 'json_subset({{schema_node2}}, {"output": {"schema_version": "3.0.0"}})'
