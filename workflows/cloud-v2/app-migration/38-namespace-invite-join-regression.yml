# Ported from 38-namespace-invite-join-regression.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
name: 38 — Namespace invite + join (MemberJoinedAt wire regression, 2-node)
description: "Regression guard for the invitation-expiry enforcement change. Node 1 (admin) creates a\
  \ namespace + one Open descendant subgroup + one context, invites node 2, then node 2 joins the namespace\
  \ via the admin-signed invitation, materialises the inherited subgroup, joins the context, and reads\
  \ state written by node 1.\nThis exercises the accept-path of both halves of the change on the real\
  \ wire:\n  - the joiner publishes the new `RootOp::MemberJoinedAt` op (carrying\n    `joined_at`); node\
  \ 1's apply gate must accept the in-window join and\n    fold node 2 into membership (a broken/over-strict\
  \ gate would drop\n    node 2 from the member set);\n  - the responder's `validate_open_invitation`\
  \ must accept the valid,\n    unexpired, admin-signed invitation and serve the group key (a\n    broken\
  \ responder gate would reject it and node 2 would never receive\n    the key, so the final cross-node\
  \ read would fail).\n\nNetwork-level expiry REJECTION is covered by the deterministic apply / responder\
  \ unit + integration tests; driving a short-lived invitation end-to-end needs a merobox step that forwards\
  \ an expiration, which is a separate follow-up.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3330
accounts:
- invite-join-regression-1
- invite-join-regression-2
steps:
- name: Install migration-suite-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: invite-join-regression-1
- name: Create namespace on node 1
  type: create_org
  org_name: Create namespace on node 1
  outputs:
    namespace_id: orgId
  account: invite-join-regression-1
- name: Create descendant Open subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: invite-join-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: invite-join-regression-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: invite-join-regression-1
- name: Create context in subgroup on node 1
  type: deploy
  account: invite-join-regression-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: invite-join-regression-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace (publishes MemberJoinedAt)
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: invite-join-regression-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: invite-join-regression-2
- name: Node 1 writes state (description)
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: joined-via-invitation
  account: invite-join-regression-1
- name: Node 1 increments counter
  type: call
  app: '{{ctx_id}}'
  method: increment_counter
  args: {}
  account: invite-join-regression-1
- name: Node 2 reads synced state
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: invite-join-regression-2
  outputs:
    schema_node2: rpc
- name: Assert node 2 joined and decrypted node 1's state
  type: json_assert
  statements:
  - 'json_subset({{schema_node2}}, {"output": {"schema_version": "1.0.0", "description": "joined-via-invitation",
    "counter": "1"}})'
