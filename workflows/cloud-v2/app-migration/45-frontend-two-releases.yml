# Ported from 45-frontend-two-releases.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   login (unknown) x1: checks what the dropped steps did
#   script x1: scripts drive v1 node RPC URLs
name: 45 - Two namespaces on different releases each load their own frontend (1-node)
description: 'One app ships at two releases, each bundling its own frontend whose index.html embeds its
  version string. A namespace is created on release 1.0.0, then release 2.0.0 is installed and a second
  namespace is created on it.

  `frontend-serving.sh` checks what the node serves on the app''s own host, `{label}.localhost:{port}`,
  and what it refuses there and on its own host.

  Serving is keyed by release, not namespace (`/?namespace=` is not supported yet), so the assertions
  run per release on the one app host.

  '
backend: cloud-v2
not_applicable: 'the port keeps only "both namespaces exist": what v1 checked (each release serves its own frontend) is a script step, dropped. release-v2 serves a package frontend from its own origin ({label}.{apps_domain}, routed by Host), which no runner step can address'
cluster:
  nodes: 3
  base_port: 3400
accounts:
- app-migration-frontend-1
steps:
- name: Install release 1.0.0
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.frontend-release-1.0.0.mpk'
  outputs:
    app_id: package
    app_id_version: version
  account: app-migration-frontend-1
- name: Create namespace A on release 1.0.0
  type: create_org
  org_name: Create namespace A on release 1.0.0
  outputs:
    namespace_a: orgId
  account: app-migration-frontend-1
- name: Create a subgroup in namespace A
  type: create_team
  org: '{{namespace_a}}'
  team_name: frontend-a
  join: invite
  outputs:
    group_a: teamId
  account: app-migration-frontend-1
- name: Create a context on release 1.0.0
  type: deploy
  account: app-migration-frontend-1
  package: '{{app_id}}'
  version: '{{app_id_version}}'
  app_name: Create a context on release 1.0.0
  org: '{{namespace_a}}'
  access:
    kind: team
    team: '{{group_a}}'
  outputs:
    ctx_a: contextId
- name: Create namespace B on release 2.0.0
  type: create_org
  org_name: Create namespace B on release 2.0.0
  outputs:
    namespace_b: orgId
  account: app-migration-frontend-1
- name: Assert both namespaces exist
  type: assert
  statements:
  - is_set({{namespace_a}})
  - is_set({{namespace_b}})
