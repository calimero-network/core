# Ported from 43-retarget-before-activate.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_api_response x2: v1 admin API
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   script x2: scripts drive v1 node RPC URLs
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 43 - Activation refuses a release the admin retargeted after the member looked (2-node)
description: 'Node 1 cascades the namespace v1 to v2. Node 2''s member reads that target (v2) and is about
  to activate it, but the admin retargets the namespace to v3 first. v2 and v3 share one application id,
  so only the version tells them apart: the member''s activation naming v2 is refused with 409, and after
  re-reading the target the activation of v3 succeeds.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3380
accounts:
- app-migration-retarget-1
- app-migration-retarget-2
not_applicable: the port keeps 3 of v1's 7 checks; the rest checked what has no release-v2 counterpart
steps:
- name: Install scenario-pure-bugfix-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-pure-bugfix-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-retarget-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-retarget-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: retarget-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-retarget-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-retarget-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-retarget-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-retarget-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-retarget-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-retarget-2
- name: Write v1 item k1=10 on node 1
  type: call
  app: '{{ctx_id}}'
  method: add_value
  args:
    key: k1
    value: 10
  account: app-migration-retarget-1
- name: Install scenario-pure-bugfix-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-pure-bugfix-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-retarget-1
- name: Cascade namespace v1 to v2 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-retarget-1
- name: Wait for the cascade to reach node 2
  type: wait
  seconds: 15.0
- name: The admin retargets the namespace to v3
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-pure-bugfix-3.0.0.mpk'
  outputs:
    app_v3: package
    app_v3_version: version
  account: app-migration-retarget-1
- name: Cascade namespace to v3 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v3_version}}'
  account: app-migration-retarget-1
- name: Both releases share one application id
  type: json_assert
  statements:
  - equal("{{app_v3}}", "{{app_v2}}")
- name: Wait for the retarget to reach node 2
  type: wait
  seconds: 15.0
- name: Read k1 on node 2 (v1 state survives the switch)
  type: call
  app: '{{ctx_id}}'
  method: get_value
  args:
    key: k1
  account: app-migration-retarget-2
  outputs:
    read_k1: rpc
- name: Assert k1 = 10 on node 2
  type: json_assert
  statements:
  - 'json_equal({{read_k1}}, {"output": 10})'
- name: Node 2 runs the fixed release
  type: call
  app: '{{ctx_id}}'
  method: sum_all_values
  args: {}
  account: app-migration-retarget-2
  outputs:
    sum_after: rpc
- name: Assert the fixed sum on node 2
  type: json_assert
  statements:
  - 'json_equal({{sum_after}}, {"output": 10})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-retarget-1
