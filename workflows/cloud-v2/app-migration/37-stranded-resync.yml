# Ported from 37-stranded-resync.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x1: v1 node logs
#   assert_migration_complete x1: v1 group migration
#   delete_blob (unknown) x2: checks what the dropped steps did
#   get_application (unknown) x1: checks what the dropped steps did
#   get_migration_status output (v1 per-member rollup) x11: checks what the dropped steps did
#   json_assert statement on a dropped step's output x11: checks what the dropped steps did
#   resync_context (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 37 - Stranded context recovers via resync (intermediate blob unobtainable, 2-node)
description: 'A behind member is STRANDED when an upgrade-ladder rung''s bytecode is unobtainable, and
  recovers via an operator-initiated state resync - the headline "nobody stranded" path.

  node-1 advances a context v1 -> v2 -> v3 (activating each rung in its own binary), so it holds v3 state
  and all three blobs. node-2 joins at v1, syncs v1 state, learns of the v3 target, but never accesses
  - it stays at v1. The v2 (INTERMEDIATE) blob is then deleted on every holder (node-1 + node-2''s pre-stage)
  with `delete_blob` (admin API - cascades the parent metadata + every chunk file + chunk metadata, so
  the bytecode is truly gone); the v3 blob stays intact on node-1.

  When node-2 first accesses the context its lazy ladder replay reaches the v1 -> v2 hop, cannot fetch
  the v2 bytecode from any peer, and hits NoMigrationPath: the access SUCCEEDS serving the current (v1)
  application (logged "ladder hop blocked; proceeding with current application"), and the context surfaces
  as `state: "failed"` / `migration_failed: "no_migration_path"` in the migration-status rollup. It is
  stranded - v1 -> v2 -> v3 is impassable because v2 is gone.

  Recovery: `resync_context force=true` on node-2 adopts node-1''s full v3-state snapshot (the v3 blob
  is intact, so node-2 can fetch and run it), clearing the stranded marker. A post-resync read returns
  the v3 schema with v1 data carried through, and the rollup converges to all-migrated.

  The strand assertion uses the TERMINAL signals (the "ladder hop blocked" warn + the migration-status
  rollup), NOT the "replaying upgrade ladder hop" line which also fires on the blocked attempt.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3320
accounts:
- app-migration-strand-1
- app-migration-strand-2
not_applicable: the port keeps 9 of v1's 22 checks; the rest checked what has no release-v2 counterpart
steps:
- name: Install migration-suite-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-strand-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-strand-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: stranded-resync-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-strand-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-strand-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-strand-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-strand-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-strand-2
- name: Capture node 2 key
  type: whoami
  outputs: {}
  account: app-migration-strand-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-strand-2
- name: Write v1 description
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: stranded-resync
  account: app-migration-strand-1
- name: Increment counter (1/2)
  type: call
  app: '{{ctx_id}}'
  method: increment_counter
  args: {}
  account: app-migration-strand-1
- name: Increment counter (2/2)
  type: call
  app: '{{ctx_id}}'
  method: increment_counter
  args: {}
  account: app-migration-strand-1
- name: Write item to v1 map
  type: call
  app: '{{ctx_id}}'
  method: set_item
  args:
    key: k1
    value: v1-value
  account: app-migration-strand-1
- name: Install migration-suite-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-strand-1
- name: Assert get_application returned the v2 row
  type: json_assert
  statements:
  - equal("{{v2_version}}", "2.0.0")
- name: Upgrade subgroup v1 -> v2
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-strand-1
- name: Wait for v2 upgrade meta to gossip to node 2
  type: wait
  seconds: 15.0
- name: Activate v2 on node 1 only (node 2 stays at v1 - never accessed)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-strand-1
  outputs:
    v2_schema_node1: rpc
- name: Assert node 1 activated v2
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0"}})'
- name: Install migration-suite-v3 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-3.0.0.mpk'
  outputs:
    app_v3: package
    app_v3_version: version
  account: app-migration-strand-1
- name: Upgrade subgroup v2 -> v3
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v3_version}}'
  account: app-migration-strand-1
- name: Wait for v3 upgrade meta to gossip to node 2
  type: wait
  seconds: 15.0
- name: Activate v3 on node 1 only
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-strand-1
  outputs:
    v3_schema_node1: rpc
- name: Assert node 1 reached v3
  type: json_assert
  statements:
  - 'json_subset({{v3_schema_node1}}, {"output": {"schema_version": "3.0.0"}})'
- name: First access on node 2 hits the missing v2 rung (serves v1)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-strand-2
  outputs:
    strand_schema_node2: rpc
- name: Assert node 2 still serves v1 (the ladder hop was blocked)
  type: json_assert
  statements:
  - 'json_subset({{strand_schema_node2}}, {"output": {"schema_version": "1.0.0"}})'
- name: Settle for node 2's stranded heartbeat
  type: wait
  seconds: 40.0
- name: Read migration-status rollup on node 1 (admin)
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-strand-1
  outputs:
    strand_failed: failed
- name: Assert exactly node 2 stranded, for the blocked-ladder reason
  type: json_assert
  statements:
  - equal({{strand_failed}}, 1)
- name: Assert resync was started
  type: json_assert
  statements:
  - equal("{{resync_started}}", "True")
- name: Let the snapshot land and node 2's strand marker clear
  type: wait
  seconds: 20.0
- name: Read schema on node 2 after resync
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-strand-2
  outputs:
    recovered_schema_node2: rpc
- name: Assert node 2 recovered to v3 with data carried through
  type: json_assert
  statements:
  - 'json_subset({{recovered_schema_node2}}, {"output": {"schema_version": "3.0.0", "counter": "2"}})'
- name: Assert the v1 map item survived the resync on node 2
  type: call
  app: '{{ctx_id}}'
  method: get_item
  args:
    key: k1
  account: app-migration-strand-2
  outputs:
    item_node2: rpc
- name: Assert item value carried through to v3
  type: json_assert
  statements:
  - 'json_subset({{item_node2}}, {"output": "v1-value"})'
- name: Read the recovered rollup on node 1 (admin)
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-strand-1
  outputs:
    recovered_failed: failed
- name: Assert node 2 came back at the v3 target with its marker cleared
  type: json_assert
  statements:
  - equal({{recovered_failed}}, 0)
