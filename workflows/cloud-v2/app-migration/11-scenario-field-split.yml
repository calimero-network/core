# Ported from 11-scenario-field-split.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   get_migration_status output (v1 per-member rollup) x7: checks what the dropped steps did
#   json_assert statement on a dropped step's output x7: checks what the dropped steps did
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x2: replication is synchronous: a read sees every committed write
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 11 - Scenario "field split" (v1 → v2-field-split, 2-node)
description: '2-node per-context migration for the field-split scenario. v1 carries a single `address:
  LwwRegister<String>` field; v2 splits it into three structured fields `street`, `city`, `postcode`.
  `migrate_v1_to_v2` parses each v1 address by splitting on ", ": exactly 3 parts populate street/city/postcode,
  anything else falls back to street = whole address with city/postcode empty. Topology: namespace + one
  Open subgroup + one context in the subgroup. Upgrade is `upgrade_group(group=subgroup, target=v2, migrate=migrate_v1_to_v2)`
  - per-context (cascade=false). Acts as the schema-reshape row of the per-scenario matrix. Cross-node
  assertions prove the split-field shape reaches node 2 via context- sync gossip.

  Negative assertions: pre-upgrade, the v2-only `set_street` is not exported by v1; post-upgrade, the
  v1-only `set_address` is gone in v2.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3110
accounts:
- app-migration-split-1
- app-migration-split-2
steps:
- name: Install scenario-field-split-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-field-split-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-split-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-split-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: field-split-scenario-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-split-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-split-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-split-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-split-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-split-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-split-2
- name: Write v1 state - set_name
  type: call
  app: '{{ctx_id}}'
  method: set_name
  args:
    name: customer-7
  account: app-migration-split-1
- name: Write v1 state - set_address (3-part comma-separated)
  type: call
  app: '{{ctx_id}}'
  method: set_address
  args:
    address: 221B Baker Street, London, NW1 6XE
  account: app-migration-split-1
- name: Sanity-check v1 state shape on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-split-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema in place
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "name": "customer-7", "address":
    "221B Baker Street, London, NW1 6XE"}})'
- name: Negative - set_street is not exported by v1
  type: call
  app: '{{ctx_id}}'
  method: set_street
  args:
    street: should-fail-pre-upgrade
  account: app-migration-split-1
  expected_failure: true
- name: Install scenario-field-split-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-field-split-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-split-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Upgrade subgroup v1 → v2 (per-context, not cascade)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-split-1
- name: Wait for upgrade meta to gossip to node 2
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-split-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-split-2
  outputs:
    v2_schema_node2: rpc
- name: Read the migration-status rollup on node 1 (admin)
  type: migration_status
  apps:
  - '{{ctx_id}}'
  account: app-migration-split-1
  outputs:
    mig_failed: failed
- name: Assert each member migrated its own state, with no residue left
  type: json_assert
  statements:
  - equal({{mig_failed}}, 0)
- name: Assert v2 schema on node 1 (address parsed into three fields, name preserved)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"name": "customer-7"}})'
  - 'json_subset({{v2_schema_node1}}, {"output": {"street": "221B Baker Street", "city": "London", "postcode":
    "NW1 6XE"}})'
- name: Assert v2 schema on node 2 (same split shape, proves rewrite reached node 2)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node2}}, {"output": {"schema_version": "2.0.0"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"name": "customer-7"}})'
  - 'json_subset({{v2_schema_node2}}, {"output": {"street": "221B Baker Street", "city": "London", "postcode":
    "NW1 6XE"}})'
- name: v2-only set_postcode now callable on node 1
  type: call
  app: '{{ctx_id}}'
  method: set_postcode
  args:
    postcode: NW1 6XF
  account: app-migration-split-1
- name: Read updated v2 schema_info on node 1
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-split-1
  outputs:
    v2_schema_after_node1: rpc
- name: Read updated v2 schema_info on node 2
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-split-2
  outputs:
    v2_schema_after_node2: rpc
- name: Assert v2-only postcode update round-trips on node 1
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_after_node1}}, {"output": {"postcode": "NW1 6XF"}})'
- name: Assert v2-only postcode update round-trips to node 2
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_after_node2}}, {"output": {"postcode": "NW1 6XF"}})'
- name: Negative - set_address is gone in v2
  type: call
  app: '{{ctx_id}}'
  method: set_address
  args:
    address: should-fail-post-upgrade
  account: app-migration-split-1
  expected_failure: true
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-split-1
