# Ported from 14-cascade-status-rpc.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_cascade_complete (unknown) x2: checks what the dropped steps did
#   assert_log_present x2: v1 node logs
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   get_cascade_status (unknown) x2: checks what the dropped steps did
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 14 — Cascade status RPC (get_cascade_status + assert_cascade_complete, 2-node)
description: "E2E coverage for the get_cascade_status RPC and the cascade-completion assertion shipped\
  \ in #2524 / merobox#272 (issue merobox#255). Reuses 01's proven 2-node namespace-cascade setup (namespace\
  \ + one Open descendant subgroup + one context, node 2 joins via inheritance), runs ONE upgrade_group(cascade=true),\
  \ then drives the new merobox steps:\n\n  - assert_cascade_complete polls get_cascade_status on EACH\
  \ node until\n    every group in the namespace subtree reports `completed`.\n  - get_cascade_status\
  \ returns one entry per group (namespace root +\n    descendant subgroup); this asserts the roll-up\
  \ on both the emitter\n    (node 1) and the receiver (node 2): pending == 0 and\n    completed == total,\
  \ proving the atomic CascadeUpgrade op wrote a\n    Completed upgrade record on every matched descendant\
  \ on BOTH peers.\n\nWhereas 01 verifies the state-migration side of the cascade, this scenario is the\
  \ dedicated regression guard for the get_cascade_status RPC surface (actor → ContextMessage → context\
  \ client → admin HTTP GET /groups/:namespace_id/cascade-status) and the cascade_hlc the atomic op stamps\
  \ per descendant.\nRequires merobox >= 0.6.32 (get_cascade_status / assert_cascade_complete steps; calimero-network/merobox#272).\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3140
accounts:
- app-migration-status-1
- app-migration-status-2
steps:
- name: Install migration-suite-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-status-1
- name: Create namespace on node 1 (anchors app_v1)
  type: create_org
  org_name: Create namespace on node 1 (anchors app_v1)
  outputs:
    namespace_id: orgId
  account: app-migration-status-1
- name: Create descendant Open subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: cascade-status-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-status-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-status-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-status-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-status-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-status-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-status-2
- name: Node 1 writes v1 state (description)
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: set-before-cascade
  account: app-migration-status-1
- name: Install migration-suite-v2-add-field on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-status-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Cascade namespace v1 → v2 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-status-1
- name: Wait for cascade op to gossip + apply on both nodes
  type: wait
  seconds: 15.0
- name: Assert cascade-status roll-up on BOTH nodes
  type: json_assert
  statements:
  - equal({{status_pending_node1}}, 0)
  - equal({{status_pending_node2}}, 0)
  - equal({{status_completed_node1}}, {{status_total_node1}})
  - equal({{status_completed_node2}}, {{status_total_node2}})
  - equal({{status_total_node1}}, 2)
  - equal({{status_total_node2}}, 2)
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-status-1
