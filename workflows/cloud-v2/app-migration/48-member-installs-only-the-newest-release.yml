# Ported from 48-member-installs-only-the-newest-release.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_api_response x3: v1 admin API
#   assert_log_present x1: v1 node logs
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 48 - A member that installs only the newest release still replays every rung (2-node)
description: 'Node 2 joins a v1 context and never activates anything. The admin upgrades the namespace
  v1 -> v2 -> v3, and node 2 installs ONLY v3. The three releases share one application id, so node 2''s
  application row now names v3 while its state is still v1''s: the context must keep reporting 1.0.0,
  and its first access must replay the ladder through v2 rather than start at v3.

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3430
accounts:
- app-migration-newest-only-1
- app-migration-newest-only-2
not_applicable: the port keeps 1 of v1's 3 checks; the rest checked what has no release-v2 counterpart
steps:
- name: Install scenario-pure-bugfix-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-pure-bugfix-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-newest-only-1
- name: Create namespace (v1) on node 1
  type: create_org
  org_name: Create namespace (v1) on node 1
  outputs:
    namespace_id: orgId
  account: app-migration-newest-only-1
- name: Create Open subgroup under namespace
  type: create_team
  org: '{{namespace_id}}'
  team_name: newest-only-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-newest-only-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-newest-only-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-newest-only-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Write v1 item k1=10 on node 1
  type: call
  app: '{{ctx_id}}'
  method: add_value
  args:
    key: k1
    value: 10
  account: app-migration-newest-only-1
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-newest-only-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-newest-only-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-newest-only-2
- name: Install scenario-pure-bugfix-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-pure-bugfix-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-newest-only-1
- name: Cascade namespace v1 to v2 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-newest-only-1
- name: Install scenario-pure-bugfix-v3 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-pure-bugfix-3.0.0.mpk'
  outputs:
    app_v3: package
    app_v3_version: version
  account: app-migration-newest-only-1
- name: Cascade namespace v2 to v3 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v3_version}}'
  account: app-migration-newest-only-1
- name: Wait for both cascades to reach node 2
  type: wait
  seconds: 20.0
- name: Node 2 first access replays the ladder
  type: call
  app: '{{ctx_id}}'
  method: sum_all_values
  args: {}
  account: app-migration-newest-only-2
  outputs:
    sum_after: rpc
- name: Assert the fixed sum on node 2
  type: json_assert
  statements:
  - 'json_equal({{sum_after}}, {"output": 10})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-newest-only-1
