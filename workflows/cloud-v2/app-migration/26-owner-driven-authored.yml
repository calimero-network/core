# Ported from 26-owner-driven-authored.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   assert_log_absent x3: v1 node logs
#   assert_log_present x4: v1 node logs
#   assert_migration_complete x1: v1 group migration
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
#   wait_for_sync x1: replication is synchronous: a read sees every committed write
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 26 — Owner-driven identity-gated re-write (PR-6c, node-log validated)
description: "Owner-driven convert of an identity-gated (`UserStorage`) entry across a 2-node namespace,\
  \ validated against node logs (PR-6c task 6c.3 + 6c.11).\nIdentity-gated data does NOT migrate via the\
  \ whole-root migrate path — it migrates lazily, when each entry's OWNER next issues an ordinary signed\
  \ write. `UserStorage` keys every slot by `env::executor_id`, so node 1 owns its note slot and node\
  \ 2 owns its own. After cascading the namespace v1 → v2 (migration_v2 default-ON from PR-6b, so no feature\
  \ flag), each owner's next `set_note` re-write stamps `schema_version = target` and advances the entry's\
  \ monotonic nonce (`updated_at`) on the normal write path — NOT under merge mode, NOT entropy-suppressed\
  \ (resolves spec O4).\nThe discriminating node-log assertions (the explicit 6c.11 requirement):\n  -\
  \ POSITIVE, regression-coupled: the per-entry re-stamp branch in\n    `Interface::save_raw` (6c.3) emits\
  \ a debug log when an owner's own write\n    re-stamps its identity-gated entry's `schema_version` to\
  \ the target. Each\n    owner re-writes its OWN slot, so this log MUST be present on both nodes\n  \
  \  (assert_log_present). This is the signal that the per-entry owner-driven\n    convert actually ran\
  \ — remove the 6c convert code and this log, and the\n    entry, never get re-stamped, so the assert\
  \ fails. (The `schema_info`\n    `2.0.0` checks only reflect which WASM is loaded — a HARDCODED constant\
  \ —\n    not the per-entry stamp, so they cannot stand in for this signal.)\n  - The OWNER's own re-write\
  \ must NOT trip the owner gate (\"Cannot change\n    owner of User storage\"): an owner re-writing its\
  \ own slot keeps the same\n    owner (assert_log_absent on both nodes across the convert).\n  - A NON-owner\
  \ can never drive another identity's convert — at the storage\n    layer a non-owner write of a foreign\
  \ User slot is impossible because\n    UserStorage::insert always stamps the CALLER's executor_id as\
  \ owner, and\n    the re-stamp branch above only fires for the local owner. The negative is\n    pinned\
  \ by a cross-node convergence read: node 2's view of node 1's\n    converted note is identical to node\
  \ 1's, proving only the owner drove the\n    convert and it replicated as one convergent signed delta.\n\
  \  - The migrate machinery ran (lazy upgrade fired on both nodes) and the\n    schema advanced to 2.0.0\
  \ with both per-user notes preserved.\n\nBecause migration_v2 defaults ON (PR-6b task 6b.8), the nodes\
  \ run the owner-driven convert natively — no merobox feature flag is needed.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3230
accounts:
- app-migration-owner-1
- app-migration-owner-2
not_applicable: the port keeps 6 of v1's 20 checks; the rest checked what has no release-v2 counterpart
steps:
- name: Install scenario-user-storage-v1 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-user-storage-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-owner-1
- name: Create namespace on node 1 (anchors app_v1)
  type: create_org
  org_name: Create namespace on node 1 (anchors app_v1)
  outputs:
    namespace_id: orgId
  account: app-migration-owner-1
- name: Create descendant Open subgroup on node 1
  type: create_team
  org: '{{namespace_id}}'
  team_name: owner-driven-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-owner-1
- name: Mark subgroup as Open
  type: team_update
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  join: everyone
  account: app-migration-owner-1
- name: Create context in subgroup on node 1 (v1)
  type: deploy
  account: app-migration-owner-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup on node 1 (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Create namespace invitation for node 2
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: app-migration-owner-1
  outputs:
    namespace_invitation: token
- name: Node 2 joins namespace
  type: redeem_invite
  token: '{{namespace_invitation}}'
  account: app-migration-owner-2
- name: Node 2 materialises subgroup membership via inheritance
  type: team_join
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-owner-2
- name: Node 1 writes its own v1 note (owner = node 1)
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    value: node1-note-v1
  account: app-migration-owner-1
- name: Node 2 writes its own v1 note (owner = node 2)
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    value: node2-note-v1
  account: app-migration-owner-2
- name: Assert v1 schema on node 1 (both notes present)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-owner-1
  outputs:
    v1_schema: rpc
- name: Assert v1 schema shape (2 identity-gated notes)
  type: json_assert
  statements:
  - 'json_subset({{v1_schema}}, {"output": {"schema_version": "1.0.0", "note_count": 2}})'
- name: Install scenario-user-storage-v2 on node 1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.scenario-user-storage-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-owner-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Cascade namespace v1 → v2 (initiated by node 1)
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-owner-1
- name: Wait for cascade op to gossip + apply on both nodes
  type: wait
  seconds: 15.0
- name: Read post-migration schema_info on node 1 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-owner-1
  outputs:
    v2_schema_node1: rpc
- name: Read post-migration schema_info on node 2 (triggers lazy migration)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-owner-2
  outputs:
    v2_schema_node2: rpc
- name: Assert v2 schema on node 1 (notes preserved through migrate)
  type: json_assert
  statements:
  - 'json_subset({{v2_schema_node1}}, {"output": {"schema_version": "2.0.0", "note_count": 2}})'
- name: Node 1 owner re-writes its own note (drives the convert)
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    value: node1-note-v2
  account: app-migration-owner-1
- name: Node 2 owner re-writes its own note (drives the convert)
  type: call
  app: '{{ctx_id}}'
  method: set_note
  args:
    value: node2-note-v2
  account: app-migration-owner-2
- name: Wait for converted notes to replicate as normal signed deltas
  type: wait
  seconds: 15.0
- name: Node 1 reads its own converted note
  type: call
  app: '{{ctx_id}}'
  method: my_note
  args: {}
  account: app-migration-owner-1
  outputs:
    note_node1: rpc
- name: Node 2 reads its own converted note
  type: call
  app: '{{ctx_id}}'
  method: my_note
  args: {}
  account: app-migration-owner-2
  outputs:
    note_node2: rpc
- name: Assert each owner's converted note is the v2 value
  type: json_assert
  statements:
  - 'json_equal({{note_node1}}, {"output": "node1-note-v2"})'
  - 'json_equal({{note_node2}}, {"output": "node2-note-v2"})'
- name: Read final schema_info on node 2 (both converted notes converged)
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-owner-2
  outputs:
    final_schema_node2: rpc
- name: Assert both identity-gated notes converged at v2 on node 2
  type: json_assert
  statements:
  - 'json_subset({{final_schema_node2}}, {"output": {"schema_version": "2.0.0", "note_count": 2}})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-owner-1
