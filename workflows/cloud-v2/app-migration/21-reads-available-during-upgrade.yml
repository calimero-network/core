# Ported from 21-reads-available-during-upgrade.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   delete_context (unknown) x1: checks what the dropped steps did
#   delete_namespace x1: v1 namespace deletion
#   uninstall_application (unknown) x1: checks what the dropped steps did
# FIXED by scripts/cloud-v2-port-fixups.py (converter bugs): a cascade
# upgrade_group upgrades every app in the namespace's teams; of
# get_migration_status only the outputs that mean the same here are kept.
name: 21 — Reads available during an in-progress upgrade (#2539 step 1)
description: 'Single-node cascade upgrade with reads issued during the InProgress window.

  After `upgrade_group(cascade=true)` returns, the cascade op is published and the per-descendant status
  is `InProgress`; the migration propagator runs asynchronously. A burst of `get_description` reads fired
  immediately after must all SUCCEED — proving reads are served from the committed pre-migration root
  while the upgrade is in progress. Under the old block-everything gate those reads returned `UpgradeInProgress`
  and the burst would fail, so this is a regression guard for the relaxed gate.

  Determinism note: a read only catches the old-gate regression if it lands in the (short) InProgress
  window. The burst fires right after the upgrade RPC returns — when `InProgress` is already set and the
  async propagator has not yet finished the local migration — so overlap is very likely, but not guaranteed;
  under the fixed code every read is served regardless, so this never false-fails. The deterministic guarantee
  lives in the Rust tests (`upgrade_rejects_committed_write` unit + `cascade_dispatch_e2e_write_gate_blocks_state_ops`).

  '
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3210
accounts:
- app-migration-reads-1
steps:
- name: Install migration-suite-v1
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-1.0.0.mpk'
  outputs:
    app_v1: package
    app_v1_version: version
  account: app-migration-reads-1
- name: Create namespace (anchors app_v1)
  type: create_org
  org_name: Create namespace (anchors app_v1)
  outputs:
    namespace_id: orgId
  account: app-migration-reads-1
- name: Create descendant subgroup
  type: create_team
  org: '{{namespace_id}}'
  team_name: reads-target-subgroup
  join: invite
  outputs:
    group_id: teamId
  account: app-migration-reads-1
- name: Create context in subgroup (v1)
  type: deploy
  account: app-migration-reads-1
  package: '{{app_v1}}'
  version: '{{app_v1_version}}'
  app_name: Create context in subgroup (v1)
  org: '{{namespace_id}}'
  access:
    kind: team
    team: '{{group_id}}'
  outputs:
    ctx_id: contextId
- name: Write v1 description
  type: call
  app: '{{ctx_id}}'
  method: set_description
  args:
    description: set-before-upgrade
  account: app-migration-reads-1
- name: Sanity — read v1 description before upgrade
  type: call
  app: '{{ctx_id}}'
  method: get_description
  args: {}
  account: app-migration-reads-1
  outputs:
    desc_before: rpc
- name: Assert v1 description readable pre-upgrade
  type: json_assert
  statements:
  - 'json_equal({{desc_before}}, {"output": "set-before-upgrade"})'
- name: Install migration-suite-v2-add-field
  type: install_package
  mpk: '{{env.CORE_WASM_DIR}}/dist/com.calimero.migration-suite-2.0.0.mpk'
  outputs:
    app_v2: package
    app_v2_version: version
  account: app-migration-reads-1
- name: Assert both versions share one application id (bundle same-id)
  type: json_assert
  statements:
  - equal("{{app_v1}}", "{{app_v2}}")
- name: Cascade namespace v1 → v2
  type: upgrade_app
  app: '{{ctx_id}}'
  version: '{{app_v2_version}}'
  account: app-migration-reads-1
- name: Reads during the in-progress upgrade must all succeed
  type: repeat
  count: 12
  steps:
  - name: get_description during InProgress
    type: call
    app: '{{ctx_id}}'
    method: get_description
    args: {}
    account: app-migration-reads-1
- name: Wait for cascade + migration to apply
  type: wait
  seconds: 15.0
- name: Read post-upgrade schema_info
  type: call
  app: '{{ctx_id}}'
  method: schema_info
  args: {}
  account: app-migration-reads-1
  outputs:
    v2_schema: rpc
- name: Assert node reached v2 with v1 data preserved
  type: json_assert
  statements:
  - 'json_subset({{v2_schema}}, {"output": {"schema_version": "2.0.0", "description": "set-before-upgrade"}})'
- name: Delete subgroup
  type: team_delete
  org: '{{namespace_id}}'
  team: '{{group_id}}'
  account: app-migration-reads-1
