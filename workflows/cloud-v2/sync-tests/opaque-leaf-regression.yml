# Ported from opaque-leaf-regression.yml by `merobox cloud port`.
# v1 nodes are accounts here; see merobox/cloud_v2/port.py for the mapping.
# Dropped (no release-v2 counterpart):
#   wait_for_sync x3: replication is synchronous: a read sees every committed write
name: Opaque-leaf HashComparison regression (smoke)
description: "2-node bootstrap that mirrors mero-drive's failing E2E (main) pattern: install app, create\
  \ namespace, create context, second node joins, then a short interleaved write loop with `wait_for_sync`\
  \ between rounds. Exists to give the opaque-leaf HashComparison fix (#2344) end-to-end smoke coverage\
  \ on every PR.\nThis is *smoke coverage*, not the deterministic regression guard. The deterministic\
  \ guard is the Rust sim tests:\n  crates/node/tests/sync_sim/protocol.rs::\n    test_opaque_leaf_converges_via_hash_comparison\n\
  \    test_opaque_leaf_on_responder_converges_via_hash_comparison\nwhich construct the divergent-Root\
  \ state directly, exercise the production protocol via SimStream, and fail pre-fix in <1s. This e2e\
  \ adds end-to-end defense in depth — gross regressions in HashComparison's bootstrap path (e.g. invalid\
  \ TreeNode emission, EntityPush apply, RuntimeEnv plumbing) fail here.\nTotal runtime budget: ~3 min.\
  \ If this exceeds 5 min the GHA wrapper cancels the job — the failure mode under regression is `wait_for_sync`\
  \ timing out, which is fast.\n"
backend: cloud-v2
cluster:
  nodes: 3
  base_port: 3480
accounts:
- sync-regression-node-1
- sync-regression-node-2
steps:
- name: Install kv-store-with-handlers on node-1
  type: upload_bundle
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_handlers.wasm'
  outputs:
    app_id_bundle: hash
  account: sync-regression-node-1
- type: set
  values:
    app_id: '{{app_id_bundle}}'
- name: Node-1 creates namespace
  type: create_org
  org_name: Node-1 creates namespace
  outputs:
    namespace_id: orgId
  account: sync-regression-node-1
- name: Node-1 creates Registry-style context inside namespace
  type: deploy
  account: sync-regression-node-1
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_handlers.wasm'
  app_name: Node-1 creates Registry-style context inside namespace
  org: '{{namespace_id}}'
  outputs:
    ctx_id: contextId
    node1_key: memberPublicKey
- name: Invite node-2 to namespace
  type: invite
  org: '{{namespace_id}}'
  role: member
  account: sync-regression-node-1
  outputs:
    ns_invite: token
- name: Node-2 joins namespace
  type: redeem_invite
  token: '{{ns_invite}}'
  account: sync-regression-node-2
- type: whoami
  account: sync-regression-node-2
  outputs:
    node2_identity: publicKey
- name: Node-2 joins context
  type: whoami
  account: sync-regression-node-2
  outputs:
    node2_key: publicKey
- name: Assert bootstrap shape
  type: assert
  statements:
  - is_set({{namespace_id}})
  - is_set({{ctx_id}})
  - is_set({{node1_key}})
  - is_set({{node2_identity}})
  - is_set({{node2_key}})
- name: Round 1 — node-1 writes
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: alpha
    value: from-node-1
  account: sync-regression-node-1
  as_key: '{{node1_key}}'
- name: Round 1 — node-2 writes
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: beta
    value: from-node-2
  account: sync-regression-node-2
  as_key: '{{node2_key}}'
- name: Round 2 — node-1 writes
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: gamma
    value: from-node-1-r2
  account: sync-regression-node-1
  as_key: '{{node1_key}}'
- name: Round 2 — node-2 writes
  type: call
  app: '{{ctx_id}}'
  method: set
  args:
    key: delta
    value: from-node-2-r2
  account: sync-regression-node-2
  as_key: '{{node2_key}}'
- name: Node-1 reads what node-2 wrote
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: beta
  account: sync-regression-node-1
  as_key: '{{node1_key}}'
  outputs:
    node1_read: rpc
- name: Node-2 reads what node-1 wrote
  type: call
  app: '{{ctx_id}}'
  method: get
  args:
    key: alpha
  account: sync-regression-node-2
  as_key: '{{node2_key}}'
  outputs:
    node2_read: rpc
- name: Assert cross-node convergence
  type: assert
  statements:
  - is_set({{node1_read}})
  - is_set({{node2_read}})
  - contains({{node1_read}}, "from-node-2")
  - contains({{node2_read}}, "from-node-1")
- name: Phase 5 — node-1 creates a second context (race window opens)
  type: deploy
  account: sync-regression-node-1
  wasm: '{{env.CORE_WASM_DIR}}/kv_store_with_handlers.wasm'
  app_name: Phase 5 — node-1 creates a second context (race window opens)
  org: '{{namespace_id}}'
  outputs:
    ctx2_id: contextId
    node1_ctx2_key: memberPublicKey
- name: Phase 5 — let materialisation race play out (no wait_for_sync)
  type: wait
  seconds: 12.0
