[package]
name = "search-bench"
description = "Engine benchmarks for calimero-search: index size, query latency, memory, and the host-time model behind search gas"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
borsh.workspace = true
eyre.workspace = true
# The stock MmapDirectory, as the on-disk baseline beside the RamDirectory the
# node opens every index over. The node itself never enables it.
tantivy = { workspace = true, features = ["mmap"] }

calimero-primitives = { workspace = true, features = ["borsh"] }
calimero-search.workspace = true
