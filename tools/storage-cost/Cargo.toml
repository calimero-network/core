[package]
name = "storage-cost"
description = "Deterministic storage-cost measurement and benchmarks for calimero-storage"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Only the criterion target is a benchmark: otherwise `cargo bench` also hands
# the lib and test targets to libtest, which rejects criterion's own CLI flags.
[lib]
bench = false

[[bin]]
name = "storage-cost"
bench = false

[[test]]
name = "flat_curve"
bench = false

[[test]]
name = "reproducible"
bench = false

[dependencies]
borsh = { workspace = true }
calimero-storage = { workspace = true, features = ["fugue-simple"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

# `harness = false` hands the target's `main` to criterion instead of libtest.
[[bench]]
name = "collections"
harness = false
