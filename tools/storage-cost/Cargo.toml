[package]
name = "storage-cost"
description = "Deterministic storage-cost measurement and benchmarks for calimero-storage"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# The lib and bin targets are the non-criterion ones `cargo bench` would select
# (test targets already default to `bench = false`), and libtest rejects
# criterion's own CLI flags.
[lib]
bench = false

[[bin]]
name = "storage-cost"
bench = false

[dependencies]
borsh = { workspace = true }
calimero-storage = { workspace = true, features = ["fugue-simple"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

# `harness = false` hands the target's `main` to criterion instead of libtest.
[[bench]]
name = "collections"
harness = false
