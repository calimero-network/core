[package]
name = "calimero-client-gen"
description = "Generates calimero-client's route layer from the node's OpenAPI document"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
eyre.workspace = true
# The document's order is the generated code's: without `preserve_order` its
# objects would read sorted, or not, as other crates of a build unify it.
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
tempfile.workspace = true
