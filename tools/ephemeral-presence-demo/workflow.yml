name: "Ephemeral presence DEMO — two nodes + a collaborative-editor context, left running"
description: >
  Brings the demo up and then gets out of the way. Two native merod nodes share
  one context of the ordinary `apps/collaborative-editor` app; the workflow
  installs the app, creates the namespace and context, joins node 2, waits for
  the gossip mesh, writes the resulting ids to
  tools/ephemeral-presence-demo/.demo-env, and LEAVES BOTH NODES RUNNING
  (stop_all_nodes: false) so you can attach cursor clients to them.

  This is deliberately NOT a test. It asserts almost nothing — the demo is what
  makes the four properties visible. The e2e that does assert them lives at
  workflows/ephemeral-presence-e2e.yml.

  The app is unmodified and contains no presence code: a WASM app cannot use
  ephemeral presence and does not need to. Presence is published by the client
  over JSON-RPC `set_ephemeral` and received over the node's WS event stream.

  Run from the repo root:
    merobox bootstrap run tools/ephemeral-presence-demo/workflow.yml --binary-path "$PWD/target/debug/merod"

  Tear down with:
    merobox nuke

no_docker: true
nuke_on_start: true
nuke_on_end: false
# The whole point: the nodes stay up after the workflow exits so cursor clients
# can attach to them.
stop_all_nodes: false

# Fixed ports so the README can hand out copy-pasteable URLs. Deliberately
# offset from workflows/ephemeral-presence-e2e.yml (8830/8930) so the demo and
# the e2e can coexist on one machine.
nodes:
  count: 2
  prefix: presence-demo-node
  base_port: 8840
  base_rpc_port: 8940

steps:
  # ── Discovery ────────────────────────────────────────────────────────────
  #
  # Binary-mode merobox does not wire sibling multiaddrs (the Docker manager
  # does), so without this the nodes fall back to mDNS, which is slow-to-never
  # on macOS with a VPN. Same helper the e2e uses, pointed at the demo's
  # prefix/ports.

  - name: Patch node 2 bootstrap with node 1 peer address
    type: script
    script: tools/ephemeral-presence-demo/wire-bootstrap.sh
    target: local

  - name: Stop node 2 (to reload the patched bootstrap config)
    type: stop_node
    nodes:
      - presence-demo-node-2

  - name: Restart node 2 with patched bootstrap config
    type: start_node
    nodes:
      - presence-demo-node-2

  - name: Wait for the p2p connection to form
    type: wait
    seconds: 5

  # ── App + context ────────────────────────────────────────────────────────

  - name: Install collaborative-editor on node 1
    type: install_application
    node: presence-demo-node-1
    # Build it first if this path is missing:
    #   cargo build -p collaborative-editor --target wasm32-unknown-unknown --profile app-release
    path: target/wasm32-unknown-unknown/app-release/collaborative_editor.wasm
    dev: true
    outputs:
      app_id: applicationId

  - name: Assert the app installed
    type: assert
    statements:
      - "is_set({{app_id}})"

  - name: Node 1 creates the namespace
    type: create_namespace
    node: presence-demo-node-1
    application_id: "{{app_id}}"
    outputs:
      namespace_id: namespaceId

  - name: Node 1 creates the editor context in the namespace root group
    type: create_context
    node: presence-demo-node-1
    application_id: "{{app_id}}"
    group_id: "{{namespace_id}}"
    outputs:
      ctx_id: contextId
      node1_key: memberPublicKey

  - name: Assert the context exists
    type: assert
    statements:
      - "is_set({{ctx_id}})"
      - "is_set({{node1_key}})"

  # ── Node 2 joins ─────────────────────────────────────────────────────────

  - name: Node 1 invites node 2 to the namespace
    type: create_namespace_invitation
    node: presence-demo-node-1
    namespace_id: "{{namespace_id}}"
    outputs:
      ns_invite: invitation

  - name: Wait for namespace governance to gossip to node 2
    type: wait
    seconds: 10

  - name: Node 2 joins the namespace
    type: join_namespace
    node: presence-demo-node-2
    namespace_id: "{{namespace_id}}"
    invitation: "{{ns_invite}}"
    outputs:
      node2_identity: memberIdentity

  - name: Node 2 joins the context
    type: join_context
    node: presence-demo-node-2
    context_id: "{{ctx_id}}"
    outputs:
      node2_key: memberPublicKey

  - name: Assert both members are set
    type: assert
    statements:
      - "is_set({{node1_key}})"
      - "is_set({{node2_key}})"

  # Presence rides the context gossip topic, not the DAG sync path, so this
  # wait is for the mesh to form — not for state convergence.
  - name: Wait for the gossip mesh to settle
    type: wait
    seconds: 30

  # ── Hand off to the human ────────────────────────────────────────────────

  - name: Write .demo-env and print the commands to run
    type: script
    script: tools/ephemeral-presence-demo/write-demo-env.sh
    target: local
    # $1 node1_url  $2 node2_url  $3 context_id  $4 node1_key  $5 node2_key
    args:
      - "http://localhost:8940"
      - "http://localhost:8941"
      - "{{ctx_id}}"
      - "{{node1_key}}"
      - "{{node2_key}}"
