[package]
name = "calimero-client-stub"
description = "Stub node serving the delegated-execution client contracts, for client development"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = false

[dependencies]
axum.workspace = true
borsh.workspace = true
calimero-account.workspace = true
calimero-primitives.workspace = true
clap = { workspace = true, features = ["derive"] }
eyre.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lib]
name = "calimero_client_stub"

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true, features = ["util"] }
