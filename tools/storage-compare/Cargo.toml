[package]
name = "storage-compare"
description = "Same state and delta workloads, measured against whichever calimero-storage it is built in"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
borsh = { workspace = true, features = ["derive"] }
calimero-account = { workspace = true }
calimero-context-config = { workspace = true }
calimero-primitives = { workspace = true, features = ["borsh"] }
calimero-storage = { workspace = true }
calimero-store = { workspace = true, features = ["datatypes"] }
eyre = { workspace = true }
rocksdb = { workspace = true }
tempfile = { workspace = true }
calimero-store-rocksdb = { workspace = true }
