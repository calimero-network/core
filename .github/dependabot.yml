version: 2
updates:
  # Rust crates (workspace root).
  #
  # Patch and minor land as ONE grouped PR; majors get one PR each.
  #
  # Grouping everything, majors included, produced a single unreviewable PR of 83
  # crates spanning hashing, signing, key derivation, the web stack and the on-disk
  # format (#3656). It could not be landed or even compiled: cargo refuses a package
  # whose `rust-version` exceeds the toolchain, so it failed before building, and
  # behind that sat an axum path-syntax change that compiles clean and then 404s.
  # A sweep that can only be merged all-or-nothing is one nobody can review, and it
  # blocks the routine patches riding along with it.
  #
  # `update-types` here bounds the GROUP, not what dependabot proposes: a major
  # falls outside the group and opens on its own, which is the reviewable unit for
  # a breaking change.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # wasmer 7 removed every compiler backend on Windows (cranelift,
      # singlepass and llvm all `compile_error!` there from 7.0.0), and its
      # suggested V8 backend has no `CompilerConfig`, so gas metering cannot be
      # installed. A 7.x bump therefore drops `merod.exe` from the release --
      # see the pin note in the workspace Cargo.toml.
      #
      # Ignoring the majors, not the family: minor and patch updates within 6.x
      # still arrive normally. Drop this once wasmer has a Windows compiler
      # backend again.
      - dependency-name: "wasmer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "wasmer-types"
        update-types: ["version-update:semver-major"]
      - dependency-name: "wasmer-middlewares"
        update-types: ["version-update:semver-major"]

      # libp2p 0.56 is the latest release and still requires multiaddr 0.18 and
      # libp2p-identity 0.2, which it bakes into libp2p-swarm and libp2p-kad
      # signatures. Bumping a satellite alone puts two Multiaddr/PeerId types in
      # the graph and crates/network stops compiling -- 252 errors in #3721, and
      # again in #3861 once a new satellite released. Nothing in core can
      # reconcile it, so the group cannot help while the meta-crate lags.
      #
      # These are 0.x, so minor is the breaking axis and is ignored with major;
      # patches still arrive. Drop this once a libp2p release requires
      # multiaddr ^0.19 / libp2p-identity ^0.3.
      - dependency-name: "multiaddr"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "libp2p-identity"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "prometheus-client"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # Families that version in lockstep, matched first so no member is ever bumped alone:
      # each appears in the others' public API, so a lone bump lands two incompatible types.
      wasmer:
        patterns: ["wasmer", "wasmer-*"]
      libp2p:
        patterns: ["libp2p", "libp2p-*", "multiaddr", "prometheus-client"]
      axum:
        patterns: ["axum", "axum-*", "tower", "tower-*", "tokio-tungstenite"]
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions — also keeps the SHA-pinned `uses:` refs current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Docs site (npm).
  - package-ecosystem: npm
    directory: "/docs-site"
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # Dockerfile base images — keeps the @sha256 digest pins current.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
