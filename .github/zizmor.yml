rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # Local actions keep the plain ./ path that actionlint understands.
  self-repository:
    disable: true
  # Minting app tokens with scoped permissions is not enforced yet.
  github-app:
    disable: true
  secrets-inherit:
    disable: true
  superfluous-actions:
    disable: true
  adhoc-packages:
    disable: true
  use-trusted-publishing:
    disable: true
  # scripts/check-workflow-triggers.py enforces the same-repository guard and no cache writes.
  dangerous-triggers:
    ignore:
      - comment.yml
      - new-issue-or-pr.yml
  # zizmor reads a push to a branch named release* as publishing, so
  # release-v2-parity's push trigger flags these cache restores. None of these
  # jobs publishes (release.yml does, and restores with `save-if: false`), and
  # a cache a branch push restores was written by a push to that branch or to
  # master. Listed by line, so a cache step added later is still audited.
  cache-poisoning:
    ignore:
      - abi-contract.yml:85
      - ci-checks.yml:375
      - docs-ci.yml:29
      - e2e.yml:311
      - e2e.yml:665
  # The consumer checkout keeps its token to push the bump branch.
  artipacked:
    ignore:
      - fleet-bump.yml:118
