rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # Local actions keep the plain ./ path that actionlint understands.
  self-repository:
    disable: true
  # Minting app tokens with scoped permissions is not enforced yet.
  github-app:
    disable: true
  secrets-inherit:
    disable: true
  superfluous-actions:
    disable: true
  adhoc-packages:
    disable: true
  use-trusted-publishing:
    disable: true
  # scripts/check-workflow-triggers.py enforces the same-repository guard and no cache writes.
  dangerous-triggers:
    ignore:
      - comment.yml
      - new-issue-or-pr.yml
