# Every merobox scenario `.github/workflows/e2e-rust-apps.yml` runs on a PR.
#
# The workflow does not run one job per entry: `scripts/e2e-scenario-groups.py`
# packs these into a fixed number of groups, and each group's runner loads the
# merod image, the app bundles and merobox once, then runs its scenarios one
# after another (`scripts/e2e-run-scenario-group.sh`), cleaning every container,
# network, volume and data directory between them.
#
# Fields, one entry per scenario:
#   workflow        the scenario's name: unique, and how its logs and its line in
#                   the step summary are labelled
#   file            the scenario YAML, relative to apps/<app>
#   app             the app directory the scenario runs from
#   image           optional, default merod:local. `merod:local-dht` marks
#                   peer-route scenarios (no fixture registry); `merod:local-mock-tee`
#                   marks ones booting `merod run --mock-tee`. A group holds one image.
#   registry_fetch  optional. "false" marks a scenario that fetches no bytecode,
#                   since a node needs it only to run a context, not to join a
#                   group; every other http-registry scenario must have fetched
#                   from the fixture registry or it fails.
#
# Adding a scenario: add an entry here, and its measured duration to
# scripts/e2e-scenario-durations.json once CI has timed it (until then it is
# packed as if it took the default there). `scripts/check-scenario-coverage.py`
# fails a scenario on disk that no entry names.
scenarios:
  - workflow: scaffolding-e2e
    file: workflows/e2e.yml
    app: scaffolding-e2e
  - workflow: frozen-rga-convergence
    file: workflows/frozen-rga-convergence.yml
    app: scaffolding-e2e
  # The only scenario where a delta's author is not its signer - the sole
  # real-node coverage of the delegated envelope and warrant nonce ledger.
  - workflow: delegated-authorship
    file: workflows/delegated-authorship.yml
    app: scaffolding-e2e
  # Password-free session coverage: a device holding only a key logs in and reads (delegated-
  # authorship above covers the write, but via username/password). Turns on account_proof.
  - workflow: delegated-session
    file: workflows/delegated-session.yml
    app: scaffolding-e2e
  # The other half of the architecture: no session and no token at all,
  # just a signature on each request. Verified by unit tests and by a
  # byte fixture three implementations agree on, but until this nothing
  # had ever presented one to a running node.
  - workflow: delegated-proof
    file: workflows/delegated-proof.yml
    app: scaffolding-e2e
  # The posture a hosted relay actually runs: delegated execution served
  # with NO node credential. Nothing covered it - `--public-intents`
  # appeared in no scenario, so the flag deciding whether a relay is
  # reachable by the clients it exists for had only production as
  # evidence. Two nodes identical but for the flag, so a 200 has a 401
  # beside it and the flag is provably what opened the route.
  - workflow: public-intents
    file: workflows/public-intents.yml
    app: scaffolding-e2e
  # A node holding no account root joins and writes under a certificate signed elsewhere - the
  # cold-storage posture the account/device split exists for. Needs merobox >= 0.6.67.
  - workflow: offline-account-root
    file: workflows/offline-account-root.yml
    app: scaffolding-e2e
  # After two nodes concurrently add distinct SortedSet elements, membership converges but
  # ORDERED reads (iter) may not; the ordered-read assertion is the discriminator.
  - workflow: sorted-set-concurrent-convergence
    file: workflows/sorted-set-concurrent-convergence.yml
    app: scaffolding-e2e
