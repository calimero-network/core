name: Build Local Merod
description: "Create the local merod Docker images (amd64 only) from the shared merod binary (see merod-binaries)."

inputs:
  image-tag:
    description: "Tag for the local Docker image"
    required: false
    default: "merod:local"
  wait-for-producer:
    description: "Passed to merod-binaries: wait for this commit's e2e-rust-apps merod build instead of compiling."
    required: false
    default: "false"

outputs:
  image:
    description: "The local Docker image name:tag"
    value: ${{ inputs.image-tag }}

runs:
  using: "composite"
  steps:
    # Built at most once per source tree across every workflow. This used to
    # compile merod in each caller and cache the image under a key hashed from a
    # tar of the sources, which records mtimes and so never matched twice.
    - name: Get the merod binary
      id: merod
      uses: ./.github/actions/merod-binaries
      with:
        variants: default
        wait-for-producer: ${{ inputs.wait-for-producer }}

    - name: Build local Docker image
      shell: bash
      env:
        MEROD: ${{ steps.merod.outputs.dir }}/default/merod
      run: |
        echo "Creating local Docker image: ${{ inputs.image-tag }}"

        mkdir -p bin/amd64
        cp "$MEROD" bin/amd64/merod
        # meroctl is not needed for e2e tests but the Dockerfile expects it
        touch bin/amd64/meroctl

        docker build \
          -f .github/workflows/deps/prebuilt.Dockerfile \
          -t ${{ inputs.image-tag }} \
          --build-arg TARGETARCH=amd64 \
          .

        echo "Built image:"
        docker images ${{ inputs.image-tag }}

    - name: Layer the application source onto both tags
      shell: bash
      run: |
        docker tag ${{ inputs.image-tag }} ${{ inputs.image-tag }}-dht
        scripts/set-registry-mode.sh ${{ inputs.image-tag }}-dht dht
        # The http tag's base_url is stamped where the fixture registry runs.
        scripts/set-registry-mode.sh ${{ inputs.image-tag }} http

    - name: Verify merod image
      shell: bash
      run: |
        echo "Final images:"
        docker images ${{ inputs.image-tag }}
        docker images ${{ inputs.image-tag }}-dht
