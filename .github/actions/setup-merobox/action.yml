name: Setup Merobox
description: "Install merobox from PyPI via pipx (Linux only)"

runs:
  using: "composite"
  steps:
    - name: Install merobox (pipx)
      shell: bash
      # Install merobox from PyPI in an isolated pipx venv. This replaces the
      # previous apt-from-GitHub-Pages path (#2180): that repo's prebuilt
      # `.deb` was served from a Pages deploy (calimero-network.github.io/
      # merobox), a single point of failure — a 404 on its `gpg.key` took
      # down all e2e repo-wide. PyPI has no such dependency.
      #
      # Each network step gets its own bounded timeout. Without these, a
      # stalled index / pip on a slow runner can wedge the job toward the
      # runner-wide 6h limit — one such hang on PR #2472 ran 90 min in the
      # old apt step alone (see also #2807).
      run: |
        set -euo pipefail
        # pipx is preinstalled on ubuntu GitHub runners; install it if absent.
        if ! command -v pipx >/dev/null 2>&1; then
          timeout 120 python3 -m pip install --user pipx
        fi
        # Floor: the e2e workflows depend on merobox features that only a
        # new-enough release provides —
        #   * native per-container log persistence to data/container-logs/
        #     (merobox#207, 0.6.34),
        #   * the partition_peers/heal_peers surgical libp2p partition steps
        #     that keep RPC reachable (merobox#278, 0.6.35), used by
        #     shared-storage-concurrent-rotation-converge, and
        #   * the native `abort_migration` step (merobox#280, 0.6.36) used by
        #     31-admin-abort-logical, and
        #   * the migrations-v2 steps (resync_context / get_migration_status /
        #     assert_migration_complete, merobox#282; get_application,
        #     merobox#283 — 0.6.38), and
        #   * the `delete_blob` step (admin-API blob delete that cascades
        #     parent+chunks+metadata, merobox#285 — 0.6.39) used by
        #     37-stranded-resync (the old delete_blob_on_disk rm was a no-op for
        #     chunked blobs, so it could not stage the strand), and
        #   * forwarding of MERO_AUTH_ADMIN_USER / MERO_AUTH_ADMIN_PASSWORD
        #     into node and auth-service containers (0.6.43), required now
        #     that the admin root key is minted at `merod init` from those
        #     variables (the login path never mints keys; the bootstrap-secret
        #     flow is gone). Without it every fresh-node scenario login fails
        #     "Invalid credentials".
        # Pin the floor so an older release fails loudly rather than skipping
        # steps or collecting empty log artifacts.
        MIN_MEROBOX="0.6.43"
        # Retry the install: a bare `timeout 180 pipx install` is the single most
        # common red run in this suite. merobox pulls calimero-client-py, whose
        # maturin build fetches from crates.io, so one slow PyPI or crates.io
        # response blows the budget and kills a job that had nothing wrong with
        # it — three separate scenarios died this way in one afternoon
        # (exit 124 in `Setup merobox`, before any node booted). Three attempts
        # with a widening budget and a short backoff; the pip cache makes a
        # second attempt cheap when the first got part-way.
        install_merobox() {
          local attempt budget
          for attempt in 1 2 3; do
            budget=$((180 * attempt))
            echo "installing merobox from spec 'merobox>=${MIN_MEROBOX}' (attempt ${attempt}/3, ${budget}s budget)..."
            if timeout "$budget" pipx install --force "merobox>=${MIN_MEROBOX}"; then
              return 0
            fi
            echo "::warning::merobox install attempt ${attempt} failed or timed out"
            sleep $((attempt * 10))
          done
          echo "::error::merobox install failed after 3 attempts (PyPI/crates.io unreachable or too slow)"
          return 1
        }
        install_merobox
        # Ensure the pipx bin dir is on PATH for this step and all that follow.
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        merobox --version
        HAVE_MEROBOX="$(merobox --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        if [ "$(printf '%s\n%s\n' "$MIN_MEROBOX" "$HAVE_MEROBOX" | sort -V | head -1)" != "$MIN_MEROBOX" ]; then
          echo "::error::merobox ${HAVE_MEROBOX} is older than the required ${MIN_MEROBOX} (MERO_AUTH_ADMIN_* env forwarding)"
          exit 1
        fi
