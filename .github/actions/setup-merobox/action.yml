name: Setup Merobox
description: "Install the pinned merobox: release binary on Linux, PyPI on Windows"

runs:
  using: "composite"
  steps:
    # Split out from the install so the cache key can name the version and
    # architecture; the pin stays in one place so key and asset URL can't disagree.
    - name: Resolve the pinned merobox build
      id: pin
      shell: bash
      run: |
        set -euo pipefail

        # Windows lanes need >= 0.6.75: native process teardown, script steps
        # without a literal `/bin/sh`, and a banner that survives cp1252 stdout.
        MEROBOX_VERSION="0.6.78"

        MEROBOX_ARCH=""
        if [ "${RUNNER_OS}" != "Windows" ]; then
          # merobox publishes release binaries for linux and darwin only.
          case "$(uname -m)" in
            x86_64) MEROBOX_ARCH="linux-x86-64" ;;
            aarch64 | arm64) MEROBOX_ARCH="linux-aarch64" ;;
            *) echo "::error::no merobox release binary for $(uname -m)"; exit 1 ;;
          esac
        fi

        {
          echo "version=${MEROBOX_VERSION}"
          echo "tag=v${MEROBOX_VERSION}"
          echo "arch=${MEROBOX_ARCH}"
        } >> "$GITHUB_OUTPUT"

    # ~100 jobs want this same asset; caching it avoids a thundering herd against the release CDN's
    # anonymous rate limit. Keyed on the exact build, so a version bump misses by construction.
    - name: Restore the cached merobox binary
      if: runner.os != 'Windows'
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/merobox
        key: merobox-${{ steps.pin.outputs.tag }}-${{ steps.pin.outputs.arch }}

    - name: Install merobox
      shell: bash
      env:
        MEROBOX_VERSION: ${{ steps.pin.outputs.version }}
        TAG: ${{ steps.pin.outputs.tag }}
        MEROBOX_ARCH: ${{ steps.pin.outputs.arch }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS}" = "Windows" ]; then
          pip install "merobox==${MEROBOX_VERSION}"
        else
          CACHE_DIR="$HOME/.cache/merobox"
          BIN="$CACHE_DIR/merobox-${TAG}-${MEROBOX_ARCH}"
          SUM="$BIN.sha256"
          mkdir -p "$CACHE_DIR"

          if [ "${CACHE_HIT:-}" = "true" ] && [ -s "$BIN" ] && [ -s "$SUM" ]; then
            echo "merobox ${TAG} restored from cache"
          else
            ASSET="https://github.com/calimero-network/merobox/releases/download/${TAG}/merobox-${TAG}-${MEROBOX_ARCH}"

            # `--retry-delay` fixes the interval (skipping curl's own backoff) so the
            # retries fit the outer `timeout`. `--retry-all-errors` is required to retry a 504 at all.
            RETRY=(--retry 5 --retry-delay 5 --retry-max-time 150 --retry-all-errors)

            if ! timeout 180 curl -fsSL "${RETRY[@]}" -o "$BIN" "$ASSET"; then
              echo "::error::could not download merobox ${TAG} from the GitHub release CDN after 5 attempts over ~150s. This is an INFRASTRUCTURE fetch failure, not a test failure: no test has run at this point. Check https://www.githubstatus.com and that the asset exists at ${ASSET}"
              exit 1
            fi
            if ! timeout 90 curl -fsSL "${RETRY[@]}" -o "$SUM" "${ASSET}.sha256"; then
              echo "::error::downloaded merobox ${TAG} but could not fetch its checksum from ${ASSET}.sha256. This is an INFRASTRUCTURE fetch failure, not a test failure"
              exit 1
            fi
          fi

          # Verified on every path, cache hit included: a cache entry is attacker-influenceable in a way a
          # release asset isn't, so skipping this trades a transient failure for a silent one.
          EXPECTED_SHA="$(awk '{print $1}' "$SUM")"
          ACTUAL_SHA="$(sha256sum "$BIN" | awk '{print $1}')"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::merobox ${TAG} checksum mismatch: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}"
            exit 1
          fi

          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$BIN" "$HOME/.local/bin/merobox"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
        fi

        merobox --version
        HAVE_MEROBOX="$(merobox --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
        if [ "$HAVE_MEROBOX" != "$MEROBOX_VERSION" ]; then
          echo "::error::merobox reports ${HAVE_MEROBOX} but ${MEROBOX_VERSION} is pinned"
          exit 1
        fi
