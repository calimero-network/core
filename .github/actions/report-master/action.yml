name: Report master
description: >
  Keep one open issue per workflow while master is red. The merge queue gates on
  the fast checks (a PR's reachable tests); the push to master runs every test and
  e2e.yml after the merge. A red push opens (or comments on) the issue, naming the
  commit and its pull request, which is reverted rather than fixed forward; the
  next green push closes it. Runs on master only: a push, or e2e.yml's nightly (its own
  issue, `E2E nightly`, closed by the next green nightly).

inputs:
  needs:
    description: The calling job's `toJSON(needs)`; any job that failed or was cancelled makes the run red
    required: true
  workflow:
    description: The workflow's name, which titles the issue
    required: true

runs:
  using: "composite"
  steps:
    - name: Open, update or close the red-master issue
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        NEEDS: ${{ inputs.needs }}
        WORKFLOW: ${{ inputs.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        SHA: ${{ github.sha }}
        SUBJECT: ${{ github.event.head_commit.message }}
        AUTHOR: ${{ github.event.head_commit.author.username }}
      run: |
        set -euo pipefail
        title="master is red: $WORKFLOW"
        failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- `\(.key)`: \(.value.result)"' <<<"$NEEDS")
        issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
          --jq "[.[] | select(.title == \"$title\")][0].number // empty")
        subject=$(head -n1 <<<"$SUBJECT")
        if [ -n "$failed" ]; then
          # Runs finish out of order (one per commit), so a newer commit may already be green.
          body=$(printf '%s failed on %s, `%s`%s: %s\n\n%s\n\nRevert the pull request rather than fixing forward, unless the fix is already up. If the failure is in a test that is flaky rather than broken, say so here.\n' \
            "$WORKFLOW" "$SHA" "$subject" "${AUTHOR:+ (@$AUTHOR)}" "$RUN_URL" "$failed")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
        elif [ -n "$issue" ]; then
          gh issue comment "$issue" --body "Green again on $SHA (\`$subject\`): $RUN_URL"
          gh issue close "$issue"
        fi
