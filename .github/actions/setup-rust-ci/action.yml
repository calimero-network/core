name: Setup Rust CI
description: "Setup Rust toolchain and caching for CI workflows"

inputs:
  toolchain:
    description: "Rust toolchain to install (stable, nightly, or specific version)"
    required: false
    default: "stable"
  components:
    description: "Additional rustup components to install (comma-separated)"
    required: false
    default: ""
  targets:
    description: "Additional rustup targets to install (comma-separated)"
    required: false
    default: ""
  shared-key:
    description: "Shared key for rust-cache (typically workflow name)"
    required: true
  cache-on-failure:
    description: "Whether to save cache even when build fails"
    required: false
    default: "true"
  save-if:
    description: "Condition for saving cache (e.g., github.ref == 'refs/heads/master')"
    required: false
    default: "${{ github.ref == 'refs/heads/master' }}"

runs:
  using: "composite"
  steps:
    # librocksdb-sys's bindgen dlopen's libclang at build-script time; ubuntu
    # runners don't ship libclang-dev by default. macOS uses Homebrew's llvm instead (.cargo/config.toml).
    - name: Install libclang (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libclang-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # rust-toolchain.toml pins the toolchain cargo runs, which is not the one
    # above; without this a `--target` build cannot find its std.
    - name: Add targets to the active toolchain
      if: inputs.targets != ''
      shell: bash
      run: |
        IFS=',' read -ra wanted <<<"${{ inputs.targets }}"
        for target in "${wanted[@]}"; do
          target="$(echo "$target" | tr -d '[:space:]')"
          [ -n "$target" ] || continue
          echo "rustup target add $target (active: $(rustup show active-toolchain))"
          rustup target add "$target"
        done

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        prefix-key: v0-rust
        shared-key: ${{ inputs.shared-key }}
        cache-on-failure: ${{ inputs.cache-on-failure }}
        save-if: ${{ inputs.save-if }}
