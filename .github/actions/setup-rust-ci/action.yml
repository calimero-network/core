name: Setup Rust CI
description: "Install the pinned Rust toolchain and restore (and maybe save) a rust-cache group"

inputs:
  components:
    description: "Additional rustup components to install (comma-separated)"
    required: false
    default: ""
  targets:
    description: "Additional rustup targets to install (comma-separated)"
    required: false
    default: ""
  shared-key:
    description: >
      The cache group: jobs that build the same thing (native dev, release-fast
      merod, wasm apps, ...) share one, so the repo's 10 GB stays a few warm
      caches instead of many evicted ones. Exactly one job per group saves it.
    required: true
  cache-on-failure:
    description: "Whether to save cache even when build fails"
    required: false
    default: "true"
  save-if:
    description: "Condition for saving cache (e.g., github.ref == 'refs/heads/master')"
    required: false
    default: "${{ github.ref == 'refs/heads/master' }}"
  libclang:
    description: "Install libclang-dev on Linux (librocksdb-sys's bindgen needs it)"
    required: false
    default: "true"

outputs:
  channel:
    description: The pinned toolchain channel
    value: ${{ steps.toolchain.outputs.channel }}

runs:
  using: "composite"
  steps:
    # librocksdb-sys's bindgen dlopen's libclang at build-script time; ubuntu
    # runners don't ship libclang-dev by default. macOS uses Homebrew's llvm instead (.cargo/config.toml).
    - name: Install libclang (Linux)
      if: runner.os == 'Linux' && inputs.libclang == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libclang-dev

    - name: Install the pinned Rust toolchain
      id: toolchain
      uses: ./.github/actions/rust-toolchain
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # Kept although the toolchain above is now the pinned one: it is cheap, and
    # a `--target` build cannot find its std if the active toolchain lacks it.
    - name: Add targets to the active toolchain
      if: inputs.targets != ''
      shell: bash
      run: |
        IFS=',' read -ra wanted <<<"${{ inputs.targets }}"
        for target in "${wanted[@]}"; do
          target="$(echo "$target" | tr -d '[:space:]')"
          [ -n "$target" ] || continue
          echo "rustup target add $target (active: $(rustup show active-toolchain))"
          rustup target add "$target"
        done

    # No environment hash: it covered every installed toolchain (so the runner's
    # own `stable` rolled every key on each Rust release) and every CARGO_*/RUST*
    # variable (so jobs that build the same thing could not share a cache).
    # Cargo's fingerprints already rebuild anything a different profile or flag
    # needs; the pinned channel in `key` is what must start a fresh cache.
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        prefix-key: v1-rust
        shared-key: ${{ inputs.shared-key }}
        key: ${{ steps.toolchain.outputs.channel }}
        add-rust-environment-hash-key: "false"
        cache-on-failure: ${{ inputs.cache-on-failure }}
        save-if: ${{ inputs.save-if }}
