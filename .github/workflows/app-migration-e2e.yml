name: App migration e2e

# E2E coverage for the per-context application migration pipeline. Triggers on
# any crates/** change - a narrow filter previously let regressions land unrun.

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "apps/migrations/**"
      - "workflows/app-migration/**"
      - ".github/workflows/app-migration-e2e.yml"
      - ".github/workflows/build-merod-image.yml"
      - ".github/actions/build-local-merod/**"
      - ".github/actions/setup-merobox/**"

  pull_request:
    branches: [master]
    paths:
      - "crates/**"
      - "apps/migrations/**"
      - "workflows/app-migration/**"
      - ".github/workflows/app-migration-e2e.yml"
      - ".github/workflows/build-merod-image.yml"
      - ".github/actions/build-local-merod/**"
      - ".github/actions/setup-merobox/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info,calimero_=debug
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  # merod:local and the WASM fixtures build as two parallel jobs; each uploads the
  # artifact the `scenario` matrix downloads instead of recompiling.
  build-merod:
    name: Build merod image
    uses: ./.github/workflows/build-merod-image.yml

  build-wasms:
    name: Build WASM fixtures
    runs-on: ubuntu-24.04-8cpu
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          # Read the warm e2e-rust-apps dependency cache, but never SAVE under
          # that key — build-merod owns it, and a second writer only races.
          shared-key: e2e-rust-apps
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build all WASM fixtures
        run: bash workflows/app-migration/build-wasms.sh

      - name: Upload WASM fixtures artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-migration-wasm-fixtures
          # Repo-root-relative roots so paths restore verbatim.
          path: |
            apps/migrations/**/res/*.wasm
            dist/*.mpk
          retention-days: 1
          if-no-files-found: error

  # Static guard (no merobox): asserts `calimero-abi diff` flags the deliberate
  # identity downgrade. Excluded from the live matrix since it's unsafe at runtime.
  schema-downgrade-guard:
    name: Schema downgrade guard
    runs-on: ubuntu-24.04-8cpu
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          # Read the warm e2e-rust-apps dependency cache, but never SAVE under that
          # key - build-merod owns it, and a second writer only races.
          shared-key: e2e-rust-apps
          save-if: false

      - name: Build calimero-abi
        run: cargo build -p mero-abi

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Emit downgrade-scenario state schemas
        run: |
          cargo mero build --manifest-path apps/migrations/scenario-identity-downgrade-v1/Cargo.toml
          cargo mero build --manifest-path apps/migrations/scenario-identity-downgrade-v2/Cargo.toml

      - name: calimero-abi diff must flag the identity downgrade
        run: |
          set +e
          # Capture stderr too (2>&1): on a compile/runtime failure the diagnostic would
          # otherwise be lost, printing a confusing "expected exit 1" against empty output.
          OUT=$(cargo run -q -p mero-abi -- diff \
            apps/migrations/scenario-identity-downgrade-v2/res/state-schema.json \
            apps/migrations/scenario-identity-downgrade-v1/res/state-schema.json 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 1 ]; then
            echo "::error::expected exit 1 (the downgrade must fail CI), got $CODE"
            exit 1
          fi
          echo "$OUT" | grep -q "UNSAFE_IDENTITY_DOWNGRADE" || {
            echo "::error::expected an UNSAFE_IDENTITY_DOWNGRADE finding"
            exit 1
          }
          echo "✓ identity downgrade correctly flagged and failed CI"

  # Fan-out: one matrix entry per workflow YAML, each downloading the pre-built
  # image + fixtures. fail-fast disabled so a flaky scenario doesn't mask others.
  scenario:
    name: ${{ matrix.workflow }} (${{ matrix.mode }})
    needs: [build-merod, build-wasms]
    runs-on: ubuntu-24.04-8cpu
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [dht]
        workflow:
          - 00-single-group-migration-baseline
          - 01-namespace-cascade-migration
          - 02-scenario-additive-field
          - 03-scenario-remove-field
          - 04-scenario-rename-field
          - 05-scenario-change-type
          - 06-scenario-new-method
          - 07-scenario-new-enum-variant
          - 08-scenario-pure-bugfix
          - 09-scenario-crdt-native
          - 10-scenario-struct-to-enum
          - 11-scenario-field-split
          - 12-scenario-field-remove-archive
          - 13-scenario-invariant-reshuffle
          - 14-cascade-status-rpc
          - 15-scenario-authored-map
          - 16-scenario-user-storage
          - 17-scenario-frozen-storage
          - 18-scenario-shared-storage
          - 19-scenario-authored-vector
          - 20-scenario-unordered-set
          - 21-reads-available-during-upgrade
          - 22-scenario-identity-downgrade
          - 26-owner-driven-authored
          - 28-get-migration-status
          - 29-migration-check-pass
          - 30-migration-check-fail-abort
          - 31-admin-abort-logical
          - 32-authored-migrate-ux
          - 33-authored-remaining-count
          - 35-two-namespaces-coexist
          - 36-chained-catchup
          # Stages the strand with merobox's admin-API `delete_blob` step, which
          # cascades parent+chunks+metadata.
          - 37-stranded-resync
          - 38-namespace-invite-join-regression
          - 39-missing-abi-refused
        # The only suite that advances a group's target, so the only place registry
        # coordinates resolve; dht ignores them, so this needs an http lane to exercise it.
        include:
          - workflow: 01-namespace-cascade-migration
            mode: http
    env:
      WORKFLOW: ${{ matrix.workflow }}
      MODE: ${{ matrix.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download merod image artifact
        uses: actions/download-artifact@v8
        with:
          name: merod-image
          path: /tmp

      - name: Load merod:local Docker image
        run: |
          zstd -d /tmp/merod-local.tar.zst --stdout | docker load
          docker images | grep merod || true

      - name: Download WASM fixtures
        uses: actions/download-artifact@v8
        with:
          name: app-migration-wasm-fixtures

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      # The image carries the node's application source, so the http lane needs
      # its base_url stamped at the address this runner's registry came up on.
      - name: Serve the fixtures over an http registry
        if: matrix.mode == 'http'
        run: |
          url=$(./scripts/e2e-fixture-registry.sh)
          scripts/set-registry-mode.sh merod:local http "$url"

      - name: Run workflow
        run: |
          mkdir -p docker-logs
          LOGDIR="$GITHUB_WORKSPACE/docker-logs"
          # merobox persists per-container logs to data/container-logs/<name>.log
          # on every bootstrap run, regardless of stop_all_nodes.

          [ "$MODE" = dht ] && IMAGE_SUFFIX=-dht || IMAGE_SUFFIX=

          set +e
          set -o pipefail
          merobox bootstrap run "workflows/app-migration/${WORKFLOW}.yml" \
              --image "merod:local${IMAGE_SUFFIX}" \
              --e2e-mode \
              --verbose 2>&1 | tee "docker-logs/merobox-${WORKFLOW}.log"
          wf_exit=${PIPESTATUS[0]}
          set +o pipefail

          for f in data/container-logs/*.log; do
              [ -e "$f" ] || continue
              cp -f "$f" "$LOGDIR/$(basename "$f")"
          done

          # A green http lane proves nothing on its own: the node logs an
          # acquisition whether the registry or a peer served it. Ask the fixture.
          if [ "$MODE" = http ] && [ "$wf_exit" -eq 0 ] \
              && ! docker logs fixture-registry 2>&1 | grep -q 'GET /artifacts/'; then
              echo "::error::${WORKFLOW} fetched nothing from fixture-registry; it did not use the http registry"
              wf_exit=1
          fi

          exit "$wf_exit"

      - name: Upload docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-migration-logs-${{ matrix.workflow }}
          path: docker-logs/
          retention-days: 7
          if-no-files-found: ignore
