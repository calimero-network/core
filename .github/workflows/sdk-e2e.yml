name: SDK E2E (paired)

# Behavioral gate: merod builds from this PR; mero-js e2e runs against it, and every manifest route must
# answer under 400. Pair via `sdk-ref: <branch>` in the PR body, else it runs against mero-js master.

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a master run.
concurrency:
  group: sdk-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

on:
  pull_request:
    # A path missing here doesn't skip this job, it just runs after merge on master instead (push below has
    # no filter). List any crate whose types the SDK re-encodes or whose HTTP surface it calls.
    paths:
      - "crates/server/**"
      - "crates/auth/**"
      - "crates/primitives/**"
      - "crates/merod/**"
      - "crates/governance-types/**"
      - "crates/governance-store/**"
      - "crates/context/**"
      - "crates/context/config/**"
      - "crates/node/**"
      - ".github/workflows/sdk-e2e.yml"
      - "scripts/resolve-paired-ref.sh"
      - "scripts/check-endpoint-coverage.sh"
      - "scripts/tests/check-endpoint-coverage.test.sh"
      - "scripts/tests/resolve-paired-ref.test.sh"
  push:
    branches:
      - master
  # Re-running a `pull_request` run replays the same paired ref (resolved from
  # the PR body at trigger time). Dispatch has no PR payload, so it resolves to master.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SERVER_PORT: "2428"
  TEE_SERVER_PORT: "2438"
  TEE_RELAY_SERVER_PORT: "2468"
  PAIR_SERVER_PORT: "2448"
  MN1_SERVER_PORT: "2458"
  MN2_SERVER_PORT: "2459"
  REGISTRY_PORT: "2468"
  # Minted at init (no first-login bootstrap secret); CI-only values for an
  # ephemeral localhost node - the password is consumed at init, not stored.
  MERO_AUTH_ADMIN_USER: dev
  MERO_AUTH_ADMIN_PASSWORD: dev-password
  # Read by mero-js's harness (resolveCreds()); pin here so both sides stay in lockstep.
  # Must meet the provider's minimum password length (default 8) - "dev" alone fails.
  MERO_E2E_USER: dev
  MERO_E2E_PASS: dev-password

jobs:
  coverage-gate:
    name: Coverage gate self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core (PR head)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Test check-endpoint-coverage.sh against fixtures
        run: bash scripts/tests/check-endpoint-coverage.test.sh

      - name: Test resolve-paired-ref.sh
        run: bash scripts/tests/resolve-paired-ref.test.sh

  sdk-e2e:
    name: SDK E2E (paired)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core (PR head)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust toolchain
        # Pinned to a commit SHA (supply-chain hygiene); comment tracks the tag.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-lock-deps
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build merod
        # `mock-attestation` only lets a node opt into `--mock-tee`; the main node
        # below runs without it, exactly as a default build would.
        run: cargo build -p merod --bin merod --features mock-attestation

      - name: Resolve mero-js ref (paired)
        id: sdkref
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          chmod +x scripts/resolve-paired-ref.sh
          REF="$(scripts/resolve-paired-ref.sh master)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Testing against mero-js@$REF"

      - name: Checkout mero-js (paired ref)
        uses: actions/checkout@v7
        with:
          repository: calimero-network/mero-js
          ref: ${{ steps.sdkref.outputs.ref }}
          path: _mero-js

      - name: Setup Node + pnpm
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install -g pnpm

      # The SDK half of the wire-fixture canary: only this job has both
      # checkouts. Node-free, so it runs before merod boots.
      - name: Wire contract (core fixtures vs SDK types)
        working-directory: _mero-js
        env:
          CALIMERO_CORE_DIR: ${{ github.workspace }}
        run: |
          pnpm install --frozen-lockfile
          pnpm test:contract

      - name: Serve mero-js's test bundle from a fixture registry
        # POST /install-application installs `package@version` from the node's
        # one configured registry, so it needs one that has the bundle. The
        # downloader's layout (artifacts/{package}/{version}/{package}-{version}.mpk),
        # keyed by the manifest's own package and appVersion, which the node
        # checks the bundle against. The coverage sweep installs it.
        run: |
          MPK=_mero-js/tests/e2e/assets/kv-store.mpk
          PKG=$(tar -xzOf "$MPK" manifest.json | jq -r .package)
          VER=$(tar -xzOf "$MPK" manifest.json | jq -r .appVersion)
          mkdir -p "fixture-registry/artifacts/$PKG/$VER"
          cp "$MPK" "fixture-registry/artifacts/$PKG/$VER/$PKG-$VER.mpk"
          (cd fixture-registry && exec python3 -m http.server "$REGISTRY_PORT" --bind 127.0.0.1) &
          echo "REGISTRY_PID=$!" >> "$GITHUB_ENV"
          echo "MERO_FIXTURE_REGISTRY_APP=$PKG@$VER" >> "$GITHUB_ENV"

      - name: Boot merod (embedded auth, single node)
        # --device-key-login lets mero-js log in as an ACCOUNT, which
        # POST /contexts/{context_id}/query requires; a password session gets a
        # 401 there. `cli` is the audience the suite's login names.
        run: |
          BIN="$PWD/target/debug/merod"
          "$BIN" --node ci-node init --server-port "$SERVER_PORT" --swarm-port 2528 --auth-mode embedded \
            --device-key-login --device-key-login-audience cli
          CALIMERO_REGISTRY_MODE=http CALIMERO_REGISTRY_URL="http://127.0.0.1:$REGISTRY_PORT/" \
            "$BIN" --node ci-node run &
          echo "MEROD_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:$SERVER_PORT/admin-api/health" >/dev/null 2>&1; then
              echo "merod healthy"; break
            fi
            sleep 2
            if [ "$i" = "60" ]; then echo "merod did not become healthy"; exit 1; fi
          done

      - name: Boot a mock-TEE merod (sealed transport suite)
        # A second node that attests with a mock quote, so the SDK can attest its
        # transport key and drive a whole session through /sealed/v2, with
        # sealing required.
        run: |
          BIN="$PWD/target/debug/merod"
          "$BIN" --node ci-tee init --server-port "$TEE_SERVER_PORT" --swarm-port 2538 --auth-mode embedded
          # Sealed-only: every request but attestation must come sealed, which
          # the suite checks (NODE_TEE_SEALED_ONLY below).
          printf '\n[server.sealed]\nrequired = true\n' >> "$HOME/.calimero/ci-tee/config.toml"
          "$BIN" --node ci-tee run --mock-tee &
          echo "MEROD_TEE_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:$TEE_SERVER_PORT/admin-api/health" >/dev/null 2>&1; then
              echo "mock-TEE merod healthy"; break
            fi
            sleep 2
            if [ "$i" = "60" ]; then echo "mock-TEE merod did not become healthy"; exit 1; fi
          done

      - name: Boot a mock-TEE relay (sealed delegated execution suite)
        # Shaped like a hosted fleet relay: auth left to a proxy (the default
        # auth mode), delegated execution public, a mock quote. mero-js's
        # sealed-relay suite attests it, submits a warrant-carrying intent
        # through a sealed session, and checks that a sealed request for a
        # route a proxy would guard is refused inside the envelope. Its setup
        # uses the admin API directly, which a proxy-mode node with no proxy in
        # front serves unguarded.
        run: |
          BIN="$PWD/target/debug/merod"
          "$BIN" --node ci-tee-relay init --server-port "$TEE_RELAY_SERVER_PORT" --swarm-port 2568 \
            --auth-mode proxy --delegated-access
          "$BIN" --node ci-tee-relay run --mock-tee &
          echo "MEROD_TEE_RELAY_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:$TEE_RELAY_SERVER_PORT/admin-api/health" >/dev/null 2>&1; then
              echo "mock-TEE relay healthy"; break
            fi
            sleep 2
            if [ "$i" = "60" ]; then echo "mock-TEE relay did not become healthy"; exit 1; fi
          done

      - name: Boot a fresh merod to pair onto the main node's account
        # mero-js's account-pairing-two-node suite pairs this node onto ci-node's
        # account, then names, rescopes and revokes it: the only way to reach
        # PUT /account/devices/{id}/label and /scope and the namespace revoke
        # with a 200, since they act only on a device the node certified. It must
        # have joined nothing, and the run spends it. No network link to ci-node
        # is needed; the holder answers every call itself.
        run: |
          BIN="$PWD/target/debug/merod"
          "$BIN" --node ci-pair init --server-port "$PAIR_SERVER_PORT" --swarm-port 2548 --auth-mode embedded
          "$BIN" --node ci-pair run &
          echo "MEROD_PAIR_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:$PAIR_SERVER_PORT/admin-api/health" >/dev/null 2>&1; then
              echo "pair merod healthy"; break
            fi
            sleep 2
            if [ "$i" = "60" ]; then echo "pair merod did not become healthy"; exit 1; fi
          done

      - name: Boot two linked merods (multi-node suite)
        # mero-js's multinode suite drives membership across two nodes: node-2
        # joins node-1's namespace and subgroups by invitation, leaves them, is
        # removed, and has its role, auto-follow and metadata set. A single node
        # can only refuse those routes. node-2 dials node-1 as its bootstrap peer
        # rather than relying on mDNS, so discovery cannot be what fails; without
        # a peer the join refuses with a 500 after the key-delivery timeout.
        run: |
          set -o pipefail
          BIN="$PWD/target/debug/merod"
          # init logs to stderr, which is where its peer id is.
          "$BIN" --node ci-mn1 init --server-port "$MN1_SERVER_PORT" --swarm-port 2558 \
            --auth-mode embedded 2>&1 | tee mn1-init.log
          MN1_PEER=$(grep -oE 'PeerId\("[^"]+"' mn1-init.log | head -1 | cut -d'"' -f2)
          [ -n "$MN1_PEER" ] || { echo "::error::no peer id in ci-mn1's init output"; exit 1; }
          "$BIN" --node ci-mn2 init --server-port "$MN2_SERVER_PORT" --swarm-port 2559 \
            --auth-mode embedded --boot-nodes "/ip4/127.0.0.1/tcp/2558/p2p/$MN1_PEER"
          "$BIN" --node ci-mn1 run &
          echo "MEROD_MN1_PID=$!" >> "$GITHUB_ENV"
          "$BIN" --node ci-mn2 run &
          echo "MEROD_MN2_PID=$!" >> "$GITHUB_ENV"
          for port in "$MN1_SERVER_PORT" "$MN2_SERVER_PORT"; do
            for i in $(seq 1 60); do
              if curl -fsS "http://localhost:$port/admin-api/health" >/dev/null 2>&1; then
                echo "merod on $port healthy"; break
              fi
              sleep 2
              if [ "$i" = "60" ]; then echo "merod on $port did not become healthy"; exit 1; fi
            done
          done

      - name: Verify the init-minted admin key answers a plain login
        # Confirms the init-minted key logs in before the SDK suite runs, so an
        # auth regression fails here with a clear message instead of buried in the suite.
        run: |
          BODY=$(jq -n --arg u "$MERO_E2E_USER" --arg p "$MERO_E2E_PASS" \
            --argjson ts "$(date +%s)" \
            '{auth_method: "user_password", public_key: $u,
              client_name: "sdk-e2e-ci", permissions: ["admin"], timestamp: $ts,
              provider_data: {username: $u, password: $p}}')
          RESP=$(curl -fsS -m 10 -X POST "http://localhost:$SERVER_PORT/auth/token" \
            -H 'Content-Type: application/json' -d "$BODY") || {
              echo "::error::admin login request failed"; exit 1; }
          TOKEN=$(echo "$RESP" | jq -r '.data.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::admin login did not return a token: $RESP"
            exit 1
          fi
          echo "init-minted admin key logs in for user $MERO_E2E_USER"

      - name: Run mero-js e2e against booted node
        working-directory: _mero-js
        env:
          NODE_BASE_URL: "http://localhost:${{ env.SERVER_PORT }}"
          # The sealed-transport suite runs against the mock-TEE node.
          NODE_TEE_URL: "http://localhost:${{ env.TEE_SERVER_PORT }}"
          NODE_TEE_SEALED_ONLY: "1"
          # The sealed delegated-execution suite runs against the mock-TEE relay.
          NODE_TEE_RELAY_URL: "http://localhost:${{ env.TEE_RELAY_SERVER_PORT }}"
          # The fresh node account-pairing-two-node pairs onto ci-node's account.
          MERO_PAIR_NODE_URL: "http://localhost:${{ env.PAIR_SERVER_PORT }}"
          # The two linked nodes the multinode suite runs across.
          MERO_MULTINODE: "1"
          MERO_NODE1_URL: "http://localhost:${{ env.MN1_SERVER_PORT }}"
          MERO_NODE2_URL: "http://localhost:${{ env.MN2_SERVER_PORT }}"
          # The e2e coverage recorder writes the endpoints it hit here.
          MERO_COVERAGE_OUT: "${{ github.workspace }}/_mero-js/covered-endpoints.json"
          # The warrant must be real merod output: the SDK cannot sign one, and
          # without it the delegated-authorship suite skips rather than fails.
          MEROD_BINARY: "${{ github.workspace }}/target/debug/merod"
          # MERO_E2E_USER / MERO_E2E_PASS are inherited from the workflow-level env;
          # don't re-declare here, or the suite may log in with different credentials.
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile
          pnpm test:e2e 2>&1 | tee e2e.log
          # A suite that skips passes silently. The sealed-relay suite skips
          # without its node or MEROD_BINARY, so when the paired mero-js has it,
          # require that it ran.
          # vitest colours its summary, so strip the escapes before matching.
          if [ -f tests/e2e/sealed-relay.test.ts ]; then
            sed -E 's/\x1b\[[0-9;]*m//g' e2e.log > e2e.plain.log
            grep -qE "sealed-relay\.test\.ts \([0-9]+ tests?\)" e2e.plain.log \
              || { echo "::error::sealed-relay suite did not run"; exit 1; }
            ! grep -qE "sealed-relay\.test\.ts.*skipped" e2e.plain.log \
              || { echo "::error::sealed-relay suite skipped"; exit 1; }
          fi

      - name: Endpoint coverage (manifest vs e2e hits)
        if: always()
        env:
          # A stale baseline entry fails a run paired with a mero-js branch, whose
          # PR is the one adding that coverage and so drops the entry. Against
          # mero-js master it only warns: the mero-js PR merges first, and core
          # master must stay green until the entry is dropped.
          STALE_BASELINE: ${{ steps.sdkref.outputs.ref == 'master' && 'warn' || 'fail' }}
        run: |
          COVERED="_mero-js/covered-endpoints.json"
          chmod +x scripts/check-endpoint-coverage.sh
          if [ -f "$COVERED" ]; then
            # A route with no call under 400 fails: never requested, or requested
            # and refused every time. coverage-baseline.json lists the accepted gaps.
            scripts/check-endpoint-coverage.sh \
              crates/server/endpoints.json "$COVERED" crates/server/coverage-baseline.json
          else
            echo "::warning::no covered-endpoints.json produced by the e2e run"
          fi

      - name: Stop merod
        if: always()
        # Guard the PID — an unset MEROD_PID would make `kill 0` signal the whole
        # process group (it never defaults to 0).
        run: |
          [ -n "${MEROD_PID:-}" ] && kill "$MEROD_PID" 2>/dev/null || true
          [ -n "${MEROD_TEE_PID:-}" ] && kill "$MEROD_TEE_PID" 2>/dev/null || true
          [ -n "${MEROD_TEE_RELAY_PID:-}" ] && kill "$MEROD_TEE_RELAY_PID" 2>/dev/null || true
          [ -n "${MEROD_PAIR_PID:-}" ] && kill "$MEROD_PAIR_PID" 2>/dev/null || true
          [ -n "${MEROD_MN1_PID:-}" ] && kill "$MEROD_MN1_PID" 2>/dev/null || true
          [ -n "${MEROD_MN2_PID:-}" ] && kill "$MEROD_MN2_PID" 2>/dev/null || true
          [ -n "${REGISTRY_PID:-}" ] && kill "$REGISTRY_PID" 2>/dev/null || true
