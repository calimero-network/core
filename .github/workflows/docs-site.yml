name: Deploy Docs Site (Starlight)

# Builds the Astro Starlight documentation site (docs/) and deploys it to
# GitHub Pages — this is the published documentation.
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yml'
      # The upgrade coverage matrix is written from the deep cases at build time.
      - 'crates/node/tests/fault/upgrade_deep.py'
      - 'crates/node/tests/fault/upgrade_cases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs, as GitHub's own Pages workflows have them: `deploy-pages` looks the
# artifact up through the API, and run in the job that had just uploaded it, it
# found none about half the time (`Found 0 artifact(s)`, from 24 Nov 2026).
# Across a job boundary the upload is finalised and listed before it is read.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
