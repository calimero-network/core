name: App ABI native clients

# The Swift and Kotlin clients `meroctl app codegen` writes, compiled with warnings as
# errors against this tree's SDKs (scripts/check-app-abi-clients.py): mero-swift's MeroKit
# on macOS, mero-kotlin's mero-core on Linux (sdks/clients/). `cargo test -p
# calimero-app-abi` pins what the generator writes (tests/golden); this checks it compiles
# and runs the round-trip tests of the app types' JSON (tests/native).
# Only a change to the generator, its goldens or those two SDKs runs it.

on:
  pull_request:
    branches: [master]
    paths:
      - "crates/app-abi/**"
      - "scripts/check-app-abi-clients.py"
      - ".github/workflows/app-abi-native-clients.yml"
      - "sdks/clients/mero-swift/**"
      - "sdks/clients/mero-kotlin/**"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
  push:
    branches: [master]
    paths:
      - "crates/app-abi/**"
      - "scripts/check-app-abi-clients.py"
      - ".github/workflows/app-abi-native-clients.yml"
      - "sdks/clients/mero-swift/**"
      - "sdks/clients/mero-kotlin/**"
      - "!**/*.md"
      - "!**/*.mdx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-abi-native-clients-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    name: Swift clients (mero-swift)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: swift build and test
        run: |
          swift --version
          python3 scripts/check-app-abi-clients.py swift

  kotlin:
    name: Kotlin clients (mero-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle compile and test
        run: |
          # The runner image's JDK 17 and Android SDK, as mero-kotlin's own CI uses.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          python3 scripts/check-app-abi-clients.py kotlin
