name: SDK mero-js

# mero-js (sdks/clients/mero-js, npm @calimero-network/mero-js): tested on every
# change that reaches it (sdks.yml, from scripts/sdks.py scope), published by
# release.yml from a core tag (`publish: true`), at the version package.json
# already states: VERSION (scripts/sdks.py version-check).
#
# The publish job declares no permissions of its own: a called workflow's job
# may not ask for more than its caller grants, and asking for `id-token: write`
# here would fail sdks.yml (contents: read) even with the job skipped. The
# caller grants `contents: read` and `id-token: write` (npm trusted publishing,
# OIDC; there is no npm token) to the job that calls this with `publish: true`.

on:
  workflow_call:
    inputs:
      publish:
        description: "Publish @calimero-network/mero-js to npm after the tests pass"
        type: boolean
        required: false
        default: false
      dry-run:
        description: "With publish: pack and run `npm publish --dry-run`, upload nothing"
        type: boolean
        required: false
        default: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/clients/mero-js
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdks/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sdks/pnpm-lock.yaml

      - name: Install the JS workspace
        working-directory: sdks
        run: pnpm install --frozen-lockfile

      # src/generated and the receipt vectors are those of this tree's
      # docs/public/openapi.json and crates/client/tests/fixtures.
      - name: Generated code matches this tree
        run: pnpm check:api

      - name: Build
        run: pnpm build

      - name: Build the examples
        run: pnpm build:examples

      - name: Unit tests
        run: pnpm test:unit

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck as a consumer of dist/
        run: pnpm typecheck:consumer

      - name: Typecheck the tests
        run: pnpm typecheck:tests

      - name: Lint
        run: pnpm lint

  publish:
    name: Publish to npm
    needs: test
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdks/package.json

      # Node 24's npm does trusted publishing (OIDC) with provenance.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@calimero-network"
          token: false

      - name: Every SDK states VERSION
        run: python3 scripts/sdks.py version-check

      - name: Install the JS workspace
        working-directory: sdks
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: sdks/clients/mero-js
        run: pnpm build

      - name: Publish @calimero-network/mero-js
        working-directory: sdks/clients/mero-js
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # The SDKs are on core's release line: core's newest release, an rc
          # included, is `latest` (the pre-1.0 numbers, 36.x and the like, are
          # retired; npm installs `latest`, not the highest version).
          tag=latest
          if [ "$DRY_RUN" != "true" ] \
            && [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish"
            exit 0
          fi
          # pnpm pack writes the tarball npm uploads (a workspace:* dependency
          # becomes the exact version there).
          rm -rf "$RUNNER_TEMP/pack" && mkdir -p "$RUNNER_TEMP/pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"
          tarball=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "$tarball" --access public --tag "$tag" --dry-run
            echo "::notice::dry run: would publish $name@$version (tag $tag)"
          else
            npm publish "$tarball" --provenance --access public --tag "$tag"
            echo "::notice::published $name@$version (tag $tag)"
          fi
