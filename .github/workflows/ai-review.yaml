name: AI Code Review

on:
  # Manual only: trigger via workflow_dispatch or the /ai-review PR comment
  # (see ai-review-trigger.yaml).
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number
      agents:
        description: "Number of agents (1-5)"
        required: false
        default: "3"
        type: choice
        options: ["1", "2", "3", "4", "5"]

concurrency:
  group: ai-review-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned to a commit of ai-code-reviewer master; bump it deliberately.
      - name: Install ai-code-reviewer
        run: pip install git+https://github.com/calimero-network/ai-code-reviewer.git@a065f220db4648dc0f01cd93bb4af9c832b80193

      - name: Determine PR number and agent count
        id: pr
        run: |
          echo "number=${GITHUB_EVENT_INPUTS_PR_NUMBER}" >> $GITHUB_OUTPUT
          echo "agents=${GITHUB_EVENT_INPUTS_AGENTS}"    >> $GITHUB_OUTPUT
        env:
          GITHUB_EVENT_INPUTS_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          GITHUB_EVENT_INPUTS_AGENTS: ${{ github.event.inputs.agents }}

      - name: Run AI Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Built-in token: the MeroReviewer App was removed from this repo
          # (it double-reviewed), so its installation token no longer exists.
          # Reviews post as github-actions[bot]; the body header still says
          # MeroReviewer via --reviewer-name, and past meroreviewer[bot]
          # reviews stay recognized via extra_reviewer_users in .ai-reviewer.yaml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PR_OUTPUTS_NUMBER: ${{ steps.pr.outputs.number }}
          STEPS_PR_OUTPUTS_AGENTS: ${{ steps.pr.outputs.agents }}
        run: |
          ai-reviewer review-pr \
            ${{ github.repository }} \
            ${STEPS_PR_OUTPUTS_NUMBER} \
            --config .ai-reviewer.yaml \
            --agents ${STEPS_PR_OUTPUTS_AGENTS} \
            --reviewer-name "MeroReviewer" \
            --output github
