name: ABI Contract (abi-codegen)

# Cross-repo contract: every ABI core emits must stay parseable by the downstream
# abi-codegen tool; expected RED until the paired mero-devtools-js change ships.

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    # edited: a changed `devtools-ref:` line in the PR body must re-resolve the pair.
    types: [opened, synchronize, reopened, edited]
    paths:
      - "crates/wasm-abi/**"
      - "apps/**"
      - "tools/calimero-abi/**"
      - "scripts/abi-contract-check.sh"
      - "scripts/resolve-paired-ref.sh"
      - "scripts/build-all-apps.sh"
      - ".github/workflows/abi-contract.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Bump to a release tag once the schema-sync change lands, to pin the contract
  # to a published version.
  DEVTOOLS_REF: main

jobs:
  abi-contract:
    name: ABI Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@v7
        with:
          # On pull_request, check out the PR head; on push, head.sha is empty so
          # fall back to the pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve mero-devtools-js ref (paired)
        id: devtoolsref
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          SDK_REPO: https://github.com/calimero-network/mero-devtools-js.git
          REF_KEY: devtools-ref
        run: |
          REF="$(bash scripts/resolve-paired-ref.sh "$DEVTOOLS_REF")"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Validating against mero-devtools-js@$REF"

      - name: Checkout mero-devtools-js
        uses: actions/checkout@v7
        with:
          repository: calimero-network/mero-devtools-js
          ref: ${{ steps.devtoolsref.outputs.ref }}
          path: mero-devtools-js

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: abi-contract
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mero-devtools-js/pnpm-lock.yaml

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build abi-codegen
        working-directory: mero-devtools-js
        run: |
          pnpm install --filter '@calimero-network/abi-codegen...'
          pnpm --filter '@calimero-network/abi-codegen' build

      - name: Run ABI contract check
        env:
          DEVTOOLS_DIR: ${{ github.workspace }}/mero-devtools-js
        run: |
          chmod +x scripts/abi-contract-check.sh
          ./scripts/abi-contract-check.sh
