    outputs:
      test_passed: ${{ steps.set-result-e2e.outputs.passed }}
      exit_code: ${{ steps.e2e-test.outputs.exit_code }}
    if: github.event.inputs.test_app == 'all' || github.event.inputs.test_app == 'scaffolding-e2e' || github.event.inputs.test_app == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: fuzzy-test-build-artifacts
          # upload-artifact strips the apps/ prefix (least-common-ancestor);
          # extract back under apps/ to match the fuzzy configs' paths.
          path: apps

      - name: Download build bundles
        uses: actions/download-artifact@v8
        with:
          name: fuzzy-test-build-bundles
          path: dist

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      - name: Override test duration
        env:
          EVENT_INPUTS_DURATION_OVERRIDE: ${{ github.event.inputs.duration_override }}
        run: |
          if [ -n "${EVENT_INPUTS_DURATION_OVERRIDE}" ]; then
            DURATION="${EVENT_INPUTS_DURATION_OVERRIDE}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            DURATION="60"
          else
            DURATION="15"
          fi
          echo "Using duration: ${DURATION} minutes (trigger: ${GITHUB_EVENT_NAME})"
          sed -i "s/\(duration_minutes: \)[0-9]*/\1$DURATION/" workflows/fuzzy-tests/scaffolding-e2e/fuzzy-test.yml

      - name: Create directories
        run: |
          mkdir -p fuzzy-test-logs/scaffolding-e2e
          mkdir -p profiling-data/scaffolding-e2e
          mkdir -p profiling-reports/scaffolding-e2e

      - name: Determine image to use
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          # Pins workflow_run runs to the triggering commit's image; empty otherwise.
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_INPUTS_ENABLE_PROFILING: ${{ github.event.inputs.enable_profiling }}
          EVENT_PULL_REQUEST_NUMBER_OR_0: ${{ github.event.pull_request.number || '0' }}
        run: |
          chmod +x scripts/determine-image-tag.sh
          if [ "${EVENT_INPUTS_ENABLE_PROFILING}" = "false" ]; then
            ./scripts/determine-image-tag.sh \
              "${GITHUB_EVENT_NAME}" \
              "${EVENT_PULL_REQUEST_NUMBER_OR_0}" \
              "${GITHUB_REPOSITORY_OWNER}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
              "${GH_TOKEN}"
            echo "profiling=false" >> $GITHUB_OUTPUT
          else
            ./scripts/determine-image-tag.sh \
              "${GITHUB_EVENT_NAME}" \
              "${EVENT_PULL_REQUEST_NUMBER_OR_0}" \
              "${GITHUB_REPOSITORY_OWNER}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
              "${GH_TOKEN}" \
              --profiling
            echo "profiling=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull Docker image
        env:
          STEPS_IMAGE_OUTPUTS_TAG: ${{ steps.image.outputs.tag }}
        run: |
          IMAGE="ghcr.io/calimero-network/merod:${STEPS_IMAGE_OUTPUTS_TAG}"
          docker pull "$IMAGE" || true
          # A soak test of the p2p paths, so its nodes resolve from each other.
          ./scripts/set-registry-mode.sh "$IMAGE" dht

      - name: Enable core dumps
        uses: ./.github/actions/enable-core-dumps

      - name: Setup vmagent for metrics collection
        id: setup-vmagent-e2e
        env:
          VICTORIA_METRICS_BEARER_TOKEN: ${{ secrets.VICTORIA_LB_METRICS_BEARER_TOKEN }}
          EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          chmod +x scripts/setup-vmagent.sh
          COMMIT_HASH="${EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT_HASH:0:7}"
          ./scripts/setup-vmagent.sh \
            "scaffolding-e2e" \
            "scaffolding-e2e-${SHORT_COMMIT}" \
            "${GITHUB_RUN_ID}" \
            "8431" \
            "$COMMIT_HASH" \
            "${GITHUB_REF_NAME}"

      - name: Run Scaffolding E2E Fuzzy Test with Metrics Collection
        id: e2e-test
        env:
          EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          STEPS_IMAGE_OUTPUTS_TAG: ${{ steps.image.outputs.tag }}
          STEPS_SETUP_VMAGENT_E2E_OUTPUTS_VMAGENT_DIR: ${{ steps.setup-vmagent-e2e.outputs.vmagent_dir }}
          STEPS_SETUP_VMAGENT_E2E_OUTPUTS_VICTORIA_URL: ${{ steps.setup-vmagent-e2e.outputs.victoria_url }}
          STEPS_SETUP_VMAGENT_E2E_OUTPUTS_AUTH_ENABLED: ${{ steps.setup-vmagent-e2e.outputs.auth_enabled }}
          STEPS_SETUP_VMAGENT_E2E_OUTPUTS_BEARER_TOKEN_FILE: ${{ steps.setup-vmagent-e2e.outputs.bearer_token_file }}
        run: |
          chmod +x scripts/run-vmagent.sh scripts/cleanup-vmagent.sh
          mkdir -p fuzzy-test-logs/scaffolding-e2e/docker-logs

          echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

          TEST_CASE="scaffolding-e2e"
          COMMIT_HASH="${EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT_HASH:0:7}"
          INSTANCE_NAME="${TEST_CASE}-${SHORT_COMMIT}"
          IMAGE="ghcr.io/calimero-network/merod:${STEPS_IMAGE_OUTPUTS_TAG}"
          FUZZY_CONFIG="workflows/fuzzy-tests/scaffolding-e2e/fuzzy-test.yml"
          NODE_COUNT=$(yq '.nodes.count' "$FUZZY_CONFIG")
          NODE_PREFIX=$(yq '.nodes.prefix' "$FUZZY_CONFIG")

          VMAGENT_STARTED="false"
          if "$GITHUB_WORKSPACE/scripts/run-vmagent.sh" \
            "$TEST_CASE" "$INSTANCE_NAME" "${GITHUB_RUN_ID}" "$COMMIT_HASH" "${GITHUB_REF_NAME}" \
            "${STEPS_SETUP_VMAGENT_E2E_OUTPUTS_VMAGENT_DIR}" \
            "${STEPS_SETUP_VMAGENT_E2E_OUTPUTS_VICTORIA_URL}" \
            "${STEPS_SETUP_VMAGENT_E2E_OUTPUTS_AUTH_ENABLED}" \
            "${STEPS_SETUP_VMAGENT_E2E_OUTPUTS_BEARER_TOKEN_FILE}" \
            "8431" "$NODE_PREFIX" "$NODE_COUNT" "2528" "1"; then
            VMAGENT_STARTED="true"
          fi

          UPDATE_PID=""
          VMAGENT_PID=""
          if [ "$VMAGENT_STARTED" = "true" ]; then
            UPDATE_PID=$(grep "^update_pid=" $GITHUB_OUTPUT | tail -1 | cut -d= -f2 || echo "")
            VMAGENT_PID=$(grep "^vmagent_pid=" $GITHUB_OUTPUT | tail -1 | cut -d= -f2 || echo "")
          fi

          # Native merobox per-container logs - see the kv-store case for the rationale.
          LOGDIR="$GITHUB_WORKSPACE/fuzzy-test-logs/scaffolding-e2e/docker-logs"
          rm -rf data/container-logs

          set +e
          set -o pipefail
          merobox bootstrap run \
              "$FUZZY_CONFIG" \
              --image "$IMAGE" \
              --e2e-mode \
              --verbose 2>&1 | tee fuzzy-test-logs/scaffolding-e2e/merobox-output.log

          exit_code=$?
          set +o pipefail

          for f in data/container-logs/*.log; do
              [ -e "$f" ] || continue
              cp -f "$f" "$LOGDIR/$(basename "$f")"
          done

          echo "end_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

          "$GITHUB_WORKSPACE/scripts/cleanup-vmagent.sh" \
            "$TEST_CASE" \
            "$UPDATE_PID" \
            "$VMAGENT_PID" \
            "/tmp/vmagent_scrape_${TEST_CASE}.yml" \
            "/tmp/vmagent-${TEST_CASE}.log" \
            "$exit_code" \
            "8431"

          exit $exit_code

      - name: Collect core dumps
        if: always()
        uses: ./.github/actions/collect-core-dumps
        with:
          suite: scaffolding-e2e
          image: ghcr.io/calimero-network/merod:${{ steps.image.outputs.tag }}

      - name: Collect fuzzy profiling
        if: always() && steps.image.outputs.profiling == 'true'
        uses: ./.github/actions/collect-fuzzy-profiling
        with:
          suite: scaffolding-e2e

      - name: Set test result
        id: set-result-e2e
        if: always()
        env:
          STEPS_E2E_TEST_OUTPUTS_EXIT_CODE: ${{ steps.e2e-test.outputs.exit_code }}
        run: |
          EXIT_CODE="${STEPS_E2E_TEST_OUTPUTS_EXIT_CODE}"
          if [ "$EXIT_CODE" = "0" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect Scaffolding E2E node logs
        if: always()
        run: |
          find workflows/fuzzy-tests/scaffolding-e2e -type d -name "logs" 2>/dev/null | while read logdir; do
            relpath=$(echo "$logdir" | sed 's|workflows/fuzzy-tests/scaffolding-e2e/||')
            mkdir -p "fuzzy-test-logs/scaffolding-e2e/$relpath"
            cp -r "$logdir"/* "fuzzy-test-logs/scaffolding-e2e/$relpath/" 2>/dev/null || true
          done

      - name: Collect and upload vmagent logs
        if: always()
        run: |
          if [ -f /tmp/vmagent-scaffolding-e2e.log ]; then
            mkdir -p fuzzy-test-logs/scaffolding-e2e
            cp /tmp/vmagent-scaffolding-e2e.log fuzzy-test-logs/scaffolding-e2e/vmagent.log
            [ -f /tmp/vmagent_scrape_scaffolding-e2e.yml ] && \
