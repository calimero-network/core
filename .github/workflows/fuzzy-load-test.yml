    name: Test Summary
    needs: [fuzzy-test-kv-store, fuzzy-test-handlers, fuzzy-test-scaffolding-e2e, fuzzy-test-group-governance]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        # Priority must match the duration-resolution blocks in the fuzzy-test
        # jobs above: duration_override wins, then schedule, then routine default.
        run: |
          if [ -n "${GITHUB_EVENT_INPUTS_DURATION_OVERRIDE}" ]; then
            RUN_KIND="Manual override (${GITHUB_EVENT_INPUTS_DURATION_OVERRIDE} min)"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            RUN_KIND="Nightly soak (60 min)"
          else
            RUN_KIND="Routine (15 min)"
          fi
          echo "## Fuzzy Load Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run kind:** ${RUN_KIND}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${GITHUB_EVENT_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "**Profiling Enabled:** ${EVENT_INPUTS_ENABLE_PROFILING_OR_TRUE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### KV Store Test" >> $GITHUB_STEP_SUMMARY
          if [ "${NEEDS_FUZZY_TEST_KV_STORE_RESULT}" = "skipped" ]; then
            echo "**SKIPPED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${NEEDS_FUZZY_TEST_KV_STORE_OUTPUTS_TEST_PASSED}" = "true" ]; then
            echo "**PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**FAILED** (exit code: ${NEEDS_FUZZY_TEST_KV_STORE_OUTPUTS_EXIT_CODE})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### KV Store with Handlers Test" >> $GITHUB_STEP_SUMMARY
          if [ "${NEEDS_FUZZY_TEST_HANDLERS_RESULT}" = "skipped" ]; then
            echo "**SKIPPED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${NEEDS_FUZZY_TEST_HANDLERS_OUTPUTS_TEST_PASSED}" = "true" ]; then
            echo "**PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**FAILED** (exit code: ${NEEDS_FUZZY_TEST_HANDLERS_OUTPUTS_EXIT_CODE})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### E2E KV Store Test" >> $GITHUB_STEP_SUMMARY
          if [ "${NEEDS_FUZZY_TEST_SCAFFOLDING_E2E_RESULT}" = "skipped" ]; then
            echo "**SKIPPED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${NEEDS_FUZZY_TEST_SCAFFOLDING_E2E_OUTPUTS_TEST_PASSED}" = "true" ]; then
            echo "**PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**FAILED** (exit code: ${NEEDS_FUZZY_TEST_SCAFFOLDING_E2E_OUTPUTS_EXIT_CODE})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Group Governance Test" >> $GITHUB_STEP_SUMMARY
          if [ "${NEEDS_FUZZY_TEST_GROUP_GOVERNANCE_RESULT}" = "skipped" ]; then
            echo "**SKIPPED**" >> $GITHUB_STEP_SUMMARY
          elif [ "${NEEDS_FUZZY_TEST_GROUP_GOVERNANCE_OUTPUTS_TEST_PASSED}" = "true" ]; then
            echo "**PASSED**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**FAILED** (exit code: ${NEEDS_FUZZY_TEST_GROUP_GOVERNANCE_OUTPUTS_EXIT_CODE})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Profiling Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`profiling-data-<suite>-*\`: per-node \`perf-*.data\` (CPU, frame-pointer call-graphs — merod in this image is built with \`-C force-frame-pointers=yes\`), \`perf-*.map\` (WASM JIT symbols), jemalloc \`*.heap\` dumps, and (when rendering succeeds) \`<node>/reports/flamegraph-{cpu,memory}-*.svg\`. Harvested from the node host data dirs (\`./data/<node>/profiling-dump/\`)." >> $GITHUB_STEP_SUMMARY
          echo "- \`profiling-reports-<suite>-*\`: just the rendered flamegraph SVGs (CPU + memory + icicle), lifted out of \`profiling-data-*\` into a small standalone artifact for quick browsing. Empty only when the in-container flamegraph render produced nothing for that run — in which case use the raw \`perf-*.data\` / \`*.heap\` in \`profiling-data-*\` directly." >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_EVENT_INPUTS_DURATION_OVERRIDE: ${{ github.event.inputs.duration_override }}
          NEEDS_FUZZY_TEST_KV_STORE_OUTPUTS_TEST_PASSED: ${{ needs.fuzzy-test-kv-store.outputs.test_passed }}
          NEEDS_FUZZY_TEST_KV_STORE_OUTPUTS_EXIT_CODE: ${{ needs.fuzzy-test-kv-store.outputs.exit_code }}
          NEEDS_FUZZY_TEST_HANDLERS_OUTPUTS_TEST_PASSED: ${{ needs.fuzzy-test-handlers.outputs.test_passed }}
          NEEDS_FUZZY_TEST_HANDLERS_OUTPUTS_EXIT_CODE: ${{ needs.fuzzy-test-handlers.outputs.exit_code }}
          NEEDS_FUZZY_TEST_SCAFFOLDING_E2E_OUTPUTS_TEST_PASSED: ${{ needs.fuzzy-test-scaffolding-e2e.outputs.test_passed }}
          NEEDS_FUZZY_TEST_SCAFFOLDING_E2E_OUTPUTS_EXIT_CODE: ${{ needs.fuzzy-test-scaffolding-e2e.outputs.exit_code }}
          NEEDS_FUZZY_TEST_GROUP_GOVERNANCE_OUTPUTS_TEST_PASSED: ${{ needs.fuzzy-test-group-governance.outputs.test_passed }}
          NEEDS_FUZZY_TEST_GROUP_GOVERNANCE_OUTPUTS_EXIT_CODE: ${{ needs.fuzzy-test-group-governance.outputs.exit_code }}
          EVENT_INPUTS_ENABLE_PROFILING_OR_TRUE: ${{ github.event.inputs.enable_profiling || 'true' }}
          NEEDS_FUZZY_TEST_KV_STORE_RESULT: ${{ needs.fuzzy-test-kv-store.result }}
          NEEDS_FUZZY_TEST_HANDLERS_RESULT: ${{ needs.fuzzy-test-handlers.result }}
          NEEDS_FUZZY_TEST_SCAFFOLDING_E2E_RESULT: ${{ needs.fuzzy-test-scaffolding-e2e.result }}
          NEEDS_FUZZY_TEST_GROUP_GOVERNANCE_RESULT: ${{ needs.fuzzy-test-group-governance.result }}
