        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzzy-test-scaffolding-e2e-${{ github.run_number }}-${{ github.run_id }}
          path: fuzzy-test-logs/scaffolding-e2e/
          retention-days: 30
          compression-level: 6


