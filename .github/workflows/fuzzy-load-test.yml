name: Fuzzy Load Test - Long Running Performance

permissions:
  contents: read

on:
  # Runs after Release republishes merod:edge-profiling, so fuzzy-load-test
  # exercises the fresh image. Gated on Release success via the job-level `if` below.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [master]
  # Paths that don't require an image rebuild. `crates/**` is omitted -
  # Release already rebuilds the image for it and workflow_run above covers it.
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "workflows/fuzzy-tests/**"
      - ".github/workflows/fuzzy-load-test.yml"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
      - "apps/kv-store/GUIDE.md"
  # Only fires on profiling-image paths; release.yml publishes pr-<N>-profiling
  # for the same set first. Same-repo PRs only; crates/**/apps/** excluded for cost.
  pull_request:
    paths:
      - "scripts/profiling/**"
      - ".github/workflows/deps/prebuilt.profiling.Dockerfile"
      - ".github/workflows/fuzzy-load-test.yml"
      - "workflows/fuzzy-tests/**"

  # Nightly soak runs a longer window (60 min vs. 15) to catch slow leaks
  # and gradual degradation that need more time to surface.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      duration_override:
        description: "Override test duration (minutes per app). Empty = default (15 normally, 60 for scheduled nightly soak)."
        required: false
        default: ""
        type: string
      test_app:
        description: "Run specific app test (kv-store, kv-store-with-handlers, scaffolding-e2e, group-governance, or all)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - kv-store
          - kv-store-with-handlers
          - scaffolding-e2e
          - group-governance
      enable_profiling:
        description: "Use profiling image (merod:edge-profiling) with CPU and memory profiling enabled"
        required: false
        default: true
        type: boolean

# Every master run (workflow_run, push, schedule, dispatch) gets its own group,
# so none is cancelled or dropped as pending when the next merge queues one: each
# collects its own soak data. PR runs stay serialized per PR ref. Under
# workflow_run and schedule, github.ref is the default branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info,calimero_=debug
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Give merobox enough time on container stop to let perf flush perf.data.
  MEROBOX_STOP_TIMEOUT: 120

jobs:
  build:
    name: Build Apps
    runs-on: ubuntu-24.04-8cpu
    # Under workflow_run, follow only a successful Release from a push to this repo: a fork PR's
    # Release run also matches `branches`, and its code must not get secrets or save caches here.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Under workflow_run, github.sha is the default-branch HEAD, not
          # the commit Release built from; pin to that commit instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          # e2e's Build Apps owns this cache; a saver on every branch only crowded it out.
          shared-key: wasm-apps
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build kv-store app
        run: cargo mero build --manifest-path apps/kv-store/Cargo.toml
        env:
          WASM_PROFILING: "true"

      - name: Build kv-store bundle
        run: (cd apps/kv-store && cargo mero bundle --dev --no-icon)
        env:
          WASM_PROFILING: "true"

      - name: Build kv-store-with-handlers app
        run: cargo mero build --manifest-path apps/kv-store-with-handlers/Cargo.toml
        env:
          WASM_PROFILING: "true"

      - name: Build kv-store-with-handlers bundle
        run: (cd apps/kv-store-with-handlers && cargo mero bundle --dev --no-icon)
        env:
          WASM_PROFILING: "true"

      - name: Build scaffolding-e2e app
        run: cargo mero build --manifest-path apps/scaffolding-e2e/Cargo.toml
        env:
          WASM_PROFILING: "true"

      - name: Build scaffolding-e2e multi-service bundle
        run: (cd apps/scaffolding-e2e && cargo mero bundle --dev --no-icon)
        env:
          WASM_PROFILING: "true"

      # Covers existence too; an oversized module fails here with a size,
      # not 20 minutes later as an opaque context-creation error.
      - name: Verify WASM files exist and fit the runtime module-size limit
        run: |
          ls -la apps/kv-store/res/
          ls -la apps/kv-store-with-handlers/res/
          ls -la apps/scaffolding-e2e/res/
          ./scripts/check-wasm-size.sh

      # Use artifacts for same-run handoff between jobs (faster than cache for this use case)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fuzzy-test-build-artifacts
          path: |
            apps/kv-store/res/*.wasm
            apps/kv-store-with-handlers/res/*.wasm
            apps/scaffolding-e2e/res/*.wasm
          retention-days: 1

      - name: Upload build bundles
        uses: actions/upload-artifact@v7
        with:
          name: fuzzy-test-build-bundles
          path: dist/*.mpk
          retention-days: 1

  fuzzy-test-kv-store:
    name: Run KV Store Fuzzy Test with Profiling
    needs: build
    runs-on: big-machine
    timeout-minutes: 150
    outputs:
      test_passed: ${{ steps.set-result.outputs.passed }}
      exit_code: ${{ steps.kv-test.outputs.exit_code }}
    if: github.event.inputs.test_app == 'all' || github.event.inputs.test_app == 'kv-store' || github.event.inputs.test_app == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Under workflow_run, github.sha is the default-branch HEAD, not
          # the commit Release built from; pin to that commit instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: fuzzy-test-build-artifacts
          # upload-artifact strips the apps/ prefix (least-common-ancestor);
          # extract back under apps/ to match the fuzzy configs' paths.
          path: apps

      - name: Download build bundles
        uses: actions/download-artifact@v8
        with:
          name: fuzzy-test-build-bundles
          path: dist

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      - name: Override test duration
        # duration_override wins if set; otherwise 60min for the nightly
        # schedule, else 15min.
        env:
          EVENT_INPUTS_DURATION_OVERRIDE: ${{ github.event.inputs.duration_override }}
        run: |
          if [ -n "${EVENT_INPUTS_DURATION_OVERRIDE}" ]; then
            DURATION="${EVENT_INPUTS_DURATION_OVERRIDE}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            DURATION="60"
          else
            DURATION="15"
          fi
          echo "Using duration: ${DURATION} minutes (trigger: ${GITHUB_EVENT_NAME})"
          sed -i "s/\(duration_minutes: \)[0-9]*/\1$DURATION/" workflows/fuzzy-tests/kv-store/fuzzy-test.yml

      - name: Create directories
        run: |
          mkdir -p fuzzy-test-logs/kv-store
          mkdir -p profiling-data/kv-store
          mkdir -p profiling-reports/kv-store

      - name: Determine image to use
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          # Pins workflow_run runs to the triggering commit's image; empty otherwise.
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_INPUTS_ENABLE_PROFILING: ${{ github.event.inputs.enable_profiling }}
          EVENT_PULL_REQUEST_NUMBER_OR_0: ${{ github.event.pull_request.number || '0' }}
        run: |
          chmod +x scripts/determine-image-tag.sh
          if [ "${EVENT_INPUTS_ENABLE_PROFILING}" = "false" ]; then
            ./scripts/determine-image-tag.sh \
              "${GITHUB_EVENT_NAME}" \
              "${EVENT_PULL_REQUEST_NUMBER_OR_0}" \
              "${GITHUB_REPOSITORY_OWNER}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
              "${GH_TOKEN}"
            echo "profiling=false" >> $GITHUB_OUTPUT
          else
            ./scripts/determine-image-tag.sh \
              "${GITHUB_EVENT_NAME}" \
              "${EVENT_PULL_REQUEST_NUMBER_OR_0}" \
              "${GITHUB_REPOSITORY_OWNER}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
              "${GH_TOKEN}" \
              --profiling
            echo "profiling=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull Docker image
        env:
          STEPS_IMAGE_OUTPUTS_TAG: ${{ steps.image.outputs.tag }}
        run: |
          IMAGE="ghcr.io/calimero-network/merod:${STEPS_IMAGE_OUTPUTS_TAG}"
          docker pull "$IMAGE" || true
          # A soak test of the p2p paths, so its nodes resolve from each other.
          ./scripts/set-registry-mode.sh "$IMAGE" dht

      - name: Enable core dumps
        uses: ./.github/actions/enable-core-dumps

      - name: Setup vmagent for metrics collection
        id: setup-vmagent
        env:
          VICTORIA_METRICS_BEARER_TOKEN: ${{ secrets.VICTORIA_LB_METRICS_BEARER_TOKEN }}
          EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          chmod +x scripts/setup-vmagent.sh
          COMMIT_HASH="${EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT_HASH:0:7}"
          ./scripts/setup-vmagent.sh \
            "kv-store" \
            "kv-store-${SHORT_COMMIT}" \
            "${GITHUB_RUN_ID}" \
            "8429" \
            "$COMMIT_HASH" \
            "${GITHUB_REF_NAME}"

      - name: Run KV Store Fuzzy Test with Metrics Collection
        id: kv-test
        env:
          EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          STEPS_IMAGE_OUTPUTS_TAG: ${{ steps.image.outputs.tag }}
          STEPS_SETUP_VMAGENT_OUTPUTS_VMAGENT_DIR: ${{ steps.setup-vmagent.outputs.vmagent_dir }}
          STEPS_SETUP_VMAGENT_OUTPUTS_VICTORIA_URL: ${{ steps.setup-vmagent.outputs.victoria_url }}
          STEPS_SETUP_VMAGENT_OUTPUTS_AUTH_ENABLED: ${{ steps.setup-vmagent.outputs.auth_enabled }}
          STEPS_SETUP_VMAGENT_OUTPUTS_BEARER_TOKEN_FILE: ${{ steps.setup-vmagent.outputs.bearer_token_file }}
        run: |
          chmod +x scripts/run-vmagent.sh scripts/cleanup-vmagent.sh
          mkdir -p fuzzy-test-logs/kv-store/docker-logs

          echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

          TEST_CASE="kv-store"
          COMMIT_HASH="${EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT_HASH:0:7}"
          INSTANCE_NAME="${TEST_CASE}-${SHORT_COMMIT}"
          IMAGE="ghcr.io/calimero-network/merod:${STEPS_IMAGE_OUTPUTS_TAG}"
          FUZZY_CONFIG="workflows/fuzzy-tests/kv-store/fuzzy-test.yml"
          NODE_COUNT=$(yq '.nodes.count' "$FUZZY_CONFIG")
          NODE_PREFIX=$(yq '.nodes.prefix' "$FUZZY_CONFIG")

          VMAGENT_STARTED="false"
          if "$GITHUB_WORKSPACE/scripts/run-vmagent.sh" \
            "$TEST_CASE" "$INSTANCE_NAME" "${GITHUB_RUN_ID}" "$COMMIT_HASH" "${GITHUB_REF_NAME}" \
            "${STEPS_SETUP_VMAGENT_OUTPUTS_VMAGENT_DIR}" \
            "${STEPS_SETUP_VMAGENT_OUTPUTS_VICTORIA_URL}" \
            "${STEPS_SETUP_VMAGENT_OUTPUTS_AUTH_ENABLED}" \
            "${STEPS_SETUP_VMAGENT_OUTPUTS_BEARER_TOKEN_FILE}" \
            "8429" "$NODE_PREFIX" "$NODE_COUNT" "2528" "1"; then
            VMAGENT_STARTED="true"
          fi

          UPDATE_PID=""
          VMAGENT_PID=""
          if [ "$VMAGENT_STARTED" = "true" ]; then
            UPDATE_PID=$(grep "^update_pid=" $GITHUB_OUTPUT | tail -1 | cut -d= -f2 || echo "")
            VMAGENT_PID=$(grep "^vmagent_pid=" $GITHUB_OUTPUT | tail -1 | cut -d= -f2 || echo "")
          fi

          # merobox writes per-container logs to data/container-logs/ on every
          # run; clear it first since test cases run sequentially and share it.
          LOGDIR="$GITHUB_WORKSPACE/fuzzy-test-logs/kv-store/docker-logs"
          rm -rf data/container-logs

          set +e
          set -o pipefail
          merobox bootstrap run \
              "$FUZZY_CONFIG" \
              --image "$IMAGE" \
              --e2e-mode \
              --verbose 2>&1 | tee fuzzy-test-logs/kv-store/merobox-output.log

          exit_code=$?
          set +o pipefail

          for f in data/container-logs/*.log; do
              [ -e "$f" ] || continue
              cp -f "$f" "$LOGDIR/$(basename "$f")"
          done

          echo "end_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

          "$GITHUB_WORKSPACE/scripts/cleanup-vmagent.sh" \
            "$TEST_CASE" \
            "$UPDATE_PID" \
            "$VMAGENT_PID" \
            "/tmp/vmagent_scrape_${TEST_CASE}.yml" \
            "/tmp/vmagent-${TEST_CASE}.log" \
            "$exit_code" \
            "8429"

          exit $exit_code

      - name: Collect core dumps
        if: always()
        uses: ./.github/actions/collect-core-dumps
        with:
          suite: kv-store
          image: ghcr.io/calimero-network/merod:${{ steps.image.outputs.tag }}

      - name: Collect fuzzy profiling
        if: always() && steps.image.outputs.profiling == 'true'
        uses: ./.github/actions/collect-fuzzy-profiling
        with:
          suite: kv-store

      - name: Set test result
        id: set-result
        if: always()
        env:
          STEPS_KV_TEST_OUTPUTS_EXIT_CODE: ${{ steps.kv-test.outputs.exit_code }}
        run: |
          EXIT_CODE="${STEPS_KV_TEST_OUTPUTS_EXIT_CODE}"
          if [ "$EXIT_CODE" = "0" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect KV Store node logs
        if: always()
        run: |
          find workflows/fuzzy-tests/kv-store -type d -name "logs" 2>/dev/null | while read logdir; do
            relpath=$(echo "$logdir" | sed 's|workflows/fuzzy-tests/kv-store/||')
            mkdir -p "fuzzy-test-logs/kv-store/$relpath"
            cp -r "$logdir"/* "fuzzy-test-logs/kv-store/$relpath/" 2>/dev/null || true
          done

      - name: Collect and upload vmagent logs
        if: always()
        run: |
          if [ -f /tmp/vmagent-kv-store.log ]; then
            mkdir -p fuzzy-test-logs/kv-store
            cp /tmp/vmagent-kv-store.log fuzzy-test-logs/kv-store/vmagent.log
            [ -f /tmp/vmagent_scrape_kv-store.yml ] && \
              cp /tmp/vmagent_scrape_kv-store.yml fuzzy-test-logs/kv-store/vmagent_config.yml
          fi

      - name: Upload KV Store test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzzy-test-kv-store-${{ github.run_number }}-${{ github.run_id }}
          path: fuzzy-test-logs/kv-store/
          retention-days: 30
          compression-level: 6


  fuzzy-test-handlers:
    name: Run KV Store with Handlers Fuzzy Test with Profiling
    needs: build
    runs-on: big-machine
    timeout-minutes: 150
    outputs:
      test_passed: ${{ steps.set-result-handlers.outputs.passed }}
      exit_code: ${{ steps.handlers-test.outputs.exit_code }}
    if: github.event.inputs.test_app == 'all' || github.event.inputs.test_app == 'kv-store-with-handlers' || github.event.inputs.test_app == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Under workflow_run, github.sha is the default-branch HEAD, not
          # the commit Release built from; pin to that commit instead.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: fuzzy-test-build-artifacts
          # upload-artifact strips the apps/ prefix (least-common-ancestor);
          # extract back under apps/ to match the fuzzy configs' paths.
          path: apps

      - name: Download build bundles
        uses: actions/download-artifact@v8
        with:
          name: fuzzy-test-build-bundles
          path: dist

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      - name: Override test duration
        env:
          EVENT_INPUTS_DURATION_OVERRIDE: ${{ github.event.inputs.duration_override }}
        run: |
          if [ -n "${EVENT_INPUTS_DURATION_OVERRIDE}" ]; then
            DURATION="${EVENT_INPUTS_DURATION_OVERRIDE}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            DURATION="60"
          else
            DURATION="15"
          fi
          echo "Using duration: ${DURATION} minutes (trigger: ${GITHUB_EVENT_NAME})"
          sed -i "s/\(duration_minutes: \)[0-9]*/\1$DURATION/" workflows/fuzzy-tests/kv-store-with-handlers/fuzzy-test.yml

      - name: Create directories
        run: |
          mkdir -p fuzzy-test-logs/kv-store-with-handlers
          mkdir -p profiling-data/kv-store-with-handlers
          mkdir -p profiling-reports/kv-store-with-handlers

      - name: Determine image to use
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          # Pins workflow_run runs to the triggering commit's image; empty otherwise.
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_INPUTS_ENABLE_PROFILING: ${{ github.event.inputs.enable_profiling }}
          EVENT_PULL_REQUEST_NUMBER_OR_0: ${{ github.event.pull_request.number || '0' }}
        run: |
          chmod +x scripts/determine-image-tag.sh
          if [ "${EVENT_INPUTS_ENABLE_PROFILING}" = "false" ]; then
            ./scripts/determine-image-tag.sh \
              "${GITHUB_EVENT_NAME}" \
              "${EVENT_PULL_REQUEST_NUMBER_OR_0}" \
              "${GITHUB_REPOSITORY_OWNER}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
              "${GH_TOKEN}"
            echo "profiling=false" >> $GITHUB_OUTPUT
          else
            ./scripts/determine-image-tag.sh \
              "${GITHUB_EVENT_NAME}" \
              "${EVENT_PULL_REQUEST_NUMBER_OR_0}" \
              "${GITHUB_REPOSITORY_OWNER}" \
              "${GITHUB_REPOSITORY}" \
              "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
              "${GH_TOKEN}" \
              --profiling
            echo "profiling=true" >> $GITHUB_OUTPUT
          fi

      - name: Pull Docker image
        env:
          STEPS_IMAGE_OUTPUTS_TAG: ${{ steps.image.outputs.tag }}
        run: |
          IMAGE="ghcr.io/calimero-network/merod:${STEPS_IMAGE_OUTPUTS_TAG}"
          docker pull "$IMAGE" || true
          # A soak test of the p2p paths, so its nodes resolve from each other.
          ./scripts/set-registry-mode.sh "$IMAGE" dht

      - name: Enable core dumps
        uses: ./.github/actions/enable-core-dumps

      - name: Setup vmagent for metrics collection
        id: setup-vmagent-handlers
        env:
          VICTORIA_METRICS_BEARER_TOKEN: ${{ secrets.VICTORIA_LB_METRICS_BEARER_TOKEN }}
          EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          chmod +x scripts/setup-vmagent.sh
          COMMIT_HASH="${EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT_HASH:0:7}"
          ./scripts/setup-vmagent.sh \
            "kv-store-with-handlers" \
            "kv-store-with-handlers-${SHORT_COMMIT}" \
            "${GITHUB_RUN_ID}" \
            "8430" \
            "$COMMIT_HASH" \
            "${GITHUB_REF_NAME}"

      - name: Run Handlers Fuzzy Test with Metrics Collection
        id: handlers-test
        env:
          EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          STEPS_IMAGE_OUTPUTS_TAG: ${{ steps.image.outputs.tag }}
          STEPS_SETUP_VMAGENT_HANDLERS_OUTPUTS_VMAGENT_DIR: ${{ steps.setup-vmagent-handlers.outputs.vmagent_dir }}
          STEPS_SETUP_VMAGENT_HANDLERS_OUTPUTS_VICTORIA_URL: ${{ steps.setup-vmagent-handlers.outputs.victoria_url }}
          STEPS_SETUP_VMAGENT_HANDLERS_OUTPUTS_AUTH_ENABLED: ${{ steps.setup-vmagent-handlers.outputs.auth_enabled }}
          STEPS_SETUP_VMAGENT_HANDLERS_OUTPUTS_BEARER_TOKEN_FILE: ${{ steps.setup-vmagent-handlers.outputs.bearer_token_file }}
        run: |
          chmod +x scripts/run-vmagent.sh scripts/cleanup-vmagent.sh
          mkdir -p fuzzy-test-logs/kv-store-with-handlers/docker-logs

          echo "start_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

          TEST_CASE="kv-store-with-handlers"
          COMMIT_HASH="${EVENT_WORKFLOW_RUN_HEAD_SHA_OR_GITHUB_SHA}"
          SHORT_COMMIT="${COMMIT_HASH:0:7}"
          INSTANCE_NAME="${TEST_CASE}-${SHORT_COMMIT}"
          IMAGE="ghcr.io/calimero-network/merod:${STEPS_IMAGE_OUTPUTS_TAG}"
          FUZZY_CONFIG="workflows/fuzzy-tests/kv-store-with-handlers/fuzzy-test.yml"
          NODE_COUNT=$(yq '.nodes.count' "$FUZZY_CONFIG")
          NODE_PREFIX=$(yq '.nodes.prefix' "$FUZZY_CONFIG")

          VMAGENT_STARTED="false"
          if "$GITHUB_WORKSPACE/scripts/run-vmagent.sh" \
            "$TEST_CASE" "$INSTANCE_NAME" "${GITHUB_RUN_ID}" "$COMMIT_HASH" "${GITHUB_REF_NAME}" \
            "${STEPS_SETUP_VMAGENT_HANDLERS_OUTPUTS_VMAGENT_DIR}" \
            "${STEPS_SETUP_VMAGENT_HANDLERS_OUTPUTS_VICTORIA_URL}" \
            "${STEPS_SETUP_VMAGENT_HANDLERS_OUTPUTS_AUTH_ENABLED}" \
            "${STEPS_SETUP_VMAGENT_HANDLERS_OUTPUTS_BEARER_TOKEN_FILE}" \
            "8430" "$NODE_PREFIX" "$NODE_COUNT" "2528" "1"; then
            VMAGENT_STARTED="true"
          fi

          UPDATE_PID=""
          VMAGENT_PID=""
          if [ "$VMAGENT_STARTED" = "true" ]; then
            UPDATE_PID=$(grep "^update_pid=" $GITHUB_OUTPUT | tail -1 | cut -d= -f2 || echo "")
            VMAGENT_PID=$(grep "^vmagent_pid=" $GITHUB_OUTPUT | tail -1 | cut -d= -f2 || echo "")
          fi

          # Native merobox per-container logs - see the kv-store case for the rationale.
          LOGDIR="$GITHUB_WORKSPACE/fuzzy-test-logs/kv-store-with-handlers/docker-logs"
          rm -rf data/container-logs

          set +e
          set -o pipefail
          merobox bootstrap run \
              "$FUZZY_CONFIG" \
              --image "$IMAGE" \
              --e2e-mode \
              --verbose 2>&1 | tee fuzzy-test-logs/kv-store-with-handlers/merobox-output.log

          exit_code=$?
          set +o pipefail

          for f in data/container-logs/*.log; do
              [ -e "$f" ] || continue
              cp -f "$f" "$LOGDIR/$(basename "$f")"
          done

          echo "end_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT

