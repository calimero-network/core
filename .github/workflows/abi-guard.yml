name: ABI Guard

permissions:
  contents: read

on:
  pull_request:
    branches:
      - feat/abi_v1
      - master
  push:
    branches:
      - feat/abi_v1
      - master

jobs:
  abi-validation:
    name: ABI Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
        
      # The pinned toolchain and the wasm-apps cache (read-only here).
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: wasm-apps
          save-if: false
            
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          
      - name: Build the conformance apps
        run: |
          cargo build -p abi_conformance --target wasm32-unknown-unknown
          cargo build -p abi_conformance_resolved --target wasm32-unknown-unknown

      - name: Build calimero-abi extractor
        run: |
          cargo build --manifest-path tools/calimero-abi/Cargo.toml
          
      # verify-abi.sh and check-kv-store-fixture.sh take this binary instead of compiling their own.
      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Run ABI verification
        run: |
          chmod +x scripts/verify-abi.sh
          ./scripts/verify-abi.sh

      - name: Check the kv-store fixture is self-describing
        run: ./scripts/check-kv-store-fixture.sh

      # The positive case of verify-abi.sh's self-diff: `mero-abi diff` must flag
      # a deliberate AuthoredMap -> UnorderedMap identity downgrade.
      - name: Emit the identity-downgrade state schemas
        run: |
          cargo mero build --manifest-path apps/migrations/scenario-identity-downgrade-v1/Cargo.toml
          cargo mero build --manifest-path apps/migrations/scenario-identity-downgrade-v2/Cargo.toml

      - name: mero-abi diff must flag the identity downgrade
        run: |
          set +e
          # Capture stderr too (2>&1): on a compile/runtime failure the diagnostic would
          # otherwise be lost, printing a confusing "expected exit 1" against empty output.
          OUT=$(cargo run -q -p mero-abi -- diff \
            apps/migrations/scenario-identity-downgrade-v2/res/state-schema.json \
            apps/migrations/scenario-identity-downgrade-v1/res/state-schema.json 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 1 ]; then
            echo "::error::expected exit 1 (the downgrade must fail CI), got $CODE"
            exit 1
          fi
          echo "$OUT" | grep -q "UNSAFE_IDENTITY_DOWNGRADE" || {
            echo "::error::expected an UNSAFE_IDENTITY_DOWNGRADE finding"
            exit 1
          }
          echo "identity downgrade correctly flagged and failed CI"
          
      - name: Build state-schema-conformance
        run: |
          cargo build -p state-schema-conformance --target wasm32-unknown-unknown
          
      - name: Run state schema conformance tests
        run: |
          chmod +x apps/state-schema-conformance/verify-state-schema.sh
          ./apps/state-schema-conformance/verify-state-schema.sh
          
      - name: Run unit tests
        run: |
          cargo test -p calimero-wasm-abi --test invariants
