name: ABI Guard

permissions:
  contents: read

on:
  pull_request:
    branches:
      - feat/abi_v1
      - master
  push:
    branches:
      - feat/abi_v1
      - master

jobs:
  abi-validation:
    name: ABI Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
        
      # The pinned toolchain and the wasm-apps cache, which only e2e's Build Apps saves.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: wasm-apps
          save-if: false
            
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          
      - name: Build the conformance apps
        run: |
          cargo build -p abi_conformance --target wasm32-unknown-unknown
          cargo build -p abi_conformance_resolved --target wasm32-unknown-unknown

      - name: Build calimero-abi extractor
        run: |
          cargo build --manifest-path tools/calimero-abi/Cargo.toml
          
      # verify-abi.sh and check-kv-store-fixture.sh take this binary instead of compiling their own.
      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Run ABI verification
        run: |
          chmod +x scripts/verify-abi.sh
          ./scripts/verify-abi.sh

      - name: Check the kv-store fixture is self-describing
        run: ./scripts/check-kv-store-fixture.sh
          
      - name: Build state-schema-conformance
        run: |
          cargo build -p state-schema-conformance --target wasm32-unknown-unknown
          
      - name: Run state schema conformance tests
        run: |
          chmod +x apps/state-schema-conformance/verify-state-schema.sh
          ./apps/state-schema-conformance/verify-state-schema.sh
          
      - name: Run unit tests
        run: |
          cargo test -p calimero-wasm-abi --test invariants
