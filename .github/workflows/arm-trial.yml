name: Arm trial

# TEMPORARY: removed before this PR merges. Times the workspace tests on the
# free x86_64 and arm64 standard runners, both from a cold cache so neither has
# a head start, to decide whether the compile-and-test jobs move to arm64.
on:
  pull_request:
    paths:
      - ".github/workflows/arm-trial.yml"

permissions:
  contents: read

concurrency:
  group: arm-trial-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust-test:
    name: Rust tests, cold (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: arm-trial
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146,cargo-expand@1.0.127

      - name: Machine
        run: |
          nproc
          free -g
          df -h / | tail -n1

      - name: Build the tests
        run: cargo nextest run --workspace --no-run

      - name: Cargo test
        run: |
          FIRST_HOST=$(hostname -I | awk '{print $1}')
          export TEST_HOSTS=$FIRST_HOST,127.0.0.1,0.0.0.0
          cargo nextest run --workspace --no-fail-fast
