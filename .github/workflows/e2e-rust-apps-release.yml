name: E2E - Rust Apps (Released Image)

# Tests scaffolding-e2e and xcall-example against the released image; see
# e2e-rust-apps.yml for the PR version. Runs on workflow_run, not push, to avoid a stale `edge` image.

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [master]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # Must match the dev/dev-password login steps in the workflow YAMLs; merobox
  # forwards these into containers so merod mints the admin root key up front.
  MERO_AUTH_ADMIN_USER: dev
  MERO_AUTH_ADMIN_PASSWORD: dev-password
  # This workflow runs against released binaries; releases before rc.17 still
  # gate first login on this secret (ignored on rc.17+).
  MERO_AUTH_BOOTSTRAP_SECRET: merobox-e2e-bootstrap

jobs:
  build-apps:
    name: Build Apps
    # Follow only a successful Release from a push to this repo: a fork PR's Release run
    # also matches `branches`, and its code must not write default-branch caches.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-24.04-8cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: wasm-apps
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build scaffolding-e2e bundle
        run: (cd apps/scaffolding-e2e && cargo mero bundle --dev --no-icon)

      - name: Build scaffolding-e2e-multi bundle
        run: (cd apps/scaffolding-e2e-multi && cargo mero bundle --dev --no-icon)

      - name: Build xcall-example bundle
        run: (cd apps/xcall-example && cargo mero bundle --dev --no-icon)

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-rust-apps-release-build-artifacts
          path: |
            apps/scaffolding-e2e/res/*.wasm
            apps/scaffolding-e2e/res/abi.json
            apps/xcall-example/res/*.wasm
            apps/xcall-example/res/abi.json
          retention-days: 1

      - name: Upload app bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-rust-apps-release-bundles
          path: dist/*.mpk
          retention-days: 1

  test:
    name: Run Workflows
    needs: build-apps
    runs-on: ubuntu-24.04-8cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-rust-apps-release-build-artifacts
          path: apps

      - name: Download app bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-rust-apps-release-bundles
          path: dist

      - name: Determine Docker image tag
        id: image-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/determine-image-tag.sh \
              "${{ github.event_name }}" \
              "${{ github.event.number }}" \
              "${{ github.repository_owner }}" \
              "${{ github.repository }}" \
              "${GITHUB_HEAD_REF}" \
              "$GH_TOKEN"

      # Smoke-tests the released image over the DHT, so this job doesn't need
      # to run a registry.
      - name: Select the application source
        run: |
          image=ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG}
          docker pull "$image"
          ./scripts/set-registry-mode.sh "$image" dht
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      - name: Run scaffolding-e2e Workflow
        id: run_scaffolding_e2e
        run: |
          # Single attempt, fail loud: a flake here is a real bug worth
          # surfacing, not something to retry past.
          mkdir -p docker-logs
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/e2e.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/scaffolding-e2e-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run scaffolding-e2e Groups Workflow
        id: run_groups
        run: |
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/groups.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          echo "Collecting Docker logs for groups workflow"
          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/groups-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run group-3node Workflow
        id: run_group_3node
        run: |
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/group-3node.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/group-3node-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run group-context-isolation Workflow
        id: run_group_context_isolation
        run: |
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/group-context-isolation.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/group-context-isolation-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run group-late-joiner Workflow
        id: run_group_late_joiner
        run: |
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/group-late-joiner.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/group-late-joiner-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run group-subgroup Workflow
        id: run_group_subgroup
        run: |
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/group-subgroup.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/group-subgroup-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run group-multi-service Workflow
        id: run_group_multi_service
        run: |
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/group-multi-service.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/group-multi-service-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run handler-test Workflow
        id: run_handler_test
        run: |
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/handler-test.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/handler-test-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run xcall-example Workflow
        id: run_xcall
        run: |
          cd apps/xcall-example
          if merobox bootstrap run \
              "workflows/xcall.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/xcall-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Run kv-store-joiner-cold Workflow
        id: run_joiner_cold
        run: |
          # Regression guard: join_context must return with the group key
          # already stored, or the joiner's first `set` hits the "not yet delivered" error path.
          cd apps/scaffolding-e2e
          if merobox bootstrap run \
              "workflows/kv-store-joiner-cold.yml" \
              --image ghcr.io/calimero-network/merod:${STEPS_IMAGE_TAG_OUTPUTS_TAG} \
              --e2e-mode; then
              failed=false
          else
              failed=true
          fi

          for container in $(docker ps -a --filter "label=calimero.node=true" --format "{{.Names}}" 2>/dev/null || true); do
              if [ -n "$container" ]; then
                  docker logs "$container" > "$GITHUB_WORKSPACE/docker-logs/joiner-cold-${container}.log" 2>&1 || true
              fi
          done

          merobox stop --all || true
          merobox nuke --force || true

          echo "failed=$failed" >> $GITHUB_OUTPUT
        env:
          STEPS_IMAGE_TAG_OUTPUTS_TAG: ${{ steps.image-tag.outputs.tag }}

      - name: Upload Workflow Data Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-rust-apps-release-data-${{ github.sha }}
          path: |
            apps/scaffolding-e2e/res/*.wasm
            apps/scaffolding-e2e/res/abi.json
            apps/scaffolding-e2e/res/state-schema.json
            apps/xcall-example/res/*.wasm
            apps/xcall-example/res/abi.json
            dist/*.mpk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Docker Logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-rust-apps-release-docker-logs-${{ github.sha }}
          path: docker-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Check workflow results
        if: |
          steps.run_scaffolding_e2e.outputs.failed == 'true' ||
          steps.run_groups.outputs.failed == 'true' ||
          steps.run_group_3node.outputs.failed == 'true' ||
          steps.run_group_context_isolation.outputs.failed == 'true' ||
          steps.run_group_late_joiner.outputs.failed == 'true' ||
          steps.run_group_subgroup.outputs.failed == 'true' ||
          steps.run_group_multi_service.outputs.failed == 'true' ||
          steps.run_handler_test.outputs.failed == 'true' ||
          steps.run_xcall.outputs.failed == 'true' ||
          steps.run_joiner_cold.outputs.failed == 'true'
        run: |
          echo "Workflow failures detected:"
          if [ "${STEPS_RUN_SCAFFOLDING_E2E_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - scaffolding-e2e workflow failed"
          fi
          if [ "${STEPS_RUN_GROUPS_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - groups workflow failed"
          fi
          if [ "${STEPS_RUN_GROUP_3NODE_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - group-3node workflow failed"
          fi
          if [ "${STEPS_RUN_GROUP_CONTEXT_ISOLATION_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - group-context-isolation workflow failed"
          fi
          if [ "${STEPS_RUN_GROUP_LATE_JOINER_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - group-late-joiner workflow failed"
          fi
          if [ "${STEPS_RUN_GROUP_SUBGROUP_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - group-subgroup workflow failed"
          fi
          if [ "${STEPS_RUN_GROUP_MULTI_SERVICE_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - group-multi-service workflow failed"
          fi
          if [ "${STEPS_RUN_HANDLER_TEST_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - handler-test workflow failed"
          fi
          if [ "${STEPS_RUN_XCALL_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - xcall-example workflow failed"
          fi
          if [ "${STEPS_RUN_JOINER_COLD_OUTPUTS_FAILED}" == "true" ]; then
            echo "  - kv-store-joiner-cold workflow failed"
          fi
          exit 1
        env:
          STEPS_RUN_SCAFFOLDING_E2E_OUTPUTS_FAILED: ${{ steps.run_scaffolding_e2e.outputs.failed }}
          STEPS_RUN_GROUPS_OUTPUTS_FAILED: ${{ steps.run_groups.outputs.failed }}
          STEPS_RUN_GROUP_3NODE_OUTPUTS_FAILED: ${{ steps.run_group_3node.outputs.failed }}
          STEPS_RUN_GROUP_CONTEXT_ISOLATION_OUTPUTS_FAILED: ${{ steps.run_group_context_isolation.outputs.failed }}
          STEPS_RUN_GROUP_LATE_JOINER_OUTPUTS_FAILED: ${{ steps.run_group_late_joiner.outputs.failed }}
          STEPS_RUN_GROUP_SUBGROUP_OUTPUTS_FAILED: ${{ steps.run_group_subgroup.outputs.failed }}
          STEPS_RUN_GROUP_MULTI_SERVICE_OUTPUTS_FAILED: ${{ steps.run_group_multi_service.outputs.failed }}
          STEPS_RUN_HANDLER_TEST_OUTPUTS_FAILED: ${{ steps.run_handler_test.outputs.failed }}
          STEPS_RUN_XCALL_OUTPUTS_FAILED: ${{ steps.run_xcall.outputs.failed }}
          STEPS_RUN_JOINER_COLD_OUTPUTS_FAILED: ${{ steps.run_joiner_cold.outputs.failed }}
