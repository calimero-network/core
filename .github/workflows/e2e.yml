name: E2E

# merobox's release-v2 backend (one `merod` process per node) against this
# tree's node:
#
#   - every release-v2 workflow, core's (workflows/: app migrations, sync,
#     fuzzy loads) and every app's (apps/*/workflows/), most migrated from v1's
#     merobox workflows, in four shards (job `scenarios`), gated by
#     scripts/cloud-v2-workflows-baseline.json: a workflow on that list that
#     fails is a regression;
#   - merobox's own cloud-v2 examples: a crash and a frozen node, a frozen
#     leader under a latency budget, organizations and keys, signed packages
#     from a registry, and a rolling upgrade of every node;
#   - the clients (job `clients`, v1's sdk-e2e): mero-js's and
#     calimero-client-py's cluster tests against this tree's `merod`. Pair a
#     breaking change with its client fix by a same-named branch, or by
#     `sdk-ref: <ref>` / `py-ref: <ref>` in the PR body
#     (scripts/resolve-paired-ref.sh).
#
# It replaces v1's e2e-rust-apps, e2e-rust-apps-release, sdk-e2e,
# app-migration-e2e, sync-regression, fuzzy-load-test and wire-contract, which
# drove v1 nodes in Docker. The nightly run is the soak: the fuzzy loads for
# their full duration, each reporting calls/s and p50/p95/p99 latency per
# operation (MEROBOX_SOAK_REPORT, in the job summary). Nightly also:
#
#   - the same shards against the `merod` inside the latest published release
#     image (ghcr.io/<owner>/merod:<version>, release.yml), on the workflows
#     and fixtures of the commit that image was built from: the shipped
#     artifact, not a fresh cargo build (jobs `release-*`);
#   - a flamegraph of one node through the kv-store soak, by `perf record -g`
#     and inferno (job `flamegraph`, scripts/soak-flamegraph.sh).
#
# A PR's own image is tested in release.yml (`E2E on the merod image`), which
# builds it.
#
# GitHub runs `schedule` only from the default branch (master). The release-v2
# release branch (release-v2-parity) gets its nightly from a dispatcher on
# master that runs this workflow there with `nightly: true` (docs:
# contribute/testing, "Release branch"); a nightly dispatch runs every job a
# scheduled run does, and tests the branch's own image (release-v2-edge).

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "apps/**"
      - "tools/cargo-mero/**"
      - "workflows/**"
      - "scripts/cloud-v2-*"
      - "scripts/build-cloud-v2-fixtures.py"
      - "scripts/resolve-paired-ref.sh"
      - ".github/workflows/e2e.yml"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py), but
      # these files are code: a bundle embeds them or a build reads them.
      - "!**/*.md"
      - "!**/*.mdx"
      - "apps/kv-store/GUIDE.md"
      - "tools/cargo-mero/README.md"
      - "tools/cargo-mero/tests/fixtures/demo-app/GUIDE.md"
      - "tools/cargo-mero/tests/fixtures/multi-app/GUIDE.md"
  push:
    branches: ["master", "release-v2-parity"]
  merge_group:
  schedule:
    - cron: "23 3 * * *" # nightly soak, off the hour
  workflow_dispatch:
    inputs:
      nightly:
        description: Run as the nightly does (the 15-minute soak, the release image's shards, the flamegraph)
        type: boolean
        required: false
        default: false
      soak_seconds:
        description: How long each fuzzy_test step runs (the scenarios' own value applies when empty)
        required: false
        default: ""
      release_image:
        description: Also run the shards against a release image's merod ("latest" for the newest release, a tag of ghcr.io/<owner>/merod such as release-v2-edge, or an image reference); empty skips it, except on a nightly run
        required: false
        default: ""
      flamegraph:
        description: Also profile a node through the kv-store soak (the nightly flamegraph)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A nightly (scheduled or dispatched) run has a group of its own, so a push to
# the same branch neither cancels it nor waits behind it. Runs of master and the
# release branch are never cancelled.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || 'run' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/release-v2-parity' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The merobox revision whose cloud-v2 backend and examples this runs
  # (release.yml's `E2E on the merod image` names the same).
  MEROBOX_REF: release-v2-parity
  # The flamegraph job's renderer (`cargo install inferno`, cached).
  INFERNO_VERSION: 0.12.8

jobs:
  # merod, the fixtures every workflow installs and merobox's example inputs,
  # built once and handed to each shard.
  fixtures:
    name: merobox cloud-v2 fixtures
    runs-on: big-machine
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: ci-checks
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build merod
        run: cargo build -p merod

      - name: Build the fixtures
        run: |
          set -euo pipefail
          python3 scripts/build-cloud-v2-fixtures.py
          mkdir -p target/e2e
          cp "$CARGO_TARGET_DIR/debug/merod" target/e2e/merod
          # merobox's examples: kv-store's WASM, two signed releases of it,
          # and a second, different build of merod for the rolling upgrade.
          cargo build -p kv-store --target wasm32-unknown-unknown --profile app-release
          cp "$CARGO_TARGET_DIR/wasm32-unknown-unknown/app-release/kv_store.wasm" target/e2e/
          for v in 1.0.0 1.1.0; do
            (cd apps/kv-store && cargo mero bundle --dev --no-icon --app-version "$v")
            cp "dist/com.calimero.kv-store-$v.mpk" target/e2e/
          done
          cp target/e2e/merod target/e2e/merod-next
          printf '\0' >> target/e2e/merod-next

      # outbound-probe's outbound.yml drives every outbound gate through the
      # test build's in-process `.test` echo (`[outbound.testing]` in its
      # cluster.settings), which only this feature compiles; a plain merod
      # refuses those settings. The shards hand it over as MEROD_OUTBOUND_BINARY.
      - name: Build merod with outbound-testing
        run: |
          set -euo pipefail
          cargo build -p merod --features calimero-cloud-node/outbound-testing
          cp "$CARGO_TARGET_DIR/debug/merod" target/e2e/merod-outbound

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fixtures
          path: |
            target/e2e
            target/cloud-v2-wasm
          if-no-files-found: error
          retention-days: 1

  # Every release-v2 workflow: core's (workflows/**: app migrations, sync,
  # fuzzy loads) and every app's (apps/*/workflows/**), packed into shards of
  # about equal length by their measured durations
  # (scripts/cloud-v2-workflows-durations.json). A workflow listed in
  # scripts/cloud-v2-workflows-baseline.json that fails is a regression.
  scenarios:
    name: merobox cloud-v2 (${{ matrix.shard }}/4)
    needs: fixtures
    runs-on: big-machine
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout merobox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/merobox
          ref: ${{ env.MEROBOX_REF }}
          path: merobox
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # merobox pulls calimero-client-py, built from source against core.
      - name: Install merobox
        run: pip install ./merobox

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-fixtures
          path: target

      - name: Workflows of shard ${{ matrix.shard }}
        env:
          MEROD_BINARY: ${{ github.workspace }}/target/e2e/merod
          # The feature build a workflow names by `cluster.binary` (outbound.yml).
          MEROD_OUTBOUND_BINARY: ${{ github.workspace }}/target/e2e/merod-outbound
          MEROBOX_FUZZY_SECONDS: ${{ (github.event_name == 'schedule' || inputs.nightly) && '900' || inputs.soak_seconds || '30' }}
          MEROBOX_SOAK_REPORT: ${{ github.workspace }}/target/e2e/soak-${{ matrix.shard }}.json
        run: |
          chmod +x "$MEROD_BINARY" "$MEROD_OUTBOUND_BINARY"
          python3 scripts/cloud-v2-workflows.py --shard ${{ matrix.shard }}/4 \
            --json target/e2e/workflows-${{ matrix.shard }}.json

      - name: Soak latency and throughput
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/soak-summary.sh "target/e2e/soak-$SHARD.json" "Soak, shard $SHARD/4 (this tree's merod)"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: target/e2e/workflows-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the soak report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-metrics-${{ matrix.shard }}
          path: target/e2e/soak-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30

  # Nightly: the shipped artifact. The newest published release (a prerelease
  # included) has its image tagged with its version by release.yml; its merod
  # runs the four shards of the commit the image was built from (its
  # org.opencontainers.image.revision label), with that commit's fixtures and
  # baseline, so a workflow added after the release cannot fail it. A release
  # older than release-v2 (a v1 node) is reported and not run. On the release
  # branch, until a release-v2 release ships, a nightly tests the branch's own
  # image instead: release-v2-edge, which release.yml pushes on every merge.
  release-image:
    name: Latest release image
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release_image != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The release list and the image commit's tree, through `gh api`.
      contents: read
      # Pulling the image from ghcr.io.
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      revision: ${{ steps.image.outputs.revision }}
      testable: ${{ steps.image.outputs.testable }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the image and take merod out of it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REQUESTED: ${{ inputs.release_image }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The release branch's nightly default: its own published image.
          if [ -z "$REQUESTED" ] && [ "$REF" = refs/heads/release-v2-parity ]; then
            REQUESTED=release-v2-edge
          fi
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != latest ]; then
            # A bare tag (release-v2-edge, 0.12.0) names ghcr.io/<owner>/merod:<tag>.
            case "$REQUESTED" in
              */* | *:* | *@*) image=$REQUESTED ;;
              *) image="ghcr.io/${OWNER,,}/merod:$REQUESTED" ;;
            esac
            version=${image##*:}
          else
            version=$(gh api "repos/$REPO/releases?per_page=20" --jq '[.[] | select(.draft | not)][0].tag_name')
            image="ghcr.io/${OWNER,,}/merod:$version"
          fi
          docker pull --platform linux/amd64 "$image"
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          if [ -z "$revision" ] || [ "$revision" = "<no value>" ]; then
            revision=$(gh api "repos/$REPO/commits/$version" --jq .sha)
          fi
          mkdir -p release
          id=$(docker create --platform linux/amd64 "$image")
          docker cp "$id:/usr/local/bin/merod" release/merod
          docker rm "$id"
          # release-v2's runner, at that commit: a v1 release has none.
          testable=false
          if gh api "repos/$REPO/contents/scripts/cloud-v2-workflows.py?ref=$revision" --silent 2>/dev/null; then
            testable=true
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "revision=$revision"
            echo "testable=$testable"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Latest release image"
            echo
            echo "\`$image\` (\`$("$PWD/release/merod" --version 2>/dev/null || echo "merod, no --version")\`), built from $revision."
            if [ "$testable" != true ]; then
              echo
              echo "That commit predates release-v2 (no scripts/cloud-v2-workflows.py): its merod is a v1 node, which merobox's cloud-v2 backend does not run. Nothing is tested until a release-v2 release ships."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merod
        if: steps.image.outputs.testable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-merod
          path: release/merod
          if-no-files-found: error
          retention-days: 1

  release-fixtures:
    name: merobox cloud-v2 fixtures (release ${{ needs.release-image.outputs.version }})
    needs: release-image
    if: needs.release-image.outputs.testable == 'true'
    runs-on: big-machine
    timeout-minutes: 60
    steps:
      - name: Checkout the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: ci-checks
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build the fixtures
        run: python3 scripts/build-cloud-v2-fixtures.py

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-release-fixtures
          path: target/cloud-v2-wasm
          if-no-files-found: error
          retention-days: 1

  release-scenarios:
    name: merobox cloud-v2 on release ${{ needs.release-image.outputs.version }} (${{ matrix.shard }}/4)
    needs: [release-image, release-fixtures]
    runs-on: big-machine
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Checkout merobox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/merobox
          ref: ${{ env.MEROBOX_REF }}
          path: merobox
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install merobox
        run: pip install ./merobox

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-release-fixtures
          path: target/cloud-v2-wasm

      - name: Download the release's merod
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-merod
          path: target/release-image

      - name: Workflows of shard ${{ matrix.shard }}
        env:
          MEROD_BINARY: ${{ github.workspace }}/target/release-image/merod
          MEROBOX_FUZZY_SECONDS: ${{ (github.event_name == 'schedule' || inputs.nightly) && '900' || inputs.soak_seconds || '30' }}
          MEROBOX_SOAK_REPORT: ${{ github.workspace }}/target/release-image/soak-${{ matrix.shard }}.json
        run: |
          chmod +x "$MEROD_BINARY"
          python3 scripts/cloud-v2-workflows.py --shard ${{ matrix.shard }}/4 \
            --json target/release-image/workflows-${{ matrix.shard }}.json

      # The script is this run's: the release's commit may predate it.
      - name: Soak latency and throughput
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
          VERSION: ${{ needs.release-image.outputs.version }}
          REPORT: target/release-image/soak-${{ matrix.shard }}.json
        run: |
          if [ -s "$REPORT" ]; then
            merobox cloud soak-report "$REPORT" --title "Soak, shard $SHARD/4 (release $VERSION's merod)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No soak report for shard $SHARD/4 (release $VERSION)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-release-results-${{ matrix.shard }}
          path: |
            target/release-image/workflows-${{ matrix.shard }}.json
            target/release-image/soak-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30

  # Nightly: where one node's CPU goes during the kv-store soak. merod is built
  # with the `profiling` profile (optimized, with symbols) and frame pointers,
  # so `perf record -g` sees whole stacks; scripts/soak-flamegraph.sh records
  # node 1 for most of a 5-minute fuzzy run and inferno draws the SVG.
  flamegraph:
    name: merod flamegraph (kv-store soak)
    needs: fixtures
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.flamegraph))
    runs-on: big-machine
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout merobox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/merobox
          ref: ${{ env.MEROBOX_REF }}
          path: merobox
          persist-credentials: false

      # No cache to share: nothing else builds the profiling profile, and a
      # nightly-only entry would evict the PR caches from the repo's 10 GB.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: release
          save-if: false

      - name: Build merod for profiling
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
        run: cargo build -p merod --profile profiling

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install merobox
        run: pip install ./merobox

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-fixtures
          path: target

      - name: Install perf
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # The tools built for the running kernel when the archive has them;
          # perf from another kernel's package records user stacks as well.
          sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-generic
          perf="/usr/lib/linux-tools/$(uname -r)/perf"
          [ -x "$perf" ] || perf=$(find /usr/lib/linux-tools -name perf -type f | sort -V | tail -n1)
          "$perf" --version
          echo "PERF=$perf" >> "$GITHUB_ENV"
          # Let the runner's user sample its own processes, with kernel symbols.
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      - name: Restore inferno
        id: inferno
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.inferno
          key: inferno-${{ env.INFERNO_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install inferno
        if: steps.inferno.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/inferno-build
        run: cargo install inferno --version "$INFERNO_VERSION" --locked --root ~/.inferno

      - name: Profile node 1 through the kv-store soak
        env:
          MEROD_BINARY: ${{ github.workspace }}/target/profiling/merod
          MEROBOX_FUZZY_SECONDS: "300"
        run: |
          PATH="$HOME/.inferno/bin:$PATH"
          bash scripts/soak-flamegraph.sh target/flamegraph

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          bash scripts/soak-summary.sh target/flamegraph/soak.json "Soak while profiled (profiling build, node 1 under perf)"
          if [ -s target/flamegraph/merod-flamegraph.svg ]; then
            echo "Flamegraph: artifact \`merod-flamegraph\` (merod-flamegraph.svg; merod.folded for inferno-diff-folded)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the flamegraph
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merod-flamegraph
          path: target/flamegraph
          if-no-files-found: ignore
          retention-days: 30

  # merobox's own cloud-v2 examples: a crash and a frozen node, a frozen leader
  # under a latency budget, organizations and keys, signed packages from a
  # registry, and a rolling upgrade of every node.
  examples:
    name: merobox cloud-v2 examples
    needs: fixtures
    runs-on: big-machine
    timeout-minutes: 30
    steps:
      - name: Checkout merobox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/merobox
          ref: ${{ env.MEROBOX_REF }}
          path: merobox
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install merobox
        run: pip install ./merobox

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-fixtures
          path: target

      - name: merobox's examples
        env:
          KV_STORE_WASM: ${{ github.workspace }}/target/e2e/kv_store.wasm
          KV_STORE_MPK: ${{ github.workspace }}/target/e2e/com.calimero.kv-store-1.0.0.mpk
          KV_STORE_MPK_NEXT: ${{ github.workspace }}/target/e2e/com.calimero.kv-store-1.1.0.mpk
          MEROD_V2_BINARY: ${{ github.workspace }}/target/e2e/merod
          MEROD_V2_UPGRADE_BINARY: ${{ github.workspace }}/target/e2e/merod-next
        run: |
          set -uo pipefail
          chmod +x "$MEROD_V2_BINARY" "$MEROD_V2_UPGRADE_BINARY"
          failed=0
          for wf in merobox/workflow-examples/cloud-v2/*.yml; do
            echo "::group::$wf"
            merobox cloud run "$wf" || { echo "::error::$wf failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

  clients:
    name: clients against merod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Test the ref pairing
        run: bash scripts/tests/resolve-paired-ref.test.sh

      # Unpaired, a change on the release branch (a push to it, or a PR into it)
      # tests the clients' release-v2-parity branches, which have the cloud-v2
      # tests; their master has none.
      - name: Resolve the client refs (paired)
        id: refs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_REF: ${{ (github.base_ref || github.ref_name) == 'release-v2-parity' && 'release-v2-parity' || 'master' }}
        run: |
          set -euo pipefail
          js="$(scripts/resolve-paired-ref.sh "$DEFAULT_REF")"
          py="$(SDK_REPO=https://github.com/calimero-network/calimero-client-py.git \
            REF_KEY=py-ref scripts/resolve-paired-ref.sh "$DEFAULT_REF")"
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "py=$py" >> "$GITHUB_OUTPUT"
          echo "mero-js@$js, calimero-client-py@$py"

      - name: Checkout mero-js
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/mero-js
          ref: ${{ steps.refs.outputs.js }}
          path: _mero-js
          persist-credentials: false

      - name: Checkout calimero-client-py
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/calimero-client-py
          ref: ${{ steps.refs.outputs.py }}
          path: _client-py
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: ci-checks
          save-if: false

      - name: Build merod and the kv-store fixture
        run: |
          set -euo pipefail
          cargo build -p merod
          cargo build -p kv-store --target wasm32-unknown-unknown --profile app-release
          echo "MEROD_BINARY=$CARGO_TARGET_DIR/debug/merod" >> "$GITHUB_ENV"
          echo "KV_STORE_WASM=$CARGO_TARGET_DIR/wasm32-unknown-unknown/app-release/kv_store.wasm" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: mero-js cluster tests
        working-directory: _mero-js
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm test:cloud-v2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"

      # The client builds against the core its Cargo.toml pins; what this job
      # tests is that client against this tree's node.
      - name: calimero-client-py cluster tests
        if: ${{ !cancelled() }}
        working-directory: _client-py
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin==1.15.0
          pip install -e ".[dev]"
          pytest tests/test_cloud_v2.py tests/test_cloud_v2_api.py -v --tb=short
