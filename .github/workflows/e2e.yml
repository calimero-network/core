name: E2E

# End-to-end tests of this tree's node, in three layers (docs:
# contribute/testing):
#
#   - scenarios (job `scenarios`, four shards): every app's scenarios
#     (apps/*/scenarios/: app-level, on the app's own harness, and cluster/)
#     and core's (workflows/**/scenarios/: app migrations, sync, fuzzy
#     loads), on an in-process 3-node cluster
#     (`cargo test -p calimero-node --test scenarios`). A scenario on
#     crates/node/tests/scenarios-skip.txt is reported, not run;
#   - the process suite (job `process-suite`): real `merod run --dev`
#     processes, one per node (crates/node/tests/fault/suite.py): a crash and
#     a frozen node, a frozen leader under a latency budget, organizations and
#     keys, signed packages from a registry, a rolling upgrade of every node,
#     and the kv-store soak (calls/s and p50/p95/p99 per operation in the job
#     summary);
#   - the clients (job `clients`): mero-js's and calimero-client-py's cluster
#     tests against this tree's `merod`. Pair a breaking change with its
#     client fix by a same-named branch, or by `sdk-ref: <ref>` /
#     `py-ref: <ref>` in the PR body (scripts/resolve-paired-ref.sh).
#
# Nightly runs the suite with `--nightly` (three iterations, a 900 s soak,
# rooms_fault.py's randomized nemesis) and the fuzzy scenarios for 900 s.
# Nightly also:
#
#   - the process suite against the `merod` inside the latest published
#     release image (ghcr.io/<owner>/merod:<version>, release.yml), with the
#     suite and fixtures of the commit that image was built from: the shipped
#     artifact, not a fresh cargo build (job `release-process-suite`);
#   - every scenario, in four shards, at that commit (jobs `release-fixtures`
#     and `release-scenarios`): the runner is in process, so the release's
#     node is its source, the one its merod was built from;
#   - a flamegraph of one node through the kv-store soak, by `perf record -g`
#     and inferno (job `flamegraph`, scripts/soak-flamegraph.sh).
#
# A PR's own image is tested in release.yml (`E2E on the merod image`), which
# builds it.
#
# GitHub runs `schedule` only from the default branch (master); a nightly
# dispatch (`nightly: true`) runs every job a scheduled run does.

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "apps/**"
      - "tools/cargo-mero/**"
      - "workflows/**"
      - "scripts/soak-summary.sh"
      - "scripts/soak-flamegraph.sh"
      - "scripts/build-workflow-fixtures.py"
      - "scripts/resolve-paired-ref.sh"
      - ".github/workflows/e2e.yml"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py), but
      # these files are code: a bundle embeds them or a build reads them.
      - "!**/*.md"
      - "!**/*.mdx"
      - "apps/wasmer-fixtures/kv-store/GUIDE.md"
      - "tools/cargo-mero/README.md"
      - "tools/cargo-mero/tests/fixtures/demo-app/GUIDE.md"
      - "tools/cargo-mero/tests/fixtures/multi-app/GUIDE.md"
  push:
    branches: ["master", "release-v2-parity"]
  merge_group:
  schedule:
    - cron: "23 3 * * *" # nightly soak, off the hour
  workflow_dispatch:
    inputs:
      nightly:
        description: Run as the nightly does (the 15-minute soak, the release image's process suite, the flamegraph)
        type: boolean
        required: false
        default: false
      soak_seconds:
        description: How long the soak and each fuzzy_test step run (the defaults apply when empty)
        required: false
        default: ""
      release_image:
        description: Also run the process suite against a release image's merod ("latest" for the newest release, a tag of ghcr.io/<owner>/merod such as release-v2-edge, or an image reference); empty skips it, except on a nightly run
        required: false
        default: ""
      flamegraph:
        description: Also profile a node through the kv-store soak (the nightly flamegraph)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A nightly (scheduled or dispatched) run has a group of its own, so a push to
# the same branch neither cancels it nor waits behind it. Runs of master and the
# release branch are never cancelled.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || 'run' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/release-v2-parity' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The flamegraph job's renderer (`cargo install inferno`, cached).
  INFERNO_VERSION: 0.12.8

jobs:
  # The wasmer apps every cluster scenario installs (target/workflow-wasm),
  # built once and handed to each shard. Component apps are built by the
  # runner, each in its own crate.
  fixtures:
    name: scenario fixtures
    runs-on: big-machine
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: ci-checks
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build the fixtures
        run: python3 scripts/build-workflow-fixtures.py

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-fixtures
          path: target/workflow-wasm
          if-no-files-found: error
          retention-days: 1

  # Every scenario, app-level and cluster, split into four shards by
  # SCENARIO_SHARD. Each runs on an in-process 3-node cluster
  # (crates/node/tests/harness/scenario.rs); no merod process.
  scenarios:
    name: scenarios (${{ matrix.shard }}/4)
    needs: fixtures
    runs-on: big-machine
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # wasm32-wasip2: the component apps the runner builds.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
          shared-key: ci-checks
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-fixtures
          path: target/workflow-wasm

      # ci-checks' required `scope` job checks discovery with a script; it must see what
      # the runner sees.
      - name: The discovery check lists what the runner discovers
        run: |
          set -euo pipefail
          diff <(python3 scripts/check-scenario-discovery.py --list) \
            <(cargo test -p calimero-node --test scenarios -- --list | sed -n 's/: test$//p')

      - name: Scenarios of shard ${{ matrix.shard }}
        env:
          CORE_WASM_DIR: ${{ github.workspace }}/target/workflow-wasm
          SCENARIO_SHARD: ${{ matrix.shard }}/4
          SCENARIO_FUZZY_SECONDS: ${{ (github.event_name == 'schedule' || inputs.nightly) && '900' || inputs.soak_seconds || '10' }}
        run: cargo test -p calimero-node --test scenarios -- --test-threads 2

  # Process-level tests on real `merod run --dev` processes, one per node: a crash,
  # a frozen node and a restart; a frozen leader under a 10 s budget; organizations
  # and keys; signed packages from a registry; a rolling upgrade of every node under
  # load; the kv-store soak (latency and throughput in the summary). A PR runs each
  # once with a 30 s soak; a nightly runs `--nightly` (three iterations, a 900 s
  # soak, rooms_fault.py's randomized nemesis for 50 iterations).
  process-suite:
    name: process suite (merod processes)
    runs-on: big-machine
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.nightly) && 150 || 45 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          # wasm32-wasip2: the Rooms component the nightly's rooms-fault builds.
          targets: wasm32-unknown-unknown,wasm32-wasip2
          shared-key: release
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build merod, meroctl and the fixtures
        env:
          NIGHTLY: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'true' || 'false' }}
        run: |
          set -euo pipefail
          cargo build --release -p merod -p meroctl
          cargo build -p kv-store --target wasm32-unknown-unknown --profile app-release
          for v in 1.0.0 1.1.0; do
            (cd apps/wasmer-fixtures/kv-store && cargo mero bundle --dev --no-icon --app-version "$v")
          done
          if [ "$NIGHTLY" = true ]; then
            # Builds the Rooms component into target/app-components (tests/common/mod.rs).
            cargo test --release -p calimero-node --test rooms
          fi

      - name: Process suite
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
          NIGHTLY: ${{ (github.event_name == 'schedule' || inputs.nightly) && '--nightly' || '' }}
        run: |
          python3 -I crates/node/tests/fault/suite.py $NIGHTLY \
            --soak-report target/process-suite/soak.json --json target/process-suite/results.json

      - name: Soak latency and throughput
        if: ${{ !cancelled() }}
        run: bash scripts/soak-summary.sh target/process-suite/soak.json "Soak, kv-store (this tree's merod, release build)"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-suite
          # Failed tests keep their work directory: node logs (nodeN.log) and data.
          path: |
            target/process-suite
            target/fault-suite
          if-no-files-found: ignore
          retention-days: 14

  # Nightly: where one node's CPU goes during the kv-store soak.
  flamegraph:
    name: merod flamegraph (kv-store soak)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.flamegraph))
    runs-on: big-machine
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: release
          save-if: false

      - name: Build merod and meroctl for profiling, and kv-store
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          set -euo pipefail
          cargo build -p merod -p meroctl --profile profiling
          RUSTFLAGS= cargo build -p kv-store --target wasm32-unknown-unknown --profile app-release

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install perf
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-generic
          perf="/usr/lib/linux-tools/$(uname -r)/perf"
          [ -x "$perf" ] || perf=$(find /usr/lib/linux-tools -name perf -type f | sort -V | tail -n1)
          "$perf" --version
          echo "PERF=$perf" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      - name: Restore inferno
        id: inferno
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.inferno
          key: inferno-${{ env.INFERNO_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install inferno
        if: steps.inferno.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/inferno-build
        run: cargo install inferno --version "$INFERNO_VERSION" --locked --root ~/.inferno

      - name: Profile node 1 through the kv-store soak
        env:
          MEROD_BINARY: ${{ github.workspace }}/target/profiling/merod
          MEROCTL_BINARY: ${{ github.workspace }}/target/profiling/meroctl
          SOAK_SECONDS: "300"
        run: |
          PATH="$HOME/.inferno/bin:$PATH"
          bash scripts/soak-flamegraph.sh target/flamegraph

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          bash scripts/soak-summary.sh target/flamegraph/soak.json "Soak while profiled (profiling build, node 1 under perf)"
          if [ -s target/flamegraph/merod-flamegraph.svg ]; then
            echo "Flamegraph: artifact \`merod-flamegraph\` (merod-flamegraph.svg; merod.folded for inferno-diff-folded)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the flamegraph
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merod-flamegraph
          path: target/flamegraph
          if-no-files-found: ignore
          retention-days: 30

  # Nightly: the shipped artifact. The newest published release (a prerelease
  # included) has its image tagged with its version by release.yml; its merod
  # runs the process suite of the commit the image was built from (its
  # org.opencontainers.image.revision label), with that commit's meroctl and
  # fixtures, so a test added after the release cannot fail it. A release
  # whose commit has no process suite is reported and not run. On the release
  # branch, until a release with this node ships, a nightly tests the branch's own
  # image instead: release-v2-edge, which release.yml pushes on every merge.
  release-image:
    name: Latest release image
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release_image != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The release list and the image commit's tree, through `gh api`.
      contents: read
      # Pulling the image from ghcr.io.
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      revision: ${{ steps.image.outputs.revision }}
      testable: ${{ steps.image.outputs.testable }}
      scenarios: ${{ steps.image.outputs.scenarios }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the image and take merod out of it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REQUESTED: ${{ inputs.release_image }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The release branch's nightly default: its own published image.
          if [ -z "$REQUESTED" ] && [ "$REF" = refs/heads/release-v2-parity ]; then
            REQUESTED=release-v2-edge
          fi
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != latest ]; then
            # A bare tag (release-v2-edge, 0.12.0) names ghcr.io/<owner>/merod:<tag>.
            case "$REQUESTED" in
              */* | *:* | *@*) image=$REQUESTED ;;
              *) image="ghcr.io/${OWNER,,}/merod:$REQUESTED" ;;
            esac
            version=${image##*:}
          else
            version=$(gh api "repos/$REPO/releases?per_page=20" --jq '[.[] | select(.draft | not)][0].tag_name')
            image="ghcr.io/${OWNER,,}/merod:$version"
          fi
          docker pull --platform linux/amd64 "$image"
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          if [ -z "$revision" ] || [ "$revision" = "<no value>" ]; then
            revision=$(gh api "repos/$REPO/commits/$version" --jq .sha)
          fi
          mkdir -p release
          id=$(docker create --platform linux/amd64 "$image")
          docker cp "$id:/usr/local/bin/merod" release/merod
          docker rm "$id"
          # The process suite, at that commit: an older release has none.
          testable=false
          if gh api "repos/$REPO/contents/crates/node/tests/fault/suite.py?ref=$revision" --silent 2>/dev/null; then
            testable=true
          fi
          # The scenario runner, at that commit: a release older than it has none.
          scenarios=false
          if gh api "repos/$REPO/contents/crates/node/tests/scenarios.rs?ref=$revision" --silent 2>/dev/null; then
            scenarios=true
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "revision=$revision"
            echo "testable=$testable"
            echo "scenarios=$scenarios"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Latest release image"
            echo
            echo "\`$image\` (\`$("$PWD/release/merod" --version 2>/dev/null || echo "merod, no --version")\`), built from $revision."
            if [ "$testable" != true ]; then
              echo
              echo "That commit has no process suite (crates/node/tests/fault/suite.py). Nothing is tested until a release with one ships."
            fi
            if [ "$scenarios" != true ]; then
              echo
              echo "That commit has no scenario runner (crates/node/tests/scenarios.rs), so its scenarios are not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merod
        if: steps.image.outputs.testable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-merod
          path: release/merod
          if-no-files-found: error
          retention-days: 1

  # Nightly: the release's scenarios. The runner is in process (it links
  # calimero-node, not a merod binary), so the release's node is its commit's
  # source, the source the image's merod was built from; the binary itself is
  # the process suite's (release-process-suite). Fixtures, scenarios and runner
  # are all that commit's, so a scenario added after the release cannot fail it.
  release-fixtures:
    name: scenario fixtures (release ${{ needs.release-image.outputs.version }})
    needs: release-image
    if: needs.release-image.outputs.scenarios == 'true'
    runs-on: big-machine
    timeout-minutes: 60
    steps:
      - name: Checkout the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: release
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build the fixtures (the release's commit)
        run: python3 scripts/build-workflow-fixtures.py

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-e2e-fixtures
          path: target/workflow-wasm
          if-no-files-found: error
          retention-days: 1

  release-scenarios:
    name: scenarios on release ${{ needs.release-image.outputs.version }} (${{ matrix.shard }}/4)
    needs: [release-image, release-fixtures]
    runs-on: big-machine
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
          shared-key: release
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-e2e-fixtures
          path: target/workflow-wasm

      - name: Scenarios of shard ${{ matrix.shard }} (the release's commit)
        env:
          CORE_WASM_DIR: ${{ github.workspace }}/target/workflow-wasm
          SCENARIO_SHARD: ${{ matrix.shard }}/4
          SCENARIO_FUZZY_SECONDS: ${{ (github.event_name == 'schedule' || inputs.nightly) && '900' || inputs.soak_seconds || '10' }}
        run: cargo test -p calimero-node --test scenarios -- --test-threads 2

  release-process-suite:
    name: process suite on release ${{ needs.release-image.outputs.version }}
    needs: release-image
    if: needs.release-image.outputs.testable == 'true'
    runs-on: big-machine
    timeout-minutes: 90
    steps:
      - name: Checkout the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: release
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build meroctl and the fixtures (the release's commit)
        run: |
          set -euo pipefail
          cargo build --release -p meroctl
          cargo build -p kv-store --target wasm32-unknown-unknown --profile app-release
          for v in 1.0.0 1.1.0; do
            (cd apps/wasmer-fixtures/kv-store && cargo mero bundle --dev --no-icon --app-version "$v")
          done

      - name: Download the release's merod
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-merod
          path: target/release-image

      - name: Process suite (every test but the upgrade, a 900 s soak)
        env:
          VERSION: ${{ needs.release-image.outputs.version }}
        run: |
          chmod +x target/release-image/merod
          python3 -I crates/node/tests/fault/suite.py \
            --only kv-failover,frozen-leader,orgs-and-keys,packages,kv-soak --soak-seconds 900 \
            --merod target/release-image/merod --meroctl "${CARGO_TARGET_DIR:-target}/release/meroctl" \
            --soak-report target/release-image/soak.json --json target/release-image/results.json

      - name: Soak latency and throughput
        if: ${{ !cancelled() }}
        env:
          VERSION: ${{ needs.release-image.outputs.version }}
        run: bash scripts/soak-summary.sh target/release-image/soak.json "Soak, kv-store (release $VERSION's merod)"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-process-suite
          path: |
            target/release-image/results.json
            target/release-image/soak.json
            target/fault-suite
          if-no-files-found: ignore
          retention-days: 30

  clients:
    name: clients against merod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Test the ref pairing
        run: bash scripts/tests/resolve-paired-ref.test.sh

      # Unpaired, a change on the release branch (a push to it, or a PR into it)
      # tests the clients' release-v2-parity branches, which have the cloud-v2
      # tests; their master has none.
      - name: Resolve the client refs (paired)
        id: refs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_REF: ${{ (github.base_ref || github.ref_name) == 'release-v2-parity' && 'release-v2-parity' || 'master' }}
        run: |
          set -euo pipefail
          js="$(scripts/resolve-paired-ref.sh "$DEFAULT_REF")"
          py="$(SDK_REPO=https://github.com/calimero-network/calimero-client-py.git \
            REF_KEY=py-ref scripts/resolve-paired-ref.sh "$DEFAULT_REF")"
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "py=$py" >> "$GITHUB_OUTPUT"
          echo "mero-js@$js, calimero-client-py@$py"

      - name: Checkout mero-js
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/mero-js
          ref: ${{ steps.refs.outputs.js }}
          path: _mero-js
          persist-credentials: false

      - name: Checkout calimero-client-py
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/calimero-client-py
          ref: ${{ steps.refs.outputs.py }}
          path: _client-py
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: ci-checks
          save-if: false

      - name: Build merod and the kv-store fixture
        run: |
          set -euo pipefail
          cargo build -p merod
          cargo build -p kv-store --target wasm32-unknown-unknown --profile app-release
          echo "MEROD_BINARY=$CARGO_TARGET_DIR/debug/merod" >> "$GITHUB_ENV"
          echo "KV_STORE_WASM=$CARGO_TARGET_DIR/wasm32-unknown-unknown/app-release/kv_store.wasm" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: mero-js cluster tests
        working-directory: _mero-js
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm test:cloud-v2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          python-version: "3.12"

      # The client builds against the core its Cargo.toml pins; what this job
      # tests is that client against this tree's node.
      - name: calimero-client-py cluster tests
        if: ${{ !cancelled() }}
        working-directory: _client-py
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin==1.15.0
          pip install -e ".[dev]"
          pytest tests/test_cloud_v2.py tests/test_cloud_v2_api.py -v --tb=short
