name: E2E

# The scenarios, the process suite and the clients on this tree's node, plus their nightly runs
# against the latest release; each job is described in docs contribute/testing.

# Runs on every push to master (after the merge), on a PR labelled `ci:e2e` or cutting a
# release, and nightly; `plan` decides what the change reaches (scripts/ci-scope.py). In
# the merge queue it reports `E2E result` and runs nothing: the queue gates on the
# fast checks, and master runs this after the merge (`report-master` opens an issue
# when it fails; the commit is reverted).
on:
  # No `paths:` filter: `E2E result` is a required check and must report on every PR;
  # `plan` skips what the change cannot reach.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # `E2E result` is required in the queue too, so it must report there; `plan` skips.
  merge_group:
  push:
    branches: ["master"]
  schedule:
    - cron: "23 3 * * *" # nightly soak, off the hour
  workflow_dispatch:
    inputs:
      nightly:
        description: Run as the nightly does (the 15-minute soak, the release image's process suite, the flamegraph)
        type: boolean
        required: false
        default: false
      soak_seconds:
        description: How long the soak and each fuzzy_test step run (the defaults apply when empty)
        required: false
        default: ""
      release_image:
        description: Also run the process suite against a release image's merod ("latest" for the newest release, a tag of ghcr.io/<owner>/merod such as 1.0.0-rc.18, or an image reference); empty skips it, except on a nightly run
        required: false
        default: ""
      flamegraph:
        description: Also profile a node through the kv-store soak (the nightly flamegraph)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# A nightly has its own group so a push neither cancels nor queues it; master is never
# cancelled and gets a group per commit (`plan` scopes a push by its own range, so a
# pending run a newer push replaced would leave its files untested), and a label
# other than `ci:e2e` gets its own group.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.event_name == 'push' && github.sha || github.ref }}-${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || 'run' }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:e2e' && github.event.label.name || 'run' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # As ci-checks.yml compiles with, so the ci-checks cache it restores is reusable.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # The flamegraph job's renderer (`cargo install inferno`, cached).
  INFERNO_VERSION: 0.12.8

jobs:
  # What this event runs: `e2e` (builds, scenarios), `node` (process suite, compute, clients)
  # and `clients`, by what the change reaches; it fails closed and runs everything.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      node: ${{ steps.plan.outputs.node }}
      clients: ${{ steps.plan.outputs.clients }}
      consent_page: ${{ steps.plan.outputs.consent_page }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Decide what runs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:e2e') }}
          FROM: ${{ github.event.before }}
          TO: ${{ github.sha }}
        run: |
          set -uo pipefail
          files=""
          case "$EVENT" in
            pull_request)
              if listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename') \
                && [ "$(grep -c . <<<"$listed")" -lt 3000 ]; then
                files=$listed
              fi
              ;;
            push)
              if [ -n "${FROM//0/}" ] \
                && listed=$(gh api "repos/$REPO/compare/$FROM...$TO" --jq '.files[].filename') \
                && [ "$(grep -c . <<<"$listed")" -lt 300 ]; then
                files=$listed
              fi
              ;;
          esac
          scope=$(printf '%s\n' "$files" | python3 scripts/ci-scope.py) || scope="rust=true
          upgrade_path=true"
          rust=$(sed -n 's/^rust=//p' <<<"$scope")
          node_closure=$(sed -n 's/^upgrade_path=//p' <<<"$scope")
          all=false
          case "$EVENT" in schedule | workflow_dispatch) all=true ;; esac
          [ -n "$files" ] || all=true
          grep -qE '^(\.github/workflows/e2e\.yml|\.github/actions/)' <<<"$files" && all=true
          wanted=true
          # A PR that cuts a release runs everything: release.yml publishes on its merge,
          # before the push run could fail. A cut is what release.yml calls one: the
          # workspace version has no GitHub Release yet.
          release_cut=false
          if [ "$EVENT" = pull_request ] && grep -qx 'Cargo.toml' <<<"$files"; then
            version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["metadata"]["workspaces"]["version"])') \
              || version=""
            if [ -z "$version" ] || ! gh api "repos/$REPO/releases/tags/$version" --silent 2>/dev/null; then
              release_cut=true
              all=true
            fi
          fi
          if [ "$EVENT" = pull_request ] && [ "$LABELLED" != true ] && [ "$release_cut" != true ]; then wanted=false; fi
          # The queue gates on the fast checks; this runs on master after the merge.
          if [ "$EVENT" = merge_group ]; then wanted=false; all=false; fi
          # The clients' own sources, and the JS workspace they build in.
          sdk_clients=false
          grep -qE '^sdks/(clients/|package\.json$|pnpm-lock\.yaml$)' <<<"$files" && sdk_clients=true
          e2e=false
          if [ "$wanted" = true ] && { [ "$all" = true ] || [ "$rust" = true ] || [ "$sdk_clients" = true ] \
               || grep -qE '^(workflows/|scripts/soak-summary)' <<<"$files"; }; then
            e2e=true
          fi
          node=false
          if [ "$e2e" = true ] && { [ "$all" = true ] || [ "$node_closure" = true ] \
               || grep -qE '^(apps/fixture-compute/|apps/compute-redact/|crates/meroctl/|crates/node/tests/fault/|scripts/soak-summary)' <<<"$files"; }; then
            node=true
          fi
          clients=$node
          if [ "$e2e" = true ] && [ "$sdk_clients" = true ]; then clients=true; fi
          # The consent page's browser tests run on every PR that reaches the page (its code, its
          # tests, this workflow), labelled or not: nothing else in the suite exercises the page.
          consent_page=false
          if [ "$EVENT" = merge_group ]; then :
          elif [ "$all" = true ] || grep -qE '^(crates/node/src/consent_page(/|\.rs$)|crates/node/tests/consent-page/)' <<<"$files"; then
            consent_page=true
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "clients=$clients" >> "$GITHUB_OUTPUT"
          echo "consent_page=$consent_page" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT labelled=$LABELLED rust=$rust node_closure=$node_closure sdk_clients=$sdk_clients all=$all -> e2e=$e2e node=$node clients=$clients consent_page=$consent_page"
          if [ "$EVENT" = pull_request ] && [ "$wanted" != true ]; then
            echo "::notice::e2e runs on master after the merge; add the ci:e2e label to run it on this PR first"
          fi

  # The check to require: passes when every e2e job passed or was skipped by `plan`.
  result:
    name: E2E result
    if: ${{ !cancelled() }}
    needs: [plan, build-release, build-scenarios, scenarios, process-suite, compute-e2e, clients, clients-swift, consent-page]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every e2e job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -e '.plan.result == "success" and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' <<<"$NEEDS"

  # Master's push runs what the queue does not (every test; e2e.yml): a red push opens
  # an issue, a green one closes it (.github/actions/report-master).
  report-master:
    name: Report master
    needs: [result]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Report
        uses: ./.github/actions/report-master
        with:
          needs: ${{ toJSON(needs) }}
          workflow: E2E

  # merod, meroctl and the kv releases, built once; nightly builds with fat LTO so the soak
  # numbers are the release's, other runs skip it to link in a fraction of the time.
  build-release:
    name: build merod and the fixtures
    needs: plan
    if: needs.plan.outputs.e2e == 'true' || needs.plan.outputs.consent_page == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-wasip2
          shared-key: release
          save-if: false

      - name: Build merod, meroctl and the fixtures
        env:
          NIGHTLY: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'true' || 'false' }}
          CARGO_PROFILE_RELEASE_LTO: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'fat' || 'false' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ (github.event_name == 'schedule' || inputs.nightly) && '1' || '16' }}
        run: |
          set -euo pipefail
          cargo build --release -p merod -p meroctl
          "${CARGO_TARGET_DIR:-target}/release/meroctl" app build \
            apps/fixture-kv --out "${CARGO_TARGET_DIR:-target}/app-components/kv.wasm"
          "${CARGO_TARGET_DIR:-target}/release/meroctl" app build apps/fixture-compute \
            --out "${CARGO_TARGET_DIR:-target}/app-components/compute-app.wasm" \
            --compute-out "${CARGO_TARGET_DIR:-target}/app-components/compute.wasm"
          for v in 1.0.0 1.1.0; do
            "${CARGO_TARGET_DIR:-target}/release/meroctl" app pack --wasm "${CARGO_TARGET_DIR:-target}/app-components/kv.wasm" \
              --package com.calimero.kv-store --app-version "$v" --out "dist/com.calimero.kv-store-$v.mpk"
          done
          if [ "$NIGHTLY" = true ]; then
            # Builds the Rooms component into target/app-components (tests/it/common.rs).
            cargo test --release -p calimero-node --test it rooms::
          fi

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-release
          path: |
            target/release/merod
            target/release/meroctl
            target/app-components/*.wasm
            dist
          if-no-files-found: error
          retention-days: 1


  # The scenario runner, compiled once for the shards; ci-checks' `scope` checks discovery
  # with a script that must see what the runner sees.
  build-scenarios:
    name: build the scenario runner
    needs: plan
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-wasip2
          shared-key: ci-checks
          save-if: false

      - name: Build the runner
        run: |
          set -euo pipefail
          bin=$(cargo test -p calimero-node --test scenarios --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "scenarios" and .executable != null) | .executable')
          mkdir -p target/scenario-runner
          cp "$bin" target/scenario-runner/scenarios

      - name: The discovery check lists what the runner discovers
        working-directory: crates/node
        run: |
          set -euo pipefail
          diff <(python3 ../../scripts/check-scenario-discovery.py --list) \
            <(../../target/scenario-runner/scenarios --list | sed -n 's/: test$//p')

      - name: Upload it
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-runner
          path: target/scenario-runner/scenarios
          if-no-files-found: error
          retention-days: 1


  # Every scenario in four shards (SCENARIO_SHARD), each on an in-process 3-node cluster;
  # run from the package's directory, as cargo would.
  scenarios:
    name: scenarios (${{ matrix.shard }}/4)
    needs: build-scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # wasm32-wasip2: the component apps the runner builds.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-wasip2
          shared-key: ci-checks
          rust-cache: false

      - name: Download the runner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scenario-runner
          path: target/scenario-runner

      - name: Scenarios of shard ${{ matrix.shard }}
        working-directory: crates/node
        env:
          SCENARIO_SHARD: ${{ matrix.shard }}/4
          SCENARIO_FUZZY_SECONDS: ${{ (github.event_name == 'schedule' || inputs.nightly) && '900' || inputs.soak_seconds || '10' }}
        run: |
          chmod +x ../../target/scenario-runner/scenarios
          ../../target/scenario-runner/scenarios --test-threads 2


  # Real `merod run --dev` processes, one per node (crates/node/tests/fault/suite.py);
  # a PR runs each case once with a 30 s soak, a nightly runs `--nightly`.
  process-suite:
    name: process suite (merod processes)
    needs: [plan, build-release]
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.nightly) && 180 || 60 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download merod, meroctl, the tools and the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-release
          path: .

      # An artifact keeps no file modes.
      - name: Put the tools on PATH
        run: |
          chmod +x target/release/merod target/release/meroctl
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      - name: Process suite
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
          NIGHTLY: ${{ (github.event_name == 'schedule' || inputs.nightly) && '--nightly' || '' }}
        run: |
          python3 -I crates/node/tests/fault/suite.py $NIGHTLY \
            --soak-report target/process-suite/soak.json --json target/process-suite/results.json

      - name: Soak latency and throughput
        if: ${{ !cancelled() }}
        run: bash scripts/soak-summary.sh target/process-suite/soak.json "Soak, kv-store (this tree's merod, ${BUILD})"
        env:
          BUILD: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'release build' || 'release build without fat LTO' }}

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-suite
          # Failed tests keep their work directory: node logs (nodeN.log) and data.
          path: |
            target/process-suite
            target/fault-suite
          if-no-files-found: ignore
          retention-days: 14

  # Nightly: where one node's CPU goes during the kv-store soak.
  flamegraph:
    name: merod flamegraph (kv-store soak)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.flamegraph))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-wasip2
          shared-key: release
          save-if: false

      - name: Build merod and meroctl for profiling, and the kv component
        env:
          RUSTFLAGS: -C force-frame-pointers=yes
        run: |
          set -euo pipefail
          cargo build -p merod -p meroctl --profile profiling
          RUSTFLAGS= "${CARGO_TARGET_DIR:-target}/profiling/meroctl" app build \
            apps/fixture-kv --out "${CARGO_TARGET_DIR:-target}/app-components/kv.wasm"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install perf
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -q --no-install-recommends linux-tools-common linux-tools-generic
          perf="/usr/lib/linux-tools/$(uname -r)/perf"
          [ -x "$perf" ] || perf=$(find /usr/lib/linux-tools -name perf -type f | sort -V | tail -n1)
          "$perf" --version
          echo "PERF=$perf" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0

      - name: Restore inferno
        id: inferno
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.inferno
          key: inferno-${{ env.INFERNO_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install inferno
        if: steps.inferno.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/inferno-build
        run: cargo install inferno --version "$INFERNO_VERSION" --locked --root ~/.inferno

      - name: Profile node 1 through the kv-store soak
        env:
          MEROD_BINARY: ${{ github.workspace }}/target/profiling/merod
          MEROCTL_BINARY: ${{ github.workspace }}/target/profiling/meroctl
          SOAK_SECONDS: "300"
        run: |
          PATH="$HOME/.inferno/bin:$PATH"
          bash scripts/soak-flamegraph.sh target/flamegraph

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          bash scripts/soak-summary.sh target/flamegraph/soak.json "Soak while profiled (profiling build, node 1 under perf)"
          if [ -s target/flamegraph/merod-flamegraph.svg ]; then
            echo "Flamegraph: artifact \`merod-flamegraph\` (merod-flamegraph.svg; merod.folded for inferno-diff-folded)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the flamegraph
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merod-flamegraph
          path: target/flamegraph
          if-no-files-found: ignore
          retention-days: 30

  # Compute actions on real processes (three replicas, two job nodes), which merobox cannot start.
  compute-e2e:
    name: compute actions, real processes
    needs: [plan, build-release]
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPUTE_E2E_DIR: ${{ github.workspace }}/target/compute-e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          # The compute fixture's two components, built from this checkout.
          targets: wasm32-wasip2
          shared-key: ci-checks
          rust-cache: false

      # Optimized like the product: sealing 47 MiB files in a debug build misses the push
      # deadline. `meroctl local compute run` is what compute-redact's output is checked against.
      - name: Download merod, meroctl, the tools and the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-release
          path: .

      # An artifact keeps no file modes.
      - name: Put the tools on PATH
        run: |
          chmod +x target/release/merod target/release/meroctl
          echo "$PWD/target/release" >> "$GITHUB_PATH"

      # Builds app.wasm and compute.wasm, packs and signs them as one .mpk, and installs that.
      - name: Compute scenarios
        run: python3 -I crates/node/tests/fault/compute_e2e.py --skip-cargo-tests

      # The one-command pipeline proof, against a fresh local cluster of the same build.
      - name: Pipeline end to end
        run: scripts/pipeline-e2e.py --local

      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compute-e2e-logs
          path: target/compute-e2e
          if-no-files-found: ignore
          retention-days: 7

  # Nightly: the newest release image's merod runs the process suite of the commit it was
  # built from, so a test added after the release cannot fail it.
  release-image:
    name: Latest release image
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.nightly || inputs.release_image != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The release list and the image commit's tree, through `gh api`.
      contents: read
      # Pulling the image from ghcr.io.
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
      revision: ${{ steps.image.outputs.revision }}
      testable: ${{ steps.image.outputs.testable }}
      scenarios: ${{ steps.image.outputs.scenarios }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the image and take merod out of it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REQUESTED: ${{ inputs.release_image }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != latest ]; then
            # A bare tag (1.0.0-rc.18) names ghcr.io/<owner>/merod:<tag>.
            case "$REQUESTED" in
              */* | *:* | *@*) image=$REQUESTED ;;
              *) image="ghcr.io/${OWNER,,}/merod:$REQUESTED" ;;
            esac
            version=${image##*:}
          else
            # The newest release that published merod: a tagged release whose build
            # failed (1.0.0-rc.16) has no binaries and no image to pull.
            version=$(gh api "repos/$REPO/releases?per_page=20" \
              --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name | startswith("merod_")))][0].tag_name')
            image="ghcr.io/${OWNER,,}/merod:$version"
          fi
          docker pull --platform linux/amd64 "$image"
          revision=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
          if [ -z "$revision" ] || [ "$revision" = "<no value>" ]; then
            revision=$(gh api "repos/$REPO/commits/$version" --jq .sha)
          fi
          mkdir -p release
          id=$(docker create --platform linux/amd64 "$image")
          docker cp "$id:/usr/local/bin/merod" release/merod
          docker rm "$id"
          # The process suite, at that commit: an older release has none.
          testable=false
          if gh api "repos/$REPO/contents/crates/node/tests/fault/suite.py?ref=$revision" --silent 2>/dev/null; then
            testable=true
          fi
          # The scenario runner, at that commit: a release older than it has none.
          scenarios=false
          if gh api "repos/$REPO/contents/crates/node/tests/scenarios.rs?ref=$revision" --silent 2>/dev/null; then
            scenarios=true
          fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "revision=$revision"
            echo "testable=$testable"
            echo "scenarios=$scenarios"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Latest release image"
            echo
            echo "\`$image\` (\`$("$PWD/release/merod" --version 2>/dev/null || echo "merod, no --version")\`), built from $revision."
            if [ "$testable" != true ]; then
              echo
              echo "That commit has no process suite (crates/node/tests/fault/suite.py). Nothing is tested until a release with one ships."
            fi
            if [ "$scenarios" != true ]; then
              echo
              echo "That commit has no scenario runner (crates/node/tests/scenarios.rs), so its scenarios are not run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merod
        if: steps.image.outputs.testable == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-merod
          path: release/merod
          if-no-files-found: error
          retention-days: 1

  # Nightly: the scenarios of the release's commit; the runner links calimero-node, so that
  # commit's source is the release's node. A pre-wasmtime release prebuilds its wasmer apps here.
  release-fixtures:
    name: scenario fixtures (release ${{ needs.release-image.outputs.version }})
    needs: release-image
    if: needs.release-image.outputs.scenarios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: release
          save-if: false

      - name: Setup cargo mero
        if: hashFiles('.github/actions/setup-cargo-mero/action.yml') != ''
        uses: ./.github/actions/setup-cargo-mero

      - name: Build the fixtures (the release's commit)
        run: |
          set -euo pipefail
          if [ -f scripts/build-workflow-fixtures.py ]; then
            python3 scripts/build-workflow-fixtures.py
          else
            mkdir -p target/workflow-wasm
            echo "components only: the runner builds them" > target/workflow-wasm/README.txt
          fi

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-e2e-fixtures
          path: target/workflow-wasm
          if-no-files-found: error
          retention-days: 1

  release-scenarios:
    name: scenarios on release ${{ needs.release-image.outputs.version }} (${{ matrix.shard }}/4)
    needs: [release-image, release-fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
          shared-key: release
          save-if: false

      - name: Setup cargo mero
        if: hashFiles('.github/actions/setup-cargo-mero/action.yml') != ''
        uses: ./.github/actions/setup-cargo-mero

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-e2e-fixtures
          path: target/workflow-wasm

      - name: Scenarios of shard ${{ matrix.shard }} (the release's commit)
        env:
          CORE_WASM_DIR: ${{ github.workspace }}/target/workflow-wasm
          SCENARIO_SHARD: ${{ matrix.shard }}/4
          SCENARIO_FUZZY_SECONDS: ${{ (github.event_name == 'schedule' || inputs.nightly) && '900' || inputs.soak_seconds || '10' }}
        run: cargo test -p calimero-node --test scenarios -- --test-threads 2

  release-process-suite:
    name: process suite on release ${{ needs.release-image.outputs.version }}
    needs: release-image
    if: needs.release-image.outputs.testable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout the release's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-image.outputs.revision }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
          shared-key: release
          save-if: false

      - name: Setup cargo mero
        if: hashFiles('.github/actions/setup-cargo-mero/action.yml') != ''
        uses: ./.github/actions/setup-cargo-mero

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build meroctl and the fixtures (the release's commit)
        run: |
          set -euo pipefail
          cargo build --release -p meroctl
          if [ -d apps/wasmer-fixtures/kv-store ]; then
            # A release from before the wasmer engine was removed: its kv-store.
            cargo build -p kv-store --target wasm32-unknown-unknown --profile app-release
            for v in 1.0.0 1.1.0; do
              (cd apps/wasmer-fixtures/kv-store && cargo mero bundle --dev --no-icon --app-version "$v")
            done
          elif [ ! -e scripts/pack-component.py ]; then
            # A release whose meroctl builds and packs apps itself.
            "${CARGO_TARGET_DIR:-target}/release/meroctl" app build \
              apps/fixture-kv --out "${CARGO_TARGET_DIR:-target}/app-components/kv.wasm"
            for v in 1.0.0 1.1.0; do
              "${CARGO_TARGET_DIR:-target}/release/meroctl" app pack --wasm "${CARGO_TARGET_DIR:-target}/app-components/kv.wasm" \
                --package com.calimero.kv-store --app-version "$v" --out "dist/com.calimero.kv-store-$v.mpk"
            done
          else
            # A release cut before the install script builds the tool from its own checkout.
            if [ -x scripts/install-mero-app-build.sh ]; then
              scripts/install-mero-app-build.sh
            else
              cargo install --path crates/app-build --locked --force
            fi
            mero-app-build \
              apps/fixture-kv --out "${CARGO_TARGET_DIR:-target}/app-components/kv.wasm"
            cargo build --release -p mero-sign
            for v in 1.0.0 1.1.0; do
              python3 -I scripts/pack-component.py --wasm "${CARGO_TARGET_DIR:-target}/app-components/kv.wasm" \
                --mero-sign "${CARGO_TARGET_DIR:-target}/release/mero-sign" \
                --package com.calimero.kv-store --app-version "$v" --out "dist/com.calimero.kv-store-$v.mpk"
            done
          fi

      - name: Download the release's merod
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-merod
          path: target/release-image

      - name: Process suite (every test but the upgrade, a 900 s soak)
        env:
          VERSION: ${{ needs.release-image.outputs.version }}
        run: |
          chmod +x target/release-image/merod
          python3 -I crates/node/tests/fault/suite.py \
            --only kv-failover,frozen-leader,orgs-and-keys,packages,kv-soak --soak-seconds 900 \
            --merod target/release-image/merod --meroctl "${CARGO_TARGET_DIR:-target}/release/meroctl" \
            --soak-report target/release-image/soak.json --json target/release-image/results.json

      - name: Soak latency and throughput
        if: ${{ !cancelled() }}
        env:
          VERSION: ${{ needs.release-image.outputs.version }}
        run: bash scripts/soak-summary.sh target/release-image/soak.json "Soak, kv-store (release $VERSION's merod)"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-process-suite
          path: |
            target/release-image/results.json
            target/release-image/soak.json
            target/fault-suite
          if-no-files-found: ignore
          retention-days: 30

  # One job per client, against `build-release`'s merod: the SDKs live in this tree, so a
  # server change and its client fix land in one PR.
  clients:
    name: clients against merod (${{ matrix.client }})
    needs: [plan, build-release]
    if: needs.plan.outputs.clients == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        client: [mero-js, mero-py, mero-kotlin]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # KV_STORE_WASM is the kv component (apps/fixture-kv: set, get, len,
      # and `clear`, a confirm method it declares itself).
      - name: Download merod and the kv fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-release
          path: .

      - name: Point the clients at them
        run: |
          chmod +x target/release/merod target/release/meroctl
          echo "MEROD_BINARY=$PWD/target/release/merod" >> "$GITHUB_ENV"
          echo "KV_STORE_WASM=$PWD/target/app-components/kv.wasm" >> "$GITHUB_ENV"

      - name: Set up pnpm
        if: matrix.client == 'mero-js'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdks/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.client == 'mero-js'
        with:
          node-version: "22"
          # No package-manager cache: this workflow also publishes, and a cache
          # restored here could be poisoned by another branch (zizmor cache-poisoning).
          package-manager-cache: false

      # mero-js keeps a copy of core's receipt vectors (its `generate` refreshes it).
      - name: mero-js receipt vectors are the ones core produces
        if: matrix.client == 'mero-js'
        run: |
          cmp crates/client/tests/fixtures/receipt-vectors.json sdks/clients/mero-js/src/client/fixtures/receipt-vectors.json \
            || { echo "::error::run python3 scripts/sdks.py generate mero-js: mero-js's receipt vectors differ from crates/client's"; exit 1; }

      # MERO_JS_REQUIRE_COMPUTE makes the pipeline test fail, not skip, so this job cannot pass vacuously.
      - name: mero-js cluster tests
        if: matrix.client == 'mero-js'
        working-directory: sdks
        env:
          MEROCTL: ${{ github.workspace }}/target/release/meroctl
          COMPUTE_WASM: ${{ github.workspace }}/target/app-components/compute.wasm
          COMPUTE_FIXTURE_DIR: ${{ github.workspace }}/apps/fixture-compute
          MERO_JS_REQUIRE_COMPUTE: "1"
        run: |
          pnpm install --frozen-lockfile
          cd clients/mero-js
          pnpm vitest run --config vitest.config.ts src/client/receipts.test.ts
          pnpm test:cluster

      # The client's extension builds with the pinned toolchain.
      - name: Setup Rust CI
        if: matrix.client == 'mero-py'
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          rust-cache: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.client == 'mero-py'
        with:
          python-version: "3.12"

      # The client builds against the core its Cargo.toml pins; what this job
      # tests is that client against this tree's node.
      - name: mero-py cluster tests
        if: matrix.client == 'mero-py'
        working-directory: sdks/clients/mero-py
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin==1.15.0
          pip install -e ".[dev]"
          pytest tests/test_cloud_v2.py tests/test_cloud_v2_api.py -v --tb=short

      # The runner's Android SDK (ANDROID_HOME) builds mero-core; no Gradle
      # cache: this workflow also publishes (zizmor cache-poisoning).
      - name: Set up JDK 17
        if: matrix.client == 'mero-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate the Gradle wrapper
        if: matrix.client == 'mero-kotlin'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # cluster-test.sh starts `merod local` (three nodes) and deploys the kv
      # package build-release packed; the cluster tests fail, not skip, with it set.
      - name: mero-kotlin cluster tests
        if: matrix.client == 'mero-kotlin'
        working-directory: sdks/clients/mero-kotlin
        env:
          MEROD_BIN: ${{ github.workspace }}/target/release/merod
          MERO_KV_MPK: ${{ github.workspace }}/dist/com.calimero.kv-store-1.0.0.mpk
        run: scripts/cluster-test.sh --no-daemon

  # The consent page in Chromium with a virtual WebAuthn authenticator, on three merod processes;
  # runs on any change that reaches the page, `ci:e2e` label or not.
  consent-page:
    name: consent page in a browser
    needs: [plan, build-release]
    if: needs.plan.outputs.consent_page == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download merod and the kv fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-release
          path: .

      - name: Point the tests at them
        run: |
          chmod +x target/release/merod target/release/meroctl
          echo "MEROD_BINARY=$PWD/target/release/merod" >> "$GITHUB_ENV"
          echo "MEROCTL=$PWD/target/release/meroctl" >> "$GITHUB_ENV"
          echo "KV_STORE_WASM=$PWD/target/app-components/kv.wasm" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdks/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # The tests bundle mero-js from source, as an app's page carries it.
      - name: Install the JS workspace
        working-directory: sdks
        run: pnpm install --frozen-lockfile

      - name: Install the tests and Chromium
        working-directory: crates/node/tests/consent-page
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Format
        working-directory: crates/node/tests/consent-page
        run: npm run check

      - name: Consent page tests
        working-directory: crates/node/tests/consent-page
        run: npm test

      - name: Keep the sheets as screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consent-page-screens
          path: crates/node/tests/consent-page/test-results
          if-no-files-found: ignore
          retention-days: 7

  # mero-swift's live-node suite: MeroKit needs CryptoKit, so macOS and a merod built there;
  # a skipped case (an unset variable) fails the job.
  clients-swift:
    name: clients against merod (mero-swift)
    needs: [plan, build-release]
    if: needs.plan.outputs.clients == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The `release` group, on macOS: rust-cache keys by OS, so ci-checks.yml's Linux
      # save never reaches this job, and it built merod cold (about 38 of a queue
      # entry's 50 minutes). The nightly saves it on master, where queue entries and
      # PRs restore it; platforms.yml's macOS build restores it too.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: release
          save-if: ${{ github.event_name == 'schedule' }}

      - name: Build merod for macOS
        run: cargo build -p merod --release --target aarch64-apple-darwin

      - name: Download the kv fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-release
          path: e2e-release

      - name: Start a merod local cluster
        working-directory: sdks/clients/mero-swift
        env:
          MEROD_BIN: ${{ github.workspace }}/target/aarch64-apple-darwin/release/merod
          MEROD_BASE_PORT: "3300"
          MEROD_LOCAL_DIR: ${{ runner.temp }}/merod-local
        run: scripts/dev-cluster.sh up --fresh

      - name: mero-swift cluster tests
        working-directory: sdks/clients/mero-swift
        env:
          MERO_E2E_NODE_URL: http://127.0.0.1:3301
          MERO_E2E_NODES: http://127.0.0.1:3302,http://127.0.0.1:3303
          MERO_E2E_BUNDLE: ${{ github.workspace }}/e2e-release/target/app-components/kv.wasm
          MERO_E2E_MPK: ${{ github.workspace }}/e2e-release/dist/com.calimero.kv-store-1.0.0.mpk
        run: |
          set -euo pipefail
          swift test --filter MeroKitE2ETests 2>&1 | tee "$RUNNER_TEMP/swift-e2e.log"
          summary=$(grep -E 'Executed [0-9]+ tests?, with' "$RUNNER_TEMP/swift-e2e.log" | tail -1)
          echo "$summary"
          if grep -qE 'with [1-9][0-9]* tests? skipped' <<<"$summary"; then
            echo "::error::MeroKitE2ETests skipped cases: every case must run against the cluster"
            exit 1
          fi

      - name: The cluster's logs
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/merod-local/merod.log" || true

      - name: Stop the cluster
        if: always()
        working-directory: sdks/clients/mero-swift
        env:
          MEROD_BIN: ${{ github.workspace }}/target/aarch64-apple-darwin/release/merod
          MEROD_BASE_PORT: "3300"
          MEROD_LOCAL_DIR: ${{ runner.temp }}/merod-local
        run: scripts/dev-cluster.sh down || true
