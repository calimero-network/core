name: Wire Contract

# Committed wire fixtures must round-trip through their Rust DTOs. Regenerate with
# `UPDATE_FIXTURES=1 cargo test -p calimero-server-primitives --test wire_fixtures`.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "crates/server/primitives/**"
      - "crates/primitives/**"
      - ".github/workflows/wire-contract.yml"
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  wire-contract:
    name: Wire Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust toolchain
        # Pinned to a commit SHA (supply-chain hygiene); comment tracks the tag.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: cargo-lock-deps
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Wire-contract fixtures
        run: cargo test -p calimero-server-primitives --test wire_fixtures

      # Fixtures are derived files, so regenerating must be a no-op - this proves
      # the command still works and nobody hand-edited a fixture out of sync with its DTO.
      - name: Fixtures regenerate clean
        run: |
          UPDATE_FIXTURES=1 cargo test -p calimero-server-primitives --test wire_fixtures
          git diff --exit-code
          test -z "$(git status --porcelain)"
