name: Wire Contract

# Committed wire fixtures must round-trip through their Rust DTOs. Regenerate with
# `UPDATE_FIXTURES=1 cargo test -p calimero-server-primitives --test wire_fixtures`.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "crates/server/primitives/**"
      - "crates/primitives/**"
      - ".github/workflows/wire-contract.yml"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
  push:
    branches:
      - master

env:
  # As ci-checks.yml compiles with, so the ci-checks cache this restores is reusable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  wire-contract:
    name: Wire Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The pinned toolchain and the ci-checks cache, which only its owner saves.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          save-if: false

      - name: Wire-contract fixtures
        run: cargo test -p calimero-server-primitives --test wire_fixtures

      # Fixtures are derived files, so regenerating must be a no-op - this proves
      # the command still works and nobody hand-edited a fixture out of sync with its DTO.
      - name: Fixtures regenerate clean
        run: |
          UPDATE_FIXTURES=1 cargo test -p calimero-server-primitives --test wire_fixtures
          git diff --exit-code
          test -z "$(git status --porcelain)"
