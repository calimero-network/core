name: CI

on:
  push:
    # release-v2-parity is the release branch: it never merges into
    # master, so its merges run CI as master's do.
    branches: ["master", "release-v2-parity"]
  merge_group:
  # Every PR, with no `paths:` filter: the `Rust` check is required, and `scope`
  # below skips what a change cannot reach (all of it, for docs). A filter would
  # need a stub workflow to report the check whenever it skipped.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: line-tables-only # keeps the target cache inside the 10 GB Actions budget

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a run of master or the release branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/release-v2-parity' }}

jobs:
  # The macOS release build of the developer CLIs lives in platforms.yml (nightly).

  # Which of the narrow jobs below this change can reach: each is scoped by the
  # packages it builds, followed through their dependency closure, so a change
  # that cannot alter what a job compiles does not run it (scripts/ci-scope.py).
  # Fails closed: any lookup or script failure runs every job.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Test the scope rules
        run: python3 scripts/tests/ci-scope-test.py

      - name: Check no docs-only change starts a code workflow
        run: python3 scripts/tests/ci-paths-test.py

      - name: Check every rust-cache group hashes one environment
        run: python3 scripts/check-rust-cache-groups.py

      # Every scenario file on disk is discovered by the runner or excluded with a reason.
      # The runner checks the same when it runs (e2e.yml), but only this job is required.
      - name: Check every scenario file runs
        run: python3 scripts/check-scenario-discovery.py

      - name: Decide which jobs this change reaches
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # push: the pushed range; merge_group: the queue entry against its base.
          FROM: ${{ github.event.before || github.event.merge_group.base_sha }}
          TO: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -uo pipefail
          # Every failure below leaves `files` empty, and ci-scope.py runs every
          # job on empty input: skipping is the silent direction.
          files=""
          case "$EVENT" in
            pull_request)
              # The files API lists at most 3000 paths.
              if listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename') \
                && [ "$(grep -c . <<<"$listed")" -lt 3000 ]; then
                files=$listed
              fi
              ;;
            push | merge_group)
              # A new branch has an all-zero `before`; compare lists at most 300 files.
              if [ -n "${FROM//0/}" ] \
                && listed=$(gh api "repos/$REPO/compare/$FROM...$TO" --jq '.files[].filename') \
                && [ "$(grep -c . <<<"$listed")" -lt 300 ]; then
                files=$listed
              fi
              ;;
          esac
          [ -n "$files" ] || echo "::notice::could not list this change's files; every job runs"
          printf '%s\n' "$files" | python3 scripts/ci-scope.py >> "$GITHUB_OUTPUT"

  # The required status check: passes only if every Rust job below passes, or was
  # skipped because `scope` found that the change cannot reach it. A failed or
  # skipped `scope` fails it.
  rust:
    name: Rust
    if: ${{ !cancelled() }}
    needs: [scope, rust-lint, rust-test, rust-features, rust-supply-chain, compat, previous-release]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          # job -> the `scope` output that decides whether it runs
          GATES: '{"rust-lint":"rust","rust-test":"rust","rust-features":"rust","rust-supply-chain":"rust","compat":"rust","previous-release":"rust"}'
        run: |
          jq -e --argjson gates "$GATES" '
            .scope.outputs as $scope
            | to_entries | all(
                .value.result == "success"
                or (.value.result == "skipped" and ($gates[.key] // "") != "" and $scope[$gates[.key]] == "false")
              )' <<<"$NEEDS"

  rust-lint:
    name: Rust lint
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          components: rustfmt, clippy
          shared-key: ci-checks
          save-if: false

      - name: Cargo format
        run: cargo fmt --check

      - name: Naming gate
        run: ./scripts/check-naming.sh

      # Fleet nodes run at INFO and operators read their logs, so info! must not carry user data.
      - name: No user data at info level
        run: python3 scripts/check-no-user-data-at-info.py

      - name: Test check-like-ci
        if: ${{ !cancelled() }}
        run: bash scripts/tests/check-like-ci.test.sh

      # ci-scope.py scopes jobs by this closure; one it misses is a source change
      # whose gate never runs.
      - name: Test path-dep-closure against cargo's resolve
        if: ${{ !cancelled() }}
        run: python3 scripts/tests/path-dep-closure-test.py

      - name: Test pack-component
        if: ${{ !cancelled() }}
        run: python3 scripts/tests/pack-component-test.py

      - name: Cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # mock-attestation and calimero-node's outbound-testing are default-off so they
      # never reach a release binary; the workspace clippy never compiles them.
      - name: Cargo clippy (mock-attestation, outbound-testing)
        if: ${{ !cancelled() }}
        run: cargo clippy -p calimero-tee-attestation -p calimero-node --all-targets --features calimero-tee-attestation/mock-attestation,calimero-node/outbound-testing -- -D warnings

  # The only job that saves `ci-checks`; the others restore it read-only.
  rust-test:
    name: Rust tests
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release-v2-parity' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-nextest@0.9.146,cargo-expand@1.0.127

      - name: Cargo test
        run: |
          FIRST_HOST=$(ifconfig | grep 'inet ' | grep -v '127.0.0.1' | awk '{print $2}' | head -n 1)

          export TEST_HOSTS=$FIRST_HOST,127.0.0.1,0.0.0.0
          echo "$TEST_HOSTS"

          cargo nextest run --workspace --no-fail-fast

      - name: Cargo doctests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc

      - name: Install mero-app-build and mero-compute
        if: ${{ !cancelled() }}
        run: |
          scripts/install-mero-app-build.sh
          scripts/install-mero-compute.sh

      # The tool a developer tests a compute method with, run end to end on the fixture: a
      # digest of 300 KB must write one output of the same size, identically twice.
      - name: mero-compute on the compute fixture
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out=target/mero-compute-check
          rm -rf "$out" && mkdir -p "$out"
          mero-app-build \
            apps/v2-fixtures/compute --target-dir "$out/build" --out "$out/app.wasm"
          head -c 300000 /dev/urandom > "$out/input.bin"
          mero-compute run "$out/compute.component.wasm" --method digest \
            --input "$out/input.bin" --out "$out/out" --twice
          test "$(wc -c < "$out/out/output-0")" -eq 300000

      # The README's command for testing compute-redact's compute component alone, on its sample file.
      - name: mero-compute on compute-redact
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out=target/mero-compute-redact
          rm -rf "$out" && mkdir -p "$out"
          mero-app-build apps/compute-redact --target-dir "$out/build" \
            --out "$out/app.wasm" --compute-out "$out/compute.wasm"
          mero-compute run "$out/compute.wasm" --method redact \
            --args @apps/compute-redact/example/redact.json \
            --input apps/compute-redact/example/people.csv --out "$out/out" --twice
          if grep -qE 'acme|4111|415' "$out/out/output-0"; then
            echo "an email, card or phone number survived" >&2
            exit 1
          fi

      - name: Cargo test (standalone v2 apps)
        if: ${{ !cancelled() }}
        # Apps on the component SDK are workspaces of their own, so the workspace run above
        # never reaches their harness tests. Each is found by its calimero-sdk dependency (or
        # calimero-app-sdk, the SDK's old name, while apps move over);
        # one target dir serves them all.
        env:
          CARGO_TARGET_DIR: target/standalone-apps
        run: |
          for manifest in $(grep -lE '^calimero-(app-)?sdk = ' apps/*/Cargo.toml apps/*/*/Cargo.toml); do
            cargo test --manifest-path "$manifest"
          done

      # The same crates as the guests they ship: clippy on the host (tests included) and on
      # wasm32-wasip2, and the release component build the node loads.
      - name: Clippy and wasm32-wasip2 build (standalone v2 apps)
        if: ${{ !cancelled() }}
        env:
          CARGO_TARGET_DIR: target/standalone-apps
        run: |
          set -euo pipefail
          for manifest in $(grep -lE '^calimero-(app-)?sdk = ' apps/*/Cargo.toml apps/*/*/Cargo.toml); do
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo clippy --manifest-path "$manifest" --target wasm32-wasip2 -- -D warnings
            cargo build --manifest-path "$manifest" --release --target wasm32-wasip2
          done

  rust-features:
    name: Rust feature-gated tests
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          save-if: false

      # mock-attestation is default-off so it never reaches a release binary; the workspace tests skip it.
      - name: Cargo test (mock-attestation)
        if: ${{ !cancelled() }}
        run: cargo test -p calimero-tee-attestation --features mock-attestation -- --nocapture

  # What earlier releases' clients, peers and apps rely on (docs: operate/compatibility): no
  # route or JSON field of the API removed without a deprecation or a declared cutover, and
  # no WIT or ABI change without its version (scripts/check-api-compat.py, against the base:
  # the checkout is the PR's merge commit, so HEAD^1 is what it merges into).
  compat:
    name: Compatibility
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test the compatibility checks
        run: |
          python3 scripts/tests/check-api-compat-test.py
          python3 scripts/tests/check-compat-door-test.py

      - name: No route, field, WIT or ABI version dropped
        run: |
          # In CI the checkout is the merge commit; locally, the merge base with origin/master.
          if [ -n "${GITHUB_ACTIONS:-}" ]; then base="HEAD^1"; fi
          python3 scripts/check-api-compat.py ${base:+--base "$base"}

  # An app built and signed by the last published release (its SDK, WIT and mero-sign:
  # the release's kv-store-test-fixture.mpk) installs, runs and upgrades on this tree's
  # node: crates/node/tests/previous-release/kv-store.json on the in-process cluster.
  previous-release:
    name: Apps of the previous release
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: big-machine
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # wasm32-wasip2: this tree's kv, which the scenario upgrades the release's app to.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-wasip2
          shared-key: ci-checks
          save-if: false

      - name: Fetch the previous release's kv bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/fetch-release-app.py --out target/previous-release

      - name: Run it on this tree's node
        run: |
          export PREVIOUS_RELEASE_DIR="$PWD/target/previous-release"
          SCENARIO_FILES=crates/node/tests/previous-release/kv-store.json \
            cargo test -p calimero-node --test scenarios -- --test-threads 1

  rust-supply-chain:
    name: Rust supply chain
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Pinned so an upstream release cannot break CI; cargo-deny needs >= 0.19 for CVSS 4.0 advisories.
      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@0.19.9,cargo-machete@0.9.2

      - name: Cargo deny
        if: ${{ !cancelled() }}
        run: cargo deny check advisories bans licenses sources

      - name: Cargo machete (unused dependencies)
        if: ${{ !cancelled() }}
        run: |
          # A feature-only dep reads as unused; list it in `[package.metadata.cargo-machete] ignored`.
          cargo machete
