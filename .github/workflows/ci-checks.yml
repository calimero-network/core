name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "apps/**"
      - "e2e-tests/**"
      - "tools/**"
      - "scripts/check-wasm-size.sh"
      - "scripts/check-storage-cost.sh"
      - "scripts/check-like-ci.py"
      - "scripts/tests/check-like-ci.test.sh"
      - ".github/workflows/ci-checks.yml"

env:
  CALIMERO_WEBUI_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CALIMERO_AUTH_FRONTEND_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: line-tables-only # keeps the target cache inside the 10 GB Actions budget

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a master run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # Whether a secret written on Windows is unreadable to other local users, which Linux cannot check.
  windows-secrets:
    name: Windows secret permissions
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Test the owner-only file helper
        run: cargo test -p calimero-utils-fs

  # The only job that runs merod on Windows: RocksDB, the server bind and shutdown
  # have no unix stand-in, and the release workflow only builds merod.exe.
  windows-node-smoke:
    name: Windows node smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-node-smoke
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # librocksdb-sys needs libclang for bindgen; aws-lc-sys needs NASM.
      - name: Point bindgen at the image's LLVM
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      # These drive a real node, so they are #[ignore]d by default.
      - name: Drive a real node on Windows
        run: cargo test -p merod --test watchdog_live -- --include-ignored --test-threads 1

  # The required status check: passes only if every Rust job below passes.
  rust:
    name: Rust
    if: ${{ !cancelled() }}
    needs: [rust-lint, rust-test, rust-features, rust-apps, rust-supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"

  rust-lint:
    name: Rust lint
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          components: rustfmt, clippy
          shared-key: ci-checks
          save-if: false

      - name: Cargo format
        run: cargo fmt --check

      - name: Naming gate
        run: ./scripts/check-naming.sh

      # Fleet nodes run at INFO and operators read their logs, so info! must not carry user data.
      - name: No user data at info level
        run: python3 scripts/check-no-user-data-at-info.py

      # Fails when a merobox scenario file is run by no e2e matrix.
      - name: Check every merobox scenario runs somewhere
        if: ${{ !cancelled() }}
        run: python3 scripts/check-scenario-coverage.py

      - name: Test check-like-ci
        if: ${{ !cancelled() }}
        run: bash scripts/tests/check-like-ci.test.sh

      # `calimero-storage/testing` lints that crate's feature-gated harness in the same pass.
      - name: Cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --features calimero-storage/testing -- -D warnings

      - name: Cargo clippy (mock-attestation)
        if: ${{ !cancelled() }}
        run: cargo clippy -p merod -p calimero-node -p calimero-server -p calimero-tee-attestation --all-targets --features mock-attestation -- -D warnings

      # The workspace clippy never compiles merodb's default-off gui feature.
      # Build, not clippy: the gui code still has lint findings.
      - name: Cargo build (merodb gui)
        if: ${{ !cancelled() }}
        run: cargo build -p merodb --features gui

      - name: Cargo check (calimero-context-config)
        if: ${{ !cancelled() }}
        run: cargo check -p calimero-context-config

      - name: Cargo check (merod, local-only init binary)
        if: ${{ !cancelled() }}
        run: cargo check -p merod --no-default-features

  # The only job that saves `ci-checks`; the others restore it read-only.
  rust-test:
    name: Rust tests
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          # Tests that self-build app wasm must not race to install the target.
          targets: wasm32-unknown-unknown
          shared-key: ci-checks
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-nextest@0.9.146

      - name: Cargo test
        run: |
          FIRST_HOST=$(ifconfig | grep 'inet ' | grep -v '127.0.0.1' | awk '{print $2}' | head -n 1)

          export TEST_HOSTS=$FIRST_HOST,127.0.0.1,0.0.0.0
          echo "$TEST_HOSTS"

          # bundle_produces_signed_mpk runs in cargo-mero-e2e, with its own fixture cache and target dir.
          cargo nextest run --workspace --no-fail-fast -E 'not test(=bundle_produces_signed_mpk)'

      - name: Cargo doctests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc

  rust-features:
    name: Rust feature-gated tests
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          shared-key: ci-checks
          save-if: false

      # mock-attestation is default-off so it never reaches a release binary; the workspace tests skip it.
      - name: Cargo test (mock-attestation)
        if: ${{ !cancelled() }}
        run: cargo test -p merod -p calimero-node -p calimero-tee-attestation --features mock-attestation -- --nocapture

      # The stored-format tests sit behind calimero-store's default-off features.
      - name: Cargo test (calimero-store, all features)
        if: ${{ !cancelled() }}
        run: cargo test -p calimero-store --all-features

  rust-apps:
    name: Rust apps
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          shared-key: ci-apps
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build every app
        run: ./scripts/build-all-apps.sh

  rust-supply-chain:
    name: Rust supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Pinned so an upstream release cannot break CI; cargo-deny needs >= 0.19 for CVSS 4.0 advisories.
      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny@0.19.9,cargo-machete@0.9.2

      - name: Cargo deny
        if: ${{ !cancelled() }}
        run: cargo deny check advisories bans licenses sources

      - name: Cargo machete (unused dependencies)
        if: ${{ !cancelled() }}
        run: |
          # A feature-only dep reads as unused; list it in `[package.metadata.cargo-machete] ignored`.
          cargo machete

  cargo-mero-e2e:
    name: cargo-mero e2e
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: cargo-mero-e2e
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cache fixture build output
        uses: actions/cache@v6
        with:
          path: |
            tools/cargo-mero/tests/fixtures/demo-app/target
            tools/cargo-mero/tests/fixtures/multi-app/target
          key: cargo-mero-fixtures-${{ runner.os }}-${{ hashFiles('tools/cargo-mero/tests/fixtures/**/Cargo.toml') }}
          restore-keys: |
            cargo-mero-fixtures-${{ runner.os }}-

      # Each fixture builds into its own cached target dir; --include-ignored adds bundle_produces_signed_mpk.
      - name: Run pipeline e2e
        run: env -u CARGO_TARGET_DIR cargo test -p cargo-mero --test pipeline -- --include-ignored --test-threads 1

  # PR-time guard against a wasm too large for merod to load; the fuzzy suite never runs on PRs.
  wasm-size:
    name: WASM size gate
    runs-on: ubuntu-24.04-8cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: wasm-size
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      # Profiling builds skip wasm-opt, so they are the largest wasm a node is handed.
      - name: Build the fuzzy apps with profiling
        env:
          WASM_PROFILING: "true"
        run: |
          cargo mero build --manifest-path apps/kv-store/Cargo.toml
          cargo mero build --manifest-path apps/kv-store-with-handlers/Cargo.toml
          cargo mero build --manifest-path apps/scaffolding-e2e/Cargo.toml

      - name: Check wasm sizes against the runtime module-size limit
        run: ./scripts/check-wasm-size.sh

  # Storage costs are deterministic, so this gates; wall-clock benchmarks live in benchmarks.yml.
  storage-cost:
    name: Storage cost gate
    runs-on: ubuntu-24.04-8cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          shared-key: storage-cost
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Shape first: it catches a regression even when the snapshot was regenerated to absorb it.
      - name: Assert cost curves keep their declared shape
        run: cargo test -p storage-cost --release -- --include-ignored

      - name: Check storage costs against the committed snapshot
        run: ./scripts/check-storage-cost.sh
