name: CI

on:
  push:
    branches: ["master"]
  merge_group:
  # Every PR, with no `paths:` filter: the `Rust` check is required, and `scope`
  # below skips what a change cannot reach (all of it, for docs). A filter would
  # need a stub workflow to report the check whenever it skipped.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  # No debuginfo in CI: a smaller target cache (faster to restore) and faster links of
  # the test binaries. A failing test still names its file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a run of master.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The macOS release build of the developer CLIs lives in platforms.yml (nightly).

  # Which of the narrow jobs below this change can reach: each is scoped by the
  # packages it builds, followed through their dependency closure, so a change
  # that cannot alter what a job compiles does not run it (scripts/ci-scope.py).
  # Fails closed: any lookup or script failure runs every job.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      upgrade_path: ${{ steps.decide.outputs.upgrade_path }}
      standalone_apps: ${{ steps.decide.outputs.standalone_apps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Test the scope rules
        run: python3 scripts/tests/ci-scope-test.py

      - name: Check no docs-only change starts a code workflow
        run: python3 scripts/tests/ci-paths-test.py

      - name: Check every rust-cache group hashes one environment
        run: python3 scripts/check-rust-cache-groups.py

      # Every scenario file on disk is discovered by the runner or excluded with a reason.
      # The runner checks the same when it runs (e2e.yml), but only this job is required.
      - name: Check every scenario file runs
        run: python3 scripts/check-scenario-discovery.py

      - name: Decide which jobs this change reaches
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # push: the pushed range; merge_group: the queue entry against its base.
          FROM: ${{ github.event.before || github.event.merge_group.base_sha }}
          TO: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -uo pipefail
          # Every failure below leaves `files` empty, and ci-scope.py runs every
          # job on empty input: skipping is the silent direction.
          files=""
          case "$EVENT" in
            pull_request)
              # The files API lists at most 3000 paths.
              if listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename') \
                && [ "$(grep -c . <<<"$listed")" -lt 3000 ]; then
                files=$listed
              fi
              ;;
            push | merge_group)
              # A new branch has an all-zero `before`; compare lists at most 300 files.
              if [ -n "${FROM//0/}" ] \
                && listed=$(gh api "repos/$REPO/compare/$FROM...$TO" --jq '.files[].filename') \
                && [ "$(grep -c . <<<"$listed")" -lt 300 ]; then
                files=$listed
              fi
              ;;
          esac
          [ -n "$files" ] || echo "::notice::could not list this change's files; every job runs"
          printf '%s\n' "$files" | python3 scripts/ci-scope.py >> "$GITHUB_OUTPUT"

  # The required status check: passes only if every Rust job below passes, or was
  # skipped because `scope` found that the change cannot reach it. A failed or
  # skipped `scope` fails it.
  #
  # Each job runs unless its verdict is exactly `false`: `scope` runs a PR head's
  # ci-scope.py under master's workflow, and a branch older than a verdict prints
  # none for it, so a missing verdict runs the job rather than skipping it and
  # failing this check.
  rust:
    name: Rust
    if: ${{ !cancelled() }}
    needs: [scope, rust-quick, rust-lint, rust-test, rust-apps, rust-compute-tools, rust-features, rust-supply-chain, compat, upgrade-path]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Rust job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          # job -> the `scope` output that decides whether it runs
          GATES: '{"rust-quick":"rust","rust-lint":"rust","rust-test":"rust","rust-apps":"standalone_apps","rust-compute-tools":"rust","rust-features":"rust","rust-supply-chain":"rust","compat":"rust","upgrade-path":"upgrade_path"}'
        run: |
          # A push to master runs only the jobs that save caches (the merge queue ran
          # the rest on this tree), so there a gated job may be skipped.
          jq -e --argjson gates "$GATES" --arg event "$EVENT" '
            .scope.outputs as $scope
            | to_entries | all(
                .value.result == "success"
                or (.value.result == "skipped" and ($gates[.key] // "") != ""
                    and ($scope[$gates[.key]] == "false" or $event == "push"))
              )' <<<"$NEEDS"

  # The checks that need no build: they fail a PR in about a minute, before the
  # jobs that compile start (they wait on this one).
  rust-quick:
    name: Rust quick checks
    needs: scope
    if: needs.scope.outputs.rust != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Cargo format
        run: cargo fmt --check

      - name: Naming gate
        if: ${{ !cancelled() }}
        run: ./scripts/check-naming.sh

      # Fleet nodes run at INFO and operators read their logs, so info! must not carry user data.
      - name: No user data at info level
        if: ${{ !cancelled() }}
        run: python3 scripts/check-no-user-data-at-info.py

      - name: Test check-like-ci
        if: ${{ !cancelled() }}
        run: bash scripts/tests/check-like-ci.test.sh

      # ci-scope.py scopes jobs by this closure; one it misses is a source change
      # whose gate never runs.
      - name: Test path-dep-closure against cargo's resolve
        if: ${{ !cancelled() }}
        run: python3 scripts/tests/path-dep-closure-test.py

      - name: Test pack-component
        if: ${{ !cancelled() }}
        run: python3 scripts/tests/pack-component-test.py

  # Clippy builds in check mode, which the test build's cache does not hold, so lint
  # keeps a group of its own, saved by a push to master (the one push job that lints).
  rust-lint:
    name: Rust lint
    needs: [scope, rust-quick]
    if: needs.scope.outputs.rust != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          components: clippy
          shared-key: ci-lint
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # mock-attestation and calimero-node's outbound-testing are default-off so they
      # never reach a release binary; the workspace clippy never compiles them.
      - name: Cargo clippy (mock-attestation, outbound-testing)
        if: ${{ !cancelled() }}
        run: cargo clippy -p calimero-tee-attestation -p calimero-node --all-targets --features calimero-tee-attestation/mock-attestation,calimero-node/outbound-testing -- -D warnings

  # The workspace tests in four shards. Each compiles the tests itself: rust-cache
  # restores the dependencies and the workspace's own crates as master last built
  # them, so a shard rebuilds only what the change reaches (setup-rust-ci's
  # `workspace-crates`). A nextest archive built once was 8 GB, slower to download
  # than to build. Shard 1 saves `ci-checks` on master, the only job that does; it
  # also runs the doctests, and shard 2 the previous release's app.
  rust-test:
    name: Rust tests (${{ matrix.shard }}/4)
    needs: [scope, rust-quick]
    if: needs.scope.outputs.rust != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A push to master runs shard 1 alone, the same quarter of the tests a PR's
        # shard 1 runs: the merge queue already ran every test on this tree, and the
        # push only refreshes the caches. The build it saves is the whole workspace's
        # whatever the quarter, and the test apps it saves are those its tests build
        # (the shared fixtures; a guest only another quarter uses is built on a miss).
        # Running every test here took past the job's hour on four cores, so nothing
        # was saved.
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1, 2, 3, 4]') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.shard == 1 }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146,cargo-expand@1.0.127

      # The test apps the tests build from source on first use: every guest and fixture
      # (target/app-components, cached there by source hash, one cargo target dir for all;
      # calimero_app_build::build_in_repo_cache), app-build's own test builds
      # (CARGO_TARGET_TMPDIR, target/tmp) and the SDK's compile-fail cases (trybuild's
      # target/tests/trybuild). Most of the slowest tests' time was these builds. Restored after setup-rust-ci marked what changed,
      # so cargo rebuilds a guest only if its sources did; saved from master below.
      - name: Restore the test apps' builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/tmp
            target/app-components
            target/tests/trybuild
          key: test-apps-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/sdk/**', 'crates/sdk-macros/**', 'crates/app-sdk/**', 'crates/app-wit/**', 'crates/app-build/**', 'crates/*/tests/guests/**', 'apps/**') }}
          restore-keys: test-apps-v2-

      # Every test app the tests build, compiled before them into the component cache, so a
      # test only ever reads one: a compile is a build step's time, never a test's (the 15 s
      # budget below). Seconds once the test-app cache is warm.
      - name: Build the test apps
        run: cargo run -p calimero-app-build --example build-test-apps

      # PARTITION is unset in a local run (scripts/check-like-ci.py), which then runs them
      # all.
      # Twice the cores: most slow tests wait on timers and the network, not the
      # CPU. The node's integration tests, which do load it, take three or four of
      # these slots each (.config/nextest.toml).
      - name: Cargo test
        env:
          PARTITION: ${{ format('count:{0}/4', matrix.shard) }}
          NEXTEST_TEST_THREADS: "8"
          # No test may run past 15 s: .config/nextest.toml's ci profile kills it at 30 s,
          # past its own listed limit for the tests over budget when the rule came in.
          NEXTEST_PROFILE: ci
        run: |
          FIRST_HOST=$(hostname -I | awk '{print $1}')
          export TEST_HOSTS=$FIRST_HOST,127.0.0.1,0.0.0.0
          echo "$TEST_HOSTS"
          cargo nextest run --workspace ${PARTITION:+--partition "$PARTITION"} --no-fail-fast

      # The doctests, in the shard that already built the libraries they link.
      - name: Cargo doctests
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: cargo test --workspace --doc

      # An app built and signed by the last published release (its SDK, WIT and
      # mero-sign: the release's kv-store-test-fixture.mpk) installs, runs and
      # upgrades on this tree's node: crates/node/tests/previous-release/kv-store.json
      # on the in-process cluster, with the scenario runner this shard already built.
      - name: Fetch the previous release's kv bundle
        if: ${{ !cancelled() && matrix.shard == 2 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/fetch-release-app.py --out target/previous-release

      - name: Apps of the previous release, on this tree's node
        if: ${{ !cancelled() && matrix.shard == 2 }}
        run: |
          export PREVIOUS_RELEASE_DIR="$PWD/target/previous-release"
          SCENARIO_FILES=crates/node/tests/previous-release/kv-store.json \
            cargo test -p calimero-node --test scenarios -- --test-threads 1

      - name: Save the test apps' builds
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && matrix.shard == 1 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/tmp
            target/app-components
            target/tests/trybuild
          key: test-apps-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/sdk/**', 'crates/sdk-macros/**', 'crates/app-sdk/**', 'crates/app-wit/**', 'crates/app-build/**', 'crates/*/tests/guests/**', 'apps/**') }}


  # Apps on the component SDK are workspaces of their own, so the workspace tests
  # never reach their harness tests. Each is found by its calimero-sdk dependency
  # (or calimero-app-sdk, the SDK's old name, while apps move over) and taken by
  # one of three shards, every third in sorted order.
  # Only when the change reaches an app: apps/ or the SDK crates they build against
  # (scripts/ci-scope.py, `standalone_apps`). A push to master runs it to save its cache.
  rust-apps:
    name: Rust standalone apps (${{ matrix.shard }}/3)
    needs: [scope, rust-quick]
    if: needs.scope.outputs.standalone_apps != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          rust-cache: false

      # The apps build in a target dir of their own, which rust-cache does not keep: each
      # shard caches it with the registry, saved from master. Cargo rebuilds the apps and
      # the SDK they reach by path (fresh checkout times) and reuses every dependency.
      - name: Restore the apps' builds
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/standalone-apps
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: standalone-apps-v1-${{ matrix.shard }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'apps/**/Cargo.lock') }}
          restore-keys: standalone-apps-v1-${{ matrix.shard }}-

      # SHARD is unset in a local run (scripts/check-like-ci.py), which then takes every app.
      # The same crates as the guests they ship: their tests, clippy on the host (tests
      # included) and on wasm32-wasip2, and the release component build the node loads.
      - name: Test, clippy and wasm32-wasip2 build
        env:
          SHARD: ${{ matrix.shard }}
          # One target dir for every app, apart from the workspace's.
          CARGO_TARGET_DIR: target/standalone-apps
        run: |
          set -euo pipefail
          i=0
          for manifest in $(grep -lE '^calimero-(app-)?sdk = ' apps/*/Cargo.toml apps/*/*/Cargo.toml | sort); do
            i=$((i + 1))
            if [ -n "${SHARD:-}" ] && [ $(( (i - 1) % 3 + 1 )) -ne "$SHARD" ]; then continue; fi
            echo "::group::$manifest"
            cargo test --manifest-path "$manifest"
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo clippy --manifest-path "$manifest" --target wasm32-wasip2 -- -D warnings
            cargo build --manifest-path "$manifest" --release --target wasm32-wasip2
            echo "::endgroup::"
          done


  # The compute tools a developer tests a compute method with, end to end.

      - name: Save the apps' builds
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/standalone-apps
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: standalone-apps-v1-${{ matrix.shard }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'apps/**/Cargo.lock') }}

  rust-compute-tools:
    name: mero-compute end to end
    needs: [scope, rust-quick]
    if: needs.scope.outputs.rust != 'false' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          rust-cache: false

      - name: Install mero-app-build and mero-compute
        run: |
          scripts/install-mero-app-build.sh
          scripts/install-mero-compute.sh

      # A digest of 300 KB must write one output of the same size, identically twice.
      - name: mero-compute on the compute fixture
        run: |
          set -euo pipefail
          out=target/mero-compute-check
          rm -rf "$out" && mkdir -p "$out"
          mero-app-build \
            apps/v2-fixtures/compute --target-dir "$out/build" --out "$out/app.wasm"
          head -c 300000 /dev/urandom > "$out/input.bin"
          mero-compute run "$out/compute.component.wasm" --method digest \
            --input "$out/input.bin" --out "$out/out" --twice
          test "$(wc -c < "$out/out/output-0")" -eq 300000

      # The README's command for testing compute-redact's compute component alone, on its sample file.
      - name: mero-compute on compute-redact
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out=target/mero-compute-redact
          rm -rf "$out" && mkdir -p "$out"
          mero-app-build apps/compute-redact --target-dir "$out/build" \
            --out "$out/app.wasm" --compute-out "$out/compute.wasm"
          mero-compute run "$out/compute.wasm" --method redact \
            --args @apps/compute-redact/example/redact.json \
            --input apps/compute-redact/example/people.csv --out "$out/out" --twice
          if grep -qE 'acme|4111|415' "$out/out/output-0"; then
            echo "an email, card or phone number survived" >&2
            exit 1
          fi

  rust-features:
    name: Rust feature-gated tests
    needs: [scope, rust-quick]
    if: needs.scope.outputs.rust != 'false' && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          save-if: false

      # mock-attestation is default-off so it never reaches a release binary; the workspace tests skip it.
      - name: Cargo test (mock-attestation)
        if: ${{ !cancelled() }}
        run: cargo test -p calimero-tee-attestation --features mock-attestation -- --nocapture

  # What earlier releases' clients, peers and apps rely on (docs: operate/compatibility): no
  # route or JSON field of the API removed without a deprecation or a declared cutover, and
  # no WIT or ABI change without its version (scripts/check-api-compat.py, against the base:
  # the checkout is the PR's merge commit, so HEAD^1 is what it merges into).
  compat:
    name: Compatibility
    needs: scope
    if: needs.scope.outputs.rust != 'false' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test the compatibility checks
        run: |
          python3 scripts/tests/check-api-compat-test.py
          python3 scripts/tests/check-compat-door-test.py

      - name: No route, field, WIT or ABI version dropped
        run: |
          # In CI the checkout is the merge commit; locally, the merge base with origin/master.
          if [ -n "${GITHUB_ACTIONS:-}" ]; then base="HEAD^1"; fi
          python3 scripts/check-api-compat.py ${base:+--base "$base"}

  rust-supply-chain:
    name: Rust supply chain
    needs: scope
    if: needs.scope.outputs.rust != 'false' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Pinned so an upstream release cannot break CI; cargo-deny needs >= 0.19 for CVSS 4.0 advisories.
      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.19.9,cargo-machete@0.9.2

      - name: Cargo deny
        if: ${{ !cancelled() }}
        run: cargo deny check advisories bans licenses sources

      - name: Cargo machete (unused dependencies)
        if: ${{ !cancelled() }}
        run: |
          # A feature-only dep reads as unused; list it in `[package.metadata.cargo-machete] ignored`.
          cargo machete

  # Every cluster must roll forward from the release pinned in .github/upgrade-from
  # (the latest published one) to this tree. A 3-node cluster and a job node start on
  # that release's published merod; its meroctl writes accounts, keys, an organization
  # with teams and app teams, a signed package's app with history, blobs, sealed files
  # of several segments and a finished compute run. The cluster is then rolled onto
  # this tree's merod as mdma rolls a Calimero Cloud cluster (approve the release, add
  # three nodes, move every app, remove the old nodes), checked while both releases
  # hold apps, read back, extended (an app upgrade, a new sealed file, compute over the
  # old files), and read again after a new node restarts from its data
  # (crates/node/tests/fault/upgrade_path.py, scripts/upgrade-path.sh). A change that
  # breaks it ships a reader or migration, or declares a hard cutover in
  # .github/upgrade-from (docs: contribute/testing, "Upgrade path").
  upgrade-path:
    name: Upgrade path (from the pinned release)
    needs: [scope, rust-quick]
    if: needs.scope.outputs.upgrade_path != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # wasm32-wasip2: this tree's kv and the release's compute fixture. The release
      # group: the same release build of merod and meroctl (without fat LTO) as
      # e2e's process suite and a PR's Build Binaries. This job saves it, on master
      # only; it was dropped while the repository's cache
      # was capped at 10 GB, and every release build was then cold.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-wasip2
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # This tree's merod is built optimized without fat LTO (as compute-e2e's is):
      # the upgrade path tests what the node reads and writes, not how it links,
      # and fat LTO's single-threaded link was most of this job. Set on this step
      # only, so the cache step above hashes what the release group's other jobs do.
      - name: Upgrade path
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: scripts/upgrade-path.sh

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-path
          # A failed run keeps its work directory: each node's nodeN.log and data.
          path: |
            target/upgrade-path.json
            target/upgrade-path
          if-no-files-found: ignore
          retention-days: 14
