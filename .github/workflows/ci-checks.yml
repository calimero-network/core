name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "apps/**"
      - "e2e-tests/**"
      - "tools/**"
      - "scripts/check-wasm-size.sh"
      - "scripts/check-storage-cost.sh"
      - "scripts/check-like-ci.py"
      - "scripts/tests/check-like-ci.test.sh"
      - ".github/workflows/ci-checks.yml"

env:
  CALIMERO_WEBUI_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CALIMERO_AUTH_FRONTEND_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_PROFILE_DEV_DEBUG: line-tables-only # full debuginfo made the test cache ~7 GB of a 10 GB budget

permissions:
  contents: read

# Cancel superseded PR runs; never cancel a master run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The one thing about this repository that cannot be checked on Linux: whether
  # a secret written on Windows is readable by other local users. `calimero-utils-fs`
  # has no C dependencies, so this is a small, fast job rather than a second full
  # Windows build -- and without it the ACL claim is asserted nowhere.
  windows-secrets:
    name: Windows secret permissions
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Test the owner-only file helper
        run: cargo test -p calimero-utils-fs

  # The only place merod is RUN on Windows rather than merely built. Everything
  # else Windows-related in this repository is a build-time property, and "the
  # binary links" says nothing about whether RocksDB opens, the server binds, or
  # the node can be stopped -- the three things that have no unix equivalent to
  # borrow confidence from.
  #
  # Costs one Windows runner (~4 min with a warm cache) per pull request. That
  # is deliberate: a merod.exe that cannot start is shipped to users by the
  # release workflow, which only builds it.
  windows-node-smoke:
    name: Windows node smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-node-smoke
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Same two the release build needs: librocksdb-sys is pulled with
      # `bindgen-runtime`, and aws-lc-sys assembles its x86_64 primitives with NASM.
      - name: Point bindgen at the image's LLVM
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      # `--include-ignored` because these drive a real node and are ignored by
      # default. The unix-only watches are `cfg(unix)` and simply do not exist
      # here; what remains is start, serve, stop.
      - name: Drive a real node on Windows
        run: cargo test -p merod --test watchdog_live -- --include-ignored --test-threads 1

  # `Rust` is the required status check; the work is split into the jobs below
  # so lint, tests and the app build run side by side instead of in one queue.
  rust:
    name: Rust
    if: ${{ !cancelled() }}
    needs: [rust-lint, rust-test, rust-features, rust-apps, rust-supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<<"$NEEDS"

  rust-lint:
    name: Rust lint
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          components: rustfmt, clippy
          shared-key: ci-checks
          save-if: false

      - name: Cargo format
        run: cargo fmt --check

      - name: Naming gate
        run: ./scripts/check-naming.sh

      # A fleet node ships its journal to a store operators can read, and merod
      # runs at INFO there (`DEFAULT_DIRECTIVES`; nothing sets RUST_LOG on a
      # node image). So an `info!` naming an account, or logging an app's own
      # output, puts user data in front of an operator -- which the product
      # promises never happens. `WASM_LOG` did exactly that, and
      # `perform_intent` logged which account performed which method on the
      # path every relay has open by design.
      - name: No user data at info level
        run: python3 scripts/check-no-user-data-at-info.py

      # A scenario file that no matrix runs looks maintained and gates nothing.
      # That has happened repeatedly and silently: replacing a glob with an
      # enumeration orphaned fourteen scenarios at once while naming none of
      # them in the diff, a later parallelisation dropped one of an app's two
      # scenarios, and scenarios written afterwards had no way to signal that a
      # matrix entry was also required. This reconciles the two lists so the
      # next occurrence fails the build instead of going unnoticed.
      - name: Check every merobox scenario runs somewhere
        if: ${{ !cancelled() }}
        run: python3 scripts/check-scenario-coverage.py

      - name: Test check-like-ci
        if: ${{ !cancelled() }}
        run: bash scripts/tests/check-like-ci.test.sh

      # No-warnings gate: every workspace target (libs, bins, tests, examples)
      # must be clippy- and rustc-warning-free. `--features calimero-storage/testing`
      # pulls in that crate's feature-gated `testing` harness so it's linted in the
      # same single pass. Run the same command locally before pushing.
      - name: Cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --features calimero-storage/testing -- -D warnings

      - name: Cargo clippy (mock-attestation)
        if: ${{ !cancelled() }}
        run: cargo clippy -p merod -p calimero-node -p calimero-server -p calimero-tee-attestation --all-targets --features mock-attestation -- -D warnings

      # merodb's `gui` feature is default-OFF, and `--all-targets` skips a
      # feature-gated target rather than failing on it, so the workspace clippy
      # above never compiles `src/gui/` or the ~20 `#[cfg(feature = "gui")]`
      # sites in main.rs/dag.rs/export.rs. Without this step that code is free
      # to stop compiling unnoticed, which is exactly what happened: a
      # `CollectionType::Tuple` variant was added to the ABI schema and the
      # gui-gated match in export.rs was never updated, so `merodb --gui` — a
      # documented debugging tool — did not build at all.
      #
      # This builds rather than clippies: the gui code predates any lint gate
      # and still carries ~60 `-D warnings` findings. Tighten this to `cargo
      # clippy … -- -D warnings` once those are cleared.
      - name: Cargo build (merodb gui)
        if: ${{ !cancelled() }}
        run: cargo build -p merodb --features gui

      - name: Cargo check (calimero-context-config)
        if: ${{ !cancelled() }}
        run: cargo check -p calimero-context-config

      - name: Cargo check (merod, local-only init binary)
        if: ${{ !cancelled() }}
        run: cargo check -p merod --no-default-features

  # The only job that saves `ci-checks`; the others restore it read-only, so one
  # writer keeps the cache inside the repository's 10 GB budget.
  rust-test:
    name: Rust tests
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          # Tests that run an app's wasm build it; parallel processes must not race to add the target.
          targets: wasm32-unknown-unknown
          shared-key: ci-checks
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-nextest@0.9.146

      # nextest runs every test binary in parallel; `cargo test` runs them one
      # after another, so the slowest binaries used to add up end to end.
      - name: Cargo test
        run: |
          FIRST_HOST=$(ifconfig | grep 'inet ' | grep -v '127.0.0.1' | awk '{print $2}' | head -n 1)

          export TEST_HOSTS=$FIRST_HOST,127.0.0.1,0.0.0.0
          echo "$TEST_HOSTS"

          # bundle_produces_signed_mpk builds a wasm32 fixture and needs the
          # cargo-mero-e2e job's fixture cache and target-dir isolation; skip
          # it here so it doesn't build into this job's shared CARGO_TARGET_DIR.
          cargo nextest run --workspace --no-fail-fast -E 'not test(=bundle_produces_signed_mpk)'

      - name: Cargo doctests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc

  rust-features:
    name: Rust feature-gated tests
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          shared-key: ci-checks
          save-if: false

      # The mock TEE attestation path is compiled out by default (the
      # `mock-attestation` feature is default-OFF so it never reaches a release
      # binary). The default workspace tests therefore do NOT cover it, so
      # rust-lint lints and this job runs the mock-only tests explicitly,
      # otherwise that coverage silently disappears. Covers: merod KMS
      # mock-attest tests, `merod tee probe --mock-tee` tests, and the
      # calimero-node mock-fleet governance harness (`local_governance_node_e2e` + `cascade_dispatch_e2e`).
      - name: Cargo test (mock-attestation)
        if: ${{ !cancelled() }}
        run: cargo test -p merod -p calimero-node -p calimero-tee-attestation --features mock-attestation -- --nocapture

      # calimero-store's borsh/serde impls sit behind default-OFF features, so
      # the workspace tests compile none of the stored-format
      # tests - the ones that pin what a node can still decode after an upgrade.
      - name: Cargo test (calimero-store, all features)
        if: ${{ !cancelled() }}
        run: cargo test -p calimero-store --all-features

  # Builds and bundles every in-repo app; nothing else in this workflow needs
  # the artifacts, so it runs beside the tests rather than ahead of them.
  rust-apps:
    name: Rust apps
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          shared-key: ci-apps
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build every app
        run: ./scripts/build-all-apps.sh

  rust-supply-chain:
    name: Rust supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # Pin both tools so an upstream release cannot red CI on its own schedule:
      # cargo-deny 0.19.9 parses modern (CVSS 4.0) advisories, which 0.16.3 could not.
      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny@0.19.9,cargo-machete@0.9.2

      - name: Cargo deny
        if: ${{ !cancelled() }}
        run: cargo deny check advisories bans licenses sources

      - name: Cargo machete (unused dependencies)
        if: ${{ !cancelled() }}
        run: |
          # Catches dependencies nothing references any more. 35 had accumulated
          # before this gate existed, three of them listed as "key deps" in their
          # own crate's AGENTS.md — nobody had a reason to look.
          #
          # A dep linked only through a feature reads as unused; the escape hatch is
          # `[package.metadata.cargo-machete] ignored`, only once removal really breaks the build.
          cargo machete

  cargo-mero-e2e:
    name: cargo-mero e2e
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: cargo-mero-e2e
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Cache fixture build output
        uses: actions/cache@v6
        with:
          path: |
            tools/cargo-mero/tests/fixtures/demo-app/target
            tools/cargo-mero/tests/fixtures/multi-app/target
          key: cargo-mero-fixtures-${{ runner.os }}-${{ hashFiles('tools/cargo-mero/tests/fixtures/**/Cargo.toml') }}
          restore-keys: |
            cargo-mero-fixtures-${{ runner.os }}-

      # env -u CARGO_TARGET_DIR: each fixture must build into its own cached target dir.
      # --include-ignored: also runs bundle_produces_signed_mpk (skipped in the
      # main Rust job's workspace-wide `cargo test`) alongside the #[ignore]d tests.
      - name: Run pipeline e2e
        run: env -u CARGO_TARGET_DIR cargo test -p cargo-mero --test pipeline -- --include-ignored --test-threads 1

  # The fuzzy suite installs profiling-built wasms but never runs on a PR;
  # this is the PR-time guard against a module merod refuses to load.
  wasm-size:
    name: WASM size gate
    runs-on: ubuntu-24.04-8cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: wasm-size
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      # WASM_PROFILING skips wasm-opt, so these are the largest builds of these
      # apps anyone ships, matching what fuzzy-load-test.yml hands to a node.
      - name: Build the fuzzy apps with profiling
        env:
          WASM_PROFILING: "true"
        run: |
          cargo mero build --manifest-path apps/kv-store/Cargo.toml
          cargo mero build --manifest-path apps/kv-store-with-handlers/Cargo.toml
          cargo mero build --manifest-path apps/scaffolding-e2e/Cargo.toml

      - name: Check wasm sizes against the runtime module-size limit
        run: ./scripts/check-wasm-size.sh

  # Storage costs are deterministic, so this gates. Wall-clock benchmarks do
  # not; see benchmarks.yml.
  storage-cost:
    name: Storage cost gate
    runs-on: ubuntu-24.04-8cpu
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          shared-key: storage-cost
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Shape first: it catches a complexity regression even when the snapshot
      # was regenerated to absorb it. This job is the only place the slow cost
      # tests run, hence --include-ignored.
      - name: Assert cost curves keep their declared shape
        run: cargo test -p storage-cost --release -- --include-ignored

      - name: Check storage costs against the committed snapshot
        run: ./scripts/check-storage-cost.sh
