name: SDK mero-swift

# mero-swift (sdks/clients/mero-swift): the Swift SDK, its package named
# mero-swift, its modules MeroKit, MeroAPI, MeroKitUI and
# MeroKitTestSupport. sdks.yml calls this to test it (when scripts/sdks.py
# scope says a change reaches it).
#
# Test: build and unit tests, SwiftLint and swift-format, and the sample app
# built for the iOS Simulator; with `ui-tests`, its XCUITest suite too. The
# live-node e2e suite (MeroKitE2ETests) is not run here: it needs a
# `merod local` cluster, so e2e.yml's `clients-swift` job runs it. The
# generated layer's drift against docs/public/openapi.json is sdks.yml's
# `SDK codegen drift` job.
#
# Publish: there is nothing to upload. SwiftPM installs a package from the root
# of a git repository, so core's root Package.swift points at this directory's
# sources, and a core release tag is a version:
# `.package(url: "https://github.com/calimero-network/core", exact: "<VERSION>")`.
# The `Root Package.swift matches` step checks that manifest against this one.
# There is no CocoaPods pod: its trunk turns read-only on 2026-12-02, and
# MeroKit's dependencies (swift-openapi-runtime, swift-http-types) are not on it.

on:
  workflow_call:
    inputs:
      ui-tests:
        description: Also run the sample app's XCUITest suite in the iOS Simulator
        type: boolean
        default: false

permissions:
  contents: read

env:
  SDK_DIR: sdks/clients/mero-swift

jobs:
  build-test:
    name: mero-swift build and test
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sdks/clients/mero-swift
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Core's root Package.swift is how SwiftPM installs this SDK from core's
      # URL. It lists the libraries only; their targets, dependencies and
      # settings must be this manifest's, and its paths must resolve.
      - name: Root Package.swift matches
        working-directory: .
        run: |
          set -euo pipefail
          swift package dump-package > "$RUNNER_TEMP/root.json"
          swift package --package-path "$SDK_DIR" dump-package > "$RUNNER_TEMP/sdk.json"
          swift package describe > /dev/null
          python3 - "$RUNNER_TEMP/root.json" "$RUNNER_TEMP/sdk.json" <<'EOF'
          import json, sys
          root, sdk = (json.load(open(p)) for p in sys.argv[1:])
          def libs(m):
              return {p["name"]: p["targets"] for p in m["products"] if "library" in p["type"]}
          def targets(m):
              return {t["name"]: {k: t.get(k) for k in ("dependencies", "settings", "resources", "exclude")}
                      for t in m["targets"] if t["type"] == "regular"}
          def deps(m):
              return m["dependencies"]
          bad = [what for what, f in (("library products", libs), ("library targets", targets), ("dependencies", deps), ("platforms", lambda m: m["platforms"])) if f(root) != f(sdk)]
          for what in bad:
              print(f"::error::Package.swift and sdks/clients/mero-swift/Package.swift differ in their {what}")
          sys.exit(1 if bad else 0)
          EOF

  lint:
    name: mero-swift lint
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/clients/mero-swift
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install linters
        run: brew install swiftlint swift-format

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: swift-format lint
        run: swift-format lint --recursive --strict Sources Tests examples

  examples:
    name: mero-swift examples
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: sdks/clients/mero-swift/examples/MeroSampleApp
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      # generate-ios.sh rewrites this key to the developer's Mac LAN IP for a
      # physical-device install; committed, it points every simulator run at an
      # address a runner cannot reach.
      - name: The sample app's default node URL is loopback
        run: |
          set -euo pipefail
          URL=$(sed -n 's/.*DefaultNodeURL: *"\(.*\)".*/\1/p' project.yml)
          echo "DefaultNodeURL: ${URL:-<unset>}"
          case "$URL" in
            http://localhost:*|http://127.0.0.1:*) ;;
            *) echo "::error file=$SDK_DIR/examples/MeroSampleApp/project.yml::DefaultNodeURL must be a loopback URL, got '${URL:-<unset>}'"; exit 1 ;;
          esac

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the sample app and its UI tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MeroSampleApp.xcodeproj \
            -scheme MeroSampleApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run the UI tests
        if: inputs.ui-tests
        run: |
          set -o pipefail
          # Any available iPhone simulator, whatever the runner image has.
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone 1[0-9][^(]*' | head -1 | xargs)
          echo "Using simulator: ${DEVICE:-iPhone 16}"
          # -retry-tests-on-failure absorbs launch flakes; a broken test still
          # fails every iteration.
          xcodebuild test \
            -project MeroSampleApp.xcodeproj \
            -scheme MeroSampleApp \
            -destination "platform=iOS Simulator,name=${DEVICE:-iPhone 16}" \
            -retry-tests-on-failure -test-iterations 3 \
            | tee xcuitest.log
          grep -qE "Test Suite '(All tests|Selected tests)' passed" xcuitest.log \
            && grep -q "\*\* TEST SUCCEEDED \*\*" xcuitest.log \
            || { echo "::error::UI tests did not pass"; exit 1; }

      - name: Upload the UI test log
        if: ${{ failure() && inputs.ui-tests }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mero-swift-xcuitest-log
          path: sdks/clients/mero-swift/examples/MeroSampleApp/xcuitest.log
          if-no-files-found: ignore
