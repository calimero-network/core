name: Crypto Vectors

# Fast, Docker-free canary: the crypto known-answer vectors must still produce
# the same hashed, derived and sealed bytes. Fixtures live in
# crates/*/fixtures/known_answers.txt - this workflow only runs them.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/crypto/**"
      - "crates/primitives/**"
      - "crates/store/encryption/**"
      - ".github/workflows/crypto-vectors.yml"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
  push:
    branches:
      - master

env:
  # As ci-checks.yml compiles with, so the ci-checks cache this restores is reusable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  crypto-vectors:
    name: Crypto Vectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The pinned toolchain and the ci-checks cache, which only its owner saves.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          save-if: false

      - name: Known-answer vectors
        run: cargo test -p calimero-store-encryption -p calimero-crypto -p calimero-primitives --all-features
