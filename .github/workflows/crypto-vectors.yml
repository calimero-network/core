name: Crypto Vectors

# Fast canary: the crypto known-answer vectors must still produce the same
# hashed, derived and sealed bytes. Fixtures live in crates/*/fixtures/
# known_answers.txt (calimero-log's: what a node writes to disk, computed
# outside the crate) and in tests (the storage key K_r); this only runs them.
# A change to one is a change of a stored format and needs a migration.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/crypto/**"
      - "crates/primitives/**"
      - "crates/log/**"
      - "crates/node/src/kms.rs"
      - ".github/workflows/crypto-vectors.yml"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
  push:
    branches:
      - master
      - release-v2-parity

env:
  # As ci-checks.yml compiles with, so the ci-checks cache this restores is reusable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TERM_COLOR: always

jobs:
  crypto-vectors:
    name: Crypto Vectors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The pinned toolchain and the ci-checks cache, which only its owner saves.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: ci-checks
          save-if: false

      - name: Known-answer vectors
        run: |
          cargo test -p calimero-crypto -p calimero-primitives --all-features
          cargo test -p calimero-log --lib known_answers
          cargo test -p calimero-node --lib kms::tests::the_storage_key_derivation_is_unchanged
