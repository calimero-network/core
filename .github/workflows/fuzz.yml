name: Fuzz

on:
  pull_request:
    paths:
      - "crates/bundle/**"
      - "crates/identity/**"
      - "crates/sealed/**"
      - "crates/tee-attestation/**"
      - "crates/meroctl/sign/**"
      - "crates/outbound/**"
      - "crates/primitives/src/outbound.rs"
      - "crates/pipeline/**"
      - "crates/tee-release/**"
      - "crates/kms-client/src/policy.rs"
      - "crates/client/src/receipt.rs"
      - "crates/node/src/job_wire.rs"
      - "crates/node/src/component.rs"
      - "crates/node/src/component/**"
      - "crates/node/src/system.rs"
      - "crates/node/src/system/**"
      - "crates/node/src/types.rs"
      - "fuzz/**"
      - "scripts/fuzz.sh"
      - "scripts/fuzz-ci.sh"
      - ".github/workflows/fuzz.yml"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
      - "crates/meroctl/sign/README.md"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: Changed targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      targets: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - "fuzz/Cargo.toml"
              - "scripts/fuzz.sh"
              - "scripts/fuzz-ci.sh"
              - ".github/workflows/fuzz.yml"
            bundle_open:
              - *shared
              - "crates/bundle/**"
              - "crates/meroctl/sign/**"
              - "fuzz/fuzz_targets/bundle_open.rs"
              - "fuzz/seeds/bundle_open/**"
            sealed_request:
              - *shared
              - "crates/sealed/**"
              - "fuzz/fuzz_targets/sealed_request.rs"
            passkey_verify:
              - *shared
              - "crates/identity/src/webauthn.rs"
              - "crates/identity/src/testing.rs"
              - "fuzz/fuzz_targets/passkey_verify.rs"
            session_token:
              - *shared
              - "crates/identity/src/lib.rs"
              - "fuzz/fuzz_targets/session_token.rs"
            quote_parse:
              - *shared
              - "crates/tee-attestation/**"
              - "fuzz/fuzz_targets/quote_parse.rs"
            job_wire:
              - *shared
              - "crates/node/src/job_wire.rs"
              - "crates/node/src/types.rs"
              - "crates/client/src/receipt.rs"
              - "fuzz/fuzz_targets/job_wire.rs"
              - "fuzz/seeds/job_wire/**"
            log_entry:
              - *shared
              - "crates/node/src/component.rs"
              - "crates/node/src/component/**"
              - "crates/node/src/system.rs"
              - "crates/node/src/system/**"
              - "crates/node/src/types.rs"
              - "fuzz/fuzz_targets/log_entry.rs"
              - "fuzz/seeds/log_entry/**"
            outbound_request:
              - *shared
              - "crates/outbound/**"
              - "crates/primitives/src/outbound.rs"
              - "fuzz/fuzz_targets/outbound_request.rs"
              - "fuzz/seeds/outbound_request/**"
            pipeline_compile:
              - *shared
              - "crates/pipeline/**"
              - "fuzz/fuzz_targets/pipeline_compile.rs"
              - "fuzz/seeds/pipeline_compile/**"
            noise_handshake:
              - *shared
              - "crates/sealed/src/session.rs"
              - "crates/sealed/src/lib.rs"
              - "fuzz/fuzz_targets/noise_handshake.rs"
              - "fuzz/seeds/noise_handshake/**"
            sealed_file:
              - *shared
              - "crates/sealed/src/file.rs"
              - "crates/sealed/src/lib.rs"
              - "fuzz/fuzz_targets/sealed_file.rs"
              - "fuzz/seeds/sealed_file/**"
            release_policy:
              - *shared
              - "crates/tee-release/src/node.rs"
              - "crates/kms-client/src/policy.rs"
              - "fuzz/fuzz_targets/release_policy.rs"
              - "fuzz/seeds/release_policy/**"

  smoke:
    name: Smoke (${{ matrix.target }})
    needs: changed
    if: needs.changed.outputs.targets != '[]' && needs.changed.outputs.targets != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changed.outputs.targets) }}
        exclude:
          - target: shared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
      - name: Fuzz for a minute
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz-ci.sh "$TARGET" 60

  nightly:
    name: Nightly (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - bundle_open
          - sealed_request
          - passkey_verify
          - session_token
          - quote_parse
          - job_wire
          - log_entry
          - outbound_request
          - pipeline_compile
          - noise_handshake
          - sealed_file
          - release_policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for 30 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/fuzz-ci.sh "$TARGET" 1800
