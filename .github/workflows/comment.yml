name: PR Comment

on:
  workflow_run:
    workflows:
      [
        "PR Description",
        "PR Title",
        "E2E - Rust Apps",
      ]
    types:
      - completed

# Least-privilege: runs in the base-repo context (workflow_run); only needs to read
# the triggering run's artifacts and post a PR comment.
permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  submit:
    name: Submit
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'

    steps:
      - name: Set artifact name
        id: artifact
        run: |
          case "${{ github.event.workflow_run.name }}" in
            "E2E - Rust Apps") echo "name=pr-comment-payload-rust-apps" >> $GITHUB_OUTPUT ;;
            *) echo "name=pr-comment-payload" >> $GITHUB_OUTPUT ;;
          esac

      - name: Download artifact
        id: download
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.artifact.outputs.name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract payload
        id: payload
        if: ${{ steps.download.outcome == 'success' }}
        # payload.json comes from a fork-influenced workflow artifact. Emit each value
        # with a unique random heredoc delimiter so its contents cannot forge extra
        # workflow outputs (output injection).
        run: |
          emit() {
            local delim
            delim="EOF_$(openssl rand -hex 16)"
            {
              printf '%s<<%s\n' "$1" "$delim"
              jq "$2" payload.json
              printf '%s\n' "$delim"
            } >> "$GITHUB_OUTPUT"
          }
          emit pr '.pr'
          emit tag '.tag'
          emit mode '.mode'
          emit message '.message'

      - name: Check payload targets the triggering PR
        id: target
        if: ${{ steps.download.outcome == 'success' }}
        # pull_requests is empty for fork PRs and once a PR closes, so fall back to the
        # PRs whose head is the triggering run's repository owner, branch and commit.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_PRS: ${{ toJson(github.event.workflow_run.pull_requests.*.number) }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          payload_pr=$(jq -r '.pr' payload.json)
          prs=$(jq -r '.[]' <<<"$RUN_PRS")
          if [ -z "$prs" ]; then
            prs=$(gh api -X GET "repos/$REPO/pulls" \
              -f state=all -f head="$HEAD_OWNER:$HEAD_BRANCH" -F per_page=100 |
              jq -r --arg sha "$HEAD_SHA" '.[] | select(.head.sha == $sha) | .number')
          fi
          for n in $prs; do
            if [ "$n" = "$payload_pr" ]; then
              state=$(gh api "repos/$REPO/pulls/$n" --jq .state)
              echo "open=$([ "$state" = open ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::Payload PR does not match the triggering run's PR(s): ${prs:-none}"
          exit 1

      - name: Apply pull request comment
        if: ${{ steps.target.outputs.open == 'true' }}
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          pr-number: ${{ fromJson(steps.payload.outputs.pr) }}
          comment-tag: ${{ fromJson(steps.payload.outputs.tag) }}
          mode: ${{ fromJson(steps.payload.outputs.mode) }}
          message: ${{ fromJson(steps.payload.outputs.message) }}
