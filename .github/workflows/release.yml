name: Release

on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "tools/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/deps/**"
      - ".github/actions/**"
      # COPYed into the profiling image by prebuilt.profiling.Dockerfile.
      - "scripts/profiling/**"
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "tools/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/deps/**"
      - ".github/actions/**"
      - "scripts/profiling/**"

permissions:
  contents: read

env:
  BINARIES: |-
    merod
    meroctl
    mero-abi
    cargo-mero
  AUTH_BINARIES: |-
    mero-auth
  HOMEBREW_BINARIES: |-
    merod
    meroctl
    mero-abi
    cargo-mero
  DOCKER_PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
  INCLUDE_AARCH64: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
  # Windows ships only merod (the desktop app's version switcher downloads it) and meroctl;
  # the other binaries were never built for Windows.
  WINDOWS_BINARIES: |-
    merod
    meroctl
  INCLUDE_WINDOWS: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

jobs:
  prepare:
    name: Prepare
    runs-on: big-machine
    permissions:
      # Needed by "Create release at trigger time" below.
      contents: write
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      binary_release: ${{ steps.version_info.outputs.binary_release }}
      crate_release: ${{ steps.version_info.outputs.crate_release }}
      docker_release: ${{ steps.version_info.outputs.docker_release }}
      docker_push: ${{ github.event.pull_request && !github.event.pull_request.head.repo.fork || !github.event.pull_request }}
      prerelease: ${{ steps.version_info.outputs.prerelease }}
      target_commit: ${{ steps.version_info.outputs.target_commit }}
      # PR-only: enables the profiling build and image so fuzzy-load-test.yml can
      # validate a fresh `pr-<N>-profiling` image before merge.
      profiling_paths_changed: ${{ steps.profiling_paths.outputs.changed || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get version info
        id: version_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "target_commit=${{ github.sha }}" >> $GITHUB_OUTPUT

          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.metadata.workspaces.version')

          prerelease=false
          binary_release=false
          crate_release=false
          docker_release=false

          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            if [[ "$version" =~ -[a-z]+(\.[0-9]+)?$ ]]; then
              prerelease=true
            fi

            if ! gh release view "$version" --repo ${{ github.repository }} >/dev/null 2>&1; then
              binary_release=true
              crate_release=true
              docker_release=true
            elif [ "${{ github.run_attempt }}" != "1" ] \
              && [ "$(gh release view "$version" --repo ${{ github.repository }} --json assets --jq '.assets | length')" = "0" ]; then
              # Re-arm only on a re-run: on a first attempt, a shell with no assets is
              # just a release still building, owned by another run.
              binary_release=true
            elif [ "$(gh release view "$version" --repo ${{ github.repository }} --json assets --jq '.assets | length')" = "0" ]; then
              # A failed release build must be fixed by re-running its own run, since the
              # tag points at that commit.
              echo "::warning::Release $version exists with no assets. If its build failed, re-run that run; this push will not upload binaries."
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            docker_release=true
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          echo "binary_release=$binary_release" >> $GITHUB_OUTPUT
          echo "crate_release=$crate_release" >> $GITHUB_OUTPUT
          echo "docker_release=$docker_release" >> $GITHUB_OUTPUT

      # GITHUB_TOKEN is an integration token, and GitHub rejects release/tag creation whose target
      # is not the branch head; create it now, before master moves, so the later upload only attaches.
      - name: Create release at trigger time
        if: github.event_name == 'push' && steps.version_info.outputs.binary_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version_info.outputs.version }}
          PRERELEASE: ${{ steps.version_info.outputs.prerelease }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to create."
            exit 0
          fi
          args=(--repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$VERSION" --notes "")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if ! gh release create "$VERSION" "${args[@]}"; then
            echo "::error::Could not create release $VERSION. If master moved past ${{ github.sha }} already, create the tag+release manually and re-run failed jobs: gh api -X POST repos/${{ github.repository }}/git/refs -f ref=refs/tags/$VERSION -f sha=${{ github.sha }} && gh api -X POST repos/${{ github.repository }}/releases -f tag_name=$VERSION -f name=$VERSION -F prerelease=$PRERELEASE"
            exit 1
          fi

      # `gh api` rather than tj-actions/changed-files, to avoid changing the checkout depth.
      - name: Detect profiling-relevant changes
        id: profiling_paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api \
            "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')
          if echo "$files" | grep -qE '^(scripts/profiling/|\.github/workflows/deps/prebuilt\.profiling\.Dockerfile$|\.github/workflows/fuzzy-load-test\.yml$|workflows/fuzzy-tests/)'; then
            echo "Profiling paths changed — profiling image will be built and fuzzy-load-test will run on this PR"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No profiling-relevant changes — skipping profiling build (default PR behaviour)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    name: Build Binaries (${{ matrix.name }})
    needs: prepare
    strategy:
      matrix:
        # Keep legacy check names for required status checks.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"ubuntu-24.04-8cpu, x86_64-unknown-linux-gnu","runner":"big-machine","target":"x86_64-unknown-linux-gnu"}]' || '[{"name":"ubuntu-24.04-8cpu, x86_64-unknown-linux-gnu","runner":"big-machine","target":"x86_64-unknown-linux-gnu"},{"name":"ubuntu-24.04-arm, aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"name":"macos-latest, aarch64-apple-darwin","runner":"macos-latest","target":"aarch64-apple-darwin"},{"name":"windows-latest, x86_64-pc-windows-msvc","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    # Every `run:` below is bash; Windows runners default to pwsh, where these
    # scripts silently behave differently, so the shell is pinned job-wide.
    defaults:
      run:
        shell: bash

    env:
      CALIMERO_WEBUI_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CALIMERO_AUTH_FRONTEND_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # arm64 is evicted before its next build ever restores it, and its size evicts the caches PRs read.
      - name: Setup rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: release
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.target != 'aarch64-unknown-linux-gnu' }}

      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev

      # `rocksdb` uses `bindgen-runtime`, so librocksdb-sys needs libclang everywhere;
      # the Windows image ships LLVM but nothing points bindgen at it.
      - name: Point bindgen at the image's LLVM (Windows)
        if: runner.os == 'Windows'
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # aws-lc-sys (rustls via libp2p-tls) needs NASM on windows-msvc;
      # unix uses the system assembler.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Update Bash
        if: ${{ matrix.runner == 'macos-13' || matrix.runner == 'macos-latest' }}
        run: brew install bash

      # mock-attestation must never compile into a release binary: with it off, a
      # MOCK_TDX_QUOTE_V1 blob fails real DCAP parsing and is rejected.
      - name: Guard - mock-attestation must not leak into the release build
        run: |
          if cargo tree -e features -i calimero-tee-attestation -p merod | grep -q 'mock-attestation'; then
            echo "::error::mock-attestation leaked into production build"
            exit 1
          fi
          echo "OK: mock-attestation is not enabled in the production merod build"

      # Resolved once so the steps below cannot drift from WINDOWS_BINARIES.
      - name: Resolve the binaries this target publishes
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf 'TARGET_BINARIES<<CALIMERO_EOF\n%s\nCALIMERO_EOF\n' "$WINDOWS_BINARIES" >> "$GITHUB_ENV"
          else
            printf 'TARGET_BINARIES<<CALIMERO_EOF\n%s\n%s\nCALIMERO_EOF\n' "$BINARIES" "$AUTH_BINARIES" >> "$GITHUB_ENV"
          fi

      - name: Build binaries
        run: |
          readarray -t binaries <<< "$TARGET_BINARIES"

          binaries=$(printf -- '-p %s ' "${binaries[@]}")

          cargo build $binaries --release --target ${{ matrix.target }}

      - name: Compress artifacts using gzip
        run: |
          mkdir -p artifacts

          readarray -t binaries <<< "$TARGET_BINARIES"

          # Only the file inside gains `.exe`; the archive keeps `<binary>_<target>.tar.gz`,
          # which consumers (the desktop app's merod switcher) resolve by target triple.
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi

          for binary in "${binaries[@]}"; do
            tar -czf artifacts/"$binary"_${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release "$binary$suffix"
          done

      # A bin target of calimero-tee-attestation behind the `cli` feature, so it cannot join $BINARIES (`-p`).
      # Ships because mdma's manager shells out to it to verify TDX quotes; linux/amd64 image only.
      - name: Build calimero-tee-verify (Linux only)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: |
          # With mock-attestation compiled in, the verifier would accept a forged
          # MOCK_TDX_QUOTE_V1 blob.
          if cargo tree -e features -p calimero-tee-attestation --features cli | grep -q 'mock-attestation'; then
            echo "::error::mock-attestation leaked into the released calimero-tee-verify"
            exit 1
          fi
          echo "OK: mock-attestation is not enabled in calimero-tee-verify"

          cargo build -p calimero-tee-attestation --bin calimero-tee-verify \
            --features cli --release --target ${{ matrix.target }}

          tar -czf artifacts/calimero-tee-verify_${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release calimero-tee-verify

      - name: Build profiling binaries (with frame pointers and debug symbols)
        if: ${{ (github.event_name != 'pull_request' || needs.prepare.outputs.profiling_paths_changed == 'true') && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu') }}
        run: |
          readarray -t binaries <<< "$BINARIES"
          binaries=$(printf -- '-p %s ' "${binaries[@]}")

          # calimero-context/profiling enables Wasmer PerfMap.
          RUSTFLAGS="-C force-frame-pointers=yes" cargo build $binaries --profile profiling --target ${{ matrix.target }} --features calimero-context/profiling

      - name: Compress profiling artifacts using gzip
        if: ${{ (github.event_name != 'pull_request' || needs.prepare.outputs.profiling_paths_changed == 'true') && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu') }}
        run: |
          mkdir -p artifacts-profiling

          readarray -t binaries <<< "$BINARIES"

          for binary in "${binaries[@]}"; do
            tar -czf artifacts-profiling/"$binary"_${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/profiling "$binary"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.target }}
          path: artifacts/*
          retention-days: 2

      - name: Upload profiling artifacts
        if: ${{ (github.event_name != 'pull_request' || needs.prepare.outputs.profiling_paths_changed == 'true') && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu') }}
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-profiling-${{ matrix.target }}
          path: artifacts-profiling/*
          retention-days: 2

  release-binaries:
    name: Release Binaries
    if: needs.prepare.outputs.binary_release == 'true'
    runs-on: big-machine
    needs: [prepare, build-binaries]
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      # No `github.job` here: it is null outside steps, which collapses jobs into one group.
      group: ${{ github.workflow }}-release-binaries-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download x86_64 Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: artifacts/

      - name: Download aarch64 Linux artifacts
        if: ${{ env.INCLUDE_AARCH64 == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: artifacts/

      - name: Download aarch64 macOS artifacts
        if: ${{ env.INCLUDE_AARCH64 == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: artifacts-aarch64-apple-darwin
          path: artifacts/

      - name: Download x86_64 Windows artifacts
        if: ${{ env.INCLUDE_WINDOWS == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: artifacts-x86_64-pc-windows-msvc
          path: artifacts/

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*
          file_glob: true
          tag: ${{ needs.prepare.outputs.version }}
          release_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          target_commit: ${{ needs.prepare.outputs.target_commit }}

  # Dev-signed kv-store .mpk: exercises `cargo mero bundle` end-to-end, giving SDK e2e suites a stable
  # ApplicationId. Dev-signed bundles are registry-refused, so this can't leak into real distribution.
  release-app-bundle:
    name: Release App Bundle
    runs-on: ubuntu-latest
    needs: [prepare]
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      group: ${{ github.workflow }}-release-app-bundle-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: release-app-bundle
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build the kv-store bundle
        run: cargo mero bundle --dev --no-icon --app-version "${{ needs.prepare.outputs.version }}" --manifest-path apps/kv-store/Cargo.toml --output dist/kv-store-test-fixture.mpk

      # PRs still build the bundle so a `cargo mero bundle` break fails there; only releases publish.
      - name: Upload the bundle to the release
        if: needs.prepare.outputs.binary_release == 'true'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/kv-store-test-fixture.mpk
          tag: ${{ needs.prepare.outputs.version }}
          release_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          target_commit: ${{ needs.prepare.outputs.target_commit }}

  release-crates:
    name: Release Crates
    if: needs.prepare.outputs.crate_release == 'true'
    runs-on: ubuntu-latest
    needs: [prepare, build-binaries]

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false

      - name: Checkout core repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust
        # Pinned to a commit SHA (supply-chain hygiene); comment tracks the tag.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Verify Rust installation
        run: rustc --version

      - name: Setup rust cache (publish)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release

      - name: Publish calimero-workspaces on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -x

          cargo install --git https://github.com/calimero-network/cargo-workspaces --tag v0.3.0 cargo-workspaces

          # Retry: crates.io index lag can make the next crate fail to resolve a just-published prerelease
          # dependency; cargo-workspaces skips already-published crates, so a retry resumes where it failed.
          publish() {
            cargo ws publish --yes --allow-dirty --force '*' \
              --no-verify \
              --no-git-tag --no-git-commit --no-git-push
          }
          for attempt in 1 2 3 4 5; do
            if publish; then
              exit 0
            fi
            echo "::warning::cargo ws publish attempt ${attempt} failed (likely crates.io index lag); retrying in 60s"
            sleep 60
          done
          echo "::error::cargo ws publish failed after 5 attempts"
          exit 1

  release-merod-container:
    name: Release Merod container
    needs: [prepare, build-binaries]
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      group: ${{ github.workflow }}-merod-container-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    runs-on: big-machine
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Release
        uses: ./.github/actions/container-release
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: ${{ needs.prepare.outputs.docker_release }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          push: ${{ needs.prepare.outputs.docker_push }}
          binaries: ${{ env.BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.Dockerfile
          container_name: merod
          platforms: ${{ env.DOCKER_PLATFORMS }}
          include_aarch64: ${{ env.INCLUDE_AARCH64 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release-mero-auth-container:
    name: Release Mero Auth container
    needs: [prepare, build-binaries]
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      group: ${{ github.workflow }}-mero-auth-container-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    runs-on: big-machine
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Release
        uses: ./.github/actions/container-release
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: ${{ needs.prepare.outputs.docker_release }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          push: ${{ needs.prepare.outputs.docker_push }}
          binaries: ${{ env.AUTH_BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.auth.Dockerfile
          container_name: mero-auth
          platforms: ${{ env.DOCKER_PLATFORMS }}
          include_aarch64: ${{ env.INCLUDE_AARCH64 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release-merod-profiling-container:
    name: Release Merod Profiling container
    # `prepare.outputs.docker_push` already excludes fork PRs, which cannot push to ghcr.
    if: ${{ github.event_name != 'pull_request' || needs.prepare.outputs.profiling_paths_changed == 'true' }}
    needs: [prepare, build-binaries]
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      group: ${{ github.workflow }}-merod-profiling-container-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    runs-on: big-machine
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Release
        uses: ./.github/actions/container-release-profiling
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: ${{ needs.prepare.outputs.docker_release }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          push: ${{ needs.prepare.outputs.docker_push }}
          binaries: ${{ env.BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.profiling.Dockerfile
          container_name: merod
          platforms: ${{ env.DOCKER_PLATFORMS }}
          include_aarch64: ${{ env.INCLUDE_AARCH64 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  brew-update:
    name: Update Homebrew Tap
    if: needs.prepare.outputs.binary_release == 'true'
    runs-on: big-machine
    needs: [prepare, release-binaries]
    permissions:
      id-token: write
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-tap

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Update Formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          target_branch="chore/bump-formulas-version"
          git fetch origin "${target_branch}" || true
          git checkout "${target_branch}" || git checkout -b "${target_branch}"

          readarray -t binaries <<< "$HOMEBREW_BINARIES"

          for binary in "${binaries[@]}"; do
            echo "Updating formula for ${binary}, version: ${{ needs.prepare.outputs.version }}"
            ./generate-formula.sh "${binary}" "${{ needs.prepare.outputs.version }}"
          done

          git status

          if git diff-index --quiet HEAD --; then
            echo "There are no changes to commit"
            exit 1
          fi

          git add Formula/
          git commit -m "chore: bump formulas version"
          git push origin "${target_branch}"

          gh pr create -f || true

  fleet-bump:
    name: Open SDK bump PRs
    if: needs.prepare.outputs.binary_release == 'true'
    needs: [prepare, release-binaries]
    uses: ./.github/workflows/fleet-bump.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    # GH_APP_PRIVATE_KEY, which the called workflow uses to mint a per-repository installation token.
    secrets: inherit
