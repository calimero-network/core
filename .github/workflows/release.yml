name: Release

# Pushes to master release: binaries, crates, the App Bundle, the Homebrew tap
# and SDK bump PRs for a new version, and the merod image's version tags. Pushes
# to the release-v2 release branch (release-v2-parity) publish only the merod
# image, under tags of its own (release-v2-edge, release-v2-<short sha>), and
# keep the binaries as workflow artifacts for 14 days; every release step below
# is gated on master.
on:
  push:
    branches:
      - master
      - release-v2-parity
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "tools/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/deps/**"
      - ".github/actions/**"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
      - "tools/calimero-abi/README.md"
      - "tools/cargo-mero/README.md"
      - "tools/cargo-mero/tests/fixtures/demo-app/GUIDE.md"
      - "tools/cargo-mero/tests/fixtures/multi-app/GUIDE.md"
      - "tools/mero-sign/README.md"
  merge_group:
  # Every PR, with no `paths:` filter: a `Build Binaries` check is required, and
  # `prepare` below decides whether this change builds anything (docs never do).
  # A filter would need a stub workflow to report the check whenever it skipped.
  pull_request:

permissions:
  contents: read

env:
  # Linux (x86_64, aarch64): the node, its command line and the app tools.
  BINARIES: |-
    merod
    meroctl
    mero-abi
    cargo-mero
  # macOS (aarch64): a developer's machine runs no node (Docker does), so the
  # command line and the app tools only.
  MACOS_BINARIES: |-
    meroctl
    mero-abi
    cargo-mero
  HOMEBREW_BINARIES: |-
    meroctl
    mero-abi
    cargo-mero
  DOCKER_PLATFORMS: ${{ github.event_name != 'push' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
  INCLUDE_AARCH64: ${{ github.event_name != 'push' && 'false' || 'true' }}
  # The merobox revision `E2E on the merod image` runs; keep it e2e.yml's MEROBOX_REF.
  MEROBOX_REF: release-v2-parity
  # The release branch's image tags are this prefix plus `edge` and the short sha.
  IMAGE_TAG_PREFIX: ${{ github.ref == 'refs/heads/release-v2-parity' && 'release-v2-' || '' }}

jobs:
  prepare:
    name: Prepare
    runs-on: big-machine
    permissions:
      # Needed by "Create release at trigger time" below.
      contents: write
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      binary_release: ${{ steps.version_info.outputs.binary_release }}
      crate_release: ${{ steps.version_info.outputs.crate_release }}
      docker_release: ${{ steps.version_info.outputs.docker_release }}
      docker_push: ${{ github.event_name == 'push' || github.event.pull_request && !github.event.pull_request.head.repo.fork }}
      prerelease: ${{ steps.version_info.outputs.prerelease }}
      build_matrix: ${{ steps.build_matrix.outputs.matrix }}
      # Whether this change can alter anything this workflow builds (scripts/ci-scope.py).
      build: ${{ steps.scope.outputs.build }}
      target_commit: ${{ steps.version_info.outputs.target_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Get version info
        id: version_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "target_commit=${GITHUB_SHA}" >> $GITHUB_OUTPUT

          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.metadata.workspaces.version')

          prerelease=false
          binary_release=false
          crate_release=false
          docker_release=false

          if [ "${GITHUB_REF}" == "refs/heads/master" ]; then
            if [[ "$version" =~ -[a-z]+(\.[0-9]+)?$ ]]; then
              prerelease=true
            fi

            if ! gh release view "$version" --repo ${GITHUB_REPOSITORY} >/dev/null 2>&1; then
              binary_release=true
              crate_release=true
              docker_release=true
            elif [ "${GITHUB_RUN_ATTEMPT}" != "1" ] \
              && [ "$(gh release view "$version" --repo ${GITHUB_REPOSITORY} --json assets --jq '.assets | length')" = "0" ]; then
              # Re-arm only on a re-run: on a first attempt, a shell with no assets is
              # just a release still building, owned by another run.
              binary_release=true
            elif [ "$(gh release view "$version" --repo ${GITHUB_REPOSITORY} --json assets --jq '.assets | length')" = "0" ]; then
              # A failed release build must be fixed by re-running its own run, since the
              # tag points at that commit.
              echo "::warning::Release $version exists with no assets. If its build failed, re-run that run; this push will not upload binaries."
            fi
          elif [ "${GITHUB_EVENT_NAME}" == "pull_request" ]; then
            docker_release=true
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          echo "binary_release=$binary_release" >> $GITHUB_OUTPUT
          echo "crate_release=$crate_release" >> $GITHUB_OUTPUT
          echo "docker_release=$docker_release" >> $GITHUB_OUTPUT

      # Fails closed: a change whose files cannot be listed builds everything.
      - name: Decide whether this change builds anything
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          FROM: ${{ github.event.before || github.event.merge_group.base_sha }}
          TO: ${{ github.event.merge_group.head_sha || github.sha }}
        run: |
          set -uo pipefail
          files=""
          case "$EVENT" in
            pull_request)
              if listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename') \
                && [ "$(grep -c . <<<"$listed")" -lt 3000 ]; then
                files=$listed
              fi
              ;;
            push | merge_group)
              if [ -n "${FROM//0/}" ] \
                && listed=$(gh api "repos/$REPO/compare/$FROM...$TO" --jq '.files[].filename') \
                && [ "$(grep -c . <<<"$listed")" -lt 300 ]; then
                files=$listed
              fi
              ;;
          esac
          [ -n "$files" ] || echo "::notice::could not list this change's files; everything builds"
          printf '%s\n' "$files" | python3 scripts/ci-scope.py --workflow release >> "$GITHUB_OUTPUT"

      # Linux x86_64 always (a required check); arm64 on pushes (master and the
      # release branch), which the multi-arch edge images need; macOS only when this run publishes binaries,
      # the one job that reads them (platforms.yml builds it nightly). There is no
      # Windows build: release-v2 nodes run on Linux TDX hosts only.
      - name: Choose the build targets
        id: build_matrix
        env:
          EVENT: ${{ github.event_name }}
          BINARY_RELEASE: ${{ steps.version_info.outputs.binary_release }}
        run: |
          set -euo pipefail
          # Keep legacy check names for required status checks.
          linux='{"name":"ubuntu-24.04-8cpu, x86_64-unknown-linux-gnu","runner":"big-machine","target":"x86_64-unknown-linux-gnu"}'
          arm='{"name":"ubuntu-24.04-arm, aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}'
          macos='{"name":"macos-latest, aarch64-apple-darwin","runner":"macos-latest","target":"aarch64-apple-darwin"}'
          matrix="[$linux]"
          if [ "$EVENT" = push ]; then
            matrix="[$linux,$arm]"
            if [ "$BINARY_RELEASE" = true ]; then
              matrix="[$linux,$arm,$macos]"
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.[].name' <<<"$matrix"

      # GITHUB_TOKEN is an integration token, and GitHub rejects release/tag creation whose target
      # is not the branch head; create it now, before master moves, so the later upload only attaches.
      - name: Create release at trigger time
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.version_info.outputs.binary_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version_info.outputs.version }}
          PRERELEASE: ${{ steps.version_info.outputs.prerelease }}
        run: |
          if gh release view "$VERSION" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to create."
            exit 0
          fi
          args=(--repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "$VERSION" --notes "")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if ! gh release create "$VERSION" "${args[@]}"; then
            echo "::error::Could not create release $VERSION. If master moved past ${GITHUB_SHA} already, create the tag+release manually and re-run failed jobs: gh api -X POST repos/${GITHUB_REPOSITORY}/git/refs -f ref=refs/tags/$VERSION -f sha=${GITHUB_SHA} && gh api -X POST repos/${GITHUB_REPOSITORY}/releases -f tag_name=$VERSION -f name=$VERSION -F prerelease=$PRERELEASE"
            exit 1
          fi

  build-binaries:
    name: Build Binaries (${{ matrix.name }})
    needs: prepare
    # Always runs, so its required check reports on every PR; every step is gated
    # on `build` instead, since a job-level `if` would leave the matrix name
    # unexpanded and the required check would never report.
    strategy:
      matrix:
        # Chosen in `prepare`: see "Choose the build targets".
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        if: needs.prepare.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The pinned toolchain only: this job saves no Rust cache. The x86 release
      # cache was 3.8 GB of the repo's 10 GB, and next to ci-checks' 3.5 GB it got
      # the cache PR jobs read evicted within minutes. A cold fat-LTO build still
      # finishes before E2E, so PRs wait no longer; arm64 never restored one anyway.
      - name: Setup Rust CI
        if: needs.prepare.outputs.build == 'true'
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: release
          save-if: false

      - name: Update Bash
        if: ${{ needs.prepare.outputs.build == 'true' && (matrix.runner == 'macos-13' || matrix.runner == 'macos-latest') }}
        run: brew install bash

      # mock-attestation must never compile into a release binary: with it off, a
      # MOCK_TDX_QUOTE_V1 blob fails real DCAP parsing and is rejected.
      - name: Guard - mock-attestation must not leak into the release build
        if: needs.prepare.outputs.build == 'true'
        run: |
          if cargo tree -e features -i calimero-tee-attestation -p merod | grep -q 'mock-attestation'; then
            echo "::error::mock-attestation leaked into production build"
            exit 1
          fi
          echo "OK: mock-attestation is not enabled in the production merod build"

      # Resolved once so the steps below cannot drift from MACOS_BINARIES.
      - name: Resolve the binaries this target publishes
        if: needs.prepare.outputs.build == 'true'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            printf 'TARGET_BINARIES<<CALIMERO_EOF\n%s\nCALIMERO_EOF\n' "$MACOS_BINARIES" >> "$GITHUB_ENV"
          else
            printf 'TARGET_BINARIES<<CALIMERO_EOF\n%s\nCALIMERO_EOF\n' "$BINARIES" >> "$GITHUB_ENV"
          fi

      - name: Build binaries
        if: needs.prepare.outputs.build == 'true'
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          readarray -t binaries <<< "$TARGET_BINARIES"

          binaries=$(printf -- '-p %s ' "${binaries[@]}")

          cargo build $binaries --release --target ${MATRIX_TARGET}

      - name: Compress artifacts using gzip
        if: needs.prepare.outputs.build == 'true'
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts

          readarray -t binaries <<< "$TARGET_BINARIES"

          # `<binary>_<target>.tar.gz`: consumers (the Docker image, the Homebrew
          # formulas) resolve an archive by target triple.
          for binary in "${binaries[@]}"; do
            tar -czf artifacts/"$binary"_${MATRIX_TARGET}.tar.gz -C target/${MATRIX_TARGET}/release "$binary"
          done

      # A bin target of calimero-tee-attestation behind the `cli` feature, so it cannot join $BINARIES (`-p`).
      # Ships because mdma's manager shells out to it to verify TDX quotes; linux/amd64 image only.
      - name: Build calimero-tee-verify (Linux only)
        if: ${{ needs.prepare.outputs.build == 'true' && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu') }}
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          # With mock-attestation compiled in, the verifier would accept a forged
          # MOCK_TDX_QUOTE_V1 blob.
          if cargo tree -e features -p calimero-tee-attestation --features cli | grep -q 'mock-attestation'; then
            echo "::error::mock-attestation leaked into the released calimero-tee-verify"
            exit 1
          fi
          echo "OK: mock-attestation is not enabled in calimero-tee-verify"

          cargo build -p calimero-tee-attestation --bin calimero-tee-verify \
            --features cli --release --target ${MATRIX_TARGET}

          tar -czf artifacts/calimero-tee-verify_${MATRIX_TARGET}.tar.gz \
            -C target/${MATRIX_TARGET}/release calimero-tee-verify

      # The release branch publishes no release: its binaries are kept here.
      - name: Upload artifacts
        if: needs.prepare.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.target }}
          path: artifacts/*
          retention-days: ${{ github.ref == 'refs/heads/release-v2-parity' && 14 || 2 }}

  release-binaries:
    name: Release Binaries
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.binary_release == 'true'
    runs-on: big-machine
    needs: [prepare, build-binaries]
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      # No `github.job` here: it is null outside steps, which collapses jobs into one group.
      group: ${{ github.workflow }}-release-binaries-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download x86_64 Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: artifacts/

      - name: Download aarch64 Linux artifacts
        if: ${{ env.INCLUDE_AARCH64 == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: artifacts/

      - name: Download aarch64 macOS artifacts
        if: ${{ env.INCLUDE_AARCH64 == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-aarch64-apple-darwin
          path: artifacts/

      - name: Write checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*
          file_glob: true
          tag: ${{ needs.prepare.outputs.version }}
          release_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          target_commit: ${{ needs.prepare.outputs.target_commit }}

  # Dev-signed kv-store .mpk: exercises `cargo mero bundle` end-to-end, giving SDK e2e suites a stable
  # ApplicationId. Dev-signed bundles are registry-refused, so this can't leak into real distribution.
  # Only when this run publishes a release, the one thing that reads the bundle.
  # It used to build on every PR too, to catch a `cargo mero bundle` break, which
  # PRs still catch: e2e's Build Apps bundles kv-store (and every e2e app) when
  # crates/** or an app moves, and ci-checks' cargo-mero e2e runs `bundle --dev
  # --no-icon` (bundle_produces_signed_mpk, the pipeline test) when cargo-mero does.
  release-app-bundle:
    name: Release App Bundle
    runs-on: ubuntu-latest
    needs: [prepare]
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.binary_release == 'true'
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      group: ${{ github.workflow }}-release-app-bundle-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: wasm-apps
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build the kv-store bundle
        run: cargo mero bundle --dev --no-icon --app-version "${NEEDS_PREPARE_OUTPUTS_VERSION}" --manifest-path apps/kv-store/Cargo.toml --output dist/kv-store-test-fixture.mpk
        env:
          NEEDS_PREPARE_OUTPUTS_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Upload the bundle to the release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/kv-store-test-fixture.mpk
          tag: ${{ needs.prepare.outputs.version }}
          release_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          target_commit: ${{ needs.prepare.outputs.target_commit }}

  release-crates:
    name: Release Crates
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.crate_release == 'true'
    runs-on: ubuntu-latest
    needs: [prepare, build-binaries]

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false

      - name: Checkout core repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: release-crates

      - name: Verify Rust installation
        run: rustc --version

      - name: Publish calimero-workspaces on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -x

          cargo install --git https://github.com/calimero-network/cargo-workspaces --rev 9b079f98de701b7d4c30d86ca5bf555a9a2a3928 cargo-workspaces # v0.3.0

          # Retry: crates.io index lag can make the next crate fail to resolve a just-published prerelease
          # dependency; cargo-workspaces skips already-published crates, so a retry resumes where it failed.
          publish() {
            cargo ws publish --yes --allow-dirty --force '*' \
              --no-verify \
              --no-git-tag --no-git-commit --no-git-push
          }
          for attempt in 1 2 3 4 5; do
            if publish; then
              exit 0
            fi
            echo "::warning::cargo ws publish attempt ${attempt} failed (likely crates.io index lag); retrying in 60s"
            sleep 60
          done
          echo "::error::cargo ws publish failed after 5 attempts"
          exit 1

  release-merod-container:
    name: Release Merod container
    needs: [prepare, build-binaries]
    if: needs.prepare.outputs.build == 'true'
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      group: ${{ github.workflow }}-merod-container-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    runs-on: big-machine
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Release
        uses: ./.github/actions/container-release
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: ${{ needs.prepare.outputs.docker_release }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          # PRs build the image to prove the Dockerfile still packages the binaries,
          # but push nothing; master pushes the multi-arch (amd64, arm64) image, and
          # so does the release branch, under its own tags only (IMAGE_TAG_PREFIX).
          push: ${{ github.event_name == 'push' }}
          tag-prefix: ${{ env.IMAGE_TAG_PREFIX }}
          # Everything else saves its amd64 image for `E2E on the merod image`.
          load-to: ${{ github.event_name != 'push' && 'merod-image.tar' || '' }}
          binaries: ${{ env.BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.Dockerfile
          container_name: merod
          platforms: ${{ env.DOCKER_PLATFORMS }}
          include_aarch64: ${{ env.INCLUDE_AARCH64 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the image
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merod-image
          path: merod-image.tar
          if-no-files-found: error
          retention-days: 1

  # What `E2E on the merod image` installs: the fixtures its smoke list names
  # (scripts/workflows-smoke.json), built while the binaries build.
  image-e2e-fixtures:
    name: Image E2E fixtures
    needs: prepare
    if: needs.prepare.outputs.build == 'true' && github.event_name != 'push'
    runs-on: big-machine
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-unknown-unknown
          shared-key: wasm-apps
          save-if: false

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build the smoke list's fixtures
        run: |
          set -euo pipefail
          readarray -t filters < <(jq -r '.fixtures[]' scripts/workflows-smoke.json)
          python3 scripts/build-workflow-fixtures.py "${filters[@]}"

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-e2e-fixtures
          path: target/workflow-wasm
          if-no-files-found: error
          retention-days: 1

  # The image this run built is tested, not only built: e2e.yml runs every
  # workflow against a debug `cargo build`, and this runs the smoke list (one
  # workflow per area, scripts/workflows-smoke.json, every one on the
  # baseline) and two of merobox's fault examples (a crashed node, a frozen
  # leader) against the release `merod` inside the image. Master and the
  # release branch push their image instead; e2e.yml's nightly tests the latest
  # release's (the release branch's nightly, its release-v2-edge).
  image-e2e:
    name: E2E on the merod image
    needs: [prepare, release-merod-container, image-e2e-fixtures]
    runs-on: big-machine
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout merobox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: calimero-network/merobox
          ref: ${{ env.MEROBOX_REF }}
          path: merobox
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install merobox
        run: pip install ./merobox

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merod-image
          path: target/image

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-e2e-fixtures
          path: target/workflow-wasm

      # merobox runs `merod` processes, not containers: the binary is the
      # image's own /usr/local/bin/merod, and the image must start it.
      - name: Take merod out of the image
        run: |
          set -euo pipefail
          image=$(docker load -i target/image/merod-image.tar | sed -n 's/^Loaded image: //p' | head -n1)
          if [ -z "$image" ]; then
            echo "::error::merod-image.tar holds no tagged image"
            exit 1
          fi
          echo "testing $image"
          docker run --rm "$image" --version
          id=$(docker create "$image")
          docker cp "$id:/usr/local/bin/merod" target/image/merod
          docker rm "$id"
          rm target/image/merod-image.tar
          echo "MEROD_BINARY=$GITHUB_WORKSPACE/target/image/merod" >> "$GITHUB_ENV"

      - name: Smoke workflows
        env:
          MEROBOX_SOAK_REPORT: ${{ github.workspace }}/target/image/soak.json
        run: python3 scripts/run-workflows.py --smoke --json target/image/workflows.json

      - name: merobox's fault examples
        if: ${{ !cancelled() }}
        env:
          KV_STORE_WASM: ${{ github.workspace }}/target/workflow-wasm/kv_store.wasm
        run: |
          set -uo pipefail
          failed=0
          for wf in kv-store-failover frozen-leader; do
            echo "::group::$wf"
            merobox cloud run "merobox/workflow-examples/cloud-v2/$wf.yml" || { echo "::error::$wf failed"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Soak latency and throughput
        if: ${{ !cancelled() }}
        run: bash scripts/soak-summary.sh target/image/soak.json "Soak on this run's merod image (smoke list, 30s)"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-e2e-results
          path: |
            target/image/workflows.json
            target/image/soak.json
          if-no-files-found: ignore
          retention-days: 7

  brew-update:
    name: Update Homebrew Tap
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.binary_release == 'true'
    runs-on: big-machine
    needs: [prepare, release-binaries]
    permissions: {}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${STEPS_APP_TOKEN_OUTPUTS_APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STEPS_APP_TOKEN_OUTPUTS_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STEPS_APP_TOKEN_OUTPUTS_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          STEPS_GET_USER_ID_OUTPUTS_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          gh auth setup-git
          git config --global user.name "${STEPS_APP_TOKEN_OUTPUTS_APP_SLUG}[bot]"
          git config --global user.email "${STEPS_GET_USER_ID_OUTPUTS_USER_ID}+${STEPS_APP_TOKEN_OUTPUTS_APP_SLUG}[bot]@users.noreply.github.com"

      # generate-formula.sh only downloads public release assets, so it runs without the app token.
      - name: Update Formula
        env:
          NEEDS_PREPARE_OUTPUTS_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Always start from the tap's default branch: an existing bump branch is not trusted to run its script.
          git checkout -B chore/bump-formulas-version

          readarray -t binaries <<< "$HOMEBREW_BINARIES"

          for binary in "${binaries[@]}"; do
            echo "Updating formula for ${binary}, version: ${NEEDS_PREPARE_OUTPUTS_VERSION}"
            ./generate-formula.sh "${binary}" "${NEEDS_PREPARE_OUTPUTS_VERSION}"
          done

          git status

          if git diff-index --quiet HEAD --; then
            echo "There are no changes to commit"
            exit 1
          fi

          git add Formula/
          git commit -m "chore: bump formulas version"

      - name: Open the bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git -c core.hooksPath=/dev/null push --force origin chore/bump-formulas-version
          gh pr create -f || true

  fleet-bump:
    name: Open SDK bump PRs
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.binary_release == 'true'
    needs: [prepare, release-binaries]
    uses: ./.github/workflows/fleet-bump.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    # GH_APP_PRIVATE_KEY, which the called workflow uses to mint a per-repository installation token.
    secrets: inherit
