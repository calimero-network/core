name: Release

on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "tools/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/deps/**"
      - ".github/actions/**"
      # prebuilt.profiling.Dockerfile COPYs these scripts into the
      # edge-profiling image, so changes here need to rebuild.
      - "scripts/profiling/**"
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "tools/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/deps/**"
      - ".github/actions/**"
      - "scripts/profiling/**"

permissions:
  contents: read

env:
  BINARIES: |-
    merod
    meroctl
    mero-abi
    cargo-mero
  AUTH_BINARIES: |-
    mero-auth
  # Binaries to publish to Homebrew
  HOMEBREW_BINARIES: |-
    merod
    meroctl
    mero-abi
    cargo-mero
  DOCKER_PLATFORMS: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
  INCLUDE_AARCH64: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
  # Windows is built from the same matrix but publishes a narrower set than the
  # unix targets: `merod`, because the desktop app bundles it and its in-app
  # version switcher downloads `merod_x86_64-pc-windows-msvc.tar.gz` straight
  # from these releases, and `meroctl`, because a Windows user driving a node
  # needs the CLI. The rest (`mero-abi`, `cargo-mero`, `mero-auth`) have never
  # been compiled for Windows, and a break in any of them would red the whole
  # release rather than the one binary nobody asked for.
  WINDOWS_BINARIES: |-
    merod
    meroctl
  INCLUDE_WINDOWS: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

jobs:
  prepare:
    name: Prepare
    runs-on: big-machine
    permissions:
      # Needed by "Create release at trigger time" below.
      contents: write
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      binary_release: ${{ steps.version_info.outputs.binary_release }}
      crate_release: ${{ steps.version_info.outputs.crate_release }}
      docker_release: ${{ steps.version_info.outputs.docker_release }}
      docker_push: ${{ github.event.pull_request && !github.event.pull_request.head.repo.fork || !github.event.pull_request }}
      prerelease: ${{ steps.version_info.outputs.prerelease }}
      target_commit: ${{ steps.version_info.outputs.target_commit }}
      # On a PR, true iff this PR touches files that affect the
      # profiling binaries / image. Used to enable the otherwise
      # PR-skipped profiling build steps and the
      # `release-merod-profiling-container` job, which in turn lets
      # `fuzzy-load-test.yml`'s `pull_request` trigger pull a fresh
      # `pr-<N>-profiling` image and validate the change before merge.
      # Defaults to `false` so non-profiling PRs keep their current
      # cheap behaviour.
      profiling_paths_changed: ${{ steps.profiling_paths.outputs.changed || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get version info
        id: version_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "target_commit=${{ github.sha }}" >> $GITHUB_OUTPUT

          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.metadata.workspaces.version')

          prerelease=false
          binary_release=false
          crate_release=false
          docker_release=false

          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            if [[ "$version" =~ -[a-z]+(\.[0-9]+)?$ ]]; then
              prerelease=true
            fi

            if ! gh release view "$version" --repo ${{ github.repository }} >/dev/null 2>&1; then
              binary_release=true
              crate_release=true
              docker_release=true
            elif [ "${{ github.run_attempt }}" != "1" ] \
              && [ "$(gh release view "$version" --repo ${{ github.repository }} --json assets --jq '.assets | length')" = "0" ]; then
              # The release shell exists (this run created it on an earlier
              # attempt, or someone created it by hand after a race) but no
              # binaries were ever attached, so re-arm the upload.
              #
              # Only on a re-run. The shell is created seconds into the
              # release commit's own run, while the binaries land ~40min
              # later, so on a first attempt "shell with no assets" is the
              # normal state of a release that is still building — not a
              # release that needs rescuing. Re-arming there made every
              # ordinary commit pushed inside that window believe it owned
              # the release too, and the second one to reach the upload
              # died on "an asset called ... already exists".
              binary_release=true
            elif [ "$(gh release view "$version" --repo ${{ github.repository }} --json assets --jq '.assets | length')" = "0" ]; then
              # Same shape, but on a first attempt, so this push is not the
              # one that owns the release. Either the release is still
              # building (fine, say nothing useful about it) or its build
              # failed and nobody noticed. Say so rather than skipping in
              # silence: the fix is to re-run the release commit's own run,
              # because the tag points at that commit and the assets have
              # to be built from it -- not from whatever landed since.
              echo "::warning::Release $version exists with no assets. If its build failed, re-run that run; this push will not upload binaries."
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            docker_release=true
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          echo "binary_release=$binary_release" >> $GITHUB_OUTPUT
          echo "crate_release=$crate_release" >> $GITHUB_OUTPUT
          echo "docker_release=$docker_release" >> $GITHUB_OUTPUT

      # Create the tag + release NOW, while ${{ github.sha }} is still the
      # head of master. A workflow's GITHUB_TOKEN is an integration token,
      # and GitHub rejects integration-token release/tag creation whose
      # target is anything but the current branch head with
      # `403 Resource not accessible by integration`
      # (https://github.com/cli/cli/issues/9514). Release Binaries runs
      # hours later (build + big-machine queue); if any PR merges to master
      # in that window, the release-cut commit is no longer head and the
      # upload step can no longer create the release. Creating it here
      # shrinks the race window from hours to seconds. The upload step then
      # finds the existing release and only attaches assets, which is
      # always permitted.
      - name: Create release at trigger time
        if: github.event_name == 'push' && steps.version_info.outputs.binary_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version_info.outputs.version }}
          PRERELEASE: ${{ steps.version_info.outputs.prerelease }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to create."
            exit 0
          fi
          args=(--repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$VERSION" --notes "")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if ! gh release create "$VERSION" "${args[@]}"; then
            echo "::error::Could not create release $VERSION. If master moved past ${{ github.sha }} already, create the tag+release manually and re-run failed jobs: gh api -X POST repos/${{ github.repository }}/git/refs -f ref=refs/tags/$VERSION -f sha=${{ github.sha }} && gh api -X POST repos/${{ github.repository }}/releases -f tag_name=$VERSION -f name=$VERSION -F prerelease=$PRERELEASE"
            exit 1
          fi

      # Match the file set that defines the profiling image's content:
      # the entrypoint + helper scripts baked into the image, the
      # Dockerfile itself, and the fuzzy workflow that exercises it.
      # Use `gh api` (same pattern as scripts/determine-image-tag.sh)
      # rather than `tj-actions/changed-files` so we don't need to
      # change the prepare job's checkout depth.
      - name: Detect profiling-relevant changes
        id: profiling_paths
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api \
            "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')
          if echo "$files" | grep -qE '^(scripts/profiling/|\.github/workflows/deps/prebuilt\.profiling\.Dockerfile$|\.github/workflows/fuzzy-load-test\.yml$|workflows/fuzzy-tests/)'; then
            echo "Profiling paths changed — profiling image will be built and fuzzy-load-test will run on this PR"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No profiling-relevant changes — skipping profiling build (default PR behaviour)"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    name: Build Binaries (${{ matrix.name }})
    needs: prepare
    strategy:
      matrix:
        # Keep legacy check names for required status checks.
        #
        # TEMPORARY (remove before merge): this PR's whole subject is behaviour
        # under `cfg(not(unix))`, which is never type-checked when building for
        # a unix host. The pull_request arm is Linux-only for cost, so without
        # this the Windows arm of the new stop watch would first compile on
        # master. Remove once this PR is green.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"ubuntu-24.04-8cpu, x86_64-unknown-linux-gnu","runner":"big-machine","target":"x86_64-unknown-linux-gnu"},{"name":"windows-latest, x86_64-pc-windows-msvc","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]' || '[{"name":"ubuntu-24.04-8cpu, x86_64-unknown-linux-gnu","runner":"big-machine","target":"x86_64-unknown-linux-gnu"},{"name":"ubuntu-24.04-arm, aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"name":"macos-latest, aarch64-apple-darwin","runner":"macos-latest","target":"aarch64-apple-darwin"},{"name":"windows-latest, x86_64-pc-windows-msvc","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    # Every `run:` below is bash (readarray, tar, $BINARIES). Windows runners
    # default to pwsh, where those scripts are not merely unportable but
    # silently different, so the shell is pinned for the whole job rather than
    # per step.
    defaults:
      run:
        shell: bash

    env:
      CALIMERO_WEBUI_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CALIMERO_AUTH_FRONTEND_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: release

      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev

      # `rocksdb` is pulled with `bindgen-runtime`, so librocksdb-sys needs a
      # libclang at build time on every platform. Linux installs one above;
      # the Windows image already ships LLVM, but nothing points bindgen at it.
      - name: Point bindgen at the image's LLVM (Windows)
        if: runner.os == 'Windows'
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # aws-lc-sys (rustls' provider, reached via libp2p-tls) assembles its
      # x86_64 primitives with NASM on windows-msvc and fails the build if it
      # is absent. Not needed on unix, which uses the system assembler.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Update Bash
        if: ${{ matrix.runner == 'macos-13' || matrix.runner == 'macos-latest' }}
        run: brew install bash

      # The mock TEE attestation path must never be compiled into a released
      # binary: with `mock-attestation` off, `is_mock_quote` /
      # `verify_mock_attestation` / `generate_mock_attestation` do not exist, so a
      # MOCK_TDX_QUOTE_V1 blob just fails real DCAP parsing and is rejected. Fail
      # the release if anything pulls the feature into the production build.
      - name: Guard - mock-attestation must not leak into the release build
        run: |
          if cargo tree -e features -i calimero-tee-attestation -p merod | grep -q 'mock-attestation'; then
            echo "::error::mock-attestation leaked into production build"
            exit 1
          fi
          echo "OK: mock-attestation is not enabled in the production merod build"

      # Windows ships a narrower set than the unix targets (see
      # WINDOWS_BINARIES above), so the list the steps below iterate is
      # resolved once here instead of each step re-deriving it and drifting.
      - name: Resolve the binaries this target publishes
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            printf 'TARGET_BINARIES<<CALIMERO_EOF\n%s\nCALIMERO_EOF\n' "$WINDOWS_BINARIES" >> "$GITHUB_ENV"
          else
            printf 'TARGET_BINARIES<<CALIMERO_EOF\n%s\n%s\nCALIMERO_EOF\n' "$BINARIES" "$AUTH_BINARIES" >> "$GITHUB_ENV"
          fi

      - name: Build binaries
        run: |
          readarray -t binaries <<< "$TARGET_BINARIES"

          binaries=$(printf -- '-p %s ' "${binaries[@]}")

          cargo build $binaries --release --target ${{ matrix.target }}

      - name: Compress artifacts using gzip
        run: |
          mkdir -p artifacts

          readarray -t binaries <<< "$TARGET_BINARIES"

          # Only the file inside the archive gains Windows' mandatory `.exe`.
          # The archive itself keeps the `<binary>_<target>.tar.gz` name every
          # consumer already resolves by target triple - the desktop app's
          # in-app merod switcher among them - so adding a platform does not
          # change how any of them find an asset.
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            suffix=".exe"
          fi

          for binary in "${binaries[@]}"; do
            tar -czf artifacts/"$binary"_${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release "$binary$suffix"
          done

      - name: Build profiling binaries (with frame pointers and debug symbols)
        if: ${{ (github.event_name != 'pull_request' || needs.prepare.outputs.profiling_paths_changed == 'true') && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu') }}
        run: |
          readarray -t binaries <<< "$BINARIES"
          binaries=$(printf -- '-p %s ' "${binaries[@]}")

          # Build with frame pointers and enable Wasmer PerfMap profiling feature
          RUSTFLAGS="-C force-frame-pointers=yes" cargo build $binaries --profile profiling --target ${{ matrix.target }} --features calimero-context/profiling

      - name: Compress profiling artifacts using gzip
        if: ${{ (github.event_name != 'pull_request' || needs.prepare.outputs.profiling_paths_changed == 'true') && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu') }}
        run: |
          mkdir -p artifacts-profiling

          readarray -t binaries <<< "$BINARIES"

          for binary in "${binaries[@]}"; do
            tar -czf artifacts-profiling/"$binary"_${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/profiling "$binary"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.target }}
          path: artifacts/*
          retention-days: 2

      - name: Upload profiling artifacts
        if: ${{ (github.event_name != 'pull_request' || needs.prepare.outputs.profiling_paths_changed == 'true') && (matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu') }}
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-profiling-${{ matrix.target }}
          path: artifacts-profiling/*
          retention-days: 2

  release-binaries:
    name: Release Binaries
    if: needs.prepare.outputs.binary_release == 'true'
    runs-on: big-machine
    needs: [prepare, build-binaries]
    concurrency:
      # Keyed on the commit (or the PR), never on the release version. A
      # version key puts every master push inside one release window into
      # a single group, and GitHub resolves that contention by cancelling
      # the older run -- so a commit that built perfectly still shows up
      # red on master. A per-commit key leaves only the contention dedup
      # is actually for: a re-run racing the attempt it replaces.
      #
      # `github.job` is deliberately absent: it is null everywhere except
      # inside step execution, so using it here silently collapsed the
      # binaries and app-bundle jobs into one shared group.
      group: ${{ github.workflow }}-release-binaries-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download x86_64 Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: artifacts/

      - name: Download aarch64 Linux artifacts
        if: ${{ env.INCLUDE_AARCH64 == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: artifacts/

      - name: Download aarch64 macOS artifacts
        if: ${{ env.INCLUDE_AARCH64 == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: artifacts-aarch64-apple-darwin
          path: artifacts/

      - name: Download x86_64 Windows artifacts
        if: ${{ env.INCLUDE_WINDOWS == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: artifacts-x86_64-pc-windows-msvc
          path: artifacts/

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*
          file_glob: true
          tag: ${{ needs.prepare.outputs.version }}
          release_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          target_commit: ${{ needs.prepare.outputs.target_commit }}

  # Publishes the kv-store demo app as a signed .mpk release asset, so a
  # downstream SDK e2e (mero-js, mero-react) can fetch an app bundle from the
  # SAME tag it fetches `merod` from, instead of committing a binary fixture
  # that silently rots as the manifest schema moves. It also gives the release
  # its only end-to-end exercise of `cargo-mero`: the toolchain is shipped as a
  # binary below, but nothing else in this workflow actually runs `bundle`.
  #
  # Signed with the dev key on purpose. The dev seed is well-known and
  # deterministic, so the bundle's ApplicationId -- hash(package, signer) -- is
  # stable across every release, which is what makes it usable as a test
  # fixture. The registry refuses dev-signed bundles, so this artifact
  # structurally cannot escape into real distribution.
  release-app-bundle:
    name: Release App Bundle
    runs-on: ubuntu-latest
    needs: [prepare]
    concurrency:
      # Per-commit, not per-version: a version key makes two master pushes
      # in one release window contend, and the older run is cancelled --
      # red master for a commit that was never broken.
      group: ${{ github.workflow }}-release-app-bundle-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: release-app-bundle
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build the kv-store bundle
        run: cargo mero bundle --dev --no-icon --app-version "${{ needs.prepare.outputs.version }}" --manifest-path apps/kv-store/Cargo.toml --output dist/kv-store-test-fixture.mpk

      # Gated like `release-binaries`: a PR builds the bundle (so a break in
      # `cargo mero bundle` fails the PR that caused it) but publishes nothing.
      - name: Upload the bundle to the release
        if: needs.prepare.outputs.binary_release == 'true'
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/kv-store-test-fixture.mpk
          tag: ${{ needs.prepare.outputs.version }}
          release_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          target_commit: ${{ needs.prepare.outputs.target_commit }}

  release-crates:
    name: Release Crates
    if: needs.prepare.outputs.crate_release == 'true'
    runs-on: ubuntu-latest
    needs: [prepare, build-binaries]

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false

      - name: Checkout core repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Rust
        # Pinned to a commit SHA (supply-chain hygiene); comment tracks the tag.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Verify Rust installation
        run: rustc --version

      - name: Setup rust cache (publish)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release

      - name: Publish calimero-workspaces on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -x

          # Install the specific version of cargo-workspaces that we know works
          cargo install --git https://github.com/calimero-network/cargo-workspaces --tag v0.3.0 cargo-workspaces

          # Publish all publishable crates from the workspace, skipping excluded packages.
          # --no-verify skips the build-verification step; --no-git-* avoids git ops.
          #
          # Retry the publish: crates.io index propagation can lag, so cargo's
          # built-in "wait for the crate to appear in the index" loop after one
          # crate may time out, and packaging the *next* crate then fails to
          # resolve the just-published prerelease dependency
          # ("failed to select a version for ... = ^X.Y.Z-rc.N"). cargo-workspaces
          # skips crates that are already on crates.io, so re-running resumes from
          # the failed crate once the index has caught up.
          publish() {
            cargo ws publish --yes --allow-dirty --force '*' \
              --no-verify \
              --no-git-tag --no-git-commit --no-git-push
          }
          for attempt in 1 2 3 4 5; do
            if publish; then
              exit 0
            fi
            echo "::warning::cargo ws publish attempt ${attempt} failed (likely crates.io index lag); retrying in 60s"
            sleep 60
          done
          echo "::error::cargo ws publish failed after 5 attempts"
          exit 1

  release-merod-container:
    name: Release Merod container
    needs: [prepare, build-binaries]
    concurrency:
      # Per-commit, not per-version: a version key makes two master pushes
      # in one release window contend, and the older run is cancelled --
      # red master for a commit that was never broken.
      group: ${{ github.workflow }}-merod-container-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    runs-on: big-machine
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Release
        uses: ./.github/actions/container-release
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: ${{ needs.prepare.outputs.docker_release }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          push: ${{ needs.prepare.outputs.docker_push }}
          binaries: ${{ env.BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.Dockerfile
          container_name: merod
          platforms: ${{ env.DOCKER_PLATFORMS }}
          include_aarch64: ${{ env.INCLUDE_AARCH64 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release-mero-auth-container:
    name: Release Mero Auth container
    needs: [prepare, build-binaries]
    concurrency:
      # Per-commit, not per-version: a version key makes two master pushes
      # in one release window contend, and the older run is cancelled --
      # red master for a commit that was never broken.
      group: ${{ github.workflow }}-mero-auth-container-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    runs-on: big-machine
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Release
        uses: ./.github/actions/container-release
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: ${{ needs.prepare.outputs.docker_release }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          push: ${{ needs.prepare.outputs.docker_push }}
          binaries: ${{ env.AUTH_BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.auth.Dockerfile
          container_name: mero-auth
          platforms: ${{ env.DOCKER_PLATFORMS }}
          include_aarch64: ${{ env.INCLUDE_AARCH64 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  release-merod-profiling-container:
    name: Release Merod Profiling container
    # PRs that don't touch profiling paths still skip this job to keep
    # CI cost low. PRs that DO touch profiling paths build and push
    # `pr-<N>-profiling`, which `fuzzy-load-test.yml`'s pull_request
    # trigger then exercises so contributors can verify before merge.
    # `prepare.outputs.docker_push` already gates against fork PRs
    # (forks can't push to ghcr).
    if: ${{ github.event_name != 'pull_request' || needs.prepare.outputs.profiling_paths_changed == 'true' }}
    needs: [prepare, build-binaries]
    concurrency:
      # Per-commit, not per-version: a version key makes two master pushes
      # in one release window contend, and the older run is cancelled --
      # red master for a commit that was never broken.
      group: ${{ github.workflow }}-merod-profiling-container-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    runs-on: big-machine
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Release
        uses: ./.github/actions/container-release-profiling
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: ${{ needs.prepare.outputs.docker_release }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          push: ${{ needs.prepare.outputs.docker_push }}
          binaries: ${{ env.BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.profiling.Dockerfile
          container_name: merod
          platforms: ${{ env.DOCKER_PLATFORMS }}
          include_aarch64: ${{ env.INCLUDE_AARCH64 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  brew-update:
    name: Update Homebrew Tap
    if: needs.prepare.outputs.binary_release == 'true'
    runs-on: big-machine
    needs: [prepare, release-binaries]
    permissions:
      id-token: write
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-tap

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Update Formula
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          target_branch="chore/bump-formulas-version"
          git fetch origin "${target_branch}" || true
          git checkout "${target_branch}" || git checkout -b "${target_branch}"

          readarray -t binaries <<< "$HOMEBREW_BINARIES"

          for binary in "${binaries[@]}"; do
            echo "Updating formula for ${binary}, version: ${{ needs.prepare.outputs.version }}"
            ./generate-formula.sh "${binary}" "${{ needs.prepare.outputs.version }}"
          done

          git status

          if git diff-index --quiet HEAD --; then
            echo "There are no changes to commit"
            exit 1
          fi

          git add Formula/
          git commit -m "chore: bump formulas version"
          git push origin "${target_branch}"

          gh pr create -f || true

  # Opens the pull request that moves every app in the fleet onto this release.
  #
  # Placed after `release-binaries`, not alongside `prepare`, and that ordering
  # matters: the tag exists seconds into the release commit's run, but its
  # binaries land roughly forty minutes later. A bump pull request opened at
  # trigger time announces a version whose merod image nobody can pull yet, and
  # the consumer's own e2e would fail trying.
  fleet-bump:
    name: Open SDK bump PRs
    if: needs.prepare.outputs.binary_release == 'true'
    needs: [prepare, release-binaries]
    uses: ./.github/workflows/fleet-bump.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    # GH_APP_PRIVATE_KEY, which the called workflow uses to mint a per-repository
    # installation token.
    secrets: inherit
