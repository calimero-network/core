name: Release

# A release cut builds and publishes: a push to master whose version (the root
# Cargo.toml's) has no GitHub release yet. It publishes the binaries (Linux
# x86_64 and aarch64; the command-line tools for macOS), crates, the App Bundle,
# the Homebrew tap and SDK bump PRs, and the merod image (amd64 and arm64) under
# the version and `latest` or `prerelease`, once that image passed its smoke e2e.
# Any other push builds nothing: `prepare` decides in seconds. PRs and the merge
# queue build no release: ci-checks tests every crate, and e2e.yml runs a release
# merod in the queue. `workflow_dispatch` builds and tests a release on any branch
# and publishes nothing.
on:
  push:
    branches:
      - master
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "tools/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/deps/**"
      - ".github/actions/**"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
      - "tools/mero-sign/README.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Linux (x86_64, aarch64): the node and its command line, which also builds,
  # packs, signs and publishes apps.
  BINARIES: |-
    merod
    meroctl
  # macOS (aarch64): a developer's machine runs no node (Docker does), so the
  # command line only.
  MACOS_BINARIES: |-
    meroctl
  HOMEBREW_BINARIES: |-
    meroctl
  # The image runs a node and nothing else: meroctl and the other tools ship as
  # release archives and through Homebrew.
  IMAGE_BINARIES: |-
    merod

jobs:
  # Every job runs on a standard GitHub-hosted runner, free on a public repository.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed by "Create release at trigger time" below.
      contents: write
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      binary_release: ${{ steps.version_info.outputs.binary_release }}
      crate_release: ${{ steps.version_info.outputs.crate_release }}
      docker_release: ${{ steps.version_info.outputs.docker_release }}
      prerelease: ${{ steps.version_info.outputs.prerelease }}
      build_matrix: ${{ steps.build_matrix.outputs.matrix }}
      # Whether this run builds: a release cut, or a run by hand (which publishes nothing).
      build: ${{ github.event_name == 'workflow_dispatch' || steps.version_info.outputs.binary_release == 'true' }}
      target_commit: ${{ steps.version_info.outputs.target_commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get version info
        id: version_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "target_commit=${GITHUB_SHA}" >> $GITHUB_OUTPUT

          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.metadata.workspaces.version')

          prerelease=false
          binary_release=false
          crate_release=false
          docker_release=false

          # Only the push of a cut releases: a run by hand (workflow_dispatch) builds and
          # tests, and publishes nothing, on master too.
          if [ "${GITHUB_REF}" == "refs/heads/master" ] && [ "${GITHUB_EVENT_NAME}" == "push" ]; then
            if [[ "$version" =~ -[a-z]+(\.[0-9]+)?$ ]]; then
              prerelease=true
            fi

            if ! gh release view "$version" --repo ${GITHUB_REPOSITORY} >/dev/null 2>&1; then
              binary_release=true
              crate_release=true
              docker_release=true
            elif [ "${GITHUB_RUN_ATTEMPT}" != "1" ] \
              && [ "$(gh release view "$version" --repo ${GITHUB_REPOSITORY} --json assets --jq '.assets | length')" = "0" ]; then
              # Re-arm only on a re-run: on a first attempt, a shell with no assets is
              # just a release still building, owned by another run.
              binary_release=true
            elif [ "$(gh release view "$version" --repo ${GITHUB_REPOSITORY} --json assets --jq '.assets | length')" = "0" ]; then
              # A failed release build must be fixed by re-running its own run, since the
              # tag points at that commit.
              echo "::warning::Release $version exists with no assets. If its build failed, re-run that run; this push will not upload binaries."
            fi
          fi

          echo "version=$version" >> $GITHUB_OUTPUT
          echo "prerelease=$prerelease" >> $GITHUB_OUTPUT
          echo "binary_release=$binary_release" >> $GITHUB_OUTPUT
          echo "crate_release=$crate_release" >> $GITHUB_OUTPUT
          echo "docker_release=$docker_release" >> $GITHUB_OUTPUT

      # Every build is a release's (or a run by hand that checks one): Linux x86_64
      # and aarch64 (the release archives and the image's two platforms), and macOS
      # for the command-line tools Homebrew installs. There is no Windows build:
      # nodes run on Linux TDX hosts only.
      - name: Choose the build targets
        id: build_matrix
        run: |
          set -euo pipefail
          linux='{"name":"x86_64-unknown-linux-gnu","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}'
          arm='{"name":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"}'
          macos='{"name":"aarch64-apple-darwin","runner":"macos-latest","target":"aarch64-apple-darwin"}'
          matrix="[$linux,$arm,$macos]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.[].name' <<<"$matrix"

      # GITHUB_TOKEN is an integration token, and GitHub rejects release/tag creation whose target
      # is not the branch head; create it now, before master moves, so the later upload only attaches.
      - name: Create release at trigger time
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.version_info.outputs.binary_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version_info.outputs.version }}
          PRERELEASE: ${{ steps.version_info.outputs.prerelease }}
        run: |
          if gh release view "$VERSION" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to create."
            exit 0
          fi
          args=(--repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "$VERSION" --notes "")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if ! gh release create "$VERSION" "${args[@]}"; then
            echo "::error::Could not create release $VERSION. If master moved past ${GITHUB_SHA} already, create the tag+release manually and re-run failed jobs: gh api -X POST repos/${GITHUB_REPOSITORY}/git/refs -f ref=refs/tags/$VERSION -f sha=${GITHUB_SHA} && gh api -X POST repos/${GITHUB_REPOSITORY}/releases -f tag_name=$VERSION -f name=$VERSION -F prerelease=$PRERELEASE"
            exit 1
          fi

  build-binaries:
    name: Build Binaries (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      matrix:
        # Chosen in `prepare`: see "Choose the build targets".
        include: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fat LTO compiles every crate differently from the other release builds
      # (ci-checks' `release` group), so a cut keeps its own group and saves it for
      # the next cut (each runner's OS and architecture key it apart).
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: release-lto
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Update Bash
        if: ${{ matrix.runner == 'macos-13' || matrix.runner == 'macos-latest' }}
        run: brew install bash

      # mock-attestation must never compile into a release binary: with it off, a
      # MOCK_TDX_QUOTE_V1 blob fails real DCAP parsing and is rejected.
      - name: Guard - mock-attestation must not leak into the release build
        run: |
          if cargo tree -e features -i calimero-tee-attestation -p merod | grep -q 'mock-attestation'; then
            echo "::error::mock-attestation leaked into production build"
            exit 1
          fi
          echo "OK: mock-attestation is not enabled in the production merod build"

      # Resolved once so the steps below cannot drift from MACOS_BINARIES.
      - name: Resolve the binaries this target publishes
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            printf 'TARGET_BINARIES<<CALIMERO_EOF\n%s\nCALIMERO_EOF\n' "$MACOS_BINARIES" >> "$GITHUB_ENV"
          else
            printf 'TARGET_BINARIES<<CALIMERO_EOF\n%s\nCALIMERO_EOF\n' "$BINARIES" >> "$GITHUB_ENV"
          fi

      # What ships: the release profile (fat LTO, one codegen unit).
      - name: Build binaries
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          readarray -t binaries <<< "$TARGET_BINARIES"

          binaries=$(printf -- '-p %s ' "${binaries[@]}")

          cargo build $binaries --release --target ${MATRIX_TARGET}

      - name: Compress artifacts using gzip
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts

          readarray -t binaries <<< "$TARGET_BINARIES"

          # `<binary>_<target>.tar.gz`: consumers (the Docker image, the Homebrew
          # formulas) resolve an archive by target triple.
          for binary in "${binaries[@]}"; do
            tar -czf artifacts/"$binary"_${MATRIX_TARGET}.tar.gz -C target/${MATRIX_TARGET}/release "$binary"
          done

      # A bin target of calimero-tee-attestation behind the `cli` feature, so it cannot join $BINARIES (`-p`).
      # Ships because mdma's manager shells out to it to verify TDX quotes; linux/amd64 image only.
      - name: Build calimero-tee-verify (Linux only)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' }}
        env:
          MATRIX_TARGET: ${{ matrix.target }}
        run: |
          # With mock-attestation compiled in, the verifier would accept a forged
          # MOCK_TDX_QUOTE_V1 blob.
          if cargo tree -e features -p calimero-tee-attestation --features cli | grep -q 'mock-attestation'; then
            echo "::error::mock-attestation leaked into the released calimero-tee-verify"
            exit 1
          fi
          echo "OK: mock-attestation is not enabled in calimero-tee-verify"

          cargo build -p calimero-tee-attestation --bin calimero-tee-verify \
            --features cli --release --target ${MATRIX_TARGET}

          tar -czf artifacts/calimero-tee-verify_${MATRIX_TARGET}.tar.gz \
            -C target/${MATRIX_TARGET}/release calimero-tee-verify

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-${{ matrix.target }}
          path: artifacts/*
          retention-days: 2

  release-binaries:
    name: Release Binaries
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.binary_release == 'true'
    runs-on: ubuntu-latest
    # The merod these archives hold passed the image's smoke e2e first: the image copies
    # the very same binary.
    needs: [prepare, build-binaries, image-e2e]
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      # No `github.job` here: it is null outside steps, which collapses jobs into one group.
      group: ${{ github.workflow }}-release-binaries-${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download x86_64 Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-x86_64-unknown-linux-gnu
          path: artifacts/

      - name: Download aarch64 Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-aarch64-unknown-linux-gnu
          path: artifacts/

      - name: Download aarch64 macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-aarch64-apple-darwin
          path: artifacts/

      - name: Write checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*
          file_glob: true
          tag: ${{ needs.prepare.outputs.version }}
          release_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          target_commit: ${{ needs.prepare.outputs.target_commit }}

  # Dev-signed kv .mpk (kv-store-test-fixture.mpk, package com.calimero.kv-store):
  # the kv component (apps/v2-fixtures/kv: set, get, len, and `clear`, a confirm
  # method), which the clients' cluster tests run against a released merod
  # (mero-js scripts/download-released-merod.sh). Dev-signed bundles are
  # registry-refused, so this can't leak into real distribution. Only when this
  # run publishes a release, the one thing that reads the bundle; PRs build the
  # same fixture in e2e's process suite.
  release-app-bundle:
    name: Release App Bundle
    runs-on: ubuntu-latest
    needs: [prepare]
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.binary_release == 'true'
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      group: ${{ github.workflow }}-release-app-bundle-${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-wasip2
          shared-key: wasm-apps
          save-if: false

      - name: Build the kv bundle
        run: |
          set -euo pipefail
          cargo build --release -p meroctl
          "${CARGO_TARGET_DIR:-target}/release/meroctl" app build apps/v2-fixtures/kv --out dist/kv.wasm
          "${CARGO_TARGET_DIR:-target}/release/meroctl" app pack --wasm dist/kv.wasm \
            --package com.calimero.kv-store --app-version "${NEEDS_PREPARE_OUTPUTS_VERSION}" \
            --out dist/kv-store-test-fixture.mpk
        env:
          NEEDS_PREPARE_OUTPUTS_VERSION: ${{ needs.prepare.outputs.version }}

      - name: Upload the bundle to the release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/kv-store-test-fixture.mpk
          tag: ${{ needs.prepare.outputs.version }}
          release_name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          target_commit: ${{ needs.prepare.outputs.target_commit }}

  release-crates:
    name: Release Crates
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.crate_release == 'true'
    runs-on: ubuntu-latest
    needs: [prepare, build-binaries]

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false

      - name: Checkout core repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: release-crates

      - name: Verify Rust installation
        run: rustc --version

      - name: Publish calimero-workspaces on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -x

          cargo install --git https://github.com/calimero-network/cargo-workspaces --rev 9b079f98de701b7d4c30d86ca5bf555a9a2a3928 cargo-workspaces # v0.3.0

          # Retry: crates.io index lag can make the next crate fail to resolve a just-published prerelease
          # dependency; cargo-workspaces skips already-published crates, so a retry resumes where it failed.
          publish() {
            cargo ws publish --yes --allow-dirty --force '*' \
              --no-verify \
              --no-git-tag --no-git-commit --no-git-push
          }
          for attempt in 1 2 3 4 5; do
            if publish; then
              exit 0
            fi
            echo "::warning::cargo ws publish attempt ${attempt} failed (likely crates.io index lag); retrying in 60s"
            sleep 60
          done
          echo "::error::cargo ws publish failed after 5 attempts"
          exit 1

  # The amd64 image, built and saved for `E2E on the merod image` before anything is
  # pushed: a release publishes only an image whose merod passed the smoke e2e.
  merod-image:
    name: Merod image
    needs: [prepare, build-binaries]
    if: needs.prepare.outputs.build == 'true'
    permissions:
      contents: read
    # Copies the prebuilt binaries into the image; compiles nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/container-release
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: "false"
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          push: "false"
          load-to: merod-image.tar
          binaries: ${{ env.IMAGE_BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.Dockerfile
          container_name: merod
          platforms: linux/amd64
          include_aarch64: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merod-image
          path: merod-image.tar
          if-no-files-found: error
          retention-days: 1

  # A cut's image, amd64 and arm64 (Apple Silicon machines run the arm64 one), pushed
  # under the version and `latest` (a stable release) or `prerelease` (an rc), once the
  # amd64 image of the same binaries passed `E2E on the merod image`.
  release-merod-container:
    name: Release Merod container
    needs: [prepare, build-binaries, image-e2e]
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.docker_release == 'true'
    concurrency:
      # Per-commit, not per-version: a version key would cancel an older, still-good master push.
      group: ${{ github.workflow }}-merod-container-${{ github.sha }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    # Copies the prebuilt binaries into the image; compiles nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release
        uses: ./.github/actions/container-release
        with:
          version: ${{ needs.prepare.outputs.version }}
          release: "true"
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          push: "true"
          binaries: ${{ env.IMAGE_BINARIES }}
          dockerfile: .github/workflows/deps/prebuilt.Dockerfile
          container_name: merod
          platforms: linux/amd64,linux/arm64
          include_aarch64: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # What `E2E on the merod image` needs besides the image: a release meroctl,
  # the kv component and two signed releases of it, built while the binaries build.
  image-e2e-fixtures:
    name: Image E2E fixtures
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          targets: wasm32-wasip2
          shared-key: wasm-apps
          save-if: false

      # The suite's tools, not what ships: optimized without fat LTO, whose
      # single-threaded link was most of this job. Set on this step only, so the
      # cache step above hashes what the wasm-apps group's other jobs do.
      - name: Build meroctl and the suite's fixtures
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          set -euo pipefail
          cargo build --release -p meroctl
          mkdir -p target/image-e2e
          target_dir="${CARGO_TARGET_DIR:-target}"
          "$target_dir/release/meroctl" app build \
            apps/v2-fixtures/kv --out target/image-e2e/kv.wasm
          cp "$target_dir/release/meroctl" target/image-e2e/
          for v in 1.0.0 1.1.0; do
            "$target_dir/release/meroctl" app pack --wasm target/image-e2e/kv.wasm \
              --package com.calimero.kv-store --app-version "$v" \
              --out "target/image-e2e/com.calimero.kv-store-$v.mpk"
          done

      - name: Upload them
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-e2e-fixtures
          path: target/image-e2e
          if-no-files-found: error
          retention-days: 1

  # The image this run built is tested before anything is published: this runs the
  # process suite's smoke set (`suite.py --smoke`: a crashed and a frozen node, a
  # frozen leader, organizations and keys, signed packages, a 30 s kv-store soak)
  # against the `merod` inside the image. e2e.yml's nightly tests the latest
  # published release's image.
  image-e2e:
    name: E2E on the merod image
    needs: [prepare, merod-image, image-e2e-fixtures]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merod-image
          path: target/image

      - name: Download the fixtures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-e2e-fixtures
          path: target/image-e2e

      # The suite runs `merod` processes, not containers: the binary is the
      # image's own /usr/local/bin/merod, and the image must start it.
      - name: Take merod out of the image
        run: |
          set -euo pipefail
          image=$(docker load -i target/image/merod-image.tar | sed -n 's/^Loaded image: //p' | head -n1)
          if [ -z "$image" ]; then
            echo "::error::merod-image.tar holds no tagged image"
            exit 1
          fi
          echo "testing $image"
          docker run --rm "$image" --version
          id=$(docker create "$image")
          docker cp "$id:/usr/local/bin/merod" target/image/merod
          docker rm "$id"
          rm target/image/merod-image.tar
          echo "MEROD_BINARY=$GITHUB_WORKSPACE/target/image/merod" >> "$GITHUB_ENV"

      - name: Process suite (smoke) on the image's merod
        run: |
          set -euo pipefail
          chmod +x target/image-e2e/meroctl
          python3 -I crates/node/tests/fault/suite.py --smoke \
            --merod "$MEROD_BINARY" --meroctl target/image-e2e/meroctl \
            --kv-wasm target/image-e2e/kv.wasm \
            --kv-mpk target/image-e2e/com.calimero.kv-store-1.0.0.mpk \
            --kv-mpk-next target/image-e2e/com.calimero.kv-store-1.1.0.mpk \
            --soak-report target/image/soak.json --json target/image/suite.json

      - name: Soak latency and throughput
        if: ${{ !cancelled() }}
        run: bash scripts/soak-summary.sh target/image/soak.json "Soak on this run's merod image (process suite smoke, 30s)"

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-e2e-results
          path: |
            target/image/suite.json
            target/image/soak.json
            target/fault-suite
          if-no-files-found: ignore
          retention-days: 7

  brew-update:
    name: Update Homebrew Tap
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.binary_release == 'true'
    runs-on: ubuntu-latest
    needs: [prepare, release-binaries]
    permissions: {}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${STEPS_APP_TOKEN_OUTPUTS_APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STEPS_APP_TOKEN_OUTPUTS_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STEPS_APP_TOKEN_OUTPUTS_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          STEPS_GET_USER_ID_OUTPUTS_USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          gh auth setup-git
          git config --global user.name "${STEPS_APP_TOKEN_OUTPUTS_APP_SLUG}[bot]"
          git config --global user.email "${STEPS_GET_USER_ID_OUTPUTS_USER_ID}+${STEPS_APP_TOKEN_OUTPUTS_APP_SLUG}[bot]@users.noreply.github.com"

      # generate-formula.sh only downloads public release assets, so it runs without the app token.
      - name: Update Formula
        env:
          NEEDS_PREPARE_OUTPUTS_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Always start from the tap's default branch: an existing bump branch is not trusted to run its script.
          git checkout -B chore/bump-formulas-version

          readarray -t binaries <<< "$HOMEBREW_BINARIES"

          for binary in "${binaries[@]}"; do
            echo "Updating formula for ${binary}, version: ${NEEDS_PREPARE_OUTPUTS_VERSION}"
            ./generate-formula.sh "${binary}" "${NEEDS_PREPARE_OUTPUTS_VERSION}"
          done

          git status

          if git diff-index --quiet HEAD --; then
            echo "There are no changes to commit"
            exit 1
          fi

          git add Formula/
          git commit -m "chore: bump formulas version"

      - name: Open the bump PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git -c core.hooksPath=/dev/null push --force origin chore/bump-formulas-version
          gh pr create -f || true

  fleet-bump:
    name: Open SDK bump PRs
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.binary_release == 'true'
    needs: [prepare, release-binaries]
    uses: ./.github/workflows/fleet-bump.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    # ACTIONS_APP_PRIVATE_KEY, which the called workflow uses to mint a per-repository installation token.
    secrets: inherit
