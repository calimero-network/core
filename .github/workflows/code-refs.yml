name: Code references

# Every reference in a comment or AGENTS.md leads somewhere: a docs-site link names
# a page and heading that exist, a path exists, and no file gains a bare tag (D20,
# "review finding F6") or a bare #issue (scripts/check-code-refs.py). Runs when
# either side moves: the code that cites, or the docs page whose heading it cites.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'sdks/**'
      - 'docs/src/content/docs/**'
      - 'docs/astro.config.mjs'
      - 'scripts/check-code-refs.*'
      - 'scripts/tests/check-code-refs-test.py'
      - '.github/workflows/code-refs.yml'
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: code-refs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the checker
        run: python3 scripts/tests/check-code-refs-test.py
      - name: Check code references
        run: python3 scripts/check-code-refs.py
