name: CodeQL

on:
  push:
    branches: ["master"]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "apps/**"
      - "tools/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/codeql/**"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
      - "apps/kv-store/GUIDE.md"
      - "tools/calimero-abi/README.md"
      - "tools/cargo-mero/README.md"
      - "tools/cargo-mero/tests/fixtures/demo-app/GUIDE.md"
      - "tools/cargo-mero/tests/fixtures/multi-app/GUIDE.md"
      - "tools/mero-sign/README.md"

concurrency:
  group: codeql-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: big-machine
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: rust, javascript, actions
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
