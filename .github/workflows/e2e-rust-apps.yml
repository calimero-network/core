    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: merod-image
          path: /tmp

      - name: Load Docker image
        run: zstd -d /tmp/merod-local.tar.zst --stdout | docker load

      # Only the mock-TEE scenario needs it, and it is a second full image —
      # not worth pulling into every shard.
      - name: Download mock-attestation Docker image
        if: matrix.image == 'merod:local-mock-tee'
        uses: actions/download-artifact@v8
        with:
          name: merod-image-mock-tee
          path: /tmp

      - name: Load mock-attestation Docker image
        if: matrix.image == 'merod:local-mock-tee'
        run: zstd -d /tmp/merod-local-mock-tee.tar.zst --stdout | docker load

      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          name: e2e-apps
          path: apps

      - name: Download app bundles
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-bundles
          path: dist

      # Nodes fetch bundles from here rather than from each other. The URL is
      # discovered on this runner, so it is stamped in rather than prebuilt.
      - name: Serve app bundles from a fixture registry
        if: matrix.image != 'merod:local-dht'
        run: |
          url=$(./scripts/e2e-fixture-registry.sh)
          # Stamp the image this lane actually boots, not always the shared one, or a lane on its own
          # image (merod:local-mock-tee) runs unstamped and trips the fetch gate below.
          ./scripts/set-registry-mode.sh "${{ matrix.image || 'merod:local' }}" http "$url"

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      # Only the ephemeral-* scenarios need this: their assertions use the global WebSocket, which
      # landed in Node 22. Pinned so a runner image change can't silently break the scripts.
      - name: Setup Node
        if: startsWith(matrix.workflow, 'ephemeral-')
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Only the size sweep needs these 416 MiB /dev/urandom fixtures. Content must be random: blobs
      # are content-addressed, so predictable content would already sit on the fetching node.
      - name: Generate blob fixtures
        if: matrix.workflow == 'blob-cross-node-sizes'
        run: |
          cd apps/blobs
          chmod +x scripts/gen-blob-fixtures.sh
          ./scripts/gen-blob-fixtures.sh

      - name: Run ${{ matrix.workflow }}
        env:
          # Admin credentials for embedded-auth scenarios, matching the dev/dev-password login steps in
          # the workflow YAMLs. CI-only values; nothing lands in shipped config.
          MERO_AUTH_ADMIN_USER: dev
          MERO_AUTH_ADMIN_PASSWORD: dev-password
        run: |
          # Single attempt, fail loud: a retry loop here used to mask cold-start governance flakes. With
          # the three-phase contract in place, a flake now is a real bug worth surfacing.
          mkdir -p docker-logs
          cd apps/${{ matrix.app }}

          # merobox >=0.6.34 persists per-container logs to data/container-logs/<name>.log
          # natively on every bootstrap run, regardless of stop_all_nodes.
          LOGDIR="$GITHUB_WORKSPACE/docker-logs"
          # Points merobox's restart_container pre-restart snapshot at the absolute LOGDIR; otherwise it
          # writes to a CWD-relative docker-logs/ (we cd'd into the app dir) the uploader never sees.
          export MEROBOX_PRE_RESTART_LOG_DIR="$LOGDIR"

          if merobox bootstrap run \
              "${{ matrix.file }}" \
              --image "${{ matrix.image || 'merod:local' }}" \
              --e2e-mode; then
              success=true
          else
              success=false
          fi

          # A green http scenario proves nothing on its own: the node logs an
          # acquisition either way, so ask the fixture whether it served one.
          if [ "${{ matrix.image }}" != merod:local-dht ] \
              && [ "${{ matrix.registry_fetch }}" != "false" ] \
              && ! docker logs fixture-registry 2>&1 | grep -q 'GET /artifacts/'; then
              echo "::error::${{ matrix.workflow }} fetched nothing from fixture-registry; it did not use the http registry"
              success=false
          fi

          # Collect logs before nuke clears node state, staying robust if nuke's scope changes. Prefixed
          # with the workflow name so filenames stay self-describing when merged with other artifacts.
          for f in data/container-logs/*.log; do
              [ -e "$f" ] || continue
              cp -f "$f" "$LOGDIR/${{ matrix.workflow }}-$(basename "$f")"
          done

          merobox stop --all || true
          merobox nuke --force || true

          if [ "$success" = false ]; then
              echo "::error::${{ matrix.workflow }} workflow failed"
              exit 1
          fi

      - name: Assert no unified-op projection divergence (cutover gate)
        if: always()
        run: |
          # unified_projection_divergence marks the unified-op projection disagreeing with the live
          # decision. HARD gate; silence per-scenario isn't proof, so projection-coverage checks the total.
          strip() { sed -E 's/\x1b\[[0-9;]*m//g'; }
          compares=$(grep -rh "unified_projection_compare" docker-logs/ 2>/dev/null | strip || true)
          echo "membership comparisons:"
          if [ -n "${compares}" ]; then
              echo "${compares}" | grep -oE 'result="[a-z_]+"' | sort | uniq -c
              # By op kind too: a gate that only ever concludes on one plane is thinner than
              # its total suggests.
              echo "${compares}" | grep -oE 'op_kind="[a-z]+"' | sort | uniq -c
          else
              echo "  (none — this scenario folded no membership op)"
          fi
          concluded=$(echo "${compares}" | grep -cE 'result="(agree|diverged)"' || true)
          refused=$(echo "${compares}" | grep -cE 'result="skipped_[a-z_]+"' || true)

          if grep -rl "unified_projection_divergence" docker-logs/ 2>/dev/null | grep -q .; then
              echo "::error::unified-op projection diverged from the live decision in ${{ matrix.workflow }} — cutover gate not met"
              echo "planes seen:"
              grep -rh "unified_projection_divergence" docker-logs/ \
                | strip | grep -o 'plane="[^"]*"' | sort | uniq -c
              echo "sample:"
              grep -rn "unified_projection_divergence" docker-logs/ | strip | head -30
              exit 1
          fi

          # Observe-only per scenario: a single unresolved membership op is thin coverage, not a broken
          # gate. The systemic failure - the gate concluding nothing anywhere - is asserted suite-wide below.
          if [ "${refused}" -gt 0 ] && [ "${concluded}" -eq 0 ]; then
              echo "::notice::every membership comparison in ${{ matrix.workflow }} was refused (${refused}) — thin coverage here; the suite-wide assertion is what gates this"
          fi
          echo "no unified_projection_divergence markers across ${concluded} concluded comparison(s) (${refused} refused) — projection agrees with the live decision"

      - name: Assert unified op-store completeness (C3 Stage 4, HARD gate)
        if: always()
        run: |
          # op_store_incomplete marks the unified op-store missing a governance op the gov-DAG has. HARD
          # gate: the read now flips onto the op-store, so any marker is a correctness bug.
          if grep -rl "op_store_incomplete" docker-logs/ 2>/dev/null | grep -q .; then
              count=$(grep -rho "op_store_incomplete" docker-logs/ | wc -l | tr -d ' ')
              echo "::error::op-store incomplete in ${{ matrix.workflow }} — $count marker(s); a governance apply path is not writing the op-store (read-flip is unsafe)"
              echo "sample (missing_count per namespace):"
              # ANSI escapes sit between the field name and '=' in node logs, so they're stripped first;
              # the match tolerates any field ordering and the field being absent.
              grep -rho 'op_store_incomplete.*' docker-logs/ \
                | sed -E 's/\x1b\[[0-9;]*m//g' \
                | grep -oE 'missing_count=[0-9]+' | sort | uniq -c | head -10
              grep -rn "op_store_incomplete" docker-logs/ | head -10
              exit 1
          elif grep -rl "op_store_gate_unavailable" docker-logs/ 2>/dev/null | grep -q .; then
              # No gap markers, but the gate couldn't load the op-store somewhere — do
              # NOT claim a clean mirror, that would be a false "verified" line.
              gc=$(grep -rho "op_store_gate_unavailable" docker-logs/ | wc -l | tr -d ' ')
              echo "::notice::op-store completeness UNVERIFIED in ${{ matrix.workflow }} — no gaps seen but $gc gate-load failure(s); mirror NOT confirmed"
              grep -rn "op_store_gate_unavailable" docker-logs/ | head -5
          else
              echo "no op_store_incomplete or op_store_gate_unavailable markers — op-store mirrors the gov-DAG for every exercised namespace"
          fi

      - name: Assert no blob chunk was served mid-write (HARD gate)
        if: always()
        run: |
          # "blob chunk hash mismatch; refusing to serve" means a torn read, since no scenario tampers
          # with blob bytes. Fixed via temp-file + rename (atomic); a marker means that regressed.
          if grep -rl "blob chunk hash mismatch" docker-logs/ 2>/dev/null | grep -q .; then
              count=$(grep -rho "blob chunk hash mismatch" docker-logs/ | wc -l | tr -d ' ')
              echo "::error::blob chunk served mid-write in ${{ matrix.workflow }} — $count occurrence(s); a chunk failed its content-hash check on the serve path"
              echo "sample:"
              grep -rn "blob chunk hash mismatch" docker-logs/ | head -10
              exit 1
          fi
          echo "no blob chunk hash mismatches — every chunk served passed its content-hash check"

      - name: Report which ground authorized each group-key recovery (observe-only)
        if: always()
        run: |
          # key_server_accepted allows exactly two grounds: a trusted anchor, or a certificate proving a
          # device of this node's own account. Informational only; key-recovery-coverage below is the floor.
          if grep -rl "key_recovery_authorized_by" docker-logs/ 2>/dev/null | grep -q .; then
              echo "group-key recoveries by authorizing ground:"
              grep -rho 'key_recovery_authorized_by.*' docker-logs/ \
                | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
                | grep -oE 'key_recovery_authorized_by="?[a-z_]+"?' | sort | uniq -c | sort -rn
          else
              # Not a failure: most scenarios never need a direct pull; delivery reaches
              # them first.
              echo "no key_recovery_authorized_by markers - this scenario recovered no group key by direct pull"
          fi

      - name: Report scope_root governance-divergence pulls (P6.S2, observe-only)
        if: always()
        run: |
          # gov_divergence_pull_triggered fires when entities agree but scope_root differs, triggering a
          # pull from the diverging peer. Informational: also watches for a storm (one context dominating).
          if grep -rl "gov_divergence_pull_triggered" docker-logs/ 2>/dev/null | grep -q .; then
              count=$(grep -rho "gov_divergence_pull_triggered" docker-logs/ | wc -l | tr -d ' ')
              echo "::notice::scope_root governance pulls in ${{ matrix.workflow }} — $count trigger(s)"
              echo "per-context trigger counts (watch for a single context dominating = storm):"
              # tracing writes these logs with ANSI styling, so the '=' isn't adjacent to the field name -
              # hence the sed. The value is bs58 (ContextId's Display), not hex.
              per_context=$(grep -rho 'gov_divergence_pull_triggered.*' docker-logs/ \
                | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
                | grep -oE 'context_id=[A-Za-z0-9]+' | sort | uniq -c | sort -rn | head -10)
              if [ -n "$per_context" ]; then
                  echo "$per_context"
              else
                  # Never silently print nothing again: an empty breakdown beside a
                  # non-zero count means the field moved or stopped being emitted.
                  echo "::warning::$count trigger(s) but no context_id parsed from them — the marker's fields changed shape, so this breakdown is blind"
                  grep -rho 'gov_divergence_pull_triggered.*' docker-logs/ | head -2
              fi
              # ops_pulled == 0 throughout means the peer had nothing to give; a non-zero value repeating
              # while the scenario still fails means the fold doesn't converge on ops that do arrive.
              echo "pull outcomes (ops_pulled), which splits 'nothing to give' from 'ops do not take':"
              outcomes=$(grep -rho 'gov_divergence_pull_complete.*' docker-logs/ \
                | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
                | grep -oE 'ops_pulled=[0-9]+' | sort | uniq -c | sort -rn | head -5)
              if [ -n "$outcomes" ]; then
                  echo "$outcomes"
              else
                  echo "::warning::triggers present but no gov_divergence_pull_complete found — the pull did not return, or the marker moved"
              fi
          else
              echo "no gov_divergence_pull_triggered markers — no scope_root governance divergence pulled this run"
          fi

      - name: List docker-logs/ before upload (debug)
        if: always()
        run: ls -la docker-logs/ 2>&1 || echo "docker-logs/ missing"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.workflow }}-${{ github.sha }}
          # docker-logs/ (trailing slash) uploads the entire directory: merobox's per-container logs plus
          # its pre-restart snapshots. A two-pattern glob would silently miss files.
          path: docker-logs/
          retention-days: 7
          if-no-files-found: ignore

  # ── Report phase: notify on PR failure ──
  projection-coverage:
    name: Assert the projection gate compared something
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      # Counterpart to the per-scenario divergence gate, which only asserts a negative - a suite that
      # compared nothing satisfies that too. This asserts the positive across the whole suite.
      - name: Download scenario logs
        id: logs
        # Tolerated so the assertion below can say precisely why logs are missing, rather
        # than fail indistinguishably from a suite that legitimately produced none.
        uses: actions/download-artifact@v8
        with:
          pattern: logs-*
          merge-multiple: true
          path: all-logs
        continue-on-error: true

      - name: Assert the suite concluded comparisons
        run: |
          # Missing logs is benign only if the matrix never ran. A download failure, or a matrix that ran
          # and left nothing, is the fail-open case this job exists to prevent.
          if [ ! -d all-logs ] || [ -z "$(find all-logs -type f -print -quit)" ]; then
              case "${{ needs.test.result }}" in
                skipped|cancelled)
                  echo "::notice::the scenario matrix did not run (${{ needs.test.result }}) — nothing to inspect"
                  exit 0
                  ;;
              esac
              echo "::error::no scenario logs to inspect though the matrix ran (test=${{ needs.test.result }}, artifact download=${{ steps.logs.outcome }}) — the coverage floor could not be checked"
              exit 1
          fi
          strip() { sed -E 's/\x1b\[[0-9;]*m//g'; }
          compares=$(grep -rh "unified_projection_compare" all-logs/ 2>/dev/null | strip || true)
          echo "suite-wide membership comparisons:"
          if [ -n "${compares}" ]; then
              echo "${compares}" | grep -oE 'result="[a-z_]+"' | sort | uniq -c
              echo "by op kind:"
              echo "${compares}" | grep -oE 'op_kind="[a-z]+"' | sort | uniq -c
              echo "conclusive by op kind:"
              echo "${compares}" | grep -E 'result="(agree|diverged)"' \
                | grep -oE 'op_kind="[a-z]+"' | sort | uniq -c || true
          else
              echo "  (none)"
          fi
          concluded=$(echo "${compares}" | grep -cE 'result="(agree|diverged)"' || true)
          if [ "${concluded}" -eq 0 ]; then
              echo "::error::the projection gate concluded NO comparison anywhere in the suite — every divergence gate in this run passed without checking anything"
              exit 1
          fi
          echo "the gate concluded ${concluded} comparison(s) across the suite"

  key-recovery-coverage:
    name: Assert both key-serve grounds were exercised
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      # Counterpart to the per-scenario observe-only report; printing alone isn't gating, so this job
      # asserts suite-wide, same as projection-coverage, that both key-serve grounds were exercised.
      - name: Download scenario logs
        id: logs
        # Tolerated so the assertion below can say precisely why logs are missing, rather
        # than fail indistinguishably from a suite that legitimately produced none.
        uses: actions/download-artifact@v8
        with:
          pattern: logs-*
          merge-multiple: true
          path: all-logs
        continue-on-error: true

      - name: Assert each ground was exercised somewhere
        run: |
          # Missing logs is benign only if the matrix never ran. A download failure, or a matrix that ran
          # and left nothing, is the fail-open case this job exists to prevent.
          if [ ! -d all-logs ] || [ -z "$(find all-logs -type f -print -quit)" ]; then
              case "${{ needs.test.result }}" in
                skipped|cancelled)
                  echo "::notice::the scenario matrix did not run (${{ needs.test.result }}) — nothing to inspect"
                  exit 0
                  ;;
              esac
              echo "::error::no scenario logs to inspect though the matrix ran (test=${{ needs.test.result }}, artifact download=${{ steps.logs.outcome }}) — the key-serve coverage floor could not be checked"
              exit 1
          fi
          # ANSI escapes sit between a field name and its `=` in node logs, so the
          # sed is not optional; matching the raw pattern finds nothing.
          grounds=$(grep -rho 'key_recovery_authorized_by.*' all-logs/ 2>/dev/null \
            | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
            | grep -oE 'key_recovery_authorized_by="?[a-z_]+"?' \
            | sed -E 's/.*=//; s/"//g' || true)
          echo "suite-wide group-key recoveries by authorizing ground:"
          if [ -n "${grounds}" ]; then
              echo "${grounds}" | sort | uniq -c | sort -rn
          else
              echo "  (none)"
          fi
          # Printed whether or not the floor holds, since the count alone doesn't say which scenario
          # supplied a ground. Filenames (from the merged artifacts) are the attribution.
          echo "which scenarios supplied them:"
          supplied=0
          for f in $(grep -rl 'key_recovery_authorized_by' all-logs/ 2>/dev/null || true); do
              supplied=1
              n=$(grep -c 'key_recovery_authorized_by' "${f}" || true)
              g=$(grep -ho 'key_recovery_authorized_by.*' "${f}" \
                | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
                | grep -oE 'key_recovery_authorized_by="?[a-z_]+"?' \
                | sed -E 's/.*=//; s/"//g' | sort -u | paste -sd, - || true)
              echo "  $(basename "${f}"): ${n} (${g})"
          done
          if [ "${supplied}" -eq 0 ]; then
              echo "  (no log file mentions the marker at all)"
          fi
          anchor=$(echo "${grounds}" | grep -cx 'anchor' || true)
          own=$(echo "${grounds}" | grep -cx 'own_account_device' || true)
          # Reported rather than ignored: renaming the value in code would otherwise fail
          # both floors below with a message that blames the scenarios instead of the rename.
          other=$(echo "${grounds}" | grep -vx -e 'anchor' -e 'own_account_device' | sort -u | paste -sd, - || true)
          if [ -n "${other}" ]; then
              echo "::warning::unrecognized authorizing ground(s): ${other} — either a third ground was added (extend this floor) or the marker's values were renamed"
          fi
          # Spelled as if blocks, not [ ... ] && x=y: under bash -e a false test as the last
          # command of an && list exits the script, aborting even the happy path.
          missing=""
          if [ "${anchor}" -eq 0 ]; then
              missing="anchor"
          fi
          if [ "${own}" -eq 0 ]; then
              missing="${missing:+${missing} and }own_account_device"
          fi
          if [ -n "${missing}" ]; then
              echo "::error::no group-key recovery anywhere in the suite was authorized by: ${missing} (anchor=${anchor}, own_account_device=${own}) — unexercised, so a regression breaking it would leave this suite green, which is exactly how #3892 shipped inert"
              echo "the scenarios that supplied each ground when this floor was set:"
              echo "  own_account_device — account-device-revoke-lockout"
              echo "  anchor             — group-subgroup-cold-sync"
              echo "if one of those scenarios was intentionally changed, another must exercise the ground; do NOT lower this floor to match a regression"
              exit 1
          fi
          echo "both key-serve grounds exercised across the suite (anchor=${anchor}, own_account_device=${own})"

  comment:
    name: Report Failed Workflow
    needs: [test, auth-seam, projection-coverage, key-recovery-coverage]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Check if main job failed or was cancelled
        id: check_status
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.auth-seam.result }}" != "success" ] || [ "${{ needs.projection-coverage.result }}" != "success" ] || [ "${{ needs.key-recovery-coverage.result }}" != "success" ]; then
            echo "job_failed=true" >> $GITHUB_OUTPUT
            if [ "${{ needs.test.result }}" == "cancelled" ] || [ "${{ needs.auth-seam.result }}" == "cancelled" ] || [ "${{ needs.projection-coverage.result }}" == "cancelled" ] || [ "${{ needs.key-recovery-coverage.result }}" == "cancelled" ]; then
              echo "was_cancelled=true" >> $GITHUB_OUTPUT
            else
              echo "was_cancelled=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "job_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Failure Comment
        if: steps.check_status.outputs.job_failed == 'true' && steps.check_status.outputs.was_cancelled == 'false'
        run: |
          message="## E2E Rust Apps Failed

          One or more jobs in this workflow (the merobox scenario matrix,
          auth-seam, projection-coverage, key-recovery-coverage) failed.

          Please check the workflow logs for more details."

          jq -n \
            --arg pr '${{ github.event.number }}' \
            --arg tag e2e-rust-apps-report \
            --arg mode recreate \
            --arg message "$message" \
            '{pr: $pr, tag: $tag, mode: $mode, message: $message}' > payload.json

      - name: Upload Comment
        if: steps.check_status.outputs.job_failed == 'true' && steps.check_status.outputs.was_cancelled == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: pr-comment-payload-rust-apps
          path: payload.json

      - name: Fail if main job failed or was cancelled
        if: steps.check_status.outputs.job_failed == 'true'
        run: |
          if [ "${{ steps.check_status.outputs.was_cancelled }}" == "true" ]; then
            echo "Workflow was cancelled"
          else
            echo "Workflow failed"
          fi
          exit 1
