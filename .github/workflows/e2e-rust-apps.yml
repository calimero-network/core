name: E2E - Rust Apps

# Runs the merobox scenario matrix below against a locally-built merod image.
# Self-contained: doesn't depend on release.yml.

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "apps/scaffolding-e2e/**"
      - "apps/scaffolding-e2e-multi/**"
      - "apps/xcall-example/**"
      - "apps/kv-store-with-shared-storage/**"
      - "apps/components-demo/**"
      - "apps/blobs/**"
      - "apps/abi_conformance/**"
      - "apps/collaborative-editor/**"
      - "apps/fugue-collab/**"
      - "apps/rich-collab/**"
      - "apps/kv-store-init/**"
      - "apps/kv-store-with-handlers/**"
      - "apps/kv-store-with-user-and-frozen-storage/**"
      - "apps/kv-store/**"
      - "apps/nested-crdt-test/**"
      - "apps/private_data/**"
      - "apps/team-metrics-custom/**"
      - "apps/team-metrics-macro/**"
      - ".github/workflows/e2e-rust-apps.yml"
      - ".github/workflows/e2e-rust-apps-release.yml"
      - "scripts/lint-e2e-bundle-coverage.py"
      - ".github/workflows/build-merod-image.yml"
      - ".github/actions/setup-merobox/**"
      - ".github/actions/build-local-merod/**"

  pull_request:
    branches: [master]
    paths:
      - "crates/**"
      - "apps/scaffolding-e2e/**"
      - "apps/scaffolding-e2e-multi/**"
      - "apps/xcall-example/**"
      - "apps/kv-store-with-shared-storage/**"
      - "apps/components-demo/**"
      - "apps/blobs/**"
      - "apps/abi_conformance/**"
      - "apps/collaborative-editor/**"
      - "apps/fugue-collab/**"
      - "apps/rich-collab/**"
      - "apps/kv-store-init/**"
      - "apps/kv-store-with-handlers/**"
      - "apps/kv-store-with-user-and-frozen-storage/**"
      - "apps/kv-store/**"
      - "apps/nested-crdt-test/**"
      - "apps/private_data/**"
      - "apps/team-metrics-custom/**"
      - "apps/team-metrics-macro/**"
      - ".github/workflows/e2e-rust-apps.yml"
      - ".github/workflows/e2e-rust-apps-release.yml"
      - "scripts/lint-e2e-bundle-coverage.py"
      - ".github/workflows/build-merod-image.yml"
      - ".github/actions/setup-merobox/**"
      - ".github/actions/build-local-merod/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  # ── Build merod Docker image (heaviest step) ──
  # Shared verbatim with app-migration-e2e.yml so both suites ride the same warm cache.
  build-image:
    name: Build Image
    uses: ./.github/workflows/build-merod-image.yml
    with:
      # blob-presence-tee-serves boots merod run --mock-tee, which needs the mock-attestation
      # feature; a separate image keeps the rest of the matrix on a release-like feature set.
      with-mock-tee-image: true

  # ── Scenario convergence lint ──
  # Ratcheted against scripts/e2e-convergence-baseline.txt: only a NEW finding fails.
  convergence-lint:
    name: Scenario convergence lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Lint merobox scenarios for unbarriered convergence reads
        run: python3 scripts/lint-e2e-convergence.py
      - name: Lint merobox scenarios for unnamed multi-service bundles
        run: python3 scripts/lint-e2e-bundle-shape.py
      - name: Lint e2e workflows for unbuilt scenario bundles
        run: python3 scripts/lint-e2e-bundle-coverage.py
      # A log assertion couples a scenario to a string a program prints, and a
      # rename breaks that coupling SILENTLY: an `absent` assertion then passes
      # vacuously forever, and a `present` one fails far from the rename, in a
      # scenario nobody associates with logging. Neither is caught by running
      # the suite, which is why it is a lint rather than a test.
      - name: Lint merobox log assertions for patterns that can never match
        run: python3 scripts/lint-e2e-log-assertions.py

  # ── Auth seam: client-token e2e over real HTTP ──
  # Binary mode runs the PR's own merod; docker mode's --auth-service would boot a prebuilt image.
  auth-seam:
    name: Auth seam (client-token e2e)
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: merod-image
          path: /tmp

      - name: Extract merod binary from image
        run: |
          zstd -d /tmp/merod-local.tar.zst --stdout | docker load
          id=$(docker create merod:local)
          docker cp "$id:/usr/local/bin/merod" ./merod
          docker rm "$id"
          chmod +x ./merod

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      - name: Run auth-seam e2e (merobox, embedded auth)
        env:
          # These vars both provision the node's admin account at init and tell
          # scripts/e2e-auth-seam.sh which credentials to log in with. CI-only test values.
          MERO_AUTH_ADMIN_USER: dev
          MERO_AUTH_ADMIN_PASSWORD: dev-password
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
          CALIMERO_REGISTRY_MODE: dht
        run: |
          merobox bootstrap run workflows/auth-seam.yml \
            --no-docker --binary-path ./merod --auth-mode embedded

      - name: Logs on failure
        if: failure()
        run: cat data/auth-seam-1/logs/*.log || true

      - name: Stop nodes
        if: always()
        run: merobox stop --no-docker --all || true

  # Same declarative workflow as auth-seam, on Windows.
  # merod is built here, not extracted from the Docker image, since there is no Docker on this runner.
  windows-auth-seam:
    name: Windows e2e (auth seam, binary mode)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-e2e
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # librocksdb-sys needs bindgen-runtime; aws-lc-sys needs NASM for its x86_64 primitives.
      # Same pair the release build and windows-node-smoke need.
      - name: Point bindgen at the image's LLVM
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Build merod
        run: cargo build -p merod

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install merobox
        uses: ./.github/actions/setup-merobox

      - name: Run auth-seam e2e (merobox, embedded auth)
        shell: bash
        env:
          # Same as the Linux job above: minted at merod init, and the script step inherits
          # them to log in with. CI-only values for an ephemeral localhost node.
          MERO_AUTH_ADMIN_USER: dev
          MERO_AUTH_ADMIN_PASSWORD: dev-password
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
        run: |
          merobox bootstrap run workflows/auth-seam.yml \
            --no-docker --binary-path target/debug/merod.exe --auth-mode embedded

      - name: Logs on failure
        if: failure()
        shell: bash
        run: cat data/auth-seam-1/logs/*.log || true

      - name: Stop nodes
        if: always()
        shell: bash
        run: merobox stop --no-docker --all || true

  # Proves Windows nodes discover and converge (windows-auth-seam only proves one node serves HTTP).
  # Uses the .mpk from build-apps: wasm is architecture-independent, sidestepping wasm-opt on windows-msvc.
  windows-node-workflow:
    name: Windows e2e (3-node sync, binary mode)
    needs: [build-apps]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-e2e
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Point bindgen at the image's LLVM
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Build merod
        run: cargo build -p merod

      - name: Download the app bundles
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-bundles
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install merobox
        uses: ./.github/actions/setup-merobox

      # cd into the app dir since the scenario's path resolves against CWD, not the YAML's own location.
      # Server and workflow share a step: a background process isn't guaranteed to outlive an earlier step.
      - name: Run the 3-node workflow (merobox, binary mode)
        shell: bash
        run: |
          ls -la dist/
          FIXTURE_REGISTRY_STAGE_ONLY=1 ./scripts/e2e-fixture-registry.sh dist

          python -m http.server 8080 --bind 127.0.0.1 \
            --directory fixture-registry >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Fail here, loudly, rather than let every node fall back to a
          # bytecode-not-found error that reads like a sync bug.
          for _ in $(seq 1 30); do
            curl -sfo /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          curl -sfo /dev/null http://127.0.0.1:8080/ \
            || { echo "fixture registry never came up" >&2; exit 1; }

          export CALIMERO_REGISTRY_MODE=http
          export CALIMERO_REGISTRY_URL=http://127.0.0.1:8080/

          MEROD="$GITHUB_WORKSPACE/target/debug/merod.exe"
          cd apps/kv-store
          merobox bootstrap run workflows/workflow-example.yml \
            --no-docker --binary-path "$MEROD"

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          for d in apps/kv-store/data/*/logs; do
            echo "=== $d ==="
            cat "$d"/*.log || true
          done

      - name: Stop nodes
        if: always()
        shell: bash
        run: merobox stop --no-docker --all || true

  # ── Build WASM apps (runs in parallel with image build) ──
  build-apps:
    name: Build Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: e2e-wasm-apps
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build scaffolding-e2e app
        run: cargo mero build --manifest-path apps/scaffolding-e2e/Cargo.toml

      - name: Build scaffolding-e2e bundle
        run: (cd apps/scaffolding-e2e && cargo mero bundle --dev --no-icon)

      # apps/scaffolding-e2e-multi declares services backed by scaffolding-e2e's
      # wasm and builds none of its own, so it only needs a bundle step.
      - name: Build scaffolding-e2e-multi bundle
        run: (cd apps/scaffolding-e2e-multi && cargo mero bundle --dev --no-icon)

      - name: Build xcall-example app
        run: cargo mero build --manifest-path apps/xcall-example/Cargo.toml

      - name: Build xcall-example bundle
        run: (cd apps/xcall-example && cargo mero bundle --dev --no-icon)

      - name: Build kv-store-with-shared-storage app
        run: cargo mero build --manifest-path apps/kv-store-with-shared-storage/Cargo.toml

      - name: Build kv-store-with-shared-storage bundle
        run: (cd apps/kv-store-with-shared-storage && cargo mero bundle --dev --no-icon)

      - name: Build components-demo app
        run: cargo mero build --manifest-path apps/components-demo/Cargo.toml

      - name: Build components-demo bundle
        run: (cd apps/components-demo && cargo mero bundle --dev --no-icon)

      - name: Build blobs app
        run: cargo mero build --manifest-path apps/blobs/Cargo.toml

      - name: Build blobs bundle
        run: (cd apps/blobs && cargo mero bundle --dev --no-icon)

      - name: Build abi_conformance app
        run: cargo mero build --manifest-path apps/abi_conformance/Cargo.toml

      - name: Build abi_conformance bundle
        run: (cd apps/abi_conformance && cargo mero bundle --dev --no-icon)

      - name: Build collaborative-editor app
        run: cargo mero build --manifest-path apps/collaborative-editor/Cargo.toml

      - name: Build collaborative-editor bundle
        run: (cd apps/collaborative-editor && cargo mero bundle --dev --no-icon)

      - name: Build fugue-collab app
        run: cargo mero build --manifest-path apps/fugue-collab/Cargo.toml

      - name: Build fugue-collab bundle
        run: (cd apps/fugue-collab && cargo mero bundle --dev --no-icon)

      - name: Build rich-collab app
        run: cargo mero build --manifest-path apps/rich-collab/Cargo.toml

      - name: Build rich-collab bundle
        run: (cd apps/rich-collab && cargo mero bundle --dev --no-icon)

      - name: Build kv-store-init app
        run: cargo mero build --manifest-path apps/kv-store-init/Cargo.toml

      - name: Build kv-store-init bundle
        run: (cd apps/kv-store-init && cargo mero bundle --dev --no-icon)

      - name: Build kv-store-with-handlers app
        run: cargo mero build --manifest-path apps/kv-store-with-handlers/Cargo.toml

      - name: Build kv-store-with-handlers bundle
        run: (cd apps/kv-store-with-handlers && cargo mero bundle --dev --no-icon)

      - name: Build kv-store-with-user-and-frozen-storage app
        run: cargo mero build --manifest-path apps/kv-store-with-user-and-frozen-storage/Cargo.toml

      - name: Build kv-store-with-user-and-frozen-storage bundle
        run: (cd apps/kv-store-with-user-and-frozen-storage && cargo mero bundle --dev --no-icon)

      - name: Build kv-store app
        run: cargo mero build --manifest-path apps/kv-store/Cargo.toml

      - name: Build nested-crdt-test app
        run: cargo mero build --manifest-path apps/nested-crdt-test/Cargo.toml

      - name: Build nested-crdt-test bundle
        run: (cd apps/nested-crdt-test && cargo mero bundle --dev --no-icon)

      - name: Build private_data app
        run: cargo mero build --manifest-path apps/private_data/Cargo.toml

      - name: Build private_data bundle
        run: (cd apps/private_data && cargo mero bundle --dev --no-icon)

      - name: Build team-metrics-custom app
        run: cargo mero build --manifest-path apps/team-metrics-custom/Cargo.toml

      - name: Build team-metrics-custom bundle
        run: (cd apps/team-metrics-custom && cargo mero bundle --dev --no-icon)

      - name: Build team-metrics-macro app
        run: cargo mero build --manifest-path apps/team-metrics-macro/Cargo.toml

      - name: Build team-metrics-macro bundle
        run: (cd apps/team-metrics-macro && cargo mero bundle --dev --no-icon)

      - name: Build kv-store bundle
        run: (cd apps/kv-store && cargo mero bundle --dev --no-icon)

      - name: Verify every built app wasm embeds the ABI (core#3287)
        run: ./scripts/check-embedded-abi.sh

      - name: Upload app artifacts
        uses: actions/upload-artifact@v7
        with:
          name: e2e-apps
          path: |
            apps/scaffolding-e2e/res/*.wasm
            apps/scaffolding-e2e/res/abi.json
            apps/scaffolding-e2e/res/state-schema.json
            apps/xcall-example/res/*.wasm
            apps/xcall-example/res/abi.json
            apps/kv-store-with-shared-storage/res/*.wasm
            apps/kv-store-with-shared-storage/res/abi.json
            apps/kv-store-with-shared-storage/res/state-schema.json
            apps/components-demo/res/*.wasm
            apps/components-demo/res/abi.json
            apps/components-demo/res/state-schema.json
            apps/blobs/res/*.wasm
            apps/blobs/res/abi.json
            apps/blobs/res/state-schema.json
            apps/abi_conformance/res/*
            apps/collaborative-editor/res/*
            apps/fugue-collab/res/*
            apps/rich-collab/res/*
            apps/kv-store-init/res/*
            apps/kv-store-with-handlers/res/*
            apps/kv-store-with-user-and-frozen-storage/res/*
            apps/kv-store/res/*
            apps/nested-crdt-test/res/*
            apps/private_data/res/*
            apps/team-metrics-custom/res/*
            apps/team-metrics-macro/res/*
          retention-days: 1

      - name: Upload app bundles
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-bundles
          path: dist/*.mpk
          retention-days: 1

  # ── Test phase: run each workflow in parallel ──
  test:
    name: Test (${{ matrix.workflow }})
    needs: [build-image, build-apps]
    runs-on: ubuntu-24.04-8cpu
    strategy:
      fail-fast: false
      matrix:
        # `image: merod:local-dht` marks peer-route scenarios; `registry_fetch: "false"` marks ones
        # that fetch no bytecode, since a node needs it only to run a context, not to join a group.
        include:
          - workflow: scaffolding-e2e
            file: workflows/e2e.yml
            app: scaffolding-e2e
          - workflow: frozen-rga-convergence
            file: workflows/frozen-rga-convergence.yml
            app: scaffolding-e2e
          # The only scenario where a delta's author is not its signer - the sole
          # real-node coverage of the delegated envelope and warrant nonce ledger.
          - workflow: delegated-authorship
            file: workflows/delegated-authorship.yml
            app: scaffolding-e2e
          # Password-free session coverage: a device holding only a key logs in and reads (delegated-
          # authorship above covers the write, but via username/password). Turns on account_proof.
          - workflow: delegated-session
            file: workflows/delegated-session.yml
            app: scaffolding-e2e
          # The other half of the architecture: no session and no token at all,
          # just a signature on each request. Verified by unit tests and by a
          # byte fixture three implementations agree on, but until this nothing
          # had ever presented one to a running node.
          - workflow: delegated-proof
            file: workflows/delegated-proof.yml
            app: scaffolding-e2e
          # The posture a hosted relay actually runs: delegated execution served
          # with NO node credential. Nothing covered it - `--public-intents`
          # appeared in no scenario, so the flag deciding whether a relay is
          # reachable by the clients it exists for had only production as
          # evidence. Two nodes identical but for the flag, so a 200 has a 401
          # beside it and the flag is provably what opened the route.
          - workflow: public-intents
            file: workflows/public-intents.yml
            app: scaffolding-e2e
          # A node holding no account root joins and writes under a certificate signed elsewhere - the
          # cold-storage posture the account/device split exists for. Needs merobox >= 0.6.67.
          - workflow: offline-account-root
            file: workflows/offline-account-root.yml
            app: scaffolding-e2e
          # After two nodes concurrently add distinct SortedSet elements, membership converges but
          # ORDERED reads (iter) may not; the ordered-read assertion is the discriminator.
          - workflow: sorted-set-concurrent-convergence
            file: workflows/sorted-set-concurrent-convergence.yml
            app: scaffolding-e2e
          - workflow: groups
            file: workflows/groups.yml
            app: scaffolding-e2e
          - workflow: group-join-then-list-from-joiner
            file: workflows/group-join-then-list-from-joiner.yml
            app: scaffolding-e2e
          - workflow: group-join-mesh-not-ready
            file: workflows/group-join-mesh-not-ready.yml
            app: scaffolding-e2e
          # Asserts a peer discovered over mDNS reaches the KAD routing table; without it the fleet
          # gossips fine but every DHT query returns closest_peers: [].
          - workflow: kad-routing-from-identify
            file: workflows/kad-routing-from-identify.yml
            app: scaffolding-e2e
          - workflow: group-3node
            file: workflows/group-3node.yml
            app: scaffolding-e2e
          - workflow: group-context-isolation
            file: workflows/group-context-isolation.yml
            app: scaffolding-e2e
          - workflow: group-late-joiner
            file: workflows/group-late-joiner.yml
            app: scaffolding-e2e
            image: merod:local-dht
          - workflow: group-governance-late-joiner
            file: workflows/group-governance-late-joiner.yml
            app: scaffolding-e2e
          - workflow: group-governance-peer-down
            file: workflows/group-governance-peer-down.yml
            app: scaffolding-e2e
          - workflow: group-subgroup
            file: workflows/group-subgroup.yml
            app: scaffolding-e2e
          - workflow: group-subgroup-cold-sync
            file: workflows/group-subgroup-cold-sync.yml
            app: scaffolding-e2e
          - workflow: group-subgroup-queued-deltas
            file: workflows/group-subgroup-queued-deltas.yml
            app: scaffolding-e2e
          - workflow: group-membership
            file: workflows/group-membership.yml
            app: scaffolding-e2e
          - workflow: account-device-revoke-lockout
            file: workflows/account-device-revoke-lockout.yml
            app: scaffolding-e2e
          - workflow: account-device-reset-offline
            file: workflows/account-device-reset-offline.yml
            app: scaffolding-e2e
          - workflow: account-facts-cross-namespace
            file: workflows/account-facts-cross-namespace.yml
            app: scaffolding-e2e
            image: merod:local-dht
          # Account-level pairing: only real nodes can say whether the link
          # lands where the application scope aimed it.
          - workflow: account-pairing-application-scope
            file: workflows/account-pairing-application-scope.yml
            app: scaffolding-e2e
          - workflow: account-device-scope-replace
            file: workflows/account-device-scope-replace.yml
            app: scaffolding-e2e
          - workflow: account-pairing-missed-publish
            file: workflows/account-pairing-missed-publish.yml
            app: scaffolding-e2e
            registry_fetch: "false"
          - workflow: account-paired-device-founds-namespace
            file: workflows/account-paired-device-founds-namespace.yml
            app: scaffolding-e2e
            registry_fetch: "false"
          - workflow: account-revoked-device-repairs
            file: workflows/account-revoked-device-repairs.yml
            app: scaffolding-e2e
            registry_fetch: "false"
          - workflow: account-namespace-left-unfollows
            file: workflows/account-namespace-left-unfollows.yml
            app: scaffolding-e2e
            registry_fetch: "false"
          - workflow: account-registry-replicates
            file: workflows/account-registry-replicates.yml
            app: scaffolding-e2e
            registry_fetch: "false"
          - workflow: account-namespace-devices-follow
            file: workflows/account-namespace-devices-follow.yml
            app: scaffolding-e2e
            registry_fetch: "false"
          - workflow: account-namespace-learned-after-pairing
            file: workflows/account-namespace-learned-after-pairing.yml
            app: scaffolding-e2e
            registry_fetch: "false"
          - workflow: account-root-backup-restore
            file: workflows/account-root-backup-restore.yml
