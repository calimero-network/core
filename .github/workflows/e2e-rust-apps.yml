name: E2E - Rust Apps

# Tests scaffolding-e2e and xcall-example apps using locally-built Docker image.
# Parallel build: merod image + WASM apps build concurrently, then all test
# workflows run in parallel via matrix.
# Self-contained: doesn't depend on release.yml

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "apps/scaffolding-e2e/**"
      - "apps/scaffolding-e2e-multi/**"
      - "apps/xcall-example/**"
      - "apps/kv-store-with-shared-storage/**"
      - "apps/components-demo/**"
      - "apps/blobs/**"
      - "apps/abi_conformance/**"
      - "apps/collaborative-editor/**"
      - "apps/kv-store-init/**"
      - "apps/kv-store-with-handlers/**"
      - "apps/kv-store-with-user-and-frozen-storage/**"
      - "apps/kv-store/**"
      - "apps/nested-crdt-test/**"
      - "apps/private_data/**"
      - "apps/team-metrics-custom/**"
      - "apps/team-metrics-macro/**"
      - ".github/workflows/e2e-rust-apps.yml"
      - ".github/workflows/e2e-rust-apps-release.yml"
      - "scripts/lint-e2e-bundle-coverage.py"
      - ".github/workflows/build-merod-image.yml"
      - ".github/actions/setup-merobox/**"
      - ".github/actions/build-local-merod/**"

  pull_request:
    branches: [master]
    paths:
      - "crates/**"
      - "apps/scaffolding-e2e/**"
      - "apps/scaffolding-e2e-multi/**"
      - "apps/xcall-example/**"
      - "apps/kv-store-with-shared-storage/**"
      - "apps/components-demo/**"
      - "apps/blobs/**"
      - "apps/abi_conformance/**"
      - "apps/collaborative-editor/**"
      - "apps/kv-store-init/**"
      - "apps/kv-store-with-handlers/**"
      - "apps/kv-store-with-user-and-frozen-storage/**"
      - "apps/kv-store/**"
      - "apps/nested-crdt-test/**"
      - "apps/private_data/**"
      - "apps/team-metrics-custom/**"
      - "apps/team-metrics-macro/**"
      - ".github/workflows/e2e-rust-apps.yml"
      - ".github/workflows/e2e-rust-apps-release.yml"
      - "scripts/lint-e2e-bundle-coverage.py"
      - ".github/workflows/build-merod-image.yml"
      - ".github/actions/setup-merobox/**"
      - ".github/actions/build-local-merod/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  # ── Build merod Docker image (heaviest step) ──
  # Reusable build-merod-image.yml, shared verbatim with app-migration-e2e.yml
  # so the identical merod build lives in one place and both suites ride the
  # same warm `e2e-rust-apps` cache. Uploads the `merod-image` artifact
  # (zstd tarball) consumed by the jobs below.
  build-image:
    name: Build Image
    uses: ./.github/workflows/build-merod-image.yml

  # ── Scenario convergence lint ──
  # Static, no nodes, seconds not minutes — so it runs ahead of everything that
  # boots docker and fails fast on the cheapest class of e2e bug there is.
  #
  # A scenario that reads another node's state without a barrier establishing the
  # state arrived is not merely flaky; it fails with a symptom that names the wrong
  # thing. Three did in one afternoon: a null where a schema version was expected,
  # the literal string "undefined" reaching a base58 parser, and a key-less join.
  # Each cost an investigation into whichever feature the PR happened to touch
  # before the timing was even suspected.
  #
  # Ratcheted against scripts/e2e-convergence-baseline.txt: pre-existing findings
  # are an accepted backlog and only a NEW one fails.
  convergence-lint:
    name: Scenario convergence lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Lint merobox scenarios for unbarriered convergence reads
        run: python3 scripts/lint-e2e-convergence.py
      - name: Lint merobox scenarios for unnamed multi-service bundles
        run: python3 scripts/lint-e2e-bundle-shape.py
      - name: Lint e2e workflows for unbuilt scenario bundles
        run: python3 scripts/lint-e2e-bundle-coverage.py

  # ── Auth seam: client-token e2e over real HTTP ──
  # Proves a client token minted the way the auth frontend mints it can call
  # the routes the SDK uses (the 0.11.0-rc.9 login-loop outage shape).
  # Companion in-process pin: crates/auth/tests/client_token_contract.rs
  #
  # Declarative merobox workflow (workflows/auth-seam.yml) in binary mode
  # with the PR's own merod: `--auth-mode embedded` is binary-mode only in
  # merobox, and its docker-mode `--auth-service` boots a prebuilt
  # mero-auth image — the wrong artifact for a PR gate. The PR-built merod
  # is extracted from the already-built image; the seam assertions live in
  # scripts/e2e-auth-seam.sh, invoked as the workflow's script step.
  auth-seam:
    name: Auth seam (client-token e2e)
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: merod-image
          path: /tmp

      - name: Extract merod binary from image
        run: |
          zstd -d /tmp/merod-local.tar.zst --stdout | docker load
          id=$(docker create merod:local)
          docker cp "$id:/usr/local/bin/merod" ./merod
          docker rm "$id"
          chmod +x ./merod

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      - name: Run auth-seam e2e (merobox, embedded auth)
        env:
          # Admin credentials minted AT INIT (the login path never mints
          # keys; there is no first-login bootstrap secret anymore).
          # Binary-mode merobox spawns `merod init`/`run` with os.environ
          # inherited, and script steps (target: local) inherit it too — so
          # this single export both provisions the node's admin account AND
          # tells scripts/e2e-auth-seam.sh which credentials log in.
          # CI-only test values for an ephemeral localhost node; the
          # password is consumed at init — nothing lands in config.toml.
          MERO_AUTH_ADMIN_USER: dev
          MERO_AUTH_ADMIN_PASSWORD: dev-password
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
          CALIMERO_REGISTRY_MODE: dht
        run: |
          merobox bootstrap run workflows/auth-seam.yml \
            --no-docker --binary-path ./merod --auth-mode embedded

      - name: Logs on failure
        if: failure()
        run: cat data/auth-seam-1/logs/*.log || true

      - name: Stop nodes
        if: always()
        run: merobox stop --no-docker --all || true

  # The same declarative merobox workflow as `auth-seam` above, on Windows.
  #
  # Everything Windows-related here has so far been build-time, or a single node
  # started and stopped by `windows-node-smoke`. This is the first time a real
  # multi-step workflow runs there: node lifecycle, a root login, and the client
  # token seam asserted over real HTTP against a live merod.
  #
  # Two things differ from the Linux job, both forced:
  #   - merod is built here rather than extracted from the Docker image. There is
  #     no Docker on this runner, and a Linux container would test Linux.
  #   - merobox comes from pip, not `setup-merobox`. That action installs the
  #     release binary, which is published for darwin and linux only.
  #
  # Not gated on `build-image`, unlike auth-seam: it shares nothing with it.
  windows-auth-seam:
    name: Windows e2e (auth seam, binary mode)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-e2e

      # librocksdb-sys is pulled with `bindgen-runtime`, and aws-lc-sys
      # assembles its x86_64 primitives with NASM. Same pair the release build
      # and `windows-node-smoke` need.
      - name: Point bindgen at the image's LLVM
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Build merod
        run: cargo build -p merod

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned exactly, like `setup-merobox` does: a floor would let a later
      # release change what this gate means without anyone choosing it.
      #
      # Each of these releases fixed something that stopped a node running here:
      # 0.6.73 native Windows process management (teardown called
      # `signal.SIGKILL`, which does not exist there), 0.6.74 script steps run
      # with a literal `/bin/sh`, and 0.6.75 a crash printing merobox's own
      # emoji banner to a cp1252 stdout. The last of those is why this step no
      # longer sets `PYTHONIOENCODING`.
      - name: Install merobox
        run: pip install merobox==0.6.75

      - name: Run auth-seam e2e (merobox, embedded auth)
        shell: bash
        env:
          # Same values and same reasoning as the Linux job above: the admin
          # root key is minted at `merod init` from these, and the script step
          # inherits them to log in with. CI-only values for an ephemeral
          # localhost node.
          MERO_AUTH_ADMIN_USER: dev
          MERO_AUTH_ADMIN_PASSWORD: dev-password
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
        run: |
          merobox bootstrap run workflows/auth-seam.yml \
            --no-docker --binary-path target/debug/merod.exe --auth-mode embedded

      - name: Logs on failure
        if: failure()
        shell: bash
        run: cat data/auth-seam-1/logs/*.log || true

      - name: Stop nodes
        if: always()
        shell: bash
        run: merobox stop --no-docker --all || true

  # A real node workflow on Windows: three nodes, two invitations, two joins,
  # a `wait_for_sync`, then a call whose result must have propagated. Where
  # `windows-auth-seam` proves one node serves HTTP, this proves several of them
  # find each other and agree — the part with no unix result to borrow from,
  # since discovery and sync are exactly where the platform differs.
  #
  # The bundle comes from `build-apps` rather than being built here. A `.mpk` is
  # wasm and architecture-independent, so building it once on Linux costs
  # nothing and avoids asking whether `cargo mero`'s wasm-opt compiles on
  # windows-msvc — a question this lane does not need to answer.
  windows-node-workflow:
    name: Windows e2e (3-node sync, binary mode)
    needs: [build-apps]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: windows-e2e

      - name: Point bindgen at the image's LLVM
        shell: bash
        run: printf 'LIBCLANG_PATH=%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      - name: Install NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Build merod
        run: cargo build -p merod

      - name: Download the app bundles
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-bundles
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install merobox
        run: pip install merobox==0.6.75

      # `cd` into the app first, exactly as the Linux matrix above does. The
      # scenario's `path: ../../dist/...` is resolved against the CWD, not
      # against the YAML's own location, so running it from the repo root
      # climbs two levels OUT of the checkout. The binary is passed absolute
      # for the same reason.
      #
      # The joining nodes install no bundle of their own: they learn a bytecode
      # id from the context and must fetch it. Without a configured source that
      # fetch fails and the first execute after a join dies on "bytecode blob
      # not found in blobstore" — so this lane needs the same fixture registry
      # the Linux lanes get from `e2e-fixture-registry.sh`. Only the staging
      # half of that script is reused here (`STAGE_ONLY`); its serving half
      # runs nginx in Docker and addresses it by the docker0 gateway, neither
      # of which exists in binary mode. These nodes are processes on this
      # runner, so plain loopback reaches them and `python -m http.server`
      # is enough. merod reads the two env vars directly (cli/run.rs), and
      # merobox hands its own environment to each node it spawns, which is
      # what makes the Docker image-retagging step unnecessary here.
      #
      # Server and workflow share one step deliberately: a background process
      # started in an earlier step is not guaranteed to outlive it.
      - name: Run the 3-node workflow (merobox, binary mode)
        shell: bash
        run: |
          ls -la dist/
          FIXTURE_REGISTRY_STAGE_ONLY=1 ./scripts/e2e-fixture-registry.sh dist

          python -m http.server 8080 --bind 127.0.0.1 \
            --directory fixture-registry >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          # Fail here, loudly, rather than let every node fall back to a
          # bytecode-not-found error that reads like a sync bug.
          for _ in $(seq 1 30); do
            curl -sfo /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          curl -sfo /dev/null http://127.0.0.1:8080/ \
            || { echo "fixture registry never came up" >&2; exit 1; }

          export CALIMERO_REGISTRY_MODE=http
          export CALIMERO_REGISTRY_URL=http://127.0.0.1:8080/

          MEROD="$GITHUB_WORKSPACE/target/debug/merod.exe"
          cd apps/kv-store
          merobox bootstrap run workflows/workflow-example.yml \
            --no-docker --binary-path "$MEROD"

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          for d in apps/kv-store/data/*/logs; do
            echo "=== $d ==="
            cat "$d"/*.log || true
          done

      - name: Stop nodes
        if: always()
        shell: bash
        run: merobox stop --no-docker --all || true

  # ── Build WASM apps (runs in parallel with image build) ──
  build-apps:
    name: Build Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          shared-key: e2e-wasm-apps
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Setup cargo mero
        uses: ./.github/actions/setup-cargo-mero

      - name: Build scaffolding-e2e app
        run: cargo mero build --manifest-path apps/scaffolding-e2e/Cargo.toml

      - name: Build scaffolding-e2e bundle
        run: (cd apps/scaffolding-e2e && cargo mero bundle --dev --no-icon)

      # apps/scaffolding-e2e-multi declares services backed by scaffolding-e2e's
      # wasm and builds none of its own, so it only needs a bundle step.
      - name: Build scaffolding-e2e-multi bundle
        run: (cd apps/scaffolding-e2e-multi && cargo mero bundle --dev --no-icon)

      - name: Build xcall-example app
        run: cargo mero build --manifest-path apps/xcall-example/Cargo.toml

      - name: Build xcall-example bundle
        run: (cd apps/xcall-example && cargo mero bundle --dev --no-icon)

      - name: Build kv-store-with-shared-storage app
        run: cargo mero build --manifest-path apps/kv-store-with-shared-storage/Cargo.toml

      - name: Build kv-store-with-shared-storage bundle
        run: (cd apps/kv-store-with-shared-storage && cargo mero bundle --dev --no-icon)

      - name: Build components-demo app
        run: cargo mero build --manifest-path apps/components-demo/Cargo.toml

      - name: Build components-demo bundle
        run: (cd apps/components-demo && cargo mero bundle --dev --no-icon)

      - name: Build blobs app
        run: cargo mero build --manifest-path apps/blobs/Cargo.toml

      - name: Build blobs bundle
        run: (cd apps/blobs && cargo mero bundle --dev --no-icon)

      - name: Build abi_conformance app
        run: cargo mero build --manifest-path apps/abi_conformance/Cargo.toml

      - name: Build abi_conformance bundle
        run: (cd apps/abi_conformance && cargo mero bundle --dev --no-icon)

      - name: Build collaborative-editor app
        run: cargo mero build --manifest-path apps/collaborative-editor/Cargo.toml

      - name: Build collaborative-editor bundle
        run: (cd apps/collaborative-editor && cargo mero bundle --dev --no-icon)

      - name: Build kv-store-init app
        run: cargo mero build --manifest-path apps/kv-store-init/Cargo.toml

      - name: Build kv-store-init bundle
        run: (cd apps/kv-store-init && cargo mero bundle --dev --no-icon)

      - name: Build kv-store-with-handlers app
        run: cargo mero build --manifest-path apps/kv-store-with-handlers/Cargo.toml

      - name: Build kv-store-with-handlers bundle
        run: (cd apps/kv-store-with-handlers && cargo mero bundle --dev --no-icon)

      - name: Build kv-store-with-user-and-frozen-storage app
        run: cargo mero build --manifest-path apps/kv-store-with-user-and-frozen-storage/Cargo.toml

      - name: Build kv-store-with-user-and-frozen-storage bundle
        run: (cd apps/kv-store-with-user-and-frozen-storage && cargo mero bundle --dev --no-icon)

      - name: Build kv-store app
        run: cargo mero build --manifest-path apps/kv-store/Cargo.toml

      - name: Build nested-crdt-test app
        run: cargo mero build --manifest-path apps/nested-crdt-test/Cargo.toml

      - name: Build nested-crdt-test bundle
        run: (cd apps/nested-crdt-test && cargo mero bundle --dev --no-icon)

      - name: Build private_data app
        run: cargo mero build --manifest-path apps/private_data/Cargo.toml

      - name: Build private_data bundle
        run: (cd apps/private_data && cargo mero bundle --dev --no-icon)

      - name: Build team-metrics-custom app
        run: cargo mero build --manifest-path apps/team-metrics-custom/Cargo.toml

      - name: Build team-metrics-custom bundle
        run: (cd apps/team-metrics-custom && cargo mero bundle --dev --no-icon)

      - name: Build team-metrics-macro app
        run: cargo mero build --manifest-path apps/team-metrics-macro/Cargo.toml

      - name: Build team-metrics-macro bundle
        run: (cd apps/team-metrics-macro && cargo mero bundle --dev --no-icon)

      - name: Build kv-store bundle
        run: (cd apps/kv-store && cargo mero bundle --dev --no-icon)

      - name: Verify every built app wasm embeds the ABI (core#3287)
        run: ./scripts/check-embedded-abi.sh

      - name: Upload app artifacts
        uses: actions/upload-artifact@v7
        with:
          name: e2e-apps
          path: |
            apps/scaffolding-e2e/res/*.wasm
            apps/scaffolding-e2e/res/abi.json
            apps/scaffolding-e2e/res/state-schema.json
            apps/xcall-example/res/*.wasm
            apps/xcall-example/res/abi.json
            apps/kv-store-with-shared-storage/res/*.wasm
            apps/kv-store-with-shared-storage/res/abi.json
            apps/kv-store-with-shared-storage/res/state-schema.json
            apps/components-demo/res/*.wasm
            apps/components-demo/res/abi.json
            apps/components-demo/res/state-schema.json
            apps/blobs/res/*.wasm
            apps/blobs/res/abi.json
            apps/blobs/res/state-schema.json
            apps/abi_conformance/res/*
            apps/collaborative-editor/res/*
            apps/kv-store-init/res/*
            apps/kv-store-with-handlers/res/*
            apps/kv-store-with-user-and-frozen-storage/res/*
            apps/kv-store/res/*
            apps/nested-crdt-test/res/*
            apps/private_data/res/*
            apps/team-metrics-custom/res/*
            apps/team-metrics-macro/res/*
          retention-days: 1

      - name: Upload app bundles
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-bundles
          path: dist/*.mpk
          retention-days: 1

  # ── Test phase: run each workflow in parallel ──
  test:
    name: Test (${{ matrix.workflow }})
    needs: [build-image, build-apps]
    runs-on: ubuntu-24.04-8cpu
    strategy:
      fail-fast: false
      matrix:
        # A node needs bytecode only to run a context, not to join a group. So
        # `image: merod:local-dht` is for the three scenarios that ARE the peer
        # route's coverage; `registry_fetch: "false"` is for the ones that never
        # run a context at all. Everything else fetches, on http.
        include:
          - workflow: scaffolding-e2e
            file: workflows/e2e.yml
            app: scaffolding-e2e
          - workflow: frozen-rga-convergence
            file: workflows/frozen-rga-convergence.yml
            app: scaffolding-e2e
          # The only scenario where a delta's author is not its signer - the sole
          # real-node coverage of the delegated envelope and warrant nonce ledger.
          - workflow: delegated-authorship
            file: workflows/delegated-authorship.yml
            app: scaffolding-e2e
          # A node holding NO account root joins and writes, under a certificate
          # its root signed on another machine — the cold-storage posture the
          # account/device split exists for (#3430).
          #
          # Needs merobox >= 0.6.67 for two things: `nodes.init_args`, to boot
          # exactly one node with `--no-account-root`, and `deviceAgreementKey`
          # from `node_identity`, the third input `account sign-cert` takes.
          # Pinned by #3678.
          - workflow: offline-account-root
            file: workflows/offline-account-root.yml
            app: scaffolding-e2e
          # #3333: after two nodes concurrently add distinct SortedSet elements,
          # membership (`contains`)/`len` converge but ORDERED reads (`iter`)
          # may not. Runs on a merod:local built from this branch (carrying the
          # `sorted_index_dbg` trace); the ordered-read assertion is the
          # discriminator. Converges here => the divergence is JS-path-specific.
          - workflow: sorted-set-concurrent-convergence
            file: workflows/sorted-set-concurrent-convergence.yml
            app: scaffolding-e2e
          - workflow: groups
            file: workflows/groups.yml
            app: scaffolding-e2e
          - workflow: group-join-then-list-from-joiner
            file: workflows/group-join-then-list-from-joiner.yml
            app: scaffolding-e2e
          - workflow: group-join-mesh-not-ready
            file: workflows/group-join-mesh-not-ready.yml
            app: scaffolding-e2e
          # Asserts a peer discovered over mDNS reaches the KAD ROUTING TABLE
          # (`RoutingUpdated` in both nodes' logs), which was measured at 0 for
          # a whole run before the identify fix. Without it the fleet gossips
          # fine while every DHT query returns closest_peers: [] / requests: 0.
          - workflow: kad-routing-from-identify
            file: workflows/kad-routing-from-identify.yml
            app: scaffolding-e2e
          - workflow: group-3node
            file: workflows/group-3node.yml
            app: scaffolding-e2e
          - workflow: group-context-isolation
            file: workflows/group-context-isolation.yml
            app: scaffolding-e2e
          - workflow: group-late-joiner
            file: workflows/group-late-joiner.yml
            app: scaffolding-e2e
            image: merod:local-dht
          - workflow: group-governance-late-joiner
            file: workflows/group-governance-late-joiner.yml
            app: scaffolding-e2e
          - workflow: group-governance-peer-down
            file: workflows/group-governance-peer-down.yml
            app: scaffolding-e2e
          - workflow: group-subgroup
