name: E2E - Rust Apps

# Runs the merobox scenarios in .github/e2e-scenarios.yml against a locally-built
# merod image, packed into groups that each share one runner (see `plan`).
# Self-contained: doesn't depend on release.yml.

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "apps/scaffolding-e2e/**"
      - "apps/scaffolding-e2e-multi/**"
      - "apps/xcall-example/**"
      - "apps/kv-store-with-shared-storage/**"
      - "apps/tee-dice/**"
      - "apps/tee-cards/**"
      - "apps/name-registry/**"
      - "apps/name-registry-admin/**"
      - "apps/authored-sorted-kv-store/**"
      - "apps/indexed-issue-tracker/**"
      - "apps/indexed-forum/**"
      - "apps/search-chat/**"
      - "apps/permissions-showcase/**"
      - "apps/components-demo/**"
      - "apps/blobs/**"
      - "apps/abi_conformance/**"
      - "apps/collaborative-editor/**"
      - "apps/fugue-collab/**"
      - "apps/rich-collab/**"
      - "apps/kv-store-init/**"
      - "apps/kv-store-with-handlers/**"
      - "apps/kv-store-with-user-and-frozen-storage/**"
      - "apps/kv-store/**"
      - "apps/nested-crdt-test/**"
      - "apps/private_data/**"
      - "apps/team-metrics-custom/**"
      - "apps/team-metrics-macro/**"
      - ".github/workflows/e2e-rust-apps.yml"
      - ".github/workflows/e2e-rust-apps-release.yml"
      - "scripts/lint-e2e-bundle-coverage.py"
      - "scripts/e2e-fixture-registry.sh"
      - ".github/e2e-scenarios.yml"
      - "scripts/e2e-scenario-groups.py"
      - "scripts/e2e-scenario-durations.json"
      - "scripts/e2e-run-scenario-group.sh"
      - "scripts/e2e-scenario-log-gates.sh"
      - "scripts/tests/e2e-scenario-groups-test.py"
      - "scripts/tests/e2e-run-scenario-group.test.sh"
      - ".github/workflows/build-merod-image.yml"
      - ".github/actions/setup-merobox/**"
      - ".github/actions/build-local-merod/**"
      - ".github/actions/merod-binaries/**"
      - ".github/actions/setup-cargo-mero/**"
      - ".github/actions/wasm-apps/**"
      - "scripts/setup-cargo-mero.sh"
      - "scripts/path-dep-closure.py"
      - "scripts/build-all-apps.sh"
      - "scripts/check-embedded-abi.sh"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
      - "apps/kv-store/GUIDE.md"

  pull_request:
    branches: [master]
    paths:
      - "crates/**"
      - "apps/scaffolding-e2e/**"
      - "apps/scaffolding-e2e-multi/**"
      - "apps/xcall-example/**"
      - "apps/kv-store-with-shared-storage/**"
      - "apps/tee-dice/**"
      - "apps/tee-cards/**"
      - "apps/name-registry/**"
      - "apps/name-registry-admin/**"
      - "apps/authored-sorted-kv-store/**"
      - "apps/indexed-issue-tracker/**"
      - "apps/indexed-forum/**"
      - "apps/search-chat/**"
      - "apps/permissions-showcase/**"
      - "apps/components-demo/**"
      - "apps/blobs/**"
      - "apps/abi_conformance/**"
      - "apps/collaborative-editor/**"
      - "apps/fugue-collab/**"
      - "apps/rich-collab/**"
      - "apps/kv-store-init/**"
      - "apps/kv-store-with-handlers/**"
      - "apps/kv-store-with-user-and-frozen-storage/**"
      - "apps/kv-store/**"
      - "apps/nested-crdt-test/**"
      - "apps/private_data/**"
      - "apps/team-metrics-custom/**"
      - "apps/team-metrics-macro/**"
      - ".github/workflows/e2e-rust-apps.yml"
      - ".github/workflows/e2e-rust-apps-release.yml"
      - "scripts/lint-e2e-bundle-coverage.py"
      - "scripts/e2e-fixture-registry.sh"
      - ".github/e2e-scenarios.yml"
      - "scripts/e2e-scenario-groups.py"
      - "scripts/e2e-scenario-durations.json"
      - "scripts/e2e-run-scenario-group.sh"
      - "scripts/e2e-scenario-log-gates.sh"
      - "scripts/tests/e2e-scenario-groups-test.py"
      - "scripts/tests/e2e-run-scenario-group.test.sh"
      - ".github/workflows/build-merod-image.yml"
      - ".github/actions/setup-merobox/**"
      - ".github/actions/build-local-merod/**"
      - ".github/actions/merod-binaries/**"
      - ".github/actions/setup-cargo-mero/**"
      - ".github/actions/wasm-apps/**"
      - "scripts/setup-cargo-mero.sh"
      - "scripts/path-dep-closure.py"
      - "scripts/build-all-apps.sh"
      - "scripts/check-embedded-abi.sh"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
      - "apps/kv-store/GUIDE.md"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  # ── Build merod Docker image (heaviest step) ──
  # Shared verbatim with app-migration-e2e.yml so both suites ride the same warm cache.
  build-image:
    name: Build Image
    uses: ./.github/workflows/build-merod-image.yml

  # ── The mock-TEE image and mero-auth, each beside the default image ──
  # Only the mock-TEE groups need the one and only Relay the other, so each builds
  # in its own job, in parallel with Build Image instead of after it: every other
  # group starts without them, and neither waits for the other to compile.
  # Both names keep "Build merod image": merod-binaries' wait-for-producer (sdk-e2e
  # waits here for mock-tee) watches every job of that name in this workflow.
  build-mock-tee-image:
    name: Build merod image (mock-tee)
    runs-on: ubuntu-24.04-8cpu
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Reads Build Image's warm cache; that job is its one saver.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: merod-release-fast
          save-if: false

      # sdk-e2e restores this binary from the cache.
      - name: Build the mock-tee merod binary
        uses: ./.github/actions/merod-binaries
        env:
          CALIMERO_WEBUI_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALIMERO_AUTH_FRONTEND_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          variants: mock-tee

      # blob-presence-tee-serves and the other mock-TEE scenarios boot `merod run
      # --mock-tee`, which needs the mock-attestation feature. It stays out of the
      # shared image so that one matches the production feature set.
      - name: Build mock-attestation Docker image
        run: |
          mkdir -p bin/amd64
          cp merod-bin/mock-tee/merod bin/amd64/
          # meroctl is not needed for e2e tests but the Dockerfile expects it
          touch bin/amd64/meroctl
          docker build \
            -f .github/workflows/deps/prebuilt.Dockerfile \
            -t merod:local-mock-tee \
            --build-arg TARGETARCH=amd64 \
            .
          docker images merod:local-mock-tee

      - name: Save mock-attestation Docker image
        run: docker save merod:local-mock-tee | zstd -T0 -3 -o /tmp/merod-local-mock-tee.tar.zst

      - name: Upload mock-attestation Docker image
        uses: actions/upload-artifact@v7
        with:
          name: merod-image-mock-tee
          path: /tmp/merod-local-mock-tee.tar.zst
          retention-days: 1
          compression-level: 0

  # Relay's standalone mero-auth, built from this tree. It makes no image and no
  # artifact: Relay restores it from the merod-bin cache (merod-binaries'
  # mero-auth variant), which this job is the one saver of for this tree.
  build-mero-auth:
    name: Build merod image (mero-auth)
    runs-on: ubuntu-24.04-8cpu
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Reads Build Image's warm cache; that job is its one saver.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: merod-release-fast
          save-if: false

      - name: Build the mero-auth binary
        uses: ./.github/actions/merod-binaries
        env:
          CALIMERO_WEBUI_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALIMERO_AUTH_FRONTEND_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          variants: mero-auth

  # ── Scenario convergence lint ──
  # Ratcheted against scripts/e2e-convergence-baseline.txt: only a NEW finding fails.
  convergence-lint:
    name: Scenario convergence lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Lint merobox scenarios for unbarriered convergence reads
        run: python3 scripts/lint-e2e-convergence.py
      - name: Lint merobox scenarios for unnamed multi-service bundles
        run: python3 scripts/lint-e2e-bundle-shape.py
      - name: Lint e2e workflows for unbuilt scenario bundles
        run: python3 scripts/lint-e2e-bundle-coverage.py
      # The grouping must place every scenario exactly once, deterministically; the
      # group runner must run every scenario even after one fails, and fail if any did.
      - name: Test the scenario grouping
        run: python3 scripts/tests/e2e-scenario-groups-test.py
      - name: Test the scenario group runner
        run: bash scripts/tests/e2e-run-scenario-group.test.sh
      # A log assertion couples a scenario to a string a program prints, and a
      # rename breaks that coupling SILENTLY: an `absent` assertion then passes
      # vacuously forever, and a `present` one fails far from the rename, in a
      # scenario nobody associates with logging. Neither is caught by running
      # the suite, which is why it is a lint rather than a test.
      - name: Lint merobox log assertions for patterns that can never match
        run: python3 scripts/lint-e2e-log-assertions.py

  # ── Auth seam: client-token e2e over real HTTP ──
  # Binary mode runs the PR's own merod; docker mode's --auth-service would boot a prebuilt image.
  auth-seam:
    name: Auth seam (client-token e2e)
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: merod-image
          path: /tmp

      - name: Extract merod binary from image
        run: |
          zstd -d /tmp/merod-local.tar.zst --stdout | docker load
          id=$(docker create merod:local)
          docker cp "$id:/usr/local/bin/merod" ./merod
          docker rm "$id"
          chmod +x ./merod

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      - name: Run auth-seam e2e (merobox, embedded auth)
        env:
          # These vars both provision the node's admin account at init and tell
          # scripts/e2e-auth-seam.sh which credentials to log in with. CI-only test values.
          MERO_AUTH_ADMIN_USER: dev
          MERO_AUTH_ADMIN_PASSWORD: dev-password
          MERO_E2E_USER: dev
          MERO_E2E_PASS: dev-password
          CALIMERO_REGISTRY_MODE: dht
        run: |
          merobox bootstrap run workflows/auth-seam.yml \
            --no-docker --binary-path ./merod --auth-mode embedded

      - name: Logs on failure
        if: failure()
        run: cat data/auth-seam-1/logs/*.log || true

      - name: Stop nodes
        if: always()
        run: merobox stop --no-docker --all || true

  # The TEE relay topology: merod in PROXY auth mode with delegated access,
  # behind Traefik and a standalone mero-auth serving device-key login, as
  # mero-tee runs a fleet relay. Every other scenario reaches a node on its own
  # port, so the proxy-mode caller identity (`server.proxy_identity`) and the
  # ingress that makes it safe had no end-to-end coverage. Binary mode: the
  # ingress needs a mero-auth built from this branch and a traefik beside it.
  relay-device-login:
    name: Relay device login (proxy mode behind Traefik + mero-auth)
    needs: [build-image, build-mero-auth, build-apps]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pinned to what mero-tee's node image bakes (mero-tee/versions.json).
      TRAEFIK_VERSION: "3.5.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: merod-image
          path: /tmp

      - name: Extract merod binary from image
        run: |
          zstd -d /tmp/merod-local.tar.zst --stdout | docker load
          id=$(docker create merod:local)
          docker cp "$id:/usr/local/bin/merod" ./merod
          docker rm "$id"
          chmod +x ./merod

      # Not a published image: what is under test is the `/auth/validate` of THIS
      # branch naming the session's account. build-mero-auth built it from
      # this tree (merod-binaries' mero-auth variant), so this restores it rather
      # than compiling it again; a miss builds it here.
      - name: Get mero-auth
        uses: ./.github/actions/merod-binaries
        env:
          CALIMERO_AUTH_FRONTEND_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          variants: mero-auth

      - name: Install traefik
        run: |
          curl -fsSL "https://github.com/traefik/traefik/releases/download/v${TRAEFIK_VERSION}/traefik_v${TRAEFIK_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" traefik
          "$RUNNER_TEMP/traefik" version

      - name: Download app bundles
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-bundles
          path: dist

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      - name: Run relay-device-login
        run: |
          # Nodes fetch bundles from a fixture registry rather than each other,
          # as the Windows binary-mode lane in platforms.yml does.
          FIXTURE_REGISTRY_STAGE_ONLY=1 ./scripts/e2e-fixture-registry.sh dist
          python3 -m http.server 8080 --bind 127.0.0.1 \
            --directory fixture-registry >/dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sfo /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          export CALIMERO_REGISTRY_MODE=http
          export CALIMERO_REGISTRY_URL=http://127.0.0.1:8080/

          export MEROD_BIN="$GITHUB_WORKSPACE/merod"
          export MERO_AUTH_BIN="$GITHUB_WORKSPACE/merod-bin/mero-auth/mero-auth"
          export TRAEFIK_BIN="$RUNNER_TEMP/traefik"
          cd apps/scaffolding-e2e
          # --e2e-mode, as the matrix runs: mDNS on, bootstrap list cleared, so
          # the four nodes find each other and nothing outside the runner.
          merobox bootstrap run workflows/relay-device-login.yml \
            --no-docker --binary-path "$MEROD_BIN" --e2e-mode

      - name: Logs on failure
        if: failure()
        run: |
          for f in apps/scaffolding-e2e/data/relay-login-node-*/logs/*.log \
                   apps/scaffolding-e2e/data/relay-ingress/*.log; do
            echo "=== $f ==="
            tail -n 200 "$f" || true
          done

      - name: Stop nodes
        if: always()
        run: merobox stop --no-docker --all || true

  # The Windows lanes (auth seam and 3-node sync, binary mode) live in platforms.yml:
  # nightly, and on a PR whose change can reach Windows-only code.

  # ── Build WASM apps (runs in parallel with image build) ──
  # big-machine, as ci-checks' Rust apps: a miss builds every app, and this job
  # gates every scenario group. Same HOME, checkout and target dirs as there, so
  # the two still share one wasm-apps cache key.
  build-apps:
    name: Build Apps
    runs-on: big-machine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The same set, script and inputs as ci-checks.yml's Rust apps job, so either
      # job's master build serves both. A hit skips Rust and cargo-mero entirely.
      - name: Restore the apps, or set up to build them
        id: apps
        uses: ./.github/actions/wasm-apps
        with:
          root: apps
          script: scripts/build-all-apps.sh
          workflows: .github/workflows/ci-checks.yml .github/workflows/e2e-rust-apps.yml
          # This job is the wasm-apps rust-cache group's one saver.
          rust-cache-save: ${{ github.ref == 'refs/heads/master' }}

      # Bundles every app the scenarios install (lint-e2e-bundle-coverage.py reads
      # the list from the script), then checks every wasm embeds its ABI (core#3287).
      - name: Build every app
        if: steps.apps.outputs.hit != 'true'
        run: ./scripts/build-all-apps.sh

      - name: Share the built apps
        if: steps.apps.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.apps.outputs.paths }}
          key: ${{ steps.apps.outputs.key }}

      - name: Upload app artifacts
        uses: actions/upload-artifact@v7
        with:
          name: e2e-apps
          path: |
            apps/scaffolding-e2e/res/*.wasm
            apps/scaffolding-e2e/res/abi.json
            apps/scaffolding-e2e/res/state-schema.json
            apps/xcall-example/res/*.wasm
            apps/xcall-example/res/abi.json
            apps/kv-store-with-shared-storage/res/*.wasm
            apps/kv-store-with-shared-storage/res/abi.json
            apps/kv-store-with-shared-storage/res/state-schema.json
            apps/tee-dice/res/*.wasm
            apps/tee-dice/res/abi.json
            apps/tee-dice/res/state-schema.json
            apps/tee-cards/res/*.wasm
            apps/tee-cards/res/abi.json
            apps/tee-cards/res/state-schema.json
            apps/name-registry/res/*.wasm
            apps/name-registry/res/abi.json
            apps/name-registry/res/state-schema.json
            apps/name-registry-admin/res/*.wasm
            apps/name-registry-admin/res/abi.json
            apps/name-registry-admin/res/state-schema.json
            apps/authored-sorted-kv-store/res/*.wasm
            apps/authored-sorted-kv-store/res/abi.json
            apps/authored-sorted-kv-store/res/state-schema.json
            apps/indexed-issue-tracker/res/*.wasm
            apps/indexed-issue-tracker/res/abi.json
            apps/indexed-issue-tracker/res/state-schema.json
            apps/indexed-forum/res/*.wasm
            apps/indexed-forum/res/abi.json
            apps/indexed-forum/res/state-schema.json
            apps/search-chat/res/*.wasm
            apps/search-chat/res/abi.json
            apps/search-chat/res/state-schema.json
            apps/permissions-showcase/res/*.wasm
            apps/permissions-showcase/res/abi.json
            apps/permissions-showcase/res/state-schema.json
            apps/components-demo/res/*.wasm
            apps/components-demo/res/abi.json
            apps/components-demo/res/state-schema.json
            apps/blobs/res/*.wasm
            apps/blobs/res/abi.json
            apps/blobs/res/state-schema.json
            apps/abi_conformance/res/*
            apps/collaborative-editor/res/*
            apps/fugue-collab/res/*
            apps/rich-collab/res/*
            apps/kv-store-init/res/*
            apps/kv-store-with-handlers/res/*
            apps/kv-store-with-user-and-frozen-storage/res/*
            apps/kv-store/res/*
            apps/nested-crdt-test/res/*
            apps/private_data/res/*
            apps/team-metrics-custom/res/*
            apps/team-metrics-macro/res/*
          retention-days: 1

      - name: Upload app bundles
        uses: actions/upload-artifact@v7
        with:
          name: e2e-app-bundles
          path: dist/*.mpk
          retention-days: 1

  # ── Test phase: the scenarios, in groups ──
  # One runner per group, not per scenario: a runner's setup (image load, bundles,
  # fixture registry, merobox) was half of every one-scenario job, and each job
  # queued for an 8-cpu runner of its own. The scenarios are listed in
  # .github/e2e-scenarios.yml; scripts/e2e-scenario-groups.py packs them into
  # GROUP_COUNT groups balanced by measured duration, one image per group. The
  # groups run in two jobs, each waiting only for the image its groups boot
  # (the script's JOBS): `test` on merod:local / merod:local-dht, `test-mock-tee`
  # on merod:local-mock-tee. The plan is made whole and then split.
  plan:
    name: Plan scenario groups
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix-default: ${{ steps.plan.outputs.matrix-default }}
      matrix-mock-tee: ${{ steps.plan.outputs.matrix-mock-tee }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      # The script refuses to print a matrix that drops or repeats a scenario.
      - name: Group the scenarios
        id: plan
        run: |
          python3 scripts/e2e-scenario-groups.py --manifest .github/e2e-scenarios.yml --summary \
            >> "$GITHUB_STEP_SUMMARY"
          default=$(python3 scripts/e2e-scenario-groups.py --manifest .github/e2e-scenarios.yml --job default)
          mock_tee=$(python3 scripts/e2e-scenario-groups.py --manifest .github/e2e-scenarios.yml --job mock-tee)
          {
            echo "matrix-default=${default}"
            echo "matrix-mock-tee=${mock_tee}"
          } >> "$GITHUB_OUTPUT"

  # The groups on merod:local and merod:local-dht. `test-mock-tee` runs the same
  # steps (a YAML alias) on the mock-TEE groups; each job downloads only the image
  # its groups boot, which is all its `needs` waits for.
  test:
    name: Test (${{ matrix.group }})
    needs: [plan, build-image, build-apps]
    runs-on: ubuntu-24.04-8cpu
    # The sum of the group's per-scenario timeouts plus setup, so a hung scenario
    # is killed by its own timeout and the rest of the group still runs.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix-default) }}
    steps: &test-steps
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Docker image
        if: matrix.image != 'merod:local-mock-tee'
        uses: actions/download-artifact@v8
        with:
          name: merod-image
          path: /tmp

      - name: Load Docker image
        if: matrix.image != 'merod:local-mock-tee'
        run: zstd -d /tmp/merod-local.tar.zst --stdout | docker load

      # Only the mock-TEE groups need it, and it is a second full image —
      # not worth pulling into every group.
      - name: Download mock-attestation Docker image
        if: matrix.image == 'merod:local-mock-tee'
        uses: actions/download-artifact@v8
        with:
          name: merod-image-mock-tee
          path: /tmp

      - name: Load mock-attestation Docker image
        if: matrix.image == 'merod:local-mock-tee'
        run: zstd -d /tmp/merod-local-mock-tee.tar.zst --stdout | docker load

      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          name: e2e-apps
          path: apps

      - name: Download app bundles
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-bundles
          path: dist

      # Nodes fetch bundles from here rather than from each other. The URL is
      # discovered on this runner, so it is stamped in rather than prebuilt.
      # One registry serves the whole group; the run step checks each scenario
      # against the requests it logged while that scenario ran.
      - name: Serve app bundles from a fixture registry
        if: matrix.image != 'merod:local-dht'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          url=$(./scripts/e2e-fixture-registry.sh)
          # Stamp the image this group actually boots, not always the shared one, or a group on its own
          # image (merod:local-mock-tee) runs unstamped and trips the fetch gate.
          ./scripts/set-registry-mode.sh "$IMAGE" http "$url"

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      # Only the ephemeral-* scenarios need this: their assertions use the global WebSocket, which
      # landed in Node 22. Pinned so a runner image change can't silently break the scripts.
      - name: Setup Node
        if: matrix.setup_node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Only the size sweep needs these 416 MiB /dev/urandom fixtures. Content must be random: blobs
      # are content-addressed, so predictable content would already sit on the fetching node.
      - name: Generate blob fixtures
        if: matrix.blob_fixtures
        run: |
          cd apps/blobs
          chmod +x scripts/gen-blob-fixtures.sh
          ./scripts/gen-blob-fixtures.sh

      # Every scenario runs even after one fails, each in its own log group with a line in the
      # step summary; the node-log gates (projection divergence, op-store completeness, torn blob
      # reads, and the two observe-only reports) run per scenario inside the script.
      - name: Run ${{ matrix.scenario_count }} scenarios
        env:
          GROUP: ${{ matrix.group }}
          SCENARIOS_JSON: ${{ toJSON(matrix.scenarios) }}
          # Admin credentials for embedded-auth scenarios, matching the dev/dev-password login steps in
          # the workflow YAMLs. CI-only values; nothing lands in shipped config.
          MERO_AUTH_ADMIN_USER: dev
          MERO_AUTH_ADMIN_PASSWORD: dev-password
        run: ./scripts/e2e-run-scenario-group.sh

      - name: List docker-logs/ before upload (debug)
        if: always()
        run: ls -laR docker-logs/ 2>&1 || echo "docker-logs/ missing"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.group }}-${{ github.sha }}
          # docker-logs/<scenario>/ per scenario: merobox's per-container logs, prefixed with the
          # scenario, plus its pre-restart snapshots. The trailing slash uploads the whole tree; a
          # two-pattern glob would silently miss files.
          path: docker-logs/
          retention-days: 7
          if-no-files-found: ignore

  test-mock-tee:
    name: Test (${{ matrix.group }})
    needs: [plan, build-mock-tee-image, build-apps]
    runs-on: ubuntu-24.04-8cpu
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix-mock-tee) }}
    steps: *test-steps

  # ── Report phase: notify on PR failure ──
  projection-coverage:
    name: Assert the projection gate compared something
    needs: [test, test-mock-tee]
    runs-on: ubuntu-latest
    if: always()
    steps:
      # Counterpart to the per-scenario divergence gate, which only asserts a negative - a suite that
      # compared nothing satisfies that too. This asserts the positive across the whole suite.
      - name: Download scenario logs
        id: logs
        # Tolerated so the assertion below can say precisely why logs are missing, rather
        # than fail indistinguishably from a suite that legitimately produced none.
        uses: actions/download-artifact@v8
        with:
          pattern: logs-*
          merge-multiple: true
          path: all-logs
        continue-on-error: true

      - name: Assert the suite concluded comparisons
        run: |
          # Missing logs is benign only if neither matrix ran. A download failure, or a matrix that ran
          # and left nothing, is the fail-open case this job exists to prevent.
          if [ ! -d all-logs ] || [ -z "$(find all-logs -type f -print -quit)" ]; then
              case "${{ needs.test.result }}/${{ needs.test-mock-tee.result }}" in
                skipped/skipped|skipped/cancelled|cancelled/skipped|cancelled/cancelled)
                  echo "::notice::the scenario matrix did not run (${{ needs.test.result }}/${{ needs.test-mock-tee.result }}) — nothing to inspect"
                  exit 0
                  ;;
              esac
              echo "::error::no scenario logs to inspect though the matrix ran (test=${{ needs.test.result }}, test-mock-tee=${{ needs.test-mock-tee.result }}, artifact download=${{ steps.logs.outcome }}) — the coverage floor could not be checked"
              exit 1
          fi
          strip() { sed -E 's/\x1b\[[0-9;]*m//g'; }
          compares=$(grep -rh "unified_projection_compare" all-logs/ 2>/dev/null | strip || true)
          echo "suite-wide membership comparisons:"
          if [ -n "${compares}" ]; then
              echo "${compares}" | grep -oE 'result="[a-z_]+"' | sort | uniq -c
              echo "by op kind:"
              echo "${compares}" | grep -oE 'op_kind="[a-z]+"' | sort | uniq -c
              echo "conclusive by op kind:"
              echo "${compares}" | grep -E 'result="(agree|diverged)"' \
                | grep -oE 'op_kind="[a-z]+"' | sort | uniq -c || true
          else
              echo "  (none)"
          fi
          concluded=$(echo "${compares}" | grep -cE 'result="(agree|diverged)"' || true)
          if [ "${concluded}" -eq 0 ]; then
              echo "::error::the projection gate concluded NO comparison anywhere in the suite — every divergence gate in this run passed without checking anything"
              exit 1
          fi
          echo "the gate concluded ${concluded} comparison(s) across the suite"

  key-recovery-coverage:
    name: Assert both key-serve grounds were exercised
    needs: [test, test-mock-tee]
    runs-on: ubuntu-latest
    if: always()
    steps:
      # Counterpart to the per-scenario observe-only report; printing alone isn't gating, so this job
      # asserts suite-wide, same as projection-coverage, that both key-serve grounds were exercised.
      - name: Download scenario logs
        id: logs
        # Tolerated so the assertion below can say precisely why logs are missing, rather
        # than fail indistinguishably from a suite that legitimately produced none.
        uses: actions/download-artifact@v8
        with:
          pattern: logs-*
          merge-multiple: true
          path: all-logs
        continue-on-error: true

      - name: Assert each ground was exercised somewhere
        run: |
          # Missing logs is benign only if neither matrix ran. A download failure, or a matrix that ran
          # and left nothing, is the fail-open case this job exists to prevent.
          if [ ! -d all-logs ] || [ -z "$(find all-logs -type f -print -quit)" ]; then
              case "${{ needs.test.result }}/${{ needs.test-mock-tee.result }}" in
                skipped/skipped|skipped/cancelled|cancelled/skipped|cancelled/cancelled)
                  echo "::notice::the scenario matrix did not run (${{ needs.test.result }}/${{ needs.test-mock-tee.result }}) — nothing to inspect"
                  exit 0
                  ;;
              esac
              echo "::error::no scenario logs to inspect though the matrix ran (test=${{ needs.test.result }}, test-mock-tee=${{ needs.test-mock-tee.result }}, artifact download=${{ steps.logs.outcome }}) — the key-serve coverage floor could not be checked"
              exit 1
          fi
          # ANSI escapes sit between a field name and its `=` in node logs, so the
          # sed is not optional; matching the raw pattern finds nothing.
          grounds=$(grep -rho 'key_recovery_authorized_by.*' all-logs/ 2>/dev/null \
            | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
            | grep -oE 'key_recovery_authorized_by="?[a-z_]+"?' \
            | sed -E 's/.*=//; s/"//g' || true)
          echo "suite-wide group-key recoveries by authorizing ground:"
          if [ -n "${grounds}" ]; then
              echo "${grounds}" | sort | uniq -c | sort -rn
          else
              echo "  (none)"
          fi
          # Printed whether or not the floor holds, since the count alone doesn't say which scenario
          # supplied a ground. Paths (all-logs/<scenario>/...) are the attribution.
          echo "which scenarios supplied them:"
          supplied=0
          for f in $(grep -rl 'key_recovery_authorized_by' all-logs/ 2>/dev/null || true); do
              supplied=1
              n=$(grep -c 'key_recovery_authorized_by' "${f}" || true)
              g=$(grep -ho 'key_recovery_authorized_by.*' "${f}" \
                | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
                | grep -oE 'key_recovery_authorized_by="?[a-z_]+"?' \
                | sed -E 's/.*=//; s/"//g' | sort -u | paste -sd, - || true)
              echo "  ${f#all-logs/}: ${n} (${g})"
          done
          if [ "${supplied}" -eq 0 ]; then
              echo "  (no log file mentions the marker at all)"
          fi
          anchor=$(echo "${grounds}" | grep -cx 'anchor' || true)
          own=$(echo "${grounds}" | grep -cx 'own_account_device' || true)
          # Reported rather than ignored: renaming the value in code would otherwise fail
          # both floors below with a message that blames the scenarios instead of the rename.
          other=$(echo "${grounds}" | grep -vx -e 'anchor' -e 'own_account_device' | sort -u | paste -sd, - || true)
          if [ -n "${other}" ]; then
              echo "::warning::unrecognized authorizing ground(s): ${other} — either a third ground was added (extend this floor) or the marker's values were renamed"
          fi
          # Spelled as if blocks, not [ ... ] && x=y: under bash -e a false test as the last
          # command of an && list exits the script, aborting even the happy path.
          missing=""
          if [ "${anchor}" -eq 0 ]; then
              missing="anchor"
          fi
          if [ "${own}" -eq 0 ]; then
              missing="${missing:+${missing} and }own_account_device"
          fi
          if [ -n "${missing}" ]; then
              echo "::error::no group-key recovery anywhere in the suite was authorized by: ${missing} (anchor=${anchor}, own_account_device=${own}) — unexercised, so a regression breaking it would leave this suite green, which is exactly how #3892 shipped inert"
              echo "the scenarios that supplied each ground when this floor was set:"
              echo "  own_account_device — account-device-revoke-lockout"
              echo "  anchor             — group-subgroup-cold-sync"
              echo "if one of those scenarios was intentionally changed, another must exercise the ground; do NOT lower this floor to match a regression"
              exit 1
          fi
          echo "both key-serve grounds exercised across the suite (anchor=${anchor}, own_account_device=${own})"

  comment:
    name: Report Failed Workflow
    needs: [plan, test, test-mock-tee, auth-seam, relay-device-login, projection-coverage, key-recovery-coverage]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Check if main job failed or was cancelled
        id: check_status
        run: |
          if [ "${{ needs.plan.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.test-mock-tee.result }}" != "success" ] || [ "${{ needs.auth-seam.result }}" != "success" ] || [ "${{ needs.relay-device-login.result }}" != "success" ] || [ "${{ needs.projection-coverage.result }}" != "success" ] || [ "${{ needs.key-recovery-coverage.result }}" != "success" ]; then
            echo "job_failed=true" >> $GITHUB_OUTPUT
            if [ "${{ needs.plan.result }}" == "cancelled" ] || [ "${{ needs.test.result }}" == "cancelled" ] || [ "${{ needs.test-mock-tee.result }}" == "cancelled" ] || [ "${{ needs.auth-seam.result }}" == "cancelled" ] || [ "${{ needs.relay-device-login.result }}" == "cancelled" ] || [ "${{ needs.projection-coverage.result }}" == "cancelled" ] || [ "${{ needs.key-recovery-coverage.result }}" == "cancelled" ]; then
              echo "was_cancelled=true" >> $GITHUB_OUTPUT
            else
              echo "was_cancelled=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "job_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Failure Comment
        if: steps.check_status.outputs.job_failed == 'true' && steps.check_status.outputs.was_cancelled == 'false'
        run: |
          message="## E2E Rust Apps Failed

          One or more jobs in this workflow (the merobox scenario groups
          and their plan, auth-seam, relay-device-login, projection-coverage,
          key-recovery-coverage) failed.

          Please check the workflow logs for more details."

          jq -n \
            --arg pr '${{ github.event.number }}' \
            --arg tag e2e-rust-apps-report \
            --arg mode recreate \
            --arg message "$message" \
            '{pr: $pr, tag: $tag, mode: $mode, message: $message}' > payload.json

      - name: Upload Comment
        if: steps.check_status.outputs.job_failed == 'true' && steps.check_status.outputs.was_cancelled == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: pr-comment-payload-rust-apps
          path: payload.json

      - name: Fail if main job failed or was cancelled
        if: steps.check_status.outputs.job_failed == 'true'
        run: |
          if [ "${{ steps.check_status.outputs.was_cancelled }}" == "true" ]; then
            echo "Workflow was cancelled"
          else
            echo "Workflow failed"
          fi
          exit 1
