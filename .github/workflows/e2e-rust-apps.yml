    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: merod-image
          path: /tmp

      - name: Load Docker image
        run: zstd -d /tmp/merod-local.tar.zst --stdout | docker load

      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          name: e2e-apps
          path: apps

      - name: Download app bundles
        uses: actions/download-artifact@v8
        with:
          name: e2e-app-bundles
          path: dist

      # Nodes fetch bundles from here rather than from each other. The URL is
      # discovered on this runner, so it is stamped in rather than prebuilt.
      - name: Serve app bundles from a fixture registry
        run: |
          url=$(./scripts/e2e-fixture-registry.sh)
          ./scripts/set-registry-mode.sh merod:local http "$url"

      - name: Setup merobox
        uses: ./.github/actions/setup-merobox

      # Only ephemeral-presence-e2e needs this. Its assertions are Node scripts
      # (apps/kv-store/scripts/ephemeral-*.js) using the GLOBAL `WebSocket` and
      # `fetch` — presence has no read endpoint, so a subscriber is the only way
      # to observe it, and global WebSocket landed in Node 22. Pinned rather
      # than inherited so the runner image changing its default node cannot
      # silently take the scripts out from under us.
      - name: Setup Node
        if: matrix.workflow == 'ephemeral-presence-e2e'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Only the size sweep needs these, and they are 416 MiB of /dev/urandom —
      # not worth generating for every other workflow in the matrix
      # (blob-cross-node-transfer uses the small committed fixtures). Random
      # content is required, not incidental: blobs are content-addressed, so a
      # predictable fixture would already sit on the fetching node and the
      # cross-node path under test would be skipped.
      - name: Generate blob fixtures
        if: matrix.workflow == 'blob-cross-node-sizes'
        run: |
          cd apps/blobs
          chmod +x scripts/gen-blob-fixtures.sh
          ./scripts/gen-blob-fixtures.sh

      - name: Run ${{ matrix.workflow }}
        env:
          # Admin credentials for embedded-auth scenarios, matching the
          # dev/dev-password `login` steps in the workflow YAMLs. The login
          # path never mints keys (no first-login bootstrap secret anymore):
          # merobox ≥0.6.43 forwards these vars into node containers, where
          # `merod init` mints the admin root key before the node listens.
          # CI-only test values for ephemeral containers; the password is
          # consumed at init — nothing lands in any image or shipped config.
          MERO_AUTH_ADMIN_USER: dev
          MERO_AUTH_ADMIN_PASSWORD: dev-password
        run: |
          # Phase 11.3 (#2237): single attempt, fail loud. The retry loop
          # + `merobox nuke --force` between attempts existed to mask
          # cold-start governance flakes (#2198, #2225). With the
          # three-phase contract (publish_and_await_ack + readiness FSM
          # + parent_pull single-peer fallback) in place, a flake here
          # is a real bug worth surfacing.
          mkdir -p docker-logs
          cd apps/${{ matrix.app }}

          # merobox 0.6.34+ persists per-container logs to
          # `data/container-logs/<name>.log` natively on every `bootstrap
          # run`, regardless of `stop_all_nodes` (calimero-network/merobox#207).
          # This replaces the old background `docker logs -f` watcher, which
          # existed only because earlier merobox tore the runtime containers
          # down on exit before a post-run `docker logs` could read them.
          LOGDIR="$GITHUB_WORKSPACE/docker-logs"
          # Point merobox's `restart_container` pre-restart snapshot
          # (merobox 0.6.22+) at the same absolute LOGDIR. Without this
          # env override, merobox writes the snapshot to a CWD-relative
          # `docker-logs/` which resolves to `$GITHUB_WORKSPACE/apps/
          # <app>/docker-logs/` (because the line above `cd`s into the
          # app dir) — separate from the artifact-uploaded LOGDIR. The
          # snapshot would then be invisible to the artifact uploader
          # and post-restart debugging would stay blocked.
          export MEROBOX_PRE_RESTART_LOG_DIR="$LOGDIR"

          if merobox bootstrap run \
              "${{ matrix.file }}" \
              --image ${{ matrix.image || 'merod:local' }} \
              --e2e-mode; then
              success=true
          else
              success=false
          fi

          # A green http scenario proves nothing on its own: the node logs an
          # acquisition either way, so ask the fixture whether it served one.
          if [ "${{ matrix.image }}" != merod:local-dht ] \
              && [ "${{ matrix.registry_fetch }}" != "false" ] \
              && ! docker logs fixture-registry 2>&1 | grep -q 'GET /artifacts/'; then
              echo "::error::${{ matrix.workflow }} fetched nothing from fixture-registry; it did not use the http registry"
              success=false
          fi

          # Collect merobox's native per-container logs into the artifact
          # dir before `nuke` clears node state. `nuke` only removes
          # `calimero-node-*` data dirs, not `data/container-logs/`, but
          # copying first keeps this robust to that behaviour changing.
          # Prefix with the workflow name to keep filenames self-describing
          # when several artifacts are downloaded together.
          for f in data/container-logs/*.log; do
              [ -e "$f" ] || continue
              cp -f "$f" "$LOGDIR/${{ matrix.workflow }}-$(basename "$f")"
          done

          merobox stop --all || true
          merobox nuke --force || true

          if [ "$success" = false ]; then
              echo "::error::${{ matrix.workflow }} workflow failed"
              exit 1
          fi

      - name: Assert no unified-op projection divergence (cutover gate)
        if: always()
        run: |
          # The unified-causal-log cutover shadow logs the marker
          # `unified_projection_divergence` whenever the unified-op projection
          # disagrees with the LIVE authorization decision on real traffic. ZERO
          # such markers across the e2e scenarios is the gate for flipping the
          # projection authoritative (F4) — and, having reached zero, for keeping
          # it that way.
          #
          # This is a HARD gate: the projection now reproduces the live decision
          # across every membership plane (cleartext Root joins, the encrypted
          # GroupOp plane via the live/backfill decrypt feed, genesis-admin and
          # inherited carve-outs, and materialized-only membership). A regression
          # that reintroduces divergence fails the job and must be fixed before
          # merge. Diagnostics (log_len / heads_in_log / author_in_any /
          # decision_group_in_view) are printed on the offending lines to pinpoint
          # the failure mode. Runs `always()` so divergence is reported even when
          # the scenario itself failed for another reason.
          #
          # A marker means the two planes disagreed about the SAME question: the
          # node only compares when the applied op's cut reaches everything live
          # has applied. An op applied out of causal order is not a divergence —
          # the two answers describe different histories — and reports itself as
          # `result="skipped_stale_cut"` instead.
          #
          # Which is why this step also asserts COVERAGE. "No divergence marker"
          # and "no comparison happened" are the same silence, so a gate that
          # only looks for markers can go quiet across every scenario at once and
          # still report green — it fails OPEN. Each membership op a node folds
          # logs `unified_projection_compare` with what the comparison did, and a
          # scenario that refused every comparison it attempted is a scenario
          # this gate did not actually check.
          #
          # Node logs carry ANSI escapes between a field name and its value, so
          # every grep here strips them first; matching `plane="…"` on the raw
          # line silently finds nothing, which is how "planes seen:" used to
          # print an empty list under a failing gate.
          strip() { sed -E 's/\x1b\[[0-9;]*m//g'; }
          compares=$(grep -rh "unified_projection_compare" docker-logs/ 2>/dev/null | strip || true)
          echo "membership comparisons:"
          if [ -n "${compares}" ]; then
              echo "${compares}" | grep -oE 'result="[a-z_]+"' | sort | uniq -c
              # By op kind too: adds, removes and joins are separate planes of
              # coverage, and a gate that only ever concludes on one of them is
              # thinner than its total suggests.
              echo "${compares}" | grep -oE 'op_kind="[a-z]+"' | sort | uniq -c
          else
              echo "  (none — this scenario folded no membership op)"
          fi
          concluded=$(echo "${compares}" | grep -cE 'result="(agree|diverged)"' || true)
          refused=$(echo "${compares}" | grep -cE 'result="skipped_[a-z_]+"' || true)

          if grep -rl "unified_projection_divergence" docker-logs/ 2>/dev/null | grep -q .; then
              echo "::error::unified-op projection diverged from the live decision in ${{ matrix.workflow }} — cutover gate not met"
              echo "planes seen:"
              grep -rh "unified_projection_divergence" docker-logs/ \
                | strip | grep -o 'plane="[^"]*"' | sort | uniq -c
              echo "sample:"
              grep -rn "unified_projection_divergence" docker-logs/ | strip | head -30
              exit 1
          fi

          # Observe-only per scenario, and deliberately so. A scenario can hold
          # a single membership op that lands on a node whose ancestry is not yet
          # decrypted — one refusal, no conclusions — which is thin coverage, not
          # a broken gate: 9 of 88 scenarios look like that. The systemic failure
          # this instrument exists to catch is the gate concluding nothing
          # ANYWHERE, and that is asserted once over the whole suite in
          # `projection-coverage`, where it cannot be confused with a quiet
          # scenario.
          if [ "${refused}" -gt 0 ] && [ "${concluded}" -eq 0 ]; then
              echo "::notice::every membership comparison in ${{ matrix.workflow }} was refused (${refused}) — thin coverage here; the suite-wide assertion is what gates this"
          fi
          echo "no unified_projection_divergence markers across ${concluded} concluded comparison(s) (${refused} refused) — projection agrees with the live decision"

      - name: Assert unified op-store completeness (C3 Stage 4, HARD gate)
        if: always()
        run: |
          # The C3 completeness gate logs `op_store_incomplete` whenever the unified
          # op-store is missing a governance op the gov-DAG has — i.e. some apply path
          # isn't dual-writing the op-store. This turns "incomplete op-store" from a
          # mystery 60s sync timeout (how the read-flip failed three times) into a
          # cheap, specific signal naming the missing op count per namespace.
          #
          # HARD gate from C3 Stage 4: the read now flips onto the op-store
          # (`ops_for_namespace`), so a gov-DAG op the op-store lacks is a correctness
          # bug, not a known transitional gap. Stages 1-3 closed every apply-path write
          # gap; any marker here means a path was missed and MUST be fixed before merge.
          if grep -rl "op_store_incomplete" docker-logs/ 2>/dev/null | grep -q .; then
              count=$(grep -rho "op_store_incomplete" docker-logs/ | wc -l | tr -d ' ')
              echo "::error::op-store incomplete in ${{ matrix.workflow }} — $count marker(s); a governance apply path is not writing the op-store (read-flip is unsafe)"
              echo "sample (missing_count per namespace):"
              # Match `missing_count=N` anywhere on an op_store_incomplete line — robust
              # to field ordering. Tolerates the line not carrying the field at all.
              # ANSI escapes are stripped first: they sit between the field name and
              # the `=` in node logs, so the raw pattern never matches.
              grep -rho 'op_store_incomplete.*' docker-logs/ \
                | sed -E 's/\x1b\[[0-9;]*m//g' \
                | grep -oE 'missing_count=[0-9]+' | sort | uniq -c | head -10
              grep -rn "op_store_incomplete" docker-logs/ | head -10
              exit 1
          elif grep -rl "op_store_gate_unavailable" docker-logs/ 2>/dev/null | grep -q .; then
              # No gap markers, but the gate couldn't load the op-store somewhere — do
              # NOT claim a clean mirror, that would be a false "verified" line.
              gc=$(grep -rho "op_store_gate_unavailable" docker-logs/ | wc -l | tr -d ' ')
              echo "::notice::op-store completeness UNVERIFIED in ${{ matrix.workflow }} — no gaps seen but $gc gate-load failure(s); mirror NOT confirmed"
              grep -rn "op_store_gate_unavailable" docker-logs/ | head -5
          else
              echo "no op_store_incomplete or op_store_gate_unavailable markers — op-store mirrors the gov-DAG for every exercised namespace"
          fi

      - name: Assert no blob chunk was served mid-write (HARD gate)
        if: always()
        run: |
          # `blob chunk hash mismatch; refusing to serve` means a chunk failed the
          # re-hash on the way out of the blobstore. No e2e scenario tampers with
          # blob bytes, so the only way to produce it here is a torn read: a chunk
          # observed while it was being rewritten.
          #
          # This gate exists because that is exactly how the bug it guards hid.
          # `blob-cross-node-sizes` failed intermittently with a truncated HTTP
          # body (run 31164570901), and the SAME error was already being logged on
          # runs that PASSED — the scenario only went red when the mismatch landed
          # in the streaming read rather than the probe before it. A passing job was
          # therefore not evidence of a healthy blob path, which is why this asserts
          # on the log marker and not just on the scenario's exit code.
          #
          # Fixed by writing chunks via temp-file + rename (atomic) and dropping the
          # redundant second store on the download path. A marker here means one of
          # those regressed, or a genuinely corrupt/tampered chunk reached disk —
          # both are real bugs. Runs `always()` so it reports even when the scenario
          # failed for another reason.
          if grep -rl "blob chunk hash mismatch" docker-logs/ 2>/dev/null | grep -q .; then
              count=$(grep -rho "blob chunk hash mismatch" docker-logs/ | wc -l | tr -d ' ')
              echo "::error::blob chunk served mid-write in ${{ matrix.workflow }} — $count occurrence(s); a chunk failed its content-hash check on the serve path"
              echo "sample:"
              grep -rn "blob chunk hash mismatch" docker-logs/ | head -10
              exit 1
          fi
          echo "no blob chunk hash mismatches — every chunk served passed its content-hash check"

      - name: Report scope_root governance-divergence pulls (P6.S2, observe-only)
        if: always()
        run: |
          # P6.S2 routes the GovDiverged verdict (entities agree, scope_root differs)
          # into an actual governance pull from the diverging peer — previously this
          # case only warned. `gov_divergence_pull_triggered` fires each time the
          # selector issues that pull. This step is INFORMATIONAL (never fails): it
          # confirms the corrective pull fires on rotation scenarios and lets us watch
          # for a pathological storm (the same context pulling every single tick would
          # show as a very high count for one context_id).
          if grep -rl "gov_divergence_pull_triggered" docker-logs/ 2>/dev/null | grep -q .; then
              count=$(grep -rho "gov_divergence_pull_triggered" docker-logs/ | wc -l | tr -d ' ')
              echo "::notice::scope_root governance pulls in ${{ matrix.workflow }} — $count trigger(s)"
              echo "per-context trigger counts (watch for a single context dominating = storm):"
              # Two reasons this used to match nothing, and the first is the one
              # that made every character class hopeless:
              #
              #   1. tracing writes these logs with ANSI styling on, so the bytes are
              #      `context_id<ESC>[0m<ESC>[2m=<ESC>[0m<value>` — the `=` is not
              #      adjacent to the field name at all. Hence the sed.
              #   2. the value is bs58 (`%context_id` Displays a ContextId through
              #      Hash), so a [0-9a-f] class would still have failed after
              #      stripping.
              per_context=$(grep -rho 'gov_divergence_pull_triggered.*' docker-logs/ \
                | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
                | grep -oE 'context_id=[A-Za-z0-9]+' | sort | uniq -c | sort -rn | head -10)
              if [ -n "$per_context" ]; then
                  echo "$per_context"
              else
                  # Never silently print nothing again: an empty breakdown beside a
                  # non-zero count means the field moved or stopped being emitted.
                  echo "::warning::$count trigger(s) but no context_id parsed from them — the marker's fields changed shape, so this breakdown is blind"
                  grep -rho 'gov_divergence_pull_triggered.*' docker-logs/ | head -2
              fi
              # The outcome, not just the count. `ops_pulled == 0` throughout means
              # the peer had nothing to give, so the cause is upstream of the pull;
              # a non-zero value repeating while the scenario still fails means ops
              # arrive and the fold does not converge on them. That distinction is
              # the whole diagnosis, and reading it used to require downloading the
              # docker-logs artifact by hand — the job log carries only this step's
              # own output, which is easy to mistake for the markers being absent.
              echo "pull outcomes (ops_pulled), which splits 'nothing to give' from 'ops do not take':"
              outcomes=$(grep -rho 'gov_divergence_pull_complete.*' docker-logs/ \
                | sed -E $'s/\x1B\\[[0-9;]*[mK]//g' \
                | grep -oE 'ops_pulled=[0-9]+' | sort | uniq -c | sort -rn | head -5)
              if [ -n "$outcomes" ]; then
                  echo "$outcomes"
              else
                  echo "::warning::triggers present but no gov_divergence_pull_complete found — the pull did not return, or the marker moved"
              fi
          else
              echo "no gov_divergence_pull_triggered markers — no scope_root governance divergence pulled this run"
          fi

      - name: List docker-logs/ before upload (debug)
        if: always()
        run: ls -la docker-logs/ 2>&1 || echo "docker-logs/ missing"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.workflow }}-${{ github.sha }}
          # `docker-logs/` (with a trailing slash) uploads the
          # ENTIRE directory: merobox's native per-container logs,
          # copied in as `${matrix.workflow}-${container}.log`
          # (calimero-network/merobox#207), AND merobox 0.6.22+'s
          # pre-restart snapshots
          # (`${container}.pre-restart-${utc-ts}.log` — see
          # merobox#258). Each matrix entry runs on its own runner
          # with its own `docker-logs/` dir, so this doesn't
          # cross-contaminate. Earlier attempt used a two-pattern
          # glob `docker-logs/${{ matrix.workflow }}*` +
          # `docker-logs/*.pre-restart-*.log`, but the second
          # pattern silently matched zero files via upload-artifact's
          # multi-line path handling; uploading the whole directory
          # sidesteps that and is unambiguous.
          path: docker-logs/
          retention-days: 7
          if-no-files-found: ignore

  # ── Report phase: notify on PR failure ──
  projection-coverage:
    name: Assert the projection gate compared something
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      # The counterpart to the per-scenario divergence gate. That one asserts a
      # NEGATIVE — no divergence marker — which a suite that compared nothing
      # satisfies just as well as a suite that compared everything. Asserting the
      # positive per scenario turns out to be too sharp (a scenario legitimately
      # holds one undecodable membership op and concludes nothing), so the floor
      # sits here instead: across every scenario, the gate has to have concluded
      # at least one comparison, or it was not gating.
      - name: Download scenario logs
        id: logs
        # Tolerated so the assertion below runs and can say precisely WHY there
        # are no logs; a bare failure here would be indistinguishable from a
        # suite that legitimately produced none.
        uses: actions/download-artifact@v8
        with:
          pattern: logs-*
          merge-multiple: true
          path: all-logs
        continue-on-error: true

      - name: Assert the suite concluded comparisons
        run: |
          # Missing logs is benign in exactly one case: the matrix never ran, so
          # there was nothing to check and the `test` job already says why. A
          # download failure, or a matrix that ran and left nothing behind, is
          # the fail-open case this job exists to prevent — it must not pass as
          # "nothing to inspect".
          if [ ! -d all-logs ] || [ -z "$(find all-logs -type f -print -quit)" ]; then
              case "${{ needs.test.result }}" in
                skipped|cancelled)
                  echo "::notice::the scenario matrix did not run (${{ needs.test.result }}) — nothing to inspect"
                  exit 0
                  ;;
              esac
              echo "::error::no scenario logs to inspect though the matrix ran (test=${{ needs.test.result }}, artifact download=${{ steps.logs.outcome }}) — the coverage floor could not be checked"
              exit 1
          fi
          strip() { sed -E 's/\x1b\[[0-9;]*m//g'; }
          compares=$(grep -rh "unified_projection_compare" all-logs/ 2>/dev/null | strip || true)
          echo "suite-wide membership comparisons:"
          if [ -n "${compares}" ]; then
              echo "${compares}" | grep -oE 'result="[a-z_]+"' | sort | uniq -c
              echo "by op kind:"
              echo "${compares}" | grep -oE 'op_kind="[a-z]+"' | sort | uniq -c
              echo "conclusive by op kind:"
              echo "${compares}" | grep -E 'result="(agree|diverged)"' \
                | grep -oE 'op_kind="[a-z]+"' | sort | uniq -c || true
          else
              echo "  (none)"
          fi
          concluded=$(echo "${compares}" | grep -cE 'result="(agree|diverged)"' || true)
          if [ "${concluded}" -eq 0 ]; then
              echo "::error::the projection gate concluded NO comparison anywhere in the suite — every divergence gate in this run passed without checking anything"
              exit 1
          fi
          echo "the gate concluded ${concluded} comparison(s) across the suite"

  comment:
    name: Report Failed Workflow
    needs: [test, auth-seam, projection-coverage]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Check if main job failed or was cancelled
        id: check_status
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.auth-seam.result }}" != "success" ] || [ "${{ needs.projection-coverage.result }}" != "success" ]; then
            echo "job_failed=true" >> $GITHUB_OUTPUT
            if [ "${{ needs.test.result }}" == "cancelled" ] || [ "${{ needs.auth-seam.result }}" == "cancelled" ] || [ "${{ needs.projection-coverage.result }}" == "cancelled" ]; then
              echo "was_cancelled=true" >> $GITHUB_OUTPUT
            else
              echo "was_cancelled=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "job_failed=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Failure Comment
        if: steps.check_status.outputs.job_failed == 'true' && steps.check_status.outputs.was_cancelled == 'false'
        run: |
          message="## E2E Rust Apps Failed

          One or more E2E workflows (scaffolding-e2e, xcall-example) failed.

          Please check the workflow logs for more details."

          jq -n \
            --arg pr '${{ github.event.number }}' \
            --arg tag e2e-rust-apps-report \
            --arg mode recreate \
            --arg message "$message" \
            '{pr: $pr, tag: $tag, mode: $mode, message: $message}' > payload.json

      - name: Upload Comment
        if: steps.check_status.outputs.job_failed == 'true' && steps.check_status.outputs.was_cancelled == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: pr-comment-payload-rust-apps
          path: payload.json

      - name: Fail if main job failed or was cancelled
        if: steps.check_status.outputs.job_failed == 'true'
        run: |
          if [ "${{ steps.check_status.outputs.was_cancelled }}" == "true" ]; then
            echo "Workflow was cancelled"
          else
            echo "Workflow failed"
          fi
          exit 1
