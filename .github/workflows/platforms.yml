name: Platforms

# macOS, off the pull-request critical path: developers on a Mac run the node in
# Docker and use `meroctl` and the app tools natively, so release.yml ships
# those for aarch64-apple-darwin (MACOS_BINARIES). This builds exactly that set
# and runs each binary:
#
#   - nightly on master, opening (or updating) an issue on failure, and on the
#     release-v2-parity release branch by the master-side dispatcher
#     (workflow_dispatch with `nightly: true`; docs: contribute/testing,
#     "Release branch"), with an issue of its own;
#   - on a PR (into master or the release-v2-parity release branch) labelled
#     `ci:platforms`, and on dispatch.
#
# There is no Windows lane: nodes run on Linux TDX hosts only.
# release.yml builds macOS from the release commit itself, so nothing reaches a
# release without having been built for it.

on:
  schedule:
    - cron: "37 2 * * *" # nightly, off the hour
  workflow_dispatch:
    inputs:
      nightly:
        description: Report the result in the nightly tracking issue, as a scheduled run does
        type: boolean
        required: false
        default: false
  pull_request:
    branches: [master, release-v2-parity]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - ".cargo/**"
      - "crates/**"
      - "tools/**"
      - ".github/workflows/platforms.yml"
      # Documentation builds nothing (scripts/tests/ci-paths-test.py).
      - "!**/*.md"
      - "!**/*.mdx"
      - "tools/calimero-abi/README.md"
      - "tools/cargo-mero/README.md"
      - "tools/cargo-mero/tests/fixtures/demo-app/GUIDE.md"
      - "tools/cargo-mero/tests/fixtures/multi-app/GUIDE.md"
      - "tools/mero-sign/README.md"

permissions:
  contents: read

# Adding an unrelated label starts a run of its own; keep it out of the code
# run's group so it cannot cancel that run, and let the gate skip it.
concurrency:
  group: platforms-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:platforms' && github.event.label.name || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No workflow-level CARGO_*/RUST* env: rust-cache hashes those into its key, and
# `build-binaries` must hash like release.yml's job of the same id to share its cache.

jobs:
  gate:
    name: Decide whether the platforms run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      macos_binaries: ${{ steps.binaries.outputs.macos }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:platforms') }}
        run: |
          run=false
          if [ "$EVENT" != pull_request ] || [ "$LABELLED" = true ]; then
            run=true
          else
            echo "::notice::macOS runs nightly on master; label the PR ci:platforms to run it here."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install PyYAML
        if: steps.decide.outputs.run == 'true'
        run: pip install --quiet pyyaml

      # Read from release.yml so the nightly builds exactly what a release ships.
      - name: Read the released binaries from release.yml
        id: binaries
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import yaml
          env = yaml.safe_load(open(".github/workflows/release.yml"))["env"]
          print("macos=" + " ".join(f"-p {b}" for b in env["MACOS_BINARIES"].split()))
          EOF
          cat "$GITHUB_OUTPUT"

  # Its cache key matches release.yml's build job, so the release build also starts warm.
  build-binaries:
    name: Release build (aarch64-apple-darwin)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Saves nothing, like release.yml's build job.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: release
          save-if: false

      - name: Build binaries
        env:
          PACKAGES: ${{ needs.gate.outputs.macos_binaries }}
        run: |
          set -euo pipefail
          test -n "$PACKAGES"
          # shellcheck disable=SC2086 # one -p per binary
          cargo build $PACKAGES --release --target aarch64-apple-darwin

      - name: Run the binaries
        run: |
          set -euo pipefail
          bin=target/aarch64-apple-darwin/release
          "$bin/meroctl" --version
          "$bin/meroctl" --help >/dev/null
          "$bin/mero-abi" --version
          # A cargo subcommand: cargo runs it as `cargo-mero mero ...`.
          "$bin/cargo-mero" mero --version

      # meroctl's attestation check, sealed channel and sessions, on the platform.
      - name: Test the client
        run: cargo test -p calimero-client -p calimero-sealed -p calimero-identity

  # A red scheduled run is otherwise read by nobody: keep one open issue for it.
  report:
    name: Report the nightly
    needs: [gate, build-binaries]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # One issue per branch: master's nightly and the release branch's.
          title="Nightly platform build is failing"
          if [ "$REF_NAME" != master ]; then
            title="$title on $REF_NAME"
          fi
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- `\(.key)`: \(.value.result)"' <<<"$NEEDS")
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$failed" ]; then
            body=$(printf 'The nightly macOS run on %s failed: %s\n\n%s\n' "$SHA" "$RUN_URL" "$failed")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Green again on $SHA: $RUN_URL"
            gh issue close "$issue"
          fi
