name: Fleet bump

# Opens (or refreshes) one pull request per consumer repository, moving its
# pinned Calimero SDK version to the release this repository just cut.
#
# All of the editing lives in .github/scripts/bump-fleet.sh, which knows nothing
# about GitHub and is runnable by hand against a local checkout:
#
#   .github/scripts/bump-fleet.sh --surface cargo --version 0.11.0-rc.26 \
#       --dir ../mero-design --no-lock --dry-run
#
# This file is only the plumbing around it: mint a token, check the consumer
# out, run the script, push a branch, open the pull request.
#
# Two things here are load-bearing and easy to undo by accident:
#
#   * The pull request is created with a GitHub App installation token, NOT with
#     GITHUB_TOKEN. A pull request opened by GITHUB_TOKEN does not trigger the
#     target repository's workflows, so every bump would arrive with no CI at
#     all and read as green because nothing ran.
#
#   * `gh pr create` is called without --base. The fleet is split between
#     `master` and `main`, and letting each repository name its own default
#     branch removes a whole category of silent failure.

on:
  workflow_call:
    inputs:
      version:
        description: "The core version consumers should pin, e.g. 0.11.0-rc.26"
        required: true
        type: string
      only:
        description: "Comma-separated subset of fleet.json repos (blank = all)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Rewrite and print the diff, but push nothing"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "The core version consumers should pin, e.g. 0.11.0-rc.26"
        required: true
        type: string
      only:
        description: "Comma-separated subset of fleet.json repos (blank = all)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Rewrite and print the diff, but push nothing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Never cancel: a cancelled run can leave a branch pushed with no pull request
# opened against it. Queue instead.
concurrency:
  group: fleet-bump-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide which repositories to touch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two surfaces move when core releases, and one repository can carry
      # either. `cargo` is a contract pinning the SDK by git tag; `tauri` is the
      # desktop app, which links no SDK but ships a merod BINARY named in
      # merod-config.json and needs its own version bumped to ship it. Emitting
      # {repo, surface} pairs keeps that a property of the fleet file rather
      # than a second copy of this job.
      - name: Select the targets
        id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          targets=$(jq -c --arg only "${ONLY:-}" '
            [ .consumers[]
              | . as $c
              | $c.surfaces[]
              | select(. == "cargo" or . == "tauri")
              | { repo: $c.repo, surface: . } ]
            | if $only == "" then .
              else
                ( $only | split(",") | map(sub("^ +";"") | sub(" +$";"")) ) as $want
                | map(select(.repo as $r | $want | index($r)))
              end
          ' .github/fleet.json)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Selected: $targets"
          if [ "$targets" = "[]" ]; then
            echo "::warning::No targets selected — check the 'only' filter against .github/fleet.json"
          fi

  bump:
    name: ${{ matrix.repo }} (${{ matrix.surface }})
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One repository failing must not stop the others from getting their
      # pull request.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Check out this repository (for the bump script)
        uses: actions/checkout@v4
        with:
          path: producer

      # Scoped to the single repository this matrix leg touches, rather than to
      # the whole fleet at once.
      - name: Mint a token for ${{ matrix.repo }}
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.token.outputs.token }}
          path: consumer

      # Needed only for `cargo generate-lockfile`. No contract is compiled here;
      # the consumer's own CI does that on the pull request. The tauri surface
      # edits three JSON files and needs no toolchain at all.
      - name: Setup Rust
        if: matrix.surface == 'cargo'
        uses: dtolnay/rust-toolchain@stable

      - name: Rewrite the pins
        id: bump
        env:
          VERSION: ${{ inputs.version }}
          SURFACE: ${{ matrix.surface }}
          CHANGED_FILES_OUT: ${{ runner.temp }}/changed.txt
        run: |
          set +e
          producer/.github/scripts/bump-fleet.sh \
            --surface "$SURFACE" --version "$VERSION" --dir consumer
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "::notice::${{ matrix.repo }}: rewritten" ;;
            3) echo "::notice::${{ matrix.repo }}: nothing here to bump for this surface — skipped" ;;
            4) echo "::notice::${{ matrix.repo }}: already on $VERSION" ;;
            *) echo "::error::${{ matrix.repo }}: bump script failed"; exit "$code" ;;
          esac

      - name: Show the diff
        if: steps.bump.outputs.code == '0'
        working-directory: consumer
        run: git --no-pager diff

      - name: Identify the app
        if: steps.bump.outputs.code == '0' && inputs.dry_run != true
        id: app
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: echo "uid=$(gh api "/users/${SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the pull request
        if: steps.bump.outputs.code == '0' && inputs.dry_run != true
        working-directory: consumer
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository_owner }}/${{ matrix.repo }}
          SLUG: ${{ steps.token.outputs.app-slug }}
          APP_UID: ${{ steps.app.outputs.uid }}
          SURFACE: ${{ matrix.surface }}
        run: |
          set -euo pipefail

          branch="chore/core-$VERSION"

          if [ "$SURFACE" = "tauri" ]; then
            title="chore: bundle merod $VERSION and cut a new desktop version"
          else
            title="chore(deps): pin the Calimero SDK to $VERSION"
          fi

          git config user.name "${SLUG}[bot]"
          git config user.email "${APP_UID}+${SLUG}[bot]@users.noreply.github.com"

          git checkout -b "$branch"

          # Only the paths the script says it changed. A package manager run as a
          # side effect writes files of its own — pnpm's minimum-release-age gate
          # creates a pnpm-workspace.yaml holding just a minimumReleaseAgeExclude
          # when the version being installed was published minutes ago. `git add -A`
          # committed that into repositories which had no workspace file, giving them
          # one with no `packages:` key and breaking their own `pnpm install`.
          git add --pathspec-from-file="$RUNNER_TEMP/changed.txt"

          leftover=$(git status --porcelain --untracked-files=all | grep -vE '^[MA] ' || true)
          if [ -n "$leftover" ]; then
            echo "::warning::the tooling left files this bump does not claim; they were NOT committed:"
            printf '%s\n' "$leftover"
          fi
          git commit \
            -m "$title" \
            -m "Generated by the fleet-bump workflow in calimero-network/core."

          # The branch name is deterministic and the branch is machine-owned, so
          # a re-run replaces it rather than opening a second pull request.
          # Do not hand-edit it: push a fix to a branch of your own instead.
          git push --force origin "$branch"

          if gh pr view "$branch" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::refreshed the existing pull request for $branch"
            gh pr view "$branch" --repo "$REPO" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Written to a file rather than a shell string: the block scalar this
          # runs inside would eat a heredoc's terminator indentation.
          if [ "$SURFACE" = "tauri" ]; then
          cat > "$RUNNER_TEMP/pr-body.md" <<PR_BODY
          Bundles merod \`$VERSION\` and cuts a new desktop version to ship it.

          The desktop app links no Calimero SDK — it ships a merod **binary**.
          \`merod-config.json\` names the version, \`src-tauri/build.rs\` embeds it as
          \`MEROD_CONFIG_VERSION\` at compile time, and the app downloads that merod at
          runtime. So a core release means two things here: bundle the new merod, and
          cut a version that ships it.

          The app version is carried in **two** files — \`apps/desktop/package.json\` and
          \`apps/desktop/src-tauri/tauri.conf.json\`, the latter being what actually
          stamps the built bundle. They have drifted apart before, so this takes the
          higher of the two, increments the patch, and writes both. If the job log
          mentions drift, this pull request also heals it.

          Opened automatically by \`fleet-bump\` in
          [calimero-network/core](https://github.com/calimero-network/core) when
          \`$VERSION\` was released.
          PR_BODY
          else
          cat > "$RUNNER_TEMP/pr-body.md" <<PR_BODY
          Moves this repository's Calimero SDK pins to \`$VERSION\`.

          Rewritten automatically by \`fleet-bump\` in
          [calimero-network/core](https://github.com/calimero-network/core) when that
          release was cut. Three things changed together, which is the point of doing
          it mechanically:

          - every \`calimero-*\` git dependency tag in \`logic/Cargo.toml\`, including
            the \`[dev-dependencies]\` copy that is easy to miss by hand
          - \`min-runtime-version\`, the floor a node checks before it will accept the
            bundle at all — it trailed the tag by a release across six repositories
            the last time this was done by hand
          - \`logic/Cargo.lock\`, so the core revision \`deploy-bundle.yml\` records on
            the published release names the right commit

          **Merging this publishes a new version of the app.** \`deploy-bundle.yml\`
          triggers on any default-branch push touching \`logic/**\`, and the registry
          publish is not idempotent — so batch this with anything else pending rather
          than merging several bumps in a row.

          Before merging, check that the contract still builds and that the ABI
          committed here still matches the rebuilt one.
          PR_BODY
          fi

          gh pr create \
            --repo "$REPO" \
            --head "$branch" \
            --title "$title" \
            --body-file "$RUNNER_TEMP/pr-body.md"

          gh pr view "$branch" --repo "$REPO" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
