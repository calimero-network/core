name: Advisories

# Known vulnerabilities in master's dependencies, checked daily and on every push
# to master that changes a lockfile. `Rust supply chain` in ci-checks.yml gates a
# pull request, but only while one is open: an advisory published against a crate
# or npm package master already locks surfaced only when the next Rust-touching
# pull request ran, and a release cut in between shipped it. This checks master
# itself, so a new advisory is seen the day it is published, patched version or not.
#
# A red run opens (or comments on) one issue, `Advisories on master`; the next green
# run closes it. Fix it by moving the lockfile past the affected range, or, when
# nothing we run reaches the vulnerable code, by an entry in deny.toml's
# `[advisories] ignore` saying why (docs: contribute/testing, "Advisories").
on:
  schedule:
    - cron: "17 5 * * *" # daily, off the hour
  push:
    branches: ["master"]
    paths:
      - Cargo.lock
      - deny.toml
      - sdks/pnpm-lock.yaml
      - .github/workflows/advisories.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust advisories (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same pin as ci-checks.yml's `Rust supply chain`, so both read deny.toml alike.
      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.19.9

      # Advisories only: bans, licenses and sources change only with the lockfile,
      # which a pull request's gate already checked. The advisory database does not.
      - name: Cargo deny (advisories)
        run: cargo deny check advisories

  js:
    name: JS advisories (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: sdks/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # The published SDKs' runtime dependencies (mero-js verifies attestation in the
      # browser, mero-react holds the session): what a user's page loads. Dev tooling
      # (`--prod` leaves it out) never reaches a user. High and critical only.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high

  report:
    name: Report
    needs: [rust, js]
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the advisories issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Advisories on master"
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "- `\(.key)`: \(.value.result)"' <<<"$NEEDS")
          issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$failed" ]; then
            body=$(printf 'A dependency master locks has a known vulnerability (%s): %s\n\n%s\n\nMove the lockfile past the affected range, or, when nothing we run reaches the vulnerable code, add it to `deny.toml`'"'"'s `[advisories] ignore` with the reason. A release cut while this is open ships it.\n' \
              "$SHA" "$RUN_URL" "$failed")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "No known vulnerability on $SHA: $RUN_URL"
            gh issue close "$issue"
          fi
