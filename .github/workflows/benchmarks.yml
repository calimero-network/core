name: Benchmarks

permissions:
  contents: read

on:
  # master keeps a nightly baseline; the release branch (release-v2-parity),
  # which has no nightly, one per push. A PR compares against its base commit's
  # baseline, or else the base branch's newest one.
  push:
    branches:
      - release-v2-parity
  schedule:
    - cron: "41 4 * * *" # nightly, off the hour
  workflow_dispatch:
  # `pull_request`, never `pull_request_target`: a fork's run gets a read-only
  # token and no secrets, and no job here runs PR code with more than that.
  pull_request:
    types: [labeled, opened, synchronize, reopened]

jobs:
  # Which crates to bench. A nightly (or dispatched) run and a push to the
  # release branch bench every crate, keeping a baseline for that commit; a PR benches only while it
  # carries the `run-benchmarks` label, then every crate too. Wall-clock benches on shared
  # runners are too noisy to gate on, so a PR opts in rather than paying for
  # them on every change. It checks out nothing.
  plan:
    name: Plan benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
    steps:
      - name: Choose the crates
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          # The PR's labels as of this event, so a push to a labelled PR benches again.
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'run-benchmarks') }}
        run: |
          # A crate's first `[[bench]]` goes here, or it gets no baseline on a push.
          all='["calimero-log","calimero-sealed"]'
          if [ "$EVENT" != pull_request ]; then
            crates="$all"
          elif [ "$ACTION" = labeled ]; then
            # Adding the label benches; adding any other label changes nothing.
            if [ "$LABEL" = run-benchmarks ]; then crates="$all"; else crates='[]'; fi
          elif [ "$LABELLED" = true ]; then
            crates="$all"
          else
            crates='[]'
          fi
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "benchmarking: $crates"

  criterion:
    name: Criterion trend (${{ matrix.crate }})
    needs: plan
    if: needs.plan.outputs.crates != '[]'
    # Timing on shared runners is too noisy to gate on; every run, baseline and
    # PR alike, benches on the same standard runner, so the comparison is fair.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.plan.outputs.crates) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Saves nothing. A cache per crate was seven entries of the repo's 10 GB
      # for jobs that never gate, and they evicted the caches that do. No other
      # group builds the bench profile (release: fat LTO, host target), so the
      # restore finds nothing and the benches build cold.
      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: bench
          save-if: false

      - name: Run benchmarks
        run: cargo bench -p "${MATRIX_CRATE}" -- --save-baseline "${SHA}"
        env:
          MATRIX_CRATE: ${{ matrix.crate }}
          SHA: ${{ github.sha }}

      - name: Upload criterion baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-${{ matrix.crate }}-${{ github.sha }}
          path: target/criterion
          retention-days: 30

  # Not criterion: one report of index size, query latency, memory and the
  # search gas fit (tools/search-bench), uploaded as markdown. Runs when the
  # criterion jobs do; its README holds the reference run.
  search-bench:
    name: Search engine bench
    needs: plan
    if: needs.plan.outputs.crates != '[]'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: bench
          save-if: false

      # The profile of the README's reference run (LTO off), set on this step
      # only, so the cache step above hashes what the criterion jobs do.
      - name: Run the search engine bench
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"
        run: cargo run --release -p search-bench -- --sizes 10000,100000 --out search-bench.md

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-bench-${{ github.sha }}
          path: search-bench.md
          retention-days: 30

  # Not criterion: calls per second and p50/p99 through a 3-node cluster in
  # one process (crates/node/benches/cluster_throughput.rs, the real
  # node and the kv component), one row per load shape, written as JSON. The
  # compare job diffs it against the base commit's.
  cluster:
    name: Cluster throughput
    needs: plan
    if: needs.plan.outputs.crates != '[]'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          shared-key: bench
          save-if: false
          # The bench builds the kv component (apps/v2-fixtures/kv) itself.
          targets: wasm32-wasip2

      # Cargo runs a bench in its package's directory, so the report is named
      # from the workspace root; a relative name landed in crates/node/ and
      # the upload below found nothing.
      - name: Run the cluster bench
        run: cargo bench -p calimero-node --bench cluster_throughput -- --secs 20 --out "$GITHUB_WORKSPACE/cluster-throughput.json"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-throughput-${{ github.sha }}
          path: cluster-throughput.json
          retention-days: 30

  # Reads only artifacts: this run's (data the PR's benches wrote, parsed by
  # critcmp, never executed) and the baseline's from a nightly or push run of the PR's
  # base branch (master, or the release branch, release-v2-parity). On a
  # fork PR the token is read-only whatever this asks for, so the comment step
  # fails and the table stays in the job log; continue-on-error keeps that from
  # failing the PR.
  compare:
    name: Compare against the base branch
    needs: [criterion, cluster]
    if: github.event_name == 'pull_request'
    continue-on-error: true
    # Downloads and diffs reports; it benches nothing, so a standard runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # actions: read is needed to download another run's artifacts
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Download this run's baselines
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: criterion-*-${{ github.sha }}
          path: target/criterion
          merge-multiple: true

      # The baseline to compare with: the base branch's run at the PR's base
      # commit if there is one (the release branch benches every push), or else
      # the base branch's newest successful nightly or push run (master benches
      # nightly). Finding none, or expired artifacts, must not fail.
      - name: Find the base branch's benchmark run
        id: base-run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          runs() {
            gh run list --repo "$REPO" --workflow benchmarks.yml --branch "$BASE_REF" \
              --status success --limit 50 --json databaseId,headSha,event "$@" \
              --jq '[.[] | select(.event != "pull_request")]'
          }
          found=$(runs --commit "$BASE_SHA" | jq -c '.[0] // empty')
          [ -n "$found" ] || found=$(runs | jq -c '.[0] // empty')
          if [ -n "$found" ]; then
            run_id=$(jq -r .databaseId <<<"$found")
            sha=$(jq -r .headSha <<<"$found")
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "comparing with benchmarks.yml run $run_id ($BASE_REF at $sha; the PR's base is $BASE_SHA)"
          else
            echo "no successful benchmarks.yml run found on $BASE_REF -- the nightly has not run since its artifacts expired (30 days), or it failed"
          fi

      # run-id plus github-token reach into a different workflow run
      - name: Download the base branch's baselines
        if: steps.base-run.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: criterion-*-${{ steps.base-run.outputs.sha }}
          path: target/criterion
          merge-multiple: true
          run-id: ${{ steps.base-run.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      # The cluster bench's JSON, this run's and the base commit's, beside the
      # criterion baselines (data only; read by the comparison below).
      - name: Download this run's cluster report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-throughput-${{ github.sha }}
          path: cluster/head
        continue-on-error: true

      - name: Download the base branch's cluster report
        if: steps.base-run.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cluster-throughput-${{ steps.base-run.outputs.sha }}
          path: cluster/base
          run-id: ${{ steps.base-run.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Install critcmp
        run: cargo install critcmp --version 0.1.8 --locked

      - name: Compare
        run: |
          if [ -z "${BASE_RUN_ID}" ]; then
            echo "no comparison: no benchmarks.yml run found on $BASE_REF (see the 'Find the base branch's benchmark run' step log)" > /tmp/critcmp.txt
          elif ! find target/criterion -type d -name "$BASE_SHA" -print -quit | grep -q .; then
            echo "no comparison: found benchmarks.yml run ${BASE_RUN_ID} for the base commit, but its baseline artifacts did not download (expired past 30-day retention, or the download step failed -- see its log)" > /tmp/critcmp.txt
          elif critcmp "$BASE_SHA" "$HEAD_SHA" > /tmp/critcmp.txt 2>&1; then
            :
          else
            echo "no comparison: baselines downloaded for both commits but critcmp found nothing to diff" > /tmp/critcmp.txt
          fi
          cat /tmp/critcmp.txt
        env:
          BASE_RUN_ID: ${{ steps.base-run.outputs.run_id }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ steps.base-run.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}

      - name: Compare the cluster bench
        run: |
          python3 - <<'PY' | tee -a /tmp/critcmp.txt
          import json, pathlib
          def load(side):
              path = pathlib.Path("cluster", side, "cluster-throughput.json")
              return json.loads(path.read_text()) if path.is_file() else None
          head, base = load("head"), load("base")
          print("\n### Cluster throughput (calls/s, p50 / p99 ms)\n")
          if head is None:
              print("no cluster report for this commit (see the `Cluster throughput` job log)")
              raise SystemExit
          rows = {r["name"]: r for r in (base or {}).get("rows", [])}
          print("| scenario | base calls/s | this calls/s | change | this p50 / p99 |")
          print("|---|---|---|---|---|")
          for r in head["rows"]:
              b = rows.get(r["name"])
              was = f'{b["callsPerSecond"]:.1f}' if b else "-"
              change = f'{(r["callsPerSecond"] / b["callsPerSecond"] - 1) * 100:+.0f}%' if b and b["callsPerSecond"] else "-"
              print(f'| {r["name"]} | {was} | {r["callsPerSecond"]:.1f} | {change} | {r["p50Ms"]:.1f} / {r["p99Ms"]:.1f} 