name: Benchmarks

permissions:
  contents: read

on:
  push:
    branches:
      - master
  # `pull_request`, never `pull_request_target`: a fork's run gets a read-only
  # token and no secrets, and no job here runs PR code with more than that.
  pull_request:
    types: [labeled, opened, synchronize, reopened]

jobs:
  # Which crates to bench. A push to master and the `run-benchmarks` label get
  # every crate; a PR touching the storage stack gets the storage benches
  # without the label; anything else gets none. It reads the PR's file list
  # through the API and checks out nothing.
  plan:
    name: Plan benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
    steps:
      - name: Choose the crates
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A crate's first `[[bench]]` goes here, or it gets no master baseline.
          all='["storage-cost","calimero-storage","calimero-store","calimero-blobstore","calimero-crypto","calimero-runtime","calimero-dag"]'
          storage='["storage-cost","calimero-storage","calimero-store"]'
          if [ "$EVENT" = push ] || [ "$LABEL" = run-benchmarks ]; then
            crates="$all"
          elif [ "$ACTION" = labeled ]; then
            # Another label: the opened/synchronize run already covered it.
            crates='[]'
          else
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
            if printf '%s\n' "$files" | grep -qE '^crates/(storage|prelude|store)/'; then
              crates="$storage"
            else
              crates='[]'
            fi
          fi
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "benchmarking: $crates"

  criterion:
    name: Criterion trend (${{ matrix.crate }})
    needs: plan
    if: needs.plan.outputs.crates != '[]'
    # timing on shared runners is too noisy to gate on
    continue-on-error: true
    runs-on: ubuntu-24.04-8cpu
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.plan.outputs.crates) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust CI
        uses: ./.github/actions/setup-rust-ci
        with:
          toolchain: stable
          shared-key: bench-${{ matrix.crate }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run benchmarks
        run: cargo bench -p ${{ matrix.crate }} -- --save-baseline ${{ github.sha }}

      - name: Upload criterion baseline
        uses: actions/upload-artifact@v7
        with:
          name: criterion-${{ matrix.crate }}-${{ github.sha }}
          path: target/criterion
          retention-days: 30

  # Reads only artifacts: this run's (data the PR's benches wrote, parsed by
  # critcmp, never executed) and the base commit's from a master push run. On a
  # fork PR the token is read-only whatever this asks for, so the comment step
  # fails and the table stays in the job log; continue-on-error keeps that from
  # failing the PR.
  compare:
    name: Compare against master
    needs: criterion
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-24.04-8cpu
    # actions: read is needed to download another run's artifacts
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Download this run's baselines
        uses: actions/download-artifact@v8
        with:
          pattern: criterion-*-${{ github.sha }}
          path: target/criterion
          merge-multiple: true

      # A base commit with no run, or with expired artifacts, must not fail.
      - name: Find master's benchmark run
        id: master-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow benchmarks.yml \
            --event push \
            --commit "${{ github.event.pull_request.base.sha }}" \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -n "$run_id" ]; then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "found benchmarks.yml run $run_id for base commit ${{ github.event.pull_request.base.sha }}"
          else
            echo "no successful benchmarks.yml run found for base commit ${{ github.event.pull_request.base.sha }} -- it predates this workflow, or its run failed, or (past 30 days) its artifacts have expired"
          fi

      # run-id plus github-token reach into a different workflow run
      - name: Download master's baselines
        if: steps.master-run.outputs.run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: criterion-*-${{ github.event.pull_request.base.sha }}
          path: target/criterion
          merge-multiple: true
          run-id: ${{ steps.master-run.outputs.run_id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Install critcmp
        run: cargo install critcmp --version 0.1.8 --locked

      - name: Compare
        run: |
          if [ -z "${{ steps.master-run.outputs.run_id }}" ]; then
            echo "no comparison: no benchmarks.yml run found for base commit ${{ github.event.pull_request.base.sha }} (see the 'Find master's benchmark run' step log)" > /tmp/critcmp.txt
          elif ! find target/criterion -type d -name "${{ github.event.pull_request.base.sha }}" -print -quit | grep -q .; then
            echo "no comparison: found benchmarks.yml run ${{ steps.master-run.outputs.run_id }} for the base commit, but its baseline artifacts did not download (expired past 30-day retention, or the download step failed -- see its log)" > /tmp/critcmp.txt
          elif critcmp ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > /tmp/critcmp.txt 2>&1; then
            :
          else
            echo "no comparison: baselines downloaded for both commits but critcmp found nothing to diff" > /tmp/critcmp.txt
          fi
          cat /tmp/critcmp.txt

      - name: Post the comparison
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          file-path: /tmp/critcmp.txt
          comment-tag: criterion-comparison
