name: Docs CI

# Build the Starlight docs site and validate internal links on every PR that
# touches it, so the docs can't silently break. Content-only; no deploy.
on:
  pull_request:
    paths: ['docs/**']
  push:
    branches: [master]
    paths: ['docs/**']

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run check   # astro build + internal link check
